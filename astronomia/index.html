    if (parts.on[k] && parts.src[k] === e.id) { m += parts.m[k]; killParticle(k); }
  }
  return m;
}

/** What a given amount of collapsing gas would turn into. */
const BROWN_DWARF_MIN = 13 * 317.8;      // 13 Jupiters, where deuterium burns

function cloudForecast(mass) {
  if (mass >= IGNITE_MASS) {
    const mSun = mass / M_SUN;
    const kind = mSun > 8 ? 'blue giant' : mSun > 0.5 ? 'Sun-like star' : 'red dwarf';
    return fmtMass(mass) + ' is enough. Hydrogen ignites and it becomes a ' + kind +
      '. The leftover couple of percent flattens into a disc around it — no planets yet: ' +
      'the disc has to build them, and it will, one at a time, for as long as it lasts.';
  }
  if (mass >= BROWN_DWARF_MIN) {
    return 'Only ' + fmtMass(mass) + '. Below 0.075 M☉ — about eighty Jupiters — hydrogen never ' +
      'catches, and you get a brown dwarf that shines on its own contraction and then slowly fades.';
  }
  return 'Only ' + fmtMass(mass) + ' left. Far too little to light anything; this would settle ' +
    'into a cold lump wrapped in a disc, which will still go on making worlds — with nothing ' +
    'at the centre to warm them.';
}

function discPlanetType(mass, insideIce) {
  if (mass >= 60) return Math.random() < 0.3 ? 'ringed_giant' : 'gas_giant';
  if (mass >= 8) return 'ice_giant';
  if (insideIce) {
    if (mass >= 2.5) return 'super_earth';
    if (mass >= 0.6) return pick(['terrestrial', 'desert_world', 'lava_world']);
    if (mass >= 0.2) return pick(['desert_world', 'moon']);
    return pick(['moon', 'dwarf_planet']);
  }
  if (mass >= 1.2) return pick(['ocean_world', 'ice_world']);
  return pick(['ice_world', 'dwarf_planet']);
}

/**
 * Collapse the cloud into a young star and the disc it was born inside.
 *
 * Mass and momentum both come straight out of the grains, so what appears
 * weighs exactly what the cloud weighed and drifts exactly as it was drifting.
 * Nothing arrives finished, though: a real collapse makes a star and a flat
 * disc, and the planets are built out of that disc over the millions of years
 * that follow. The disc turns in the plane the cloud was already rotating in —
 * that is why every planet in a real system goes round the same way, in nearly
 * the same plane. They inherit the collapsing cloud's angular momentum.
 */
function condenseCloud(e) {
  const c = e.cloud;
  if (!c || c.mass <= 0 || c.n < 3) { toast('There is nothing left of this cloud to collapse'); return false; }
  if (freeSlots() < 1) { toast('Universe is full — clear some bodies first'); return false; }

  const M = c.mass;
  const centre = new THREE.Vector3(c.cx, c.cy, c.cz);
  const drift = new THREE.Vector3(c.vx, c.vy, c.vz);

  // A protoplanetary disc is only a percent or so of the star; ours had a few
  // hundred Earth masses of solid material in it. This is the most the cloud
  // will let leave the star, and all of it goes into the disc.
  const discCap = Math.min(Math.max(M * 0.02, 0), 800);
  const guess = Math.max(M - discCap, 0);
  const canIgnite = guess >= IGNITE_MASS;
  const mSun = guess / M_SUN;
  const coreType = canIgnite
    ? (mSun > 8 ? 'blue_giant' : mSun > 0.5 ? 'sun_like' : 'red_dwarf')
    : discPlanetType(guess, true);

  // How wide the disc is depends on how bright the star will be, so work that
  // out before anything is created. The guess is within a couple of percent of
  // the final mass, which moves the snow line by far less than the jitter does.
  const L = Math.max(luminosityOf(coreType, trueRadius(coreType, guess)), 1e-4);

  // Never starve the star below the ignition mass its type was chosen for.
  let discM = discCap;
  if (canIgnite) discM = Math.min(discM, Math.max(0, M - IGNITE_MASS * 1.02));

  const star = makeBody(coreType, centre, drift, { mass: M - discM, name: 'New ' + e.origin });

  // The disc's pole is the cloud's own spin axis. Without one there is no
  // preferred direction and it has to fall back on the horizontal.
  const normal = new THREE.Vector3(c.lx, c.ly, c.lz);
  if (normal.lengthSq() < 1e-24) normal.set(0, 1, 0); else normal.normalize();

  /* The disc: real material, in the real plane, and the only place this
     system's planets are going to come from. Every world it condenses is paid
     for out of it, so one that has made a Jupiter has that much less left for
     everything further out. Ours reached from inside Mercury's orbit out past
     where the Kuiper belt is now, and it is scaled off the star's brightness
     because a hotter star pushes its snow line further out. */
  if (discM > 0.02) {
    const sq = Math.sqrt(Math.max(L, 0.02));
    const rIn = Math.max(visRadius(star) * 3, 0.28 * AU * sq);
    const rOut = Math.max(rIn * 6, 34 * AU * sq);
    makeDisc(star, { rIn: rIn, rOut: rOut, mass: discM, axis: normal });
  }

  // The grains are spent; the star and its disc are what they became.
  disperseCloud(e);

  /* No momentum correction to make. The star was handed the cloud's own drift
     and the disc rides along with it, so between them they carry exactly what
     the cloud was carrying: drift x (M - discM) + drift x discM. */

  fx.form(star, true);
  e.alive = false;
  disposeSN(e);
  const idx = supernovae.indexOf(e);
  if (idx >= 0) supernovae.splice(idx, 1);

  computeAccel();
  refreshStarCache();
  updateTemperatures();
  // Pull back far enough to show what was just built. The camera was zoomed
  // right in on a collapsing knot; the disc it became is a thousand times wider.
  view.target.copy(centre);
  const span = star.disc ? star.disc.rOut * 2.2 : visRadius(star) * 12;
  if (span > 0) view.dist = clamp(span, MIN_DIST, MAX_DIST);
  sim.follow = null;
  select(star);
  toast(canIgnite
    ? star.name + ' ignited from the cloud' +
      (star.disc ? ', wrapped in the disc its planets will come out of' : '')
    : star.name + ' collapsed but never lit — too little mass to start fusion' +
      (star.disc ? ', but its disc will still build worlds' : ''));
  return true;
}

function updateSupernovae(simDt) {
  refreshClouds();
  brakeClouds(simDt);
  for (let i = supernovae.length - 1; i >= 0; i--) {
    const e = supernovae[i];
    e.age += simDt;
    e.p.addScaledVector(e.v, simDt);
    e.radius += e.vShock * simDt;
    if (snSet.blast) snSweep(e);

    e.lum = snLuminosity(e);
    if (e.lum > e.peak) e.peak = e.lum;

    // Left alone the core temperature just follows the cooling photosphere; once
    // the player takes hold of the slider it is theirs.
    if (!e.held) e.coreT = snPhotoT(e.age);
    const c = kelvinToRGB(e.coreT);
    e.lightColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);

    // Past its bright weeks the interesting number is not how much it shines but
    // how much matter is still there to build something out of.
    e.name = e.lum > 100
      ? e.label + ' · ' + fmtLum(e.lum)
      : e.label + ' remnant · ' + fmtMass(e.m);

    updateSNVisual(e);
    // The light fades in months; the cloud itself lasts as long as it has grains,
    // so it stays there to be selected and squeezed long after it goes dark.
    if (e.age > e.life && (!e.cloud || e.cloud.n === 0)) {
      e.alive = false;
      disposeSN(e);
      supernovae.splice(i, 1);
    }
  }
}

/* ---------------------------------------------------------- remnant visuals */

const SN_VERT = `
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vN = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vV = -mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const SN_FRAG = `
  uniform vec3 uInner;
  uniform vec3 uOuter;
  uniform float uOp;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    // Limb brightening. The ejecta is a thin skin, so a sightline near the edge
    // passes through far more of it than one straight through the middle —
    // which is why real remnants look like rings rather than filled discs.
    float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(clamp(f, 0.0, 1.0), 3.0);
    gl_FragColor = vec4(mix(uInner, uOuter, clamp(f, 0.0, 1.0)) * (rim * 2.2 + 0.03) * uOp, 1.0);
  }`;

/* Nebulosity. Sized in *world* units rather than screen pixels, so flying
   towards a remnant brings you into a cloud that grows around you instead of a
   swarm of dots that stay the same size however close you get. */
const NEB_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uScale;
  uniform float uFocal;
  varying vec3 vCol;
  void main() {
    vCol = aCol;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = clamp(aSize * uScale * uFocal / max(-mv.z, 1e-6), 2.0, 460.0);
  }`;

const NEB_FRAG = `
  uniform sampler2D uMap;
  uniform float uOp;
  varying vec3 vCol;
  void main() {
    gl_FragColor = vec4(vCol, texture2D(uMap, gl_PointCoord).a * uOp);
  }`;

/**
 * The remnant as a cloud rather than a bubble.
 *
 * Puffs are scattered through a whole volume, not over a shell, so it has an
 * inside as well as an outside — and a lumpy noise field rejects a good share
 * of them so the result is ragged instead of a tidy ball.
 *
 * The colours are deliberately deep and saturated. Additive blending climbs
 * towards white wherever puffs overlap, so any colour that starts out pale is
 * bleached away exactly where the cloud is thickest and most interesting.
 * Starting deep buys several layers of overlap before the hue washes out.
 */
function nebulaCloud(variant, n, blue) {
  const key = 'neb:' + variant + ':' + n + (blue ? ':b' : '');
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const lump = fbm(hashStr('lump' + variant), 4, 2, 4);
  const hue = fbm(hashStr('hue' + variant), 3, 2, 3);

  /* A kilonova's debris is a different beast from a supernova's: far hotter to
     begin with and stuffed with freshly built heavy elements, so it starts out
     a fierce electric blue instead of the gold and rose of an ordinary remnant. */
  const GOLD = blue ? [0.30, 0.80, 1.00] : [1.00, 0.60, 0.16];
  const EMBER = blue ? [0.10, 0.36, 1.00] : [1.00, 0.28, 0.06];
  const ROSE = blue ? [0.55, 0.42, 1.00] : [0.98, 0.20, 0.55];
  const AZURE = blue ? [0.72, 0.94, 1.00] : [0.35, 0.62, 1.00];

  const pos = [], col = [], siz = [];
  let guard = 0;
  while (siz.length < n && guard++ < n * 40) {
    const z = rng() * 2 - 1, ph = rng() * TAU, s = Math.sqrt(Math.max(0, 1 - z * z));
    const dx = s * Math.cos(ph), dy = s * Math.sin(ph), dz = z;
    const u = ((Math.atan2(dy, dx) / TAU) + 1) % 1;
    const v = Math.acos(clamp(dz, -1, 1)) / Math.PI;

    const lb = clamp(lump(u, v) * 1.9 - 0.5, 0, 1);
    if (rng() > 0.08 + lb * 1.15) continue;   // leave gaps, or it is just a ball

    /* A hollow, lumpy shell rather than a filled ball. This is what a remnant
       physically is — the blast sweeps the middle empty — and it also fixes the
       worst artefact of additive blending: a filled ball has its longest
       sightline dead centre, so the middle always clips to white and the whole
       thing bands into a bullseye. With the centre empty there is no such peak. */
    const r = (0.42 + Math.pow(rng(), 0.75) * 0.58) * (0.72 + lb * 0.5);
    // Break the radial regularity so the shell never reads as a smooth surface.
    const off = () => (rng() - 0.5) * 0.16;
    pos.push(dx * r + off(), dy * r + off(), dz * r + off());

    const h = clamp(hue(u, v) * 1.6 - 0.3, 0, 1);
    let c = h < 0.5 ? mix(EMBER, GOLD, h * 2) : mix(GOLD, ROSE, (h - 0.5) * 2);
    // The inner face of the shell is still being lit from inside, so it runs
    // hot and blue; the outer edge has cooled to red.
    c = mix(c, AZURE, clamp(1.5 - r * 1.9, 0, 1) * 0.75);
    const j = 0.80 + rng() * 0.4;
    col.push(c[0] * j, c[1] * j, c[2] * j);
    // Big enough to overlap heavily. Small puffs stay visibly separate and the
    // result reads as scattered confetti; only once they run into each other do
    // they stop being blobs and start being cloud.
    siz.push(0.165 + Math.pow(rng(), 2) * 0.45);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildSNVisual(e) {
  const g = new THREE.Group();

  const shell = new THREE.Mesh(SPHERE, new THREE.ShaderMaterial({
    uniforms: {
      uInner: { value: new THREE.Color(1, 0.45, 0.24) },
      uOuter: { value: new THREE.Color(0.62, 0.8, 1) },
      uOp: { value: 1 }
    },
    vertexShader: SN_VERT, fragmentShader: SN_FRAG,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  }));
  shell.renderOrder = 4;
  g.add(shell);

  const neb = new THREE.Points(nebulaCloud((e.id || 1) % 4, 700, e.flavour === 'kilo'), new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: TEX_PUFF }, uOp: { value: 0 },
      uScale: { value: 1 }, uFocal: { value: 1 }
    },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  neb.frustumCulled = false;
  neb.renderOrder = 3;
  g.add(neb);

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_HALO, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  core.renderOrder = 8;
  g.add(core);

  const boom = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  boom.renderOrder = 9;
  g.add(boom);

  scene.add(g);
  e.obj = g; e.shell = shell; e.neb = neb; e.core = core; e.boom = boom;
}

function updateSNVisual(e) {
  if (!e.obj) return;
  e.obj.position.copy(e.p);
  const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));

  // The glow fades over months, but never quite to nothing while there is still
  // gas here — the cloud has to stay findable to be worth selecting.
  const alive = e.cloud && e.cloud.n > 0;
  const fade = Math.max(clamp(Math.exp(-e.age / 90), 0, 1), alive ? 0.12 : 0);
  const big = e.radius / wpp > 3;

  // For the first couple of weeks the ejecta really is dense and opaque, and a
  // smooth expanding surface is the honest picture. After that it thins out and
  // becomes cloud, so the fireball is handed over completely — a translucent
  // sphere that outstays its welcome is what made this look like a soap bubble.
  const puff = clamp((e.age - 10) / 40, 0, 1);
  const skin = (1 - puff) * fade;
  e.shell.scale.setScalar(Math.max(e.radius, 1e-6));
  e.shell.material.uniforms.uOp.value = skin * 0.85 * SN_GLOW;
  e.shell.material.uniforms.uInner.value.copy(e.lightColor);
  e.shell.visible = skin > 0.012 && big;

  if (e.neb) {
    const u = e.neb.material.uniforms;
    // Sized to the debris that is actually out there (e.r, set by refreshClouds
    // from the real grain positions), not to the fireball shell — the ejecta
    // outruns the shell by half again, so scaling to e.radius leaves the cloud
    // as a small blob sitting in the middle of its own wreckage.
    const R = Math.max(e.r || 0, e.radius, 1e-6);
    // The puff positions are unit-scale, so the object carries the size. uScale
    // then makes each puff's *width* grow with it — the uniform alone only ever
    // resized the dots, which left the whole cloud a one-gigametre speck.
    e.neb.scale.setScalar(R);
    u.uScale.value = R;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Each puff contributes very little on purpose. Dozens of them stack up
    // along any one sightline and additive blending saturates to flat white
    // fast, so the cloud has to be built from many faint layers rather than a
    // few strong ones — otherwise the colour is lost exactly where it matters.
    u.uOp.value = puff * Math.max(fade, 0.16) * 0.16 * SN_GLOW;
    e.neb.visible = puff > 0.01 && big;
  }

  // The glowing photosphere, as bright as the light curve says — with a pixel
  // floor, because the brightest thing in the sky should never be invisible.
  const lit = e.peak > 0 ? Math.pow(clamp(e.lum / e.peak, 0, 1), 0.4) : 0;
  e.core.visible = lit > 0.012;
  if (e.core.visible) {
    // Opacity is already almost solid, so the only room left to make the flash
    // brighter is to widen it — a source three times as luminous covers about
    // sqrt(3) times the radius.
    const wide = Math.sqrt(SN_GLOW);
    e.core.scale.setScalar(Math.max(e.radius * 0.5, 26 * wpp) * (0.35 + lit * 0.95) * wide);
    e.core.material.color.copy(e.lightColor);
    e.core.material.opacity = Math.min(1, lit * 0.95 * SN_GLOW);
  }

  const bo = clamp(1 - e.age / 1.2, 0, 1);
  e.boom.visible = bo > 0.012;
  if (e.boom.visible) {
    e.boom.material.opacity = Math.min(1, bo * bo * SN_GLOW);
    e.boom.scale.setScalar(Math.max(e.radius * 2.2, 90 * wpp) * (0.5 + (1 - bo) * 2.4) * Math.sqrt(SN_GLOW));
  }
}

function disposeSN(e) {
  if (!e.obj) return;
  scene.remove(e.obj);
  e.obj.traverse(o => { if (o.material) o.material.dispose(); });
  e.obj = null; e.shell = null; e.neb = null; e.core = null; e.boom = null;
}


function clearSupernovae() {
  for (const e of supernovae) { e.alive = false; disposeSN(e); }
  supernovae.length = 0;
}

/* ------------------------------------------------------------ growing old  */

/**
 * Burn fuel. Real stars take millions of years to do this, so the whole thing
 * is off unless you ask for it and runs at whatever multiple of real time you
 * pick — that multiplier is the only unphysical number in here.
 */
/**
 * How much wider a star is than when it was born, at a given fraction of its
 * lifetime. A star swells slowly through most of its life — the Sun is about a
 * third wider now than it started — and then balloons in the last fifth as it
 * leaves the main sequence for the giant branch.
 */
const ageGrowth = (f) => 1 + 0.6 * f + 14 * Math.pow(clamp((f - 0.8) / 0.2, 0, 1), 2);

/* Aging never pushes a star across the black-dwarf ceiling (see STAR_BANDS):
   growing old is not the same as being swollen past the limit, and a star that
   ages should die the way its mass says it dies. */
const AGE_R_CAP = 0.95 * BLACK_DWARF_R * R_SUN * R_EARTH;

/** Grow and cool a star to match how far through its life it is. */
function ageSwell(b) {
  const f = clamp(b.age / msLifetime(b.m / M_SUN), 0, 1);
  // Already a giant when it was placed: only a gentle further swell
  let want = b.everSmall ? ageGrowth(f) : 1 + 0.3 * f;
  // A star that has just become a different kind of star starts its life over
  const fresh = b.ageGrowType !== b.type;
  const had = fresh ? 1 : (b.ageGrow || 1);
  const hadCool = fresh ? 1 : (b.ageCool || 1);
  if (fresh) b.bornHot = b.temp >= HOT_STAR_T && !TYPES[b.type].stripped;
  b.ageGrowType = b.type;
  /* A star born hot — a blue giant — does what real massive stars do at the end
     and cools into a red supergiant over its last stretch. A Wolf–Rayet has
     already lost the envelope that would swell and redden, so it stays blue. */
  const cool = b.bornHot ? 1 - 0.6 * smoothstep(clamp((f - 0.85) / 0.15, 0, 1)) : 1;
  // Applied as a ratio to whatever radius the star has now, so a width set by
  // hand in CUSTOMISE is grown from rather than thrown away
  let r = b.r * want / had;
  if (b.everSmall && r > AGE_R_CAP && b.r <= AGE_R_CAP) { r = AGE_R_CAP; want = had * r / b.r; }
  if (!(r > 0) || (Math.abs(want - had) < 1e-4 && Math.abs(cool - hadCool) < 1e-4)) return;
  // As it swells its surface cools at about the same luminosity (L ∝ R²T⁴)
  b.temp *= Math.sqrt(had / want) * (cool / hadCool);
  b.r = r;
  b.ageGrow = want;
  b.ageCool = cool;
  const nat = trueRadius(b.type, b.m);
  if (nat > 0) b.rFactor = b.r / nat;
  updateLuminosity(b);
  scaleVisual(b);
}

function ageStars(dt) {
  const boost = Math.pow(10, snSet.ageRate);
  let dying = null;
  for (const b of sim.bodies) {
    if (b.kind !== 'body') continue;
    const def = TYPES[b.type];
    if (!def.star || def.brown || def.surf === 'neutron' || def.surf === 'dwarfstar') continue;
    b.age += dt * boost;
    if (def.surf === 'star' && !def.dead) ageSwell(b);
    if (b.age >= msLifetime(b.m / M_SUN)) (dying || (dying = [])).push(b);
  }
  if (!dying) return;
  for (const b of dying) {
    if (!b.alive) continue;
    const name = b.name;
    if (b.m / M_SUN >= snSet.ccMass && snSet.on) {
      const p = goSupernova(b);
      toast(p ? name + ' ran out of fuel and went ' + p.label + '!' : name + ' burned out');
    } else {
      shedEnvelope(b);
    }
  }
}

/**
 * A star too light to collapse a core ends far more gently, but just as
 * finally: it swells up, coughs its outer layers off at about 20 km/s as a
 * planetary nebula, and leaves its naked carbon–oxygen core behind as a white
 * dwarf. How much core is left follows the observed initial-final mass
 * relation (Kalirai et al. 2008), M_wd ≈ 0.109·M + 0.394 M☉ — so the Sun will
 * end up as roughly half a solar mass of slowly cooling crystal.
 */
function shedEnvelope(b) {
  const mSun = b.m / M_SUN;
  const wd = Math.min(clamp(0.109 * mSun + 0.394, 0.17, 1.38) * M_SUN, b.m);
  const env = b.m - wd;
  const name = b.name;
  const oldR = Math.max(visRadius(b), 1e-9);

  if (env > 0) {
    const n = Math.min(420, parts.free.length);
    if (n > 3) {
      // The envelope leaves from the swollen red-giant surface, out around an
      // AU, not from where the main-sequence star's photosphere used to be.
      // Real nebulae drift off at 20–40 km/s, but they are pushed by radiation
      // pressure over thousands of years rather than thrown; a purely ballistic
      // launch has to clear the local escape speed or it just rains back down.
      const rAGB = Math.max(1.2 * AU, oldR * 1.5);
      const vEsc = Math.sqrt(2 * G * settings.gravity * b.m / rAGB);
      blastShell(b.p, b.v, n, env, {
        vMean: Math.max(20 * KMS, vEsc * 1.35), r0: rAGB, coolDays: 400,
        hot: [150, 255, 226], cool: [255, 126, 178], sizeMin: 1.4, sizeMax: 5.5
      });
    }
  }

  b.m = wd;
  b.type = 'white_dwarf';
  b.kind = 'body';
  b.age = 0;
  // A freshly exposed core is ferociously hot; it has nothing left to burn and
  // will spend the rest of the universe's life cooling off.
  b.temp = 60000;
  b.spin = TYPES.white_dwarf.spin;
  b.rFactor = 1;
  b.r = trueRadius('white_dwarf', wd);
  updateLuminosity(b);
  refreshVisual(b);
  fx.flash(b.p, oldR * 30, [170, 255, 230], 0.8);
  toast(name + ' shed its envelope and became a white dwarf');
}

/* ============================================================ tidal forces  */

/**
 * Inside the fluid Roche limit a satellite can't hold itself together against
 * the tide, and it spreads into a ring of rubble. This is why Saturn has rings
 * and why Roche's limit matters at all.
 */
/**
 * Fluid Roche limit for satellite `s` around primary `P`.
 *
 * Deliberately computed from TRUE radii, not the exaggerated drawn ones — using
 * drawn radii would scale the limit up with them and shred genuine moons like
 * Io. The floor keeps the zone just outside whatever is actually on screen, so
 * the effect stays visible when bodies are drawn larger than life.
 */
function rocheLimit(P, s) {
  const rP = P.r, rS = s.r;
  const densRatio = (P.m / (rP * rP * rP)) / (s.m / (rS * rS * rS));
  return Math.max(
    2.44 * rP * Math.cbrt(densRatio),
    (visRadius(P) + visRadius(s)) * 1.5
  );
}

/*
 * Crossing the Roche limit is not a switch, it is a process — which is exactly
 * what you watch happen to a comet falling into Jupiter. So a body inside the
 * limit does two things at once, both of them harder the deeper in it is:
 *
 *   1. It is STRIPPED. The tide lifts material off the side facing the primary
 *      and off the far side too, and that material goes straight into orbit as
 *      ring dust. The body genuinely loses the mass — it is handed to real
 *      particles, so nothing is created or destroyed.
 *
 *   2. It HEATS UP inside. The tide kneads it, the flexing turns into heat, and
 *      the inside gets hotter the whole time it stays there. This is why Io has
 *      four hundred volcanoes and why Europa has an ocean under its ice.
 *
 * Only once it has lost most of itself — or falls right to the bottom of the
 * limit — does it finally come apart into fragments.
 */

const STRIP_SHARE = 0.55;    // fraction of its own mass a body can shed before it breaks up
const TIDE_T_MAX = 32000;    // K — how hot tidal kneading alone can drive a core
const TIDE_COOL = 0.006;     // per day, how fast the extra heat leaks away again

/** How deep inside the Roche limit a satellite is: 0 at the edge, 1 at the surface. */
function tideStress(P, s, d, roche) {
  const touch = visRadius(P) + visRadius(s);
  if (d >= roche) return 0;
  const span = Math.max(roche - touch, 1e-9);
  return clamp((roche - d) / span, 0, 1);
}

function updateTides(dt) {
  const bs = sim.bodies;
  let doomed = null, doomedP = null, doomedD = 0;

  for (let i = 0; i < bs.length; i++) {
    const s = bs[i];
    if (!s.alive || s.kind !== 'body') continue;
    const sdef = TYPES[s.type];
    // Stars and anything genuinely massive hold themselves together by their
    // own gravity far better than a moon does; rubble has already been shredded.
    const immune = sdef.star || s.m > 40 || s.disrupted || !!s.sink;

    // Find the primary raising the biggest tide on this body.
    let best = null, bestX = 0, bestD = 0;
    for (let j = 0; j < bs.length; j++) {
      const P = bs[j];
      if (P === s || !P.alive || P.m < s.m * 12) continue;
      const d = s.p.distanceTo(P.p);
      const roche = rocheLimit(P, s);
      if (d >= roche) continue;
      const x = tideStress(P, s, d, roche);
      if (x > bestX) { bestX = x; best = P; bestD = d; }
    }

    s.tideX = bestX;
    s.tidePrimary = best;

    /* ---- heat. Applies to everything, immune or not: a star being squeezed by
       a black hole is not exempt from being kneaded, it just does not crumble. */
    if (settings.tideHeat && bestX > 0) {
      const ceiling = Math.max(baseCoreT(sdef, s.m), TIDE_T_MAX * Math.pow(bestX, 1.4));
      // Approach the ceiling rather than climbing forever — the hotter it gets,
      // the faster it radiates the difference back out.
      s.coreT += (ceiling - s.coreT) * clamp(0.05 * bestX * dt, 0, 0.6);
    }

    if (!best || immune || !settings.strip) continue;

    /* ---- strip. Nothing at all right at the edge, everything at the bottom. */
    const rate = 0.045 * settings.stripRate * Math.pow(bestX, 2.2);
    const loss = Math.min(s.m * rate * dt, s.m * 0.4);
    if (loss > 0) {
      s.m -= loss;
      s.stripped += loss;
      s.stripPending += loss;
      s.r = natRadius(s);
      scaleVisual(s);
      // Release the dust in bursts rather than one grain per step, so a handful
      // of particles carries a visible amount of matter instead of nothing.
      if (s.stripPending > s.m0 * 0.02) {
        const put = ringEjecta(s.p, s.v, best, 40, s.stripPending, 0.10,
          [255, 228, 196], [150, 138, 128]);
        s.stripPending -= put;
        if (!s.stripToast) {
          s.stripToast = 1;
          toast(s.name + ' is being torn at by ' + best.name + '’s tides');
        }
      }
    }

    // Down to a stub, or right down on the primary: it finally comes apart.
    if (s.stripped >= s.m0 * STRIP_SHARE || bestX > 0.97) {
      if (!doomed) { doomed = s; doomedP = best; doomedD = bestD; }
    }
  }

  // One break-up per step is plenty — each one spends particles and body slots.
  if (doomed) tidalDisrupt(doomed, doomedP, doomedD);
}

function tidalDisrupt(s, P, d) {
  const frags = Math.min(clamp(Math.round(7 + Math.random() * 7), 6, 14), freeSlots());
  if (frags < 3) return;                       // no room: leave the moon intact

  // Most of a shredded moon becomes ring material, laid onto its own orbit.
  const dust = ringEjecta(s.p, s.v, P, 560, s.m * 0.55, 0.4, [232, 240, 255], [126, 122, 116]);
  const each = (s.m - dust) / frags;
  const orbitDir = s.v.clone().sub(P.v);
  const speed = orbitDir.length();
  const made = [];
  for (let i = 0; i < frags; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    // spread the fragments along the orbit so they stretch into an arc
    const along = (i / frags - 0.5) * 0.6;
    const radial = s.p.clone().sub(P.p).normalize();
    const tang = orbitDir.clone().normalize();
    const pos = s.p.clone()
      .addScaledVector(tang, d * along)
      .addScaledVector(radial, visRadius(s) * rnd(-2, 2));
    const vel = P.v.clone()
      .addScaledVector(tang, speed * rnd(0.97, 1.03))
      .addScaledVector(radial, speed * rnd(-0.02, 0.02));
    // Fragments carry the heat the parent body built up on its way in.
    const fm = Math.max(each, 1e-7);
    const ft = each > 0.004 ? 'moon' : 'asteroid';
    made.push(makeBody(ft, pos, vel,
      { mass: fm, name: 'Ring frag', rubble: true, coreT: s.coreT,
        // Chips off a loose body are loose too — see spawnDebris.
        r: trueRadius(ft, fm) * (s.rFactor > 0 ? s.rFactor : 1) }));
  }
  // The ring should drift exactly as the moon did, not gain a net kick.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, s.v.clone().multiplyScalar(tot));
  fx.flash(s.p, visRadius(s) * 5, [255, 240, 220], 0.8);
  toast(s.name + ' was torn apart by ' + P.name + '’s tides');
  if (sim.selected === s) select(null);
  removeBody(s);
  s.disrupted = true;
  compact();
}

/* ========================================================= spinning apart   */
/*
 * Spin something fast enough and it throws itself to pieces.
 *
 * A rotating body is held together by its own gravity and pulled apart by the
 * centrifugal effect at its equator. Once the equator is turning faster than
 * orbital speed, whatever is sitting there is no longer resting on anything —
 * it is in orbit, and it leaves. The body sheds its outer layers from the
 * equator, in the plane it is spinning in, and keeps shedding until only the
 * dense core it could never fling off is left.
 *
 * This is not invented: it is why fast-rotating asteroids like Bennu are
 * losing material from their equators, and why the very fastest of them cannot
 * exist above about a two-hour rotation without falling apart.
 */

/* One turn in 0.02 hours — 72 seconds. Far, far past break-up for anything
   bigger than a boulder, which is the point of picking it. */
const SPIN_SHED = 0.02 / 24;      // days

/**
 * The share of a body its core makes up — the part that survives being spun.
 * Earth's iron core is about a third of its mass; a gas giant's rocky core is
 * only a few per cent of it, which is why spinning one apart leaves so little.
 */
function coreFraction(def) {
  if (def.star) return 0.28;
  if (def.surf === 'iron') return 0.92;
  if (GASSY_SURF.has(def.surf)) return 0.05;
  if (def.surf === 'comet' || def.surf === 'rock') return 0.42;
  return 0.33;
}

/** What is left when a body has thrown everything else away. */
function bareCore(b) {
  const def = TYPES[b.type];
  if (def.star || b.kind !== 'body') return null;
  // The game already has names for both of these: a gas giant stripped to its
  // core IS a chthonian world, and a rocky world stripped to its core is an
  // iron world.
  if (GASSY_SURF.has(def.surf)) return 'chthonian';
  if (def.surf !== 'iron' && !def.lumpy) return 'iron_world';
  return null;
}

function updateSpin(dt) {
  const bs = sim.bodies;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!b.alive || b.kind !== 'body') continue;
    const period = Math.abs(b.spin);

    if (period >= SPIN_SHED) { b.shedding = false; continue; }

    // First step over the line: work out how much of it is core and cannot go.
    // A body already ground down to its core keeps the core mass it ended on,
    // so spinning it again does not shave a fresh third off what is left — it
    // only gets a new core once it has been fed back up to well above the old one.
    if (!b.shedding) {
      b.shedding = true;
      if (b.coreM == null || b.m > b.coreM * 2.2) b.coreM = b.m * coreFraction(TYPES[b.type]);
      b.spinPending = 0;
      if (b.m > b.coreM) toast(b.name + ' is spinning itself apart!');
    }
    if (b.m <= b.coreM) continue;

    /* Mass is queued for release first and only leaves the body once particles
       have actually been found to carry it. If the debris pool is full, the
       queue simply stops draining and the body keeps that mass — it is never
       subtracted from one place without arriving in another. */
    const over = clamp(SPIN_SHED / Math.max(period, 1e-9), 1, 40);
    const room = b.m - b.coreM - b.spinPending;
    if (room > 0) b.spinPending += Math.min(room, b.m * 0.45 * over * dt);

    // Released in bursts, so each grain carries a visible amount of matter.
    if (b.spinPending > b.coreM * 0.05) {
      const put = spinShed(b, b.spinPending);
      if (put > 0) {
        b.spinPending -= put;
        b.m -= put;
        b.r = natRadius(b);
        scaleVisual(b);
      }
    }

    if (b.m <= b.coreM * 1.001) {
      const core = bareCore(b);
      if (core && b.type !== core) {
        b.type = core;
        b.rFactor = 1;
        b.r = trueRadius(core, b.m);
        b.coreT = Math.max(b.coreT, baseCoreT(TYPES[core], b.m));
        b.glowPulse = 1;
        updateLuminosity(b);
        refreshVisual(b);
      }
      toast(b.name + ' has nothing left but its core');
      // `shedding` deliberately stays true: the guard above now holds it here
      // until the spin is slowed back down or it is fed more mass.
    }
  }
}

/**
 * Fling material off the equator, in the plane the body is actually spinning
 * in and in the direction it is actually turning — so the wreckage comes off
 * as a flat, one-way disc rather than a sphere of shrapnel.
 *
 * Returns the mass actually placed, which is nothing at all when the debris
 * pool is full — the caller must take that off the body rather than assuming.
 */
function spinShed(b, mass) {
  // The body leans by b.tilt about Z, so its pole is Y turned by that much.
  const axis = new THREE.Vector3(-Math.sin(b.tilt), Math.cos(b.tilt), 0).normalize();
  let u = new THREE.Vector3(0, 0, 1);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(1, 0, 0);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  const rv = Math.max(visRadius(b), 1e-9);
  const vEsc = Math.sqrt(2 * G * settings.gravity * Math.max(b.m, 1e-12) / rv);
  /* The honest equatorial speed. At a 72-second rotation this runs to hundreds
     of km/s and at the slider's floor to thousands, which would put every grain
     outside the simulation inside one frame — so it is capped. The cap is the
     one dishonest number here, and it exists purely so you can watch it. */
  const vEq = TAU * b.r / Math.max(Math.abs(b.spin), 1e-9);
  const vTop = clamp(vEq, vEsc * 1.05, vEsc * 22);
  // Circular speed just above the surface. Material lifting off the equator at
  // break-up leaves at about this — it is not thrown, it simply stops being
  // held down — so most of it goes into orbit and shears out into a ring, and
  // only the fastest tail gets away. That is how a moon ends up being made out
  // of the wreckage instead of it all just leaving.
  const vOrb = vEsc / Math.SQRT2;
  const dir = b.spin < 0 ? -1 : 1;

  const n = Math.min(150, parts.free.length);
  if (n <= 0 || mass <= 0) return 0;
  const each = mass / n;
  const hot = [255, 232, 190], cool = [122, 104, 92];

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;
    const th = rnd(0, TAU);
    const ct = Math.cos(th), st = Math.sin(th);
    // Position on the equator, thrown out a little and barely off the plane.
    const outX = u.x * ct + w.x * st, outY = u.y * ct + w.y * st, outZ = u.z * ct + w.z * st;
    const tanX = (-u.x * st + w.x * ct) * dir, tanY = (-u.y * st + w.y * ct) * dir, tanZ = (-u.z * st + w.z * ct) * dir;
    const off = rv * rnd(1.1, 1.5);
    const lift = rv * rnd(-0.10, 0.10);

    parts.pos[k3] = b.p.x + outX * off + axis.x * lift;
    parts.pos[k3 + 1] = b.p.y + outY * off + axis.y * lift;
    parts.pos[k3 + 2] = b.p.z + outZ * off + axis.z * lift;

    // Power law: most grains barely clear the surface, a few really fly.
    const sp = lerp(vOrb * 1.02, vTop, Math.pow(Math.random(), 2.4)) * rnd(0.94, 1.06);
    // Mostly tangential — it is lifting off, not being blown — with a nudge out.
    const rad = sp * rnd(0.02, 0.10);
    parts.vel[k3] = b.v.x + tanX * sp + outX * rad;
    parts.vel[k3 + 1] = b.v.y + tanY * sp + outY * rad;
    parts.vel[k3 + 2] = b.v.z + tanZ * sp + outZ * rad;

    const bs = rnd(1.6, 7);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = COOL_IMPACT * 0.6;
    parts.src[k] = -1;

    const ww = mix(hot, [255, 255, 255], Math.random() * 0.5);
    parts.warm[k3] = ww[0] / 255; parts.warm[k3 + 1] = ww[1] / 255; parts.warm[k3 + 2] = ww[2] / 255;
    parts.cool[k3] = cool[0] / 255; parts.cool[k3 + 1] = cool[1] / 255; parts.cool[k3 + 2] = cool[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/* ========================================================== temperature     */

/**
 * Internal heat leaks away towards whatever the body's own size and make-up can
 * hold — quickly for a pebble, hardly at all for a gas giant. Run on rendered
 * frames rather than physics substeps: this is a slow process and does not need
 * the accuracy.
 */
function coolCores(simDt) {
  if (simDt <= 0) return;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (b.kind !== 'body' || b.coreT == null) continue;
    const def = TYPES[b.type];
    if (def.star) continue;                    // a star makes its own heat
    const floor = baseCoreT(def, b.m);
    if (b.coreT <= floor) { b.coreT = floor; continue; }
    // Small bodies have far more surface per tonne, so they dump heat faster.
    const k = TIDE_COOL / Math.pow(clamp(b.m, 1e-6, 1e5), 0.22);
    b.coreT = floor + (b.coreT - floor) * Math.exp(-k * simDt);
  }
}

function updateTemperatures() {
  const stars = sim.starCache;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (TYPES[b.type].star || b.kind !== 'body') continue;
    let flux = 0;
    for (let s = 0; s < stars.length; s++) {
      const st = stars[s];
      const dAU = Math.max(b.p.distanceTo(st.p) / AU, 1e-4);
      flux += st.lum / (dAU * dAU);
    }
    // 278.6 K is the equilibrium temperature at 1 AU from a Sun-like star
    const eq = flux > 0 ? 278.6 * Math.pow(flux, 0.25) : 3;
    const def = TYPES[b.type];
    // `floorT` is for worlds kept warm by something other than starlight — a
    // greenhouse atmosphere on Venus, an open magma ocean on a lava world.
    const floor = def.floorT != null ? def.floorT : def.glowHot ? 1200 : 3;
    // Heat forced into the middle has to come back out through the surface, so
    // a world being kneaded hard glows on its own even out in the dark.
    const excess = Math.max(0, (b.coreT || 0) - baseCoreT(def, b.m));
    const inner = excess > 0 ? Math.pow(excess, 0.75) * 1.1 : 0;
    b.temp = Math.max(eq, floor, inner);
  }
}

/* ================================================================== renderer */

let renderer, scene, camera, canvasEl;
let SPHERE, SPHERE_LO, SPHERE_MID, SPHERE_HI;
const ringGeoCache = new Map();

/**
 * An annulus normalised so its outer edge sits at radius 1, which lets a single
 * uniform scale place both edges correctly.
 */
function ringGeometry(innerRatio) {
  const key = innerRatio.toFixed(3);
  if (!ringGeoCache.has(key)) ringGeoCache.set(key, new THREE.RingGeometry(innerRatio, 1, 120, 1));
  return ringGeoCache.get(key);
}
let TEX_GLOW, TEX_HALO, TEX_TAIL, TEX_PHOTON, TEX_PUFF;
const texCache = new Map();
const heightCache = new Map();   // painter height fields, for reliefGeometry
const geoCache = new Map();      // displaced star meshes, shared per type
/* How far the granulation pushes the photosphere in and out, as a fraction of
   the radius. Real granules stand only a few hundred km proud of a 700,000 km
   star — invisible — so this is frankly theatrical. It is sized to just break
   the limb: push it much past this and the star turns into a raspberry. */
const STAR_RELIEF = 0.010;
const VIEW = { w: 1, h: 1, dpr: 1 };
const FOV = 55;

const hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/** World units per screen pixel at a given distance — used for pixel floors. */
function worldPerPixel(dist) {
  return 2 * Math.tan(FOV * Math.PI / 360) * dist / VIEW.h;
}

function initScene() {
  canvasEl = document.getElementById('an-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x03030a, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 1e-4, 4e6);

  SPHERE = new THREE.SphereGeometry(1, 44, 30);
  SPHERE_LO = new THREE.SphereGeometry(1, 16, 12);
  // Stars need far more vertices than a planet: at 44 segments the mesh is
  // coarser than the granulation itself, so the displacement would alias into
  // a few random dents instead of resolving individual cells.
  /* For relief worlds. Half the triangles of SPHERE_HI and no visible loss —
     the height field is only sampled at 512×256, and a scene can hold dozens of
     planets where it rarely holds more than a couple of stars. */
  SPHERE_MID = new THREE.SphereGeometry(1, 144, 96);
  SPHERE_HI = new THREE.SphereGeometry(1, 200, 130);
  // A unit square laid flat on the surface, used for impact scars. Kept small
  // enough that the gap between a flat decal and a curved world never shows.

  TEX_GLOW = new THREE.CanvasTexture(glowTexture(256, 0.16, 0.85));
  TEX_HALO = new THREE.CanvasTexture(glowTexture(256, 0.04, 0.30));
  TEX_TAIL = new THREE.CanvasTexture(tailTexture(256));
  TEX_PHOTON = new THREE.CanvasTexture(photonRingTexture(512));
  TEX_PUFF = new THREE.CanvasTexture(puffTexture(128));

  scene.add(new THREE.AmbientLight(0xffffff, 0.055));

  buildSky();
  buildGrid();
  initParticles();
  initGalaxyStars();
  initPost();
  resize();
}

/** Bright annulus used for a black hole's photon ring. */
function photonRingTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0)');
  g.addColorStop(0.375, 'rgba(255,236,196,0.30)');
  g.addColorStop(0.405, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.435, 'rgba(255,214,140,0.34)');
  g.addColorStop(0.62, 'rgba(255,160,60,0.06)');
  g.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/* ------------------------------------------------------------ shared shaders */

const ATMO_VERT = `
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vWN = normalize(mat3(modelMatrix) * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const ATMO_FRAG = `
  uniform vec3 uColor;
  uniform vec3 uLight;
  uniform float uStrength;
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vWN, 0.0)).xyz);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    float lit = max(dot(normalize(vWN), normalize(uLight)), 0.0);
    gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
  }`;

/* A star's photosphere. The one thing that makes a real star unmistakable is
   limb darkening: the disc is markedly dimmer and redder at the rim than at
   the centre, because a sightline grazing the edge only ever penetrates to the
   high, cool layers of the atmosphere, while one straight down the middle sees
   all the way to the hot gas underneath. That depends on where you are looking
   from, so it cannot be painted into a texture — it has to be done here. */
const STAR_VERT = `
  varying vec2 vUv;
  varying vec3 vSN;
  varying vec3 vVP;
  void main() {
    vUv = uv;
    // The *sphere* normal, not the displaced one: granulation relief must not
    // be allowed to make the limb darkening blotchy.
    vSN = normalize(mat3(modelMatrix) * normalize(position));
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const STAR_FRAG = `
  uniform sampler2D uMap;
  uniform vec3 uTint;
  uniform float uGrey;
  uniform vec3 uEdge;
  uniform vec3 uLimb;
  varying vec2 vUv;
  varying vec3 vSN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vSN, 0.0)).xyz);
    float mu = clamp(dot(N, V), 0.0, 1.0);          // cos(angle to the normal)
    // Quadratic limb-darkening law. The solar coefficients put the very edge
    // at about 30% of central brightness — this is not a subtle effect.
    float d = uLimb.x + uLimb.y * mu + uLimb.z * mu * mu;
    vec3 t = texture2D(uMap, vUv).rgb;
    // A banded star is painted its band colour outright rather than tinted, so
    // the photosphere is flattened to its own relief first and uTint supplies
    // every bit of the hue. All the granulation survives; only the colour goes.
    t = mix(t, vec3(dot(t, vec3(0.299, 0.587, 0.114))), uGrey);
    vec3 c = t * uTint;
    c *= mix(uEdge, vec3(1.0), smoothstep(0.0, 0.6, mu));
    gl_FragColor = vec4(c * max(d, 0.0), 1.0);
  }`;

/* ------------------------------------------------------------------ textures */

function surfaceTexture(type, seed) {
  const def = TYPES[type];
  if (!def.surf) return null;
  const variant = seed % 3;
  const key = type + ':' + variant;
  if (texCache.has(key)) return texCache.get(key);

  // Granulation is fine-grained by nature: at 512 wide a granule is only a
  // dozen pixels across and the relief shading has nothing to bite on, so
  // photosphere stars get twice the resolution of everything else.
  const small = def.group === 'MOONS & DEBRIS' || def.lumpy;
  const fine = def.surf === 'star';
  const W = small ? 256 : fine ? 1024 : 512, H = small ? 128 : fine ? 512 : 256;
  const cv = newCanvas(W, H);
  const rng = mulberry32(hashStr(key));
  const opts = Object.assign({ temp: def.temp, spots: def.spots }, def.opts || {});
  const hgt = SURFACE[def.surf](cv.getContext('2d'), W, H, rng, opts);
  // A painter may hand back the height field it shaded from, so the same
  // relief can also be pushed into the mesh. See reliefGeometry().
  if (hgt) heightCache.set(key, { W: W, H: H, d: hgt });

  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  texCache.set(key, t);
  return t;
}

/**
 * The displaced sphere a star's photosphere is drawn on. Painted shading can
 * fake relief in the middle of a disc but it can never break the silhouette,
 * and stars use an unlit material so nothing else will shade them either.
 * Pushing the granulation into real geometry gets both: a bumpy limb, and
 * cells that slide past one another with true parallax as the star turns.
 *
 * Cached per type+variant — a handful of stars share one geometry, so this is
 * deliberately NOT assigned to b.ownGeo, which would dispose it out from
 * under every other star of the same kind.
 */
function starGeometry(type, seed) {
  const key = type + ':' + (seed % 3);
  if (geoCache.has(key)) return geoCache.get(key);
  surfaceTexture(type, seed);                       // fills heightCache
  const field = heightCache.get(key);
  if (!field) return SPHERE;
  const g = displaceSphere(field, STAR_RELIEF);
  geoCache.set(key, g);
  return g;
}

/**
 * Push a painter's height field into a sphere, so the landscape it drew is
 * actually THERE — a mountain range breaks the horizon instead of only being
 * shaded on, and it throws a real shadow along the terminator because the mesh
 * normals follow the ground.
 *
 * Heights are measured against the field's own mean, so the average radius does
 * not move: what changes is the shape, not the size. The displacement eases out
 * at the poles, where every vertex of a UV sphere is coincident and pulling them
 * different distances would tear the cap open.
 */
function displaceSphere(field, amount, base) {
  const g = (base || SPHERE_HI).clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const W = field.W, H = field.H, d = field.d;
  if (field.mean == null) {
    let m = 0;
    for (let i = 0; i < d.length; i++) m += d[i];
    field.mean = m / d.length;
  }
  const mean = field.mean;
  // Track the finished extremes rather than the field's own, because the pole
  // fade below means the mesh never reaches as far as the raw numbers say. This
  // is what a sea level is measured against, so it has to be the real thing.
  let rlo = Infinity, rhi = -Infinity;

  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // wrap in u so the vertices on the seam sample the same texel and stay put
    const x = ((Math.round(u * W - 0.5) % W) + W) % W;
    const y = clamp(Math.round(vv * H - 0.5), 0, H - 1);
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (d[y * W + x] - mean) * amount * fade;
    if (s < rlo) rlo = s;
    if (s > rhi) rhi = s;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  // Keyed by amount, so changing the elevation setting does not leave a sea
  // level measured against the old landscape.
  field.rAmount = amount; field.rlo = rlo; field.rhi = rhi;
  g.computeVertexNormals();
  return g;
}

/**
 * How far out the ground actually is, in one direction, on a body with relief —
 * as a multiple of its mean radius. Anything lying ON the surface has to know
 * this, or the mountains stand in front of it: a crater decal pinned at a flat
 * 1.006 disappears behind a ridge four per cent tall.
 *
 * The direction is turned back into the same (u, v) a THREE.SphereGeometry
 * vertex would have carried, then the height field is read at that texel — so
 * this returns exactly what displaceSphere() put there.
 */
function groundAt(b, n) {
  const amount = reliefOf(b.type);
  if (amount <= 1e-6) return 1;
  const field = heightCache.get(b.type + ':' + (b.seed % 3));
  if (!field || field.mean == null) return 1;
  const W = field.W, H = field.H, d = field.d;
  // three.js lays a sphere out as x = -cos(phi)sin(theta), y = cos(theta),
  // z = sin(phi)sin(theta), with u = phi/2pi and v = theta/pi.
  const vv = Math.acos(clamp(n.y, -1, 1)) / Math.PI;
  let u = Math.atan2(n.z, -n.x) / TAU;
  if (u < 0) u += 1;
  const x = ((Math.round(u * W - 0.5) % W) + W) % W;
  const y = clamp(Math.round(vv * H - 0.5), 0, H - 1);
  const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
  return 1 + (d[y * W + x] - field.mean) * amount * fade;
}

/* ------------------------------------------------------------ real elevation */
/*
 * How much relief each kind of surface gets, as a fraction of the body's radius
 * per unit of the painter's height field.
 *
 * These are exaggerated, and they have to be. Real planets are astonishingly
 * smooth: Everest is a seven-hundredth of Earth's radius, and if you shrank the
 * Earth to the size of a billiard ball it would be smoother than the ball. At
 * true scale you would see nothing at all. So the ordering is real even though
 * the size is not — airless, unweathered worlds are the roughest, Mars carries
 * the biggest relief in the Solar System, and a world with an ocean or a thick
 * atmosphere is the smoothest, because water and wind grind everything flat.
 */
const RELIEF = {
  comet: 0.24,        // barely held together at all
  rock: 0.20,         // the Moon, Mercury: nothing has ever worn them down
  chthonian: 0.19,    // a gas giant's flayed core
  carbon: 0.18,
  desert: 0.17,       // Mars: Olympus Mons stands 22 km over Amazonis
  iron: 0.16,
  rogue: 0.16,
  lava: 0.14,         // crust plates riding on an open magma ocean
  ice: 0.13,          // Europa's ridges and chaos terrain
  earth: 0.105,       // the real one, and it is very nearly a smooth ball
  terran: 0.115,      // rain and rivers file mountains down
  eyeball: 0.10,
  // Nearly all of an ocean world is under water and water is flat, so its own
  // height field barely moves. Pushed hard anyway, or the islands that do break
  // the surface would not read as anything at all.
  ocean: 0.16
};

/** The relief a type actually gets, after the Settings exaggeration. */
function reliefOf(type) {
  const def = TYPES[type];
  const base = RELIEF[def.surf];
  if (!base || def.star) return 0;
  return base * clamp(settings.relief, 0, 4) * (def.relief != null ? def.relief : 1);
}

/** Roughly how far the tallest peak stands above the mean radius. */
const reliefTop = (type) => reliefOf(type) * 0.40;

/**
 * A world with its landscape pushed into the mesh. Cached per type, variant and
 * relief setting — a hundred identical moons share one geometry, so this is
 * deliberately NOT assigned to b.ownGeo, which would dispose it out from under
 * all the others.
 */
function reliefGeometry(type, seed) {
  const amount = reliefOf(type);
  if (amount <= 1e-6) return SPHERE;
  const tk = type + ':' + (seed % 3);
  const key = 'relief:' + tk + ':' + amount.toFixed(4);
  if (geoCache.has(key)) return geoCache.get(key);
  surfaceTexture(type, seed);                       // fills heightCache
  const field = heightCache.get(tk);
  if (!field) return SPHERE;                        // this surface has no ground
  const g = displaceSphere(field, amount, SPHERE_MID);
  geoCache.set(key, g);
  return g;
}

function cachedTexture(key, make) {
  if (texCache.has(key)) return texCache.get(key);
  const t = new THREE.CanvasTexture(make());
  t.encoding = THREE.sRGBEncoding;
  texCache.set(key, t);
  return t;
}

/** Deform a sphere into a believable irregular body (asteroids, comet nuclei). */
function lumpyGeometry(seed, amount, base) {
  const g = (base || SPHERE_LO).clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const f = fbm(seed, 4, 2, 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // fade the displacement out at the poles so the seam vertices stay together
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (f(u, vv) - 0.5) * 2 * amount * fade;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  g.computeVertexNormals();
  return g;
}

/* ============================================================ body visuals  */

function buildVisual(b) {
  const def = TYPES[b.type];
  const grp = new THREE.Group();
  b.obj = grp;
  b.parts = {};

  if (b.kind === 'bh' && def.naked) buildSingularity(b, grp);
  else if (b.kind === 'bh') buildHole(b, grp);
  else if (b.kind === 'wh') buildWhiteHole(b, grp);
  else if (b.kind === 'gal') buildGalaxy(b, grp);
  else if (b.kind === 'gas') buildClump(b, grp);
  else buildWorld(b, def, grp);

  // A pixel-floor marker so distant bodies never vanish entirely.
  const dotMat = new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  });
  b.parts.dot = new THREE.Sprite(dotMat);
  b.parts.dot.renderOrder = 6;
  grp.add(b.parts.dot);

  scene.add(grp);
  buildTrail(b);
  // The sea, if it has one. Last, because it needs b.obj and b.parts to exist.
  if (b.water > 0) setWater(b, b.water);
  scaleVisual(b);
}

/**
 * Paint a star the colour its mass says it should be — photosphere, rim,
 * corona, glare and the light it casts, so the whole thing reads as one colour
 * instead of a tinted ball sitting inside somebody else's glow.
 *
 * Cheap enough to call whenever the band changes and no more often than that;
 * see the check in updateVisuals.
 */
function applyStarBand(b) {
  const band = starBand(b);
  b.band = band;
  const p = b.parts;
  if (!band || !p) return;
  const c = new THREE.Color(band.rgb[0] / 255, band.rgb[1] / 255, band.rgb[2] / 255);
  const u = p.surf && p.surf.material.uniforms;
  if (u && u.uGrey) {
    // Keep the per-body brightness jitter that uTint was carrying, so two stars
    // in the same band still are not identical — but capped at 1, so a band
    // colour is only ever hit exactly or dimmed, never clipped past white.
    const g = 0.90 + mulberry32(b.seed)() * 0.10;
    u.uTint.value.set(c.r * g, c.g * g, c.b * g);
    u.uGrey.value = 1;
  }
  // The shells and sprites are multiplied, not replaced: their own texture
  // supplies the shape and the band supplies the colour.
  if (p.chromo) p.chromo.material.color.copy(c);
  if (p.corona) p.corona.material.color.copy(c);
  if (p.glow) p.glow.material.color.copy(c);
  if (p.halo) p.halo.material.color.copy(c);
  if (b.lightColor) b.lightColor.copy(c);
}

function buildWorld(b, def, grp) {
  const photo = def.surf === 'star';
  const geo = baseGeometryFor(b);
  // Only the lumpy geometry is per-body; star geometry is shared from geoCache
  // and must never be disposed with the body that happened to build it.
  b.ownGeo = def.lumpy ? geo : null;
  const tex = surfaceTexture(b.type, b.seed);

  let mat;
  if (photo) {
    const jit0 = mulberry32(b.seed);
    const g = 0.90 + jit0() * 0.14;
    mat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: tex },
        uTint: { value: new THREE.Vector3(g, g, g) },
        uGrey: { value: 0 },
        uEdge: { value: new THREE.Vector3(1.0, 0.80, 0.58) },
        uLimb: { value: new THREE.Vector3(0.30, 0.93, -0.23) }
      },
      vertexShader: STAR_VERT, fragmentShader: STAR_FRAG
    });
  } else if (def.star) {
    mat = new THREE.MeshBasicMaterial({ map: tex });
  } else {
    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: def.surf === 'iron' ? 0.42 : def.surf === 'ocean' || def.surf === 'hycean' ? 0.55 : 0.88,
      metalness: def.surf === 'iron' ? 0.55 : def.surf === 'carbon' ? 0.25 : 0.04
    });
    // The emissive map is always attached so a world can start glowing when it
    // heats up without forcing a shader recompile mid-flight.
    mat.emissiveMap = tex;
    mat.emissive = new THREE.Color(0x000000);
    mat.emissiveIntensity = 1;
    if (def.glowHot) {
      mat.emissive.setRGB(def.glowHot * 0.55, def.glowHot * 0.16, 0.02);
    }
  }
  // gentle per-body variation so two Earths aren't identical. Stars already
  // carry theirs in uTint, and a ShaderMaterial has no .color to set.
  if (!photo) {
    const jit = mulberry32(b.seed);
    mat.color = new THREE.Color().setRGB(0.90 + jit() * 0.14, 0.90 + jit() * 0.14, 0.90 + jit() * 0.14);
    b.baseColor = mat.color.clone();
  }

  const surf = new THREE.Mesh(geo, mat);
  grp.add(surf);
  b.parts.surf = surf;

  if (photo) {
    /* Two translucent shells standing off the photosphere. Being additive they
       contribute almost nothing looked at face-on and pile up where the line of
       sight grazes the edge — which is why a real star shows a coloured rim and
       a ragged corona rather than ending at a hard painted circle. They also
       turn at their own rates below, so the layers shear past one another and
       the eye reads three separate distances instead of one skin. */
    const warm = (def.opts && def.opts.warm) || 0;
    const chromo = new THREE.Mesh(SPHERE, new THREE.MeshBasicMaterial({
      map: cachedTexture('chromo:' + b.type, () => chromoTexture(hashStr('chromo' + b.type), 512, 256, def.temp, warm)),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.40
    }));
    chromo.scale.setScalar(1.012);
    grp.add(chromo);
    b.parts.chromo = chromo;

    const corona = new THREE.Mesh(SPHERE, new THREE.MeshBasicMaterial({
      map: cachedTexture('corona:' + b.type, () => coronaTexture(hashStr('corona' + b.type), 512, 256, def.temp, warm)),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
      side: THREE.DoubleSide, opacity: 0.30
    }));
    corona.scale.setScalar(1.055);
    grp.add(corona);
    b.parts.corona = corona;
  }

  if (def.clouds) {
    const ct = cachedTexture('cloud:' + b.type + ':' + (b.seed % 3), () => cloudTexture(hashStr(b.type + b.seed % 3), 512, 256, def.clouds, [255, 255, 255]));
    const cm = new THREE.MeshStandardMaterial({ map: ct, transparent: true, depthWrite: false, roughness: 1 });
    const cloud = new THREE.Mesh(SPHERE, cm);
    cloud.scale.setScalar(1.018);
    grp.add(cloud);
    b.parts.cloud = cloud;
  }

  if (def.atmo) {
    const am = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color().fromArray(def.atmo.map(c => c / 255)) },
        uLight: { value: new THREE.Vector3(1, 0, 0) },
        uStrength: { value: 0.95 }
      },
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    const atmo = new THREE.Mesh(SPHERE, am);
    atmo.scale.setScalar(1.09);
    grp.add(atmo);
    b.parts.atmo = atmo;
  }

  if (b.ringSpec) buildRing(b, grp);
  if (b.scars && b.scars.length) buildScars(b);
  // The living layer, built only once a dead world has actually started to
  // green up — an ocean-and-forest shell fading in over whatever was there.
  if (b.terra > 0 && !isLivingSurf(def) && !def.star && !GASSY_SURF.has(def.surf)) {
    buildTerraLayer(b, grp);
  }

  if (def.dead) {
    // A black dwarf gives out nothing: no glare, no halo, no light of its own.
    b.lightColor = new THREE.Color(0, 0, 0);
  } else if (def.star) {
    // A star with its own painted colour (a brown dwarf) glares and lights in it too
    const col = new THREE.Color().fromArray(((def.opts && def.opts.hot) || kelvinToRGB(def.temp)).map(c => c / 255));
    const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(g1); grp.add(g2);
    b.parts.glow = g1; b.parts.halo = g2;
    b.lightColor = col;
    applyStarBand(b);
  }

  if (def.tail) {
    const tm = new THREE.MeshBasicMaterial({ map: TEX_TAIL, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const plane = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);   // extends along +X
    const tail = new THREE.Mesh(plane, tm);
    tail.frustumCulled = false;
    scene.add(tail);                    // world-space, oriented each frame
    b.parts.tail = tail;
    const coma = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0x9fd8ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(coma);
    b.parts.coma = coma;
  }
}

/**
 * Oceans, weather and an atmosphere, laid over a dead world as three shells
 * that fade in together with `b.terra`. Done as an overlay rather than by
 * swapping the body's type, so the world underneath keeps its own identity —
 * a terraformed Mars is still Mars, and it is still there when it dies back.
 */
function buildTerraLayer(b, grp) {
  /* Built on the body's OWN relief geometry, not a plain sphere: the greenery
     has to follow the mountains it is growing on, or a terraformed Mars ends up
     with Olympus Mons sticking out through its new biosphere. */
  const skin = new THREE.Mesh(reliefGeometry(b.type, b.seed), new THREE.MeshStandardMaterial({
    map: surfaceTexture('terrestrial', b.seed),
    transparent: true, opacity: 0, roughness: 0.8, metalness: 0.02
  }));
  skin.scale.setScalar(1.004);
  grp.add(skin);
  b.parts.terraSkin = skin;

  const ct = cachedTexture('cloud:terra:' + (b.seed % 3),
    () => cloudTexture(hashStr('terra' + (b.seed % 3)), 512, 256, 0.55, [255, 255, 255]));
  const cloud = new THREE.Mesh(SPHERE, new THREE.MeshStandardMaterial({
    map: ct, transparent: true, opacity: 0, depthWrite: false, roughness: 1
  }));
  cloud.scale.setScalar(1.024);
  grp.add(cloud);
  b.parts.terraCloud = cloud;

  const atmo = new THREE.Mesh(SPHERE, new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color().fromArray(SKY.map(c => c / 255)) },
      uLight: { value: new THREE.Vector3(1, 0, 0) },
      uStrength: { value: 0 }
    },
    vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
  }));
  atmo.scale.setScalar(1.09);
  grp.add(atmo);
  b.parts.terraAtmo = atmo;
}

function buildHole(b, grp) {
  const shadow = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  grp.add(shadow);
  b.parts.surf = shadow;

  const photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, color: new THREE.Color(0xcfe0ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(photon);
  b.parts.photon = photon;

  const disk = makeGasDisk();
  disk.rotation.x = -Math.PI / 2 + 0.30;
  disk.rotation.z = 0.2;
  grp.add(disk);
  b.parts.disk = disk;
}

/* ------------------------------------------------------------ accretion discs */
/*
 * An accretion disc is gas: a few thousand wisps of it, each on its own
 * circular orbit, so the inner edge whips round far faster than the rim
 * (Kepler: angular speed falls as r^-1.5) and the disc shears into streaks.
 * The motion is done in the vertex shader from one clock, so it costs nothing.
 * Hot blue-white at the inner edge, deep blue at the rim, a little thicker the
 * further out, and brighter on the side swinging towards you — relativistic
 * beaming, the reason real images of these discs are lopsided.
 *
 * Laid out in the XY plane with radius 1, like the ring it replaces, so the
 * same scale and tilt apply. One geometry and one material are shared by
 * every disc in the scene; disposeVisual knows to leave them alone.
 */
const GAS_DISK_N = 2600;
let gasDiskGeo = null, gasDiskMat = null, gasAtlas = null;

const GAS_DISK_VERT = `
  #include <common>
  #include <logdepthbuf_pars_vertex>
  attribute float aR;
  attribute float aPhase;
  attribute float aH;
  attribute float aSize;
  attribute vec3 aCol;
  uniform float uTime;
  uniform float uScale;
  varying vec3 vCol;
  varying float vA;
  varying float vRot;
  varying float vTile;
  void main() {
    float om = 1.4 * pow(aR / 0.3, -1.5);
    float a = aPhase + uTime * om;
    vec3 p = vec3(cos(a) * aR, sin(a) * aR, aH);
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    #include <logdepthbuf_vertex>
    float sc = length((modelMatrix * vec4(1.0, 0.0, 0.0, 0.0)).xyz);
    float px = aSize * sc * uScale / max(-mv.z, 1e-9);
    // gas coming towards you is brighter and bluer
    vec3 vt = normalize(mat3(modelViewMatrix) * vec3(-sin(a), cos(a), 0.0));
    float beam = 1.0 + 0.8 * vt.z;
    vCol = aCol * beam * vec3(0.9 - 0.1 * vt.z, 1.0, 1.0 + 0.15 * vt.z);
    vA = min(1.0, px * px / 16.0);
    vRot = a + aPhase;
    vTile = mod(floor(aPhase * 7.0), 4.0);
    gl_PointSize = clamp(px, 1.5, 420.0);
  }`;
const GAS_DISK_FRAG = `
  #include <common>
  #include <logdepthbuf_pars_fragment>
  uniform sampler2D uMap;
  varying vec3 vCol;
  varying float vA;
  varying float vRot;
  varying float vTile;
  void main() {
    #include <logdepthbuf_fragment>
    vec2 q = gl_PointCoord - 0.5;
    float c = cos(vRot), s = sin(vRot);
    q = vec2(c * q.x - s * q.y, s * q.x + c * q.y) + 0.5;
    if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;
    vec2 tile = vec2(mod(vTile, 2.0), floor(vTile / 2.0)) * 0.5;
    float wisp = texture2D(uMap, tile + q * 0.5).a;
    float soft = exp(-dot(q - 0.5, q - 0.5) * 9.0);
    gl_FragColor = vec4(vCol, (wisp * 0.75 + soft * 0.25) * vA);
  }`;

function makeGasDisk() {
  if (!gasDiskGeo) {
    const n = GAS_DISK_N, rng = mulberry32(0x9a5d15c);
    const aR = new Float32Array(n), aPh = new Float32Array(n), aH = new Float32Array(n);
    const aS = new Float32Array(n), aC = new Float32Array(n * 3), pos = new Float32Array(n * 3);
    const HOT = [0.85, 0.95, 1.0], MID = [0.30, 0.58, 1.0], RIM = [0.10, 0.22, 0.85];
    for (let i = 0; i < n; i++) {
      // crowded towards the inner edge, where the gas is densest and hottest
      const r = 0.26 + Math.pow(rng(), 1.8) * 0.74;
      aR[i] = r;
      aPh[i] = rng() * TAU;
      aH[i] = (rng() + rng() + rng() - 1.5) * 0.04 * r;
      aS[i] = (0.035 + rng() * 0.07) * (0.6 + r);
      const t = (r - 0.26) / 0.74;
      const c = t < 0.25 ? mix(HOT, MID, t / 0.25) : mix(MID, RIM, (t - 0.25) / 0.75);
      const glow = (1.25 - t * 0.85) * (0.75 + rng() * 0.5) * 0.55;
      aC[i * 3] = c[0] * glow; aC[i * 3 + 1] = c[1] * glow; aC[i * 3 + 2] = c[2] * glow;
    }
    gasDiskGeo = new THREE.BufferGeometry();
    gasDiskGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    gasDiskGeo.setAttribute('aR', new THREE.BufferAttribute(aR, 1));
    gasDiskGeo.setAttribute('aPhase', new THREE.BufferAttribute(aPh, 1));
    gasDiskGeo.setAttribute('aH', new THREE.BufferAttribute(aH, 1));
    gasDiskGeo.setAttribute('aSize', new THREE.BufferAttribute(aS, 1));
    gasDiskGeo.setAttribute('aCol', new THREE.BufferAttribute(aC, 3));
    if (!gasAtlas) gasAtlas = nebulaAtlas();
    gasDiskMat = new THREE.ShaderMaterial({
      uniforms: { uMap: { value: gasAtlas }, uTime: { value: 0 }, uScale: { value: 1 } },
      vertexShader: GAS_DISK_VERT, fragmentShader: GAS_DISK_FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    gasDiskMat.userData.shared = true;
  }
  const disk = new THREE.Points(gasDiskGeo, gasDiskMat);
  disk.frustumCulled = false;
  return disk;
}

/** Once a frame: the shared disc clock and pixel scale. */
function updateGasDisks() {
  if (!gasDiskMat) return;
  gasDiskMat.uniforms.uTime.value = performance.now() / 1000;
  gasDiskMat.uniforms.uScale.value = VIEW.h * VIEW.dpr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}

/* No horizon, no disc: just the point itself, blazing, shifting through every
   colour as the light leaving it is bent and stretched. */
function buildSingularity(b, grp) {
  const core = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  grp.add(core);
  b.parts.surf = core;
  const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0xffffff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: new THREE.Color(0xc9a6ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(g1); grp.add(g2);
  b.parts.glow = g1; b.parts.halo = g2;
  const photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, color: new THREE.Color(0xd8c4ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(photon);
  b.parts.photon = photon;
  b.lightColor = new THREE.Color(0xffffff);
}

function buildWhiteHole(b, grp) {
  const core = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0xfffbe8 }));
  grp.add(core);
  b.parts.surf = core;

  const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0xfff3b0), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: new THREE.Color(0xffe27a), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(g1); grp.add(g2);
  b.parts.glow = g1; b.parts.halo = g2;
  b.lightColor = new THREE.Color(0xfff0c0);
}

/* =============================================================== impact scars */
/*
 * A world that has just swallowed another one should look like it. Every merge
 * and every hard graze leaves a mark on the survivor at the point it was hit,
 * scaled to how big the thing that hit it was — so a body's surface ends up
 * carrying a record of what it is made of. It is exactly why the Moon and
 * Mercury look the way they do.
 *
 * The mark is a decal held just off the surface and parented to the body's own
 * mesh, so it turns with the body and leans with its axis. It is stored on the
 * body rather than painted into the texture, because textures are shared
 * between every world of the same kind.
 */

const MAX_SCARS = 7;
const _ZAXIS = new THREE.Vector3(0, 0, 1);

/** A crater seen from straight above: dark floor, bright rim, splash of rays. */
function scarTexture(seed, size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;

  /* Rays first, so the crater is painted over their inner ends. Each one
     TAPERS TO A POINT: a ray that keeps its width to a blunt end reads as a
     grey panel lying on the ground rather than as a streak of thrown-out dust,
     and that shows badly while the crater is fading in from under the fire. */
  const rays = 11 + (r() * 10) | 0;
  for (let i = 0; i < rays; i++) {
    const a = r() * TAU;
    const len = c * (0.52 + r() * 0.44);
    const wid = c * (0.014 + r() * 0.034);
    const g = ctx.createLinearGradient(c, c, c + Math.cos(a) * len, c + Math.sin(a) * len);
    g.addColorStop(0, 'rgba(238,230,220,0.30)');
    g.addColorStop(0.42, 'rgba(238,230,220,0.13)');
    g.addColorStop(1, 'rgba(238,230,220,0)');
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -wid);
    ctx.lineTo(len * 0.55, -wid * 0.55);
    ctx.lineTo(len, 0);
    ctx.lineTo(len * 0.55, wid * 0.55);
    ctx.lineTo(0, wid);
    ctx.closePath();
    ctx.translate(-c, -c);
    ctx.fill();
    ctx.restore();
  }

  // Ejecta blanket, then the bowl, then the raised rim.
  let g = ctx.createRadialGradient(c, c, c * 0.26, c, c, c * 0.5);
  g.addColorStop(0, 'rgba(214,200,186,0.34)');
  g.addColorStop(1, 'rgba(214,200,186,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c, c, c * 0.5, 0, TAU); ctx.fill();

  g = ctx.createRadialGradient(c * 0.86, c * 0.86, c * 0.02, c, c, c * 0.28);
  g.addColorStop(0, 'rgba(14,10,10,0.80)');
  g.addColorStop(0.62, 'rgba(38,28,26,0.68)');
  g.addColorStop(1, 'rgba(60,48,44,0.10)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c, c, c * 0.28, 0, TAU); ctx.fill();

  ctx.strokeStyle = 'rgba(226,214,200,0.5)';
  ctx.lineWidth = size / 90;
  ctx.beginPath(); ctx.arc(c, c, c * 0.275, 0, TAU); ctx.stroke();

  // Feather the whole decal out at its edge, so nothing on it ends on a hard
  // line against the ground it is lying on.
  ctx.globalCompositeOperation = 'destination-out';
  const fade = ctx.createRadialGradient(c, c, c * 0.60, c, c, c);
  fade.addColorStop(0, 'rgba(0,0,0,0)');
  fade.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = fade;
  ctx.fillRect(0, 0, size, size);
  ctx.globalCompositeOperation = 'source-over';
  return cv;
}

/**
 * The same wound while it is still open: a ring of glowing melt. White-hot in
 * the middle where the impactor's energy went, orange through the melt sheet,
 * and cracks radiating out where the crust tore and the heat is showing
 * through. Drawn additively, so this is pure light laid over the crater.
 */
function scarFireTexture(seed, size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;

  // Cracks first, reaching further out than the melt itself.
  const cracks = 12 + (r() * 10) | 0;
  for (let i = 0; i < cracks; i++) {
    const a = r() * TAU;
    const len = c * (0.42 + r() * 0.52);
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a);
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, 'rgba(255,236,190,0.95)');
    g.addColorStop(0.35, 'rgba(255,132,26,0.65)');
    g.addColorStop(1, 'rgba(150,22,6,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = size * (0.004 + r() * 0.012);
    ctx.beginPath();
    ctx.moveTo(c * 0.10, 0);
    // a couple of kinks, so a crack is not a drawn ruler line
    ctx.quadraticCurveTo(len * 0.5, (r() - 0.5) * len * 0.28, len, (r() - 0.5) * len * 0.18);
    ctx.stroke();
    ctx.restore();
  }

  // The melt sheet, then the molten floor on top of it.
  let g = ctx.createRadialGradient(c, c, c * 0.05, c, c, c * 0.46);
  g.addColorStop(0, 'rgba(255,246,224,0.98)');
  g.addColorStop(0.22, 'rgba(255,196,86,0.92)');
  g.addColorStop(0.46, 'rgba(255,108,20,0.66)');
  g.addColorStop(0.74, 'rgba(176,32,8,0.30)');
  g.addColorStop(1, 'rgba(90,10,4,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c, c, c * 0.46, 0, TAU); ctx.fill();

  // A brighter rim right at the lip of the bowl, where the melt pooled.
  ctx.strokeStyle = 'rgba(255,222,150,0.85)';
  ctx.lineWidth = size / 64;
  ctx.beginPath(); ctx.arc(c, c, c * 0.275, 0, TAU); ctx.stroke();
  return cv;
}

/** Turn a world-space direction into the body's own rotating frame. */
function localOnBody(b, worldDir) {
  const v = worldDir.clone();
  if (v.lengthSq() < 1e-18) v.set(1, 0, 0);
  v.normalize();
  // World = tilt about Z, then spin about Y — so undo them in that order.
  v.applyAxisAngle(_ZAXIS, -b.tilt);
  v.applyAxisAngle(_YAXIS, -b.rot);
  return v;
}

/**
 * Record a mark where `worldDir` points, sized as a fraction of the body's own
 * radius. Held on the body, so it survives a rebuild and a save.
 */
function addScar(b, worldDir, size) {
  if (!b.alive || b.kind !== 'body') return null;
  const def = TYPES[b.type];
  // Nothing that has no surface to scar: a star's photosphere heals in minutes
  // and a gas giant has no ground for a crater to be in.
  if (def.star || GASSY_SURF.has(def.surf)) return null;
  const n = localOnBody(b, worldDir);
  b.scars = b.scars || [];
  // age 0: molten. It cools over SCAR_COOL days and the crater emerges from
  // underneath the fire as it goes.
  const mark = { n: [n.x, n.y, n.z], s: clamp(size, 0.10, 1.15), roll: Math.random() * TAU, age: 0 };
  b.scars.push(mark);
  // Oldest marks are buried by later resurfacing; keep the panel honest by
  // counting every one, but only ever draw the most recent handful.
  b.scarCount = (b.scarCount || 0) + 1;
  b.scarsCold = false;                   // something on this body is glowing again
  while (b.scars.length > MAX_SCARS) b.scars.shift();
  if (b.parts) buildScars(b);
  // Handed back so a crater that is still being dug can go on growing.
  return b.scars.indexOf(mark) >= 0 ? mark : null;
}

/* How long a fresh impact scar takes to go from molten to cold rock, in days.
   A real melt sheet takes thousands of years to solidify; this is short enough
   to actually watch happen at a sensible time rate. */
const SCAR_COOL = 90;

/* A crater's shape, as fractions of its own radius. Real ones run about a fifth
   of their diameter deep with a rim a little above the surrounding ground. */
