    const a = collisionPairs[k], b = collisionPairs[k + 1];
    if (!a.alive || !b.alive) continue;
    if (impact(a, b)) dirty = true;
  }
  if (dirty) compact();
}

function impact(a, b) {
  // heavier body is A
  if (b.m > a.m) { const t = a; a = b; b = t; }

  // White holes never merge — they shove things away instead.
  if (a.kind === 'wh' || b.kind === 'wh') {
    const wh = a.kind === 'wh' ? a : b, other = a.kind === 'wh' ? b : a;
    const dir = other.p.clone().sub(wh.p);
    const len = dir.length() || 1;
    dir.divideScalar(len);
    const push = Math.sqrt(2 * G * wh.m / Math.max(visRadius(wh), 1e-6)) * 0.6;
    other.p.copy(wh.p).addScaledVector(dir, visRadius(wh) + visRadius(other));
    other.v.addScaledVector(dir, push);
    return false;
  }

  // A black hole simply eats whatever crosses its horizon.
  if (a.kind === 'bh') {
    absorb(a, b);
    return true;
  }

  // Two neutron stars touching is not an ordinary merge — it is a kilonova.
  // Checked before the bounce setting, because this is a real event with a real
  // outcome and letting the pair rebound off each other would just be wrong.
  if (snSet.on && a.type === 'neutron_star' && b.type === 'neutron_star') {
    goKilonova(a, b);
    return true;
  }

  if (settings.collisions === 'bounce') {
    bounce(a, b);
    return false;
  }

  const rel = b.v.clone().sub(a.v);
  const vImp = rel.length();
  const vEsc = vEscape(a, b);
  const ratio = b.m / a.m;

  // A gentle touch accretes; a fast, well-matched hit shatters both. Rubble is
  // already broken, so it only ever accretes — this keeps debris fields from
  // fragmenting without end. Gas is the same story taken further: there is
  // nothing left to break, so a knot of vapour always merges. Without this a
  // pair of knots can shatter into more knots, and one collision runs away
  // into a hundred bodies.
  const soft = a.rubble || b.rubble || a.kind === 'gas' || b.kind === 'gas';
  if (vImp < vEsc * 1.6 || ratio < 0.015 || soft) merge(a, b, vImp, vEsc);
  else shatter(a, b, vImp);
  return true;
}

function absorb(hole, prey) {
  const mTot = hole.m + prey.m;
  hole.v.multiplyScalar(hole.m / mTot).addScaledVector(prey.v, prey.m / mTot);

  // Some of the meal is flung clear instead of swallowed whole. Most of it is
  // still bound and will spiral back in over the next few orbits.
  const rp = visRadius(prey);
  const vEsc = Math.sqrt(2 * G * hole.m / Math.max(rp, 1e-9));
  const spare = prey.m * 0.06;
  // Clear of the horizon as well as the prey, or it is swallowed immediately.
  const clear = Math.max(rp, visRadius(hole));
  const thrown = ejecta(prey.p, prey.v, 210, spare, vEsc * 0.5,
    [200, 160, 255], [90, 80, 120], clear, { speed: 1 });
  // Most of a world torn up on the way in comes off as vapour, not gravel.
  const gas = gasEjecta(prey.p, prey.v, 340, prey.m * 0.13, vEsc * 0.5, clear, { speed: 0.9 });

  hole.m = mTot - thrown - gas;
  hole.r = schwarzschild(hole.m);
  refreshVisual(hole);
  fx.flash(prey.p, rp * 6, [200, 170, 255], 0.5);
  toast(hole.name + ' devoured ' + prey.name);
  removeBody(prey);
}

function bounce(a, b) {
  const nrm = b.p.clone().sub(a.p);
  const dist = nrm.length() || 1e-9;
  nrm.divideScalar(dist);
  const overlap = visRadius(a) + visRadius(b) - dist;
  if (overlap > 0) {
    const tot = a.m + b.m;
    a.p.addScaledVector(nrm, -overlap * (b.m / tot) - 1e-9);
    b.p.addScaledVector(nrm, overlap * (a.m / tot) + 1e-9);
  }
  const rel = b.v.clone().sub(a.v);
  const sep = rel.dot(nrm);
  if (sep > 0) return;                       // already separating
  const e = 0.55;                            // restitution
  const jImp = -(1 + e) * sep / (1 / a.m + 1 / b.m);
  a.v.addScaledVector(nrm, -jImp / a.m);
  b.v.addScaledVector(nrm, jImp / b.m);
  fx.flash(b.p, visRadius(b) * 3, [255, 220, 170], 0.25);
  // Scale the scuff with how hard they actually hit. A graze knocks a little
  // dust off the smaller body; it is real mass, so take it out of b.
  const vEsc = vEscape(a, b);
  const bump = clamp(-sep / Math.max(vEsc, 1e-9), 0, 2);
  if (bump > 0.15) {
    const n = Math.round(50 + 110 * bump);
    b.m -= ejecta(b.p, b.v, n, b.m * 0.004 * bump, vEsc,
      [255, 225, 175], [110, 100, 92], visRadius(b), { speed: 0.8 });
    // Even a graze boils off more than it chips away.
    b.m -= gasEjecta(b.p, b.v, Math.round(n * 1.5), b.m * 0.009 * bump, vEsc,
      visRadius(b), { speed: 0.9 });
    // Both of them come away scuffed where they touched.
    addScar(b, nrm.clone().negate(), clamp(bump * 0.35, 0.12, 0.5));
    addScar(a, nrm, clamp(bump * 0.35, 0.12, 0.5));
  }
}

function merge(a, b, vImp, vEsc) {
  const mTot = a.m + b.m;
  // Where it was hit, captured before the survivor is moved to the barycentre.
  const hitDir = b.p.clone().sub(a.p);
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);
  // Mixing a diffuse knot of gas into a solid world must not swell the world to
  // the size of the cloud, so a merge involving gas keeps the survivor's own
  // density instead of adding volumes.
  const gasMix = a.kind === 'gas' || b.kind === 'gas';

  // Splash some of the impactor back out as real debris. Harder accretions throw
  // out proportionally more, and a pebble landing on a planet should not look
  // like two worlds colliding, so scale by the impactor's share of the mass.
  const sev = clamp(vImp / Math.max(vEsc, 1e-9), 0, 2);
  const heft = clamp(Math.sqrt(b.m / mTot * 4), 0.1, 1);
  const spray = clamp((sev - 0.5) * 0.1, 0, 0.09);
  const ejectMass = b.m * spray;
  const count = Math.round((150 + 150 * sev) * heft);

  // Move and grow the survivor FIRST, so the ejecta is placed clear of the
  // merged body's surface rather than inside it.
  a.p.copy(com);
  a.v.copy(vel);
  /* Swallowing gas, the survivor keeps its OWN density rather than adding the
     two volumes — a planet that eats a cloud does not balloon to the size of the
     cloud. "Its own" means the density it actually has, not the one its type
     says it should have: natRadius, not trueRadius. Getting that wrong turned a
     wide, loose rubble pile into a dense speck the instant it met a wisp of gas,
     which is what was quietly shrinking every asteroid in a solid ring. */
  const grown = a.m;
  a.m = mTot;
  a.r = gasMix ? natRadius(a) : Math.cbrt(a.r * a.r * a.r + b.r * b.r * b.r);
  a.m = grown;
  // Adding volumes moves how far off natural density the survivor sits, so the
  // factor is brought up to date here or the next mass change would undo it.
  const natA = trueRadius(a.type, mTot);
  a.rFactor = natA > 0 ? a.r / natA : 1;

  const thrown = ejectMass > 0
    ? ejecta(com, vel, count, ejectMass, vEsc, [255, 190, 110], [96, 84, 76], visRadius(a), { speed: 1 })
    : 0;
  // The vapour plume: more mass and more of it than the rubble, because at
  // these speeds rock does not chip, it boils.
  const gas = ejectMass > 0
    ? gasEjecta(com, vel, Math.round(count * 1.6), ejectMass * 2.4, vEsc, visRadius(a), { speed: 1.1 })
    : 0;
  a.m = mTot - thrown - gas;
  if (gasMix) a.r = natRadius(a);

  // A real hit throws off knots you can go and look at — mostly vapour, some of
  // it solid. Only worth doing when something substantial actually landed.
  let clumped = 0;
  if (!gasMix && sev > 0.55 && b.m > a.m * 0.02) {
    const want = clamp(Math.round(2 + sev * 3 * heft), 1, 5);
    clumped = spawnClumps(com, vel, b.m * 0.14 * heft, want,
      vEsc * rnd(0.9, 1.5), visRadius(a) * 1.3, 0.3);
    a.m -= clumped;
  }

  // Enough mass in one place and the physics changes character.
  let note = a.name + ' absorbed ' + b.name;
  const ev = checkEvolution(a);
  if (ev) note = a.name + EVOLVE_NOTE[ev];
  else { updateLuminosity(a); refreshVisual(a); }

  // …and it leaves a mark, sized by how big the thing that hit it was.
  addScar(a, hitDir, clamp(Math.cbrt(b.m / Math.max(a.m, 1e-12)) * 1.5, 0.14, 1.1));

  fx.flash(com, visRadius(a) * 4, [255, 210, 150], 0.7);
  toast(note + (clumped > 0 ? ' — knots of it flew off' : ''));
  removeBody(b);
}

function shatter(a, b, vImp) {
  const mTot = a.m + b.m;
  const hitDir = b.p.clone().sub(a.p);
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  const vEsc = vEscape(a, b);
  const ra0 = visRadius(a);

  // Two tiers of real wreckage. A handful of large fragments become full N-body
  // objects that pull on everything; the fine ejecta becomes thousands of test
  // particles. Every gram is accounted for out of mTot.
  const fine = mTot * 0.07;
  const thrown = ejecta(com, vel, 430, fine, vEsc,
    [255, 235, 195], [104, 90, 80], ra0, { speed: 1.35, sizeMin: 1.2, sizeMax: 7.5 });
  // Two worlds hitting each other hard enough to break both of them apart put
  // far more energy in than it takes to vaporise rock, so the plume outweighs
  // the gravel by better than two to one. This is where a debris disc — and
  // eventually a moon — comes from.
  const gas = gasEjecta(com, vel, 700, mTot * 0.16, vEsc, ra0, { speed: 1.25 });

  const keep = clamp(0.35 + 0.3 * (1 - b.m / a.m), 0.2, 0.72);
  const bigFrags = Math.min(clamp(Math.round(6 + (1 - keep) * 16), 4, 18), freeSlots());
  const avail = mTot - thrown - gas;
  const remnantM = bigFrags > 0 ? Math.min(a.m * keep, avail) : avail;
  const rubbleM = avail - remnantM;

  a.m = remnantM;
  a.p.copy(com);
  a.v.copy(vel);
  a.r = natRadius(a);
  updateLuminosity(a);
  refreshVisual(a);
  // The survivor wears the hit. This one is a big mark — it was nearly destroyed.
  addScar(a, hitDir, rnd(0.55, 1.1));

  /* What is left splits three ways: a few big solid fragments, a handful of
     selectable knots that are mostly still vapour, and the fine gas already
     released above. Roughly a third of the knots never got hot enough to boil
     and come off solid. */
  let rest = rubbleM;
  if (rest > 0) {
    const knots = clamp(Math.round(3 + Math.random() * 3), 2, 6);
    rest -= spawnClumps(com, vel, rest * 0.42, knots, vImp * 0.4, visRadius(a) * 1.4, 0.32);
  }
  // Recount the slots: the knots above have taken some of them.
  const nFrags = Math.min(bigFrags, freeSlots());
  if (nFrags > 0 && rest > 0) {
    spawnDebris(com, vel, rest / nFrags, nFrags, vImp * 0.45, visRadius(a) * 1.2, a.rFactor);
  } else if (rest > 0) {
    a.m += rest;                       // nowhere to put it: the survivor keeps it
    a.r = natRadius(a);
    scaleVisual(a);
  }
  fx.flash(com, ra0 * 7, [255, 240, 200], 1);
  toast(a.name + ' and ' + b.name + ' shattered on impact!');
  removeBody(b);
}

const freeSlots = () => Math.max(0, MAX_BODIES - sim.bodies.length);

/**
 * Correct a set of fresh fragments so they collectively carry exactly the
 * momentum they should. Random ejection directions do not cancel on their own,
 * which otherwise lets every impact quietly kick the whole system sideways.
 */
function conserveMomentum(frags, expectedP) {
  if (!frags.length) return;
  const actual = new THREE.Vector3();
  let m = 0;
  for (const f of frags) { actual.addScaledVector(f.v, f.m); m += f.m; }
  if (m <= 0) return;
  const corr = expectedP.clone().sub(actual).divideScalar(m);
  for (const f of frags) f.v.add(corr);
}

/**
 * `puff` is the parent's rFactor: how far off natural density it was. Passing it
 * on keeps a chip off a low-density rubble pile as loose as the pile was, rather
 * than having it appear as a dense speck a thousandth of the size.
 */
function spawnDebris(center, baseVel, massEach, count, spread, minDist, puff) {
  const made = [];
  const blow = puff > 0 ? puff : 1;
  for (let i = 0; i < count; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.45, 0.45), rnd(-1, 1));
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const pos = center.clone().addScaledVector(dir, minDist * rnd(1.05, 2.2));
    const vel = baseVel.clone().addScaledVector(dir, spread * rnd(0.35, 1.15));
    const type = massEach > 0.004 ? 'moon' : 'asteroid';
    const fm = Math.max(massEach, 1e-7);
    made.push(makeBody(type, pos, vel, { mass: fm, r: trueRadius(type, fm) * blow,
      name: 'Debris ' + (sim.nextId), rubble: true }));
  }
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, baseVel.clone().multiplyScalar(tot));
  return made;
}

/* ------------------------------------------------------- growing up ------- */

const GAS_THRESHOLD = 60.1;      // M⊕ — a rocky world this heavy holds an envelope
const IGNITE_MASS = 0.075 * M_SUN;
const COLLAPSE_MASS = 25 * M_SUN;

/* Worlds that already have a thick hydrogen envelope: the gas-giant rule below
   does not apply to them, they just keep growing towards ignition. */
const GASSY_SURF = new Set(['gas', 'icegiant', 'puff', 'hycean']);

/* ============================================================== terraforming */
/*
 * Making a dead world live.
 *
 * It is not a button that repaints a planet. A world is habitable or it is not,
 * and three things decide which:
 *
 *   HEAVY ENOUGH   Too light and its gravity cannot hold an atmosphere down —
 *                  the gas simply leaks away into space. This is exactly what
 *                  happened to Mars, which is why it is a frozen desert with
 *                  1% of Earth's air pressure despite once having rivers.
 *   NOT TOO HEAVY  Past a point a rocky world holds onto hydrogen and helium
 *                  too, and becomes a small Neptune with no surface at all.
 *   THE RIGHT HEAT Water has to be able to sit on the surface as a liquid.
 *                  That is the whole of what the "habitable zone" means, and it
 *                  is worked out here from the real starlight actually falling
 *                  on the world — so moving a planet changes the answer.
 *
 * And it is not permanent. A terraformed world only stays alive while those
 * conditions hold. Drag it out past the snow line or in towards the star and
 * the oceans go, the green goes, and it dies back — faster than it grew, which
 * is also true to life.
 */

const TERRA_MIN_MASS = 0.05;    // M⊕ — below this the air escapes
const TERRA_MAX_MASS = 20;      // M⊕ — above this it starts holding hydrogen
const TERRA_MIN_T = 258;        // K — colder and the water never melts
const TERRA_MAX_T = 348;        // K — hotter and it all boils away

/* Worlds that are already alive when you find them. */
const LIVING_SURF = new Set(['terran', 'ocean', 'hycean', 'eyeball']);
const isLivingSurf = (def) => LIVING_SURF.has(def.surf);

/** Can this world be made to live? Returns why not, in plain words, if not. */
function terraCheck(b) {
  const no = (why) => ({ ok: false, why: why });
  if (!b || !b.alive || b.kind !== 'body') return no('Only a solid world can be terraformed.');
  const def = TYPES[b.type];
  if (def.star) return no(b.name + ' is a star. There is no surface here to stand on.');
  if (GASSY_SURF.has(def.surf)) {
    return no(b.name + ' is a gas world — it is atmosphere all the way down, with no ground underneath ' +
      'for an ocean to sit on.');
  }
  if (b.m < TERRA_MIN_MASS) {
    return no(b.name + ' is far too light. At ' + fmtMass(b.m) + ' its gravity could never hold an ' +
      'atmosphere down — the air would leak away into space. It needs at least ' + fmtMass(TERRA_MIN_MASS) +
      '. This is exactly why Mars is a frozen desert.');
  }
  if (b.m > TERRA_MAX_MASS) {
    return no(b.name + ' is too heavy. At ' + fmtMass(b.m) + ' it holds on to hydrogen as well as air, ' +
      'and becomes a small Neptune with no surface at all. The limit is about ' + fmtMass(TERRA_MAX_MASS) + '.');
  }
  const t = Math.round(b.temp);
  if (b.temp < TERRA_MIN_T) {
    return no(b.name + ' is too cold: ' + t.toLocaleString() + ' K, and water freezes at 273. Move it ' +
      'closer to a star — or give it a brighter one — until it reads at least ' + TERRA_MIN_T + ' K.');
  }
  if (b.temp > TERRA_MAX_T) {
    return no(b.name + ' is too hot: ' + t.toLocaleString() + ' K. Any ocean would boil straight off. ' +
      'Move it further out until it reads under ' + TERRA_MAX_T + ' K.');
  }
  return { ok: true, why: '' };
}

/**
 * Grow or lose the living layer. Dying is twice as fast as growing, because
 * ruining something is always quicker than building it.
 */
function updateTerraform(simDt) {
  if (simDt <= 0) return;
  const span = Math.max(settings.terraYears, 0.01) * 365.25;
  for (const b of sim.bodies) {
    if (!b.alive || !b.terraOn || b.kind !== 'body') continue;
    const live = terraCheck(b).ok;
    const before = b.terra;
    b.terra = clamp(b.terra + (live ? simDt / span : -simDt / span * 2), 0, 1);
    if (b.terra === before) continue;

    // A dead world needs its living layer built the first time it greens up.
    if (before <= 0 && b.terra > 0 && b.parts && !b.parts.terraSkin && !isLivingSurf(TYPES[b.type])) {
      refreshVisual(b);
    }
    if (before < 1 && b.terra >= 1) {
      toast(b.name + ' is alive — oceans, air and all');
      if (sim.selected === b && !inspectorLock) renderInspector();
    } else if (before > 0 && b.terra <= 0) {
      toast(b.name + ' could not hold on to it, and died back');
      if (sim.selected === b && !inspectorLock) renderInspector();
    }
  }
}

const isRocky = (b) =>
  b.kind === 'body' && !TYPES[b.type].star && !GASSY_SURF.has(TYPES[b.type].surf);

/**
 * Apply the mass ladder. Checked in descending order so a body that leaps
 * straight past several thresholds lands on the right one.
 *
 *   rock --60.1 M⊕--> gas giant --8% M☉--> star --25 M☉--> black hole
 *
 * Returns a tag for the caller's notification, or null if nothing changed.
 */
function checkEvolution(b) {
  if (!b.alive || b.kind !== 'body') return null;
  const def = TYPES[b.type];
  if (def.brown) {
    // Feed a brown dwarf enough and it does not have to wait a hundred years —
    // it crosses the hydrogen-burning limit there and then.
    if (b.m >= IGNITE_MASS) { becomeStar(b); return 'star'; }
    return null;
  }
  if (def.star) {
    // Nothing at all holds up a neutron star past the Tolman–Oppenheimer–Volkoff
    // limit, so it just goes quietly.
    if (def.surf === 'neutron') {
      if (b.m >= TOV_LIMIT * M_SUN) { becomeBlackHole(b); return 'tov'; }
      return null;
    }
    // An ember has nothing left to do. It cannot detonate, collapse or explode.
    if (def.dead) return null;
    /* House rule (see STAR_BANDS): twenty solar radii is the ceiling for a
       burning star. SWELL past it and the star burns out into a black dwarf.
       It has to be a crossing, not just a reading — a red supergiant is 760 R☉
       from the day it is placed and has plenty of life left in it, so what
       burns out is a star that has GROWN into the ceiling from under it. */
    if (def.surf === 'star') {
      if (b.r < BLACK_DWARF_R * R_SUN * R_EARTH) b.everSmall = true;
      else if (b.everSmall) { becomeBlackDwarf(b); return 'bdwarf'; }
    }
    if (snSet.on) {
      // A white dwarf crossing the Chandrasekhar limit is the one supernova that
      // genuinely is triggered by mass rather than by running out of fuel — and
      // it is exactly why every Type Ia comes out the same brightness.
      if (def.surf === 'dwarfstar' && b.m >= snSet.chandra * M_SUN) {
        return goSupernova(b) ? 'snIa' : null;
      }
      /* Growing a star must not set it off unless "Mass triggers" is on. That
         switch is documented as "a star that GROWS past the core-collapse mass
         explodes" — but the failMass check here used to fire whatever it was
         set to, so simply dragging a star's mass past 40 M☉ collapsed it into
         a black hole with the switch plainly turned off, and the star vanished
         into a dot for no reason the player could see. The white dwarf above is
         the one real exception: a Type Ia genuinely is triggered by mass and by
         nothing else. Everything else waits to be set off by hand. */
      if (snSet.massTrigger) {
        if (b.m >= snSet.failMass * M_SUN) return goSupernova(b) ? 'sn' : null;
        if (b.m >= snSet.ccMass * M_SUN) return goSupernova(b) ? 'sn' : null;
      }
      return null;
    }
    if (b.m >= COLLAPSE_MASS) { becomeBlackHole(b); return 'bh'; }
    return null;
  }
  if (b.m >= IGNITE_MASS) { becomeStar(b); return 'star'; }
  if (isRocky(b) && b.m >= GAS_THRESHOLD) { becomeGasGiant(b); return 'gas'; }
  return null;
}

const EVOLVE_NOTE = {
  gas: ' swelled into a gas giant!',
  star: ' ignited into a star!',
  bh: ' collapsed into a black hole!',
  sn: ' went supernova!',
  snIa: ' detonated as a Type Ia supernova!',
  tov: ' passed the neutron-star limit and collapsed into a black hole!',
  bdwarf: ' burnt out into a black dwarf.'
};

/**
 * Past ~60 Earth masses a rocky planet's gravity can hold onto hydrogen, so it
 * puffs up into a gas giant — a real jump in radius, since gas is far less dense
 * than rock.
 */
function becomeGasGiant(b) {
  b.type = 'gas_giant';
  b.kind = 'body';
  b.spin = TYPES.gas_giant.spin;
  b.tilt = rnd(-0.42, 0.42);
  // A transformation is a new object, so it gets the new type's own width
  // rather than carrying over a factor the player set on the old one.
  b.rFactor = 1;
  b.r = trueRadius('gas_giant', b.m);
  b.everSmall = b.r < BLACK_DWARF_R * R_SUN * R_EARTH;
  b.glowPulse = 1;                       // a few seconds of heat from collapsing in
  updateLuminosity(b);
  refreshVisual(b);
  fx.form(b, false);
}

function becomeStar(b) {
  const mSun = b.m / M_SUN;
  b.type = mSun > 8 ? 'blue_giant' : mSun > 0.5 ? 'sun_like' : 'red_dwarf';
  b.kind = 'body';
  b.age = 0;
  b.temp = TYPES[b.type].temp;
  b.rFactor = 1;
  b.r = trueRadius(b.type, b.m);
  b.everSmall = b.r < BLACK_DWARF_R * R_SUN * R_EARTH;
  b.spin = TYPES[b.type].spin;
  b.coreT = baseCoreT(TYPES[b.type], b.m);
  updateLuminosity(b);
  refreshVisual(b);
  fx.form(b, true);
}

/**
 * Brown dwarfs light up.
 *
 * A real brown dwarf never does this — that is the whole definition of one: it
 * is too light to ever start burning hydrogen, and it just fades for trillions
 * of years. Here they keep contracting until they do ignite, on a clock you set
 * in Settings (a hundred years out of the box). Watching a failed star finally
 * catch is more fun than watching it not.
 */
function ripenBrownDwarfs(dt) {
  const span = Math.max(settings.bdYears, 0.01) * 365.25;
  for (const b of sim.bodies) {
    if (!b.alive || b.kind !== 'body' || !TYPES[b.type].brown) continue;
    b.bdAge = (b.bdAge || 0) + dt;
    if (b.bdAge < span) continue;
    const name = b.name;
    b.type = 'red_dwarf';
    b.age = 0;
    b.bdAge = 0;
    b.temp = TYPES.red_dwarf.temp;
    b.spin = TYPES.red_dwarf.spin;
    b.rFactor = 1;
    b.r = trueRadius('red_dwarf', b.m);
    b.everSmall = b.r < BLACK_DWARF_R * R_SUN * R_EARTH;
    b.coreT = baseCoreT(TYPES.red_dwarf, b.m);
    b.glowPulse = 1;
    updateLuminosity(b);
    refreshVisual(b);
    fx.form(b, true);
    toast(name + ' finally caught fire — it is a red dwarf now!');
  }
}

/**
 * A star burns out. Twenty solar masses is the house ceiling (see STAR_BANDS);
 * at or above it fusion stops for good and what is left is a black dwarf. It
 * keeps its mass and its orbit and gives out nothing at all from here on, so
 * anything that was warmed by it goes cold.
 */
function becomeBlackDwarf(b) {
  b.type = 'black_dwarf';
  b.kind = 'body';
  b.age = 0;
  b.band = null;
  b.temp = TYPES.black_dwarf.temp;
  b.spin = TYPES.black_dwarf.spin;
  // An ember collapses to its own size. Whatever the star was puffed out to on
  // the way here is exactly what it has just stopped holding up.
  b.rFactor = 1;
  b.everSmall = true;
  b.r = trueRadius('black_dwarf', b.m);
  b.coreT = baseCoreT(TYPES.black_dwarf, b.m);
  b.lum = 0;
  refreshVisual(b);
}

function becomeBlackHole(b) {
  b.type = 'black_hole';
  b.kind = 'bh';
  b.temp = 0;
  b.lum = 0;
  b.rFactor = 1;
  b.everSmall = true;
  b.r = schwarzschild(b.m);
  refreshVisual(b);
}

/** Shatter a body straight away — the inspector's "Shatter" button. */
function shatterBody(b) {
  if (!b.alive || b.kind === 'bh' || b.kind === 'wh') return;
  const frags = Math.min(clamp(Math.round(8 + Math.random() * 8), 6, 16), freeSlots());
  if (frags < 3) { toast('Universe is full — clear some bodies first'); return; }
  const rb = visRadius(b);
  const vEsc = Math.sqrt(2 * G * b.m / Math.max(rb, 1e-9));

  // Vapour and fine ejecta first, then split what's left between the fragments.
  const thrown = ejecta(b.p, b.v, 420, b.m * 0.12, vEsc,
    [255, 235, 195], [104, 90, 80], rb, { speed: 1.25, sizeMin: 1.2, sizeMax: 7.5 });
  const gas = gasEjecta(b.p, b.v, 640, b.m * 0.26, vEsc, rb, { speed: 1.2 });
  let rubble = b.m - thrown - gas;
  // A few selectable knots as well — mostly vapour, some of it solid.
  if (rubble > 0) {
    rubble -= spawnClumps(b.p, b.v, rubble * 0.4,
      clamp(Math.round(2 + Math.random() * 3), 2, 5), vEsc * 1.1, rb * 1.4, 0.32);
  }
  // Recount: the knots above have taken some of the body slots.
  const nFrags = Math.min(frags, freeSlots());
  if (rubble > 0 && nFrags > 0) spawnDebris(b.p, b.v, rubble / nFrags, nFrags, vEsc * 0.9, rb, b.rFactor);

  fx.flash(b.p, rb * 7, [255, 235, 190], 1);
  toast(b.name + ' was torn apart');
  if (sim.selected === b) select(null);
  removeBody(b);
  compact();
}

/* ============================================================== supernovae  */
/*
 * Two genuinely different explosions, both built from their real numbers.
 *
 *   Type Ia   A white dwarf accretes past the Chandrasekhar limit — 1.44 M☉,
 *             the most mass that electron degeneracy pressure can hold up —
 *             carbon ignites through the whole star at once, and it is torn
 *             apart completely. Nothing is left behind. ~1.5e51 erg.
 *
 *   Type II   A star over about 8 M☉ runs out of fuel. Its iron core collapses
 *   / Ib/c    in roughly a second and rebounds, blowing the envelope off at a
 *             few thousand km/s. ~1e51 erg. What remains at the centre is a
 *             neutron star, or a black hole if the star was heavy enough.
 *
 * The light does NOT come from the blast — that energy goes into motion, not
 * photons. It comes from about a tenth of a solar mass of radioactive nickel-56
 * forged in the shock, decaying to cobalt-56 and then to iron-56. That is the
 * whole reason a supernova takes weeks to brighten and months to fade.
 */

const TOV_LIMIT = 2.16;        // M☉ — heaviest a neutron star can possibly be
const PISN_LO = 130, PISN_HI = 250;   // M☉ — the pair-instability window
const SN_MAX = 6;              // concurrent explosions we keep lit
const KMS = 1000 * 86400 / 1e9;   // one km/s in Gm/day = 0.0864

const supernovae = [];
let snNextId = 1;

/* Hydrogen fusion starts at about ten million kelvin. Everything a protostar
   does — contracting, heating, glowing — is on the way to this one number. */
const IGNITE_T = 1e7;

/** A young remnant's photosphere: blue-white at first, reddening over weeks. */
const snPhotoT = (age) => lerp(16000, 4200, clamp(age / 110, 0, 1));

/* Where the expanding shell is brought to a halt, in Gm — about 400 AU.
   A real remnant ploughs into the interstellar medium, sweeps it up and slows
   down over tens of thousands of years, ending up tens of light years across.
   There is no interstellar medium here and no room for a shell that size, so
   the braking is real but the scale is compressed: the shell coasts out, slows,
   and settles somewhere you can still see all of it at once. Without this a
   remnant simply flies out of the simulation and is gone inside a year, which
   leaves nothing to select. */
/* How much brighter an explosion is *drawn* than the bare light curve would
   make it. Deliberately applied to the rendering and not to snLuminosity():
   the luminosity readout in the inspector is a real physical number, checked
   against real supernovae, and it stays that way. This only opens the
   aperture. */
const SN_GLOW = 3;

const SN_STALL = 6e4;

/** Main-sequence lifetime in days: fusion power goes as ~M³·⁵ but the fuel only
 *  as M, so t ≈ 10 Gyr × (M/M☉)^−2.5. The Sun gets ten billion years; a twenty
 *  solar-mass star gets about six million. */
function msLifetime(mSun) {
  return 1e10 * Math.pow(Math.max(mSun, 0.02), -2.5) * 365.25;
}

function fmtLum(l) {
  if (!(l > 0)) return '0 L☉';
  if (l < 1000) return l.toPrecision(3) + ' L☉';
  const e = Math.floor(Math.log10(l));
  return (l / Math.pow(10, e)).toFixed(1) + '×10' + sup(e) + ' L☉';
}

/**
 * Work out what a given star would do if its core gave way right now, without
 * changing anything. Always returns { ok, … }; when ok is false, `why` explains
 * the refusal in plain language so the inspector can teach rather than just
 * grey a button out.
 */
function snPlan(b) {
  const no = (why) => ({ ok: false, why: why });
  if (!b || !b.alive || b.kind !== 'body') return no('Only a star has a core that can collapse.');
  const def = TYPES[b.type];
  if (!def.star) return no(b.name + ' is not a star — there is no core here to collapse.');
  if (def.dead) {
    return no(b.name + ' is a black dwarf — a star that has already burnt out completely. There is ' +
      'no fuel left in it and nothing left to collapse. This is the end of the line.');
  }
  if (def.brown) {
    return no(b.name + ' is a brown dwarf: it has never managed to fuse hydrogen at all, so there ' +
      'is nothing here to run out of. Wait for it to light up, or feed it past ' +
      (IGNITE_MASS / M_SUN).toFixed(3) + ' M☉ to start it now.');
  }
  if (def.surf === 'neutron') {
    return no('A neutron star is already what a supernova leaves behind. Feed it past ' +
      TOV_LIMIT + ' M☉ and it collapses into a black hole instead.');
  }

  const mSun = b.m / M_SUN;

  /* ---- thermonuclear: a white dwarf pushed over the edge ------------------ */
  if (def.surf === 'dwarfstar') {
    if (mSun < snSet.chandra) {
      return no(b.name + ' is ' + mSun.toPrecision(3) + ' M☉. A white dwarf only detonates once it ' +
        'accretes past the Chandrasekhar limit of ' + snSet.chandra.toFixed(2) + ' M☉ — drag the mass ' +
        'slider up and it will go by itself.');
    }
    return {
      ok: true, flavour: 'Ia', label: 'Type Ia',
      foe: 1.5, ni: 0.6, rise: 14, plateau: 0, tPlat: 0, breakout: 3e43,
      remnant: 'none', remMass: 0, life: 1100,
      hot: [255, 246, 235], cool: [255, 150, 90],
      story: 'Carbon fusion ran away through the entire star in about two seconds. Because every ' +
        'one of these goes off at the same mass, they all reach almost the same brightness — which ' +
        'is how we measure distances across the universe.'
    };
  }

  /* ---- core collapse ----------------------------------------------------- */
  if (mSun < snSet.ccMass) {
    return no(b.name + ' is ' + mSun.toPrecision(3) + ' M☉ — too light. Below about ' + snSet.ccMass +
      ' M☉ a star can never build an iron core. It swells up, puffs its outer layers off as a ' +
      'planetary nebula, and settles down as a white dwarf.');
  }

  if (snSet.pisn && mSun >= PISN_LO && mSun < PISN_HI) {
    const t = clamp((mSun - PISN_LO) / (PISN_HI - PISN_LO), 0, 1);
    return {
      ok: true, flavour: 'PISN', label: 'Pair-instability',
      foe: lerp(9, 100, t), ni: lerp(0.6, 40, t), rise: 45, plateau: 0, tPlat: 0, breakout: 2e44,
      remnant: 'none', remMass: 0, life: 1400,
      hot: [246, 232, 255], cool: [255, 96, 190],
      story: 'So hot inside that its own gamma rays were turning into electron–positron pairs. ' +
        'That robbed the core of the pressure holding it up, it contracted, and it burned all of ' +
        'its oxygen at once. The star is not left behind in any form.'
    };
  }

  if (mSun >= snSet.failMass) {
    return {
      ok: true, flavour: 'fail', label: 'Failed supernova',
      foe: 0.02, ni: 0, rise: 1, plateau: 0, tPlat: 0, breakout: 1e41,
      remnant: 'black', remMass: b.m * 0.9, life: 90,
      hot: [130, 120, 160], cool: [46, 42, 66],
      story: 'Too heavy to bounce. The core fell straight through into a black hole and swallowed ' +
        'its own shock wave — the star simply winks out instead of exploding. We have watched this ' +
        'happen to at least one real star.'
    };
  }

  const bh = mSun >= snSet.bhMass;
  const stripped = !!def.stripped;
  return {
    ok: true,
    flavour: stripped ? 'Ibc' : 'II',
    label: stripped ? 'Type Ib/c' : 'Type II',
    foe: 1,
    ni: 0.062 * (1 + (mSun - snSet.ccMass) * 0.03),
    rise: stripped ? 13 : 8,
    // A Type II sits on a plateau for ~100 days while its hydrogen envelope
    // recombines from ionised gas and releases the heat stored in the shock.
    // A stripped star has no hydrogen left, so there is no plateau at all.
    plateau: stripped ? 0 : 2.0e42,
    tPlat: stripped ? 0 : 100,
    breakout: stripped ? 4e44 : 1e44,
    remnant: bh ? 'black' : 'neutron',
    remMass: bh
      ? Math.max(3 * M_SUN, b.m * 0.3)
      : M_SUN * clamp(1.2 + (mSun - snSet.ccMass) * 0.05, 1.17, TOV_LIMIT),
    life: 1100,
    hot: stripped ? [204, 236, 255] : [222, 238, 255],
    cool: stripped ? [140, 255, 212] : [255, 105, 70],
    story: bh
      ? 'The core collapsed past everything that could have held it up. Some of the envelope fell ' +
        'back in, and what sits at the centre now is a black hole.'
      : 'The iron core collapsed in about a second and rebounded. At the centre is a neutron star: ' +
        'a ball the size of a city with more mass than the Sun, spinning many times a second.'
  };
}

/**
 * What happens when two neutron stars run into each other.
 *
 * Together they are almost always over the Tolman–Oppenheimer–Volkoff limit,
 * so what settles at the centre is a black hole. But a few hundredths of a
 * solar mass gets flung clear first, at a fair fraction of the speed of light,
 * and that debris is packed with free neutrons. They stick to whatever nuclei
 * they meet and build the heaviest elements there are — this is where most of
 * the gold and platinum in the universe was actually made.
 *
 * It is far less energetic than a supernova and fades in a fortnight rather
 * than a year, and it starts out fiercely blue.
 */
function kiloPlan(mSunTotal) {
  return {
    ok: true,
    flavour: 'kilo', label: 'Kilonova',
    // The ejecta is tiny but moving at ~0.2c, so the kinetic energy still lands
    // in the same ballpark as an ordinary supernova.
    foe: 0.9,
    // Not nickel — the glow is r-process decay — but it drives the light curve
    // the same way, and a kilonova peaks perhaps a thousand times fainter.
    ni: 0.004,
    rise: 1.1,            // days: hours, not weeks
    plateau: 0, tPlat: 0,
    breakout: 6e44,
    remnant: 'black',
    // Nearly everything ends up in the hole; only a sliver escapes.
    remMass: mSunTotal * M_SUN * 0.965,
    life: 90,
    hot: [180, 220, 255],
    cool: [90, 150, 255],
    story: 'Two neutron stars touched and became a black hole. The splash — a ' +
      'few hundredths of a Sun, moving at a fifth of the speed of light — was so ' +
      'crowded with neutrons that it built the heaviest elements there are. Most ' +
      'of the gold and platinum in the universe was made in collisions like this one.'
  };
}

/** Merge two neutron stars and set the kilonova off. */
function goKilonova(a, b) {
  const mTot = a.m + b.m;
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  // Fold the pair into one body at their shared centre of mass, then hand it to
  // the ordinary supernova machinery — everything after the first second is the
  // same problem, a hot cloud thrown outwards.
  const pair = a.name + ' + ' + b.name;
  a.p.copy(com); a.v.copy(vel); a.m = mTot;
  a.rFactor = 1;
  a.r = trueRadius('neutron_star', mTot);
  removeBody(b);

  const plan = goSupernova(a, kiloPlan(mTot / M_SUN));
  if (plan) toast(pair + ' merged — kilonova!');
  return plan;
}

/**
 * Blow a star apart. Returns the plan it used, or null if this body could not
 * explode — callers use the returned plan's label for their own message, so
 * this function stays quiet.
 */
function goSupernova(b, plan) {
  if (!b || !b.alive) return null;
  plan = plan || snPlan(b);
  if (!plan || !plan.ok) return null;

  const pos = b.p.clone();
  const vel = b.v.clone();
  const mProg = b.m;
  const r0 = Math.max(visRadius(b), b.r, 1e-6);

  /* ---- what is left at the centre --------------------------------------- */
  let kind = snSet.remnant === 'auto' ? plan.remnant : snSet.remnant;
  let remM = 0;
  if (kind === 'neutron') {
    remM = Math.min(plan.remnant === 'neutron' ? plan.remMass : mProg * 0.4, TOV_LIMIT * M_SUN);
  } else if (kind === 'black') {
    remM = plan.remnant === 'black' ? plan.remMass : mProg * 0.3;
  }
  remM = clamp(remM, 0, mProg);
  if (remM <= 0) kind = 'none';
  let ejM = mProg - remM;

  /* ---- clear room for the envelope --------------------------------------- */
  // Whatever dust is already drifting nearby is about to be overrun by the
  // blast, so it is swept up into the new shell rather than deleted: its mass
  // and its momentum both come along, and nothing goes missing from the books.
  const want = clamp(Math.round(snSet.shellSize), 1, P_MAX - 40);
  let sweptM = 0, sweptPx = 0, sweptPy = 0, sweptPz = 0;
  if (parts.free.length < want) {
    for (let k = 0; k < P_MAX && parts.free.length < want; k++) {
      if (!parts.on[k]) continue;
      const k3 = k * 3, pm = parts.m[k];
      sweptM += pm;
      sweptPx += parts.vel[k3] * pm; sweptPy += parts.vel[k3 + 1] * pm; sweptPz += parts.vel[k3 + 2] * pm;
      killParticle(k);
    }
  }
  ejM += sweptM;

  /* ---- energy, nickel, and the kick -------------------------------------- */
  const foe = Math.max(plan.foe * snSet.energy, 0);
  const eKin = foe * FOE;
  const mNi = Math.max(plan.ni * snSet.nickel, 0);

  // Newborn neutron stars are observed rocketing away at hundreds of km/s,
  // because the explosion around them is never quite symmetric. A black hole
  // gets far less of a shove for the same push, being so much heavier.
  const kickDir = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
  if (kickDir.lengthSq() < 1e-9) kickDir.set(1, 0, 0);
  kickDir.normalize();
  const kickV = kind === 'none' ? 0
    : Math.max(snSet.kick, 0) * KMS * (kind === 'black' ? 0.25 : 1) * rnd(0.4, 1.3);

  /* ---- launch the envelope ----------------------------------------------- */
  // The shell carries everything the remnant does not, minus the momentum the
  // kick just handed the remnant, so the pair still adds up to what the star
  // had before it exploded.
  const netP = vel.clone().multiplyScalar(ejM - sweptM)
    .add(new THREE.Vector3(sweptPx, sweptPy, sweptPz))
    .addScaledVector(kickDir, -remM * kickV);

  // The id is claimed before the shell is thrown, so every grain is stamped with
  // the remnant it belongs to.
  const eid = snNextId++;
  const shell = ejM > 0 ? blastShell(pos, vel, want, ejM, {
    eKin: eKin, r0: r0, netP: netP, src: eid,
    coolDays: plan.flavour === 'fail' ? 15 : 110,
    hot: plan.hot, cool: plan.cool, sizeMin: 1.8, sizeMax: 9.5
  }) : null;

  if (!shell && ejM > 0 && kind !== 'none') { remM = mProg; ejM = 0; }

  /* ---- the progenitor ----------------------------------------------------- */
  if (kind === 'none') {
    removeBody(b);
    if (sim.selected === b) sim.selected = null;
    if (sim.follow === b) sim.follow = null;
    compact();
  } else {
    b.m = remM;
    b.age = 0;
    b.rubble = false;
    b.disrupted = false;
    b.v.addScaledVector(kickDir, kickV);
    b.rFactor = 1;
    b.everSmall = true;
    if (kind === 'black') {
      b.type = 'black_hole'; b.kind = 'bh';
      b.temp = 0; b.lum = 0;
      b.r = schwarzschild(remM);
    } else {
      b.type = 'neutron_star'; b.kind = 'body';
      b.temp = TYPES.neutron_star.temp;
      b.spin = TYPES.neutron_star.spin;
      b.r = trueRadius('neutron_star', remM);   // rFactor was reset just above
      updateLuminosity(b);
    }
    refreshVisual(b);
  }

  /* ---- the event itself --------------------------------------------------- */
  const e = {
    // Duck-typed as a selectable object, so the reticle, the label pass, follow
    // and frame-on all treat a remnant cloud like any other thing in the sky.
    id: eid, kind: 'snr', alive: true,
    p: pos, v: vel.clone(), t0: sim.time, age: 0, life: plan.life,
    flavour: plan.flavour, label: plan.label, story: plan.story,
    origin: b.name,
    ni: mNi, rise: plan.rise, plateau: plan.plateau, tPlat: plan.tPlat,
    breakout: plan.breakout * Math.max(foe, 0.02),
    eKin: eKin, ejM: ejM,
    vShock: shell ? shell.vMax : 1e-6,
    vBulk: shell ? shell.vMean : 0,
    // Braking timescale, set so a fast shell and a slow one both stall at about
    // the same size rather than a Type Ia flying ten times further out.
    brakeTau: SN_STALL / Math.max(shell ? shell.vMax : 1e-6, 1e-6),
    radius: r0,
    hit: new Set([b.id]),
    lum: 0, peak: 0, name: plan.label,
    // Core temperature, and whether the player has taken hold of it. Left alone
    // it just tracks the cooling photosphere.
    coreT: snPhotoT(0), held: false,
    m: ejM, r: r0, cloud: null,
    lightColor: new THREE.Color(1, 1, 1),
    obj: null
  };
  buildSNVisual(e);
  supernovae.push(e);
  while (supernovae.length > SN_MAX) disposeSN(supernovae.shift());

  fx.flash(pos, r0 * 8, [255, 244, 224], 1);
  return plan;
}

/**
 * The blast front sweeps outward at the speed of the fastest ejecta. A body it
 * reaches intercepts the slice of the shell its own disc covers — a fraction
 * r²/4d² of the whole thing — and takes that share of both the momentum and
 * the energy.
 *
 * Whether it survives is a straight comparison against its gravitational
 * binding energy, (3/5)GM²/R. At one AU a supernova delivers a couple of
 * hundred times what it takes to unbind the Earth, and it still exceeds it out
 * past ten AU, which is why nothing in the neighbourhood lives through this.
 */
function snSweep(e) {
  // No early-out on e.hit.size: it keeps the ids of bodies the blast already
  // destroyed, so comparing it against the live count bails out far too soon.
  if (e.ejM <= 0) return;
  let doomed = null;
  const bodies = sim.bodies;

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (!b.alive || e.hit.has(b.id) || b.born > e.t0) continue;
    const dx = b.p.x - e.p.x, dy = b.p.y - e.p.y, dz = b.p.z - e.p.z;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 > e.radius * e.radius) continue;
    e.hit.add(b.id);

    const d = Math.sqrt(d2);
    const rb = Math.max(b.r, 1e-9);
    const f = d <= rb ? 1 : clamp(rb * rb / (4 * d * d), 0, 1);
    if (f <= 0) continue;

    // ---- the shove
    if (d > 1e-12 && b.m > 0) {
      // An inelastic sweep can never push a body faster than the flow doing the
      // pushing, so cap it there rather than letting a grain of dust go relativistic.
      const dv = Math.min(f * e.ejM * e.vBulk / b.m, e.vBulk);
      b.v.x += dx / d * dv; b.v.y += dy / d * dv; b.v.z += dz / d * dv;
    }

    // ---- the damage
    if (b.kind !== 'body') continue;                    // holes have nothing to lose
    const eDep = f * e.eKin;
    const bind = 0.6 * G * b.m * b.m / rb;
    if (TYPES[b.type].star) continue;                   // a star is shocked, but survives
    if (snSet.vaporize && eDep > bind) {
      (doomed || (doomed = [])).push([b, eDep]);
    } else if (eDep > bind * 0.04) {
      // Not destroyed, but the blast peels off whatever it could unbind.
      const strip = Math.min(clamp(eDep / bind, 0, 0.6) * b.m, b.m * 0.6);
      const n = Math.min(90, parts.free.length);
      if (n > 3 && strip > 0) {
        const v = Math.min(Math.sqrt(2 * eDep / Math.max(strip, 1e-12)), e.vBulk);
        blastShell(b.p, b.v, n, strip, { vMean: v, r0: visRadius(b) * 1.3, hot: [255, 220, 170], cool: [120, 96, 84], coolDays: 6 });
        b.m -= strip;
        b.r = natRadius(b);
        b.glowPulse = 1;
        scaleVisual(b);
        toast(b.name + ' was stripped bare by the blast wave');
      }
    }
  }

  if (!doomed) return;
  for (const [b, eDep] of doomed) vaporizeBody(b, e, eDep);
  compact();
}

/** Nothing survives more energy than holds it together. Turn it into matter. */
function vaporizeBody(b, e, eDep) {
  const n = Math.min(160, parts.free.length);
  if (n > 3) {
    const v = Math.min(Math.sqrt(2 * eDep / Math.max(b.m, 1e-12)), Math.max(e.vBulk, 1e-6));
    blastShell(b.p, b.v, n, b.m, {
      vMean: v, r0: Math.max(visRadius(b), 1e-9),
      hot: [255, 230, 190], cool: [150, 92, 70], coolDays: 12, sizeMin: 1.2, sizeMax: 6
    });
  }
  fx.flash(b.p, visRadius(b) * 9, [255, 226, 180], 0.9);
  toast(b.name + ' was vaporised by the shock wave');
  if (sim.selected === b) sim.selected = null;
  if (sim.follow === b) sim.follow = null;
  removeBody(b);
}

/**
 * Bolometric light curve, in erg/s.
 *
 * The core is Nadyozhin's (1994) rate for the nickel-56 → cobalt-56 → iron-56
 * chain, which is where essentially all of a supernova's light comes from:
 *
 *   L(t) = M_Ni/M☉ · (6.45e43·e^(−t/8.8) + 1.45e43·e^(−t/111.3))   erg/s
 *
 * The factor in front of it is photon diffusion — the light has to random-walk
 * out through an envelope that is still opaque, which is why a supernova takes
 * two or three weeks to reach peak instead of flashing instantly.
 */
function snLuminosity(e) {
  const t = Math.max(e.age, 0);
  let L = 0;
  if (e.ni > 0) {
    const decay = e.ni * (6.45e43 * Math.exp(-t / 8.8) + 1.45e43 * Math.exp(-t / 111.3));
    L += decay * (1 - Math.exp(-Math.pow(t / e.rise + 1e-9, 1.8)));
  }
  if (e.plateau > 0 && t < e.tPlat) {
    L += e.plateau * (1 - Math.exp(-t / 1.5)) * (1 - 0.55 * Math.pow(t / e.tPlat, 6));
  }
  // Shock breakout: a few hours of X-rays as the blast finally reaches the
  // surface. It is over almost before it starts, and it is by far the brightest
  // moment the star will ever have.
  L += e.breakout * Math.exp(-t / 0.14);
  return L / ERG_S_PER_LSUN;
}

/* ---------------------------------------------------- the cloud as an object */
/*
 * A remnant is not just a light show: it is a few solar masses of enriched gas
 * and dust, and it is where the NEXT generation of stars comes from. Real
 * remnants sweep up the surrounding medium, and the compressed shell collapses
 * into new stars — our own Solar System is thought to have formed in one, which
 * is why there is short-lived supernova iron in the oldest meteorites.
 *
 * So a cloud can be selected and squeezed. Everything below works from the real
 * grains: their mass, their centre of mass, their net angular momentum. Nothing
 * is invented for the collapse — the star and its planets are made out of
 * exactly the matter that was floating there.
 */

/**
 * Measure every live cloud in two passes over the pool: the first for mass,
 * centre of mass and bulk velocity, the second — which needs the centre — for
 * extent and angular momentum.
 */
function refreshClouds() {
  if (!supernovae.length) return;
  const byId = new Map();
  for (const e of supernovae) {
    byId.set(e.id, { mass: 0, n: 0, cx: 0, cy: 0, cz: 0, vx: 0, vy: 0, vz: 0,
                     radius: 0, lx: 0, ly: 0, lz: 0 });
  }

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const c = byId.get(parts.src[k]);
    if (!c) continue;
    const k3 = k * 3, m = parts.m[k];
    c.mass += m; c.n++;
    c.cx += parts.pos[k3] * m; c.cy += parts.pos[k3 + 1] * m; c.cz += parts.pos[k3 + 2] * m;
    c.vx += parts.vel[k3] * m; c.vy += parts.vel[k3 + 1] * m; c.vz += parts.vel[k3 + 2] * m;
  }
  for (const c of byId.values()) {
    if (c.mass <= 0) continue;
    c.cx /= c.mass; c.cy /= c.mass; c.cz /= c.mass;
    c.vx /= c.mass; c.vy /= c.mass; c.vz /= c.mass;
  }

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const c = byId.get(parts.src[k]);
    if (!c || c.mass <= 0) continue;
    const k3 = k * 3, m = parts.m[k];
    const rx = parts.pos[k3] - c.cx, ry = parts.pos[k3 + 1] - c.cy, rz = parts.pos[k3 + 2] - c.cz;
    const d = Math.sqrt(rx * rx + ry * ry + rz * rz);
    if (d > c.radius) c.radius = d;
    // L = Σ m (r × v), measured in the cloud's own frame
    const wx = parts.vel[k3] - c.vx, wy = parts.vel[k3 + 1] - c.vy, wz = parts.vel[k3 + 2] - c.vz;
    c.lx += m * (ry * wz - rz * wy);
    c.ly += m * (rz * wx - rx * wz);
    c.lz += m * (rx * wy - ry * wx);
  }

  for (const e of supernovae) {
    const c = byId.get(e.id);
    e.cloud = c;
    e.m = c.mass;
    e.r = Math.max(e.radius, c.radius);
  }
}

/**
 * Squeeze or release the cloud, homologously — every grain's distance from the
 * centre and its speed relative to the centre scale by the same factor, which
 * is how self-similar collapse actually behaves.
 *
 * The link to temperature is the virial theorem: a self-gravitating ball in
 * equilibrium has kT ≈ GMμm_H/R, so its core temperature is inversely
 * proportional to its radius. Halve the radius and you double the temperature.
 * That is why squeezing a cloud heats its middle, and why a protostar goes on
 * getting hotter all the way down until fusion finally starts.
 */
function contractCloud(e, factor) {
  if (!(factor > 0) || !e.cloud || e.cloud.mass <= 0) return;
  const c = e.cloud;
  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k] || parts.src[k] !== e.id) continue;
    const k3 = k * 3;
    parts.pos[k3] = c.cx + (parts.pos[k3] - c.cx) * factor;
    parts.pos[k3 + 1] = c.cy + (parts.pos[k3 + 1] - c.cy) * factor;
    parts.pos[k3 + 2] = c.cz + (parts.pos[k3 + 2] - c.cz) * factor;
    parts.vel[k3] = c.vx + (parts.vel[k3] - c.vx) * factor;
    parts.vel[k3 + 1] = c.vy + (parts.vel[k3 + 1] - c.vy) * factor;
    parts.vel[k3 + 2] = c.vz + (parts.vel[k3 + 2] - c.vz) * factor;
  }
  e.radius *= factor;
  c.radius *= factor;
  e.r = Math.max(e.radius, c.radius);
  parts.dirty = true;
}

/** Set the core temperature, contracting to match. Ignites at ten million K. */
function setCloudTemp(e, T) {
  const want = clamp(T, 10, IGNITE_T);
  const prev = Math.max(e.coreT, 1e-6);
  e.held = true;
  contractCloud(e, prev / want);
  e.coreT = want;
  return want >= IGNITE_T;
}

/**
 * Slow the shells down. The damping is applied to each grain's velocity
 * *relative to its own cloud's bulk motion*, which means it is purely internal:
 * the remnant stops spreading but the total momentum of the simulation does not
 * change by a gram. (A real shell really does hand its momentum to the gas it
 * sweeps up — but there is no such gas here to hand it to, so taking it out of
 * the books instead would just quietly break conservation.)
 */
function brakeClouds(simDt) {
  if (simDt <= 0 || !supernovae.length) return;
  const braking = new Map();
  for (const e of supernovae) {
    if (!e.cloud || e.cloud.n === 0) continue;
    const k = Math.exp(-simDt / Math.max(e.brakeTau, 1e-6));
    if (k > 0.99999) continue;
    braking.set(e.id, { k: k, c: e.cloud });
    e.vShock *= k;
  }
  if (!braking.size) return;

  for (let i = 0; i < P_MAX; i++) {
    if (!parts.on[i]) continue;
    const b = braking.get(parts.src[i]);
    if (!b) continue;
    const c = b.c, k = b.k, i3 = i * 3;
    parts.vel[i3] = c.vx + (parts.vel[i3] - c.vx) * k;
    parts.vel[i3 + 1] = c.vy + (parts.vel[i3 + 1] - c.vy) * k;
    parts.vel[i3 + 2] = c.vz + (parts.vel[i3 + 2] - c.vz) * k;
  }
  parts.dirty = true;
}

/** Kill every grain belonging to one cloud. Returns the mass removed. */
function disperseCloud(e) {
  let m = 0;
  for (let k = 0; k < P_MAX; k++) {
    if (parts.on[k] && parts.src[k] === e.id) { m += parts.m[k]; killParticle(k); }
  }
  return m;
}

/** What a given amount of collapsing gas would turn into. */
const BROWN_DWARF_MIN = 13 * 317.8;      // 13 Jupiters, where deuterium burns

function cloudForecast(mass) {
  if (mass >= IGNITE_MASS) {
    const mSun = mass / M_SUN;
    const kind = mSun > 8 ? 'blue giant' : mSun > 0.5 ? 'Sun-like star' : 'red dwarf';
    return fmtMass(mass) + ' is enough. Hydrogen ignites and it becomes a ' + kind +
      '. The leftover couple of percent flattens into a disc around it — no planets yet: ' +
      'the disc has to build them, and it will, one at a time, for as long as it lasts.';
  }
  if (mass >= BROWN_DWARF_MIN) {
    return 'Only ' + fmtMass(mass) + '. Below 0.075 M☉ — about eighty Jupiters — hydrogen never ' +
      'catches, and you get a brown dwarf that shines on its own contraction and then slowly fades.';
  }
  return 'Only ' + fmtMass(mass) + ' left. Far too little to light anything; this would settle ' +
    'into a cold lump wrapped in a disc, which will still go on making worlds — with nothing ' +
    'at the centre to warm them.';
}

function discPlanetType(mass, insideIce) {
  if (mass >= 60) return Math.random() < 0.3 ? 'ringed_giant' : 'gas_giant';
  if (mass >= 8) return 'ice_giant';
  if (insideIce) {
    if (mass >= 2.5) return 'super_earth';
    if (mass >= 0.6) return pick(['terrestrial', 'desert_world', 'lava_world']);
    if (mass >= 0.2) return pick(['desert_world', 'moon']);
    return pick(['moon', 'dwarf_planet']);
  }
  if (mass >= 1.2) return pick(['ocean_world', 'ice_world']);
  return pick(['ice_world', 'dwarf_planet']);
}

/**
 * Collapse the cloud into a young star and the disc it was born inside.
 *
 * Mass and momentum both come straight out of the grains, so what appears
 * weighs exactly what the cloud weighed and drifts exactly as it was drifting.
 * Nothing arrives finished, though: a real collapse makes a star and a flat
 * disc, and the planets are built out of that disc over the millions of years
 * that follow. The disc turns in the plane the cloud was already rotating in —
 * that is why every planet in a real system goes round the same way, in nearly
 * the same plane. They inherit the collapsing cloud's angular momentum.
 */
function condenseCloud(e) {
  const c = e.cloud;
  if (!c || c.mass <= 0 || c.n < 3) { toast('There is nothing left of this cloud to collapse'); return false; }
  if (freeSlots() < 1) { toast('Universe is full — clear some bodies first'); return false; }

  const M = c.mass;
  const centre = new THREE.Vector3(c.cx, c.cy, c.cz);
  const drift = new THREE.Vector3(c.vx, c.vy, c.vz);

  // A protoplanetary disc is only a percent or so of the star; ours had a few
  // hundred Earth masses of solid material in it. This is the most the cloud
  // will let leave the star, and all of it goes into the disc.
  const discCap = Math.min(Math.max(M * 0.02, 0), 800);
  const guess = Math.max(M - discCap, 0);
  const canIgnite = guess >= IGNITE_MASS;
  const mSun = guess / M_SUN;
  const coreType = canIgnite
    ? (mSun > 8 ? 'blue_giant' : mSun > 0.5 ? 'sun_like' : 'red_dwarf')
    : discPlanetType(guess, true);

  // How wide the disc is depends on how bright the star will be, so work that
  // out before anything is created. The guess is within a couple of percent of
  // the final mass, which moves the snow line by far less than the jitter does.
  const L = Math.max(luminosityOf(coreType, trueRadius(coreType, guess)), 1e-4);

  // Never starve the star below the ignition mass its type was chosen for.
  let discM = discCap;
  if (canIgnite) discM = Math.min(discM, Math.max(0, M - IGNITE_MASS * 1.02));

  const star = makeBody(coreType, centre, drift, { mass: M - discM, name: 'New ' + e.origin });

  // The disc's pole is the cloud's own spin axis. Without one there is no
  // preferred direction and it has to fall back on the horizontal.
  const normal = new THREE.Vector3(c.lx, c.ly, c.lz);
  if (normal.lengthSq() < 1e-24) normal.set(0, 1, 0); else normal.normalize();

  /* The disc: real material, in the real plane, and the only place this
     system's planets are going to come from. Every world it condenses is paid
     for out of it, so one that has made a Jupiter has that much less left for
     everything further out. Ours reached from inside Mercury's orbit out past
     where the Kuiper belt is now, and it is scaled off the star's brightness
     because a hotter star pushes its snow line further out. */
  if (discM > 0.02) {
    const sq = Math.sqrt(Math.max(L, 0.02));
    const rIn = Math.max(visRadius(star) * 3, 0.28 * AU * sq);
    const rOut = Math.max(rIn * 6, 34 * AU * sq);
    makeDisc(star, { rIn: rIn, rOut: rOut, mass: discM, axis: normal });
  }

  // The grains are spent; the star and its disc are what they became.
  disperseCloud(e);

  /* No momentum correction to make. The star was handed the cloud's own drift
     and the disc rides along with it, so between them they carry exactly what
     the cloud was carrying: drift x (M - discM) + drift x discM. */

  fx.form(star, true);
  e.alive = false;
  disposeSN(e);
  const idx = supernovae.indexOf(e);
  if (idx >= 0) supernovae.splice(idx, 1);

  computeAccel();
  refreshStarCache();
  updateTemperatures();
  // Pull back far enough to show what was just built. The camera was zoomed
  // right in on a collapsing knot; the disc it became is a thousand times wider.
  view.target.copy(centre);
  const span = star.disc ? star.disc.rOut * 2.2 : visRadius(star) * 12;
  if (span > 0) view.dist = clamp(span, MIN_DIST, MAX_DIST);
  sim.follow = null;
  select(star);
  toast(canIgnite
    ? star.name + ' ignited from the cloud' +
      (star.disc ? ', wrapped in the disc its planets will come out of' : '')
    : star.name + ' collapsed but never lit — too little mass to start fusion' +
      (star.disc ? ', but its disc will still build worlds' : ''));
  return true;
}

function updateSupernovae(simDt) {
  refreshClouds();
  brakeClouds(simDt);
  for (let i = supernovae.length - 1; i >= 0; i--) {
    const e = supernovae[i];
    e.age += simDt;
    e.p.addScaledVector(e.v, simDt);
    e.radius += e.vShock * simDt;
    if (snSet.blast) snSweep(e);

    e.lum = snLuminosity(e);
    if (e.lum > e.peak) e.peak = e.lum;

    // Left alone the core temperature just follows the cooling photosphere; once
    // the player takes hold of the slider it is theirs.
    if (!e.held) e.coreT = snPhotoT(e.age);
    const c = kelvinToRGB(e.coreT);
    e.lightColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);

    // Past its bright weeks the interesting number is not how much it shines but
    // how much matter is still there to build something out of.
    e.name = e.lum > 100
      ? e.label + ' · ' + fmtLum(e.lum)
      : e.label + ' remnant · ' + fmtMass(e.m);

    updateSNVisual(e);
    // The light fades in months; the cloud itself lasts as long as it has grains,
    // so it stays there to be selected and squeezed long after it goes dark.
    if (e.age > e.life && (!e.cloud || e.cloud.n === 0)) {
      e.alive = false;
      disposeSN(e);
      supernovae.splice(i, 1);
    }
  }
}

/* ---------------------------------------------------------- remnant visuals */

const SN_VERT = `
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vN = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vV = -mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const SN_FRAG = `
  uniform vec3 uInner;
  uniform vec3 uOuter;
  uniform float uOp;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    // Limb brightening. The ejecta is a thin skin, so a sightline near the edge
    // passes through far more of it than one straight through the middle —
    // which is why real remnants look like rings rather than filled discs.
    float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(clamp(f, 0.0, 1.0), 3.0);
    gl_FragColor = vec4(mix(uInner, uOuter, clamp(f, 0.0, 1.0)) * (rim * 2.2 + 0.03) * uOp, 1.0);
  }`;

/* Nebulosity. Sized in *world* units rather than screen pixels, so flying
   towards a remnant brings you into a cloud that grows around you instead of a
   swarm of dots that stay the same size however close you get. */
const NEB_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uScale;
  uniform float uFocal;
  varying vec3 vCol;
  void main() {
    vCol = aCol;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = clamp(aSize * uScale * uFocal / max(-mv.z, 1e-6), 2.0, 460.0);
  }`;

const NEB_FRAG = `
  uniform sampler2D uMap;
  uniform float uOp;
  varying vec3 vCol;
  void main() {
    gl_FragColor = vec4(vCol, texture2D(uMap, gl_PointCoord).a * uOp);
  }`;

/**
 * The remnant as a cloud rather than a bubble.
 *
 * Puffs are scattered through a whole volume, not over a shell, so it has an
 * inside as well as an outside — and a lumpy noise field rejects a good share
 * of them so the result is ragged instead of a tidy ball.
 *
 * The colours are deliberately deep and saturated. Additive blending climbs
 * towards white wherever puffs overlap, so any colour that starts out pale is
 * bleached away exactly where the cloud is thickest and most interesting.
 * Starting deep buys several layers of overlap before the hue washes out.
 */
function nebulaCloud(variant, n, blue) {
  const key = 'neb:' + variant + ':' + n + (blue ? ':b' : '');
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const lump = fbm(hashStr('lump' + variant), 4, 2, 4);
  const hue = fbm(hashStr('hue' + variant), 3, 2, 3);

  /* A kilonova's debris is a different beast from a supernova's: far hotter to
     begin with and stuffed with freshly built heavy elements, so it starts out
     a fierce electric blue instead of the gold and rose of an ordinary remnant. */
  const GOLD = blue ? [0.30, 0.80, 1.00] : [1.00, 0.60, 0.16];
  const EMBER = blue ? [0.10, 0.36, 1.00] : [1.00, 0.28, 0.06];
  const ROSE = blue ? [0.55, 0.42, 1.00] : [0.98, 0.20, 0.55];
  const AZURE = blue ? [0.72, 0.94, 1.00] : [0.35, 0.62, 1.00];

  const pos = [], col = [], siz = [];
  let guard = 0;
  while (siz.length < n && guard++ < n * 40) {
    const z = rng() * 2 - 1, ph = rng() * TAU, s = Math.sqrt(Math.max(0, 1 - z * z));
    const dx = s * Math.cos(ph), dy = s * Math.sin(ph), dz = z;
    const u = ((Math.atan2(dy, dx) / TAU) + 1) % 1;
    const v = Math.acos(clamp(dz, -1, 1)) / Math.PI;

    const lb = clamp(lump(u, v) * 1.9 - 0.5, 0, 1);
    if (rng() > 0.08 + lb * 1.15) continue;   // leave gaps, or it is just a ball

    /* A hollow, lumpy shell rather than a filled ball. This is what a remnant
       physically is — the blast sweeps the middle empty — and it also fixes the
       worst artefact of additive blending: a filled ball has its longest
       sightline dead centre, so the middle always clips to white and the whole
       thing bands into a bullseye. With the centre empty there is no such peak. */
    const r = (0.42 + Math.pow(rng(), 0.75) * 0.58) * (0.72 + lb * 0.5);
    // Break the radial regularity so the shell never reads as a smooth surface.
    const off = () => (rng() - 0.5) * 0.16;
    pos.push(dx * r + off(), dy * r + off(), dz * r + off());

    const h = clamp(hue(u, v) * 1.6 - 0.3, 0, 1);
    let c = h < 0.5 ? mix(EMBER, GOLD, h * 2) : mix(GOLD, ROSE, (h - 0.5) * 2);
    // The inner face of the shell is still being lit from inside, so it runs
    // hot and blue; the outer edge has cooled to red.
    c = mix(c, AZURE, clamp(1.5 - r * 1.9, 0, 1) * 0.75);
    const j = 0.80 + rng() * 0.4;
    col.push(c[0] * j, c[1] * j, c[2] * j);
    // Big enough to overlap heavily. Small puffs stay visibly separate and the
    // result reads as scattered confetti; only once they run into each other do
    // they stop being blobs and start being cloud.
    siz.push(0.165 + Math.pow(rng(), 2) * 0.45);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildSNVisual(e) {
  const g = new THREE.Group();

  const shell = new THREE.Mesh(SPHERE, new THREE.ShaderMaterial({
    uniforms: {
      uInner: { value: new THREE.Color(1, 0.45, 0.24) },
      uOuter: { value: new THREE.Color(0.62, 0.8, 1) },
      uOp: { value: 1 }
    },
    vertexShader: SN_VERT, fragmentShader: SN_FRAG,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  }));
  shell.renderOrder = 4;
  g.add(shell);

  const neb = new THREE.Points(nebulaCloud((e.id || 1) % 4, 700, e.flavour === 'kilo'), new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: TEX_PUFF }, uOp: { value: 0 },
      uScale: { value: 1 }, uFocal: { value: 1 }
    },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  neb.frustumCulled = false;
  neb.renderOrder = 3;
  g.add(neb);

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_HALO, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  core.renderOrder = 8;
  g.add(core);

  const boom = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  boom.renderOrder = 9;
  g.add(boom);

  scene.add(g);
  e.obj = g; e.shell = shell; e.neb = neb; e.core = core; e.boom = boom;
}

function updateSNVisual(e) {
  if (!e.obj) return;
  e.obj.position.copy(e.p);
  const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));

  // The glow fades over months, but never quite to nothing while there is still
  // gas here — the cloud has to stay findable to be worth selecting.
  const alive = e.cloud && e.cloud.n > 0;
  const fade = Math.max(clamp(Math.exp(-e.age / 90), 0, 1), alive ? 0.12 : 0);
  const big = e.radius / wpp > 3;

  // For the first couple of weeks the ejecta really is dense and opaque, and a
  // smooth expanding surface is the honest picture. After that it thins out and
  // becomes cloud, so the fireball is handed over completely — a translucent
  // sphere that outstays its welcome is what made this look like a soap bubble.
  const puff = clamp((e.age - 10) / 40, 0, 1);
  const skin = (1 - puff) * fade;
  e.shell.scale.setScalar(Math.max(e.radius, 1e-6));
  e.shell.material.uniforms.uOp.value = skin * 0.85 * SN_GLOW;
  e.shell.material.uniforms.uInner.value.copy(e.lightColor);
  e.shell.visible = skin > 0.012 && big;

  if (e.neb) {
    const u = e.neb.material.uniforms;
    // Sized to the debris that is actually out there (e.r, set by refreshClouds
    // from the real grain positions), not to the fireball shell — the ejecta
    // outruns the shell by half again, so scaling to e.radius leaves the cloud
    // as a small blob sitting in the middle of its own wreckage.
    const R = Math.max(e.r || 0, e.radius, 1e-6);
    // The puff positions are unit-scale, so the object carries the size. uScale
    // then makes each puff's *width* grow with it — the uniform alone only ever
    // resized the dots, which left the whole cloud a one-gigametre speck.
    e.neb.scale.setScalar(R);
    u.uScale.value = R;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Each puff contributes very little on purpose. Dozens of them stack up
    // along any one sightline and additive blending saturates to flat white
    // fast, so the cloud has to be built from many faint layers rather than a
    // few strong ones — otherwise the colour is lost exactly where it matters.
    u.uOp.value = puff * Math.max(fade, 0.16) * 0.16 * SN_GLOW;
    e.neb.visible = puff > 0.01 && big;
  }

  // The glowing photosphere, as bright as the light curve says — with a pixel
  // floor, because the brightest thing in the sky should never be invisible.
  const lit = e.peak > 0 ? Math.pow(clamp(e.lum / e.peak, 0, 1), 0.4) : 0;
  e.core.visible = lit > 0.012;
  if (e.core.visible) {
    // Opacity is already almost solid, so the only room left to make the flash
    // brighter is to widen it — a source three times as luminous covers about
    // sqrt(3) times the radius.
    const wide = Math.sqrt(SN_GLOW);
    e.core.scale.setScalar(Math.max(e.radius * 0.5, 26 * wpp) * (0.35 + lit * 0.95) * wide);
    e.core.material.color.copy(e.lightColor);
    e.core.material.opacity = Math.min(1, lit * 0.95 * SN_GLOW);
  }

  const bo = clamp(1 - e.age / 1.2, 0, 1);
  e.boom.visible = bo > 0.012;
  if (e.boom.visible) {
    e.boom.material.opacity = Math.min(1, bo * bo * SN_GLOW);
    e.boom.scale.setScalar(Math.max(e.radius * 2.2, 90 * wpp) * (0.5 + (1 - bo) * 2.4) * Math.sqrt(SN_GLOW));
  }
}

function disposeSN(e) {
  if (!e.obj) return;
  scene.remove(e.obj);
  e.obj.traverse(o => { if (o.material) o.material.dispose(); });
  e.obj = null; e.shell = null; e.neb = null; e.core = null; e.boom = null;
}


function clearSupernovae() {
  for (const e of supernovae) { e.alive = false; disposeSN(e); }
  supernovae.length = 0;
}

/* ------------------------------------------------------------ growing old  */

/**
 * Burn fuel. Real stars take millions of years to do this, so the whole thing
 * is off unless you ask for it and runs at whatever multiple of real time you
 * pick — that multiplier is the only unphysical number in here.
 */
function ageStars(dt) {
  const boost = Math.pow(10, snSet.ageRate);
  let dying = null;
  for (const b of sim.bodies) {
    if (b.kind !== 'body') continue;
    const def = TYPES[b.type];
    if (!def.star || def.brown || def.surf === 'neutron' || def.surf === 'dwarfstar') continue;
    b.age += dt * boost;
    if (b.age >= msLifetime(b.m / M_SUN)) (dying || (dying = [])).push(b);
  }
  if (!dying) return;
  for (const b of dying) {
    if (!b.alive) continue;
    const name = b.name;
    if (b.m / M_SUN >= snSet.ccMass && snSet.on) {
      const p = goSupernova(b);
      toast(p ? name + ' ran out of fuel and went ' + p.label + '!' : name + ' burned out');
    } else {
      shedEnvelope(b);
    }
  }
}

/**
 * A star too light to collapse a core ends far more gently, but just as
 * finally: it swells up, coughs its outer layers off at about 20 km/s as a
 * planetary nebula, and leaves its naked carbon–oxygen core behind as a white
 * dwarf. How much core is left follows the observed initial-final mass
 * relation (Kalirai et al. 2008), M_wd ≈ 0.109·M + 0.394 M☉ — so the Sun will
 * end up as roughly half a solar mass of slowly cooling crystal.
 */
function shedEnvelope(b) {
  const mSun = b.m / M_SUN;
  const wd = Math.min(clamp(0.109 * mSun + 0.394, 0.17, 1.38) * M_SUN, b.m);
  const env = b.m - wd;
  const name = b.name;
  const oldR = Math.max(visRadius(b), 1e-9);

  if (env > 0) {
    const n = Math.min(420, parts.free.length);
    if (n > 3) {
      // The envelope leaves from the swollen red-giant surface, out around an
      // AU, not from where the main-sequence star's photosphere used to be.
      // Real nebulae drift off at 20–40 km/s, but they are pushed by radiation
      // pressure over thousands of years rather than thrown; a purely ballistic
      // launch has to clear the local escape speed or it just rains back down.
      const rAGB = Math.max(1.2 * AU, oldR * 1.5);
      const vEsc = Math.sqrt(2 * G * settings.gravity * b.m / rAGB);
      blastShell(b.p, b.v, n, env, {
        vMean: Math.max(20 * KMS, vEsc * 1.35), r0: rAGB, coolDays: 400,
        hot: [150, 255, 226], cool: [255, 126, 178], sizeMin: 1.4, sizeMax: 5.5
      });
    }
  }

  b.m = wd;
  b.type = 'white_dwarf';
  b.kind = 'body';
  b.age = 0;
  // A freshly exposed core is ferociously hot; it has nothing left to burn and
  // will spend the rest of the universe's life cooling off.
  b.temp = 60000;
  b.spin = TYPES.white_dwarf.spin;
  b.rFactor = 1;
  b.r = trueRadius('white_dwarf', wd);
  updateLuminosity(b);
  refreshVisual(b);
  fx.flash(b.p, oldR * 30, [170, 255, 230], 0.8);
  toast(name + ' shed its envelope and became a white dwarf');
}

/* ============================================================ tidal forces  */

/**
 * Inside the fluid Roche limit a satellite can't hold itself together against
 * the tide, and it spreads into a ring of rubble. This is why Saturn has rings
 * and why Roche's limit matters at all.
 */
/**
 * Fluid Roche limit for satellite `s` around primary `P`.
 *
 * Deliberately computed from TRUE radii, not the exaggerated drawn ones — using
 * drawn radii would scale the limit up with them and shred genuine moons like
 * Io. The floor keeps the zone just outside whatever is actually on screen, so
 * the effect stays visible when bodies are drawn larger than life.
 */
function rocheLimit(P, s) {
  const rP = P.r, rS = s.r;
  const densRatio = (P.m / (rP * rP * rP)) / (s.m / (rS * rS * rS));
  return Math.max(
    2.44 * rP * Math.cbrt(densRatio),
    (visRadius(P) + visRadius(s)) * 1.5
  );
}

/*
 * Crossing the Roche limit is not a switch, it is a process — which is exactly
 * what you watch happen to a comet falling into Jupiter. So a body inside the
 * limit does two things at once, both of them harder the deeper in it is:
 *
 *   1. It is STRIPPED. The tide lifts material off the side facing the primary
 *      and off the far side too, and that material goes straight into orbit as
 *      ring dust. The body genuinely loses the mass — it is handed to real
 *      particles, so nothing is created or destroyed.
 *
 *   2. It HEATS UP inside. The tide kneads it, the flexing turns into heat, and
 *      the inside gets hotter the whole time it stays there. This is why Io has
 *      four hundred volcanoes and why Europa has an ocean under its ice.
 *
 * Only once it has lost most of itself — or falls right to the bottom of the
 * limit — does it finally come apart into fragments.
 */

const STRIP_SHARE = 0.55;    // fraction of its own mass a body can shed before it breaks up
const TIDE_T_MAX = 32000;    // K — how hot tidal kneading alone can drive a core
const TIDE_COOL = 0.006;     // per day, how fast the extra heat leaks away again

/** How deep inside the Roche limit a satellite is: 0 at the edge, 1 at the surface. */
function tideStress(P, s, d, roche) {
  const touch = visRadius(P) + visRadius(s);
  if (d >= roche) return 0;
  const span = Math.max(roche - touch, 1e-9);
  return clamp((roche - d) / span, 0, 1);
}

function updateTides(dt) {
  const bs = sim.bodies;
  let doomed = null, doomedP = null, doomedD = 0;

  for (let i = 0; i < bs.length; i++) {
    const s = bs[i];
    if (!s.alive || s.kind !== 'body') continue;
    const sdef = TYPES[s.type];
    // Stars and anything genuinely massive hold themselves together by their
    // own gravity far better than a moon does; rubble has already been shredded.
    const immune = sdef.star || s.m > 40 || s.disrupted;

    // Find the primary raising the biggest tide on this body.
    let best = null, bestX = 0, bestD = 0;
    for (let j = 0; j < bs.length; j++) {
      const P = bs[j];
      if (P === s || !P.alive || P.m < s.m * 12) continue;
      const d = s.p.distanceTo(P.p);
      const roche = rocheLimit(P, s);
      if (d >= roche) continue;
      const x = tideStress(P, s, d, roche);
      if (x > bestX) { bestX = x; best = P; bestD = d; }
    }

    s.tideX = bestX;
    s.tidePrimary = best;

    /* ---- heat. Applies to everything, immune or not: a star being squeezed by
       a black hole is not exempt from being kneaded, it just does not crumble. */
    if (settings.tideHeat && bestX > 0) {
      const ceiling = Math.max(baseCoreT(sdef, s.m), TIDE_T_MAX * Math.pow(bestX, 1.4));
      // Approach the ceiling rather than climbing forever — the hotter it gets,
      // the faster it radiates the difference back out.
      s.coreT += (ceiling - s.coreT) * clamp(0.05 * bestX * dt, 0, 0.6);
    }

    if (!best || immune || !settings.strip) continue;

    /* ---- strip. Nothing at all right at the edge, everything at the bottom. */
    const rate = 0.045 * settings.stripRate * Math.pow(bestX, 2.2);
    const loss = Math.min(s.m * rate * dt, s.m * 0.4);
    if (loss > 0) {
      s.m -= loss;
      s.stripped += loss;
      s.stripPending += loss;
      s.r = natRadius(s);
      scaleVisual(s);
      // Release the dust in bursts rather than one grain per step, so a handful
      // of particles carries a visible amount of matter instead of nothing.
      if (s.stripPending > s.m0 * 0.02) {
        const put = ringEjecta(s.p, s.v, best, 40, s.stripPending, 0.10,
          [255, 228, 196], [150, 138, 128]);
        s.stripPending -= put;
        if (!s.stripToast) {
          s.stripToast = 1;
          toast(s.name + ' is being torn at by ' + best.name + '’s tides');
        }
      }
    }

    // Down to a stub, or right down on the primary: it finally comes apart.
    if (s.stripped >= s.m0 * STRIP_SHARE || bestX > 0.97) {
      if (!doomed) { doomed = s; doomedP = best; doomedD = bestD; }
    }
  }

  // One break-up per step is plenty — each one spends particles and body slots.
  if (doomed) tidalDisrupt(doomed, doomedP, doomedD);
}

function tidalDisrupt(s, P, d) {
  const frags = Math.min(clamp(Math.round(7 + Math.random() * 7), 6, 14), freeSlots());
  if (frags < 3) return;                       // no room: leave the moon intact

  // Most of a shredded moon becomes ring material, laid onto its own orbit.
  const dust = ringEjecta(s.p, s.v, P, 560, s.m * 0.55, 0.4, [232, 240, 255], [126, 122, 116]);
  const each = (s.m - dust) / frags;
  const orbitDir = s.v.clone().sub(P.v);
  const speed = orbitDir.length();
  const made = [];
  for (let i = 0; i < frags; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    // spread the fragments along the orbit so they stretch into an arc
    const along = (i / frags - 0.5) * 0.6;
    const radial = s.p.clone().sub(P.p).normalize();
    const tang = orbitDir.clone().normalize();
    const pos = s.p.clone()
      .addScaledVector(tang, d * along)
      .addScaledVector(radial, visRadius(s) * rnd(-2, 2));
    const vel = P.v.clone()
      .addScaledVector(tang, speed * rnd(0.97, 1.03))
      .addScaledVector(radial, speed * rnd(-0.02, 0.02));
    // Fragments carry the heat the parent body built up on its way in.
    const fm = Math.max(each, 1e-7);
    const ft = each > 0.004 ? 'moon' : 'asteroid';
    made.push(makeBody(ft, pos, vel,
      { mass: fm, name: 'Ring frag', rubble: true, coreT: s.coreT,
        // Chips off a loose body are loose too — see spawnDebris.
        r: trueRadius(ft, fm) * (s.rFactor > 0 ? s.rFactor : 1) }));
  }
  // The ring should drift exactly as the moon did, not gain a net kick.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, s.v.clone().multiplyScalar(tot));
  fx.flash(s.p, visRadius(s) * 5, [255, 240, 220], 0.8);
  toast(s.name + ' was torn apart by ' + P.name + '’s tides');
  if (sim.selected === s) select(null);
  removeBody(s);
  s.disrupted = true;
  compact();
}

/* ========================================================= spinning apart   */
/*
 * Spin something fast enough and it throws itself to pieces.
 *
 * A rotating body is held together by its own gravity and pulled apart by the
 * centrifugal effect at its equator. Once the equator is turning faster than
 * orbital speed, whatever is sitting there is no longer resting on anything —
 * it is in orbit, and it leaves. The body sheds its outer layers from the
