 * equator, in the plane it is spinning in, and keeps shedding until only the
 * dense core it could never fling off is left.
 *
 * This is not invented: it is why fast-rotating asteroids like Bennu are
 * losing material from their equators, and why the very fastest of them cannot
 * exist above about a two-hour rotation without falling apart.
 */

/* One turn in 0.02 hours — 72 seconds. Far, far past break-up for anything
   bigger than a boulder, which is the point of picking it. */
const SPIN_SHED = 0.02 / 24;      // days

/**
 * The share of a body its core makes up — the part that survives being spun.
 * Earth's iron core is about a third of its mass; a gas giant's rocky core is
 * only a few per cent of it, which is why spinning one apart leaves so little.
 */
function coreFraction(def) {
  if (def.star) return 0.28;
  if (def.surf === 'iron') return 0.92;
  if (GASSY_SURF.has(def.surf)) return 0.05;
  if (def.surf === 'comet' || def.surf === 'rock') return 0.42;
  return 0.33;
}

/** What is left when a body has thrown everything else away. */
function bareCore(b) {
  const def = TYPES[b.type];
  if (def.star || b.kind !== 'body') return null;
  // The game already has names for both of these: a gas giant stripped to its
  // core IS a chthonian world, and a rocky world stripped to its core is an
  // iron world.
  if (GASSY_SURF.has(def.surf)) return 'chthonian';
  if (def.surf !== 'iron' && !def.lumpy) return 'iron_world';
  return null;
}

function updateSpin(dt) {
  const bs = sim.bodies;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!b.alive || b.kind !== 'body') continue;
    const period = Math.abs(b.spin);

    if (period >= SPIN_SHED) { b.shedding = false; continue; }

    // First step over the line: work out how much of it is core and cannot go.
    // A body already ground down to its core keeps the core mass it ended on,
    // so spinning it again does not shave a fresh third off what is left — it
    // only gets a new core once it has been fed back up to well above the old one.
    if (!b.shedding) {
      b.shedding = true;
      if (b.coreM == null || b.m > b.coreM * 2.2) b.coreM = b.m * coreFraction(TYPES[b.type]);
      b.spinPending = 0;
      if (b.m > b.coreM) toast(b.name + ' is spinning itself apart!');
    }
    if (b.m <= b.coreM) continue;

    /* Mass is queued for release first and only leaves the body once particles
       have actually been found to carry it. If the debris pool is full, the
       queue simply stops draining and the body keeps that mass — it is never
       subtracted from one place without arriving in another. */
    const over = clamp(SPIN_SHED / Math.max(period, 1e-9), 1, 40);
    const room = b.m - b.coreM - b.spinPending;
    if (room > 0) b.spinPending += Math.min(room, b.m * 0.45 * over * dt);

    // Released in bursts, so each grain carries a visible amount of matter.
    if (b.spinPending > b.coreM * 0.05) {
      const put = spinShed(b, b.spinPending);
      if (put > 0) {
        b.spinPending -= put;
        b.m -= put;
        b.r = natRadius(b);
        scaleVisual(b);
      }
    }

    if (b.m <= b.coreM * 1.001) {
      const core = bareCore(b);
      if (core && b.type !== core) {
        b.type = core;
        b.rFactor = 1;
        b.r = trueRadius(core, b.m);
        b.coreT = Math.max(b.coreT, baseCoreT(TYPES[core], b.m));
        b.glowPulse = 1;
        updateLuminosity(b);
        refreshVisual(b);
      }
      toast(b.name + ' has nothing left but its core');
      // `shedding` deliberately stays true: the guard above now holds it here
      // until the spin is slowed back down or it is fed more mass.
    }
  }
}

/**
 * Fling material off the equator, in the plane the body is actually spinning
 * in and in the direction it is actually turning — so the wreckage comes off
 * as a flat, one-way disc rather than a sphere of shrapnel.
 *
 * Returns the mass actually placed, which is nothing at all when the debris
 * pool is full — the caller must take that off the body rather than assuming.
 */
function spinShed(b, mass) {
  // The body leans by b.tilt about Z, so its pole is Y turned by that much.
  const axis = new THREE.Vector3(-Math.sin(b.tilt), Math.cos(b.tilt), 0).normalize();
  let u = new THREE.Vector3(0, 0, 1);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(1, 0, 0);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  const rv = Math.max(visRadius(b), 1e-9);
  const vEsc = Math.sqrt(2 * G * settings.gravity * Math.max(b.m, 1e-12) / rv);
  /* The honest equatorial speed. At a 72-second rotation this runs to hundreds
     of km/s and at the slider's floor to thousands, which would put every grain
     outside the simulation inside one frame — so it is capped. The cap is the
     one dishonest number here, and it exists purely so you can watch it. */
  const vEq = TAU * b.r / Math.max(Math.abs(b.spin), 1e-9);
  const vTop = clamp(vEq, vEsc * 1.05, vEsc * 22);
  // Circular speed just above the surface. Material lifting off the equator at
  // break-up leaves at about this — it is not thrown, it simply stops being
  // held down — so most of it goes into orbit and shears out into a ring, and
  // only the fastest tail gets away. That is how a moon ends up being made out
  // of the wreckage instead of it all just leaving.
  const vOrb = vEsc / Math.SQRT2;
  const dir = b.spin < 0 ? -1 : 1;

  const n = Math.min(150, parts.free.length);
  if (n <= 0 || mass <= 0) return 0;
  const each = mass / n;
  const hot = [255, 232, 190], cool = [122, 104, 92];

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;
    const th = rnd(0, TAU);
    const ct = Math.cos(th), st = Math.sin(th);
    // Position on the equator, thrown out a little and barely off the plane.
    const outX = u.x * ct + w.x * st, outY = u.y * ct + w.y * st, outZ = u.z * ct + w.z * st;
    const tanX = (-u.x * st + w.x * ct) * dir, tanY = (-u.y * st + w.y * ct) * dir, tanZ = (-u.z * st + w.z * ct) * dir;
    const off = rv * rnd(1.1, 1.5);
    const lift = rv * rnd(-0.10, 0.10);

    parts.pos[k3] = b.p.x + outX * off + axis.x * lift;
    parts.pos[k3 + 1] = b.p.y + outY * off + axis.y * lift;
    parts.pos[k3 + 2] = b.p.z + outZ * off + axis.z * lift;

    // Power law: most grains barely clear the surface, a few really fly.
    const sp = lerp(vOrb * 1.02, vTop, Math.pow(Math.random(), 2.4)) * rnd(0.94, 1.06);
    // Mostly tangential — it is lifting off, not being blown — with a nudge out.
    const rad = sp * rnd(0.02, 0.10);
    parts.vel[k3] = b.v.x + tanX * sp + outX * rad;
    parts.vel[k3 + 1] = b.v.y + tanY * sp + outY * rad;
    parts.vel[k3 + 2] = b.v.z + tanZ * sp + outZ * rad;

    const bs = rnd(1.6, 7);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = COOL_IMPACT * 0.6;
    parts.src[k] = -1;

    const ww = mix(hot, [255, 255, 255], Math.random() * 0.5);
    parts.warm[k3] = ww[0] / 255; parts.warm[k3 + 1] = ww[1] / 255; parts.warm[k3 + 2] = ww[2] / 255;
    parts.cool[k3] = cool[0] / 255; parts.cool[k3 + 1] = cool[1] / 255; parts.cool[k3 + 2] = cool[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/* ========================================================== temperature     */

/**
 * Internal heat leaks away towards whatever the body's own size and make-up can
 * hold — quickly for a pebble, hardly at all for a gas giant. Run on rendered
 * frames rather than physics substeps: this is a slow process and does not need
 * the accuracy.
 */
function coolCores(simDt) {
  if (simDt <= 0) return;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (b.kind !== 'body' || b.coreT == null) continue;
    const def = TYPES[b.type];
    if (def.star) continue;                    // a star makes its own heat
    const floor = baseCoreT(def, b.m);
    if (b.coreT <= floor) { b.coreT = floor; continue; }
    // Small bodies have far more surface per tonne, so they dump heat faster.
    const k = TIDE_COOL / Math.pow(clamp(b.m, 1e-6, 1e5), 0.22);
    b.coreT = floor + (b.coreT - floor) * Math.exp(-k * simDt);
  }
}

function updateTemperatures() {
  const stars = sim.starCache;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (TYPES[b.type].star || b.kind !== 'body') continue;
    let flux = 0;
    for (let s = 0; s < stars.length; s++) {
      const st = stars[s];
      const dAU = Math.max(b.p.distanceTo(st.p) / AU, 1e-4);
      flux += st.lum / (dAU * dAU);
    }
    // 278.6 K is the equilibrium temperature at 1 AU from a Sun-like star
    const eq = flux > 0 ? 278.6 * Math.pow(flux, 0.25) : 3;
    const def = TYPES[b.type];
    // `floorT` is for worlds kept warm by something other than starlight — a
    // greenhouse atmosphere on Venus, an open magma ocean on a lava world.
    const floor = def.floorT != null ? def.floorT : def.glowHot ? 1200 : 3;
    // Heat forced into the middle has to come back out through the surface, so
    // a world being kneaded hard glows on its own even out in the dark.
    const excess = Math.max(0, (b.coreT || 0) - baseCoreT(def, b.m));
    const inner = excess > 0 ? Math.pow(excess, 0.75) * 1.1 : 0;
    b.temp = Math.max(eq, floor, inner);
  }
}

/* ================================================================== renderer */

let renderer, scene, camera, canvasEl;
let SPHERE, SPHERE_LO, SPHERE_HI, SCAR_GEO;
const ringGeoCache = new Map();

/**
 * An annulus normalised so its outer edge sits at radius 1, which lets a single
 * uniform scale place both edges correctly.
 */
function ringGeometry(innerRatio) {
  const key = innerRatio.toFixed(3);
  if (!ringGeoCache.has(key)) ringGeoCache.set(key, new THREE.RingGeometry(innerRatio, 1, 120, 1));
  return ringGeoCache.get(key);
}
let TEX_GLOW, TEX_HALO, TEX_TAIL, TEX_PHOTON, TEX_PUFF;
const texCache = new Map();
const heightCache = new Map();   // painter height fields, for reliefGeometry
const geoCache = new Map();      // displaced star meshes, shared per type
/* How far the granulation pushes the photosphere in and out, as a fraction of
   the radius. Real granules stand only a few hundred km proud of a 700,000 km
   star — invisible — so this is frankly theatrical. It is sized to just break
   the limb: push it much past this and the star turns into a raspberry. */
const STAR_RELIEF = 0.010;
const VIEW = { w: 1, h: 1, dpr: 1 };
const FOV = 55;

const hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/** World units per screen pixel at a given distance — used for pixel floors. */
function worldPerPixel(dist) {
  return 2 * Math.tan(FOV * Math.PI / 360) * dist / VIEW.h;
}

function initScene() {
  canvasEl = document.getElementById('an-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x03030a, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 1e-4, 4e6);

  SPHERE = new THREE.SphereGeometry(1, 44, 30);
  SPHERE_LO = new THREE.SphereGeometry(1, 16, 12);
  // Stars need far more vertices than a planet: at 44 segments the mesh is
  // coarser than the granulation itself, so the displacement would alias into
  // a few random dents instead of resolving individual cells.
  SPHERE_HI = new THREE.SphereGeometry(1, 200, 130);
  // A unit square laid flat on the surface, used for impact scars. Kept small
  // enough that the gap between a flat decal and a curved world never shows.
  SCAR_GEO = new THREE.PlaneGeometry(1, 1);

  TEX_GLOW = new THREE.CanvasTexture(glowTexture(256, 0.16, 0.85));
  TEX_HALO = new THREE.CanvasTexture(glowTexture(256, 0.04, 0.30));
  TEX_TAIL = new THREE.CanvasTexture(tailTexture(256));
  TEX_PHOTON = new THREE.CanvasTexture(photonRingTexture(512));
  TEX_PUFF = new THREE.CanvasTexture(puffTexture(128));

  scene.add(new THREE.AmbientLight(0xffffff, 0.055));

  buildSky();
  buildGrid();
  initParticles();
  initGalaxyStars();
  initPost();
  resize();
}

/** Bright annulus used for a black hole's photon ring. */
function photonRingTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0)');
  g.addColorStop(0.375, 'rgba(255,236,196,0.30)');
  g.addColorStop(0.405, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.435, 'rgba(255,214,140,0.34)');
  g.addColorStop(0.62, 'rgba(255,160,60,0.06)');
  g.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/* ------------------------------------------------------------ shared shaders */

const ATMO_VERT = `
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vWN = normalize(mat3(modelMatrix) * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const ATMO_FRAG = `
  uniform vec3 uColor;
  uniform vec3 uLight;
  uniform float uStrength;
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vWN, 0.0)).xyz);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    float lit = max(dot(normalize(vWN), normalize(uLight)), 0.0);
    gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
  }`;

/* A star's photosphere. The one thing that makes a real star unmistakable is
   limb darkening: the disc is markedly dimmer and redder at the rim than at
   the centre, because a sightline grazing the edge only ever penetrates to the
   high, cool layers of the atmosphere, while one straight down the middle sees
   all the way to the hot gas underneath. That depends on where you are looking
   from, so it cannot be painted into a texture — it has to be done here. */
const STAR_VERT = `
  varying vec2 vUv;
  varying vec3 vSN;
  varying vec3 vVP;
  void main() {
    vUv = uv;
    // The *sphere* normal, not the displaced one: granulation relief must not
    // be allowed to make the limb darkening blotchy.
    vSN = normalize(mat3(modelMatrix) * normalize(position));
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const STAR_FRAG = `
  uniform sampler2D uMap;
  uniform vec3 uTint;
  uniform float uGrey;
  uniform vec3 uEdge;
  uniform vec3 uLimb;
  varying vec2 vUv;
  varying vec3 vSN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vSN, 0.0)).xyz);
    float mu = clamp(dot(N, V), 0.0, 1.0);          // cos(angle to the normal)
    // Quadratic limb-darkening law. The solar coefficients put the very edge
    // at about 30% of central brightness — this is not a subtle effect.
    float d = uLimb.x + uLimb.y * mu + uLimb.z * mu * mu;
    vec3 t = texture2D(uMap, vUv).rgb;
    // A banded star is painted its band colour outright rather than tinted, so
    // the photosphere is flattened to its own relief first and uTint supplies
    // every bit of the hue. All the granulation survives; only the colour goes.
    t = mix(t, vec3(dot(t, vec3(0.299, 0.587, 0.114))), uGrey);
    vec3 c = t * uTint;
    c *= mix(uEdge, vec3(1.0), smoothstep(0.0, 0.6, mu));
    gl_FragColor = vec4(c * max(d, 0.0), 1.0);
  }`;

/* ------------------------------------------------------------------ textures */

function surfaceTexture(type, seed) {
  const def = TYPES[type];
  if (!def.surf) return null;
  const variant = seed % 3;
  const key = type + ':' + variant;
  if (texCache.has(key)) return texCache.get(key);

  // Granulation is fine-grained by nature: at 512 wide a granule is only a
  // dozen pixels across and the relief shading has nothing to bite on, so
  // photosphere stars get twice the resolution of everything else.
  const small = def.group === 'MOONS & DEBRIS' || def.lumpy;
  const fine = def.surf === 'star';
  const W = small ? 256 : fine ? 1024 : 512, H = small ? 128 : fine ? 512 : 256;
  const cv = newCanvas(W, H);
  const rng = mulberry32(hashStr(key));
  const opts = Object.assign({ temp: def.temp, spots: def.spots }, def.opts || {});
  const hgt = SURFACE[def.surf](cv.getContext('2d'), W, H, rng, opts);
  // A painter may hand back the height field it shaded from, so the same
  // relief can also be pushed into the mesh. See reliefGeometry().
  if (hgt) heightCache.set(key, { W: W, H: H, d: hgt });

  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  texCache.set(key, t);
  return t;
}

/**
 * The displaced sphere a star's photosphere is drawn on. Painted shading can
 * fake relief in the middle of a disc but it can never break the silhouette,
 * and stars use an unlit material so nothing else will shade them either.
 * Pushing the granulation into real geometry gets both: a bumpy limb, and
 * cells that slide past one another with true parallax as the star turns.
 *
 * Cached per type+variant — a handful of stars share one geometry, so this is
 * deliberately NOT assigned to b.ownGeo, which would dispose it out from
 * under every other star of the same kind.
 */
function starGeometry(type, seed) {
  const key = type + ':' + (seed % 3);
  if (geoCache.has(key)) return geoCache.get(key);
  surfaceTexture(type, seed);                       // fills heightCache
  const field = heightCache.get(key);
  if (!field) return SPHERE;

  const g = SPHERE_HI.clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const W = field.W, H = field.H, d = field.d;
  let mean = 0;
  for (let i = 0; i < d.length; i++) mean += d[i];
  mean /= d.length;

  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // wrap in u so the vertices on the seam sample the same texel and stay put
    const x = ((Math.round(u * W - 0.5) % W) + W) % W;
    const y = clamp(Math.round(vv * H - 0.5), 0, H - 1);
    // ease the displacement out at the poles, where every vertex is coincident
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (d[y * W + x] - mean) * STAR_RELIEF * fade;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  g.computeVertexNormals();
  geoCache.set(key, g);
  return g;
}

function cachedTexture(key, make) {
  if (texCache.has(key)) return texCache.get(key);
  const t = new THREE.CanvasTexture(make());
  t.encoding = THREE.sRGBEncoding;
  texCache.set(key, t);
  return t;
}

/** Deform a sphere into a believable irregular body (asteroids, comet nuclei). */
function lumpyGeometry(seed, amount, base) {
  const g = (base || SPHERE_LO).clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const f = fbm(seed, 4, 2, 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // fade the displacement out at the poles so the seam vertices stay together
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (f(u, vv) - 0.5) * 2 * amount * fade;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  g.computeVertexNormals();
  return g;
}

/* ============================================================ body visuals  */

function buildVisual(b) {
  const def = TYPES[b.type];
  const grp = new THREE.Group();
  b.obj = grp;
  b.parts = {};

  if (b.kind === 'bh') buildHole(b, grp);
  else if (b.kind === 'wh') buildWhiteHole(b, grp);
  else if (b.kind === 'gal') buildGalaxy(b, grp);
  else if (b.kind === 'gas') buildClump(b, grp);
  else buildWorld(b, def, grp);

  // A pixel-floor marker so distant bodies never vanish entirely.
  const dotMat = new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  });
  b.parts.dot = new THREE.Sprite(dotMat);
  b.parts.dot.renderOrder = 6;
  grp.add(b.parts.dot);

  scene.add(grp);
  buildTrail(b);
  scaleVisual(b);
}

/**
 * Paint a star the colour its mass says it should be — photosphere, rim,
 * corona, glare and the light it casts, so the whole thing reads as one colour
 * instead of a tinted ball sitting inside somebody else's glow.
 *
 * Cheap enough to call whenever the band changes and no more often than that;
 * see the check in updateVisuals.
 */
function applyStarBand(b) {
  const band = starBand(b);
  b.band = band;
  const p = b.parts;
  if (!band || !p) return;
  const c = new THREE.Color(band.rgb[0] / 255, band.rgb[1] / 255, band.rgb[2] / 255);
  const u = p.surf && p.surf.material.uniforms;
  if (u && u.uGrey) {
    // Keep the per-body brightness jitter that uTint was carrying, so two stars
    // in the same band still are not identical — but capped at 1, so a band
    // colour is only ever hit exactly or dimmed, never clipped past white.
    const g = 0.90 + mulberry32(b.seed)() * 0.10;
    u.uTint.value.set(c.r * g, c.g * g, c.b * g);
    u.uGrey.value = 1;
  }
  // The shells and sprites are multiplied, not replaced: their own texture
  // supplies the shape and the band supplies the colour.
  if (p.chromo) p.chromo.material.color.copy(c);
  if (p.corona) p.corona.material.color.copy(c);
  if (p.glow) p.glow.material.color.copy(c);
  if (p.halo) p.halo.material.color.copy(c);
  if (b.lightColor) b.lightColor.copy(c);
}

function buildWorld(b, def, grp) {
  const photo = def.surf === 'star';
  const geo = def.lumpy ? lumpyGeometry(b.seed, def.lumpy)
    : photo ? starGeometry(b.type, b.seed)
    : SPHERE;
  // Only the lumpy geometry is per-body; star geometry is shared from geoCache
  // and must never be disposed with the body that happened to build it.
  b.ownGeo = def.lumpy ? geo : null;
  const tex = surfaceTexture(b.type, b.seed);

  let mat;
  if (photo) {
    const jit0 = mulberry32(b.seed);
    const g = 0.90 + jit0() * 0.14;
    mat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: tex },
        uTint: { value: new THREE.Vector3(g, g, g) },
        uGrey: { value: 0 },
        uEdge: { value: new THREE.Vector3(1.0, 0.80, 0.58) },
        uLimb: { value: new THREE.Vector3(0.30, 0.93, -0.23) }
      },
      vertexShader: STAR_VERT, fragmentShader: STAR_FRAG
    });
  } else if (def.star) {
    mat = new THREE.MeshBasicMaterial({ map: tex });
  } else {
    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: def.surf === 'iron' ? 0.42 : def.surf === 'ocean' || def.surf === 'hycean' ? 0.55 : 0.88,
      metalness: def.surf === 'iron' ? 0.55 : def.surf === 'carbon' ? 0.25 : 0.04
    });
    // The emissive map is always attached so a world can start glowing when it
    // heats up without forcing a shader recompile mid-flight.
    mat.emissiveMap = tex;
    mat.emissive = new THREE.Color(0x000000);
    mat.emissiveIntensity = 1;
    if (def.glowHot) {
      mat.emissive.setRGB(def.glowHot * 0.55, def.glowHot * 0.16, 0.02);
    }
  }
  // gentle per-body variation so two Earths aren't identical. Stars already
  // carry theirs in uTint, and a ShaderMaterial has no .color to set.
  if (!photo) {
    const jit = mulberry32(b.seed);
    mat.color = new THREE.Color().setRGB(0.90 + jit() * 0.14, 0.90 + jit() * 0.14, 0.90 + jit() * 0.14);
    b.baseColor = mat.color.clone();
  }

  const surf = new THREE.Mesh(geo, mat);
  grp.add(surf);
  b.parts.surf = surf;

  if (photo) {
    /* Two translucent shells standing off the photosphere. Being additive they
       contribute almost nothing looked at face-on and pile up where the line of
       sight grazes the edge — which is why a real star shows a coloured rim and
       a ragged corona rather than ending at a hard painted circle. They also
       turn at their own rates below, so the layers shear past one another and
       the eye reads three separate distances instead of one skin. */
    const warm = (def.opts && def.opts.warm) || 0;
    const chromo = new THREE.Mesh(SPHERE, new THREE.MeshBasicMaterial({
      map: cachedTexture('chromo:' + b.type, () => chromoTexture(hashStr('chromo' + b.type), 512, 256, def.temp, warm)),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.40
    }));
    chromo.scale.setScalar(1.012);
    grp.add(chromo);
    b.parts.chromo = chromo;

    const corona = new THREE.Mesh(SPHERE, new THREE.MeshBasicMaterial({
      map: cachedTexture('corona:' + b.type, () => coronaTexture(hashStr('corona' + b.type), 512, 256, def.temp, warm)),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
      side: THREE.DoubleSide, opacity: 0.30
    }));
    corona.scale.setScalar(1.055);
    grp.add(corona);
    b.parts.corona = corona;
  }

  if (def.clouds) {
    const ct = cachedTexture('cloud:' + b.type + ':' + (b.seed % 3), () => cloudTexture(hashStr(b.type + b.seed % 3), 512, 256, def.clouds, [255, 255, 255]));
    const cm = new THREE.MeshStandardMaterial({ map: ct, transparent: true, depthWrite: false, roughness: 1 });
    const cloud = new THREE.Mesh(SPHERE, cm);
    cloud.scale.setScalar(1.018);
    grp.add(cloud);
    b.parts.cloud = cloud;
  }

  if (def.atmo) {
    const am = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color().fromArray(def.atmo.map(c => c / 255)) },
        uLight: { value: new THREE.Vector3(1, 0, 0) },
        uStrength: { value: 0.95 }
      },
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    const atmo = new THREE.Mesh(SPHERE, am);
    atmo.scale.setScalar(1.09);
    grp.add(atmo);
    b.parts.atmo = atmo;
  }

  if (b.ringSpec) buildRing(b, grp);
  if (b.scars && b.scars.length) buildScars(b);
  // The living layer, built only once a dead world has actually started to
  // green up — an ocean-and-forest shell fading in over whatever was there.
  if (b.terra > 0 && !isLivingSurf(def) && !def.star && !GASSY_SURF.has(def.surf)) {
    buildTerraLayer(b, grp);
  }

  if (def.dead) {
    // A black dwarf gives out nothing: no glare, no halo, no light of its own.
    b.lightColor = new THREE.Color(0, 0, 0);
  } else if (def.star) {
    const col = new THREE.Color().fromArray(kelvinToRGB(def.temp).map(c => c / 255));
    const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(g1); grp.add(g2);
    b.parts.glow = g1; b.parts.halo = g2;
    b.lightColor = col;
    applyStarBand(b);
  }

  if (def.tail) {
    const tm = new THREE.MeshBasicMaterial({ map: TEX_TAIL, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const plane = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);   // extends along +X
    const tail = new THREE.Mesh(plane, tm);
    tail.frustumCulled = false;
    scene.add(tail);                    // world-space, oriented each frame
    b.parts.tail = tail;
    const coma = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0x9fd8ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(coma);
    b.parts.coma = coma;
  }
}

/**
 * Oceans, weather and an atmosphere, laid over a dead world as three shells
 * that fade in together with `b.terra`. Done as an overlay rather than by
 * swapping the body's type, so the world underneath keeps its own identity —
 * a terraformed Mars is still Mars, and it is still there when it dies back.
 */
function buildTerraLayer(b, grp) {
  const skin = new THREE.Mesh(SPHERE, new THREE.MeshStandardMaterial({
    map: surfaceTexture('terrestrial', b.seed),
    transparent: true, opacity: 0, roughness: 0.8, metalness: 0.02
  }));
  skin.scale.setScalar(1.004);
  grp.add(skin);
  b.parts.terraSkin = skin;

  const ct = cachedTexture('cloud:terra:' + (b.seed % 3),
    () => cloudTexture(hashStr('terra' + (b.seed % 3)), 512, 256, 0.55, [255, 255, 255]));
  const cloud = new THREE.Mesh(SPHERE, new THREE.MeshStandardMaterial({
    map: ct, transparent: true, opacity: 0, depthWrite: false, roughness: 1
  }));
  cloud.scale.setScalar(1.024);
  grp.add(cloud);
  b.parts.terraCloud = cloud;

  const atmo = new THREE.Mesh(SPHERE, new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color().fromArray(SKY.map(c => c / 255)) },
      uLight: { value: new THREE.Vector3(1, 0, 0) },
      uStrength: { value: 0 }
    },
    vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
  }));
  atmo.scale.setScalar(1.09);
  grp.add(atmo);
  b.parts.terraAtmo = atmo;
}

function buildHole(b, grp) {
  const shadow = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  grp.add(shadow);
  b.parts.surf = shadow;

  const photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(photon);
  b.parts.photon = photon;

  const dt = cachedTexture('disk', () => accretionTexture(1337, 512));
  const dm = new THREE.MeshBasicMaterial({ map: dt, blending: THREE.AdditiveBlending, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const disk = new THREE.Mesh(ringGeometry(0.26), dm);
  disk.rotation.x = -Math.PI / 2 + 0.30;
  disk.rotation.z = 0.2;
  grp.add(disk);
  b.parts.disk = disk;
}

function buildWhiteHole(b, grp) {
  const core = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0xfffbe8 }));
  grp.add(core);
  b.parts.surf = core;

  const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0xfff3b0), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: new THREE.Color(0xffe27a), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(g1); grp.add(g2);
  b.parts.glow = g1; b.parts.halo = g2;
  b.lightColor = new THREE.Color(0xfff0c0);
}

/* =============================================================== impact scars */
/*
 * A world that has just swallowed another one should look like it. Every merge
 * and every hard graze leaves a mark on the survivor at the point it was hit,
 * scaled to how big the thing that hit it was — so a body's surface ends up
 * carrying a record of what it is made of. It is exactly why the Moon and
 * Mercury look the way they do.
 *
 * The mark is a decal held just off the surface and parented to the body's own
 * mesh, so it turns with the body and leans with its axis. It is stored on the
 * body rather than painted into the texture, because textures are shared
 * between every world of the same kind.
 */

const MAX_SCARS = 7;
const _ZAXIS = new THREE.Vector3(0, 0, 1);

/** A crater seen from straight above: dark floor, bright rim, splash of rays. */
function scarTexture(seed, size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;

  // Rays first, so the crater is painted over their inner ends.
  const rays = 9 + (r() * 9) | 0;
  for (let i = 0; i < rays; i++) {
    const a = r() * TAU;
    const len = c * (0.55 + r() * 0.42);
    const wid = c * (0.02 + r() * 0.05);
    const g = ctx.createLinearGradient(c, c, c + Math.cos(a) * len, c + Math.sin(a) * len);
    g.addColorStop(0, 'rgba(238,230,220,0.42)');
    g.addColorStop(1, 'rgba(238,230,220,0)');
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -wid); ctx.lineTo(len, -wid * 2.6); ctx.lineTo(len, wid * 2.6); ctx.lineTo(0, wid);
    ctx.closePath();
    ctx.translate(-c, -c);
    ctx.fill();
    ctx.restore();
  }

  // Ejecta blanket, then the bowl, then the raised rim.
  let g = ctx.createRadialGradient(c, c, c * 0.26, c, c, c * 0.5);
  g.addColorStop(0, 'rgba(214,200,186,0.34)');
  g.addColorStop(1, 'rgba(214,200,186,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c, c, c * 0.5, 0, TAU); ctx.fill();

  g = ctx.createRadialGradient(c * 0.86, c * 0.86, c * 0.02, c, c, c * 0.28);
  g.addColorStop(0, 'rgba(14,10,10,0.80)');
  g.addColorStop(0.62, 'rgba(38,28,26,0.68)');
  g.addColorStop(1, 'rgba(60,48,44,0.10)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c, c, c * 0.28, 0, TAU); ctx.fill();

  ctx.strokeStyle = 'rgba(226,214,200,0.5)';
  ctx.lineWidth = size / 90;
  ctx.beginPath(); ctx.arc(c, c, c * 0.275, 0, TAU); ctx.stroke();
  return cv;
}

/** Turn a world-space direction into the body's own rotating frame. */
function localOnBody(b, worldDir) {
  const v = worldDir.clone();
  if (v.lengthSq() < 1e-18) v.set(1, 0, 0);
  v.normalize();
  // World = tilt about Z, then spin about Y — so undo them in that order.
  v.applyAxisAngle(_ZAXIS, -b.tilt);
  v.applyAxisAngle(_YAXIS, -b.rot);
  return v;
}

/**
 * Record a mark where `worldDir` points, sized as a fraction of the body's own
 * radius. Held on the body, so it survives a rebuild and a save.
 */
function addScar(b, worldDir, size) {
  if (!b.alive || b.kind !== 'body') return;
  const def = TYPES[b.type];
  // Nothing that has no surface to scar: a star's photosphere heals in minutes
  // and a gas giant has no ground for a crater to be in.
  if (def.star || GASSY_SURF.has(def.surf)) return;
  const n = localOnBody(b, worldDir);
  b.scars = b.scars || [];
  b.scars.push({ n: [n.x, n.y, n.z], s: clamp(size, 0.10, 1.15), roll: Math.random() * TAU });
  // Oldest marks are buried by later resurfacing; keep the panel honest by
  // counting every one, but only ever draw the most recent handful.
  b.scarCount = (b.scarCount || 0) + 1;
  while (b.scars.length > MAX_SCARS) b.scars.shift();
  if (b.parts) buildScars(b);
}

function buildScars(b) {
  const p = b.parts;
  if (!p || !p.surf || !b.scars) return;
  if (p.scars) for (const m of p.scars) { p.surf.remove(m); m.material.dispose(); }
  p.scars = [];

  const tex = cachedTexture('scar', () => scarTexture(90210, 256));
  for (const sc of b.scars) {
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false, opacity: 0.85,
      // Held a hair off the surface; the offset keeps it from z-fighting with
      // the sphere it is lying on.
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    });
    const m = new THREE.Mesh(SCAR_GEO, mat);
    const n = new THREE.Vector3(sc.n[0], sc.n[1], sc.n[2]).normalize();
    m.position.copy(n).multiplyScalar(1.006);
    m.quaternion.setFromUnitVectors(_ZAXIS, n)
      .multiply(new THREE.Quaternion().setFromAxisAngle(_ZAXIS, sc.roll));
    m.scale.setScalar(sc.s);
    p.surf.add(m);          // a child of the mesh, so it turns with the world
    p.scars.push(m);
  }
}

/* ================================================================ gas clumps */
/*
 * A collision does not only make gravel and a fine mist. It throws off KNOTS —
 * lumps of vapour dense enough to hold together for a while, which you can
 * click on, weigh and watch. Some of what comes off is solid instead, and the
 * two behave completely differently: rock just orbits, while a gas knot is in a
 * race between spreading out and pulling itself in. If there is enough of it,
 * gravity wins and it becomes a world.
 *
 * This is not decoration — it is the actual origin story of the Moon, and of
 * every moon around every giant in the Solar System.
 */

/* Above this much mass a knot can hold itself together and collapse into a
   solid body. Below it, it thins out and is gone. */
const CLUMP_COLLAPSE = 0.045;      // M⊕ — about four Moons

function clumpGeometry(variant) {
  const key = 'clump:' + variant;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const lump = fbm(hashStr('cl' + variant), 4, 2, 4);
  const pos = [], col = [], siz = [];

  for (let i = 0; i < 900; i++) {
    const z = rng() * 2 - 1, ph = rng() * TAU, s = Math.sqrt(Math.max(0, 1 - z * z));
    const dx = s * Math.cos(ph), dy = s * Math.sin(ph), dz = z;
    const u = ((Math.atan2(dy, dx) / TAU) + 1) % 1;
    const v = Math.acos(clamp(dz, -1, 1)) / Math.PI;
    // Ragged, not a ball: a noise field eats a good share of every direction.
    const lb = clamp(lump(u, v) * 1.8 - 0.4, 0, 1);
    if (rng() > 0.25 + lb) continue;
    // Filled rather than hollow — a knot is dense in the middle, which is the
    // whole reason it might survive.
    const r = Math.pow(rng(), 0.55) * (0.55 + lb * 0.5);
    pos.push(dx * r, dy * r * 0.86, dz * r);
    // Hot and bright at the core, cooling outward through the disc colours —
    // but only as far as the rose end of them. A knot this fresh has not had
    // time to get to the cold blue an old disc rim sits at.
    const c = ramp(DISC_RAMP, clamp(r * 0.82, 0, 1));
    const j = 0.75 + rng() * 0.5;
    col.push(c[0] / 255 * j, c[1] / 255 * j, c[2] / 255 * j);
    siz.push(0.10 + Math.pow(rng(), 2) * 0.36);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildClump(b, grp) {
  const puff = new THREE.Points(clumpGeometry(b.seed % 6), new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0.3 }, uScale: { value: 1 }, uFocal: { value: 1 } },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  puff.frustumCulled = false;
  puff.renderOrder = 4;
  grp.add(puff);
  b.parts.puff = puff;

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(0xffa257), opacity: 0.32,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  }));
  grp.add(glow);
  b.parts.clumpGlow = glow;
  b.lightColor = new THREE.Color(0xffb070);
}

/**
 * Knots cool, spread, and eventually decide what they are going to be. A heavy
 * one pulls itself together into a solid world; a light one simply disperses
 * back into the fine gas it came from.
 */
function updateClumps(simDt) {
  for (let i = sim.bodies.length - 1; i >= 0; i--) {
    const b = sim.bodies[i];
    if (!b.alive || b.kind !== 'gas') continue;

    b.clumpAge = (b.clumpAge || 0) + simDt;
    // Radiating away the heat of the impact that made it.
    b.temp = Math.max(30, b.temp * Math.exp(-0.0016 * simDt));
    if (b.clumpAge < (b.clumpLife || 420)) continue;

    if (b.m >= CLUMP_COLLAPSE) collapseClump(b);
    else disperseClump(b);
  }
}

/** Pull a knot together into the solid world its own gravity makes of it. */
function collapseClump(b) {
  const star = nearestStar(b);
  const warm = star ? b.p.distanceTo(star.p) < 2.7 * AU * Math.sqrt(Math.max(star.lum, 1e-4)) : true;
  const type = discPlanetType(b.m, warm);
  b.type = type;
  b.kind = 'body';
  b.temp = TYPES[type].temp || 300;
  b.coreT = baseCoreT(TYPES[type], b.m);
  b.rFactor = 1;
  b.r = trueRadius(type, b.m);
  b.spin = TYPES[type].spin || 1;
  b.tilt = rnd(-0.42, 0.42);
  b.glowPulse = 1;
  // Born of a collision, and it shows: the surface is pocked from the start.
  b.scars = null; b.scarCount = 0;
  const marks = 2 + ((Math.random() * 3) | 0);
  updateLuminosity(b);
  refreshVisual(b);
  for (let i = 0; i < marks; i++) {
    addScar(b, new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)), rnd(0.22, 0.6));
  }
  fx.form(b, false);
  toast(b.name + ' pulled itself together into a ' + TYPES[type].label.toLowerCase());
  if (sim.selected === b) renderInspector();
}

/** Let a knot go: it becomes the fine gas it was always going to become. */
function disperseClump(b, quiet) {
  const vEsc = Math.sqrt(2 * G * Math.max(b.m, 1e-12) / Math.max(visRadius(b), 1e-9));
  const put = gasEjecta(b.p, b.v, 220, b.m, Math.max(vEsc, 0.02), visRadius(b) * 0.4,
    { speed: 0.6, sizeMin: 8, sizeMax: 30 });
  // Whatever the particle pool could not take stays as a smaller knot rather
  // than vanishing — mass is never destroyed here.
  b.m -= put;
  if (b.m > 1e-9 && put <= 0) { b.clumpAge = 0; return; }
  if (!quiet) toast(b.name + ' thinned away to nothing');
  if (sim.selected === b) select(null);
  removeBody(b);
  compact();
}

/**
 * Throw off a handful of selectable knots after a collision — mostly gas, some
 * solid. Returns the mass actually used, which the caller must subtract.
 */
function spawnClumps(center, baseVel, totalMass, count, spread, minDist, solidChance) {
  const n = Math.min(count, freeSlots());
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const made = [];
  // Knots are far wider than the rubble they come off with, so they have to be
  // thrown clear of each other or they simply merge back together on the first
  // step and none of them survive to be looked at.
  const gap = Math.max(minDist, trueRadius('gas_clump', each) * settings.bodyScale * 2.6);

  for (let i = 0; i < n; i++) {
    const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.5, 0.5), rnd(-1, 1));
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const pos = center.clone().addScaledVector(dir, gap * rnd(1.2, 2.8));
    const vel = baseVel.clone().addScaledVector(dir, spread * rnd(0.3, 1.05));

    // Solid knots are the pieces that never got hot enough to boil.
    const solid = Math.random() < (solidChance != null ? solidChance : 0.3);
    if (solid) {
      made.push(makeBody(each > 0.004 ? 'moon' : 'asteroid', pos, vel,
        { mass: each, name: 'Fragment ' + sim.nextId, rubble: true, coreT: 3200 }));
    } else {
      const b = makeBody('gas_clump', pos, vel, { mass: each, name: 'Clump ' + sim.nextId });
      b.temp = rnd(1400, 3200);
      b.clumpLife = rnd(260, 900);
      b.clumpAge = 0;
      made.push(b);
    }
  }
  // The set as a whole must drift exactly as the mass it came from did.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, baseVel.clone().multiplyScalar(tot));
  return each * n;
}

/* ================================================================== rings   */
/*
 * Rings are per-body rather than per-type, so any world can be given a set and
 * any set can be reshaped or recoloured from the inspector. A spec is:
 *
 *   { inner, outer   multiples of the body's own drawn radius
 *     pal            two [r,g,b] stops the ringlets are painted between
 *     tilt           radians the whole body (and so its rings) leans over
 *     opacity }
 */

const DEFAULT_RINGS = () => ({
  inner: 1.35, outer: 2.4, pal: [[228, 210, 176], [166, 142, 112]], tilt: 0.47, opacity: 0.9
});

const rgbHex = (c) => '#' + [0, 1, 2].map(i => clamp(Math.round(c[i]), 0, 255).toString(16).padStart(2, '0')).join('');
const hexRgb = (h) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h));
  if (!m) return [255, 255, 255];
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
};

/* The edge ratio is quantised before it reaches ringGeometry's cache. Without
   this, dragging an edge slider from end to end mints a few hundred distinct
   annulus geometries and keeps every one of them forever. */
const ringRatio = (s) => Math.round(clamp(s.inner / s.outer, 0.05, 0.97) * 50) / 50;

/** Paint a ring texture for one body. NOT shared: the colours are per-body. */
function ringTextureFor(b) {
  if (b.ringTex) b.ringTex.dispose();
  b.ringTex = new THREE.CanvasTexture(ringTexture(hashStr('ring' + b.seed), 512, b.ringSpec.pal));
  return b.ringTex;
}

function buildRing(b, grp) {
  const s = b.ringSpec;
  const rm = new THREE.MeshBasicMaterial({
    map: ringTextureFor(b), transparent: true, side: THREE.DoubleSide, depthWrite: false,
    opacity: s.opacity != null ? s.opacity : 0.92
  });
  const ring = new THREE.Mesh(ringGeometry(ringRatio(s)), rm);
  ring.rotation.x = -Math.PI / 2;
  grp.add(ring);
  b.parts.ring = ring;
}

/**
 * Push the current spec onto the mesh. Shape and opacity are cheap and update
 * live; `repaint` redraws the 512×512 texture and is only asked for when the
 * colours have actually changed.
 */
function setRings(b, spec, repaint) {
  const had = b.ringSpec;
  b.ringSpec = spec ? Object.assign({}, spec) : null;

  if (!b.ringSpec) {
    if (b.parts && b.parts.ring) {
      b.obj.remove(b.parts.ring);
      b.parts.ring.material.dispose();
      b.parts.ring = null;
    }
    if (b.ringTex) { b.ringTex.dispose(); b.ringTex = null; }
    return;
  }
  if (!b.obj) return;

  b.tilt = b.ringSpec.tilt;
  if (!had || !b.parts.ring) { buildRing(b, b.obj); scaleVisual(b); return; }

  const ring = b.parts.ring;
  ring.geometry = ringGeometry(ringRatio(b.ringSpec));
  ring.material.opacity = b.ringSpec.opacity != null ? b.ringSpec.opacity : 0.92;
  if (repaint) ring.material.map = ringTextureFor(b);
  scaleVisual(b);
}


/* ------------------------------------------------- rings you can crash into */
/*
 * The painted ring is scenery: one flat texture, and nothing can hit it. This
 * builds the other kind — a three-dimensional band of real asteroids, each with
 * its own mass and its own orbit, integrated by the same leapfrog step as
 * everything else. They pull on one another, they shear, and they collide.
 *
 * Two compromises, both forced by scale, and both deliberate. A real ring
 * particle is a few metres across; fifty of those spread round a band the width
 * of a star would not meet in the lifetime of the universe. So the rocks are
 * sized to the band instead — each about a third of the gap to its neighbour,
 * which is close enough that a nudge in radius or tilt puts two of them in
 * contact. And the whole band is capped at a small share of whatever it orbits,
 * so it stays low-density rubble rather than outweighing its host and wrecking
 * every orbit in the system.
 *
 * Each press lays a fresh band a little wider and a little more tilted than the
 * last, so they cross rather than nest. Press it a few times and the crossings
 * start grinding themselves apart.
 */

const SOLID_RING_N = 44;          // rocks per press, budget permitting
const SOLID_RING_STEP = 2.5;      // each press starts this much further out
const SOLID_RING_SPAN = 3.2;      // how wide one band is, inner edge to outer
const SOLID_RING_SHARE = 2e-4;    // × the host's mass, per band

/** Returns how many rocks actually went in. */
function addSolidRing(b) {
  if (!b || !b.alive || b.kind === 'gal' || b.kind === 'snr') {
    toast('There is nothing here to put a ring around');
    return 0;
  }
  const room = freeSlots();
  if (room < 6) { toast('Universe is full — clear some bodies first'); return 0; }
  const n = Math.min(SOLID_RING_N, room);

  const rv = Math.max(visRadius(b), 1e-9);
  const lap = b.solidRings || 0;

  /* Where this band goes. The first press hugs the body, because that is where
     rocks are a sane size and a ring really is packed shoulder to shoulder.
     Each press after that starts SOLID_RING_STEP further out while being
     SOLID_RING_SPAN wide, so consecutive bands overlap by about a third rather
     than nesting — and after seven or eight presses the outermost one is as far
     out as a protoplanetary disc reaches.
     The ceiling is that disc: if the host already has one the rocks stop where
     the dust does, so the two are the same disc seen twice. A star without one
     gets a disc's own outer edge, forty-two AU, which is the shape ours was
     built from. Anything smaller than a star is kept in proportion to its own
     width, because forty AU around a planet is not a ring, it is a solar
     system. Once a band is against the ceiling, further presses re-lay the
     outer band at a new tilt. */
  const disc = b.disc && b.disc.alive ? b.disc : null;
  const reach = disc ? disc.rOut : TYPES[b.type].star ? 42 * AU : rv * 48;
  const first = disc ? Math.max(disc.rIn, rv * 1.6) : rv * 1.6;
  const inner = Math.min(first * Math.pow(SOLID_RING_STEP, lap),
                         Math.max(reach / SOLID_RING_SPAN, first));
  const outer = Math.min(inner * SOLID_RING_SPAN, Math.max(reach, inner * 1.2));

  /* The plane of the band: the body's own tilted equator, turned further on
     each press. Two orbits at nearly the same radius but different tilts cross
     at two points, and that is where the crashes come from. */
  const spec = b.ringSpec;
  const lean = b.tilt + (spec ? spec.tilt * 0.35 : 0) + lap * 0.19;
  const axis = new THREE.Vector3(-Math.sin(lean), Math.cos(lean), 0).normalize();
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(0, 0, 1);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  /* Rock size is a share of its OWN orbital radius, not one figure for the
     whole band — over two decades of radius a single size would be boulders at
     the rim and dust in the middle. This is the gap between neighbours spread
     evenly round a ring at that radius, so a rock is always about a third of
     the way to touching the next one along. What collisions actually measure is
     the DRAWN radius, so bodyScale is divided back out. */
  const k = TAU * 0.30 / (n * Math.max(settings.bodyScale, 1e-6));
  const natR = TYPES.asteroid.rad * R_EARTH;
  // No band may weigh more than a whisker of what it orbits, or the first press
  // wrecks every orbit in the system.
  const cap = Math.max(b.m * SOLID_RING_SHARE / n, 1e-10);
  const gm = G * settings.gravity;

  let made = 0;
  for (let i = 0; i < n; i++) {
    if (freeSlots() <= 0) break;
    // Log-uniform in radius, so the crowded inside of the band gets its share
    // instead of every rock landing out near the rim.
    const rad = inner * Math.pow(outer / inner, (i + rnd(-0.4, 0.4)) / Math.max(n - 1, 1));
    const ang = Math.random() * TAU;
    const rockR = clamp(rad * k, natR, rad * 0.08);
    // What a rock that size would weigh if it were solid — and never more than
    // its share of the cap. Small inner rocks stay properly dense; the giants
    // further out come out as low-density rubble piles.
    const each = Math.max(Math.min(TYPES.asteroid.mass * Math.pow(rockR / natR, 3), cap), 1e-11);

    const dir = u.clone().multiplyScalar(Math.cos(ang)).addScaledVector(w, Math.sin(ang));
    const tan = u.clone().multiplyScalar(-Math.sin(ang)).addScaledVector(w, Math.cos(ang));
    const pos = b.p.clone().addScaledVector(dir, rad)
      .addScaledVector(axis, (Math.random() - 0.5) * rad * 0.05);
    // Circular at its own radius, off by a per cent or so — which is what makes
    // the band shear and eventually bring pairs together.
    const vc = Math.sqrt(gm * b.m / rad);
    const vel = b.v.clone().addScaledVector(tan, vc * rnd(0.985, 1.015));
    const rock = makeBody('asteroid', pos, vel, { mass: each, r: rockR, spin: rnd(0.05, 0.6) });
    rock.tilt = rnd(-Math.PI, Math.PI);
    /* Flagged as an already-loose rubble pile, which is what it is — and which
       makes it immune to tidal stripping. That matters: a rock this wide is a
       deliberate fudge, drawn big enough to actually hit its neighbours, so its
       density comes out very low. Feed that density into a Roche limit and the
       star shaves the whole band down to specks within the first few orbits,
       which is the fudge eating its own tail. It can still be smashed by an
       impact; it just cannot be quietly eroded. */
    rock.disrupted = true;
    made++;
  }
  if (!made) { toast('No room left for a ring'); return 0; }

  b.solidRings = lap + 1;
  computeAccel();
  refreshStarCache();
  updateTemperatures();
  toast(made + ' asteroids now orbiting ' + b.name + ', out to ' + fmtDist(outer) +
    (lap ? ' — band ' + (lap + 1) + ', crossing the ones already there' : ''));
  return made;
}

/* ================================================================ galaxies  */
/*
 * A galaxy is not a picture here. It is a few thousand individual stars, each
 * one integrated under the gravity of every galaxy core in the scene — which is
 * the whole reason two of them can be crashed into each other and do something
 * worth watching.
 *
 * This is the restricted N-body model Toomre & Toomre used in 1972 to work out
 * where the tails and bridges of interacting galaxies come from, and it is
 * still the standard way to reproduce them. Each star is a TEST particle: it
 * feels the cores, but has no pull of its own. That is what makes thousands of
 * them affordable, and it costs almost nothing in realism, because in a real
 * galaxy the stars really are a rounding error next to the mass they orbit.
 *
 * The three things it gets right, and the three things you see in the sky:
 *
 *   TIDAL TAILS   The far side of a disc is pulled less hard than the near
 *                 side, so a passing companion flings a long thin streamer out
 *                 behind it. The Antennae, the Mice, the Tadpole — all this.
 *   BRIDGES       Material dragged the other way, straight towards the intruder.
 *   MERGERS       Dynamical friction drains the orbit, the cores spiral in and
 *                 coalesce, and the two ordered discs are left as one shapeless
 *                 blob. That is where elliptical galaxies come from, and it is
 *                 what the Milky Way and Andromeda are going to do.
 *
 * ONE HONEST NOTE ON SCALE. A real galaxy is about 9×10^17 Gm across, roughly a
 * trillion times the width of the largest thing this sandbox can otherwise
 * hold. Drawn at true size, nothing else in the simulation would be one pixel.
 * So a galaxy is built at whatever world size it is created at — the pixel
 * range in Settings picks that at the moment you place it — and everything
 * after that, orbits, tails and all, is real physics at that size. The shapes
 * are right and the timescale is not: a collision that would take a billion
 * years plays out in months.
 */

/* Star slots shared across every galaxy in the scene. */
const GAL_MAX = 34000;
const GAL_STARS = 11000;        // per galaxy, budget permitting
const GAL_SUBSTEPS = 3;         // per frame — galaxy orbits are slow and smooth
/* Softening as a fraction of the disc radius. It gives the inner disc a
   near-solid-body rotation curve, which is both what real galaxies do and what
   stops the arms winding themselves into mush after two turns. */
const GAL_SOFT = 0.55;

const galx = {
  pos: null, vel: null, col: null, siz: null, own: null,
  free: [], live: 0, geo: null, pts: null, dirty: false
};

function initGalaxyStars() {
  galx.pos = new Float32Array(GAL_MAX * 3);
  galx.vel = new Float32Array(GAL_MAX * 3);
  galx.col = new Float32Array(GAL_MAX * 3);
  galx.siz = new Float32Array(GAL_MAX);
  galx.own = new Int32Array(GAL_MAX);
  galx.free.length = 0;
  for (let i = GAL_MAX - 1; i >= 0; i--) { galx.free.push(i); galx.own[i] = -1; }
  galx.live = 0;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(galx.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(galx.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(galx.siz, 1));
  galx.geo = geo;
  // Screen-fixed point size, so the stars stay stars however far you zoom in —
  // fly into a galaxy and it opens out into individual specks, as it should.
  galx.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_GLOW }, uDpr: { value: VIEW.dpr } },
    vertexShader: FX_VERT, fragmentShader: FX_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  galx.pts.frustumCulled = false;
  galx.pts.renderOrder = -5;             // behind every solid body in the scene
  scene.add(galx.pts);
}

/**
 * Circular speed at radius r in a galaxy's own softened potential. Using the
 * same law the integrator uses is what makes a freshly built disc actually sit
 * still instead of immediately falling in or flying apart.
 */
function galVCirc(m, r, soft) {
  const dd = r * r + soft * soft;
  return Math.sqrt(G * settings.gravity * m * r * r / (dd * Math.sqrt(dd)));
}

/** Free every star belonging to a galaxy — called when one is removed. */
function freeGalaxyStars(id) {
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] !== id) continue;
    galx.own[k] = -1;
    galx.siz[k] = 0;
    galx.free.push(k);
    galx.live--;
  }
  galx.dirty = true;
}

function clearGalaxyStars() {
  if (!galx.own) return;
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] < 0) continue;
    galx.own[k] = -1; galx.siz[k] = 0; galx.free.push(k); galx.live--;
  }
  galx.dirty = true;
}

/**
 * Lay out a galaxy's stars: a fat old bulge, then a disc wound into
 * logarithmic arms, every one of them on a circular orbit in the disc plane
 * with a little random dispersion so it is not a wire model.
 */
function seedGalaxyStars(b) {
  freeGalaxyStars(b.id);
  const rng = mulberry32(b.seed ^ 0x9e37);
  const gauss = () => (rng() + rng() + rng() + rng() - 2) * 0.5;
  const R = Math.max(b.galR, 1e-6);
  const soft = R * GAL_SOFT;
  const arms = b.galArms;

  // The disc plane. Two galaxies meeting at an angle is what makes a collision
  // interesting, so every galaxy gets its own tilt.
  const ax = b.galAxis;
  let u = new THREE.Vector3(0, 0, 1);
  if (Math.abs(ax.dot(u)) > 0.9) u.set(1, 0, 0);
  u.crossVectors(ax, u).normalize();
  const w = new THREE.Vector3().crossVectors(ax, u).normalize();
  const spin = b.galSpin || 1;

  const WIND = 3.2;
  const BULGE = [1.0, 0.84, 0.54];      // old, yellow core stars
  const ARM = [0.72, 0.84, 1.0];        // young, blue arm stars
  const HII = [1.0, 0.44, 0.60];        // pink hydrogen where stars are forming
  const DISC = [0.52, 0.50, 0.66];

  const want = Math.min(GAL_STARS, galx.free.length);
  for (let i = 0; i < want; i++) {
    const k = galx.free.pop();
    const k3 = k * 3;
    const bulge = i < want * 0.24;
    let r, th, h, c, s;

    if (bulge) {
      r = (0.02 + Math.pow(rng(), 2.1) * 0.20) * R;
      th = rng() * TAU;
      h = gauss() * r * 0.55;                       // a fat, round bulge
      c = mix(BULGE, [1, 1, 1], Math.pow(1 - r / (0.22 * R), 2) * 0.7);
      s = 1.1 + Math.pow(rng(), 2) * 1.5;
    } else {
      r = (0.14 + Math.sqrt(rng()) * 0.86) * R;
      const t = r / R;
      const spread = (0.16 + t * 0.34) * gauss() * 2.2;
      th = Math.log(Math.max(t, 0.02) / 0.10) * WIND + ((rng() * arms) | 0) * (TAU / arms) + spread;
      h = gauss() * (0.012 + t * 0.020) * R;        // a thin disc
      const onArm = clamp(1 - Math.abs(spread) / (0.2 + t * 0.4), 0, 1);
      c = mix(DISC, ARM, onArm);
      if (onArm > 0.55 && rng() < 0.15) c = mix(c, HII, 0.85);
      const dim = 0.42 + onArm * 0.8;
      c = [c[0] * dim, c[1] * dim, c[2] * dim];
      s = 0.9 + Math.pow(rng(), 2.4) * 1.8;
    }

    const ct = Math.cos(th), st = Math.sin(th);
    const ox = u.x * ct + w.x * st, oy = u.y * ct + w.y * st, oz = u.z * ct + w.z * st;
    const tx = (-u.x * st + w.x * ct) * spin, ty = (-u.y * st + w.y * ct) * spin, tz = (-u.z * st + w.z * ct) * spin;

    galx.pos[k3] = b.p.x + ox * r + ax.x * h;
    galx.pos[k3 + 1] = b.p.y + oy * r + ax.y * h;
    galx.pos[k3 + 2] = b.p.z + oz * r + ax.z * h;

    // Circular in the disc plane, plus a small random dispersion — real discs
    // are warm, and a perfectly cold one looks like a diagram.
    const vc = galVCirc(b.m, r, soft) * (bulge ? rnd(0.55, 0.95) : rnd(0.97, 1.03));
    const disp = vc * (bulge ? 0.34 : 0.05);
    galx.vel[k3] = b.v.x + tx * vc + gauss() * disp;
    galx.vel[k3 + 1] = b.v.y + ty * vc + gauss() * disp;
    galx.vel[k3 + 2] = b.v.z + tz * vc + gauss() * disp;

    galx.col[k3] = c[0]; galx.col[k3 + 1] = c[1]; galx.col[k3 + 2] = c[2];
    galx.siz[k] = s;
    galx.own[k] = b.id;
    galx.live++;
  }
  galx.dirty = true;
}

/** Every galaxy core in the scene, with the softening its own disc implies. */
const galCores = [];
function refreshGalCores() {
  galCores.length = 0;
  for (const b of sim.bodies) {
    if (b.kind === 'gal' && b.alive) galCores.push(b);
  }
}

/**
 * Move the stars. Symplectic Euler — kick then drift — one force evaluation per
 * step, and stable over the many orbits a collision takes.
 */
function stepGalaxyStars(dt) {
  if (galx.live === 0 || galCores.length === 0) return;
  const gm = G * settings.gravity;
  const n = galCores.length;
  // Hoisted so the inner loop is plain arithmetic.
  const cx = [], cy = [], cz = [], cm = [], cs = [];
  for (let i = 0; i < n; i++) {
    const g = galCores[i];
    cx.push(g.p.x); cy.push(g.p.y); cz.push(g.p.z);
    cm.push(gm * g.m);
    const so = Math.max(g.galR * GAL_SOFT, 1e-6);
    cs.push(so * so);
  }

  const pos = galx.pos, vel = galx.vel;
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] < 0) continue;
    const k3 = k * 3;
    const px = pos[k3], py = pos[k3 + 1], pz = pos[k3 + 2];
    let ax = 0, ay = 0, az = 0;
    for (let i = 0; i < n; i++) {
      const dx = cx[i] - px, dy = cy[i] - py, dz = cz[i] - pz;
      // Plummer softening on the core, standing in for the fact that a galaxy's
      // mass is spread through a bulge and a halo rather than sitting in a point.
      const dd = dx * dx + dy * dy + dz * dz + cs[i];
      const f = cm[i] / (dd * Math.sqrt(dd));
      ax += dx * f; ay += dy * f; az += dz * f;
    }
    vel[k3] += ax * dt; vel[k3 + 1] += ay * dt; vel[k3 + 2] += az * dt;
    pos[k3] += vel[k3] * dt; pos[k3 + 1] += vel[k3 + 1] * dt; pos[k3 + 2] += vel[k3 + 2] * dt;
  }
  galx.dirty = true;
}

/**
 * Dynamical friction, and the merger it causes.
 *
 * Two galaxies on a passing orbit would, as bare point masses, swing past each
 * other and separate forever. Real ones do not: each one ploughs through the
 * other's stars and halo, leaves a wake of material pulled in behind it, and
 * that wake pulls back. The orbit decays, they fall together again, and after
 * a few passes they coalesce. Chandrasekhar worked the effect out in 1943, and
 * it is the single reason galaxy mergers happen at all.
 *
 * The version here is deliberately crude — a drag on the relative motion that
 * switches on once the discs overlap — but it is applied as an equal and
 * opposite impulse, so momentum is conserved exactly.
 */
/* Deliberately weak, and very steep. A grazing pass should barely be damped —
   that is the pass that throws the tails — while a deep one, where the cores
   are ploughing through the thick of each other, is damped hard. Get this
   wrong in the other direction and the first approach turns straight into a
   plunge, the discs are scrambled into a featureless halo, and you never see
   a tail at all. */
const GAL_FRICTION = 0.022;

function updateGalaxyPairs(dt) {
  const gs = galCores;
  for (let i = 0; i < gs.length; i++) {
    for (let j = i + 1; j < gs.length; j++) {
      const a = gs[i], b = gs[j];
      if (!a.alive || !b.alive) continue;
      const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const reach = a.galR + b.galR;
      if (d >= reach) continue;

      // Overlap fraction: nothing at first touch, everything at the centre.
      const over = clamp(1 - d / Math.max(reach, 1e-9), 0, 1);
      const k = clamp(GAL_FRICTION * over * over * over * dt, 0, 0.5);
      const mu = a.m * b.m / Math.max(a.m + b.m, 1e-12);
      const rvx = b.v.x - a.v.x, rvy = b.v.y - a.v.y, rvz = b.v.z - a.v.z;
      // Equal and opposite, so the pair's momentum does not move.
      a.v.x += rvx * k * mu / a.m; a.v.y += rvy * k * mu / a.m; a.v.z += rvz * k * mu / a.m;
      b.v.x -= rvx * k * mu / b.m; b.v.y -= rvy * k * mu / b.m; b.v.z -= rvz * k * mu / b.m;

      // Close enough that there is only one galaxy left.
      if (d < reach * 0.055) { mergeGalaxies(a.m >= b.m ? a : b, a.m >= b.m ? b : a); return; }
    }
  }
}

/**
 * Two galaxies become one. The stars are not thrown away — they are handed over
 * exactly where they are, still moving exactly as they were, which is why the
 * remnant is the shapeless blob a real merger leaves rather than a tidy new
 * spiral. This is how elliptical galaxies are made.
 */
function mergeGalaxies(a, b) {
  const mTot = a.m + b.m;
  a.p.multiplyScalar(a.m / mTot).addScaledVector(b.p, b.m / mTot);
  a.v.multiplyScalar(a.m / mTot).addScaledVector(b.v, b.m / mTot);
  a.m = mTot;
  // The remnant is puffed up by everything the collision stirred.
  a.galR = Math.max(a.galR, b.galR) * 1.18;
  a.galMerged = (a.galMerged || 0) + 1 + (b.galMerged || 0);

  // Hand the other galaxy's stars over where they stand.
  for (let k = 0; k < GAL_MAX; k++) if (galx.own[k] === b.id) galx.own[k] = a.id;
  galx.dirty = true;

  fx.flash(a.p, a.galR * 0.25, [255, 240, 210], 0.9);
  toast(a.name + ' and ' + b.name + ' have merged into one galaxy');
  if (sim.selected === b) select(a);
  removeBody(b);
  compact();
  refreshGalCores();
}

/*
 * How long one turn of the outer disc takes. A real galaxy takes about 230
 * million years; here it takes eleven, because the whole object is built at a
 * size the sandbox can hold and the clock has to be compressed to match.
 * Fixing the PERIOD rather than the mass is what keeps a galaxy looking right
 * however big you make it — the shapes and the dynamics stay honest, and only
 * the scale is compressed.
 */
const GAL_PERIOD = 4000;      // days for one turn at the disc edge

/** The core mass a galaxy of this size needs for that rotation period. */
const galMassFor = (R) =>
  4 * Math.PI * Math.PI * R * R * R / (G * GAL_PERIOD * GAL_PERIOD);

function buildGalaxy(b, grp) {
  const rng = mulberry32(b.seed);
  b.galArms = b.galArms || (rng() < 0.62 ? 2 : 4);
  b.galSpin = b.galSpin || (rng() < 0.5 ? 1 : -1);
  // How wide it was asked to be on screen when it was placed. Once it exists
  // that is history: from here on it has a real size in real units.
  if (b.galWide == null) b.galWide = lerp(settings.galMinPx, settings.galMaxPx, rng());
  if (b.galR == null) {
    // The pixel range picks how much of the screen it fills when dropped, with
    // a floor so that placing one while zoomed in on a moon still gives you a
    // galaxy rather than a two-AU curiosity.
    b.galR = Math.max(b.galWide * 0.5 * worldPerPixel(view.dist), 900);
    b.m = galMassFor(b.galR);
  }
  if (!b.galAxis) {
    const sw = rng() * TAU;
    b.galAxis = new THREE.Vector3(0, 1, 0)
      .applyAxisAngle(new THREE.Vector3(Math.cos(sw), 0, Math.sin(sw)), (rng() - 0.5) * 1.9)
      .normalize();
  }

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_HALO, color: new THREE.Color(0xfff0c4), opacity: 0.5,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  }));
  core.renderOrder = -4;
  grp.add(core);
  b.parts.galCore = core;
  b.lightColor = new THREE.Color(0xffe6b8);

  seedGalaxyStars(b);
}

function updateGalaxies() {
  for (const b of sim.bodies) {
    if (b.kind !== 'gal' || !b.parts) continue;
    b.obj.position.copy(b.p);
    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    // The glow standing in for the unresolved crowd of stars in the bulge.
    if (b.parts.galCore) {
      b.parts.galCore.scale.setScalar(Math.max(b.galR * 0.22, 18 * wpp));
      b.parts.galCore.material.opacity = clamp(0.55 - (b.galMerged ? 0.2 : 0), 0.2, 0.6);
    }
    if (b.parts.dot) b.parts.dot.visible = false;
  }
  if (galx.pts) {
    galx.pts.material.uniforms.uDpr.value = VIEW.dpr;
    if (galx.dirty) {
      galx.geo.attributes.position.needsUpdate = true;
      galx.geo.attributes.aCol.needsUpdate = true;
      galx.geo.attributes.aSize.needsUpdate = true;
      galx.dirty = false;
    }
  }
}

/* ================================================== protoplanetary discs   */
/*
 * Where planets come from. A young star is left over from a collapsing cloud
 * with far too much spin to swallow everything at once, so what it cannot take
 * settles into a flat disc around it — and the disc clumps, sticks and sweeps
 * itself up into planets. Ours did this four and a half billion years ago; the
 * order of the planets we ended up with is written into where the ice line sat.
 *
 * The mass here is real: every planet that condenses is taken out of the disc's
 * budget, so a disc that has made a Jupiter has that much less left for
 * everything further out.
 */

const discs = [];
const _YAXIS = new THREE.Vector3(0, 1, 0);

function makeDisc(host, o) {
  o = o || {};
  const rng = mulberry32(host.seed ^ 0x5eed);
  /* A pole for the disc. On its own it is tipped a little off vertical so a sky
     full of them does not look stamped out — but a disc can be handed a pole to
     use instead, and one left behind by a collapsing cloud always is: the
     cloud's own spin axis is what set the plane in the first place. */
  let axis;
  if (o.axis) {
    axis = (o.axis.isVector3 ? o.axis.clone() : new THREE.Vector3().fromArray(o.axis)).normalize();
    if (axis.lengthSq() < 0.5) axis.set(0, 1, 0);
  } else {
    const swing = rnd(0, TAU);
    axis = new THREE.Vector3(0, 1, 0)
      .applyAxisAngle(new THREE.Vector3(Math.cos(swing), 0, Math.sin(swing)), rnd(-0.3, 0.3))
      .normalize();
  }
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(0, 0, 1);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  const d = {
    id: sim.nextId++,
    host: host,
    seed: (rng() * 1e6) | 0,
    // Roughly a tenth of an AU in to forty AU out — the shape of the disc our
    // own planets were built from.
    rIn: o.rIn != null ? o.rIn : Math.max(visRadius(host) * 3, 0.35 * AU),
    rOut: o.rOut != null ? o.rOut : 42 * AU,
    // ~450 M⊕ of rock and ice: enough for a Jupiter and a family besides.
    mass: o.mass != null ? o.mass : 450,
    axis: axis, u: u, w: w,
    // Wait a full interval before the first world: a disc that condensed a
    // planet on the frame it appeared would be skipping the part that takes
    // millions of years. Nothing has formed yet — that is the whole point of it.
    age: 0, made: 0,
    next: o.next != null ? o.next
      : Math.max(settings.discYears, 0.02) * 365.25 * rnd(0.5, 1.1),
    fade: 1,
    alive: true,
    obj: null
  };
  d.m0 = d.mass;
  buildDiscVisual(d);
  discs.push(d);
  host.disc = d;
  return d;
}

/** A flared annulus of dust, hot and bright inside, cold and dark at the rim. */
function discGeometry(seed, n) {
  const key = 'disc:' + seed + ':' + n;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const gauss = () => (rng() + rng() + rng() - 1.5) * 0.7;
  const wave = fbm(hashStr('discwave' + seed), 5, 2, 3);

  const pos = [], col = [], siz = [];
  /* Deep and saturated on purpose. Additive blending climbs towards white
     wherever puffs overlap, so a palette that starts out pale is bleached to
     grey exactly where the disc is thickest — which is the interesting part.
     A real disc genuinely does run this way too: white-hot where it is falling
     onto the star, orange further out, and cold blue dust at the rim. */
  const HOT = [1.00, 0.92, 0.70], WARM = [1.00, 0.52, 0.16];
  const COOL = [0.62, 0.26, 0.42], RIM = [0.20, 0.34, 0.72];

  for (let i = 0; i < n; i++) {
    // Area-weighted between 0.16 and 1 of the outer radius.
    const r = Math.sqrt(0.026 + rng() * 0.974);
    const th = rng() * TAU;
    // Faint spiral density waves — real discs are grooved with them, and it is
    // the grooves that eventually become planets.
    const dens = 0.45 + wave((th / TAU + r * 0.8) % 1, r) * 1.1;
    if (rng() > dens) continue;
    // Discs flare: they are thin at the middle and puff out towards the rim.
    const h = (0.010 + r * 0.048) * gauss();
    pos.push(Math.cos(th) * r, h, Math.sin(th) * r);

    let c = r < 0.30 ? mix(HOT, WARM, r / 0.30)
      : r < 0.66 ? mix(WARM, COOL, (r - 0.30) / 0.36)
      : mix(COOL, RIM, (r - 0.66) / 0.34);
    // The inside is being lit by the star it is falling onto, so it is far
    // brighter than the rim as well as a different colour.
    const lit = (0.35 + 1.5 * Math.pow(1 - r, 1.7)) * (0.75 + rng() * 0.5);
    col.push(c[0] * lit, c[1] * lit, c[2] * lit);
    // Wide enough that neighbours run into each other. Small separate dots read
    // as scattered grit; only once they overlap do they become cloud.
    siz.push(0.020 + Math.pow(rng(), 2) * 0.085);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildDiscVisual(d) {
  const g = new THREE.Group();
  const pts = new THREE.Points(discGeometry(d.seed % 9973, 9000), new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0.5 }, uScale: { value: 1 }, uFocal: { value: 1 } },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  pts.frustumCulled = false;
  pts.renderOrder = 2;
  g.add(pts);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.axis);
  scene.add(g);
  d.obj = g; d.pts = pts;
}

function disposeDisc(d) {
  if (!d.obj) return;
  scene.remove(d.obj);
  d.obj.traverse(o => { if (o.material) o.material.dispose(); });
  d.obj = null; d.pts = null;
  if (d.host && d.host.disc === d) d.host.disc = null;
}

function clearDiscs() {
  for (const d of discs) { d.alive = false; disposeDisc(d); }
  discs.length = 0;
}

/** Where water freezes out. Everything past it can build with ice as well as
 *  rock, which is why the giants are all on the outside. */
const iceLineOf = (host) => 2.7 * AU * Math.sqrt(Math.max(host.lum, 1e-4));

/** Condense one planet out of the disc and hand it its share of the mass. */
function condenseFromDisc(d) {
  const host = d.host;
  if (freeSlots() < 1) return false;

  // Log-uniform in radius, so the crowded inner disc still gets its planets.
  const t = Math.random();
  const r = d.rIn * Math.pow(d.rOut / d.rIn, t);
  const ice = iceLineOf(host);
  const inside = r < ice;

  /* Inside the ice line only rock and metal can condense, and that is a tiny
     fraction of what a disc is made of — which is why the whole of Mercury,
     Venus, Earth and Mars together weigh about two Earths, while Jupiter alone
     weighs three hundred. Just past the line, ice condenses too, there is
     suddenly far more solid material to build with, and that is where the
     giants get made. */
  const bonus = (!inside && r < ice * 3.5) ? 2.4 : 1;
  const share = inside ? rnd(0.0015, 0.010) : rnd(0.10, 0.30);
  let chunk = Math.min(d.mass * share * bonus, d.mass * 0.55);
  if (chunk < 1e-4) return false;

  const type = discPlanetType(chunk, inside);
  const ang = Math.random() * TAU;
  const inc = rnd(-0.03, 0.03);
  const dir = d.u.clone().multiplyScalar(Math.cos(ang)).addScaledVector(d.w, Math.sin(ang));
  const tan = d.u.clone().multiplyScalar(-Math.sin(ang)).addScaledVector(d.w, Math.cos(ang));
  tan.applyAxisAngle(dir, inc).normalize();

  const speed = Math.sqrt(G * settings.gravity * (host.m + chunk) / r);
  const b = makeBody(type,
    host.p.clone().addScaledVector(dir, r),
    host.v.clone().addScaledVector(tan, speed),
    { mass: chunk });

  d.mass -= chunk;
  d.made++;
  // A new planet sweeps its own lane clean, so the hole in the middle widens a
  // little — but never so far that the disc stops making inner worlds at all.
  if (r < d.rIn * 1.4) d.rIn = Math.min(r * 1.25, d.rOut * 0.05);
  fx.form(b, false);
  toast(b.name + ' condensed out of ' + host.name + '’s disc');
  return true;
}

function updateDiscs(simDt) {
  for (let i = discs.length - 1; i >= 0; i--) {
    const d = discs[i];
    const host = d.host;

    // No star, no disc: it has nothing left to orbit.
    if (!host || !host.alive || host.kind !== 'body') {
      d.fade -= 0.03;
      if (d.fade <= 0) { d.alive = false; disposeDisc(d); discs.splice(i, 1); continue; }
    } else {
      d.age += simDt;
      d.next -= simDt;
      const every = Math.max(settings.discYears, 0.02) * 365.25;
      if (d.next <= 0) {
        d.next = every * rnd(0.6, 1.4);
        // Discs do not last forever — ours was gone inside about ten million
        // years, blown off by the young Sun once the planets had taken their share.
        if (d.mass > d.m0 * 0.04 && d.made < 12) condenseFromDisc(d);
        else d.fade -= 0.18;
      }
      // What is left of the dust falls onto the star as the disc thins out.
      if (d.fade < 1 && d.mass > 0) {
        const drop = Math.min(d.mass, d.mass * 0.2);
        host.m += drop; d.mass -= drop;
      }
      if (d.fade <= 0) {
        toast(host.name + '’s disc has cleared');
        d.alive = false; disposeDisc(d); discs.splice(i, 1); continue;
      }
    }

    if (!d.obj) continue;
    if (host && host.alive) d.obj.position.copy(host.p);
    d.obj.rotateOnAxis(_YAXIS, Math.sqrt(G * Math.max(host ? host.m : 1, 1e-6) /
      Math.pow(d.rOut * 0.5, 3)) * simDt);
    d.obj.scale.setScalar(d.rOut);
    const u = d.pts.material.uniforms;
    u.uScale.value = d.rOut;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Thins out as its material is used up, and fades away at the end.
    u.uOp.value = clamp(0.05 + 0.17 * (d.mass / d.m0), 0, 0.24) * clamp(d.fade, 0, 1);
    d.pts.visible = u.uOp.value > 0.004 && d.rOut / worldPerPixel(
      Math.max(camera.position.distanceTo(d.obj.position), 1e-9)) > 3;
  }
}

/* =============================================================== drop grid  */
/*
 * A measuring grid on the plane you are about to drop something onto. It exists
 * because "click here" in a 3D view is genuinely ambiguous — the grid says both
 * where the plane is and how big the gaps are, and it can snap the drop point
 * to its intersections so a system can be laid out neatly.
 */

const GRID_N = 40;               // cells across
let gridObj = null, gridCell = 1, lastGridCell = 0;

/** Round up to the nearest 1, 2 or 5 times a power of ten. */
function niceStep(v) {
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1e-12))));
  const m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}

function buildGrid() {
  const pos = [], col = [];
  const half = GRID_N / 2;
  // Fade every line out towards the rim, so the grid dissolves instead of
  // ending at a hard square.
  const fade = (a, b) => Math.pow(clamp(1 - Math.hypot(a, b) / half, 0, 1), 0.9);
  for (let i = 0; i <= GRID_N; i++) {
    const t = i - half;
    // A line is chopped into segments so its brightness can follow the fade.
    for (let j = 0; j < GRID_N; j++) {
      const a = j - half, b = a + 1;
      const axis = (i === half) ? 1.9 : 1;      // the two centre lines run brighter
