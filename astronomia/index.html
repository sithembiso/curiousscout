  const dome = new THREE.Mesh(new THREE.SphereGeometry(SKY_R * 0.9, 48, 24), mat);
  dome.frustumCulled = false;
  dome.renderOrder = -1;
  dome.visible = false;
  scene.add(dome);
  return dome;
}

/*
 * A world's own painted map is a few hundred texels round the whole globe, so
 * at your feet one texel is the size of a county and the ground is a smear. A
 * second copy of the surface mesh carries a fine, tiled grain multiplied over
 * it — invisible from orbit (it averages out in the mipmaps), but enough on
 * the ground to give the eye some gravel and grit to judge distance by.
 */
function grainTexture() {
  const N = 256, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N), d = img.data;
  const rnd = mulberry32(90210);
  // wrapped value noise at a few scales, so the tile repeats without a seam
  const layers = [8, 16, 32, 64].map(g => ({ g, v: Float32Array.from({ length: g * g }, () => rnd()) }));
  const at = (L, x, y) => {
    const fx = x * L.g / N, fy = y * L.g / N;
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = smoothstep(fx - x0), ty = smoothstep(fy - y0);
    const g = L.g, v = L.v, x1 = (x0 + 1) % g, y1 = (y0 + 1) % g;
    const a = v[y0 * g + x0] + (v[y0 * g + x1] - v[y0 * g + x0]) * tx;
    const b = v[y1 * g + x0] + (v[y1 * g + x1] - v[y1 * g + x0]) * tx;
    return a + (b - a) * ty;
  };
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let n = 0, w = 0.5;
      for (const L of layers) { n += at(L, x, y) * w; w *= 0.62; }
      const grit = rnd() * 0.10;
      const c = clamp(0.62 + n * 0.42 - grit, 0, 1) * 255;
      const i = (y * N + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = c; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(320, 160);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

let GRAIN = null;
function attachDetail(surf) {
  dropDetail();
  if (!GRAIN) GRAIN = grainTexture();
  const m = new THREE.Mesh(surf.geometry, new THREE.MeshBasicMaterial({
    map: GRAIN, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  }));
  m.renderOrder = 2;
  surf.add(m);
  land.detail = m; land.detailOn = surf;
}

function dropDetail() {
  if (land.detail) {
    land.detail.parent && land.detail.parent.remove(land.detail);
    land.detail.material.dispose();
  }
  land.detail = null; land.detailOn = null;
}

/** The brightest light in this world's sky, as a direction from `at`, or null. */
function brightestSun(b, at) {
  let best = null, score = 0;
  for (const s of sim.starCache) {
    if (s === b || !s.alive || !(s.lum > 0)) continue;
    const d2 = Math.max(s.p.distanceToSquared(at), 1e-18);
    if (s.lum / d2 > score) { score = s.lum / d2; best = s; }
  }
  return best ? best.p.clone().sub(at).normalize() : null;
}

/** The colour of a world's air, or null if it has none worth the name. */
function airOf(b) {
  const def = TYPES[b.type];
  if (def.atmo) return def.atmo;
  if (b.terra > 0.3 && !def.star) return SKY;   // a world terraformed into breathing
  return null;
}

const _lN = new THREE.Vector3(), _lNorth = new THREE.Vector3(), _lEast = new THREE.Vector3();
const _lFwd = new THREE.Vector3(), _lEye = new THREE.Vector3(), _lLook = new THREE.Vector3();

function applyLanded(realDt) {
  const b = land.b;
  if (!b.alive || !b.parts || !b.parts.surf || landBlock(b)) {
    const name = b.name;
    leaveSurface();
    toast(b.alive ? 'You had to leave ' + name + ' in a hurry!' : name + ' is gone — you are adrift in space.');
    return;
  }
  const surf = b.parts.surf;
  // The mesh is rebuilt whenever the world changes type or takes a crater.
  if (land.detailOn !== surf || (land.detail && land.detail.geometry !== surf.geometry)) attachDetail(surf);
  b.obj.updateMatrixWorld(true);
  const r = visRadius(b);

  // Your local compass: up out of the ground, north toward the spin axis.
  const up = _lN.copy(land.n).transformDirection(surf.matrixWorld);
  _lNorth.set(0, 1, 0).transformDirection(surf.matrixWorld);
  _lNorth.addScaledVector(up, -_lNorth.dot(up));
  if (_lNorth.lengthSq() < 1e-8) _lNorth.set(1, 0, 0).addScaledVector(up, -up.x);
  _lNorth.normalize();
  _lEast.crossVectors(_lNorth, up).normalize();
  _lFwd.copy(_lNorth).multiplyScalar(Math.cos(land.yaw)).addScaledVector(_lEast, Math.sin(land.yaw));

  // Walk: turn the position vector itself, so you go round the world.
  const k = land.keys;
  let fwd = 0, side = 0;
  if (k.has('w') || k.has('arrowup')) fwd += 1;
  if (k.has('s') || k.has('arrowdown')) fwd -= 1;
  if (k.has('d') || k.has('arrowright')) side += 1;
  if (k.has('a') || k.has('arrowleft')) side -= 1;
  if (k.has('q')) land.alt *= Math.pow(0.4, realDt);
  if (k.has('e')) land.alt *= Math.pow(2.5, realDt);
  land.alt = clamp(land.alt, LAND_MIN_ALT, LAND_MAX_ALT);
  if (fwd || side) {
    const pace = Math.max(land.alt, 0.006) * (k.has('shift') ? 9 : 2) * realDt;
    const step = _lLook.copy(_lFwd).multiplyScalar(fwd).addScaledVector(_lEast, side).normalize();
    up.addScaledVector(step, pace).normalize();
    land.n.copy(up).transformDirection(_invOf(surf));
  }

  // Ground height: drop a ray straight down onto what is drawn.
  if (!land.ray) land.ray = new THREE.Raycaster();
  _lEye.copy(b.p).addScaledVector(up, r * 3);
  land.ray.set(_lEye, _lLook.copy(up).negate());
  land.ray.near = 0; land.ray.far = r * 3;
  const targets = [surf];
  if (b.parts.sea && b.parts.sea.visible !== false) targets.push(b.parts.sea);
  const hit = land.ray.intersectObjects(targets, false)[0];
  const ground = hit ? r * 3 - hit.distance : r * groundAt(b, land.n);

  const h = land.alt * r;
  _lEye.copy(b.p).addScaledVector(up, ground + h);
  camera.position.copy(_lEye);
  camera.up.copy(up);
  land.pitch = clamp(land.pitch, -1.5, 1.5);
  _lLook.copy(_lFwd).multiplyScalar(Math.cos(land.pitch)).addScaledVector(up, Math.sin(land.pitch));
  camera.lookAt(_lEye.clone().add(_lLook));
  camera.near = Math.max(1e-9, h * 0.05);
  camera.far = Math.max(SKY_R * 2.2, galx.live > 0 ? 2e17 : 0);
  camera.updateProjectionMatrix();
  if (skyGroup) skyGroup.position.copy(_lEye);
  // Keep the orbit camera parked on this world, so taking off and every
  // level-of-detail test that reads `view` both find it.
  view.target.copy(b.p);
  view.dist = ground + h;

  // The sky.
  const dome = land.dome, air = airOf(b);
  const sun = brightestSun(b, _lEye);
  if (dome) {
    dome.visible = !!air;
    dome.position.copy(_lEye);
    if (air) {
      const u = dome.material.uniforms;
      const el = sun ? sun.dot(up) : -1;
      u.uUp.value.copy(up);
      if (sun) u.uSun.value.copy(sun);
      u.uCol.value.setRGB(air[0] / 255, air[1] / 255, air[2] / 255);
      // Climb out of the air and the sky goes back to black.
      const thin = 1 - smoothstep(clamp((land.alt - 0.03) / 0.35, 0, 1));
      u.uDay.value = smoothstep(clamp((el + 0.08) / 0.30, 0, 1)) * thin;
      u.uDusk.value = Math.max(0, 1 - Math.abs(el) / 0.25) * thin;
    }
  }
}

function landedHUD() {
  const b = land.b;
  if (!b) return '';
  return 'On <b>' + b.name + '</b> &middot; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk ' +
    '&middot; <kbd>Shift</kbd> run &middot; <kbd>Q</kbd>/<kbd>E</kbd> or scroll: lower/higher ' +
    '&middot; drag to look &middot; <kbd>Esc</kbd> take off';
}

function resize() {
  // Never let the viewport reach zero: a hidden or collapsed window reports
  // 0×0, and every worldPerPixel() division downstream would become Infinity.
  const w = Math.max(window.innerWidth, 1), h = Math.max(window.innerHeight, 1);
  VIEW.w = w; VIEW.h = h;
  VIEW.dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(VIEW.dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (rt) rt.setSize(Math.floor(w * VIEW.dpr), Math.floor(h * VIEW.dpr));
}

/* ========================================================= selection marker */

/**
 * Drawn as an SVG overlay rather than a sprite in the scene: anything inside the
 * 3D pass gets warped and darkened by the black-hole lensing shader, which had
 * been swallowing the reticle whole whenever you selected a hole.
 */
function updateReticle() {
  const el = $('an-ret');
  const b = sim.selected;
  if (!b || !b.alive || b === land.b) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const px = apparentPx(b);
  // Once a body fills the view it is obvious what is selected, and a reticle
  // that size just sprawls across the panels.
  if (px > VIEW.h * 0.3) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  _lp.copy(b.p).project(camera);
  if (_lp.z < -1 || _lp.z > 1) { el.style.display = 'none'; return; }
  el.setAttribute('cx', ((_lp.x + 1) * 0.5 * VIEW.w).toFixed(1));
  el.setAttribute('cy', ((1 - _lp.y) * 0.5 * VIEW.h).toFixed(1));
  el.setAttribute('r', Math.max(px * 1.55, 20).toFixed(1));
  if (el.style.display !== 'block') el.style.display = 'block';
}

/* =================================================================== labels */

const LABEL_POOL = 22;
const labelEls = [];

function initLabels() {
  const host = document.getElementById('an-app');
  for (let i = 0; i < LABEL_POOL; i++) {
    const d = document.createElement('div');
    d.className = 'an-label';
    d.style.display = 'none';
    host.appendChild(d);
    labelEls.push(d);
  }
}

const _lp = new THREE.Vector3();

function updateLabels() {
  if (!settings.labels) {
    for (const el of labelEls) if (el.style.display !== 'none') el.style.display = 'none';
    return;
  }
  // Zoomed out, every body is a sub-pixel dot indistinguishable from a
  // background star, so rank by significance (apparent size plus mass) and let
  // the pool size decide how many get named rather than a raw pixel threshold.
  const cands = [];
  for (const b of sim.bodies) {
    if (b === land.b) continue;           // you are standing on it
    if (shyFar(b)) continue;              // no name tag until you have found it
    if (land.b && _tmpA.copy(b.p).sub(camera.position).normalize().dot(camera.up) < -0.03) continue;  // below your horizon
    const px = apparentPx(b);
    const score = (b === sim.selected || b === sim.follow)
      ? 1e9
      : px + Math.log10(Math.max(b.m, 1e-12)) * 0.9;
    cands.push([score, b, px]);
  }
  // A live supernova outranks everything — it is the only thing anyone is
  // looking at — and its label doubles as a running brightness readout.
  for (const e of supernovae) {
    if (e.lum < 1 && !(e.cloud && e.cloud.n > 0)) continue;
    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));
    cands.push([2e9, e, clamp(e.r / wpp, 6, 90)]);
  }
  for (const u of universes) cands.push([3e9, u, 14]);
  for (const m of marks) if (!shyFar(m)) cands.push([m.sub === 'probe' ? 1.2e9 : 1.1e9, m, 6]);
  cands.sort((a, b) => b[0] - a[0]);

  // Bodies that sit on top of each other at this zoom (Earth and its Moon, a
  // debris cloud) would otherwise stack their names into an unreadable smear.
  const taken = [];
  let slot = 0;

  for (let ci = 0; ci < cands.length && slot < LABEL_POOL; ci++) {
    const c = cands[ci];
    const b = c[1];
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1 || _lp.x < -1.1 || _lp.x > 1.1 || _lp.y < -1.1 || _lp.y > 1.1) continue;

    const x = (_lp.x + 1) * 0.5 * VIEW.w;
    const y = (1 - _lp.y) * 0.5 * VIEW.h;
    let clash = false;
    for (let t = 0; t < taken.length; t++) {
      if (Math.abs(taken[t][0] - x) < 52 && Math.abs(taken[t][1] - y) < 13) { clash = true; break; }
    }
    if (clash && b !== sim.selected && b !== sim.follow) continue;
    taken.push([x, y]);

    const el = labelEls[slot++];
    const off = Math.min(Math.max(c[2], 5) + 9, 90);
    el.style.transform = 'translate(-50%,0) translate(' + x.toFixed(1) + 'px,' + (y + off).toFixed(1) + 'px)';
    if (el.textContent !== b.name) el.textContent = b.name;
    el.classList.toggle('sel', b === sim.selected);
    if (el.style.display !== 'block') el.style.display = 'block';
  }

  for (let i = slot; i < LABEL_POOL; i++) {
    const el = labelEls[i];
    if (el.style.display !== 'none') el.style.display = 'none';
  }
}

/* The Milky Way map hides the Solar System: its bodies carry `shy`, and until
   the camera is within SHY_RANGE of one (about 1,300 AU — inside the Oort
   cloud) it has no label, no marker and no more glare than any other star. */
const SHY_RANGE = 2e5;
function shyFar(b) {
  return !!b.shy && b !== sim.selected && b !== sim.follow &&
    camera.position.distanceTo(b.p) > SHY_RANGE;
}

function apparentPx(b) {
  const d = camera.position.distanceTo(b.p);
  return visRadius(b) / worldPerPixel(Math.max(d, 1e-9));
}

/* ========================================================== visual update   */

const _dir = new THREE.Vector3();
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const FROST = new THREE.Color(0.72, 0.82, 0.95);
/* What a living world fades to when it stops being one: dust. */
const DEAD = new THREE.Color(0.60, 0.53, 0.44);

function refreshStarCache() {
  sim.starCache.length = 0;
  for (const b of sim.bodies) {
    const d = TYPES[b.type];
    // A black dwarf is not a light source, so it neither warms anything nor
    // takes up one of the scene's light slots.
    if (d.dead) continue;
    if (b.lum > 0 || (d.star && b.kind === 'body')) sim.starCache.push(b);
  }
  // A supernova is a light source like any other — briefly the brightest in the
  // sky by a factor of billions. It carries .p, .lum and .lightColor, which is
  // everything the lighting and temperature passes ask of a star.
  for (const e of supernovae) if (e.lum > 1e-3) sim.starCache.push(e);
}

function nearestStar(b) {
  let best = null, bestD = Infinity;
  for (const s of sim.starCache) {
    if (s === b) continue;
    const d = b.p.distanceToSquared(s.p);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function updateVisuals(realDt, simDt) {
  /* The impact effects — a world sinking into another, flashes, the swirl of a
     birth — run on the wall clock, so they stay watchable at any time rate. But
     they must keep pace with what is being played: slowed in slow motion along
     with everything else, and frozen while time is paused. */
  const fxDt = sim.running ? realDt * slowmoScale() : 0;
  // Worlds part-way inside one another. First, because finishing one removes a body.
  updateEngulf(fxDt);
  // Then, because an explosion can destroy bodies and is itself a light source
  // that the two passes below need to know about.
  updateSupernovae(simDt);
  updateDiscs(simDt);
  updateClumps(simDt);
  coolCores(simDt);
  coolScars(simDt);
  refreshStarCache();
  updateTemperatures();
  // After the temperatures, because whether a world can live is decided by the
  // starlight actually falling on it this frame.
  updateTerraform(simDt);
  updateLights();
  updateGalaxies();
  updateGrid();

  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    const p = b.parts;
    if (!p) continue;
    // Galaxies are sized and posed entirely by updateGalaxies, on screen terms
    // that nothing in this loop applies to.
    if (b.kind === 'gal') { b.obj.position.copy(b.p); continue; }

    if (b.kind === 'gas') {
      const rc = visRadius(b);
      const wppC = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
      b.obj.position.copy(b.p);
      b.obj.rotation.y = b.rot * 0.3;
      p.puff.scale.setScalar(rc);
      const uc = p.puff.material.uniforms;
      uc.uScale.value = rc;
      uc.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
      // Fades as it cools: a knot that has given up its heat is barely there.
      uc.uOp.value = clamp(0.08 + b.temp / 7000, 0.07, 0.44);
      p.puff.visible = rc / wppC > 1.2;
      // The colour of the glow IS the temperature, same as everything else here.
      const kc = kelvinToRGB(clamp(b.temp, 1000, 6000));
      p.clumpGlow.material.color.setRGB(kc[0] / 255, kc[1] / 255, kc[2] / 255);
      p.clumpGlow.scale.setScalar(Math.max(rc * 1.5, 7 * wppC));
      p.clumpGlow.material.opacity = clamp(0.10 + b.temp / 14000, 0.1, 0.42);
      if (p.dot) p.dot.visible = false;
      continue;
    }

    const def = TYPES[b.type];
    const r = visRadius(b);
    const px = apparentPx(b);

    b.obj.position.copy(b.p);
    b.obj.rotation.z = b.tilt;

    // Colour follows mass, so a star that has been fed or drained is repainted
    // the moment it crosses a band — and only then. This runs every frame.
    if (def.star && starBand(b) !== b.band) applyStarBand(b);

    /* Water is liquid or it is ice, and which one is simply how cold the world
       is. The change happens over forty kelvin either side of freezing rather
       than at a hard line, because a world is not all one temperature. */
    if (p.sea) {
      const frozen = clamp((273 - b.temp) / 40, 0, 1);
      p.sea.material.color.copy(WATER_LIQUID).lerp(WATER_ICE, frozen);
      p.sea.material.roughness = lerp(0.22, 0.78, frozen);
      p.sea.rotation.y = b.rot;
    }

    // ---- level of detail: below a couple of pixels, draw a dot instead
    const tiny = px < 1.7;
    if (p.surf) p.surf.visible = !tiny;
    if (p.cloud) p.cloud.visible = !tiny && px > 5;
    if (p.atmo) p.atmo.visible = !tiny && px > 4;
    if (p.ring) p.ring.visible = !tiny;
    if (p.disk) p.disk.visible = !tiny;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    const hiding = shyFar(b);
    if (p.dot) {
      // A shy body far away gives itself away with nothing: a star is one more
      // faint speck among the galaxy's, and its worlds are not marked at all.
      const show = hiding ? def.star : (tiny || def.star || b.kind === 'wh');
      p.dot.visible = show;
      // Normally drawn over everything so nothing is ever lost; standing on a
      // world, the ground has to be allowed to hide a star that has set.
      p.dot.material.depthTest = !!land.b;
      if (show) {
        const size = hiding ? 2.2 * wpp : tiny ? 5.4 * wpp : Math.max(r * 2.2, 3.0 * wpp);
        p.dot.scale.setScalar(size);
        // Zoomed far out these dots are the only trace of a planet, so keep
        // them legible rather than fading them to nothing.
        p.dot.material.opacity = hiding ? 0.7 : tiny ? clamp(0.45 + px * 0.3, 0.45, 1) : 0.55;
      }
    }

    if (p.surf && !tiny) p.surf.rotation.y = b.rot;
    if (p.cloud) p.cloud.rotation.y = b.rot * 1.12;
    // The outer layers of a star lag the surface, so let them. The shear is
    // what sells the shells as standing at different heights rather than
    // being painted onto the same ball.
    if (p.chromo) p.chromo.rotation.y = b.rot * 0.93;
    if (p.corona) p.corona.rotation.y = b.rot * 0.79;

    // ---- lighting direction for the atmosphere rim
    if (p.atmo && p.atmo.visible) {
      const s = nearestStar(b);
      if (s) _dir.copy(s.p).sub(b.p).normalize();
      else _dir.copy(camera.position).sub(b.p).normalize();
      p.atmo.material.uniforms.uLight.value.copy(_dir);
    }

    // ---- stars: glow scaled with a pixel floor so they never disappear
    if (p.glow) {
      p.glow.scale.setScalar(Math.max(r * 3.4, (hiding ? 1.5 : 11) * wpp));
      p.halo.scale.setScalar(Math.max(r * 9.5, (hiding ? 2 : 34) * wpp));
      // Glare is something you see from far away. Up close the halo is nine
      // times the star's own radius, so flying in would fill the whole screen
      // with additive white and bleach the photosphere into a featureless
      // blob. Fade it out as the disc grows: by the time the star fills the
      // view you should be looking at its surface, not at its glare.
      const fill = px / Math.max(VIEW.h, 1);
      const far = clamp(1 - (fill - 0.20) / 0.60, 0, 1);
      p.glow.material.opacity = 0.05 + far * 0.95;
      p.halo.material.opacity = far;
      p.halo.visible = far > 0.01;
    }

    // ---- black holes
    if (p.disk && !p.disk.isPoints) p.disk.rotation.z += realDt * 0.35;
    if (def.naked && p.glow) {
      const hue = (performance.now() / 6000 + b.seed * 1e-3) % 1;
      p.glow.material.color.setHSL(hue, 0.9, 0.78);
      p.halo.material.color.setHSL((hue + 0.33) % 1, 0.9, 0.62);
      p.photon.material.color.setHSL((hue + 0.66) % 1, 0.8, 0.7);
    }
    if (p.photon) p.photon.scale.setScalar(Math.max(r * 5.6, 16 * wpp));

    // ---- a world's appearance responds to how hot it is
    if (b.glowPulse) b.glowPulse = Math.max(0, b.glowPulse - realDt * 0.4);
    if (p.surf && b.baseColor && p.surf.material.isMeshStandardMaterial) {
      const mat = p.surf.material;
      const hot = clamp((b.temp - 900) / 1300, 0, 1);
      const base = def.glowHot ? def.glowHot * 0.55 : 0;
      // A freshly transformed world glows from the heat of its own collapse.
      const pulse = b.glowPulse ? Math.pow(b.glowPulse, 0.7) : 0;
      const e = Math.max(base, hot * 0.85, pulse);
      mat.emissive.setRGB(e, e * 0.28, e * 0.05);
      const cold = clamp((110 - b.temp) / 70, 0, 1) * 0.5;
      mat.color.copy(b.baseColor).lerp(FROST, cold);
      // A world that was born living and is now losing it goes brown first.
      if (b.terra < 1 && isLivingSurf(def)) mat.color.lerp(DEAD, (1 - b.terra) * 0.85);
    }

    // ---- the living layer fading in or out over a terraformed world
    if (p.terraSkin) {
      const t = clamp(b.terra, 0, 1);
      const show = t > 0.004 && !tiny;
      p.terraSkin.visible = show;
      if (show) {
        p.terraSkin.material.opacity = t;
        p.terraSkin.rotation.y = b.rot;
        // Oceans appear before the land greens over, so the shine comes in first.
        p.terraSkin.material.roughness = lerp(0.95, 0.72, t);
      }
      if (p.terraCloud) {
        p.terraCloud.visible = show && px > 5;
        p.terraCloud.material.opacity = t * 0.85;
        p.terraCloud.rotation.y = b.rot * 1.12;
      }
      if (p.terraAtmo) {
        p.terraAtmo.visible = show && px > 4;
        p.terraAtmo.material.uniforms.uStrength.value = t * 0.95;
        const s = nearestStar(b);
        if (s) _dir.copy(s.p).sub(b.p).normalize();
        else _dir.copy(camera.position).sub(b.p).normalize();
        p.terraAtmo.material.uniforms.uLight.value.copy(_dir);
      }
    }

    // ---- comet tail: grows as it nears a star, always pointing away from it
    if (p.tail) {
      const s = nearestStar(b);
      let len = 0, flux = 0;
      if (s) {
        const dAU = Math.max(b.p.distanceTo(s.p) / AU, 1e-3);
        flux = s.lum / (dAU * dAU);
        // An absolute scale, not a multiple of the nucleus: a comet is a few km
        // across but its tail runs for a good fraction of an AU. Below roughly
        // 5 AU of sunlight there is not enough heat to outgas at all.
        if (flux > 0.03) len = 0.16 * AU * Math.pow(clamp(flux, 0, 60), 0.4);
      }
      const visible = len > 0 && len / wpp > 4;
      p.tail.visible = visible;
      if (p.coma) {
        p.coma.visible = visible;
        p.coma.scale.setScalar(Math.max(len * 0.035, r * 6, 4 * wpp));
        p.coma.material.opacity = clamp(Math.pow(clamp(flux, 0, 60), 0.35) * 0.4, 0.12, 0.9);
      }
      if (visible) {
        _tmpA.copy(b.p).sub(s.p).normalize();                       // away from the star
        _tmpB.copy(camera.position).sub(b.p).normalize();
        const z = _tmpB.clone().addScaledVector(_tmpA, -_tmpB.dot(_tmpA));
        if (z.lengthSq() < 1e-12) z.set(0, 1, 0); else z.normalize();
        const y = new THREE.Vector3().crossVectors(z, _tmpA);
        _basis.makeBasis(_tmpA, y, z);
        _basis.scale(new THREE.Vector3(len, len * 0.14, 1));
        _basis.setPosition(b.p);
        p.tail.matrixAutoUpdate = false;
        p.tail.matrix.copy(_basis);
        p.tail.matrixWorldNeedsUpdate = true;
      }
    }
  }

  updateReticle();
  updateTrails();
  updateParticles(simDt);
  updateFx(fxDt, simDt);
  updateLabels();
}

/* ==================================================================== input */

const $ = (id) => document.getElementById(id);
const raycaster = new THREE.Raycaster();

const input = {
  mode: null,
  armed: null,
  x0: 0, y0: 0, x: 0, y: 0,
  moved: false,
  placePos: null,
  pointers: new Map(),
  pinchD: 0, pinchX: 0, pinchY: 0
};

/**
 * Map a screen point onto a world position. The horizontal plane through the
 * focus point is preferred so built systems stay roughly coplanar; when the
 * camera is too close to edge-on, fall back to a plane facing the camera.
 */
function screenToWorld(sx, sy) {
  raycaster.setFromCamera(new THREE.Vector2((sx / VIEW.w) * 2 - 1, -(sy / VIEW.h) * 2 + 1), camera);
  const ray = raycaster.ray;
  if (Math.abs(ray.direction.y) > 0.10) {
    const t = (view.target.y - ray.origin.y) / ray.direction.y;
    if (t > 0 && t < view.dist * 40) return ray.origin.clone().addScaledVector(ray.direction, t);
  }
  const n = camera.getWorldDirection(new THREE.Vector3());
  const denom = n.dot(ray.direction);
  const t = Math.abs(denom) > 1e-6 ? n.dot(_tmpA.copy(view.target).sub(ray.origin)) / denom : view.dist;
  return ray.origin.clone().addScaledVector(ray.direction, clamp(t, view.dist * 0.02, view.dist * 40));
}

/** Pick by screen distance rather than mesh intersection, so tiny bodies work. */
function pickBody(sx, sy) {
  let best = null, bestScore = Infinity;
  for (const b of sim.bodies) {
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    // A galaxy is drawn thousands of pixels wide, so sizing its hit area to
    // what you can see would let it swallow every click on screen. It is picked
    // by its core, and only when nothing solid is closer.
    const gal = b.kind === 'gal';
    const reach = gal ? 34 : Math.max(apparentPx(b) + 10, 16);
    if (d > reach) continue;
    const score = gal ? d + 400 : d - apparentPx(b) * 0.25;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) return best;

  // Spacecraft and landmarks, by their markers.
  for (const m of marks) {
    if (shyFar(m)) continue;
    _lp.copy(m.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    if (Math.hypot((_lp.x + 1) * 0.5 * VIEW.w - sx, (1 - _lp.y) * 0.5 * VIEW.h - sy) < 14) return m;
  }
  // A universe is picked by its middle, like a galaxy — and only when there is
  // nothing in it nearer the cursor.
  for (const u of universes) {
    _lp.copy(u.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const d = Math.hypot((_lp.x + 1) * 0.5 * VIEW.w - sx, (1 - _lp.y) * 0.5 * VIEW.h - sy);
    if (d < 30) return u;
  }

  // Only fall through to remnant clouds when nothing solid is under the cursor —
  // a cloud covers half the screen, and you still need to be able to click the
  // neutron star sitting in the middle of it.
  let bestD = Infinity;
  for (const e of supernovae) {
    if (!e.alive || !e.cloud || e.cloud.mass <= 0) continue;
    _lp.copy(e.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    if (d > Math.max(apparentPx(e), 26)) continue;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/** The body whose gravity dominates at a point — used for auto-orbit. */
function dominantAt(pos, exclude) {
  let best = null, bestPull = 0;
  for (const b of sim.bodies) {
    if (b === exclude || b.kind === 'wh') continue;
    const d2 = Math.max(b.p.distanceToSquared(pos), 1e-9);
    const pull = b.m / d2;
    if (pull > bestPull) { bestPull = pull; best = b; }
  }
  return best;
}

/**
 * Two bodies orbit their shared centre of mass — the barycentre — not one
 * another. A new body was being given its orbital speed while the thing it
 * orbits stood still, so the pair as a whole carried all that momentum and
 * drifted off together in whatever direction the newcomer happened to be
 * thrown. Here the momentum is shared out instead: the newcomer and its
 * primary move in opposite directions in proportion to their masses, so the
 * barycentre carries on exactly as the primary was going. Anything already
 * orbiting the primary (its planets) moves with it.
 *
 * A tapped auto-orbit is also made circular for the pair: the relative speed
 * comes from both masses, as a real binary's does, not the primary's alone.
 */
function shareMomentum(b, P, circular) {
  if (P === b || P.kind === 'gal' || P.kind === 'wh' || !(P.m > 0)) return;
  const mP = P.m, mb = b.m, M = mP + mb;
  const vrel = b.v.clone().sub(P.v);
  const r = b.p.distanceTo(P.p);
  const mu = G * settings.gravity * M;
  if (circular) vrel.multiplyScalar(Math.sqrt(M / mP));
  // Only a pair that will stay together shares a barycentre; something thrown
  // past at escape speed just flies by.
  if (vrel.lengthSq() / 2 - mu / Math.max(r, 1e-12) >= 0) return;
  // Everything the primary is already carrying round, which must come with it.
  const family = sim.bodies.filter(o => o !== b && o !== P && o.alive && dominantAt(o.p, o) === P);
  const vcm = P.v.clone();
  const dv = vrel.clone().multiplyScalar(-mb / M);
  P.v.copy(vcm).add(dv);
  for (const o of family) o.v.add(dv);
  b.v.copy(vcm).addScaledVector(vrel, mP / M);
}

/* ---------------------------------------------------------------- barycentres */
/*
 * Where a pair is heavy enough on both sides for it to show — a binary star,
 * Pluto and Charon — the point they both swing round is marked with a small
 * crosshair.
 */
const BARY_MAX = 24;
const baryPool = [];
let TEX_BARY = null;
function baryTexture() {
  const N = 64, cv = newCanvas(N, N), c = cv.getContext('2d');
  c.strokeStyle = 'rgba(255,255,255,1)';
  c.lineWidth = 4;
  c.beginPath(); c.arc(N / 2, N / 2, N * 0.30, 0, TAU); c.stroke();
  c.beginPath();
  c.moveTo(N / 2, 2); c.lineTo(N / 2, N * 0.30); c.moveTo(N / 2, N * 0.70); c.lineTo(N / 2, N - 2);
  c.moveTo(2, N / 2); c.lineTo(N * 0.30, N / 2); c.moveTo(N * 0.70, N / 2); c.lineTo(N - 2, N / 2);
  c.stroke();
  return new THREE.CanvasTexture(cv);
}

function updateBarycentres() {
  let n = 0;
  const gm = G * settings.gravity;
  if (settings.labels) {
    for (const b of sim.bodies) {
      if (n >= BARY_MAX) break;
      if (!b.alive || b.kind === 'gal' || b.kind === 'gas' || shyFar(b)) continue;
      const P = dominantAt(b.p, b);
      if (!P || P.m < b.m || b.m / P.m < 0.05 || P.kind === 'gal' || P.kind === 'wh') continue;
      const r = b.p.distanceTo(P.p);
      if (b.v.distanceToSquared(P.v) / 2 - gm * (P.m + b.m) / Math.max(r, 1e-12) >= 0) continue;
      if (!TEX_BARY) TEX_BARY = baryTexture();
      let sp = baryPool[n];
      if (!sp) {
        sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_BARY, color: new THREE.Color(0xff9ad8),
          transparent: true, depthWrite: false, depthTest: false, opacity: 0.75 }));
        sp.renderOrder = 7;
        scene.add(sp);
        baryPool[n] = sp;
      }
      sp.position.copy(P.p).multiplyScalar(P.m).addScaledVector(b.p, b.m).divideScalar(P.m + b.m);
      sp.scale.setScalar(13 * worldPerPixel(Math.max(camera.position.distanceTo(sp.position), 1e-9)));
      sp.visible = true;
      n++;
    }
  }
  for (let i = n; i < baryPool.length; i++) baryPool[i].visible = false;
}

/** Circular-orbit velocity about `primary` at `pos`, in the horizontal plane. */
function circularVelocity(primary, pos) {
  const rel = pos.clone().sub(primary.p);
  const d = rel.length();
  if (d < 1e-9) return new THREE.Vector3();
  const speed = Math.sqrt(G * settings.gravity * primary.m / d);
  let tang = new THREE.Vector3(0, 1, 0).cross(rel);
  if (tang.lengthSq() < 1e-12) tang = new THREE.Vector3(1, 0, 0).cross(rel);
  tang.normalize().multiplyScalar(speed);
  return tang.add(primary.v);
}

function bindInput() {
  const c = canvasEl;
  c.addEventListener('contextmenu', e => e.preventDefault());

  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId);
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.pointers.size === 2) {
      const p = [...input.pointers.values()];
      input.mode = 'pinch';
      input.pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      input.pinchX = (p[0].x + p[1].x) / 2;
      input.pinchY = (p[0].y + p[1].y) / 2;
      hideAim();
      return;
    }
    if (input.pointers.size > 2) return;

    input.x0 = input.x = e.clientX;
    input.y0 = input.y = e.clientY;
    input.moved = false;

    if (input.armed && e.button === 0 && !e.shiftKey) {
      input.mode = 'place';
      input.placePos = snapToGrid(screenToWorld(e.clientX, e.clientY));
    } else if (e.button === 2 || e.button === 1 || e.shiftKey) {
      input.mode = 'pan';
    } else {
      input.mode = 'orbit';
    }
  });

  c.addEventListener('pointermove', (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.mode === 'pinch' && input.pointers.size >= 2) {
      const p = [...input.pointers.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (land.b) {
        if (input.pinchD > 0) land.alt = clamp(land.alt * clamp(input.pinchD / Math.max(d, 1), 0.4, 2.5), LAND_MIN_ALT, LAND_MAX_ALT);
        input.pinchD = d; input.pinchX = mx; input.pinchY = my;
        return;
      }
      if (input.pinchD > 0) zoomBy(clamp(input.pinchD / Math.max(d, 1), 0.4, 2.5));
      panBy(mx - input.pinchX, my - input.pinchY);
      input.pinchD = d; input.pinchX = mx; input.pinchY = my;
      return;
    }

    const dx = e.clientX - input.x, dy = e.clientY - input.y;
    input.x = e.clientX; input.y = e.clientY;
    if (Math.hypot(e.clientX - input.x0, e.clientY - input.y0) > 5) input.moved = true;

    if (land.b && (input.mode === 'orbit' || input.mode === 'pan')) {
      land.yaw += dx * 0.004;
      land.pitch -= dy * 0.004;
    } else if (input.mode === 'orbit') {
      view.yaw -= dx * 0.005;
      view.pitch += dy * 0.005;
    } else if (input.mode === 'pan') {
      panBy(dx, dy);
      sim.follow = null;
      galx.focus = -1;
    } else if (input.mode === 'place') {
      drawAim();
    }
  });

  const finish = (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.delete(e.pointerId);

    if (input.mode === 'place') {
      dropArmed();
      hideAim();
    } else if (input.mode === 'orbit' && !input.moved) {
      const hit = pickBody(e.clientX, e.clientY);
      const neb = hit ? null : pickNebula(e.clientX, e.clientY);
      const star = hit || neb ? -1 : pickGalaxyStar(e.clientX, e.clientY);
      select(hit);
      if (neb) focusNebula(neb);
      else if (star >= 0) focusGalaxyStar(star);
    }
    if (input.pointers.size === 0) input.mode = null;
    else if (input.pointers.size === 1) {
      const p = [...input.pointers.values()][0];
      input.mode = 'orbit'; input.x = p.x; input.y = p.y; input.moved = true;
    }
  };
  c.addEventListener('pointerup', finish);
  c.addEventListener('pointercancel', finish);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = Math.pow(1.0016, e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY);
    if (land.b) land.alt = clamp(land.alt * f, LAND_MIN_ALT, LAND_MAX_ALT);
    else zoomBy(f);
  }, { passive: false });

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
  // Held keys for walking; cleared if the window loses focus mid-stride.
  window.addEventListener('keyup', (e) => land.keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => land.keys.clear());
}

function panBy(dx, dy) {
  const wpp = worldPerPixel(view.dist);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  view.target.addScaledVector(right, -dx * wpp).addScaledVector(up, dy * wpp);
}

/* ------------------------------------------------------------- aim overlay  */

function velocityFromDrag() {
  const pos = input.placePos;
  const primary = dominantAt(pos, null);
  let vRef;
  if (primary) {
    const d = Math.max(primary.p.distanceTo(pos), 1e-9);
    vRef = Math.sqrt(G * settings.gravity * primary.m / d);
  } else {
    vRef = 2.592;                                     // ~30 km/s, a homely orbital speed
  }
  const dx = input.x - input.x0, dy = input.y - input.y0;
  const px = Math.hypot(dx, dy);
  if (px < 6) {
    // A tap with no drag: give it a circular orbit if that makes sense.
    if (settings.autoOrbit && primary && primary.m > 0.01) return circularVelocity(primary, pos);
    return primary ? primary.v.clone() : new THREE.Vector3();
  }
  // 120 px of drag ≈ one local circular-orbit speed, measured relative to the
  // dominant body so a moon dropped beside a moving planet keeps up with it
  const world = screenToWorld(input.x, input.y).sub(pos);
  const scale = vRef / (120 * worldPerPixel(view.dist));
  const v = world.multiplyScalar(scale);
  return primary ? v.add(primary.v) : v;
}

function drawAim() {
  $('an-aim').style.display = 'block';
  const l = $('an-aim-line'), d = $('an-aim-dot'), t = $('an-aim-txt');
  l.setAttribute('x1', input.x0); l.setAttribute('y1', input.y0);
  l.setAttribute('x2', input.x); l.setAttribute('y2', input.y);
  d.setAttribute('cx', input.x0); d.setAttribute('cy', input.y0);
  const v = velocityFromDrag();
  t.setAttribute('x', input.x + 12);
  t.setAttribute('y', input.y - 8);
  t.textContent = fmtSpeed(v.length());
}

function hideAim() { $('an-aim').style.display = 'none'; }

function dropArmed() {
  if (!input.armed || !input.placePos) return;
  if (sim.bodies.length >= MAX_BODIES) { toast('Universe is full — clear some bodies'); return; }
  const vel = velocityFromDrag();
  const primary = dominantAt(input.placePos, null);
  const tapped = Math.hypot(input.x - input.x0, input.y - input.y0) < 6;
  if (TYPES[input.armed].kind === 'uni') {
    const u = makeUniverse(input.placePos, vel);
    select(u);
    frameOn(u, 2.6);
    sim.follow = u;
    cosmicPace();
    return;
  }
  const b = makeBody(input.armed, input.placePos, vel);
  if (primary && primary.alive && (b.kind === 'body' || b.kind === 'bh')) shareMomentum(b, primary, tapped);
  select(b);
  // A galaxy is tens of thousands of light-years wide: pull back to see it.
  if (b.kind === 'gal') frameOn(b, 2.6);
  if (!sim.running && sim.bodies.length > 1) toast('Press ▶ to start time');
}

/* ---------------------------------------------------------------- keyboard  */

function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (land.b) {
    const k = e.key.toLowerCase();
    if (k === 'escape') { leaveSurface(); return; }
    if (/^(w|a|s|d|q|e|shift|arrowup|arrowdown|arrowleft|arrowright)$/.test(k)) {
      e.preventDefault();
      land.keys.add(k);
      return;
    }
  }
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case ',': case '<': changeRate(-1); break;
    case '.': case '>': changeRate(1); break;
    case 'f': case 'F':
      if (sim.selected) { sim.follow = sim.follow === sim.selected ? null : sim.selected; renderInspector(); }
      break;
    case 'Delete': case 'Backspace':
      if (sim.selected && sim.selected.kind === 'mark') {
        // landmarks are part of the scenery, not something to delete
      } else if (sim.selected && sim.selected.kind === 'uni') {
        removeUniverse(sim.selected);
      } else if (sim.selected && sim.selected.kind === 'snr') {
        const e = sim.selected;
        disperseCloud(e);
        e.alive = false;
        disposeSN(e);
        const i = supernovae.indexOf(e);
        if (i >= 0) supernovae.splice(i, 1);
        select(null);
      } else if (sim.selected) {
        const b = sim.selected; select(null); removeBody(b); compact();
      }
      break;
    case 'Escape': arm(null); closeModal(); break;
    case 't': case 'T': settings.trails = !settings.trails; clearTrails(); syncSettings(); break;
    case 'l': case 'L': settings.labels = !settings.labels; syncSettings(); break;
  }
}

/* ====================================================================== UI  */

let toastTimer = 0;
function toast(msg) {
  const el = $('an-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

function buildPalette() {
  const host = $('an-palette-list');
  let html = '';
  for (const g of GROUPS) {
    html += '<div class="an-group">' + g + '</div>';
    for (const key in TYPES) {
      if (TYPES[key].group !== g) continue;
      const t = TYPES[key];
      const cls = t.kind === 'bh' ? ' hole' : t.kind === 'gal' ? ' gal'
        : t.disc ? ' disc' : t.rings ? ' ring' : '';
      html += '<button class="an-item" data-type="' + key + '" title="' + t.blurb.replace(/"/g, '&quot;') + '">' +
        '<span class="an-dot' + cls + '" style="background:' + SWATCH[key] + ';color:' + SWATCH[key] + '"></span>' +
        '<span>' + t.label + '</span></button>';
    }
  }
  host.innerHTML = html;
  host.addEventListener('click', (e) => {

}

function arm(type) {

  $('an-armed-lbl').textContent = type ? 'ARMED' : '';

}

function updateHint() {
  const el = $('an-hint');

    s = landedHUD();

/* ----------------------------------------------------- typing in values */
/*
 * Every value readout in the inspector can be clicked and typed into instead of
 * dragged. A typed value can carry a unit ("2.5 M☉", "3 Jupiters", "6e24 kg",
 * "5000 km", "10 hours", "300 °C") or none, in which case it is read in the unit
 * the readout was already showing. It is then pushed through the slider itself
 * — widening its range if need be and lifting its step so nothing is rounded —
 * so every rule a drag would trigger (ignition, collapse, re-colouring) still runs.
 */
const UNITS = {
  mass: { 'kg': 1 / KG_PER_ME, 't': 1000 / KG_PER_ME, 'tonnes': 1000 / KG_PER_ME,
    'm⊕': 1, 'me': 1, '⊕': 1, 'earth': 1, 'earths': 1,
    'm☉': M_SUN, 'ms': M_SUN, 'msun': M_SUN, '☉': M_SUN, 'sun': M_SUN, 'suns': M_SUN, 'solar': M_SUN,
    'mj': 317.8, 'jupiter': 317.8, 'jupiters': 317.8 },
  length: { 'm': 1e-9, 'km': 1e-6, 'gm': 1, 'au': AU,
    'r⊕': R_EARTH, 're': R_EARTH, '⊕': R_EARTH, 'earth': R_EARTH, 'earths': R_EARTH,
    'r☉': R_SUN * R_EARTH, 'rs': R_SUN * R_EARTH, '☉': R_SUN * R_EARTH, 'sun': R_SUN * R_EARTH, 'suns': R_SUN * R_EARTH,
    'rj': 11.21 * R_EARTH, 'jupiter': 11.21 * R_EARTH, 'jupiters': 11.21 * R_EARTH },
  time: { 's': 1 / 86400, 'sec': 1 / 86400, 'seconds': 1 / 86400, 'min': 1 / 1440, 'minutes': 1 / 1440,
    'h': 1 / 24, 'hr': 1 / 24, 'hrs': 1 / 24, 'hour': 1 / 24, 'hours': 1 / 24,
    'd': 1, 'day': 1, 'days': 1, 'y': 365.25, 'yr': 365.25, 'year': 365.25, 'years': 365.25 },
  temp: { 'k': 1, 'kelvin': 1 },
  angle: { '°': 1, 'deg': 1, 'degrees': 1 },
  plain: { '× radius': 1, 'x radius': 1, '×': 1, 'x': 1, 'radius': 1 },
  percent: { '%': 1, 'percent': 1 }
};
const UNIT_EXAMPLE = { mass: '2.5 M☉ or 6e24 kg', length: '5000 km or 1.5 R⊕', time: '10 hours or 3 days',
  temp: '5800 K', angle: '23°', plain: '2.3', percent: '40%' };

/** Read "<number> [unit]" as a value in the quantity's base unit. `shown` supplies the default unit. */
function parseQuantity(text, q, shown) {
  const m = /^\s*([-+]?(?:\d[\d,]*\.?\d*|\.\d+)(?:e[-+]?\d+)?)\s*(.*)$/i.exec(String(text).replace(/↺/g, ''));
  if (!m) return NaN;
  let n = Number(m[1].replace(/,/g, ''));
  let unit = m[2].trim().toLowerCase();
  if (!unit) {
    // No unit typed: use the one on display, e.g. "1.00 M☉" or "9.60×10²⁰ kg"
    unit = String(shown).replace(/↺/g, '').replace(/×10[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/, '')
      .replace(/^[\s\d.,+-]+/, '').trim().toLowerCase();
  }
  if (/million/.test(unit)) { n *= 1e6; unit = unit.replace('million', '').trim(); }
  if (q === 'temp' && /^°?c$|celsius/.test(unit)) return n + 273.15;
  const table = UNITS[q];
  if (!unit) return n;
  return table[unit] != null ? n * table[unit] : NaN;
}

/* Slider id -> the quantity it holds and how a value maps onto the slider */
const TYPEABLE = {
  'is-mslider': { q: 'mass', to: (v) => Math.log10(v) },
  'is-rad-s': { q: 'length', to: (v) => Math.log10(v) },
  'is-gwide': { q: 'length', to: (v) => Math.log10(v) },
  'is-spin-s': { q: 'time', to: (v) => Math.log10(Math.abs(v)) },
  'is-tilt-s': { q: 'angle', to: (v) => v },
  'is-core-s': { q: 'temp', to: (v) => Math.log10(v) },
  'is-ctemp': { q: 'temp', to: (v) => Math.log10(v) },
  'is-ri': { q: 'plain', to: (v) => v },
  'is-ro': { q: 'plain', to: (v) => v },
  'is-rop': { q: 'percent', to: (v) => v / 100 },
  'is-wat': { q: 'percent', to: (v) => v }
};

function bindTypedValues() {
  $('an-insp-body').addEventListener('click', (e) => {
    const b = e.target.closest('.an-field label b');
    if (!b || b.style.display === 'none') return;
    const slider = b.closest('.an-field').querySelector('input[type=range]');
    const spec = slider && TYPEABLE[slider.id];
    if (!spec) return;
    e.preventDefault();
    // The readout keeps being refreshed while you type, so it is hidden rather than replaced
    const shown = b.textContent;
    const inp = document.createElement('input');
    inp.className = 'an-type-in';
    inp.value = shown.replace(/↺/g, '').trim();
    b.style.display = 'none';
    b.after(inp);
    inp.focus(); inp.select();
    let done = false;
    const finish = (apply) => {
      if (done) return;
      done = true;
      const text = inp.value;
      inp.remove();
      b.style.display = '';
      if (!apply || text.trim() === shown.replace(/↺/g, '').trim()) return;
      const v = parseQuantity(text, spec.q, shown);
      const positive = spec.q === 'mass' || spec.q === 'length' || spec.q === 'time' || spec.q === 'temp';
      if (!Number.isFinite(v) || (positive && !(v > 0))) {
        toast('Couldn\'t read "' + text + '" — try ' + UNIT_EXAMPLE[spec.q]);
        return;
      }
      const raw = spec.to(v);
      if (raw < +slider.min) slider.min = raw;
      if (raw > +slider.max) slider.max = raw;
      slider.step = 'any';
      slider.value = raw;
      slider.dispatchEvent(new Event('input', { bubbles: true }));
      slider.dispatchEvent(new Event('change', { bubbles: true }));
    };
    inp.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    inp.addEventListener('blur', () => finish(true));
  });
}

let inspRefs = null;

function select(b) {
  sim.selected = b && b.alive ? b : null;
  renderInspector();
  updateHint();
