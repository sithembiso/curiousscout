const NAME_POOL = {
  STARS: ['Vega', 'Rigel', 'Altair', 'Antares', 'Bellatrix', 'Canopus', 'Deneb', 'Mira', 'Polaris', 'Spica', 'Achernar', 'Arcturus', 'Capella', 'Sirius', 'Aldebaran', 'Fomalhaut', 'Procyon', 'Regulus', 'Alcor', 'Izar'],
  PLANETS: ['Terra', 'Aurora', 'Meridian', 'Tellus', 'Nyx', 'Halcyon', 'Elysia', 'Thalassa', 'Cinder', 'Vesper', 'Zephyr', 'Oasis', 'Kestrel', 'Lumen', 'Onyx', 'Cobalt', 'Verdant', 'Solace', 'Anvil', 'Marrow'],
  'MOONS & DEBRIS': ['Luna', 'Io', 'Europa', 'Callisto', 'Titan', 'Rhea', 'Dione', 'Mimas', 'Charon', 'Phobos', 'Deimos', 'Triton', 'Enceladus', 'Iapetus', 'Hyperion', 'Pebble', 'Shard', 'Nomad', 'Drifter', 'Ember'],
  EXOTIC: ['Cygnus X', 'Gargantua', 'Erebus', 'Abyss', 'Maelstrom', 'Kerr', 'Penrose', 'Hades', 'Tartarus', 'Vantablack'],
  HYPOTHETICAL: ['Tyche', 'Vulcan', 'Phaeton', 'Nemesis', 'Lilith', 'Persephone', 'Chiron', 'Aether', 'Erytheia', 'Hesperus']
};

const usedNames = new Set();

function makeName(type) {
  const def = TYPES[type];
  const pool = NAME_POOL[def.group] || NAME_POOL.PLANETS;
  if (type === 'theia') return unique('Theia');
  if (type === 'planet_nine') return unique('Planet Nine');
  for (let i = 0; i < 24; i++) {
    const n = pool[(Math.random() * pool.length) | 0];
    if (!usedNames.has(n)) { usedNames.add(n); return n; }
  }
  return unique(pick(pool));
}

function unique(base) {
  if (!usedNames.has(base)) { usedNames.add(base); return base; }
  const suffix = ['b', 'c', 'd', 'e', 'f', 'g', 'h', 'II', 'III', 'IV'];
  for (const s of suffix) {
    const n = base + ' ' + s;
    if (!usedNames.has(n)) { usedNames.add(n); return n; }
  }
  const n = base + ' ' + ((Math.random() * 900 + 100) | 0);
  usedNames.add(n);
  return n;
}

/* ================================================================ sim state */

const MAX_BODIES = 420;
const BH_VIS = 60;      // black holes are drawn this much larger than their true horizon

const sim = {
  bodies: [],
  time: 0,               // days elapsed
  running: false,
  rate: 1,               // simulated days per real second
  nextId: 1,
  selected: null,
  follow: null,
  starCache: []          // luminous bodies, refreshed each frame
};

const settings = {
  bodyScale: 3,
  gravity: 1,
  collisions: 'merge',   // merge | bounce | off
  tidal: true,
  trails: true,
  labels: true,
  lensing: true,
  hzone: false,
  autoOrbit: true
};

/* ------------------------------------------------------------ body creation */

function trueRadius(type, mass) {
  const def = TYPES[type];
  if (def.kind === 'bh' || def.kind === 'wh') return schwarzschild(mass);
  return def.rad * R_EARTH * Math.cbrt(mass / def.mass);   // constant density
}

function makeBody(type, pos, vel, overrides) {
  const def = TYPES[type];
  const o = overrides || {};
  const mass = o.mass != null ? o.mass : def.mass;
  const b = {
    id: sim.nextId++,
    type: type,
    kind: def.kind || 'body',
    name: o.name || makeName(type),
    m: mass,
    r: o.r != null ? o.r : trueRadius(type, mass),
    p: pos.clone(),
    v: vel ? vel.clone() : new THREE.Vector3(),
    a: new THREE.Vector3(),
    seed: o.seed != null ? o.seed : (Math.random() * 1e6) | 0,
    spin: o.spin != null ? o.spin : (def.spin || 1),
    rot: Math.random() * TAU,
    tilt: o.tilt != null ? o.tilt : (def.rings ? def.rings.tilt : rnd(-0.42, 0.42)),
    temp: def.temp || 0,
    lum: 0,
    alive: true,
    // Rubble is flagged as already-disrupted so tides cannot shatter it again.
    // Without this, fragments born inside a Roche limit break up on the next
    // step, and each generation spawns more — a runaway to the body cap.
    disrupted: !!o.rubble,
    rubble: !!o.rubble,
    born: sim.time,
    obj: null
  };
  updateLuminosity(b);
  buildVisual(b);
  sim.bodies.push(b);
  return b;
}

/** Displayed / colliding radius, exaggerated so bodies stay findable. */
function visRadius(b) {
  if (b.kind === 'bh' || b.kind === 'wh') return b.r * 2.6 * settings.bodyScale * BH_VIS;
  return b.r * settings.bodyScale;
}

/** L/L☉ from radius and photosphere temperature. */
function updateLuminosity(b) {
  const def = TYPES[b.type];
  if (!def.star) { b.lum = 0; return; }
  const rSun = b.r / (R_SUN * R_EARTH);
  let L = rSun * rSun * Math.pow(b.temp / 5778, 4);
  if (def.lumCap != null) L = Math.min(L, def.lumCap);
  b.lum = L;
}

function removeBody(b) {
  b.alive = false;
  usedNames.delete(b.name);
}

function compact() {
  for (let i = sim.bodies.length - 1; i >= 0; i--) {
    if (!sim.bodies[i].alive) {
      disposeVisual(sim.bodies[i]);
      sim.bodies.splice(i, 1);
    }
  }
}

/* =============================================================== gravity     */

let lastMinTdyn = 1e9;
const collisionPairs = [];

function computeAccel() {
  const bs = sim.bodies, n = bs.length;
  const gm = G * settings.gravity;
  collisionPairs.length = 0;
  let minT2 = Infinity;

  for (let i = 0; i < n; i++) bs[i].a.set(0, 0, 0);

  for (let i = 0; i < n; i++) {
    const bi = bs[i], pi = bi.p;
    const ri = visRadius(bi);
    for (let j = i + 1; j < n; j++) {
      const bj = bs[j], pj = bj.p;
      const dx = pj.x - pi.x, dy = pj.y - pi.y, dz = pj.z - pi.z;
      const d2 = dx * dx + dy * dy + dz * dz;

      // Plummer softening scaled by the bodies' own size: keeps the force
      // finite when two objects are overlapping instead of blowing up.
      const soft = 0.35 * (bi.r + bj.r);
      const dd = d2 + soft * soft;
      const d = Math.sqrt(dd);
      const inv3 = 1 / (dd * d);

      // A white hole pushes instead of pulls.
      const si = bi.kind === 'wh' ? -1 : 1;
      const sj = bj.kind === 'wh' ? -1 : 1;

      const fi = gm * bj.m * inv3 * sj;
      const fj = gm * bi.m * inv3 * si;
      bi.a.x += dx * fi; bi.a.y += dy * fi; bi.a.z += dz * fi;
      bj.a.x -= dx * fj; bj.a.y -= dy * fj; bj.a.z -= dz * fj;

      // local dynamical time, used to pick a safe step size
      const t2 = (dd * d) / (gm * (bi.m + bj.m) + 1e-12);
      if (t2 < minT2) minT2 = t2;

      const touch = ri + visRadius(bj);
      if (d2 < touch * touch) collisionPairs.push(bi, bj);
    }
  }
  lastMinTdyn = Math.sqrt(minT2);
}

/* ------------------------------------------------------------- integration */

function step(dt) {
  const bs = sim.bodies;
  const h = dt * 0.5;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    b.v.x += b.a.x * h; b.v.y += b.a.y * h; b.v.z += b.a.z * h;
    b.p.x += b.v.x * dt; b.p.y += b.v.y * dt; b.p.z += b.v.z * dt;
    b.rot += (b.spin ? TAU / b.spin : 0) * dt;
  }
  computeAccel();
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    b.v.x += b.a.x * h; b.v.y += b.a.y * h; b.v.z += b.a.z * h;
  }
  sim.time += dt;
  resolveCollisions();
  if (settings.tidal) checkTides();
}

/** Advance the simulation by one rendered frame's worth of time. */
function advance(frameSeconds) {
  if (!sim.running || sim.rate === 0) return;
  const target = sim.rate * Math.min(frameSeconds, 0.05);
  if (target <= 0) return;
  const safe = Math.max(1e-9, 0.025 * lastMinTdyn);
  const n = sim.bodies.length;
  const budget = clamp(Math.floor(260000 / (n * n + 1)), 1, 64);
  const steps = clamp(Math.ceil(target / safe), 1, budget);
  const dt = target / steps;
  for (let s = 0; s < steps; s++) step(dt);
}

/* =============================================================== collisions */

function resolveCollisions() {
  if (settings.collisions === 'off' || !collisionPairs.length) return;
  let dirty = false;
  for (let k = 0; k < collisionPairs.length; k += 2) {
    const a = collisionPairs[k], b = collisionPairs[k + 1];
    if (!a.alive || !b.alive) continue;
    if (impact(a, b)) dirty = true;
  }
  if (dirty) compact();
}

function impact(a, b) {
  // heavier body is A
  if (b.m > a.m) { const t = a; a = b; b = t; }

  // White holes never merge — they shove things away instead.
  if (a.kind === 'wh' || b.kind === 'wh') {
    const wh = a.kind === 'wh' ? a : b, other = a.kind === 'wh' ? b : a;
    const dir = other.p.clone().sub(wh.p);
    const len = dir.length() || 1;
    dir.divideScalar(len);
    const push = Math.sqrt(2 * G * wh.m / Math.max(visRadius(wh), 1e-6)) * 0.6;
    other.p.copy(wh.p).addScaledVector(dir, visRadius(wh) + visRadius(other));
    other.v.addScaledVector(dir, push);
    return false;
  }

  // A black hole simply eats whatever crosses its horizon.
  if (a.kind === 'bh') {
    absorb(a, b);
    return true;
  }

  if (settings.collisions === 'bounce') {
    bounce(a, b);
    return false;
  }

  const rel = b.v.clone().sub(a.v);
  const vImp = rel.length();
  const vEsc = Math.sqrt(2 * G * (a.m + b.m) / Math.max(1e-9, visRadius(a) + visRadius(b)));
  const ratio = b.m / a.m;

  // A gentle touch accretes; a fast, well-matched hit shatters both. Rubble is
  // already broken, so it only ever accretes — this keeps debris fields from
  // fragmenting without end.
  if (vImp < vEsc * 1.6 || ratio < 0.015 || a.rubble || b.rubble) merge(a, b, vImp, vEsc);
  else shatter(a, b, vImp);
  return true;
}

function absorb(hole, prey) {
  const mTot = hole.m + prey.m;
  hole.v.multiplyScalar(hole.m / mTot).addScaledVector(prey.v, prey.m / mTot);
  hole.m = mTot;
  hole.r = schwarzschild(mTot);
  refreshVisual(hole);
  fx.flash(prey.p, visRadius(prey) * 6, [200, 170, 255], 0.5);
  fx.burst(prey.p, prey.v, visRadius(prey), 16, [190, 150, 255]);
  toast(hole.name + ' devoured ' + prey.name);
  removeBody(prey);
}

function bounce(a, b) {
  const nrm = b.p.clone().sub(a.p);
  const dist = nrm.length() || 1e-9;
  nrm.divideScalar(dist);
  const overlap = visRadius(a) + visRadius(b) - dist;
  if (overlap > 0) {
    const tot = a.m + b.m;
    a.p.addScaledVector(nrm, -overlap * (b.m / tot) - 1e-9);
    b.p.addScaledVector(nrm, overlap * (a.m / tot) + 1e-9);
  }
  const rel = b.v.clone().sub(a.v);
  const sep = rel.dot(nrm);
  if (sep > 0) return;                       // already separating
  const e = 0.55;                            // restitution
  const jImp = -(1 + e) * sep / (1 / a.m + 1 / b.m);
  a.v.addScaledVector(nrm, -jImp / a.m);
  b.v.addScaledVector(nrm, jImp / b.m);
  fx.flash(b.p, visRadius(b) * 3, [255, 220, 170], 0.25);
}

function merge(a, b, vImp, vEsc) {
  const mTot = a.m + b.m;
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  // Splash a little of the smaller body back out as debris. Rubble and very
  // small impactors never spray: otherwise every merge seeds fragments that
  // merge and spray again, running away to the body cap in seconds.
  const spray = clamp((vImp / Math.max(vEsc, 1e-9) - 0.5) * 0.12, 0, 0.1);
  const maySpray = spray > 0 && b.m / a.m > 0.004 && b.m > 0.0015 && !b.rubble && !a.rubble;
  // Clamped to the free slots, and `lost` is derived from the count that is
  // actually spawned, so mass is conserved exactly rather than leaking away.
  const frags = maySpray ? Math.min(clamp(Math.round(spray * 60), 0, 7), freeSlots()) : 0;
  const lost = frags > 0 ? b.m * spray : 0;

  a.m = mTot - lost;
  a.p.copy(com);
  a.v.copy(vel);
  a.r = Math.cbrt(a.r * a.r * a.r + b.r * b.r * b.r);

  // Enough mass in one place and the physics changes character.
  let note = a.name + ' absorbed ' + b.name;
  if (!TYPES[a.type].star && a.m >= 0.075 * M_SUN) {
    becomeStar(a);
    note = a.name + ' collapsed and ignited into a star!';
  } else if (TYPES[a.type].star && a.m >= 25 * M_SUN) {
    becomeBlackHole(a);
    note = a.name + ' collapsed into a black hole!';
  } else {
    updateLuminosity(a);
    refreshVisual(a);
  }

  if (frags) spawnDebris(com, vel, lost / frags, frags, Math.max(vImp * 0.5, vEsc * 0.7), visRadius(a));
  fx.flash(com, visRadius(a) * 4, [255, 210, 150], 0.7);
  fx.burst(com, vel, visRadius(a), 26, [255, 190, 120]);
  toast(note);
  removeBody(b);
}

function shatter(a, b, vImp) {
  const mTot = a.m + b.m;
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  // The larger body keeps a battered remnant; the rest becomes rubble. If there
  // is no room for fragments the remnant keeps everything, so mass still adds up.
  const keep = clamp(0.35 + 0.3 * (1 - b.m / a.m), 0.2, 0.72);
  const frags = Math.min(clamp(Math.round(6 + (1 - keep) * 16), 4, 18), freeSlots());
  const remnantM = frags > 0 ? a.m * keep : mTot;
  const rubbleM = mTot - remnantM;

  a.m = remnantM;
  a.p.copy(com);
  a.v.copy(vel);
  a.r = trueRadius(a.type, remnantM);
  updateLuminosity(a);
  refreshVisual(a);

  if (frags > 0) spawnDebris(com, vel, rubbleM / frags, frags, vImp * 0.45, visRadius(a) * 1.2);
  fx.flash(com, visRadius(a) * 7, [255, 240, 200], 1);
  fx.burst(com, vel, visRadius(a) * 1.5, 48, [255, 200, 130]);
  toast(a.name + ' and ' + b.name + ' shattered on impact!');
  removeBody(b);
}

const freeSlots = () => Math.max(0, MAX_BODIES - sim.bodies.length);

/**
 * Correct a set of fresh fragments so they collectively carry exactly the
 * momentum they should. Random ejection directions do not cancel on their own,
 * which otherwise lets every impact quietly kick the whole system sideways.
 */
function conserveMomentum(frags, expectedP) {
  if (!frags.length) return;
  const actual = new THREE.Vector3();
  let m = 0;
  for (const f of frags) { actual.addScaledVector(f.v, f.m); m += f.m; }
  if (m <= 0) return;
  const corr = expectedP.clone().sub(actual).divideScalar(m);
  for (const f of frags) f.v.add(corr);
}

function spawnDebris(center, baseVel, massEach, count, spread, minDist) {
  const made = [];
  for (let i = 0; i < count; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.45, 0.45), rnd(-1, 1));
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const pos = center.clone().addScaledVector(dir, minDist * rnd(1.05, 2.2));
    const vel = baseVel.clone().addScaledVector(dir, spread * rnd(0.35, 1.15));
    const type = massEach > 0.004 ? 'moon' : 'asteroid';
    made.push(makeBody(type, pos, vel, { mass: Math.max(massEach, 1e-7), name: 'Debris ' + (sim.nextId), rubble: true }));
  }
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, baseVel.clone().multiplyScalar(tot));
  return made;
}

function becomeStar(b) {
  b.type = b.m > 0.5 * M_SUN ? 'sun_like' : 'red_dwarf';
  b.kind = 'body';
  b.temp = TYPES[b.type].temp;
  b.r = trueRadius(b.type, b.m);
  b.spin = TYPES[b.type].spin;
  updateLuminosity(b);
  refreshVisual(b);
}

function becomeBlackHole(b) {
  b.type = 'black_hole';
  b.kind = 'bh';
  b.temp = 0;
  b.lum = 0;
  b.r = schwarzschild(b.m);
  refreshVisual(b);
}

/** Shatter a body straight away — the inspector's "Shatter" button. */
function shatterBody(b) {
  if (!b.alive || b.kind === 'bh' || b.kind === 'wh') return;
  const frags = Math.min(clamp(Math.round(8 + Math.random() * 8), 6, 16), freeSlots());
  if (frags < 3) { toast('Universe is full — clear some bodies first'); return; }
  const vEsc = Math.sqrt(2 * G * b.m / Math.max(visRadius(b), 1e-9));
  spawnDebris(b.p, b.v, b.m / frags, frags, vEsc * 0.9, visRadius(b));
  fx.flash(b.p, visRadius(b) * 7, [255, 235, 190], 1);
  fx.burst(b.p, b.v, visRadius(b) * 1.4, 46, [255, 205, 140]);
  toast(b.name + ' was torn apart');
  if (sim.selected === b) select(null);
  removeBody(b);
  compact();
}

/* ============================================================ tidal forces  */

/**
 * Inside the fluid Roche limit a satellite can't hold itself together against
 * the tide, and it spreads into a ring of rubble. This is why Saturn has rings
 * and why Roche's limit matters at all.
 */
/**
 * Fluid Roche limit for satellite `s` around primary `P`.
 *
 * Deliberately computed from TRUE radii, not the exaggerated drawn ones — using
 * drawn radii would scale the limit up with them and shred genuine moons like
 * Io. The floor keeps the zone just outside whatever is actually on screen, so
 * the effect stays visible when bodies are drawn larger than life.
 */
function rocheLimit(P, s) {
  const rP = P.r, rS = s.r;
  const densRatio = (P.m / (rP * rP * rP)) / (s.m / (rS * rS * rS));
  return Math.max(
    2.44 * rP * Math.cbrt(densRatio),
    (visRadius(P) + visRadius(s)) * 1.5
  );
}

function checkTides() {
  const bs = sim.bodies;
  for (let i = 0; i < bs.length; i++) {
    const s = bs[i];
    if (!s.alive || s.disrupted || s.kind !== 'body') continue;
    if (TYPES[s.type].star || s.m > 40) continue;          // too big / too hot to shred
    for (let j = 0; j < bs.length; j++) {
      const P = bs[j];
      if (P === s || !P.alive || P.m < s.m * 12) continue;
      const roche = rocheLimit(P, s);
      const d = s.p.distanceTo(P.p);
      if (d < roche && d > visRadius(P) + visRadius(s)) {
        tidalDisrupt(s, P, d);
        return;                                            // one per step is plenty
      }
    }
  }
}

function tidalDisrupt(s, P, d) {
  const frags = Math.min(clamp(Math.round(7 + Math.random() * 7), 6, 14), freeSlots());
  if (frags < 3) return;                       // no room: leave the moon intact
  const each = s.m / frags;
  const orbitDir = s.v.clone().sub(P.v);
  const speed = orbitDir.length();
  const made = [];
  for (let i = 0; i < frags; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    // spread the fragments along the orbit so they stretch into an arc
    const along = (i / frags - 0.5) * 0.6;
    const radial = s.p.clone().sub(P.p).normalize();
    const tang = orbitDir.clone().normalize();
    const pos = s.p.clone()
      .addScaledVector(tang, d * along)
      .addScaledVector(radial, visRadius(s) * rnd(-2, 2));
    const vel = P.v.clone()
      .addScaledVector(tang, speed * rnd(0.97, 1.03))
      .addScaledVector(radial, speed * rnd(-0.02, 0.02));
    made.push(makeBody(each > 0.004 ? 'moon' : 'asteroid', pos, vel, { mass: Math.max(each, 1e-7), name: 'Ring frag', rubble: true }));
  }
  // The ring should drift exactly as the moon did, not gain a net kick.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, s.v.clone().multiplyScalar(tot));
  fx.flash(s.p, visRadius(s) * 5, [255, 240, 220], 0.8);
  toast(s.name + ' was torn apart by ' + P.name + '’s tides');
  if (sim.selected === s) select(null);
  removeBody(s);
  s.disrupted = true;
  compact();
}

/* ========================================================== temperature     */

function updateTemperatures() {
  const stars = sim.starCache;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (TYPES[b.type].star || b.kind !== 'body') continue;
    let flux = 0;
    for (let s = 0; s < stars.length; s++) {
      const st = stars[s];
      const dAU = Math.max(b.p.distanceTo(st.p) / AU, 1e-4);
      flux += st.lum / (dAU * dAU);
    }
    // 278.6 K is the equilibrium temperature at 1 AU from a Sun-like star
    const eq = flux > 0 ? 278.6 * Math.pow(flux, 0.25) : 3;
    const floor = TYPES[b.type].glowHot ? 1200 : 3;
    b.temp = Math.max(eq, floor);
  }
}

/* ================================================================== renderer */

let renderer, scene, camera, canvasEl;
let SPHERE, SPHERE_LO;
const ringGeoCache = new Map();

/**
 * An annulus normalised so its outer edge sits at radius 1, which lets a single
 * uniform scale place both edges correctly.
 */
function ringGeometry(innerRatio) {
  const key = innerRatio.toFixed(3);
  if (!ringGeoCache.has(key)) ringGeoCache.set(key, new THREE.RingGeometry(innerRatio, 1, 120, 1));
  return ringGeoCache.get(key);
}
let TEX_GLOW, TEX_HALO, TEX_TAIL, TEX_PHOTON;
const texCache = new Map();
const VIEW = { w: 1, h: 1, dpr: 1 };
const FOV = 55;

const hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/** World units per screen pixel at a given distance — used for pixel floors. */
function worldPerPixel(dist) {
  return 2 * Math.tan(FOV * Math.PI / 360) * dist / VIEW.h;
}

function initScene() {
  canvasEl = document.getElementById('an-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x03030a, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 1e-4, 4e6);

  SPHERE = new THREE.SphereGeometry(1, 44, 30);
  SPHERE_LO = new THREE.SphereGeometry(1, 16, 12);

  TEX_GLOW = new THREE.CanvasTexture(glowTexture(256, 0.16, 0.85));
  TEX_HALO = new THREE.CanvasTexture(glowTexture(256, 0.04, 0.30));
  TEX_TAIL = new THREE.CanvasTexture(tailTexture(256));
  TEX_PHOTON = new THREE.CanvasTexture(photonRingTexture(512));

  scene.add(new THREE.AmbientLight(0xffffff, 0.055));

  buildSky();
  initFx();
  initPost();
  resize();
}

/** Bright annulus used for a black hole's photon ring. */
function photonRingTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0)');
  g.addColorStop(0.375, 'rgba(255,236,196,0.30)');
  g.addColorStop(0.405, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.435, 'rgba(255,214,140,0.34)');
  g.addColorStop(0.62, 'rgba(255,160,60,0.06)');
  g.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/* ------------------------------------------------------------ shared shaders */

const ATMO_VERT = `
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vWN = normalize(mat3(modelMatrix) * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const ATMO_FRAG = `
  uniform vec3 uColor;
  uniform vec3 uLight;
  uniform float uStrength;
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vWN, 0.0)).xyz);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    float lit = max(dot(normalize(vWN), normalize(uLight)), 0.0);
    gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
  }`;

/* ------------------------------------------------------------------ textures */

function surfaceTexture(type, seed) {
  const def = TYPES[type];
  if (!def.surf) return null;
  const variant = seed % 3;
  const key = type + ':' + variant;
  if (texCache.has(key)) return texCache.get(key);

  const small = def.group === 'MOONS & DEBRIS' || def.lumpy;
  const W = small ? 256 : 512, H = small ? 128 : 256;
  const cv = newCanvas(W, H);
  const rng = mulberry32(hashStr(key));
  const opts = Object.assign({ temp: def.temp, spots: def.spots }, def.opts || {});
  SURFACE[def.surf](cv.getContext('2d'), W, H, rng, opts);

  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  texCache.set(key, t);
  return t;
}

function cachedTexture(key, make) {
  if (texCache.has(key)) return texCache.get(key);
  const t = new THREE.CanvasTexture(make());
  t.encoding = THREE.sRGBEncoding;
  texCache.set(key, t);
  return t;
}

/** Deform a sphere into a believable irregular body (asteroids, comet nuclei). */
function lumpyGeometry(seed, amount) {
  const g = SPHERE_LO.clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const f = fbm(seed, 4, 2, 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // fade the displacement out at the poles so the seam vertices stay together
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (f(u, vv) - 0.5) * 2 * amount * fade;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  g.computeVertexNormals();
  return g;
}

/* ============================================================ body visuals  */

function buildVisual(b) {
  const def = TYPES[b.type];
  const grp = new THREE.Group();
  b.obj = grp;
  b.parts = {};

  if (b.kind === 'bh') buildHole(b, grp);
  else if (b.kind === 'wh') buildWhiteHole(b, grp);
  else buildWorld(b, def, grp);

  // A pixel-floor marker so distant bodies never vanish entirely.
  const dotMat = new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  });
  b.parts.dot = new THREE.Sprite(dotMat);
  b.parts.dot.renderOrder = 6;
  grp.add(b.parts.dot);

  scene.add(grp);
  buildTrail(b);
  scaleVisual(b);
}

function buildWorld(b, def, grp) {
  const geo = def.lumpy ? lumpyGeometry(b.seed, def.lumpy) : SPHERE;
  b.ownGeo = def.lumpy ? geo : null;
  const tex = surfaceTexture(b.type, b.seed);

  let mat;
  if (def.star) {
    mat = new THREE.MeshBasicMaterial({ map: tex });
  } else {
    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: def.surf === 'iron' ? 0.42 : def.surf === 'ocean' || def.surf === 'hycean' ? 0.55 : 0.88,
      metalness: def.surf === 'iron' ? 0.55 : def.surf === 'carbon' ? 0.25 : 0.04
    });
    // The emissive map is always attached so a world can start glowing when it
    // heats up without forcing a shader recompile mid-flight.
    mat.emissiveMap = tex;
    mat.emissive = new THREE.Color(0x000000);
    mat.emissiveIntensity = 1;
    if (def.glowHot) {
      mat.emissive.setRGB(def.glowHot * 0.55, def.glowHot * 0.16, 0.02);
    }
  }
  // gentle per-body variation so two Earths aren't identical
  const jit = mulberry32(b.seed);
  mat.color = new THREE.Color().setRGB(0.90 + jit() * 0.14, 0.90 + jit() * 0.14, 0.90 + jit() * 0.14);
  b.baseColor = mat.color.clone();

  const surf = new THREE.Mesh(geo, mat);
  grp.add(surf);
  b.parts.surf = surf;

  if (def.clouds) {
    const ct = cachedTexture('cloud:' + b.type + ':' + (b.seed % 3), () => cloudTexture(hashStr(b.type + b.seed % 3), 512, 256, def.clouds, [255, 255, 255]));
    const cm = new THREE.MeshStandardMaterial({ map: ct, transparent: true, depthWrite: false, roughness: 1 });
    const cloud = new THREE.Mesh(SPHERE, cm);
    cloud.scale.setScalar(1.018);
    grp.add(cloud);
    b.parts.cloud = cloud;
  }

  if (def.atmo) {
    const am = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color().fromArray(def.atmo.map(c => c / 255)) },
        uLight: { value: new THREE.Vector3(1, 0, 0) },
        uStrength: { value: 0.95 }
      },
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    const atmo = new THREE.Mesh(SPHERE, am);
    atmo.scale.setScalar(1.09);
    grp.add(atmo);
    b.parts.atmo = atmo;
  }

  if (def.rings) {
    const rt = cachedTexture('ring:' + b.type, () => ringTexture(hashStr(b.type + 'ring'), 512, def.rings.pal));
    const rm = new THREE.MeshBasicMaterial({ map: rt, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.92 });
    const ring = new THREE.Mesh(ringGeometry(def.rings.inner / def.rings.outer), rm);
    ring.rotation.x = -Math.PI / 2;
    grp.add(ring);
    b.parts.ring = ring;
    b.ringSpec = def.rings;
  }

  if (def.star) {
    const col = new THREE.Color().fromArray(kelvinToRGB(def.temp).map(c => c / 255));
    const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(g1); grp.add(g2);
    b.parts.glow = g1; b.parts.halo = g2;
    b.lightColor = col;
  }

  if (def.tail) {
    const tm = new THREE.MeshBasicMaterial({ map: TEX_TAIL, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const plane = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);   // extends along +X
    const tail = new THREE.Mesh(plane, tm);
    tail.frustumCulled = false;
    scene.add(tail);                    // world-space, oriented each frame
    b.parts.tail = tail;
    const coma = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0x9fd8ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(coma);
    b.parts.coma = coma;
  }
}

function buildHole(b, grp) {
  const shadow = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  grp.add(shadow);
  b.parts.surf = shadow;

  const photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(photon);
  b.parts.photon = photon;

  const dt = cachedTexture('disk', () => accretionTexture(1337, 512));
  const dm = new THREE.MeshBasicMaterial({ map: dt, blending: THREE.AdditiveBlending, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const disk = new THREE.Mesh(ringGeometry(0.26), dm);
  disk.rotation.x = -Math.PI / 2 + 0.30;
  disk.rotation.z = 0.2;
  grp.add(disk);
  b.parts.disk = disk;
}

function buildWhiteHole(b, grp) {
  const core = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0xfffbe8 }));
  grp.add(core);
  b.parts.surf = core;

  const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0xfff3b0), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: new THREE.Color(0xffe27a), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(g1); grp.add(g2);
  b.parts.glow = g1; b.parts.halo = g2;
  b.lightColor = new THREE.Color(0xfff0c0);
}

/** Push mesh scales to match the body's current (exaggerated) radius. */
function scaleVisual(b) {
  const r = visRadius(b);
  const p = b.parts;
  if (!p) return;
  if (p.surf) p.surf.scale.setScalar(r);
  if (p.cloud) p.cloud.scale.setScalar(r * 1.018);
  if (p.atmo) p.atmo.scale.setScalar(r * 1.09);
  if (p.ring && b.ringSpec) p.ring.scale.setScalar(r * b.ringSpec.outer);
  if (p.disk) p.disk.scale.setScalar(r * 7);
  if (p.photon) p.photon.scale.setScalar(r * 5.6);
}

/** Rebuild a body's meshes after its type changed (ignition, collapse, …). */
function refreshVisual(b) {
  disposeVisual(b, true);
  buildVisual(b);
  if (sim.selected === b) renderInspector();
}

function disposeVisual(b, keepTrail) {
  if (b.obj) {
    scene.remove(b.obj);
    b.obj.traverse(o => {
      if (o.material) {
        if (o.material.map && o.material.map.isCanvasTexture && !cacheHasTexture(o.material.map)) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
  if (b.parts && b.parts.tail) {
    scene.remove(b.parts.tail);
    b.parts.tail.geometry.dispose();
    b.parts.tail.material.dispose();
  }
  if (b.ownGeo) b.ownGeo.dispose();
  b.obj = null; b.parts = null; b.ownGeo = null; b.light = null;
  if (!keepTrail) killTrail(b);
}

function cacheHasTexture(t) {
  for (const v of texCache.values()) if (v === t) return true;
  return false;
}

/* ================================================================= the sky   */

const SKY_R = 1.5e6;
let skyGroup;

function buildSky() {
  skyGroup = new THREE.Group();
  scene.add(skyGroup);

  const N = 4400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const r = mulberry32(20260729);

  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i % 5 < 2) {
      // a crowded band, so the sky has a Milky Way through it
      const th = r() * TAU;
      const el = (r() + r() + r() - 1.5) * 0.19;
      const cy = Math.cos(el);
      x = Math.cos(th) * cy; y = Math.sin(el); z = Math.sin(th) * cy;
    } else {
      const u = r() * 2 - 1, th = r() * TAU, s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = u; z = s * Math.sin(th);
    }
    pos[i * 3] = x * SKY_R; pos[i * 3 + 1] = y * SKY_R; pos[i * 3 + 2] = z * SKY_R;

    const c = kelvinToRGB(2600 + Math.pow(r(), 2.2) * 17000);
    const bright = 0.22 + Math.pow(r(), 2.6) * 0.95;
    col[i * 3] = c[0] / 255 * bright;
    col[i * 3 + 1] = c[1] / 255 * bright;
    col[i * 3 + 2] = c[2] / 255 * bright;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  // depthTest stays ON: the sky sits in the transparent pass, which draws after
  // opaque bodies, so without it the stars would paint over every planet.
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
  }));
  stars.frustumCulled = false;
  stars.renderOrder = -10;
  skyGroup.add(stars);

  // A few faint nebulae for depth.
  const neb = [[0x6a3ba8, 0.10], [0x2f6ea8, 0.09], [0xa8407a, 0.08], [0x2f8f8a, 0.07], [0x8a4a2f, 0.06]];
  for (let i = 0; i < neb.length; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_HALO, color: new THREE.Color(neb[i][0]), opacity: neb[i][1],
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: true
    }));
    const u = r() * 2 - 1, th = r() * TAU, sr = Math.sqrt(1 - u * u);
    s.position.set(sr * Math.cos(th), u * 0.5, sr * Math.sin(th)).multiplyScalar(SKY_R * 0.92);
    s.scale.setScalar(SKY_R * rnd(0.5, 1.1));
    s.renderOrder = -11;
    skyGroup.add(s);
  }
}

/* ============================================================ star lighting */
/* A fixed pool of lights keeps the shader's light count constant, which avoids
   a program recompile (and a visible hitch) every time a star is added.       */

const LIGHT_POOL = 3;
const starLights = [];

function initLights() {
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = new THREE.PointLight(0xffffff, 0, 0, 1);
    l.position.set(0, 0, 0);
    scene.add(l);
    starLights.push(l);
  }
}

function updateLights() {
  const stars = sim.starCache;
  const ranked = stars.slice().sort((a, b) => b.lum - a.lum);
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = starLights[i], s = ranked[i];
    if (!s) { l.intensity = 0; continue; }
    l.position.copy(s.p);
    if (s.lightColor) l.color.copy(s.lightColor);
    // Distance falloff is deliberately off: with real inverse-square light,
    // anything past a few AU would be pitch black and unusable.
    l.intensity = clamp(1.15 + Math.log10(Math.max(s.lum, 1e-4)) * 0.17, 0.4, 2.2);
  }
}

/* ================================================================== effects */

const FX_MAX = 1600;
const fxState = { pos: null, vel: null, life: null, max: null, col: null, head: 0, pts: null, geo: null };
const flashes = [];

function initFx() {
  fxState.pos = new Float32Array(FX_MAX * 3);
  fxState.vel = new Float32Array(FX_MAX * 3);
  fxState.col = new Float32Array(FX_MAX * 3);
  fxState.base = new Float32Array(FX_MAX * 3);
  fxState.life = new Float32Array(FX_MAX);
  fxState.max = new Float32Array(FX_MAX);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(fxState.pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(fxState.col, 3));
  fxState.geo = geo;
  fxState.pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 3.4, sizeAttenuation: false, vertexColors: true, map: TEX_GLOW,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  fxState.pts.frustumCulled = false;
  fxState.pts.renderOrder = 5;
  scene.add(fxState.pts);

  for (let i = 0; i < 14; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0
    }));
    s.visible = false;
    s.renderOrder = 7;
    scene.add(s);
    flashes.push({ sprite: s, life: 0, max: 1, size: 1 });
  }
}

const fx = {
  burst(pos, baseVel, radius, count, color) {
    for (let i = 0; i < count; i++) {
      const k = fxState.head;
      fxState.head = (fxState.head + 1) % FX_MAX;
      const dir = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
      if (dir.lengthSq() < 1e-9) dir.set(1, 0, 0);
      dir.normalize();
      const spread = radius * rnd(6, 30);
      fxState.pos[k * 3] = pos.x + dir.x * radius * rnd(0.2, 1.4);
      fxState.pos[k * 3 + 1] = pos.y + dir.y * radius * rnd(0.2, 1.4);
      fxState.pos[k * 3 + 2] = pos.z + dir.z * radius * rnd(0.2, 1.4);
      fxState.vel[k * 3] = baseVel.x + dir.x * spread;
      fxState.vel[k * 3 + 1] = baseVel.y + dir.y * spread;
      fxState.vel[k * 3 + 2] = baseVel.z + dir.z * spread;
      const c = mix(color, [255, 255, 255], Math.random() * 0.5);
      fxState.base[k * 3] = c[0] / 255; fxState.base[k * 3 + 1] = c[1] / 255; fxState.base[k * 3 + 2] = c[2] / 255;
      fxState.max[k] = rnd(0.5, 1.5);
      fxState.life[k] = fxState.max[k];
    }
  },

  flash(pos, size, color, strength) {
    let f = null;
    for (let i = 0; i < flashes.length; i++) if (flashes[i].life <= 0) { f = flashes[i]; break; }
    if (!f) f = flashes[(Math.random() * flashes.length) | 0];
    f.life = f.max = 0.55;
    f.size = size;
    f.strength = strength;
    f.sprite.position.copy(pos);
    f.sprite.material.color.setRGB(color[0] / 255, color[1] / 255, color[2] / 255);
    f.sprite.visible = true;
  }
};

function updateFx(realDt, simDt) {
  const move = Math.min(simDt, 4);
  const pos = fxState.pos, vel = fxState.vel, col = fxState.col, base = fxState.base;
  for (let i = 0; i < FX_MAX; i++) {
    if (fxState.life[i] <= 0) { col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0; continue; }
    fxState.life[i] -= realDt;
    const t = Math.max(fxState.life[i], 0) / fxState.max[i];
    pos[i * 3] += vel[i * 3] * move;
    pos[i * 3 + 1] += vel[i * 3 + 1] * move;
    pos[i * 3 + 2] += vel[i * 3 + 2] * move;
    const f = t * t;
    col[i * 3] = base[i * 3] * f;
    col[i * 3 + 1] = base[i * 3 + 1] * f;
    col[i * 3 + 2] = base[i * 3 + 2] * f;
  }
  fxState.geo.attributes.position.needsUpdate = true;
  fxState.geo.attributes.color.needsUpdate = true;

  for (let i = 0; i < flashes.length; i++) {
    const f = flashes[i];
    if (f.life <= 0) { if (f.sprite.visible) f.sprite.visible = false; continue; }
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);
    f.sprite.material.opacity = t * t * (f.strength || 1);
    f.sprite.scale.setScalar(f.size * (1.9 - t));
    if (f.life <= 0) f.sprite.visible = false;
  }
}

/* =================================================================== trails */

const TRAIL_CAP = 320;
const MAX_TRAILS = 28;
let trailTick = 0;

function buildTrail(b) { b.trail = null; }

function makeTrail(b) {
  const arr = new Float32Array(TRAIL_CAP * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  line.frustumCulled = false;
  line.renderOrder = 1;
  scene.add(line);
  b.trail = { arr, geo, line, n: 0 };
}

function killTrail(b) {
  if (!b.trail) return;
  scene.remove(b.trail.line);
  b.trail.geo.dispose();
  b.trail.line.material.dispose();
  b.trail = null;
}

function updateTrails() {
  if (!settings.trails) {
    for (const b of sim.bodies) if (b.trail) killTrail(b);
    return;
  }
  // Only the most significant bodies get a trail, so the line count stays sane.
  const ranked = sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, MAX_TRAILS);
  const keep = new Set(ranked);
  for (const b of sim.bodies) {
    if (!keep.has(b) && b.trail) killTrail(b);
    if (keep.has(b) && !b.trail) makeTrail(b);
  }
  trailTick++;
  if (trailTick % 2) return;
  for (const b of ranked) {
    const t = b.trail;
    if (!t) continue;
    if (t.n < TRAIL_CAP) {
      const i = t.n * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
      t.n++;
    } else {
      t.arr.copyWithin(0, 3);
      const i = (TRAIL_CAP - 1) * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
    }
    t.geo.setDrawRange(0, t.n);
    t.geo.attributes.position.needsUpdate = true;
  }
}

function clearTrails() {
  for (const b of sim.bodies) if (b.trail) { b.trail.n = 0; b.trail.geo.setDrawRange(0, 0); }
}

/* ========================================================== lensing pass    */

let rt = null, postScene = null, postCam = null, postMat = null, postOK = false;

const LENS_FRAG = `
  uniform sampler2D tDiffuse;
  uniform vec3 uHoles[4];
  uniform int uCount;
  uniform float uAspect;
  varying vec2 vUv;
  void main() {
    vec2 uv = vUv;
    float dark = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= uCount) break;
      vec3 h = uHoles[i];
      if (h.z <= 0.0) continue;
      vec2 d = (uv - h.xy) * vec2(uAspect, 1.0);
      float r = length(d);
      if (r < 1e-5) continue;
      float rs = h.z;
      // light bends more the closer it passes; taper it off far from the hole
      float defl = (rs * rs) / max(r, rs * 0.4) * 1.5;
      defl *= exp(-r / (rs * 8.0));
      uv -= (d / r) / vec2(uAspect, 1.0) * defl;
      dark = max(dark, smoothstep(rs * 1.04, rs * 0.92, r));
    }
    vec4 c = texture2D(tDiffuse, clamp(uv, vec2(0.001), vec2(0.999)));
    gl_FragColor = vec4(c.rgb * (1.0 - dark), 1.0);
  }`;

const LENS_VERT = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function initPost() {
  try {
    rt = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, stencilBuffer: false, depthBuffer: true
    });
    postMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rt.texture },
        uHoles: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
        uCount: { value: 0 },
        uAspect: { value: 1 }
      },
      vertexShader: LENS_VERT, fragmentShader: LENS_FRAG, depthTest: false, depthWrite: false
    });
    postScene = new THREE.Scene();
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
    postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postOK = true;
  } catch (e) {
    postOK = false;
  }
}

const _proj = new THREE.Vector3();

function gatherHoles() {
  let n = 0;
  const out = postMat ? postMat.uniforms.uHoles.value : null;
  if (!out) return 0;
  for (let i = 0; i < sim.bodies.length && n < 4; i++) {
    const b = sim.bodies[i];
    if (b.kind !== 'bh') continue;
    _proj.copy(b.p).project(camera);
    if (_proj.z < -1 || _proj.z > 1) continue;
    const dist = camera.position.distanceTo(b.p);
    // shadow radius expressed in the same units as the vertical 0..1 screen axis
    const rs = visRadius(b) / (dist * Math.tan(FOV * Math.PI / 360)) * 0.5;
    if (rs < 0.0015 || rs > 3) continue;
    const sx = (_proj.x + 1) * 0.5, sy = (_proj.y + 1) * 0.5;
    if (sx < -1 || sx > 2 || sy < -1 || sy > 2) continue;
    out[n].set(sx, sy, rs);
    n++;
  }
  return n;
}

function renderFrame() {
  let holes = 0;
  if (settings.lensing && postOK) holes = gatherHoles();
  if (holes > 0) {
    postMat.uniforms.uCount.value = holes;
    postMat.uniforms.uAspect.value = VIEW.w / VIEW.h;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

/* =================================================================== camera */

const view = { target: new THREE.Vector3(), dist: 900, yaw: 0.75, pitch: 0.46 };
const MIN_DIST = 2e-4, MAX_DIST = 2.4e6;

function applyCamera() {
  view.pitch = clamp(view.pitch, -1.52, 1.52);
  view.dist = clamp(view.dist, MIN_DIST, MAX_DIST);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(
    view.target.x + view.dist * cp * Math.sin(view.yaw),
    view.target.y + view.dist * sp,
    view.target.z + view.dist * cp * Math.cos(view.yaw)
  );
  camera.lookAt(view.target);
  // keep the near plane sensible across nine orders of magnitude
  camera.near = Math.max(1e-6, view.dist * 1e-4);
  camera.far = Math.max(view.dist * 12, SKY_R * 2.2);
  camera.updateProjectionMatrix();
  if (skyGroup) skyGroup.position.copy(camera.position);
}

function frameOn(b, margin) {
  if (!b) return;
  view.target.copy(b.p);
  view.dist = clamp(visRadius(b) * (margin || 9), MIN_DIST, MAX_DIST);
}

function resize() {
  // Never let the viewport reach zero: a hidden or collapsed window reports
  // 0×0, and every worldPerPixel() division downstream would become Infinity.
  const w = Math.max(window.innerWidth, 1), h = Math.max(window.innerHeight, 1);
  VIEW.w = w; VIEW.h = h;
  VIEW.dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(VIEW.dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (rt) rt.setSize(Math.floor(w * VIEW.dpr), Math.floor(h * VIEW.dpr));
}

/* ========================================================= selection marker */

/**
 * Drawn as an SVG overlay rather than a sprite in the scene: anything inside the
 * 3D pass gets warped and darkened by the black-hole lensing shader, which had
 * been swallowing the reticle whole whenever you selected a hole.
 */
function updateReticle() {
  const el = $('an-ret');
  const b = sim.selected;
  if (!b || !b.alive) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const px = apparentPx(b);
  // Once a body fills the view it is obvious what is selected, and a reticle
  // that size just sprawls across the panels.
  if (px > VIEW.h * 0.3) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  _lp.copy(b.p).project(camera);
  if (_lp.z < -1 || _lp.z > 1) { el.style.display = 'none'; return; }
  el.setAttribute('cx', ((_lp.x + 1) * 0.5 * VIEW.w).toFixed(1));
  el.setAttribute('cy', ((1 - _lp.y) * 0.5 * VIEW.h).toFixed(1));
  el.setAttribute('r', Math.max(px * 1.55, 20).toFixed(1));
  if (el.style.display !== 'block') el.style.display = 'block';
}

/* =================================================================== labels */

const LABEL_POOL = 22;
const labelEls = [];

function initLabels() {
  const host = document.getElementById('an-app');
  for (let i = 0; i < LABEL_POOL; i++) {
    const d = document.createElement('div');
    d.className = 'an-label';
    d.style.display = 'none';
    host.appendChild(d);
    labelEls.push(d);
  }
}

const _lp = new THREE.Vector3();

function updateLabels() {
  if (!settings.labels) {
    for (const el of labelEls) if (el.style.display !== 'none') el.style.display = 'none';
    return;
  }
  // Zoomed out, every body is a sub-pixel dot indistinguishable from a
  // background star, so rank by significance (apparent size plus mass) and let
  // the pool size decide how many get named rather than a raw pixel threshold.
  const cands = [];
  for (const b of sim.bodies) {
    const px = apparentPx(b);
    const score = (b === sim.selected || b === sim.follow)
      ? 1e9
      : px + Math.log10(Math.max(b.m, 1e-12)) * 0.9;
    cands.push([score, b, px]);
  }
  cands.sort((a, b) => b[0] - a[0]);

  // Bodies that sit on top of each other at this zoom (Earth and its Moon, a
  // debris cloud) would otherwise stack their names into an unreadable smear.
  const taken = [];
  let slot = 0;

  for (let ci = 0; ci < cands.length && slot < LABEL_POOL; ci++) {
    const c = cands[ci];
    const b = c[1];
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1 || _lp.x < -1.1 || _lp.x > 1.1 || _lp.y < -1.1 || _lp.y > 1.1) continue;

    const x = (_lp.x + 1) * 0.5 * VIEW.w;
    const y = (1 - _lp.y) * 0.5 * VIEW.h;
    let clash = false;
    for (let t = 0; t < taken.length; t++) {
      if (Math.abs(taken[t][0] - x) < 52 && Math.abs(taken[t][1] - y) < 13) { clash = true; break; }
    }
    if (clash && b !== sim.selected && b !== sim.follow) continue;
    taken.push([x, y]);

    const el = labelEls[slot++];
    const off = Math.min(Math.max(c[2], 5) + 9, 90);
    el.style.transform = 'translate(-50%,0) translate(' + x.toFixed(1) + 'px,' + (y + off).toFixed(1) + 'px)';
    if (el.textContent !== b.name) el.textContent = b.name;
    el.classList.toggle('sel', b === sim.selected);
    if (el.style.display !== 'block') el.style.display = 'block';
  }

  for (let i = slot; i < LABEL_POOL; i++) {
    const el = labelEls[i];
    if (el.style.display !== 'none') el.style.display = 'none';
  }
}

function apparentPx(b) {
  const d = camera.position.distanceTo(b.p);
  return visRadius(b) / worldPerPixel(Math.max(d, 1e-9));
}

/* ========================================================== visual update   */

const _dir = new THREE.Vector3();
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const FROST = new THREE.Color(0.72, 0.82, 0.95);

function refreshStarCache() {
  sim.starCache.length = 0;
  for (const b of sim.bodies) {
    if (b.lum > 0 || (TYPES[b.type].star && b.kind === 'body')) sim.starCache.push(b);
  }
}

function nearestStar(b) {
  let best = null, bestD = Infinity;
  for (const s of sim.starCache) {
    if (s === b) continue;
    const d = b.p.distanceToSquared(s.p);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function updateVisuals(realDt, simDt) {
  refreshStarCache();
  updateTemperatures();
  updateLights();

  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    const p = b.parts;
    if (!p) continue;
    const def = TYPES[b.type];
    const r = visRadius(b);
    const px = apparentPx(b);

    b.obj.position.copy(b.p);
    b.obj.rotation.z = b.tilt;

    // ---- level of detail: below a couple of pixels, draw a dot instead
    const tiny = px < 1.7;
    if (p.surf) p.surf.visible = !tiny;
    if (p.cloud) p.cloud.visible = !tiny && px > 5;
    if (p.atmo) p.atmo.visible = !tiny && px > 4;
    if (p.ring) p.ring.visible = !tiny;
    if (p.disk) p.disk.visible = !tiny;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    if (p.dot) {
      const show = tiny || def.star || b.kind === 'wh';
      p.dot.visible = show;
      if (show) {
        const size = tiny ? 5.4 * wpp : Math.max(r * 2.2, 3.0 * wpp);
        p.dot.scale.setScalar(size);
        // Zoomed far out these dots are the only trace of a planet, so keep
        // them legible rather than fading them to nothing.
        p.dot.material.opacity = tiny ? clamp(0.45 + px * 0.3, 0.45, 1) : 0.55;
      }
    }

    if (p.surf && !tiny) p.surf.rotation.y = b.rot;
    if (p.cloud) p.cloud.rotation.y = b.rot * 1.12;

    // ---- lighting direction for the atmosphere rim
    if (p.atmo && p.atmo.visible) {
      const s = nearestStar(b);
      if (s) _dir.copy(s.p).sub(b.p).normalize();
      else _dir.copy(camera.position).sub(b.p).normalize();
      p.atmo.material.uniforms.uLight.value.copy(_dir);
    }

    // ---- stars: glow scaled with a pixel floor so they never disappear
    if (p.glow) {
      p.glow.scale.setScalar(Math.max(r * 3.4, 11 * wpp));
      p.halo.scale.setScalar(Math.max(r * 9.5, 34 * wpp));
    }

    // ---- black holes
    if (p.disk) p.disk.rotation.z += realDt * 0.35;
    if (p.photon) p.photon.scale.setScalar(Math.max(r * 5.6, 16 * wpp));

    // ---- a world's appearance responds to how hot it is
    if (p.surf && b.baseColor && p.surf.material.isMeshStandardMaterial) {
      const mat = p.surf.material;
      const hot = clamp((b.temp - 900) / 1300, 0, 1);
      const base = def.glowHot ? def.glowHot * 0.55 : 0;
      const e = Math.max(base, hot * 0.85);
      mat.emissive.setRGB(e, e * 0.28, e * 0.05);
      const cold = clamp((110 - b.temp) / 70, 0, 1) * 0.5;
      mat.color.copy(b.baseColor).lerp(FROST, cold);
    }

    // ---- comet tail: grows as it nears a star, always pointing away from it
    if (p.tail) {
      const s = nearestStar(b);
      let len = 0, flux = 0;
      if (s) {
        const dAU = Math.max(b.p.distanceTo(s.p) / AU, 1e-3);
        flux = s.lum / (dAU * dAU);
        // An absolute scale, not a multiple of the nucleus: a comet is a few km
        // across but its tail runs for a good fraction of an AU. Below roughly
        // 5 AU of sunlight there is not enough heat to outgas at all.
        if (flux > 0.03) len = 0.16 * AU * Math.pow(clamp(flux, 0, 60), 0.4);
      }
      const visible = len > 0 && len / wpp > 4;
      p.tail.visible = visible;
      if (p.coma) {
        p.coma.visible = visible;
        p.coma.scale.setScalar(Math.max(len * 0.035, r * 6, 4 * wpp));
        p.coma.material.opacity = clamp(Math.pow(clamp(flux, 0, 60), 0.35) * 0.4, 0.12, 0.9);
      }
      if (visible) {
        _tmpA.copy(b.p).sub(s.p).normalize();                       // away from the star
        _tmpB.copy(camera.position).sub(b.p).normalize();
        const z = _tmpB.clone().addScaledVector(_tmpA, -_tmpB.dot(_tmpA));
        if (z.lengthSq() < 1e-12) z.set(0, 1, 0); else z.normalize();
        const y = new THREE.Vector3().crossVectors(z, _tmpA);
        _basis.makeBasis(_tmpA, y, z);
        _basis.scale(new THREE.Vector3(len, len * 0.14, 1));
        _basis.setPosition(b.p);
        p.tail.matrixAutoUpdate = false;
        p.tail.matrix.copy(_basis);
        p.tail.matrixWorldNeedsUpdate = true;
      }
    }
  }

  updateReticle();
  updateTrails();
  updateFx(realDt, simDt);
  updateLabels();
}

/* ==================================================================== input */

const $ = (id) => document.getElementById(id);
const raycaster = new THREE.Raycaster();

const input = {
  mode: null,
  armed: null,
  x0: 0, y0: 0, x: 0, y: 0,
  moved: false,
  placePos: null,
  pointers: new Map(),
  pinchD: 0, pinchX: 0, pinchY: 0
};

/**
 * Map a screen point onto a world position. The horizontal plane through the
 * focus point is preferred so built systems stay roughly coplanar; when the
 * camera is too close to edge-on, fall back to a plane facing the camera.
 */
function screenToWorld(sx, sy) {
  raycaster.setFromCamera(new THREE.Vector2((sx / VIEW.w) * 2 - 1, -(sy / VIEW.h) * 2 + 1), camera);
  const ray = raycaster.ray;
  if (Math.abs(ray.direction.y) > 0.10) {
    const t = (view.target.y - ray.origin.y) / ray.direction.y;
    if (t > 0 && t < view.dist * 40) return ray.origin.clone().addScaledVector(ray.direction, t);
  }
  const n = camera.getWorldDirection(new THREE.Vector3());
  const denom = n.dot(ray.direction);
  const t = Math.abs(denom) > 1e-6 ? n.dot(_tmpA.copy(view.target).sub(ray.origin)) / denom : view.dist;
  return ray.origin.clone().addScaledVector(ray.direction, clamp(t, view.dist * 0.02, view.dist * 40));
}

/** Pick by screen distance rather than mesh intersection, so tiny bodies work. */
function pickBody(sx, sy) {
  let best = null, bestScore = Infinity;
  for (const b of sim.bodies) {
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    const reach = Math.max(apparentPx(b) + 10, 16);
    if (d > reach) continue;
    const score = d - apparentPx(b) * 0.25;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  return best;
}

/** The body whose gravity dominates at a point — used for auto-orbit. */
function dominantAt(pos, exclude) {
  let best = null, bestPull = 0;
  for (const b of sim.bodies) {
    if (b === exclude || b.kind === 'wh') continue;
    const d2 = Math.max(b.p.distanceToSquared(pos), 1e-9);
    const pull = b.m / d2;
    if (pull > bestPull) { bestPull = pull; best = b; }
  }
  return best;
}

/** Circular-orbit velocity about `primary` at `pos`, in the horizontal plane. */
function circularVelocity(primary, pos) {
  const rel = pos.clone().sub(primary.p);
  const d = rel.length();
  if (d < 1e-9) return new THREE.Vector3();
  const speed = Math.sqrt(G * settings.gravity * primary.m / d);
  let tang = new THREE.Vector3(0, 1, 0).cross(rel);
  if (tang.lengthSq() < 1e-12) tang = new THREE.Vector3(1, 0, 0).cross(rel);
  tang.normalize().multiplyScalar(speed);
  return tang.add(primary.v);
}

function bindInput() {
  const c = canvasEl;
  c.addEventListener('contextmenu', e => e.preventDefault());

  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId);
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.pointers.size === 2) {
      const p = [...input.pointers.values()];
      input.mode = 'pinch';
      input.pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      input.pinchX = (p[0].x + p[1].x) / 2;
      input.pinchY = (p[0].y + p[1].y) / 2;
      hideAim();
      return;
    }
    if (input.pointers.size > 2) return;

    input.x0 = input.x = e.clientX;
    input.y0 = input.y = e.clientY;
    input.moved = false;

    if (input.armed && e.button === 0 && !e.shiftKey) {
      input.mode = 'place';
      input.placePos = screenToWorld(e.clientX, e.clientY);
    } else if (e.button === 2 || e.button === 1 || e.shiftKey) {
      input.mode = 'pan';
    } else {
      input.mode = 'orbit';
    }
  });

  c.addEventListener('pointermove', (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.mode === 'pinch' && input.pointers.size >= 2) {
      const p = [...input.pointers.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (input.pinchD > 0) view.dist *= clamp(input.pinchD / Math.max(d, 1), 0.4, 2.5);
      panBy(mx - input.pinchX, my - input.pinchY);
      input.pinchD = d; input.pinchX = mx; input.pinchY = my;
      return;
    }

    const dx = e.clientX - input.x, dy = e.clientY - input.y;
    input.x = e.clientX; input.y = e.clientY;
    if (Math.hypot(e.clientX - input.x0, e.clientY - input.y0) > 5) input.moved = true;

    if (input.mode === 'orbit') {
      view.yaw -= dx * 0.005;
      view.pitch += dy * 0.005;
    } else if (input.mode === 'pan') {
      panBy(dx, dy);
      sim.follow = null;
    } else if (input.mode === 'place') {
      drawAim();
    }
  });

  const finish = (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.delete(e.pointerId);

    if (input.mode === 'place') {
      dropArmed();
      hideAim();
    } else if (input.mode === 'orbit' && !input.moved) {
      select(pickBody(e.clientX, e.clientY));
    }
    if (input.pointers.size === 0) input.mode = null;
    else if (input.pointers.size === 1) {
      const p = [...input.pointers.values()][0];
      input.mode = 'orbit'; input.x = p.x; input.y = p.y; input.moved = true;
    }
  };
  c.addEventListener('pointerup', finish);
  c.addEventListener('pointercancel', finish);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.dist *= Math.pow(1.0016, e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY);
  }, { passive: false });

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
}

function panBy(dx, dy) {
  const wpp = worldPerPixel(view.dist);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  view.target.addScaledVector(right, -dx * wpp).addScaledVector(up, dy * wpp);
}

/* ------------------------------------------------------------- aim overlay  */

function velocityFromDrag() {
  const pos = input.placePos;
  const primary = dominantAt(pos, null);
  let vRef;
  if (primary) {
    const d = Math.max(primary.p.distanceTo(pos), 1e-9);
    vRef = Math.sqrt(G * settings.gravity * primary.m / d);
  } else {
    vRef = 2.592;                                     // ~30 km/s, a homely orbital speed
  }
  const dx = input.x - input.x0, dy = input.y - input.y0;
  const px = Math.hypot(dx, dy);
  if (px < 6) {
    // A tap with no drag: give it a circular orbit if that makes sense.
    if (settings.autoOrbit && primary && primary.m > 0.01) return circularVelocity(primary, pos);
    return primary ? primary.v.clone() : new THREE.Vector3();
  }
  // 120 px of drag ≈ one local circular-orbit speed, measured relative to the
  // dominant body so a moon dropped beside a moving planet keeps up with it
  const world = screenToWorld(input.x, input.y).sub(pos);
  const scale = vRef / (120 * worldPerPixel(view.dist));
  const v = world.multiplyScalar(scale);
  return primary ? v.add(primary.v) : v;
}

function drawAim() {
  $('an-aim').style.display = 'block';
  const l = $('an-aim-line'), d = $('an-aim-dot'), t = $('an-aim-txt');
  l.setAttribute('x1', input.x0); l.setAttribute('y1', input.y0);
  l.setAttribute('x2', input.x); l.setAttribute('y2', input.y);
  d.setAttribute('cx', input.x0); d.setAttribute('cy', input.y0);
  const v = velocityFromDrag();
  t.setAttribute('x', input.x + 12);
  t.setAttribute('y', input.y - 8);
  t.textContent = fmtSpeed(v.length());
}

function hideAim() { $('an-aim').style.display = 'none'; }

function dropArmed() {
  if (!input.armed || !input.placePos) return;
  if (sim.bodies.length >= MAX_BODIES) { toast('Universe is full — clear some bodies'); return; }
  const vel = velocityFromDrag();
  const b = makeBody(input.armed, input.placePos, vel);
  select(b);
  if (!sim.running && sim.bodies.length > 1) toast('Press ▶ to start time');
}

/* ---------------------------------------------------------------- keyboard  */

function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case ',': case '<': changeRate(-1); break;
    case '.': case '>': changeRate(1); break;
    case 'f': case 'F':
      if (sim.selected) { sim.follow = sim.follow === sim.selected ? null : sim.selected; renderInspector(); }
      break;
    case 'Delete': case 'Backspace':
      if (sim.selected) { const b = sim.selected; select(null); removeBody(b); compact(); }
      break;
    case 'Escape': arm(null); closeModal(); break;
    case 't': case 'T': settings.trails = !settings.trails; clearTrails(); syncSettings(); break;
    case 'l': case 'L': settings.labels = !settings.labels; syncSettings(); break;
  }
}

let toastTimer = 0;
function toast(msg) {
  const el = $('an-toast');
  el.textContent = msg;

  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);

function buildPalette() {
  const host = $('an-palette-list');
  let html = '';
  for (const g of GROUPS) {
    html += '<div class="an-group">' + g + '</div>';
    for (const key in TYPES) {
      if (TYPES[key].group !== g) continue;
      const t = TYPES[key];
      const cls = t.kind === 'bh' ? ' hole' : t.rings ? ' ring' : '';
      html += '<button class="an-item" data-type="' + key + '" title="' + t.blurb.replace(/"/g, '&quot;') + '">' +
        '<span class="an-dot' + cls + '" style="background:' + SWATCH[key] + ';color:' + SWATCH[key] + '"></span>' +
        '<span>' + t.label + '</span></button>';
    }
  }
  host.innerHTML = html;
  host.addEventListener('click', (e) => {
    const btn = e.target.closest('.an-item');
    if (!btn) return;
    arm(input.armed === btn.dataset.type ? null : btn.dataset.type);
  });
}

function arm(type) {
  input.armed = type;
  for (const el of document.querySelectorAll('.an-item')) el.classList.toggle('armed', el.dataset.type === type);
  $('an-armed-lbl').textContent = type ? 'ARMED' : '';

}

function updateHint() {
  const el = $('an-hint');
  let s;
  if (input.armed) {
    s = 'Click empty space to drop <b>' + TYPES[input.armed].label + '</b> &middot; <b>drag</b> to aim its speed';
  } else if (sim.selected) {
    s = '<kbd>F</kbd> follow &middot; <kbd>Del</kbd> remove &middot; drag to orbit &middot; scroll to zoom';
  } else {
    s = 'Pick something from <b>Add Body</b>, then click space to place it &middot; <kbd>Space</kbd> starts time';
  }
  el.innerHTML = s;
}

function updateInspectorStats() {
  const b = sim.selected;
  if (!b || !b.alive || !inspRefs) return;
  inspRefs.mass.textContent = fmtMass(b.m);
  inspRefs.rad.textContent = b.kind === 'bh' ? fmtRadius(b.r) + ' (horizon)' : fmtRadius(b.r);
  inspRefs.den.textContent = b.kind === 'bh' ? '—' : fmtDensity(b.m, b.r);
  inspRefs.spd.textContent = fmtSpeed(b.v.length());
  inspRefs.tmp.textContent = b.kind === 'bh' ? '—' : Math.round(b.temp).toLocaleString() + ' K';
  inspRefs.mval.textContent = fmtMass(b.m);

  const prim = dominantAt(b.p, b);
  if (prim && prim.m > b.m * 3) {
    inspRefs.orbL.textContent = 'Distance to ' + prim.name;
    inspRefs.orb.textContent = fmtDist(b.p.distanceTo(prim.p));
  } else {
    inspRefs.orbL.textContent = 'Orbiting';
    inspRefs.orb.textContent = '—';
  }
}

const RATES = [0.02, 0.1, 0.5, 1, 4, 16, 64, 256, 1024, 4096];

function togglePlay() {
  sim.running = !sim.running;

  if (sim.running) computeAccel();
}

function changeRate(d) {
  rateIdx = clamp(rateIdx + d, 0, RATES.length - 1);
  sim.rate = RATES[rateIdx];
  syncRate();
}

function syncRate() {
  const r = sim.rate;
  if (r >= 365) {
    $('an-rate-val').textContent = (r / 365.25).toPrecision(3).replace(/\.?0+$/, '');
    $('an-rate-unit').textContent = 'years / sec';
  } else {
    $('an-rate-val').textContent = r < 1 ? r.toString() : Math.round(r).toString();
    $('an-rate-unit').textContent = 'days / sec';
  }
}

/* ================================================================== systems  */

/* Resolved in boot(), not at parse time, so a failed three.js load still
   reaches the friendly error screen instead of throwing here. */
let V3 = null;

/**
 * Put a body on a Keplerian orbit around `primary`. It starts at apoapsis, so
 * the velocity is purely tangential: v = sqrt(mu · (2/r − 1/a)).
 */
function orbitBody(type, primary, a, opts) {
  const o = opts || {};
  const ang = o.ang != null ? o.ang : Math.random() * TAU;
  const ecc = o.ecc || 0;
  const r0 = a * (1 + ecc);
  const dir = new V3(Math.cos(ang), 0, Math.sin(ang));
  const tan = new V3(-Math.sin(ang), 0, Math.cos(ang));
  if (o.inc) tan.applyAxisAngle(dir, o.inc);          // tilt at the node
  const mu = G * settings.gravity * primary.m;
  const speed = Math.sqrt(Math.max(mu * (2 / r0 - 1 / a), 0)) * (o.retro ? -1 : 1);
  return makeBody(type,
    primary.p.clone().addScaledVector(dir, r0),
    primary.v.clone().addScaledVector(tan, speed),
    o.over);
}

/** Two bodies in a mutual circular orbit about their shared barycentre. */
function binaryPair(typeA, mA, typeB, mB, sep, center) {
  const c = center || new V3();
  const tot = mA + mB;
  const mu = G * settings.gravity * tot;
  const vRel = Math.sqrt(mu / sep);
  const a = makeBody(typeA, new V3(-sep * mB / tot, 0, 0).add(c), new V3(0, 0, -vRel * mB / tot), { mass: mA });
  const b = makeBody(typeB, new V3(sep * mA / tot, 0, 0).add(c), new V3(0, 0, vRel * mA / tot), { mass: mB });
  return [a, b];
}

    dist: 420,
    build() {
      makeBody('white_hole', new V3(), new V3(), { name: 'Erebus' });
      for (let i = 0; i < 26; i++) {
        const a = rnd(0, TAU), d = rnd(50, 170);
        makeBody(pick(['asteroid', 'moon', 'comet']),
          new V3(Math.cos(a) * d, rnd(-18, 18), Math.sin(a) * d),
          new V3(rnd(-0.4, 0.4), rnd(-0.2, 0.2), rnd(-0.4, 0.4)));
      }
      sim.running = true;
    }
  },
  {
    name: 'Neutron Waltz', desc: 'Two city-sized stellar corpses whipping around each other in hours.',
    dist: 0.9,
    build() {
      binaryPair('neutron_star', 1.4 * M_SUN, 'neutron_star', 1.3 * M_SUN, 0.22);
      sim.running = true;
    }
  },
  {
    name: 'Empty Space', desc: 'A clean slate. Build whatever you like.',
    dist: 500,
    build() { }
  }
];

function openSystems() {
  $('an-modal-title').textContent = 'Systems';
  let html = '<div class="an-presets">';
  PRESETS.forEach((p, i) => {
    html += '<button class="an-preset" data-i="' + i + '"><b>' + p.name + '</b><span>' + p.desc + '</span></button>';
  });
  html += '</div>';
  $('an-modal-body').innerHTML = html;
  $('an-modal-body').querySelectorAll('.an-preset').forEach(btn => {
    btn.addEventListener('click', () => { loadPreset(PRESETS[+btn.dataset.i]); closeModal(); });
  });
  openModal();
}

function clearAll() {
  for (const b of sim.bodies) { disposeVisual(b); }
  sim.bodies.length = 0;
  usedNames.clear();
  sim.time = 0;
  sim.selected = null;
  sim.follow = null;
  renderInspector();
  toast('Universe cleared');
}

function loadPreset(p) {
  clearAll();
  sim.running = false;
  p.build();
  view.target.set(0, 0, 0);
  view.dist = p.dist;
  view.yaw = 0.75;
  view.pitch = 0.46;
  computeAccel();
  clearTrails();
  refreshStarCache();
  updateTemperatures();
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  $('an-hud-bodies').textContent = sim.bodies.length;
  toast(p.name);
}

/* ============================================================== persistence */

const SAVE_KEY = 'astronomia.save.v1';

function saveUniverse() {
  try {
    const data = {
      t: sim.time, settings: settings, rateIdx: rateIdx,
      cam: { t: view.target.toArray(), d: view.dist, y: view.yaw, p: view.pitch },
      bodies: sim.bodies.map(b => ({
        ty: b.type, n: b.name, m: b.m, r: b.r, s: b.seed, sp: b.spin, ti: b.tilt,
        p: [b.p.x, b.p.y, b.p.z], v: [b.v.x, b.v.y, b.v.z]
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Universe saved (' + data.bodies.length + ' bodies)');
  } catch (e) {
    toast('Could not save — storage unavailable');
  }
}

function loadUniverse() {
  let data;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('No saved universe yet'); return; }
    data = JSON.parse(raw);
  } catch (e) { toast('Saved universe is unreadable'); return; }

  clearAll();
  for (const k in data.settings) if (k in settings) settings[k] = data.settings[k];
  sim.time = data.t || 0;
  for (const s of data.bodies || []) {
    if (!TYPES[s.ty]) continue;
    makeBody(s.ty, new V3().fromArray(s.p), new V3().fromArray(s.v),
      { mass: s.m, r: s.r, name: s.n, seed: s.s, spin: s.sp, tilt: s.ti });
  }
  if (data.cam) {
    view.target.fromArray(data.cam.t);
    view.dist = data.cam.d; view.yaw = data.cam.y; view.pitch = data.cam.p;
  }
  if (data.rateIdx != null) { rateIdx = data.rateIdx; sim.rate = RATES[rateIdx]; syncRate(); }
  computeAccel();
  clearTrails();
  closeModal();
  toast('Universe loaded (' + sim.bodies.length + ' bodies)');
}

/* ===================================================================== help */

function openHelp() {
  $('an-modal-title').textContent = 'How to play';
  $('an-modal-body').innerHTML =
    '<div class="an-help">' +
    '<h3>BUILDING</h3>' +
    '<ul>' +
    '<li>Pick anything from <b>Add Body</b> on the left, then <b>click empty space</b> to drop it there.</li>' +
    '<li><b>Drag</b> while placing to aim it — the longer the drag, the faster it flies. About 120 pixels of drag equals one circular orbit speed at that spot.</li>' +
    '<li>Just click without dragging and <b>Auto-orbit</b> gives it a clean circular orbit around whatever dominates nearby.</li>' +
    '<li><b>Click a body</b> to select it. The panel on the right shows its real mass, density, speed and temperature, and lets you resize it.</li>' +
    '</ul>' +
    '<h3>MOVING AROUND</h3>' +
    '<div class="an-keys">' +
    '<div><kbd>Drag</kbd></div><span>Rotate the view</span>' +
    '<div><kbd>Right-drag</kbd></div><span>Pan (or hold <kbd>Shift</kbd> and drag)</span>' +
    '<div><kbd>Scroll</kbd></div><span>Zoom — the view spans from metres to light-days</span>' +
    '<div><kbd>Space</kbd></div><span>Start or stop time</span>' +
    '<div><kbd>,</kbd> <kbd>.</kbd></div><span>Slow down / speed up time</span>' +
    '<div><kbd>F</kbd></div><span>Lock the camera onto the selected body</span>' +
    '<div><kbd>Del</kbd></div><span>Remove the selected body</span>' +
    '<div><kbd>T</kbd> <kbd>L</kbd></div><span>Toggle trails / labels</span>' +
    '</div>' +
    '<p style="margin-top:8px">On a touch screen: one finger rotates, two fingers pinch to zoom and drag to pan.</p>' +
    '<h3>WHAT THE PHYSICS ACTUALLY DOES</h3>' +
    '<ul>' +
    '<li>Every body pulls on every other one with real Newtonian gravity, stepped with a leapfrog integrator that keeps orbits stable for thousands of years.</li>' +
    '<li>Masses, radii and distances are in real units — Earth masses, Earth radii and millions of kilometres. Drop Earth 149.6 million km from a Sun-like star and its year comes out at 365 days.</li>' +
    '<li><b>Slow collisions merge</b> and conserve momentum. <b>Fast ones shatter</b> both bodies into rubble — the test is impact speed against the pair\'s escape velocity.</li>' +
    '<li>Pile up more than 8% of the Sun\'s mass and the body <b>ignites into a star</b>. Push a star past 25 solar masses and it <b>collapses into a black hole</b>.</li>' +
    '<li>Stray inside a planet\'s <b>Roche limit</b> and tides tear the moon into a ring, exactly as they did at Saturn.</li>' +
    '<li>Surface temperatures come from the real starlight falling on each world, so worlds glow when they roast and frost over when they don\'t.</li>' +
    '</ul>' +
    '<h3>TWO HONEST FUDGES</h3>' +
    '<ul>' +
    '<li>Planets are drawn <b>larger than life</b> (see Settings) because at true scale they would be invisible specks. They collide at the size you see.</li>' +
    '<li>Black holes are drawn far bigger than their real event horizons — a ten-solar-mass hole is only about 30 km across — and starlight does not dim with distance, or half your worlds would be pitch black.</li>' +
    '</ul>' +
    '</div>';
  openModal();
}

/* ====================================================================== HUD */

let fpsAcc = 0, fpsCount = 0, fpsShown = 60, statTick = 0;

function updateHud(realDt) {
  fpsAcc += realDt; fpsCount++;
  if (fpsAcc > 0.5) {
    fpsShown = Math.round(fpsCount / fpsAcc);
    fpsAcc = 0; fpsCount = 0;
    $('an-hud-fps').textContent = fpsShown;
    $('an-hud-bodies').textContent = sim.bodies.length;
  }
  const yr = Math.floor(sim.time / 365.25);
  const dy = Math.floor(sim.time - yr * 365.25);
  $('an-clock').innerHTML = 'Y ' + yr.toLocaleString() + '<br>D ' + dy;
  $('an-scale-lbl').textContent = fmtDist(54 * worldPerPixel(view.dist));
}

function showPanel(which) {
  const pal = $('an-palette'), insp = $('an-inspector');
  pal.classList.toggle('hidden', which !== 'palette');
  insp.classList.toggle('hidden', which !== 'inspector');
  document.body.classList.toggle('panel-open', !!which);
}

/* ================================================================ main loop */

let lastFrame = 0;

function loop(now) {
  const realDt = Math.min((now - lastFrame) / 1000, 0.1) || 0;
  lastFrame = now;

  const t0 = sim.time;
  advance(realDt);
  const simDt = sim.time - t0;

  if (sim.follow) {
    if (sim.follow.alive) view.target.copy(sim.follow.p);
    else { sim.follow = null; renderInspector(); }
  }
  applyCamera();
  updateVisuals(realDt, simDt);
  renderFrame();
  updateHud(realDt);

  if (++statTick % 10 === 0) updateInspectorStats();
  requestAnimationFrame(loop);
}

/* ===================================================================== boot */

function fail(msg) {
  $('an-boot').innerHTML = '<div class="an-title">AstroNomia</div><div class="an-fail">' + msg + '</div>';
  $('an-boot').classList.remove('gone');
}

function boot() {
  if (typeof THREE === 'undefined') {
    fail('AstroNomia needs the three.js library, which could not be loaded.<br><br>Check your internet connection and reload.');
    return;
  }
  V3 = THREE.Vector3;
  try {
    initScene();
  } catch (e) {
    fail('This browser could not start WebGL, which AstroNomia needs to draw in 3D.<br><br>Try a different browser, or check that hardware acceleration is switched on.<br><br><small>' + (e && e.message ? e.message : e) + '</small>');
    return;
  }

  initLights();
  initLabels();
  buildPalette();
  bindInput();

  $('an-play').addEventListener('click', togglePlay);
  $('an-slower').addEventListener('click', () => changeRate(-1));
  $('an-faster').addEventListener('click', () => changeRate(1));
  $('an-btn-systems').addEventListener('click', openSystems);
  $('an-btn-settings').addEventListener('click', openSettings);
  $('an-btn-help').addEventListener('click', openHelp);
  $('an-modal-close').addEventListener('click', closeModal);
  $('an-modal').addEventListener('click', (e) => { if (e.target === $('an-modal')) closeModal(); });
  $('an-mob-add').addEventListener('click', () => {
    showPanel($('an-palette').classList.contains('hidden') ? 'palette' : null);
  });
  $('an-mob-insp').addEventListener('click', () => {
    showPanel($('an-inspector').classList.contains('hidden') ? 'inspector' : null);
  });

  sim.rate = RATES[rateIdx];
  syncRate();
  loadPreset(PRESETS[0]);
  updateHint();
  renderInspector();

  $('an-boot').classList.add('gone');
  setTimeout(() => { const b = $('an-boot'); if (b && b.classList.contains('gone')) b.style.display = 'none'; }, 700);

  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

boot();
</script>
