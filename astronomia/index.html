 *   PLANETARY   the shell a dying Sun-like star puffs off: a small glowing ring.
 *   REMNANT     the blast shell of a supernova, red and green filaments.
 *
 * At the scale of a whole galaxy they are specks — as they really are. Zoom in
 * on an arm and they open up; click one to lock on and fly into it.
 */
const NEB_MAX = 24000;                 // billboards across every nebula
const NEB_KINDS = {
  emission:   { name: 'emission nebula',  R: [90, 420], n: 34,
    note: 'a cloud of hydrogen glowing red where new stars are being born' },
  reflection: { name: 'reflection nebula', R: [12, 45], n: 18,
    note: 'cold dust with no light of its own, lit blue by the stars inside it' },
  planetary:  { name: 'planetary nebula',  R: [0.6, 2.5], n: 54,
    note: 'the glowing shell a dying Sun-like star has puffed off — the Sun will make one in five billion years' },
  remnant:    { name: 'supernova remnant', R: [15, 70], n: 96,
    note: 'the still-expanding blast shell of a star that exploded' },
  // Star clusters ride in the same list so they can be clicked the same way.
  globular:   { name: 'globular cluster', R: [0, 0], n: 0,
    note: 'a ball of ancient stars, older than almost anything else in the galaxy, swarming round its halo' },
  open:       { name: 'open cluster', R: [0, 0], n: 0,
    note: 'a family of young stars born together out of the same cloud, like the Pleiades' }
};
// How many of each a galaxy of each shape gets: young galaxies are full of
// nurseries; an elliptical has almost no gas left and only dying stars' shells.
const NEB_MIX = {
  spiral:     { emission: 26, reflection: 8, planetary: 6, remnant: 4 },
  barred:     { emission: 24, reflection: 8, planetary: 6, remnant: 4 },
  ring:       { emission: 22, reflection: 5, planetary: 4, remnant: 3 },
  irregular:  { emission: 20, reflection: 5, planetary: 3, remnant: 3 },
  dwarf:      { emission: 5,  reflection: 1, planetary: 1, remnant: 1 },
  elliptical: { emission: 0,  reflection: 0, planetary: 5, remnant: 1 }
};
const nebulae = [];
const nebx = { pos: null, col: null, siz: null, rot: null, geo: null, pts: null, n: 0 };

const GNEB_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  attribute float aRot;
  uniform float uScale;
  varying vec3 vCol;
  varying float vA;
  varying float vRot;
  varying float vTile;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    float px = aSize * uScale / max(-mv.z, 1e-9);
    vCol = aCol;
    vRot = fract(aRot) * 6.2831853;
    vTile = floor(aRot);
    // too small to resolve: fade with area rather than shrink to a dot
    vA = aSize > 0.0 ? min(1.0, px * px / 36.0) : 0.0;
    gl_PointSize = aSize > 0.0 ? clamp(px, 2.0, 700.0) : 0.0;
    if (aSize <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  }`;
const GNEB_FRAG = `
  uniform sampler2D uMap;
  uniform float uGain;
  varying vec3 vCol;
  varying float vA;
  varying float vRot;
  varying float vTile;
  void main() {
    vec2 q = gl_PointCoord - 0.5;
    float c = cos(vRot), s = sin(vRot);
    q = vec2(c * q.x - s * q.y, s * q.x + c * q.y) + 0.5;
    if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;
    vec2 tile = vec2(mod(vTile, 2.0), floor(vTile / 2.0)) * 0.5;
    float a = texture2D(uMap, tile + q * 0.5).a;
    gl_FragColor = vec4(vCol * uGain, a * vA);
  }`;

/** Four cloudy blobs in a 2×2 atlas: soft-edged fractal noise. */
function nebulaAtlas() {
  const N = 256, cv = newCanvas(N * 2, N * 2);
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N * 2, N * 2), d = img.data;
  for (let t = 0; t < 4; t++) {
    const f = fbm(7001 + t * 131, 3, 3, 5, 0.55);
    const ox = (t % 2) * N, oy = ((t / 2) | 0) * N;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const u = x / N, v = y / N;
        const r = Math.hypot(u - 0.5, v - 0.5) * 2;
        const edge = clamp(1 - r, 0, 1);
        // wispy: the noise is pushed hard, so most of the blob is threads and gaps
        const n = Math.pow(clamp((f(u, v) - 0.32) * 2.2, 0, 1), 1.6);
        const a = n * Math.pow(edge, 1.3) * 255;
        const i = ((oy + y) * N * 2 + ox + x) * 4;
        d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = a;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(cv);
}

function initNebulae() {
  nebx.pos = new Float32Array(NEB_MAX * 3);
  nebx.col = new Float32Array(NEB_MAX * 3);
  nebx.siz = new Float32Array(NEB_MAX);
  nebx.rot = new Float32Array(NEB_MAX);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(nebx.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(nebx.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(nebx.siz, 1));
  geo.setAttribute('aRot', new THREE.BufferAttribute(nebx.rot, 1));
  geo.setDrawRange(0, 0);
  nebx.geo = geo;
  nebx.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uMap: { value: nebulaAtlas() }, uScale: { value: 1 }, uGain: { value: 0.55 } },
    vertexShader: GNEB_VERT, fragmentShader: GNEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  nebx.pts.frustumCulled = false;
  nebx.pts.renderOrder = -4;
  scene.add(nebx.pts);
}

const NEB_PREFIX = ['NGC', 'IC', 'Sh2-', 'RCW', 'M', 'NGC'];
/** Give a galaxy its nebulae, pinned to stars of the right kind. */
function seedNebulae(b) {
  const shape = TYPES[b.type].shape || 'spiral';
  const mix = NEB_MIX[shape];
  const rng = mulberry32(b.seed ^ 0x6e6562);
  // Candidate anchors: blue giants and young disc stars for nurseries and
  // reflection nebulae, any star for the shells of dying ones.
  const young = [], any = [];
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] !== b.id) continue;
    any.push(k);
    if (galx.kind[k] === 3 || galx.kind[k] === 2) young.push(k);
  }
  if (!any.length) return;
  for (const kind in mix) {
    const spec = NEB_KINDS[kind];
    const pool = (kind === 'emission' || kind === 'reflection') && young.length ? young : any;
    for (let i = 0; i < mix[kind]; i++) {
      const k = pool[(rng() * pool.length) | 0];
      const R = lerp(spec.R[0], spec.R[1], Math.pow(rng(), 1.6)) * LY_GM;
      nebulae.push(makeNebula(b.id, k, kind, R, rng));
    }
  }
}

function makeNebula(gal, k, kind, R, rng) {
  const g = () => (rng() + rng() + rng() - 1.5) / 1.5;
  const name = NEB_PREFIX[(rng() * NEB_PREFIX.length) | 0] + ' ' + (10 + ((rng() * 7800) | 0));
  const puffs = [];
  const n = NEB_KINDS[kind].n;
  // a random tilt for rings and shells
  const ax = new THREE.Vector3(g(), g(), g()).normalize();
  const e1 = new THREE.Vector3(0, 0, 1).cross(ax);
  if (e1.lengthSq() < 1e-6) e1.set(1, 0, 0);
  e1.normalize();
  const e2 = new THREE.Vector3().crossVectors(ax, e1);
  for (let i = 0; i < n; i++) {
    let o, size, col;
    if (kind === 'emission') {
      // lumpy: a few sub-clumps, the teal oxygen glow only round the hot middle
      const core = i < n * 0.2;
      o = new THREE.Vector3(g(), g() * 0.7, g()).multiplyScalar(R * (core ? 0.18 : 0.5));
      size = R * (core ? 0.25 + rng() * 0.2 : 0.3 + rng() * 0.4);
      col = core ? [0.35, 0.95, 0.85] : mix([1.0, 0.22, 0.38], [1.0, 0.5, 0.72], rng());
    } else if (kind === 'reflection') {
      o = new THREE.Vector3(g(), g() * 0.4, g()).multiplyScalar(R * 0.55);
      size = R * (0.35 + rng() * 0.45);
      col = mix([0.30, 0.50, 1.0], [0.55, 0.75, 1.0], rng());
    } else if (kind === 'planetary') {
      const a = (i / n) * TAU + rng() * 0.2;
      const rim = i % 3 === 0;
      const rr = R * (rim ? 0.92 : 0.66);
      o = e1.clone().multiplyScalar(Math.cos(a) * rr).addScaledVector(e2, Math.sin(a) * rr)
        .addScaledVector(ax, g() * R * 0.12);
      size = R * (rim ? 0.3 : 0.4);
      col = rim ? [1.0, 0.3, 0.35] : [0.3, 1.0, 0.85];
    } else {
      // a ragged shell: points on a sphere, thin filaments of red and green
      const d = new THREE.Vector3(g(), g(), g()).normalize();
      o = d.multiplyScalar(R * (0.85 + rng() * 0.15));
      size = R * (0.18 + rng() * 0.16);
      col = rng() < 0.55 ? [1.0, 0.28, 0.3] : [0.4, 1.0, 0.6];
    }
    puffs.push({ o, size, col, rot: ((rng() * 4) | 0) + rng() * 0.999 });
  }
  return { gal, k, kind, R, name, puffs };
}

function removeNebulae(galId) {
  for (let i = nebulae.length - 1; i >= 0; i--) if (nebulae[i].gal === galId) nebulae.splice(i, 1);
}

/** Lay every nebula's billboards out around its anchor star, camera-relative. */
function placeNebulae(S, o) {
  if (!nebx.pts) return;
  let n = 0;
  const pos = galx.pos;
  for (const nb of nebulae) {
    if (galx.own[nb.k] < 0) continue;
    const k3 = nb.k * 3;
    const cx = pos[k3] - o.x, cy = pos[k3 + 1] - o.y, cz = pos[k3 + 2] - o.z;
    for (const pf of nb.puffs) {
      if (n >= NEB_MAX) break;
      const i3 = n * 3;
      nebx.pos[i3] = cx + pf.o.x; nebx.pos[i3 + 1] = cy + pf.o.y; nebx.pos[i3 + 2] = cz + pf.o.z;
      nebx.col[i3] = pf.col[0]; nebx.col[i3 + 1] = pf.col[1]; nebx.col[i3 + 2] = pf.col[2];
      nebx.siz[n] = pf.size; nebx.rot[n] = pf.rot;
      n++;
    }
  }
  nebx.n = n;
  nebx.geo.setDrawRange(0, n);
  for (const a of ['position', 'aCol', 'aSize', 'aRot']) nebx.geo.attributes[a].needsUpdate = true;
  nebx.pts.position.copy(o);
  nebx.pts.material.uniforms.uScale.value = S;
}

/** The nebula under a click, if one is big enough on screen to aim at. */
function pickNebula(sx, sy) {
  let best = null, bestPx = 0;
  for (const nb of nebulae) {
    if (galx.own[nb.k] < 0) continue;
    const k3 = nb.k * 3;
    _lp.set(galx.pos[k3], galx.pos[k3 + 1], galx.pos[k3 + 2]);
    const dist = camera.position.distanceTo(_lp);
    const px = nb.R / worldPerPixel(Math.max(dist, 1e-9));
    if (px < 10) continue;
    _lp.project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const d = Math.hypot((_lp.x + 1) * 0.5 * VIEW.w - sx, (1 - _lp.y) * 0.5 * VIEW.h - sy);
    // the smallest one under the cursor wins, so a ring inside a big cloud can be picked
    if (d < Math.max(px * 0.7, 12) && (!best || px < bestPx)) { best = nb; bestPx = px; }
  }
  return best;
}

function focusNebula(nb) {
  galx.focus = nb.k;
  sim.follow = null;
  const spec = NEB_KINDS[nb.kind];
  const ly = nb.R * 2 / LY_GM;
  toast('Locked on to ' + nb.name + ' — ' + (/^[aeiou]/.test(spec.name) ? 'an ' : 'a ') + spec.name + ', ' +
    (ly < 10 ? ly.toFixed(1) : Math.round(ly).toLocaleString()) + ' light-years across: ' + spec.note + '.');
}

/* ---------------------------------------------------------------- planets */
/*
 * Most stars have planets, so here they do too: a star's system is made up
 * on demand from its slot number — the same star always has the same worlds —
 * and drawn only while the system is near enough to see. Inner worlds are
 * small and rocky, outer ones mostly giants; each goes round on its real
 * Kepler period, in time with the simulation.
 */
const PLANET_MAX = 480;
const PLANET_HOSTS = new Set([0, 1, 2, 4, 5]);
const _gSys = [];
const sysCache = new Map();
const ROCKY = [[0.55, 0.45, 0.38], [0.30, 0.50, 0.85], [0.75, 0.40, 0.25], [0.85, 0.90, 0.95], [0.35, 0.6, 0.35]];
const GIANT = [[0.85, 0.72, 0.55], [0.55, 0.72, 0.95], [0.90, 0.84, 0.68], [0.75, 0.6, 0.5]];

function planetsOf(k) {
  const key = galx.temp[k];
  const hit = sysCache.get(k);
  if (hit && hit.key === key) return hit;
  let sys = { key, list: [] };
  if (PLANET_HOSTS.has(galx.kind[k])) {
    const r = mulberry32((k * 2654435761) ^ ((key * 1000) | 0));
    if (r() > 0.25) {
      const ax = new THREE.Vector3(r() - 0.5, 1.2, r() - 0.5).normalize();
      const e1 = new THREE.Vector3(1, 0, 0).cross(ax).normalize();
      const e2 = new THREE.Vector3().crossVectors(ax, e1);
      sys.e1 = e1; sys.e2 = e2;
      const n = 1 + ((r() * 7) | 0);
      let a = (0.05 + r() * 0.3) * AU;
      for (let i = 0; i < n; i++) {
        a *= 1.4 + r() * 0.9;
        const gas = a > 2.5 * AU ? r() < 0.7 : r() < 0.08;
        const pal = gas ? GIANT : ROCKY;
        sys.list.push({
          a, phase: r() * TAU,
          period: 365.25 * Math.pow(a / AU, 1.5),
          r: (gas ? lerp(3.5, 11.5, r()) : lerp(0.4, 2.2, r())) * R_EARTH,
          col: pal[(r() * pal.length) | 0]
        });
      }
    }
  }
  if (sysCache.size > 4000) sysCache.clear();
  sysCache.set(k, sys);
  return sys;
}

const PLANET_VERT = `
  #include <common>
  #include <logdepthbuf_pars_vertex>
  attribute vec3 aSun;
  varying vec3 vN;
  varying vec3 vL;
  varying vec3 vC;
  void main() {
    vec4 wp = instanceMatrix * vec4(position, 1.0);
    vN = normalize(mat3(instanceMatrix) * normal);
    vL = normalize(aSun - wp.xyz);
    #ifdef USE_INSTANCING_COLOR
      vC = instanceColor;
    #else
      vC = vec3(1.0);
    #endif
    gl_Position = projectionMatrix * modelViewMatrix * wp;
    #include <logdepthbuf_vertex>
  }`;
const PLANET_FRAG = `
  #include <common>
  #include <logdepthbuf_pars_fragment>
  varying vec3 vN;
  varying vec3 vL;
  varying vec3 vC;
  void main() {
    #include <logdepthbuf_fragment>
    float lit = max(dot(normalize(vN), normalize(vL)), 0.0);
    gl_FragColor = vec4(vC * (0.16 + 0.84 * lit), 1.0);
  }`;

function placePlanets(S) {
  let pm = galx.planets;
  if (!pm) {
    const geo = new THREE.SphereGeometry(1, 24, 16);
    geo.setAttribute('aSun', new THREE.InstancedBufferAttribute(new Float32Array(PLANET_MAX * 3), 3));
    pm = galx.planets = new THREE.InstancedMesh(geo, new THREE.ShaderMaterial({
      vertexShader: PLANET_VERT, fragmentShader: PLANET_FRAG
    }), PLANET_MAX);
    pm.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(PLANET_MAX * 3), 3);
    pm.frustumCulled = false;
    scene.add(pm);
  }
  pm.position.copy(galx.origin);
  const idx = [];
  for (let i = 0; i < _gSys.length; i += 2) idx.push(i);
  if (idx.length > 60) idx.sort((a, b) => _gSys[b] - _gSys[a]).length = 60;
  const sun = pm.geometry.attributes.aSun;
  const gp = galx.gpos;
  let n = 0;
  for (const i of idx) {
    const k = _gSys[i + 1], k3 = k * 3;
    const sys = planetsOf(k);
    const sx = gp[k3], sy = gp[k3 + 1], sz = gp[k3 + 2];
    for (const pl of sys.list) {
      if (n >= PLANET_MAX) break;
      const th = pl.phase + TAU * sim.time / pl.period;
      const c = Math.cos(th) * pl.a, sn = Math.sin(th) * pl.a;
      _gt.set(sx + sys.e1.x * c + sys.e2.x * sn, sy + sys.e1.y * c + sys.e2.y * sn, sz + sys.e1.z * c + sys.e2.z * sn);
      // never smaller than a pixel or so, so a system reads as a set of dots
      const dist = Math.max(_gt.length(), 1e-9);
      _gs.setScalar(Math.max(pl.r, dist / S * 2.0));
      pm.setMatrixAt(n, _gm.compose(_gt, _gq, _gs));
      pm.instanceColor.setXYZ(n, pl.col[0], pl.col[1], pl.col[2]);
      sun.setXYZ(n, sx, sy, sz);
      n++;
    }
  }
  pm.count = n;
  pm.instanceMatrix.needsUpdate = true;
  pm.instanceColor.needsUpdate = true;
  sun.needsUpdate = true;
  placeOrbits();
}

/* Faint orbit rings round the star you are locked on to, so its system reads
   as a system even while the planets are only dots. */
const ORBIT_SEG = 96, ORBIT_MAX = 8;
function placeOrbits() {
  let ol = galx.orbits;
  if (!ol) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ORBIT_MAX * ORBIT_SEG * 2 * 3), 3));
    ol = galx.orbits = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x8fb4ff, transparent: true, opacity: 0.28, depthWrite: false, blending: THREE.AdditiveBlending }));
    ol.frustumCulled = false;
    scene.add(ol);
  }
  const k = galx.focus;
  const sys = k >= 0 && galx.own[k] >= 0 ? planetsOf(k) : null;
  if (!sys || !sys.list.length) { ol.visible = false; return; }
  const arr = ol.geometry.attributes.position.array, gp = galx.gpos, k3 = k * 3;
  let v = 0;
  for (const pl of sys.list.slice(0, ORBIT_MAX)) {
    for (let i = 0; i < ORBIT_SEG; i++) {
      for (const j of [i, i + 1]) {
        const t = j / ORBIT_SEG * TAU, c = Math.cos(t) * pl.a, sn = Math.sin(t) * pl.a;
        arr[v++] = gp[k3] + sys.e1.x * c + sys.e2.x * sn;
        arr[v++] = gp[k3 + 1] + sys.e1.y * c + sys.e2.y * sn;
        arr[v++] = gp[k3 + 2] + sys.e1.z * c + sys.e2.z * sn;
      }
    }
  }
  ol.geometry.setDrawRange(0, v / 3);
  ol.geometry.attributes.position.needsUpdate = true;
  ol.position.copy(galx.origin);
  ol.visible = true;
}

/** The galaxy star nearest a click, or -1. */
function pickGalaxyStar(sx, sy) {
  if (!galx.own || galx.live === 0) return -1;
  let best = -1, bestD = 9;
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] < 0) continue;
    const k3 = k * 3;
    _lp.set(galx.pos[k3], galx.pos[k3 + 1], galx.pos[k3 + 2]).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const d = Math.hypot((_lp.x + 1) * 0.5 * VIEW.w - sx, (1 - _lp.y) * 0.5 * VIEW.h - sy);
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
}

/** Lock the camera on to one galaxy star, so you can scroll in and visit it. */
function focusGalaxyStar(k) {
  galx.focus = k;
  sim.follow = null;
  const ty = GAL_TYPES[galx.kind[k]];
  const rs = galx.rad[k] / (R_SUN * R_EARTH);
  const size = rs < 0.05 ? Math.round(galx.rad[k] * 1e6).toLocaleString() + ' km across'
    : (rs >= 100 ? Math.round(rs).toLocaleString() : rs.toPrecision(2)) + ' R☉';
  const hot = galx.temp[k] > 0 ? ', ' + Math.round(galx.temp[k]).toLocaleString() + ' K' : '';
  const np = planetsOf(k).list.length;
  toast('Locked on to ' + (/^[aeiou]/i.test(ty.name) ? 'an ' : 'a ') + ty.name + ' — ' + size + hot +
    (ty.note ? '. ' + ty.note[0].toUpperCase() + ty.note.slice(1) : '') +
    (np ? '. It has ' + np + ' planet' + (np > 1 ? 's' : '') : '') + '. Scroll in to visit it.');
}

/* ================================================== protoplanetary discs   */
/*
 * Where planets come from. A young star is left over from a collapsing cloud
 * with far too much spin to swallow everything at once, so what it cannot take
 * settles into a flat disc around it — and the disc clumps, sticks and sweeps
 * itself up into planets. Ours did this four and a half billion years ago; the
 * order of the planets we ended up with is written into where the ice line sat.
 *
 * The mass here is real: every planet that condenses is taken out of the disc's
 * budget, so a disc that has made a Jupiter has that much less left for
 * everything further out.
 */

const discs = [];
const _YAXIS = new THREE.Vector3(0, 1, 0);

function makeDisc(host, o) {
  o = o || {};
  const rng = mulberry32(host.seed ^ 0x5eed);
  /* A pole for the disc. On its own it is tipped a little off vertical so a sky
     full of them does not look stamped out — but a disc can be handed a pole to
     use instead, and one left behind by a collapsing cloud always is: the
     cloud's own spin axis is what set the plane in the first place. */
  let axis;
  if (o.axis) {
    axis = (o.axis.isVector3 ? o.axis.clone() : new THREE.Vector3().fromArray(o.axis)).normalize();
    if (axis.lengthSq() < 0.5) axis.set(0, 1, 0);
  } else {
    const swing = rnd(0, TAU);
    axis = new THREE.Vector3(0, 1, 0)
      .applyAxisAngle(new THREE.Vector3(Math.cos(swing), 0, Math.sin(swing)), rnd(-0.3, 0.3))
      .normalize();
  }
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(0, 0, 1);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  const d = {
    id: sim.nextId++,
    host: host,
    seed: (rng() * 1e6) | 0,
    // Roughly a tenth of an AU in to forty AU out — the shape of the disc our
    // own planets were built from.
    rIn: o.rIn != null ? o.rIn : Math.max(visRadius(host) * 3, 0.35 * AU),
    rOut: o.rOut != null ? o.rOut : 42 * AU,
    // ~450 M⊕ of rock and ice: enough for a Jupiter and a family besides.
    mass: o.mass != null ? o.mass : 450,
    axis: axis, u: u, w: w,
    // Wait a full interval before the first world: a disc that condensed a
    // planet on the frame it appeared would be skipping the part that takes
    // millions of years. Nothing has formed yet — that is the whole point of it.
    age: 0, made: 0,
    next: o.next != null ? o.next
      : Math.max(settings.discYears, 0.02) * 365.25 * rnd(0.5, 1.1),
    fade: 1,
    alive: true,
    obj: null
  };
  d.m0 = d.mass;
  buildDiscVisual(d);
  discs.push(d);
  host.disc = d;
  return d;
}

/** A flared annulus of dust, hot and bright inside, cold and dark at the rim. */
function discGeometry(seed, n) {
  const key = 'disc:' + seed + ':' + n;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const gauss = () => (rng() + rng() + rng() - 1.5) * 0.7;
  const wave = fbm(hashStr('discwave' + seed), 5, 2, 3);

  const pos = [], col = [], siz = [];
  /* Deep and saturated on purpose. Additive blending climbs towards white
     wherever puffs overlap, so a palette that starts out pale is bleached to
     grey exactly where the disc is thickest — which is the interesting part.
     A real disc genuinely does run this way too: white-hot where it is falling
     onto the star, orange further out, and cold blue dust at the rim. */
  const HOT = [1.00, 0.92, 0.70], WARM = [1.00, 0.52, 0.16];
  const COOL = [0.62, 0.26, 0.42], RIM = [0.20, 0.34, 0.72];

  for (let i = 0; i < n; i++) {
    // Area-weighted between 0.16 and 1 of the outer radius.
    const r = Math.sqrt(0.026 + rng() * 0.974);
    const th = rng() * TAU;
    // Faint spiral density waves — real discs are grooved with them, and it is
    // the grooves that eventually become planets.
    const dens = 0.45 + wave((th / TAU + r * 0.8) % 1, r) * 1.1;
    if (rng() > dens) continue;
    // Discs flare: they are thin at the middle and puff out towards the rim.
    const h = (0.010 + r * 0.048) * gauss();
    pos.push(Math.cos(th) * r, h, Math.sin(th) * r);

    let c = r < 0.30 ? mix(HOT, WARM, r / 0.30)
      : r < 0.66 ? mix(WARM, COOL, (r - 0.30) / 0.36)
      : mix(COOL, RIM, (r - 0.66) / 0.34);
    // The inside is being lit by the star it is falling onto, so it is far
    // brighter than the rim as well as a different colour.
    const lit = (0.35 + 1.5 * Math.pow(1 - r, 1.7)) * (0.75 + rng() * 0.5);
    col.push(c[0] * lit, c[1] * lit, c[2] * lit);
    // Wide enough that neighbours run into each other. Small separate dots read
    // as scattered grit; only once they overlap do they become cloud.
    siz.push(0.020 + Math.pow(rng(), 2) * 0.085);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildDiscVisual(d) {
  const g = new THREE.Group();
  const pts = new THREE.Points(discGeometry(d.seed % 9973, 9000), new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0.5 }, uScale: { value: 1 }, uFocal: { value: 1 } },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  pts.frustumCulled = false;
  pts.renderOrder = 2;
  g.add(pts);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.axis);
  scene.add(g);
  d.obj = g; d.pts = pts;
}

function disposeDisc(d) {
  if (!d.obj) return;
  scene.remove(d.obj);
  d.obj.traverse(o => { if (o.material) o.material.dispose(); });
  d.obj = null; d.pts = null;
  if (d.host && d.host.disc === d) d.host.disc = null;
}

function clearDiscs() {
  for (const d of discs) { d.alive = false; disposeDisc(d); }
  discs.length = 0;
}

/** Where water freezes out. Everything past it can build with ice as well as
 *  rock, which is why the giants are all on the outside. */
const iceLineOf = (host) => 2.7 * AU * Math.sqrt(Math.max(host.lum, 1e-4));

/** Condense one planet out of the disc and hand it its share of the mass. */
function condenseFromDisc(d) {
  const host = d.host;
  if (freeSlots() < 1) return false;

  // Log-uniform in radius, so the crowded inner disc still gets its planets.
  const t = Math.random();
  const r = d.rIn * Math.pow(d.rOut / d.rIn, t);
  const ice = iceLineOf(host);
  const inside = r < ice;

  /* Inside the ice line only rock and metal can condense, and that is a tiny
     fraction of what a disc is made of — which is why the whole of Mercury,
     Venus, Earth and Mars together weigh about two Earths, while Jupiter alone
     weighs three hundred. Just past the line, ice condenses too, there is
     suddenly far more solid material to build with, and that is where the
     giants get made. */
  const bonus = (!inside && r < ice * 3.5) ? 2.4 : 1;
  const share = inside ? rnd(0.0015, 0.010) : rnd(0.10, 0.30);
  let chunk = Math.min(d.mass * share * bonus, d.mass * 0.55);
  if (chunk < 1e-4) return false;

  const type = discPlanetType(chunk, inside);
  const ang = Math.random() * TAU;
  const inc = rnd(-0.03, 0.03);
  const dir = d.u.clone().multiplyScalar(Math.cos(ang)).addScaledVector(d.w, Math.sin(ang));
  const tan = d.u.clone().multiplyScalar(-Math.sin(ang)).addScaledVector(d.w, Math.cos(ang));
  tan.applyAxisAngle(dir, inc).normalize();

  const speed = Math.sqrt(G * settings.gravity * (host.m + chunk) / r);
  const b = makeBody(type,
    host.p.clone().addScaledVector(dir, r),
    host.v.clone().addScaledVector(tan, speed),
    { mass: chunk });

  d.mass -= chunk;
  d.made++;
  // A new planet sweeps its own lane clean, so the hole in the middle widens a
  // little — but never so far that the disc stops making inner worlds at all.
  if (r < d.rIn * 1.4) d.rIn = Math.min(r * 1.25, d.rOut * 0.05);
  fx.form(b, false);
  toast(b.name + ' condensed out of ' + host.name + '’s disc');
  return true;
}

function updateDiscs(simDt) {
  for (let i = discs.length - 1; i >= 0; i--) {
    const d = discs[i];
    const host = d.host;

    // No star, no disc: it has nothing left to orbit.
    if (!host || !host.alive || host.kind !== 'body') {
      d.fade -= 0.03;
      if (d.fade <= 0) { d.alive = false; disposeDisc(d); discs.splice(i, 1); continue; }
    } else {
      d.age += simDt;
      d.next -= simDt;
      const every = Math.max(settings.discYears, 0.02) * 365.25;
      if (d.next <= 0) {
        d.next = every * rnd(0.6, 1.4);
        // Discs do not last forever — ours was gone inside about ten million
        // years, blown off by the young Sun once the planets had taken their share.
        if (d.mass > d.m0 * 0.04 && d.made < 12) condenseFromDisc(d);
        else d.fade -= 0.18;
      }
      // What is left of the dust falls onto the star as the disc thins out.
      if (d.fade < 1 && d.mass > 0) {
        const drop = Math.min(d.mass, d.mass * 0.2);
        host.m += drop; d.mass -= drop;
      }
      if (d.fade <= 0) {
        toast(host.name + '’s disc has cleared');
        d.alive = false; disposeDisc(d); discs.splice(i, 1); continue;
      }
    }

    if (!d.obj) continue;
    if (host && host.alive) d.obj.position.copy(host.p);
    d.obj.rotateOnAxis(_YAXIS, Math.sqrt(G * Math.max(host ? host.m : 1, 1e-6) /
      Math.pow(d.rOut * 0.5, 3)) * simDt);
    d.obj.scale.setScalar(d.rOut);
    const u = d.pts.material.uniforms;
    u.uScale.value = d.rOut;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Thins out as its material is used up, and fades away at the end.
    u.uOp.value = clamp(0.05 + 0.17 * (d.mass / d.m0), 0, 0.24) * clamp(d.fade, 0, 1);
    d.pts.visible = u.uOp.value > 0.004 && d.rOut / worldPerPixel(
      Math.max(camera.position.distanceTo(d.obj.position), 1e-9)) > 3;
  }
}

/* =============================================================== drop grid  */
/*
 * A measuring grid on the plane you are about to drop something onto. It exists
 * because "click here" in a 3D view is genuinely ambiguous — the grid says both
 * where the plane is and how big the gaps are, and it can snap the drop point
 * to its intersections so a system can be laid out neatly.
 */

const GRID_N = 40;               // cells across
let gridObj = null, gridCell = 1, lastGridCell = 0;

/** Round up to the nearest 1, 2 or 5 times a power of ten. */
function niceStep(v) {
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1e-12))));
  const m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}

function buildGrid() {
  const pos = [], col = [];
  const half = GRID_N / 2;
  // Fade every line out towards the rim, so the grid dissolves instead of
  // ending at a hard square.
  const fade = (a, b) => Math.pow(clamp(1 - Math.hypot(a, b) / half, 0, 1), 0.9);
  for (let i = 0; i <= GRID_N; i++) {
    const t = i - half;
    // A line is chopped into segments so its brightness can follow the fade.
    for (let j = 0; j < GRID_N; j++) {
      const a = j - half, b = a + 1;
      const axis = (i === half) ? 1.9 : 1;      // the two centre lines run brighter
      pos.push(t, 0, a, t, 0, b);
      pos.push(a, 0, t, b, 0, t);
      for (const [p, q] of [[t, a], [t, b], [a, t], [b, t]]) {
        const f = fade(p, q) * 0.34 * axis;
        col.push(0.42 * f, 0.55 * f, 0.95 * f);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  gridObj = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  gridObj.frustumCulled = false;
  gridObj.renderOrder = -3;
  gridObj.visible = false;
  scene.add(gridObj);
}

function updateGrid() {
  if (!gridObj) return;
  const on = !!input.armed && settings.grid && !document.body.classList.contains('modal-open');
  gridObj.visible = on;
  if (!on) { lastGridCell = 0; return; }
  // Roughly 84 screen pixels a cell, rounded to a readable number.
  gridCell = niceStep(84 * worldPerPixel(view.dist));
  gridObj.scale.setScalar(gridCell);
  // The hint line carries the cell size, so the grid is a ruler and not just
  // decoration. Only touched when it actually changes.
  if (gridCell !== lastGridCell) {
    lastGridCell = gridCell;
    for (const el of document.querySelectorAll('.an-cell')) el.textContent = fmtDist(gridCell);
  }
  // Slide with the view but stay locked to its own intersections, so the lines
  // sit still rather than swimming under the camera.
  gridObj.position.set(
    Math.round(view.target.x / gridCell) * gridCell,
    view.target.y,
    Math.round(view.target.z / gridCell) * gridCell
  );
}

/** Pull a drop point onto the nearest grid intersection. */
function snapToGrid(p) {
  if (!settings.gridSnap || !settings.grid || !gridObj || !gridObj.visible) return p;
  p.x = Math.round(p.x / gridCell) * gridCell;
  p.z = Math.round(p.z / gridCell) * gridCell;
  p.y = view.target.y;
  return p;
}

/** Push mesh scales to match the body's current (exaggerated) radius. */
function scaleVisual(b) {
  const r = visRadius(b);
  const p = b.parts;
  if (!p) return;
  // Every shell standing off the surface has to clear the tallest mountain, or
  // the peaks poke through the clouds and the world looks like it is wearing a
  // torn hat. `lift` is 0 for anything with no relief, so nothing else moves.
  const lift = reliefTop(b.type);
  if (p.surf) p.surf.scale.setScalar(r);
  if (p.sea) p.sea.scale.setScalar(r * seaRadius(b));
  if (p.cloud) p.cloud.scale.setScalar(r * (1.018 + lift));
  if (p.atmo) p.atmo.scale.setScalar(r * (1.09 + lift));
  if (p.puff) p.puff.scale.setScalar(r);
  // The star's two shells ride just off its photosphere at any size.
  if (p.chromo) p.chromo.scale.setScalar(r * 1.012);
  if (p.corona) p.corona.scale.setScalar(r * 1.055);
  if (p.terraSkin) p.terraSkin.scale.setScalar(r * 1.004);
  if (p.terraCloud) p.terraCloud.scale.setScalar(r * (1.024 + lift));
  if (p.terraAtmo) p.terraAtmo.scale.setScalar(r * (1.09 + lift));
  if (p.ring && b.ringSpec) p.ring.scale.setScalar(r * b.ringSpec.outer);
  if (p.disk) p.disk.scale.setScalar(r * 7);
  if (p.photon) p.photon.scale.setScalar(r * 5.6);
}

/* Held while dragging a slider, so a mid-drag transformation cannot rebuild the
   panel out from under the pointer. */
let inspectorLock = 0;

/** Rebuild a body's meshes after its type changed (ignition, collapse, …). */
function refreshVisual(b) {
  disposeVisual(b, true);
  buildVisual(b);
  if (sim.selected === b && !inspectorLock) renderInspector();
}

function disposeVisual(b, keepTrail) {
  if (b.obj) {
    scene.remove(b.obj);
    b.obj.traverse(o => {
      if (o.material && !o.material.userData.shared) {
        if (o.material.map && o.material.map.isCanvasTexture && !cacheHasTexture(o.material.map)) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
  if (b.parts && b.parts.tail) {
    scene.remove(b.parts.tail);
    b.parts.tail.geometry.dispose();
    b.parts.tail.material.dispose();
  }
  // Each crater cap is cut for this body's own surface, so it goes too.
  if (b.parts && b.parts.scars) {
    for (const sk of b.parts.scars) { sk.pit.geometry.dispose(); sk.fire.geometry.dispose(); }
  }
  if (b.ownGeo) b.ownGeo.dispose();
  // The ring texture belongs to this body alone and went with the traverse above.
  b.obj = null; b.parts = null; b.ownGeo = null; b.light = null; b.ringTex = null;
  if (!keepTrail) killTrail(b);
}

function cacheHasTexture(t) {
  // The process-wide sprite atlases are shared by every body in the scene, so
  // tearing one body down must never free them.
  if (t === TEX_GLOW || t === TEX_HALO || t === TEX_TAIL || t === TEX_PHOTON || t === TEX_PUFF) return true;
  for (const v of texCache.values()) if (v === t) return true;
  return false;
}

/* ================================================================= the sky   */

const SKY_R = 1.5e6;
let skyGroup;

function buildSky() {
  skyGroup = new THREE.Group();
  scene.add(skyGroup);

  const N = 4400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const r = mulberry32(20260729);

  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i % 5 < 2) {
      // a crowded band, so the sky has a Milky Way through it
      const th = r() * TAU;
      const el = (r() + r() + r() - 1.5) * 0.19;
      const cy = Math.cos(el);
      x = Math.cos(th) * cy; y = Math.sin(el); z = Math.sin(th) * cy;
    } else {
      const u = r() * 2 - 1, th = r() * TAU, s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = u; z = s * Math.sin(th);
    }
    pos[i * 3] = x * SKY_R; pos[i * 3 + 1] = y * SKY_R; pos[i * 3 + 2] = z * SKY_R;

    const c = kelvinToRGB(2600 + Math.pow(r(), 2.2) * 17000);
    const bright = 0.22 + Math.pow(r(), 2.6) * 0.95;
    col[i * 3] = c[0] / 255 * bright;
    col[i * 3 + 1] = c[1] / 255 * bright;
    col[i * 3 + 2] = c[2] / 255 * bright;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  // depthTest stays ON: the sky sits in the transparent pass, which draws after
  // opaque bodies, so without it the stars would paint over every planet.
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
  }));
  stars.frustumCulled = false;
  stars.renderOrder = -10;
  skyGroup.add(stars);

  // A few faint nebulae for depth.
  const neb = [[0x6a3ba8, 0.10], [0x2f6ea8, 0.09], [0xa8407a, 0.08], [0x2f8f8a, 0.07], [0x8a4a2f, 0.06]];
  for (let i = 0; i < neb.length; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_HALO, color: new THREE.Color(neb[i][0]), opacity: neb[i][1],
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: true
    }));
    const u = r() * 2 - 1, th = r() * TAU, sr = Math.sqrt(1 - u * u);
    s.position.set(sr * Math.cos(th), u * 0.5, sr * Math.sin(th)).multiplyScalar(SKY_R * 0.92);
    s.scale.setScalar(SKY_R * rnd(0.5, 1.1));
    s.renderOrder = -11;
    skyGroup.add(s);
  }
}

/* ============================================================ star lighting */
/* A fixed pool of lights keeps the shader's light count constant, which avoids
   a program recompile (and a visible hitch) every time a star is added.       */

const LIGHT_POOL = 3;
const starLights = [];

function initLights() {
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = new THREE.PointLight(0xffffff, 0, 0, 1);
    l.position.set(0, 0, 0);
    scene.add(l);
    starLights.push(l);
  }
}

function updateLights() {
  const stars = sim.starCache;
  const ranked = stars.slice().sort((a, b) => b.lum - a.lum);
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = starLights[i], s = ranked[i];
    if (!s) { l.intensity = 0; continue; }
    l.position.copy(s.p);
    if (s.lightColor) l.color.copy(s.lightColor);
    // Distance falloff is deliberately off: with real inverse-square light,
    // anything past a few AU would be pitch black and unusable.
    l.intensity = clamp(1.15 + Math.log10(Math.max(s.lum, 1e-4)) * 0.17, 0.4, 2.2);
  }
}

/* ================================================================== effects */

/* ========================================================== debris particles */
/*
 * These are real physical objects, not decoration. Each particle carries a mass
 * in M⊕ and a velocity in Gm/day, and is integrated by the same leapfrog step as
 * the planets. So debris genuinely orbits, settles into rings, rains back onto
 * the world that threw it, and spirals into black holes — and when a body
 * swallows a particle it actually gains that mass.
 *
 * The one simplification: particles do not attract EACH OTHER. They are test
 * particles, feeling gravity only from the heaviest bodies. That turns the cost
 * from O(P²) into O(P × M), which is what makes thousands of them affordable.
 */

const P_MAX = 2400;
const P_SOURCES = 6;          // only the heaviest bodies pull on debris
const P_MAX_STEPS = 20;       // substep ceiling per frame, for the cost bound
const P_CULL = 1.4e5;         // Gm — debris past this has left the system

const parts = {
  pos: null, vel: null, m: null, size: null, bsize: null, hot: null, crate: null,
  col: null, warm: null, cool: null, on: null, src: null,
  free: [], live: 0, geo: null, pts: null, dirty: false
};

/* Impact ejecta cools in a day or two. Supernova ejecta is radioactive and stays
   lit for months, so how fast a grain fades is stored per particle. */
const COOL_IMPACT = 1 / 1.6;

const flashes = [];

/* A per-particle size attribute: one uniform dot size reads as a flat cloud,
   whereas mixing fine grit with fat glowing chunks reads as debris. */
const FX_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uDpr;
  varying vec3 vCol;
  void main() {
    vCol = aCol;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uDpr;
  }`;

const FX_FRAG = `
  uniform sampler2D uMap;
  varying vec3 vCol;
  void main() {
    // Additive blending multiplies by alpha, so the soft falloff comes from the
    // texture while vCol carries the glow as the fragment cools.
    gl_FragColor = vec4(vCol, texture2D(uMap, gl_PointCoord).a);
  }`;

function initParticles() {
  parts.pos = new Float32Array(P_MAX * 3);
  parts.vel = new Float32Array(P_MAX * 3);      // Gm per day — real physics
  parts.col = new Float32Array(P_MAX * 3);
  parts.warm = new Float32Array(P_MAX * 3);     // freshly ejected, glowing
  parts.cool = new Float32Array(P_MAX * 3);     // cold rock
  parts.m = new Float32Array(P_MAX);
  parts.size = new Float32Array(P_MAX);
  parts.bsize = new Float32Array(P_MAX);
  parts.hot = new Float32Array(P_MAX);
  parts.crate = new Float32Array(P_MAX);
  parts.on = new Uint8Array(P_MAX);
  // Which supernova remnant a grain belongs to, or -1 for ordinary impact
  // debris. That is what lets a cloud know how much mass it still has, and lets
  // it hand exactly that mass over when it collapses into a star.
  parts.src = new Int16Array(P_MAX);
  parts.free.length = 0;
  for (let i = P_MAX - 1; i >= 0; i--) parts.free.push(i);
  parts.live = 0;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(parts.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(parts.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(parts.size, 1));
  parts.geo = geo;
  parts.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_GLOW }, uDpr: { value: VIEW.dpr } },
    vertexShader: FX_VERT, fragmentShader: FX_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  parts.pts.frustumCulled = false;
  parts.pts.renderOrder = 5;
  scene.add(parts.pts);

  for (let i = 0; i < 14; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0
    }));
    s.visible = false;
    s.renderOrder = 7;
    scene.add(s);
    flashes.push({ sprite: s, life: 0, max: 1, size: 1 });
  }
  initForms();
}

/* ====================================================== formation animation */
/*
 * What it looks like when something is born.
 *
 * A world does not appear; it falls together. So a new planet or star arrives
 * inside a swirling shell of dust that spirals inward, spinning faster and
 * faster as it shrinks — because that is what conservation of angular momentum
 * makes it do, and it is the same reason a figure skater speeds up when they
 * pull their arms in. It closes on the body, lights up, and flashes out.
 */

const FORM_POOL = 4;
const forms = [];

/** A unit-radius swirl of infalling dust: thick, ragged and lopsided. */
function formGeometry(seed) {
  const key = 'form:' + seed;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const gauss = () => (rng() + rng() + rng() - 1.5) * 0.7;
  const pos = [], col = [], siz = [];
  const HOT = [1.0, 0.95, 0.78], MID = [1.0, 0.58, 0.22], COLD = [0.42, 0.34, 0.72];

  for (let i = 0; i < 1600; i++) {
    // Weighted outward, so the cloud reads as a shell closing in rather than a
    // solid ball that merely gets smaller.
    const r = 0.30 + Math.pow(rng(), 0.6) * 0.70;
    const th = rng() * TAU;
    // Trailing streamers: the further out a mote is, the further behind it lags.
    const lag = r * 2.6;
    const x = Math.cos(th + lag) * r, z = Math.sin(th + lag) * r;
    const y = gauss() * (0.05 + r * 0.30);
    pos.push(x, y, z);
    const c = r < 0.55 ? mix(HOT, MID, (r - 0.30) / 0.25) : mix(MID, COLD, (r - 0.55) / 0.45);
    const j = 0.7 + rng() * 0.6;
    col.push(c[0] * j, c[1] * j, c[2] * j);
    // Fine grains, deliberately. Big soft puffs read as fog rather than as dust
    // being pulled in, and up close they blur into one wash.
    siz.push(0.012 + Math.pow(rng(), 2.2) * 0.055);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function initForms() {
  for (let i = 0; i < FORM_POOL; i++) {
    const grp = new THREE.Group();
    const swirl = new THREE.Points(formGeometry(i), new THREE.ShaderMaterial({
      uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0 }, uScale: { value: 1 }, uFocal: { value: 1 } },
      vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    swirl.frustumCulled = false;
    swirl.renderOrder = 6;
    grp.add(swirl);

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true,
      depthWrite: false, depthTest: false, opacity: 0
    }));
    core.renderOrder = 8;
    grp.add(core);

    grp.visible = false;
    scene.add(grp);
    forms.push({ grp: grp, swirl: swirl, core: core, life: 0, max: 1, size: 1, body: null, spin: 0 });
  }
}

function updateForms(realDt) {
  for (let i = 0; i < forms.length; i++) {
    const f = forms[i];
    if (f.life <= 0) continue;
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);          // 1 at the start, 0 at the end

    // Ride along with whatever is being born — a new planet is already moving.
    if (f.body && f.body.alive) f.grp.position.copy(f.body.p);

    if (f.life <= 0) {
      f.grp.visible = false;
      f.body = null;
      fx.flash(f.grp.position, f.size * 2.6, f.flashCol, 1);
      continue;
    }

    // Free-fall inward: slow at first, then a rush at the end.
    const R = f.size * (0.10 + 1.25 * Math.pow(t, 1.7));
    f.swirl.scale.setScalar(R);
    // Angular momentum is conserved, so as it draws in it whirls up.
    f.spin += (0.7 + 7 * (1 - t)) * realDt;
    f.swirl.rotation.y = f.spin;

    const u = f.swirl.material.uniforms;
    u.uScale.value = R;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Fades up quickly, then thins out as the last of it lands.
    const fadeIn = clamp((1 - t) / 0.10, 0, 1);
    const fadeOut = clamp(t / 0.22, 0, 1);
    u.uOp.value = 0.55 * fadeIn * fadeOut;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(f.grp.position), 1e-9));
    f.core.scale.setScalar(Math.max(f.size * (0.10 + 0.55 * Math.pow(1 - t, 2)), 8 * wpp));
    f.core.material.opacity = Math.pow(1 - t, 2.4);
  }
}

/**
 * Throw a cloud of real debris out of a point.
 *
 * `totalMass` is genuinely removed from the parent body and handed to the
 * particles, so the caller must subtract whatever this returns. Speeds are
 * spread around the parent's escape velocity, which is what makes the result
 * interesting: the slow half rains back down, the middle settles into a ring,
 * and the fastest escapes altogether.
 *
 * Returns the mass actually used — less than requested if the pool is full.
 */
function ejecta(center, baseVel, count, totalMass, vEsc, hotCol, coolCol, radius, opts) {
  const o = opts || {};
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const sMin = o.sizeMin != null ? o.sizeMin : 1.5;
  const sMax = o.sizeMax != null ? o.sizeMax : 6.5;
  const push = o.speed != null ? o.speed : 1;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    // uniform direction on the sphere
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sr * Math.cos(th), dy = u, dz = sr * Math.sin(th);

    // Power law, so most fragments are slow and a few really fly.
    const frac = Math.pow(Math.random(), 1.9);
    const sp = vEsc * push * (0.55 + frac * 1.9);

    // Start clear of the surface. Spawned inside the collision radius, a grain
    // is absorbed on the very next step and the whole burst vanishes at once.
    const off = radius * rnd(1.15, 2.3);
    parts.pos[k3] = center.x + dx * off;
    parts.pos[k3 + 1] = center.y + dy * off;
    parts.pos[k3 + 2] = center.z + dz * off;

    parts.vel[k3] = baseVel.x + dx * sp;
    parts.vel[k3 + 1] = baseVel.y + dy * sp;
    parts.vel[k3 + 2] = baseVel.z + dz * sp;

    // Fast fragments are the fine grit; slow ones are the big glowing chunks.
    const bs = lerp(sMax, sMin, frac) * rnd(0.75, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], frac * rnd(0, 0.6));
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/* The colours a protoplanetary disc is painted in, as 0–255 ramp stops: white
   hot where it is falling inward, orange, then dusty rose and cold blue at the
   rim. Impact vapour is the same stuff at the same temperatures, so it is
   coloured off the same ramp — which is not a coincidence. Every disc IS the
   vapour and dust of things that hit each other. */
const DISC_RAMP = [
  [0.00, [255, 240, 196]], [0.22, [255, 176, 80]], [0.45, [255, 118, 34]],
  [0.72, [150, 62, 104]], [1.00, [46, 82, 184]]
];

/**
 * Throw out a cloud of GAS AND VAPOUR rather than rock.
 *
 * A real impact between two worlds does not just make gravel. Most of what
 * comes off is rock flash-boiled into vapour — the energy is far past what it
 * takes to melt, let alone vaporise — and that vapour is what settles into a
 * disc and later condenses back into moons. So collisions here release more
 * mass as gas than they do as solid fragments, and the gas is drawn as big,
 * soft, slow-cooling puffs in the disc's own colours instead of sharp grit.
 */
function gasEjecta(center, baseVel, count, totalMass, vEsc, radius, opts) {
  const o = opts || {};
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const push = o.speed != null ? o.speed : 1.15;
  const sMin = o.sizeMin != null ? o.sizeMin : 6;
  const sMax = o.sizeMax != null ? o.sizeMax : 26;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sr * Math.cos(th), dy = u * (o.flat != null ? o.flat : 1), dz = sr * Math.sin(th);

    // Gas leaves faster and far more evenly than rubble does — it is pushed by
    // its own pressure, not thrown.
    const frac = Math.pow(Math.random(), 1.15);
    const sp = vEsc * push * (0.4 + frac * 1.5);

    const off = radius * rnd(1.05, 2.6);
    parts.pos[k3] = center.x + dx * off;
    parts.pos[k3 + 1] = center.y + dy * off;
    parts.pos[k3 + 2] = center.z + dz * off;
    parts.vel[k3] = baseVel.x + dx * sp;
    parts.vel[k3 + 1] = baseVel.y + dy * sp;
    parts.vel[k3 + 2] = baseVel.z + dz * sp;

    // Fat and soft. A vapour plume has no edges, so the puffs have to be wide
    // enough to run into one another and read as one cloud.
    const bs = lerp(sMax, sMin, Math.random()) * rnd(0.7, 1.3);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    // Vapour stays lit far longer than a cooling pebble does.
    parts.crate[k] = COOL_IMPACT * 0.22;
    parts.src[k] = -1;

    // The fastest gas is the hottest and sits at the white end of the ramp.
    const w = ramp(DISC_RAMP, clamp(1 - frac + rnd(-0.12, 0.12), 0, 1));
    const c = ramp(DISC_RAMP, clamp(0.86 + rnd(0, 0.14), 0, 1));
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = c[0] / 510; parts.cool[k3 + 1] = c[1] / 510; parts.cool[k3 + 2] = c[2] / 510;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Release fine debris into a ring around `P`, the way tides actually shear a
 * moon apart. Each grain is placed on the moon's orbit and given the local
 * circular velocity, so it settles into a genuine ring rather than a puff — and
 * because grains at slightly different radii have different periods, the arc
 * shears itself into a complete ring over the following orbits.
 */
function ringEjecta(center, srcVel, P, count, totalMass, arc, hotCol, coolCol) {
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;

  const rel = center.clone().sub(P.p);
  const d0 = rel.length();
  if (d0 < 1e-9) return 0;
  const radial = rel.clone().divideScalar(d0);

  // tangential direction from the moon's own motion about the primary
  const vrel = srcVel.clone().sub(P.v);
  const tang = vrel.clone().addScaledVector(radial, -vrel.dot(radial));
  if (tang.lengthSq() < 1e-18) tang.crossVectors(new THREE.Vector3(0, 1, 0), radial);
  tang.normalize();
  const normal = new THREE.Vector3().crossVectors(radial, tang).normalize();

  const mu = G * settings.gravity * P.m;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    const th = (Math.random() - 0.5) * 2 * arc;
    const r = d0 * (1 + rnd(-0.06, 0.06));
    const ct = Math.cos(th), st = Math.sin(th);

    const outX = radial.x * ct + tang.x * st;
    const outY = radial.y * ct + tang.y * st;
    const outZ = radial.z * ct + tang.z * st;
    const dirX = -radial.x * st + tang.x * ct;
    const dirY = -radial.y * st + tang.y * ct;
    const dirZ = -radial.z * st + tang.z * ct;

    const tilt = rnd(-0.012, 0.012) * d0;
    parts.pos[k3] = P.p.x + outX * r + normal.x * tilt;
    parts.pos[k3 + 1] = P.p.y + outY * r + normal.y * tilt;
    parts.pos[k3 + 2] = P.p.z + outZ * r + normal.z * tilt;

    const vc = Math.sqrt(mu / r) * rnd(0.985, 1.015);
    parts.vel[k3] = P.v.x + dirX * vc;
    parts.vel[k3 + 1] = P.v.y + dirY * vc;
    parts.vel[k3 + 2] = P.v.z + dirZ * vc;

    const bs = rnd(1.4, 5.5);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 0.5;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], Math.random() * 0.4);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Blow a shell of real matter outward — a supernova envelope, or the far gentler
 * puff of a planetary nebula.
 *
 * Speeds are drawn from a broken power law (most of the mass slow, a thin skin
 * very fast) and then multiplied by one common factor chosen so the shell's
 * total kinetic energy comes out at exactly `eKin`. That single normalisation
 * is what ties the picture to the physics: hand it 1e51 erg and ten solar
 * masses and a few thousand km/s falls out on its own, with no fudge factor
 * anywhere. Pass `vMean` instead to aim for a mean speed directly.
 *
 * Every gram of `totalMass` is launched no matter how few slots are left — the
 * fragments just get chunkier — so mass is conserved exactly. Returns null only
 * when the pool is completely full, which is the caller's cue to keep the mass.
 */
function blastShell(center, baseVel, want, totalMass, opts) {
  const o = opts || {};
  const n = Math.min(want, parts.free.length);
  if (n <= 0 || totalMass <= 0) return null;
  const each = totalMass / n;

  const hot = o.hot || [235, 245, 255];
  const cool = o.cool || [255, 108, 62];
  const sMin = o.sizeMin != null ? o.sizeMin : 1.6;
  const sMax = o.sizeMax != null ? o.sizeMax : 8.5;
  const r0 = o.r0 != null ? o.r0 : 0;
  const crate = 1 / Math.max(o.coolDays || 45, 1e-3);
  const src = o.src != null ? o.src : -1;

  // ---- shape the velocity spectrum first, then scale it to the energy budget
  const idx = new Int32Array(n);
  const dir = new Float32Array(n * 3);
  const x = new Float32Array(n);
  let sumX = 0, sumX2 = 0;
  for (let i = 0; i < n; i++) {
    idx[i] = parts.free.pop();
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    dir[i * 3] = sr * Math.cos(th); dir[i * 3 + 1] = u; dir[i * 3 + 2] = sr * Math.sin(th);
    const s = 0.35 + Math.pow(Math.random(), 2.2) * 2.2;
    x[i] = s; sumX += s; sumX2 += s * s;
  }
  // ½·each·Σ(αx)² = eKin  →  α = √(2·eKin / (each·Σx²))
  const alpha = o.vMean != null
    ? o.vMean * n / Math.max(sumX, 1e-12)
    : Math.sqrt(2 * Math.max(o.eKin || 0, 0) / Math.max(each * sumX2, 1e-30));

  let vMax = 0;
  for (let i = 0; i < n; i++) {
    const k = idx[i], k3 = k * 3, d3 = i * 3;
    const sp = alpha * x[i];
    if (sp > vMax) vMax = sp;

    // A thin shell, not a filled ball: the star's envelope really is a skin.
    const off = r0 * rnd(1, 1.35);
    parts.pos[k3] = center.x + dir[d3] * off;
    parts.pos[k3 + 1] = center.y + dir[d3 + 1] * off;
    parts.pos[k3 + 2] = center.z + dir[d3 + 2] * off;

    parts.vel[k3] = baseVel.x + dir[d3] * sp;
    parts.vel[k3 + 1] = baseVel.y + dir[d3 + 1] * sp;
    parts.vel[k3 + 2] = baseVel.z + dir[d3 + 2] * sp;

    const bs = lerp(sMax, sMin, clamp((x[i] - 0.35) / 2.2, 0, 1)) * rnd(0.8, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = crate;
    parts.src[k] = src;

    const w = mix(hot, [255, 255, 255], Math.random() * 0.35);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = cool[0] / 255; parts.cool[k3 + 1] = cool[1] / 255; parts.cool[k3 + 2] = cool[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }

  // Random directions do not cancel, so nudge the whole shell onto the momentum
  // it is supposed to carry. The nudge is ~1/√n of a typical speed, which costs
  // well under a percent of the energy just set above.
  const wantP = o.netP || baseVel.clone().multiplyScalar(totalMass);
  let px = 0, py = 0, pz = 0;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    px += parts.vel[k3] * each; py += parts.vel[k3 + 1] * each; pz += parts.vel[k3 + 2] * each;
  }
  const cx = (wantP.x - px) / totalMass, cy = (wantP.y - py) / totalMass, cz = (wantP.z - pz) / totalMass;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    parts.vel[k3] += cx; parts.vel[k3 + 1] += cy; parts.vel[k3 + 2] += cz;
  }

  parts.dirty = true;
  return { n: n, each: each, vMean: alpha * sumX / n, vMax: vMax };
}

function killParticle(k) {
  const k3 = k * 3;
  parts.on[k] = 0;
  parts.src[k] = -1;
  parts.m[k] = 0;
  parts.size[k] = 0;
  parts.col[k3] = parts.col[k3 + 1] = parts.col[k3 + 2] = 0;
  parts.free.push(k);
  parts.live--;
  parts.dirty = true;
}

function clearParticles() {
  for (let k = 0; k < P_MAX; k++) if (parts.on[k]) killParticle(k);
}

/* The heaviest bodies are the only meaningful gravity sources for debris;
   refreshed once per frame rather than per substep. */
let pSources = [];
const grewBodies = new Set();

/* Running total of the force the debris exerts back on each source, so the
   sources can be given their share of it once per step. */
const pReact = new Float64Array(P_SOURCES * 3);

function refreshSources() {
  pSources = sim.bodies.length <= P_SOURCES
    ? sim.bodies.slice()
    : sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, P_SOURCES);
}

/**
 * Integrate the debris with the same timestep as the planets. Symplectic Euler
 * (kick then drift) — one force evaluation per step, and stable for orbits.
 */
function stepParticles(dt) {
  if (parts.live === 0) return;
  const src = pSources, ns = src.length;
  const gm = G * settings.gravity;
  const pos = parts.pos, vel = parts.vel;
  pReact.fill(0);

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    const px = pos[k3], py = pos[k3 + 1], pz = pos[k3 + 2];
    const pm = parts.m[k];
    let ax = 0, ay = 0, az = 0, hit = null;

    for (let s = 0; s < ns; s++) {
      const b = src[s];
      if (!b.alive) continue;
      const dx = b.p.x - px, dy = b.p.y - py, dz = b.p.z - pz;
      const d2 = dx * dx + dy * dy + dz * dz;
      const rv = visRadius(b);
      if (d2 < rv * rv) { hit = b; break; }          // landed / swallowed
      const soft = 0.35 * b.r;
      const dd = d2 + soft * soft;
      const f = gm * b.m / (dd * Math.sqrt(dd)) * (b.kind === 'wh' ? -1 : 1);
      const fx = dx * f, fy = dy * f, fz = dz * f;
      ax += fx; ay += fy; az += fz;
      // Newton's third law. A grain of impact dust pulling back on a planet is
      // far too faint to matter, but supernova ejecta runs to thousands of Earth
      // masses per grain — letting that accelerate for free would quietly shove
      // the whole system sideways.
      const s3 = s * 3;
      pReact[s3] -= fx * pm; pReact[s3 + 1] -= fy * pm; pReact[s3 + 2] -= fz * pm;
    }

    if (hit) {
      // A perfectly inelastic catch: the grain hands over its momentum as well
      // as its mass. It barely registers for impact dust, but supernova ejecta
      // arrives at thousands of km/s and genuinely shoves what it lands on.
      const pm = parts.m[k];
      const mNew = hit.m + pm;
      if (mNew > 0) {
        hit.v.x = (hit.v.x * hit.m + vel[k3] * pm) / mNew;
        hit.v.y = (hit.v.y * hit.m + vel[k3 + 1] * pm) / mNew;
        hit.v.z = (hit.v.z * hit.m + vel[k3 + 2] * pm) / mNew;
      }
      hit.m = mNew;
      grewBodies.add(hit);
      killParticle(k);
      continue;
    }

    vel[k3] += ax * dt; vel[k3 + 1] += ay * dt; vel[k3 + 2] += az * dt;
    pos[k3] += vel[k3] * dt; pos[k3 + 1] += vel[k3 + 1] * dt; pos[k3 + 2] += vel[k3 + 2] * dt;
  }

  // Hand the sources the recoil the debris just earned them.
  for (let s = 0; s < ns; s++) {
    const b = src[s], s3 = s * 3;
    if (!b.alive || b.m <= 0) continue;
    const inv = dt / b.m;
    b.v.x += pReact[s3] * inv;
    b.v.y += pReact[s3 + 1] * inv;
    b.v.z += pReact[s3 + 2] * inv;
  }
  parts.dirty = true;
}

/** Cool the glow, refresh colours, and drop anything that has left the system. */
function updateParticles(simDt) {
  if (parts.live === 0 && !parts.dirty) return;
  const anchor = pSources.length ? pSources[0].p : null;

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    if (anchor) {
      const dx = parts.pos[k3] - anchor.x, dy = parts.pos[k3 + 1] - anchor.y, dz = parts.pos[k3 + 2] - anchor.z;
      if (dx * dx + dy * dy + dz * dz > P_CULL * P_CULL) { killParticle(k); continue; }
    }
    const h = parts.hot[k] > 0 ? Math.max(0, parts.hot[k] - simDt * parts.crate[k]) : 0;
    parts.hot[k] = h;
    const g = Math.pow(h, 0.55);
    parts.col[k3] = lerp(parts.cool[k3], parts.warm[k3], g);
    parts.col[k3 + 1] = lerp(parts.cool[k3 + 1], parts.warm[k3 + 1], g);
    parts.col[k3 + 2] = lerp(parts.cool[k3 + 2], parts.warm[k3 + 2], g);
    parts.size[k] = parts.bsize[k] * (0.7 + 0.3 * g);
  }

  parts.geo.attributes.position.needsUpdate = true;
  parts.geo.attributes.aCol.needsUpdate = true;
  parts.geo.attributes.aSize.needsUpdate = true;
  parts.pts.material.uniforms.uDpr.value = VIEW.dpr;
  parts.dirty = parts.live > 0;

  // Bodies that ate debris need their radius (and mesh) brought up to date.
  if (grewBodies.size) {
    for (const b of grewBodies) {
      if (!b.alive) continue;
      if (b.kind === 'bh') b.r = schwarzschild(b.m);
      else b.r = natRadius(b);
      // Enough swallowed debris can push a body over a threshold too.
      const ev = checkEvolution(b);
      if (ev) toast(b.name + EVOLVE_NOTE[ev]);
      // Grown enough to have pulled itself rounder: it needs a new mesh.
      else if (lumpDrift(b)) { updateLuminosity(b); refreshVisual(b); }
      else { updateLuminosity(b); scaleVisual(b); }
    }
    grewBodies.clear();
  }
}

const fx = {
  flash(pos, size, color, strength) {
    let f = null;
    for (let i = 0; i < flashes.length; i++) if (flashes[i].life <= 0) { f = flashes[i]; break; }
    if (!f) f = flashes[(Math.random() * flashes.length) | 0];
    f.life = f.max = 0.55;
    f.size = size;
    f.strength = strength;
    f.sprite.position.copy(pos);
    f.sprite.material.color.setRGB(color[0] / 255, color[1] / 255, color[2] / 255);
    f.sprite.visible = true;
  },

  /**
   * Play the birth animation on `b`. `star` picks the hotter, whiter palette
   * and a longer wind-up, because a star takes rather more falling together
   * than a planet does.
   */
  form(b, star) {
    let f = null;
    for (let i = 0; i < forms.length; i++) if (forms[i].life <= 0) { f = forms[i]; break; }
    // All four busy: steal the one closest to finishing rather than skipping it.
    if (!f) { f = forms[0]; for (const g of forms) if (g.life < f.life) f = g; }
    f.life = f.max = star ? 2.2 : 1.5;
    f.size = Math.max(visRadius(b) * (star ? 14 : 11), 34 * worldPerPixel(
      Math.max(camera.position.distanceTo(b.p), 1e-9)));
    f.body = b;
    f.spin = Math.random() * TAU;
    f.flashCol = star ? [255, 244, 224] : [255, 214, 150];
    f.core.material.color.setRGB(1, star ? 0.95 : 0.82, star ? 0.86 : 0.55);
    f.grp.position.copy(b.p);
    f.grp.visible = true;
  }
};

function updateFx(realDt, simDt) {
  updateForms(realDt);
  for (let i = 0; i < flashes.length; i++) {
    const f = flashes[i];
    if (f.life <= 0) { if (f.sprite.visible) f.sprite.visible = false; continue; }
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);
    f.sprite.material.opacity = t * t * (f.strength || 1);
    f.sprite.scale.setScalar(f.size * (1.9 - t));
    if (f.life <= 0) f.sprite.visible = false;
  }
}

/* =================================================================== trails */

const TRAIL_CAP = 320;
const MAX_TRAILS = 28;

function buildTrail(b) { b.trail = null; }

function makeTrail(b) {
  const arr = new Float32Array(TRAIL_CAP * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  line.frustumCulled = false;
  line.renderOrder = 1;
  scene.add(line);
  /* Stored relative to where the trail began, not to the world origin: a world
     orbiting the Sun 26,000 light-years out in the Milky Way sits 2.5×10^11 Gm
     from the origin, where a 32-bit float cannot place a point to better than
     about sixteen thousand Gm — a hundred times wider than Earth's orbit. */
  const o = b.p.clone();
  line.position.copy(o);
  b.trail = { arr, geo, line, n: 0, o };
}

function killTrail(b) {
  if (!b.trail) return;
  scene.remove(b.trail.line);
  b.trail.geo.dispose();
  b.trail.line.material.dispose();
  b.trail = null;
}

function updateTrails() {
  if (!settings.trails) {
    for (const b of sim.bodies) if (b.trail) killTrail(b);
    return;
  }
  // Only the most significant bodies get a trail, so the line count stays sane.
  const ranked = sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, MAX_TRAILS);
  const keep = new Set(ranked);
  for (const b of sim.bodies) {
    if (!keep.has(b) && b.trail) killTrail(b);
    if (keep.has(b) && !b.trail) makeTrail(b);
  }
  /* A point every 1/TRAIL_PER_ORBIT of the way round whatever the body is
     orbiting: so a trail is the same shape — the same smooth curve, the same
     couple of orbits long — at one day a second or a billion years. */
  for (const b of ranked) {
    const t = b.trail;
    if (!t) continue;
    const host = b.rotHost || b.domHost;
    b.trailSeg = host ? TAU * b.p.distanceTo(host.p) / TRAIL_PER_ORBIT : visRadius(b) * 6;
    if (t.n === 0) trailPush(b, b.p.x, b.p.y, b.p.z, true);
    trailCommit(b);
  }
}

const TRAIL_PER_ORBIT = 160;
/** Lay a point down if the body has moved far enough since the last one. */
function trailSample(b) {
  const t = b.trail;
  if (!b.trailSeg) return;
  const lx = t.lx, ly = t.ly, lz = t.lz;
  if (lx === undefined) { trailPush(b, b.p.x, b.p.y, b.p.z); return; }
  const dx = b.p.x - lx, dy = b.p.y - ly, dz = b.p.z - lz;
  if (dx * dx + dy * dy + dz * dz >= b.trailSeg * b.trailSeg) trailPush(b, b.p.x, b.p.y, b.p.z);
}
/** Queue a point; queued points join the line once a frame, in one shift. */
function trailPush(b, x, y, z, now) {
  const t = b.trail;
  if (!t.q) t.q = [];
  if (t.q.length >= TRAIL_CAP * 3) t.q.splice(0, 3);
  t.q.push(x - t.o.x, y - t.o.y, z - t.o.z);
  t.lx = x; t.ly = y; t.lz = z;
  if (now) trailCommit(b);
}
function trailCommit(b) {
  const t = b.trail, q = t.q;
  if (!q || !q.length) return;
  const k = q.length / 3;
  const keep = Math.min(t.n, TRAIL_CAP - k);
  if (keep < t.n) t.arr.copyWithin(0, (t.n - keep) * 3, t.n * 3);
  t.arr.set(q, keep * 3);
  t.n = keep + k;
  q.length = 0;
  t.geo.setDrawRange(0, t.n);
  t.geo.attributes.position.needsUpdate = true;
}

function clearTrails() {
  for (const b of sim.bodies) {
    if (!b.trail) continue;
    b.trail.n = 0; b.trail.geo.setDrawRange(0, 0);
    b.trail.o.copy(b.p); b.trail.line.position.copy(b.p);
    b.trail.q = null; b.trail.lx = undefined;
  }
}

/* ========================================================== lensing pass    */

let rt = null, postScene = null, postCam = null, postMat = null, postOK = false;

const LENS_FRAG = `
  uniform sampler2D tDiffuse;
  uniform vec3 uHoles[4];
  uniform int uCount;
  uniform float uAspect;
  varying vec2 vUv;
  void main() {
    vec2 uv = vUv;
    float dark = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= uCount) break;
      vec3 h = uHoles[i];
      if (h.z <= 0.0) continue;
      vec2 d = (uv - h.xy) * vec2(uAspect, 1.0);
      float r = length(d);
      if (r < 1e-5) continue;
      float rs = h.z;
      // light bends more the closer it passes; taper it off far from the hole
      float defl = (rs * rs) / max(r, rs * 0.4) * 1.5;
      defl *= exp(-r / (rs * 8.0));
      uv -= (d / r) / vec2(uAspect, 1.0) * defl;
      dark = max(dark, smoothstep(rs * 1.04, rs * 0.92, r));
    }
    vec4 c = texture2D(tDiffuse, clamp(uv, vec2(0.001), vec2(0.999)));
    gl_FragColor = vec4(c.rgb * (1.0 - dark), 1.0);
  }`;

const LENS_VERT = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function initPost() {
  try {
    rt = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, stencilBuffer: false, depthBuffer: true
    });
    postMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rt.texture },
        uHoles: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
        uCount: { value: 0 },
        uAspect: { value: 1 }
      },
      vertexShader: LENS_VERT, fragmentShader: LENS_FRAG, depthTest: false, depthWrite: false
    });
    postScene = new THREE.Scene();
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
    postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postOK = true;
  } catch (e) {
    postOK = false;
  }
}

const _proj = new THREE.Vector3();

function gatherHoles() {
  let n = 0;
  const out = postMat ? postMat.uniforms.uHoles.value : null;
  if (!out) return 0;
  for (let i = 0; i < sim.bodies.length && n < 4; i++) {
    const b = sim.bodies[i];
    // A naked singularity has no horizon, so no shadow to paint.
    if (b.kind !== 'bh' || TYPES[b.type].naked) continue;
    _proj.copy(b.p).project(camera);
    if (_proj.z < -1 || _proj.z > 1) continue;
    const dist = camera.position.distanceTo(b.p);
    // shadow radius expressed in the same units as the vertical 0..1 screen axis
    const rs = visRadius(b) / (dist * Math.tan(FOV * Math.PI / 360)) * 0.5;
    if (rs < 0.0015 || rs > 3) continue;
    const sx = (_proj.x + 1) * 0.5, sy = (_proj.y + 1) * 0.5;
    if (sx < -1 || sx > 2 || sy < -1 || sy > 2) continue;
    out[n].set(sx, sy, rs);
    n++;
  }
  return n;
}

function renderFrame() {
  let holes = 0;
  if (settings.lensing && postOK) holes = gatherHoles();
  if (holes > 0) {
    postMat.uniforms.uCount.value = holes;
    postMat.uniforms.uAspect.value = VIEW.w / VIEW.h;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

/* =================================================================== camera */

const view = { target: new THREE.Vector3(), dist: 900, yaw: 0.75, pitch: 0.46, over: 0 };
const MIN_DIST = 2e-4, MAX_DIST = 1e16;   // ~1 billion light-years
/*
 * Past MAX_DIST the zoom carries on as a power of ten in view.over, out to a
 * camera distance of 10^1002 km. No floating-point number reaches that far
 * (doubles stop near 1.8e308, the GPU's floats near 3.4e38), and by then the
 * whole sandbox is one dot anyway — so the scene is drawn from MAX_DIST and
 * only the scale bar keeps counting. Each notch steps further the further out
 * you are, so the last thousand orders of magnitude take a couple of hundred
 * notches rather than fourteen thousand.
 */
const ZOOM_MAX_LOG_KM = 1002;
const OVER_MAX = ZOOM_MAX_LOG_KM - Math.log10(MAX_DIST * 1e6);

/** Zoom by a factor (>1 out, <1 in), spilling past MAX_DIST into view.over. */
function zoomBy(f) {
  if (!(f > 0)) return;
  const lg = Math.log10(f);
  if (lg > 0 && view.dist >= MAX_DIST * 0.999) {
    view.dist = MAX_DIST;
    view.over = Math.min(OVER_MAX, view.over + lg * (1 + view.over * 0.5));
  } else if (lg < 0 && view.over > 0) {
    view.over = Math.max(0, view.over + lg * (1 + view.over * 0.5));
  } else {
    view.dist *= f;
  }
}

function applyCamera() {
  view.pitch = clamp(view.pitch, -1.52, 1.52);
  view.dist = clamp(view.dist, MIN_DIST, MAX_DIST);
  // Anything that put the camera back inside the real range (framing a body,
  // landing) has left the far zoom behind.
  if (view.dist < MAX_DIST * 0.999) view.over = 0;
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(
    view.target.x + view.dist * cp * Math.sin(view.yaw),
    view.target.y + view.dist * sp,
    view.target.z + view.dist * cp * Math.cos(view.yaw)
  );
  camera.lookAt(view.target);
  // keep the near plane sensible across nine orders of magnitude
  camera.near = Math.max(1e-6, view.dist * 1e-4);
  // Real-sized galaxies are ~10^12 Gm across: from inside one, looking at a
  // single star, the rest of it still has to be in range.
  camera.far = Math.max(view.dist * 12, SKY_R * 2.2, galx.live > 0 ? 2e17 : 0);
  camera.updateProjectionMatrix();
  if (skyGroup) skyGroup.position.copy(camera.position);
}

function frameOn(b, margin) {
  if (!b) return;
  galx.focus = -1;
  if (land.b) leaveSurface(true);
  view.target.copy(b.p);
  // A galaxy's bulge is a speck next to its disc; framing on the bulge would
  // put the camera inside the thing you asked to look at.
  const r = b.kind === 'gal' ? b.galR : visRadius(b);
  view.dist = clamp(r * (margin || 9), MIN_DIST, MAX_DIST);
}

/* ================================================================ landing */
/*
 * Stand on a world. The camera is pinned to a point on the body's own surface
 * mesh — stored in the mesh's local frame, so the ground turns under you with
 * the planet's spin and day becomes night as it rolls away from its star. The
 * height comes from a ray cast straight down onto the drawn triangles (and the
 * sea, if there is one), so it is exactly the ground you can see: mountains,
 * craters, lumpy asteroids and all.
 *
 * A world with air gets a sky: a dome around the eye that turns blue as the
 * star climbs, warms at sunrise and sunset, and fades back out to the stars at
 * night. An airless one keeps a black sky full of stars at noon, as the Moon does.
 */
const land = {
  b: null,
  n: new THREE.Vector3(0, 1, 0),   // where you stand, in the surface mesh's frame
  yaw: 0, pitch: 0.06,             // heading from local north, and look up/down
  alt: 0.006,                      // eye height over the ground, in body radii
  keys: new Set(),
  dome: null, ray: null,
  detail: null, detailOn: null     // fine grain laid over the ground you stand on
};
const LAND_MIN_ALT = 0.004, LAND_MAX_ALT = 4;
const SUNSET = new THREE.Color(1.0, 0.48, 0.22);

/** Why a body cannot be stood on, or null if it can. */
function landBlock(b) {
  if (!b || !b.alive || b.kind !== 'body') return 'There is nothing solid there to land on.';
  const def = TYPES[b.type];
  if (def.star && !def.dead) {
    return b.name + ' is a ' + def.label.toLowerCase() + ' — at ' + Math.round(b.temp).toLocaleString() +
      ' K you would be vaporised long before you touched down.';
  }
  return null;
}

function landOn(b) {
  const why = landBlock(b);
  if (why) { toast(why); return; }
  if (!b.parts || !b.parts.surf) return;
  if (land.b) leaveSurface(true);
  land.b = b;
  b.obj.updateMatrixWorld(true);
  // Touch down on the side you were looking at, so the landing feels like a
  // descent rather than a teleport.
  const dir = camera.position.clone().sub(b.p);
  if (dir.lengthSq() < 1e-30) dir.set(0, 0, 1);
  land.n.copy(dir.normalize()).transformDirection(_invOf(b.parts.surf));
  land.yaw = 0; land.pitch = 0.06; land.alt = 0.006;
  sim.follow = null;
  if (!land.dome) land.dome = makeSkyDome();
  $('an-vignette').classList.add('landed');
  const def = TYPES[b.type];
  toast(GASSY_SURF.has(def.surf)
    ? 'There is no ground on ' + b.name + ' — you are drifting on the cloud tops.'
    : 'Welcome to ' + b.name + '! WASD to walk, drag to look around, Esc to take off.');
  renderInspector();
  updateHint();
}

function leaveSurface(quiet) {
  const b = land.b;
  land.b = null;
  land.keys.clear();
  if (land.dome) land.dome.visible = false;
  dropDetail();
  $('an-vignette').classList.remove('landed');
  camera.up.set(0, 1, 0);
  if (b && b.alive) {
    // Back out into orbit straight above where you were standing.
    view.target.copy(b.p);
    view.dist = clamp(visRadius(b) * 4, MIN_DIST, MAX_DIST);
    const up = camera.position.clone().sub(b.p).normalize();
    view.pitch = Math.asin(clamp(up.y, -1, 1));
    view.yaw = Math.atan2(up.x, up.z);
    sim.follow = b;
  }
  if (!quiet) { renderInspector(); updateHint(); }
}

const _inv = new THREE.Matrix4();
function _invOf(mesh) { return _inv.copy(mesh.matrixWorld).invert(); }

function makeSkyDome() {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uUp: { value: new THREE.Vector3(0, 1, 0) },
      uSun: { value: new THREE.Vector3(1, 0, 0) },
      uCol: { value: new THREE.Color(0.55, 0.75, 1.0) },
      uDay: { value: 0 }, uDusk: { value: 0 },
      uSet: { value: SUNSET }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uUp, uSun, uCol, uSet;
      uniform float uDay, uDusk;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = dot(d, uUp);
        // pale and thick at the horizon, deeper overhead
        vec3 sky = mix(mix(uCol, vec3(1.0), 0.45), uCol * 0.78, smoothstep(0.0, 0.55, h));
        // the glow pooled round the star, reddened low in the sky
        float near = max(dot(d, uSun), 0.0);
        sky = mix(sky, uSet, uDusk * pow(near, 3.0) * (1.0 - smoothstep(0.0, 0.5, h)));
        sky += vec3(1.0, 0.95, 0.85) * pow(near, 24.0) * 0.35 * uDay;
        float a = uDay * (0.80 + 0.18 * smoothstep(-0.1, 0.4, h));
        a = max(a, uDusk * 0.55 * pow(near, 2.0) * (1.0 - smoothstep(0.0, 0.6, h)));
        gl_FragColor = vec4(sky, clamp(a, 0.0, 0.95));
      }`,
    side: THREE.BackSide, transparent: true, depthWrite: false
  });
