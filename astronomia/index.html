const SCAR_DEPTH = 0.16;
const SCAR_RIM = 0.052;
/* How far the painted decal reaches compared with the bowl itself: the rim ring
   in scarTexture() sits at 0.275 of the half-width, and the ejecta rays run
   nearly to the edge — so the picture is about three and a half bowl-radii
   across. The cap that carries it has to cover the same ground. */
const SCAR_TEX_R = 0.1375;
const SCAR_TEX_SPAN = 3.4;

/** The angular radius of a scar's bowl, in radians. */
const scarAngle = (sc) => clamp(sc.s * 0.34, 0.02, 1.15);

/**
 * The crater itself, as a change in radius. `t` is the distance from the middle
 * in units of the bowl's own radius, so t = 1 is the rim.
 *
 * A parabolic floor, and a raised rim centred on t = 1 that dies away outwards
 * into the ejecta blanket — which is why a big crater sits in the middle of a
 * low, wide mound rather than ending at a cliff.
 */
function craterProfile(t, depth, rim) {
  if (t >= 1.42) return 0;
  /* cos² rather than a parabola: it leaves the floor flat in the middle and the
     walls steep, which is what a real crater of any size looks like — and, more
     importantly here, its slope is zero at BOTH ends, so the bowl meets the rim
     and the rim meets the plain without a crease. A crease shows up as a ring of
     facets once the mesh has to draw it. */
  let d = 0;
  if (t < 1) {
    const c = Math.cos(t * Math.PI / 2);
    d -= depth * c * c;
  }
  // The rim only exists in a band around t = 1. Without the gate, cos² keeps
  // oscillating and puts a phantom ridge in the middle of the bowl.
  const x = (t - 1) / 0.42;
  if (Math.abs(x) < 1) {
    const c = Math.cos(x * Math.PI / 2);
    d += rim * c * c;
  }
  return d;
}

/** Everything needed to evaluate one body's craters, worked out once. */
function scarList(b) {
  const list = [];
  if (!b.scars) return list;
  for (const sc of b.scars) {
    const ang = scarAngle(sc);
    list.push({
      n: new THREE.Vector3(sc.n[0], sc.n[1], sc.n[2]).normalize(),
      ang: ang,
      depth: SCAR_DEPTH * Math.sin(ang),
      rim: SCAR_RIM * Math.sin(ang),
      // Everything beyond this is untouched, and testing the cosine lets the
      // vast majority of vertices skip the arc-cosine entirely.
      cosSpan: Math.cos(Math.min(1.42 * ang, Math.PI))
    });
  }
  return list;
}

/**
 * Where the surface of a cratered body actually is, in one direction.
 *
 * `ground` is what the radius would have been with no impact — the terrain.
 * Inside a bowl that terrain is ERASED and replaced by the crater's own shape,
 * because that is what an impact does: whatever mountains were standing there
 * are not there any more. It also happens to be what makes the drawn crater and
 * the carved mesh agree, since a smooth floor is the same smooth floor whichever
 * of the two is asking.
 */
function scarredRadius(list, dir, ground) {
  let flat = 0, d = 0;
  for (let m = 0; m < list.length; m++) {
    const s = list[m];
    const cosA = dir.x * s.n.x + dir.y * s.n.y + dir.z * s.n.z;
    if (cosA <= s.cosSpan) continue;
    const t = Math.acos(clamp(cosA, -1, 1)) / s.ang;
    d += craterProfile(t, s.depth, s.rim);
    const f = smoothstep(clamp((1.15 - t) / 0.55, 0, 1));
    if (f > flat) flat = f;
  }
  return flat > 0 ? ground * (1 - flat) + flat + d : ground + d;
}

/* =========================================== rounding out under gravity  */
/*
 * A small body keeps whatever shape it was left in, because its own gravity is
 * far too weak to do anything about it: rock has strength, and below a few
 * hundred kilometres across that strength wins. Above it, gravity wins, and the
 * thing pulls itself into a ball. That is the whole difference between Vesta,
 * which is a battered lump, and Ceres just next door, which is round — and it is
 * why every world big enough to be called a planet is a sphere.
 *
 * So an asteroid or a comet that keeps eating gets rounder as it goes. It is
 * measured against the type's OWN mass rather than an absolute figure, because
 * the drawn sizes here are exaggerated: a body starts as irregular as its type
 * says, and is a smooth ball by about a hundred times that mass.
 */
const ROUND_DECADES = 2;        // powers of ten from lumpy to spherical

function lumpAmount(b) {
  const def = TYPES[b.type];
  if (!def.lumpy) return 0;
  const t = clamp(Math.log10(Math.max(b.m, 1e-30) / def.mass) / ROUND_DECADES, 0, 1);
  return def.lumpy * (1 - smoothstep(t));
}

/** True when a body has rounded out enough to be worth rebuilding its mesh. */
function lumpDrift(b) {
  if (!TYPES[b.type].lumpy) return false;
  const want = lumpAmount(b);
  const had = b.lumpBuilt != null ? b.lumpBuilt : TYPES[b.type].lumpy;
  // A twelfth of the way, so a body that is slowly accreting rebuilds a dozen
  // times on its way to being a ball rather than on every mouthful.
  return Math.abs(want - had) > TYPES[b.type].lumpy / 12;
}

/** The geometry a body would have with no craters in it at all. */
function baseGeometryFor(b) {
  const def = TYPES[b.type];
  if (def.lumpy) {
    const amt = lumpAmount(b);
    b.lumpBuilt = amt;
    /* Once it is mostly round, the coarse sphere the irregular shapes are built
       from starts to show as facets — so a body that has smoothed out gets a
       finer one to be smooth ON. */
    return lumpyGeometry(b.seed, amt, amt < def.lumpy * 0.45 ? SPHERE : SPHERE_LO);
  }
  if (def.surf === 'star') return starGeometry(b.type, b.seed);
  return reliefGeometry(b.type, b.seed);
}

/**
 * Punch every one of a body's craters into its mesh.
 *
 * This is the difference between a mark ON a planet and a mark that IS part of
 * it: the ground actually caves in, the rim actually stands up, and both of them
 * catch the light and break the silhouette because they are geometry rather than
 * a picture lying on a sphere.
 *
 * The result is unique to this body, so unlike relief geometry it CANNOT be
 * shared or cached — it becomes b.ownGeo and dies with it.
 */
function carveScars(b, base, list) {
  if (!list.length) return base;
  const g = base.clone();
  const pos = g.attributes.position;
  const arr = pos.array;
  const dir = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    const k = i * 3;
    const x = arr[k], y = arr[k + 1], z = arr[k + 2];
    const L = Math.sqrt(x * x + y * y + z * z);
    if (L < 1e-9) continue;
    dir.set(x / L, y / L, z / L);
    const r = scarredRadius(list, dir, L);
    if (r !== L) { arr[k] = dir.x * r; arr[k + 1] = dir.y * r; arr[k + 2] = dir.z * r; }
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

/**
 * A dish of triangles laid IN one crater, carrying its texture.
 *
 * The flat quad this replaces bridged straight over the bowl once the bowl was
 * real, so the painted crater floated above the hole it was meant to be in.
 * Every vertex here is put at the height the same craterProfile() puts the mesh,
 * on top of whatever the terrain was already doing — so the picture and the
 * ground are the same shape by construction.
 */
function scarCapGeometry(b, sc, lift, list) {
  const RINGS = 22, SEGS = 40;
  const n = new THREE.Vector3(sc.n[0], sc.n[1], sc.n[2]).normalize();
  let u = new THREE.Vector3(0, 1, 0);
  if (Math.abs(n.dot(u)) > 0.9) u.set(1, 0, 0);
  u.crossVectors(n, u).normalize();
  const w = new THREE.Vector3().crossVectors(n, u).normalize();
  // Rolled about its own axis, so no two craters have their rays lined up.
  const cr = Math.cos(sc.roll), sr = Math.sin(sc.roll);
  const uu = u.clone().multiplyScalar(cr).addScaledVector(w, sr);
  const ww = u.clone().multiplyScalar(-sr).addScaledVector(w, cr);

  const ang = scarAngle(sc);
  const amax = Math.min(ang * SCAR_TEX_SPAN, 1.32);

  const pos = [], uvs = [], idx = [];
  const dir = new THREE.Vector3();
  for (let i = 0; i <= RINGS; i++) {
    // Rings bunched towards the middle, where the shape actually changes.
    const a = amax * Math.pow(i / RINGS, 1.3);
    const t = a / ang;
    const rt = Math.min(SCAR_TEX_R * t, 0.492);
    const ca = Math.cos(a), sa = Math.sin(a);
    for (let j = 0; j <= SEGS; j++) {
      const th = (j / SEGS) * TAU, ct = Math.cos(th), st = Math.sin(th);
      dir.copy(n).multiplyScalar(ca).addScaledVector(uu, sa * ct).addScaledVector(ww, sa * st).normalize();
      // Every crater on the body, not just this one, so overlapping rims agree.
      const rr = scarredRadius(list, dir, groundAt(b, dir)) + lift;
      pos.push(dir.x * rr, dir.y * rr, dir.z * rr);
      uvs.push(0.5 + rt * ct, 0.5 + rt * st);
    }
  }
  for (let i = 0; i < RINGS; i++) {
    for (let j = 0; j < SEGS; j++) {
      const a0 = i * (SEGS + 1) + j, b0 = a0 + 1, c0 = a0 + SEGS + 1, d0 = c0 + 1;
      idx.push(a0, c0, b0, b0, c0, d0);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

function buildScars(b) {
  const p = b.parts;
  if (!p || !p.surf || !b.scars) return;
  if (p.scars) for (const sk of p.scars) {
    p.surf.remove(sk.pit); sk.pit.material.dispose(); sk.pit.geometry.dispose();
    p.surf.remove(sk.fire); sk.fire.material.dispose(); sk.fire.geometry.dispose();
  }
  p.scars = [];
  if (!b.scars.length) return;

  /* Re-cut the body itself. Carved from the pristine geometry every time rather
     than from what is already there, or each new impact would deepen every old
     crater along with its own. */
  const list = scarList(b);
  const carved = carveScars(b, baseGeometryFor(b), list);
  /* How far the caps stand off the ground. groundAt() reads the height field at
     texel resolution while the mesh carries its own vertices, so the two differ
     by a hair — and that hair is proportional to how much relief the world has.
     Stand off by more than the disagreement or ridges show through the decal in
     little dark flakes. */
  const clear = 0.002 + reliefOf(b.type) * 0.020;
  if (carved !== p.surf.geometry) {
    if (b.ownGeo && b.ownGeo !== carved) b.ownGeo.dispose();
    p.surf.geometry = carved;
    b.ownGeo = carved;                 // unique to this body, so it owns it
  }

  const tex = cachedTexture('scar', () => scarTexture(90210, 256));
  const hot = cachedTexture('scarfire', () => scarFireTexture(4711, 256));
  for (const sc of b.scars) {
    // The crater's own colouring — dark floor, bright rim, thrown-out rays —
    // sitting in the hole rather than over it.
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false, opacity: 0, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    });
    const pit = new THREE.Mesh(scarCapGeometry(b, sc, clear, list), mat);
    p.surf.add(pit);        // a child of the mesh, so it turns with the world

    /* The fire, additive so it reads as light rather than paint, and standing a
       shade further out so it glows over the crater instead of fighting it. */
    const fmat = new THREE.MeshBasicMaterial({
      map: hot, transparent: true, depthWrite: false, opacity: 0, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3
    });
    const fire = new THREE.Mesh(scarCapGeometry(b, sc, clear + 0.004, list), fmat);
    p.surf.add(fire);

    p.scars.push({ sc: sc, pit: pit, fire: fire });
  }
  paintScars(b);
}

/* The colour a cooling impact melt passes through: white-hot, then the orange
   of flowing lava, then a dull red before it goes out altogether. */
const SCAR_RAMP = [
  [0.00, [255, 250, 235]],   // just hit: white-hot
  [0.22, [255, 196,  92]],
  [0.50, [255, 104,  22]],   // flowing lava
  [0.78, [156,  26,   8]],   // dull red
  [1.00, [ 70,  12,   6]]    // going out
];

/**
 * Put every scar on this body at the temperature its age says it should be.
 * Cheap, and skipped entirely once the last one has gone cold.
 */
function paintScars(b) {
  const p = b.parts;
  if (!p || !p.scars || !p.scars.length) return false;
  let anyHot = false;
  for (const sk of p.scars) {
    // A scar restored from an old save has no age at all: treat it as cold.
    const age = sk.sc.age != null ? sk.sc.age : SCAR_COOL;
    const t = clamp(age / SCAR_COOL, 0, 1);
    if (t < 1) anyHot = true;

    // Glow: brightest the instant it forms, and gone by the time it is cold.
    const lit = Math.pow(1 - t, 1.7);
    const c = ramp(SCAR_RAMP, clamp(t * 1.05, 0, 1));
    sk.fire.material.color.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
    sk.fire.material.opacity = lit * 0.95;
    sk.fire.visible = lit > 0.004;

    // Crater: hidden under the fire at first, then emerging from under it.
    sk.pit.material.opacity = 0.85 * smoothstep(clamp((t - 0.18) / 0.62, 0, 1));
    sk.pit.visible = sk.pit.material.opacity > 0.004;
  }
  return anyHot;
}

/** Age every open wound, and stop touching a body once all of its are cold. */
function coolScars(simDt) {
  if (simDt <= 0) return;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (!b.alive || !b.scars || !b.scars.length || b.scarsCold) continue;
    let hot = false;
    for (const sc of b.scars) {
      if (sc.age == null) { sc.age = SCAR_COOL; continue; }
      if (sc.age < SCAR_COOL) sc.age = Math.min(sc.age + simDt, SCAR_COOL);
      // Tested AFTER the step, so the frame that finishes the job is also the
      // frame that stops the work rather than the one after it.
      if (sc.age < SCAR_COOL) hot = true;
    }
    // One last repaint on the way past the finish line, then leave it alone.
    paintScars(b);
    b.scarsCold = !hot;
  }
}

/* ================================================================ gas clumps */
/*
 * A collision does not only make gravel and a fine mist. It throws off KNOTS —
 * lumps of vapour dense enough to hold together for a while, which you can
 * click on, weigh and watch. Some of what comes off is solid instead, and the
 * two behave completely differently: rock just orbits, while a gas knot is in a
 * race between spreading out and pulling itself in. If there is enough of it,
 * gravity wins and it becomes a world.
 *
 * This is not decoration — it is the actual origin story of the Moon, and of
 * every moon around every giant in the Solar System.
 */

/* Above this much mass a knot can hold itself together and collapse into a
   solid body. Below it, it thins out and is gone. */
const CLUMP_COLLAPSE = 0.045;      // M⊕ — about four Moons

function clumpGeometry(variant) {
  const key = 'clump:' + variant;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const lump = fbm(hashStr('cl' + variant), 4, 2, 4);
  const pos = [], col = [], siz = [];

  for (let i = 0; i < 900; i++) {
    const z = rng() * 2 - 1, ph = rng() * TAU, s = Math.sqrt(Math.max(0, 1 - z * z));
    const dx = s * Math.cos(ph), dy = s * Math.sin(ph), dz = z;
    const u = ((Math.atan2(dy, dx) / TAU) + 1) % 1;
    const v = Math.acos(clamp(dz, -1, 1)) / Math.PI;
    // Ragged, not a ball: a noise field eats a good share of every direction.
    const lb = clamp(lump(u, v) * 1.8 - 0.4, 0, 1);
    if (rng() > 0.25 + lb) continue;
    // Filled rather than hollow — a knot is dense in the middle, which is the
    // whole reason it might survive.
    const r = Math.pow(rng(), 0.55) * (0.55 + lb * 0.5);
    pos.push(dx * r, dy * r * 0.86, dz * r);
    // Hot and bright at the core, cooling outward through the disc colours —
    // but only as far as the rose end of them. A knot this fresh has not had
    // time to get to the cold blue an old disc rim sits at.
    const c = ramp(DISC_RAMP, clamp(r * 0.82, 0, 1));
    const j = 0.75 + rng() * 0.5;
    col.push(c[0] / 255 * j, c[1] / 255 * j, c[2] / 255 * j);
    siz.push(0.10 + Math.pow(rng(), 2) * 0.36);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function buildClump(b, grp) {
  const puff = new THREE.Points(clumpGeometry(b.seed % 6), new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0.3 }, uScale: { value: 1 }, uFocal: { value: 1 } },
    vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  puff.frustumCulled = false;
  puff.renderOrder = 4;
  grp.add(puff);
  b.parts.puff = puff;

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(0xffa257), opacity: 0.32,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  }));
  grp.add(glow);
  b.parts.clumpGlow = glow;
  b.lightColor = new THREE.Color(0xffb070);
}

/**
 * Knots cool, spread, and eventually decide what they are going to be. A heavy
 * one pulls itself together into a solid world; a light one simply disperses
 * back into the fine gas it came from.
 */
function updateClumps(simDt) {
  for (let i = sim.bodies.length - 1; i >= 0; i--) {
    const b = sim.bodies[i];
    if (!b.alive || b.kind !== 'gas') continue;

    b.clumpAge = (b.clumpAge || 0) + simDt;
    // Radiating away the heat of the impact that made it.
    b.temp = Math.max(30, b.temp * Math.exp(-0.0016 * simDt));
    if (b.clumpAge < (b.clumpLife || 420)) continue;

    if (b.m >= CLUMP_COLLAPSE) collapseClump(b);
    else disperseClump(b);
  }
}

/** Pull a knot together into the solid world its own gravity makes of it. */
function collapseClump(b) {
  const star = nearestStar(b);
  const warm = star ? b.p.distanceTo(star.p) < 2.7 * AU * Math.sqrt(Math.max(star.lum, 1e-4)) : true;
  const type = discPlanetType(b.m, warm);
  b.type = type;
  b.kind = 'body';
  b.temp = TYPES[type].temp || 300;
  b.coreT = baseCoreT(TYPES[type], b.m);
  b.rFactor = 1;
  b.r = trueRadius(type, b.m);
  b.spin = TYPES[type].spin || 1;
  b.tilt = rnd(-0.42, 0.42);
  b.glowPulse = 1;
  // Born of a collision, and it shows: the surface is pocked from the start.
  b.scars = null; b.scarCount = 0;
  const marks = 2 + ((Math.random() * 3) | 0);
  updateLuminosity(b);
  refreshVisual(b);
  for (let i = 0; i < marks; i++) {
    addScar(b, new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)), rnd(0.22, 0.6));
  }
  fx.form(b, false);
  toast(b.name + ' pulled itself together into a ' + TYPES[type].label.toLowerCase());
  if (sim.selected === b) renderInspector();
}

/** Let a knot go: it becomes the fine gas it was always going to become. */
function disperseClump(b, quiet) {
  const vEsc = Math.sqrt(2 * G * Math.max(b.m, 1e-12) / Math.max(visRadius(b), 1e-9));
  const put = gasEjecta(b.p, b.v, 220, b.m, Math.max(vEsc, 0.02), visRadius(b) * 0.4,
    { speed: 0.6, sizeMin: 8, sizeMax: 30 });
  // Whatever the particle pool could not take stays as a smaller knot rather
  // than vanishing — mass is never destroyed here.
  b.m -= put;
  if (b.m > 1e-9 && put <= 0) { b.clumpAge = 0; return; }
  if (!quiet) toast(b.name + ' thinned away to nothing');
  if (sim.selected === b) select(null);
  removeBody(b);
  compact();
}

/**
 * Throw off a handful of selectable knots after a collision — mostly gas, some
 * solid. Returns the mass actually used, which the caller must subtract.
 */
function spawnClumps(center, baseVel, totalMass, count, spread, minDist, solidChance) {
  const n = Math.min(count, freeSlots());
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const made = [];
  // Knots are far wider than the rubble they come off with, so they have to be
  // thrown clear of each other or they simply merge back together on the first
  // step and none of them survive to be looked at.
  const gap = Math.max(minDist, trueRadius('gas_clump', each) * settings.bodyScale * 2.6);

  for (let i = 0; i < n; i++) {
    const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.5, 0.5), rnd(-1, 1));
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const pos = center.clone().addScaledVector(dir, gap * rnd(1.2, 2.8));
    const vel = baseVel.clone().addScaledVector(dir, spread * rnd(0.3, 1.05));

    // Solid knots are the pieces that never got hot enough to boil.
    const solid = Math.random() < (solidChance != null ? solidChance : 0.3);
    if (solid) {
      made.push(makeBody(each > 0.004 ? 'moon' : 'asteroid', pos, vel,
        { mass: each, name: 'Fragment ' + sim.nextId, rubble: true, coreT: 3200 }));
    } else {
      const b = makeBody('gas_clump', pos, vel, { mass: each, name: 'Clump ' + sim.nextId });
      b.temp = rnd(1400, 3200);
      b.clumpLife = rnd(260, 900);
      b.clumpAge = 0;
      made.push(b);
    }
  }
  // The set as a whole must drift exactly as the mass it came from did.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, baseVel.clone().multiplyScalar(tot));
  return each * n;
}

/* ================================================================== rings   */
/*
 * Rings are per-body rather than per-type, so any world can be given a set and
 * any set can be reshaped or recoloured from the inspector. A spec is:
 *
 *   { inner, outer   multiples of the body's own drawn radius
 *     pal            two [r,g,b] stops the ringlets are painted between
 *     tilt           radians the whole body (and so its rings) leans over
 *     opacity }
 */

const DEFAULT_RINGS = () => ({
  inner: 1.35, outer: 2.4, pal: [[228, 210, 176], [166, 142, 112]], tilt: 0.47, opacity: 0.9
});

const rgbHex = (c) => '#' + [0, 1, 2].map(i => clamp(Math.round(c[i]), 0, 255).toString(16).padStart(2, '0')).join('');
const hexRgb = (h) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h));
  if (!m) return [255, 255, 255];
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
};

/* The edge ratio is quantised before it reaches ringGeometry's cache. Without
   this, dragging an edge slider from end to end mints a few hundred distinct
   annulus geometries and keeps every one of them forever. */
const ringRatio = (s) => Math.round(clamp(s.inner / s.outer, 0.05, 0.97) * 50) / 50;

/** Paint a ring texture for one body. NOT shared: the colours are per-body. */
function ringTextureFor(b) {
  if (b.ringTex) b.ringTex.dispose();
  b.ringTex = new THREE.CanvasTexture(ringTexture(hashStr('ring' + b.seed), 512, b.ringSpec.pal));
  return b.ringTex;
}

function buildRing(b, grp) {
  const s = b.ringSpec;
  const rm = new THREE.MeshBasicMaterial({
    map: ringTextureFor(b), transparent: true, side: THREE.DoubleSide, depthWrite: false,
    opacity: s.opacity != null ? s.opacity : 0.92
  });
  const ring = new THREE.Mesh(ringGeometry(ringRatio(s)), rm);
  ring.rotation.x = -Math.PI / 2;
  grp.add(ring);
  b.parts.ring = ring;
}

/**
 * Push the current spec onto the mesh. Shape and opacity are cheap and update
 * live; `repaint` redraws the 512×512 texture and is only asked for when the
 * colours have actually changed.
 */
function setRings(b, spec, repaint) {
  const had = b.ringSpec;
  b.ringSpec = spec ? Object.assign({}, spec) : null;

  if (!b.ringSpec) {
    if (b.parts && b.parts.ring) {
      b.obj.remove(b.parts.ring);
      b.parts.ring.material.dispose();
      b.parts.ring = null;
    }
    if (b.ringTex) { b.ringTex.dispose(); b.ringTex = null; }
    return;
  }
  if (!b.obj) return;

  b.tilt = b.ringSpec.tilt;
  if (!had || !b.parts.ring) { buildRing(b, b.obj); scaleVisual(b); return; }

  const ring = b.parts.ring;
  ring.geometry = ringGeometry(ringRatio(b.ringSpec));
  ring.material.opacity = b.ringSpec.opacity != null ? b.ringSpec.opacity : 0.92;
  if (repaint) ring.material.map = ringTextureFor(b);
  scaleVisual(b);
}


/* ------------------------------------------------- rings you can crash into */
/*
 * The painted ring is scenery: one flat texture, and nothing can hit it. This
 * builds the other kind — a three-dimensional band of real asteroids, each with
 * its own mass and its own orbit, integrated by the same leapfrog step as
 * everything else. They pull on one another, they shear, and they collide.
 *
 * Two compromises, both forced by scale, and both deliberate. A real ring
 * particle is a few metres across; fifty of those spread round a band the width
 * of a star would not meet in the lifetime of the universe. So the rocks are
 * sized to the band instead — each about a third of the gap to its neighbour,
 * which is close enough that a nudge in radius or tilt puts two of them in
 * contact. And the whole band is capped at a small share of whatever it orbits,
 * so it stays low-density rubble rather than outweighing its host and wrecking
 * every orbit in the system.
 *
 * Each press lays a fresh band a little wider and a little more tilted than the
 * last, so they cross rather than nest. Press it a few times and the crossings
 * start grinding themselves apart.
 */

const SOLID_RING_N = 44;          // rocks per press, budget permitting
const SOLID_RING_STEP = 2.5;      // each press starts this much further out
const SOLID_RING_SPAN = 3.2;      // how wide one band is, inner edge to outer
const SOLID_RING_SHARE = 2e-4;    // × the host's mass, per band

/** Returns how many rocks actually went in. */
function addSolidRing(b) {
  if (!b || !b.alive || b.kind === 'gal' || b.kind === 'snr') {
    toast('There is nothing here to put a ring around');
    return 0;
  }
  const room = freeSlots();
  if (room < 6) { toast('Universe is full — clear some bodies first'); return 0; }
  const n = Math.min(SOLID_RING_N, room);

  const rv = Math.max(visRadius(b), 1e-9);
  const lap = b.solidRings || 0;

  /* Where this band goes. The first press hugs the body, because that is where
     rocks are a sane size and a ring really is packed shoulder to shoulder.
     Each press after that starts SOLID_RING_STEP further out while being
     SOLID_RING_SPAN wide, so consecutive bands overlap by about a third rather
     than nesting — and after seven or eight presses the outermost one is as far
     out as a protoplanetary disc reaches.
     The ceiling is that disc: if the host already has one the rocks stop where
     the dust does, so the two are the same disc seen twice. A star without one
     gets a disc's own outer edge, forty-two AU, which is the shape ours was
     built from. Anything smaller than a star is kept in proportion to its own
     width, because forty AU around a planet is not a ring, it is a solar
     system. Once a band is against the ceiling, further presses re-lay the
     outer band at a new tilt. */
  const disc = b.disc && b.disc.alive ? b.disc : null;
  const reach = disc ? disc.rOut : TYPES[b.type].star ? 42 * AU : rv * 48;
  const first = disc ? Math.max(disc.rIn, rv * 1.6) : rv * 1.6;
  const inner = Math.min(first * Math.pow(SOLID_RING_STEP, lap),
                         Math.max(reach / SOLID_RING_SPAN, first));
  const outer = Math.min(inner * SOLID_RING_SPAN, Math.max(reach, inner * 1.2));

  /* The plane of the band: the body's own tilted equator, turned further on
     each press. Two orbits at nearly the same radius but different tilts cross
     at two points, and that is where the crashes come from. */
  const spec = b.ringSpec;
  const lean = b.tilt + (spec ? spec.tilt * 0.35 : 0) + lap * 0.19;
  const axis = new THREE.Vector3(-Math.sin(lean), Math.cos(lean), 0).normalize();
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(axis.dot(u)) > 0.9) u.set(0, 0, 1);
  u.crossVectors(axis, u).normalize();
  const w = new THREE.Vector3().crossVectors(axis, u).normalize();

  /* Rock size is a share of its OWN orbital radius, not one figure for the
     whole band — over two decades of radius a single size would be boulders at
     the rim and dust in the middle. This is the gap between neighbours spread
     evenly round a ring at that radius, so a rock is always about a third of
     the way to touching the next one along. What collisions actually measure is
     the DRAWN radius, so bodyScale is divided back out. */
  const k = TAU * 0.30 / (n * Math.max(settings.bodyScale, 1e-6));
  const natR = TYPES.asteroid.rad * R_EARTH;
  // No band may weigh more than a whisker of what it orbits, or the first press
  // wrecks every orbit in the system.
  const cap = Math.max(b.m * SOLID_RING_SHARE / n, 1e-10);
  const gm = G * settings.gravity;

  let made = 0;
  for (let i = 0; i < n; i++) {
    if (freeSlots() <= 0) break;
    // Log-uniform in radius, so the crowded inside of the band gets its share
    // instead of every rock landing out near the rim.
    const rad = inner * Math.pow(outer / inner, (i + rnd(-0.4, 0.4)) / Math.max(n - 1, 1));
    const ang = Math.random() * TAU;
    const rockR = clamp(rad * k, natR, rad * 0.08);
    // What a rock that size would weigh if it were solid — and never more than
    // its share of the cap. Small inner rocks stay properly dense; the giants
    // further out come out as low-density rubble piles.
    const each = Math.max(Math.min(TYPES.asteroid.mass * Math.pow(rockR / natR, 3), cap), 1e-11);

    const dir = u.clone().multiplyScalar(Math.cos(ang)).addScaledVector(w, Math.sin(ang));
    const tan = u.clone().multiplyScalar(-Math.sin(ang)).addScaledVector(w, Math.cos(ang));
    const pos = b.p.clone().addScaledVector(dir, rad)
      .addScaledVector(axis, (Math.random() - 0.5) * rad * 0.05);
    // Circular at its own radius, off by a per cent or so — which is what makes
    // the band shear and eventually bring pairs together.
    const vc = Math.sqrt(gm * b.m / rad);
    const vel = b.v.clone().addScaledVector(tan, vc * rnd(0.985, 1.015));
    const rock = makeBody('asteroid', pos, vel, { mass: each, r: rockR, spin: rnd(0.05, 0.6) });
    rock.tilt = rnd(-Math.PI, Math.PI);
    /* Flagged as an already-loose rubble pile, which is what it is — and which
       makes it immune to tidal stripping. That matters: a rock this wide is a
       deliberate fudge, drawn big enough to actually hit its neighbours, so its
       density comes out very low. Feed that density into a Roche limit and the
       star shaves the whole band down to specks within the first few orbits,
       which is the fudge eating its own tail. It can still be smashed by an
       impact; it just cannot be quietly eroded. */
    rock.disrupted = true;
    made++;
  }
  if (!made) { toast('No room left for a ring'); return 0; }

  b.solidRings = lap + 1;
  computeAccel();
  refreshStarCache();
  updateTemperatures();
  toast(made + ' asteroids now orbiting ' + b.name + ', out to ' + fmtDist(outer) +
    (lap ? ' — band ' + (lap + 1) + ', crossing the ones already there' : ''));
  return made;
}

/* ================================================================ galaxies  */
/*
 * A galaxy is not a picture here. It is a few thousand individual stars, each
 * one integrated under the gravity of every galaxy core in the scene — which is
 * the whole reason two of them can be crashed into each other and do something
 * worth watching.
 *
 * This is the restricted N-body model Toomre & Toomre used in 1972 to work out
 * where the tails and bridges of interacting galaxies come from, and it is
 * still the standard way to reproduce them. Each star is a TEST particle: it
 * feels the cores, but has no pull of its own. That is what makes thousands of
 * them affordable, and it costs almost nothing in realism, because in a real
 * galaxy the stars really are a rounding error next to the mass they orbit.
 *
 * The three things it gets right, and the three things you see in the sky:
 *
 *   TIDAL TAILS   The far side of a disc is pulled less hard than the near
 *                 side, so a passing companion flings a long thin streamer out
 *                 behind it. The Antennae, the Mice, the Tadpole — all this.
 *   BRIDGES       Material dragged the other way, straight towards the intruder.
 *   MERGERS       Dynamical friction drains the orbit, the cores spiral in and
 *                 coalesce, and the two ordered discs are left as one shapeless
 *                 blob. That is where elliptical galaxies come from, and it is
 *                 what the Milky Way and Andromeda are going to do.
 *
 * ONE HONEST NOTE ON SCALE. A real galaxy is about 9×10^17 Gm across, roughly a
 * trillion times the width of the largest thing this sandbox can otherwise
 * hold. Drawn at true size, nothing else in the simulation would be one pixel.
 * So a galaxy is built at whatever world size it is created at — the pixel
 * range in Settings picks that at the moment you place it — and everything
 * after that, orbits, tails and all, is real physics at that size. The shapes
 * are right and the timescale is not: a collision that would take a billion
 * years plays out in months.
 */

/* Star slots shared across every galaxy in the scene. */
const GAL_MAX = 60000;
const GAL_STARS = 11000;        // per galaxy, budget permitting
const GAL_SUBSTEPS = 3;         // per frame — galaxy orbits are slow and smooth
/* Softening as a fraction of the disc radius. It gives the inner disc a
   near-solid-body rotation curve, which is both what real galaxies do and what
   stops the arms winding themselves into mush after two turns. */
const GAL_SOFT = 0.55;

/* A galaxy's clouds. aSize is the puff's radius in Gm; it is projected to
   pixels here and capped, because a puff filling the whole screen thousands of
   times over would cost far more than it shows. A puff too small to resolve
   dims with its area instead of shrinking past a pixel, so a far-off galaxy
   fades to the faint smudge it should be rather than a crisp spray of dots. */
const GAL_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uScale;
  varying vec3 vCol;
  varying float vA;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    float px = aSize * uScale / max(-mv.z, 1e-9);
    vCol = aCol;
    vA = aSize > 0.0 ? min(1.0, px * px / 9.0) : 0.0;
    gl_PointSize = aSize > 0.0 ? clamp(px, 3.0, 240.0) : 0.0;
    // A freed slot is parked off-screen too: some GPUs still draw a zero-size
    // point as one pixel, which leaves a ghost of the last galaxy behind.
    if (aSize <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  }`;

const GAL_FRAG = `
  uniform float uGain;
  varying vec3 vCol;
  varying float vA;
  void main() {
    vec2 q = gl_PointCoord * 2.0 - 1.0;
    float d2 = dot(q, q);
    if (d2 > 1.0) discard;
    // gaussian, pinned to zero at the rim so no puff shows an edge
    float a = (exp(-d2 * 3.2) - 0.0408) / 0.9592;
    gl_FragColor = vec4(vCol * uGain, a * vA);
  }`;
const GAL_GAIN = 0.03;

/* A galaxy star seen up close: a real ball of fire. Drawn camera-relative
   (galx.mesh sits at the camera and each instance is offset from it), because
   a star half a galaxy from the origin is 10^11 Gm out and a 32-bit float there
   cannot place anything to better than ten thousand Gm — a Sun is one and a half. */
const GAL_SPHERE_VERT = `
  #include <common>
  #include <logdepthbuf_pars_vertex>
  varying vec3 vN;
  varying vec3 vV;
  varying vec3 vP;
  varying vec3 vC;
  void main() {
    vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * mat3(instanceMatrix) * normal);
    vV = -mv.xyz;
    vP = position;
    #ifdef USE_INSTANCING_COLOR
      vC = instanceColor;
    #else
      vC = vec3(1.0);
    #endif
    gl_Position = projectionMatrix * mv;
    #include <logdepthbuf_vertex>
  }`;

const GAL_SPHERE_FRAG = `
  #include <common>
  #include <logdepthbuf_pars_fragment>
  uniform float uTime;
  varying vec3 vN;
  varying vec3 vV;
  varying vec3 vP;
  varying vec3 vC;
  float h3(vec3 p) {
    p = fract(p * 0.3183099 + 0.1); p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float n3(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
               mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
  }
  void main() {
    #include <logdepthbuf_fragment>
    float mu = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
    // A black hole comes through with no colour at all: a perfect black ball
    // with a thin bright ring where light skims round the edge.
    if (vC.r + vC.g + vC.b < 0.01) {
      gl_FragColor = vec4(vec3(1.0, 0.78, 0.55) * pow(1.0 - mu, 7.0) * 1.6, 1.0);
      return;
    }
    // boiling granulation, two scales drifting against each other
    float g = n3(vP * 13.0 + uTime * 0.25) * 0.6 + n3(vP * 34.0 - uTime * 0.4) * 0.4;
    vec3 c = vC * (0.62 + 0.5 * g);
    c = mix(c, vec3(1.0), 0.30 * pow(mu, 2.0));        // a hot white middle
    float limb = 0.30 + 0.70 * pow(mu, 0.45);           // and a dark, reddened rim
    c *= limb;
    c.gb *= mix(0.80, 1.0, mu);
    gl_FragColor = vec4(c * 1.2, 1.0);
  }`;
const GAL_SPHERES = 96;

/* Real star types, so a galaxy is made of stars you could actually point at.
   Mostly red dwarfs, as every real galaxy is; blue giants live where stars are
   still being born, out on the arms; old red giants crowd the bulge. */
const GAL_TYPES = [
  { name: 'red dwarf',     T: [2800, 3800],   R: [0.12, 0.6], px: [0.8, 1.2] },
  { name: 'Sun-like star', T: [5000, 6200],   R: [0.8, 1.3],  px: [1.1, 1.6] },
  { name: 'white star',    T: [7400, 10000],  R: [1.4, 2.4],  px: [1.4, 2.0] },
  { name: 'blue giant',    T: [15000, 35000], R: [4, 10],     px: [2.7, 3.3] },
  { name: 'red giant',     T: [3300, 4600],   R: [12, 70],    px: [2.0, 2.6] },
  { name: 'white dwarf',   T: [8000, 30000],  R: [0.008, 0.02], px: [0.7, 1.0],
    note: 'the cooling core of a dead Sun-like star, the size of the Earth' },
  { name: 'neutron star',  T: [6e5, 1e6],     R: [1.3e-5, 1.6e-5], px: [0.8, 1.1], col: [0.75, 0.85, 1.0],
    note: 'what a supernova leaves behind: a city-sized ball of neutrons, spinning many times a second' },
  { name: 'black hole',    T: [0, 0],         R: [3e-5, 1.2e-4], px: [0.6, 0.8], col: [0.45, 0.28, 0.85],
    note: 'all that is left of a giant star; the faint violet glow is gas heating up as it falls in' },
  { name: 'brown dwarf',   T: [800, 2200],    R: [0.08, 0.12], px: [0.6, 0.8], col: [0.77, 0.2, 0.23],
    note: 'a failed star, too small ever to start fusing hydrogen' },
  { name: 'Wolf–Rayet star', T: [5e4, 1.2e5], R: [1, 3],      px: [3.0, 3.3],
    note: 'a giant that has blown its own outer layers away; it will go supernova soon' },
  { name: 'red supergiant', T: [3300, 3900],  R: [300, 900],   px: [3.0, 3.4],
    note: 'one of the biggest stars there is — put it where the Sun is and it would swallow Jupiter' }
];
const GAL_BH = 7;
/* How common each kind is. Young discs: mostly red dwarfs, a few hot giants,
   and the remains of stars that have already died. Old populations (bulges,
   ellipticals, globular clusters) have lost every massive star long ago. */
function pickGalKind(old, blue, rng) {
  const r = rng();
  if (old) {
    return r < 0.50 ? 0 : r < 0.75 ? 1 : r < 0.86 ? 4 : r < 0.96 ? 5 : r < 0.985 ? 8 : r < 0.994 ? 6 : GAL_BH;
  }
  return r < 0.40 ? 0 : r < 0.68 ? 1 : r < 0.75 ? 2 : r < 0.80 ? (blue ? 3 : 2) : r < 0.85 ? 4
    : r < 0.91 ? 5 : r < 0.96 ? 8 : r < 0.975 ? 6 : r < 0.983 ? GAL_BH : r < 0.987 ? (blue ? 9 : 3) : 10;
}
/** Give one star slot its kind, temperature, colour, size and brightness. */
function setGalStar(k, kind, rng) {
  const st8 = GAL_TYPES[kind];
  const T = lerp(st8.T[0], st8.T[1], rng());
  const sc = st8.col ? st8.col.map(v => v * 255) : kelvinToRGB(T);
  const k3 = k * 3;
  galx.kind[k] = kind;
  galx.temp[k] = T;
  galx.rad[k] = lerp(st8.R[0], st8.R[1], Math.pow(rng(), 1.5)) * R_SUN * R_EARTH;
  galx.scol[k3] = sc[0] / 255; galx.scol[k3 + 1] = sc[1] / 255; galx.scol[k3 + 2] = sc[2] / 255;
  // its size as a point of light: mostly faint pinpricks, a few bright ones
  galx.ssz[k] = lerp(st8.px[0], st8.px[1], rng());
}

/* ...and the stars inside the clouds. The same orbiting points drawn a second
   time as crisp, screen-sized stars, so the gas has stars in it at every zoom:
   fly into a galaxy and the clouds open out around thousands of separate suns.
   The brightest few carry a four-point diffraction glint. */
const GAL_STAR_VERT = `
  attribute vec3 aSCol;
  attribute float aSize;
  attribute float aStar;
  attribute float aRad;
  uniform float uDpr;
  uniform float uScale;
  varying vec3 vCol;
  varying float vSpike;
  varying float vNear;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    vCol = aSCol;
    vSpike = step(2.65, aStar);
    float s = aStar * (1.0 + vSpike * 2.2);
    // Close enough to see the star as a ball, the sprite becomes its glare,
    // reaching out a few radii round the sphere drawn by galx.mesh.
    float disc = aRad * uScale / max(-mv.z, 1e-9);
    vNear = smoothstep(0.6, 2.0, disc);
    // A star you are flying up to gets brighter long before it shows a disc:
    // the Sun is dazzling even from Saturn, where it is a fifth of a pixel.
    s = max(s * uDpr, min(sqrt(disc) * 14.0 * uDpr, 80.0));
    s = max(s, min(disc * 9.0, 900.0));
    gl_PointSize = aSize > 0.0 ? s : 0.0;
    if (aSize <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  }`;

const GAL_STAR_FRAG = `
  varying vec3 vCol;
  varying float vSpike;
  varying float vNear;
  void main() {
    vec2 q = gl_PointCoord * 2.0 - 1.0;
    float d2 = dot(q, q);
    float a = exp(-d2 * (vSpike > 0.5 ? 14.0 : 4.5));
    a = mix(a, exp(-d2 * 9.0) * 0.75, vNear);
    // thin cross through the middle, fading out to the tips
    float cross = max(exp(-q.x * q.x * 260.0), exp(-q.y * q.y * 260.0)) * (1.0 - sqrt(d2));
    a = max(a, cross * vSpike * 0.8 * (1.0 - vNear * 0.75));
    if (a < 0.01) discard;
    gl_FragColor = vec4(min(vCol * 1.35, vec3(1.0)), a);
  }`;

const galx = {
  pos: null, vel: null, col: null, siz: null, own: null,
  free: [], live: 0, geo: null, pts: null, stars: null, ssz: null, dirty: false,
  gpos: null, scol: null, rad: null, temp: null, kind: null,
  origin: new THREE.Vector3(), mesh: null, focus: -1
};

function initGalaxyStars() {
  // Positions are kept in doubles — a galaxy is real-sized now, ~10^12 Gm across
  // — and handed to the GPU relative to the camera (galx.gpos), so a single star
  // can be zoomed right into without it shaking about on a coarse float grid.
  galx.pos = new Float64Array(GAL_MAX * 3);
  galx.vel = new Float64Array(GAL_MAX * 3);
  galx.gpos = new Float32Array(GAL_MAX * 3);
  galx.scol = new Float32Array(GAL_MAX * 3);
  galx.rad = new Float32Array(GAL_MAX);
  galx.temp = new Float32Array(GAL_MAX);
  galx.kind = new Uint8Array(GAL_MAX);
  galx.col = new Float32Array(GAL_MAX * 3);
  galx.siz = new Float32Array(GAL_MAX);
  galx.ssz = new Float32Array(GAL_MAX);
  galx.own = new Int32Array(GAL_MAX);
  galx.free.length = 0;
  for (let i = GAL_MAX - 1; i >= 0; i--) { galx.free.push(i); galx.own[i] = -1; }
  galx.live = 0;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(galx.gpos, 3));
  geo.setAttribute('aSCol', new THREE.BufferAttribute(galx.scol, 3));
  geo.setAttribute('aRad', new THREE.BufferAttribute(galx.rad, 1));
  geo.setAttribute('aCol', new THREE.BufferAttribute(galx.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(galx.siz, 1));
  geo.setAttribute('aStar', new THREE.BufferAttribute(galx.ssz, 1));
  galx.geo = geo;
  // Each test particle is drawn as a soft puff of glowing gas sized in WORLD
  // units, not as a speck: thousands of them overlap into continuous clouds —
  // a bright bulge, arms of blue starlight and pink nebulae, tails that read as
  // streamers of gas rather than a spray of dots.
  galx.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uScale: { value: 1 }, uGain: { value: GAL_GAIN } },
    vertexShader: GAL_VERT, fragmentShader: GAL_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  galx.pts.frustumCulled = false;
  galx.pts.renderOrder = -5;             // behind every solid body in the scene
  scene.add(galx.pts);
  galx.stars = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uDpr: { value: VIEW.dpr }, uScale: { value: 1 } },
    vertexShader: GAL_STAR_VERT, fragmentShader: GAL_STAR_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  galx.stars.frustumCulled = false;
  galx.stars.renderOrder = -4;
  scene.add(galx.stars);

  const sm = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 40, 28), new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: GAL_SPHERE_VERT, fragmentShader: GAL_SPHERE_FRAG
  }), GAL_SPHERES);
  sm.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(GAL_SPHERES * 3), 3);
  sm.count = 0;
  sm.frustumCulled = false;
  scene.add(sm);
  galx.mesh = sm;
  initNebulae();
}

/**
 * Circular speed at radius r in a galaxy's own softened potential. Using the
 * same law the integrator uses is what makes a freshly built disc actually sit
 * still instead of immediately falling in or flying apart.
 */
function galVCirc(m, r, soft) {
  const dd = r * r + soft * soft;
  return Math.sqrt(G * settings.gravity * m * r * r / (dd * Math.sqrt(dd)));
}

/** Free every star belonging to a galaxy — called when one is removed. */
function freeGalaxyStars(id) {
  removeNebulae(id);
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] !== id) continue;
    galx.own[k] = -1;
    galx.siz[k] = 0;
    galx.free.push(k);
    galx.live--;
  }
  galx.dirty = true;
}

function clearGalaxyStars() {
  nebulae.length = 0;
  if (!galx.own) return;
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] < 0) continue;
    galx.own[k] = -1; galx.siz[k] = 0; galx.free.push(k); galx.live--;
  }
  galx.dirty = true;
}

/**
 * Lay out a galaxy's stars: a fat old bulge, then a disc wound into
 * logarithmic arms, every one of them on a circular orbit in the disc plane
 * with a little random dispersion so it is not a wire model.
 */
function seedGalaxyStars(b) {
  freeGalaxyStars(b.id);
  const rng = mulberry32(b.seed ^ 0x9e37);
  const gauss = () => (rng() + rng() + rng() + rng() - 2) * 0.5;
  const R = Math.max(b.galR, 1e-6);
  const soft = R * GAL_SOFT;
  const arms = b.galArms;

  // The disc plane. Two galaxies meeting at an angle is what makes a collision
  // interesting, so every galaxy gets its own tilt.
  const ax = b.galAxis;
  let u = new THREE.Vector3(0, 0, 1);
  if (Math.abs(ax.dot(u)) > 0.9) u.set(1, 0, 0);
  u.crossVectors(ax, u).normalize();
  const w = new THREE.Vector3().crossVectors(ax, u).normalize();
  const spin = b.galSpin || 1;

  const WIND = 3.2;
  const BULGE = [1.0, 0.84, 0.54];      // old, yellow core stars
  const ARM = [0.72, 0.84, 1.0];        // young, blue arm stars
  const HII = [1.0, 0.44, 0.60];        // pink hydrogen where stars are forming
  const DISC = [0.52, 0.50, 0.66];

  const shape = TYPES[b.type].shape || 'spiral';
  const OLD = [1.0, 0.78, 0.52];        // an elliptical's whole population
  // Irregulars and dwarfs are built round a handful of star-forming clumps.
  const clumps = [];
  if (shape === 'irregular' || shape === 'dwarf') {
    const nc = shape === 'dwarf' ? 2 + ((rng() * 2) | 0) : 4 + ((rng() * 4) | 0);
    for (let j = 0; j < nc; j++) {
      const a = rng() * TAU, d = Math.sqrt(rng()) * 0.62 * R;
      clumps.push([Math.cos(a) * d, Math.sin(a) * d, gauss() * 0.10 * R, 0.10 + rng() * 0.16]);
    }
  }
  const BULGE_SHARE = { spiral: 0.24, barred: 0.18, ring: 0.16, elliptical: 1, irregular: 0.08, dwarf: 0.06 }[shape];

  const want = Math.min(b.galN || GAL_STARS, galx.free.length);
  const mine = [];
  for (let i = 0; i < want; i++) {
    const k = galx.free.pop();
    const k3 = k * 3;
    const bulge = i < want * BULGE_SHARE;
    /* Each shape fills in the star's place in the galaxy's own frame — lx along
       u, ly along w, lz up the spin axis — its cloud colour and puff size, and
       whether it moves in the disc (`hot` false) or swarms on an orbit tipped
       at random, the way the stars of a bulge or an elliptical do. */
    let lx, ly, lz, c, s, hot = false, old = bulge, disp = 0.05;

    if (shape === 'elliptical') {
      // A triaxial egg, densest at the middle, all old stars.
      const r = R * 0.9 * Math.pow(rng(), 1.7) + R * 0.01;
      const d = new THREE.Vector3(gauss(), gauss(), gauss()).normalize();
      lx = d.x * r; ly = d.y * r * 0.78; lz = d.z * r * 0.62;
      const t = r / R;
      c = mix(OLD, [1, 0.95, 0.86], Math.pow(1 - t, 3) * 0.8);
      const dim = 0.30 + (1 - t) * 0.12;
      c = [c[0] * dim, c[1] * dim, c[2] * dim];
      s = R * (0.06 + rng() * 0.10) * (0.6 + t);
      hot = true; old = true; disp = 0.28;
    } else if (bulge) {
      const r = (0.02 + Math.pow(rng(), 2.1) * 0.20) * R;
      const th = rng() * TAU;
      lx = Math.cos(th) * r; ly = Math.sin(th) * r;
      lz = gauss() * r * 0.55;                      // a fat, round bulge
      c = mix(BULGE, [1, 1, 1], Math.pow(1 - r / (0.22 * R), 2) * 0.7);
      // a quarter of the puffs in a twentieth of the area: keep each one faint
      c = [c[0] * 0.45, c[1] * 0.45, c[2] * 0.45];
      s = R * (0.05 + rng() * 0.07);
      hot = true; disp = 0.34;
    } else if (shape === 'barred' && i < want * 0.40) {
      // The bar: a straight, crowded box of old stars across the middle.
      lx = (rng() * 2 - 1) * 0.40 * R;
      ly = gauss() * 0.055 * R;
      lz = gauss() * 0.025 * R;
      c = mix(BULGE, [1, 0.96, 0.88], 0.4);
      c = [c[0] * 0.5, c[1] * 0.5, c[2] * 0.5];
      s = R * (0.04 + rng() * 0.05);
      old = true; disp = 0.10;
    } else if (shape === 'ring') {
      // Nothing between the core and the ring; the ring itself is all young.
      const r = R * (0.74 + gauss() * 0.07);
      const th = rng() * TAU;
      lx = Math.cos(th) * r; ly = Math.sin(th) * r;
      lz = gauss() * 0.02 * R;
      const knot = rng() < 0.2;
      c = knot ? HII : ARM;
      const dim = knot ? 3.0 : 1.1;
      c = [c[0] * dim, c[1] * dim, c[2] * dim];
      s = knot ? R * (0.012 + rng() * 0.014) : R * (0.03 + rng() * 0.04);
    } else if (clumps.length) {
      // Irregular and dwarf: lumps of young stars and pink gas, no order at all.
      const cl = clumps[(rng() * clumps.length) | 0];
      lx = cl[0] + gauss() * cl[3] * R;
      ly = cl[1] + gauss() * cl[3] * R;
      lz = cl[2] + gauss() * cl[3] * 0.5 * R;
      const knot = rng() < 0.25;
      c = knot ? HII : mix(ARM, DISC, rng() * 0.5);
      const dim = knot ? 2.0 : 0.5;
      c = [c[0] * dim, c[1] * dim, c[2] * dim];
      s = knot ? R * (0.015 + rng() * 0.02) : R * (0.04 + rng() * 0.06);
      disp = 0.15;
    } else {
      // Spiral arms; for a barred spiral they start at the ends of the bar.
      const r0 = shape === 'barred' ? 0.40 : 0.14;
      const r = (r0 + Math.sqrt(rng()) * (1 - r0)) * R;
      const t = r / R;
      const spread = (0.16 + t * 0.34) * gauss() * 2.2;
      const th = shape === 'barred'
        ? Math.log(t / r0) * WIND * 0.8 + ((rng() * 2) | 0) * Math.PI + spread
        : Math.log(Math.max(t, 0.02) / 0.10) * WIND + ((rng() * arms) | 0) * (TAU / arms) + spread;
      lx = Math.cos(th) * r; ly = Math.sin(th) * r;
      lz = gauss() * (0.012 + t * 0.020) * R;       // a thin disc
      const onArm = clamp(1 - Math.abs(spread) / (0.2 + t * 0.4), 0, 1);
      c = mix(DISC, ARM, onArm);
      // Star-forming knots are small, tight and bright; the rest is broad haze.
      const knot = onArm > 0.55 && rng() < 0.15;
      if (knot) c = mix(c, HII, 0.85);
      const dim = (0.42 + onArm * 0.8) * (knot ? 3.2 : 1);
      c = [c[0] * dim, c[1] * dim, c[2] * dim];
      s = knot ? R * (0.012 + rng() * 0.014)
        : R * (0.03 + rng() * 0.05) * (0.8 + t * 0.6) * (1 + (1 - onArm) * 1.6);   // between the arms, broad faint haze
    }

    galx.pos[k3] = b.p.x + u.x * lx + w.x * ly + ax.x * lz;
    galx.pos[k3 + 1] = b.p.y + u.y * lx + w.y * ly + ax.y * lz;
    galx.pos[k3 + 2] = b.p.z + u.z * lx + w.z * ly + ax.z * lz;

    let tx, ty, tz, vc;
    if (hot && shape === 'elliptical') {
      // Round the middle on an orbit tipped at random: no disc, no net spin.
      const rr = Math.hypot(lx, ly, lz);
      const rad = new THREE.Vector3(u.x * lx + w.x * ly + ax.x * lz, u.y * lx + w.y * ly + ax.y * lz, u.z * lx + w.z * ly + ax.z * lz).normalize();
      const tan = new THREE.Vector3(gauss(), gauss(), gauss()).cross(rad).normalize();
      tx = tan.x; ty = tan.y; tz = tan.z;
      vc = galVCirc(b.m, rr, soft) * rnd(0.6, 0.95);
    } else {
      // Circular in the disc plane, plus a small random dispersion — real discs
      // are warm, and a perfectly cold one looks like a diagram.
      const rr = Math.hypot(lx, ly), th = Math.atan2(ly, lx);
      const ct = Math.cos(th), st = Math.sin(th);
      tx = (-u.x * st + w.x * ct) * spin; ty = (-u.y * st + w.y * ct) * spin; tz = (-u.z * st + w.z * ct) * spin;
      vc = galVCirc(b.m, rr, soft) * (hot ? rnd(0.55, 0.95) : rnd(0.97, 1.03));
    }
    const dv = vc * disp;
    galx.vel[k3] = b.v.x + tx * vc + gauss() * dv;
    galx.vel[k3 + 1] = b.v.y + ty * vc + gauss() * dv;
    galx.vel[k3 + 2] = b.v.z + tz * vc + gauss() * dv;

    galx.col[k3] = c[0]; galx.col[k3 + 1] = c[1]; galx.col[k3 + 2] = c[2];
    galx.siz[k] = s;
    // What kind of star this actually is. Blue giants live on the young arms.
    setGalStar(k, pickGalKind(old, c[2] > c[0] && rng() < 0.7, rng), rng);
    galx.own[k] = b.id;
    galx.live++;
    mine.push(k);
  }

  /* ---- star clusters. Globulars: tight balls of ancient stars swarming
     round the halo on orbits tipped every way. Open clusters: little families
     of young stars on the arms, still together where they were born. */
  const CL = { spiral: [12, 14], barred: [12, 14], ring: [6, 10], irregular: [3, 8], dwarf: [2, 2], elliptical: [24, 0] }[shape];
  let lo = 0, hi = mine.length - 1;
  for (let ci = 0; ci < CL[0] && hi - lo > 60; ci++) {
    const rc = (25 + rng() * 45) * LY_GM;
    const d = new THREE.Vector3(gauss(), gauss(), gauss()).normalize();
    const rr = R * (0.12 + Math.pow(rng(), 0.8) * 0.85);
    const tan = new THREE.Vector3(gauss(), gauss(), gauss()).cross(d).normalize();
    const vcen = galVCirc(b.m, rr, soft) * rnd(0.6, 0.9);
    let first = -1;
    for (let m = 0; m < 40; m++) {
      const k = mine[lo++], k3 = k * 3;
      if (first < 0) first = k;
      galx.pos[k3] = b.p.x + d.x * rr + gauss() * rc * 1.4;
      galx.pos[k3 + 1] = b.p.y + d.y * rr + gauss() * rc * 1.4;
      galx.pos[k3 + 2] = b.p.z + d.z * rr + gauss() * rc * 1.4;
      galx.vel[k3] = b.v.x + tan.x * vcen + gauss() * vcen * 0.01;
      galx.vel[k3 + 1] = b.v.y + tan.y * vcen + gauss() * vcen * 0.01;
      galx.vel[k3 + 2] = b.v.z + tan.z * vcen + gauss() * vcen * 0.01;
      galx.col[k3] = 0.55; galx.col[k3 + 1] = 0.46; galx.col[k3 + 2] = 0.32;
      galx.siz[k] = rc * 2.5;
      setGalStar(k, pickGalKind(true, false, rng), rng);
    }
    nebulae.push({ gal: b.id, k: first, kind: 'globular', R: rc * 2, puffs: [],
      name: (rng() < 0.5 ? 'NGC ' : 'M ') + (1 + ((rng() * 7800) | 0)) });
  }
  for (let ci = 0; ci < CL[1] && hi - lo > 30; ci++) {
    const a = mine[hi--], a3 = a * 3;
    const rc = (4 + rng() * 8) * LY_GM;
    for (let m = 0; m < 14; m++) {
      const k = m === 0 ? a : mine[hi--], k3 = k * 3;
      if (m > 0) {
        galx.pos[k3] = galx.pos[a3] + gauss() * rc; galx.pos[k3 + 1] = galx.pos[a3 + 1] + gauss() * rc;
        galx.pos[k3 + 2] = galx.pos[a3 + 2] + gauss() * rc;
        galx.vel[k3] = galx.vel[a3]; galx.vel[k3 + 1] = galx.vel[a3 + 1]; galx.vel[k3 + 2] = galx.vel[a3 + 2];
        galx.siz[k] = rc;
      }
      const r = rng();
      setGalStar(k, r < 0.2 ? 3 : r < 0.5 ? 2 : 1, rng);
    }
    nebulae.push({ gal: b.id, k: a, kind: 'open', R: rc * 2.5, puffs: [],
      name: (rng() < 0.5 ? 'NGC ' : 'Collinder ') + (1 + ((rng() * 7800) | 0)) });
  }

  galx.dirty = true;
  if (nebx.pts) seedNebulae(b);
}

/** Every galaxy core in the scene, with the softening its own disc implies. */
const galCores = [];
function refreshGalCores() {
  galCores.length = 0;
  for (const b of sim.bodies) {
    if (b.kind === 'gal' && b.alive) galCores.push(b);
  }
}

/**
 * Move the stars. Symplectic Euler — kick then drift — one force evaluation per
 * step, and stable over the many orbits a collision takes.
 */
function stepGalaxyStars(dt) {
  if (galx.live === 0 || galCores.length === 0) return;
  const gm = G * settings.gravity;
  const n = galCores.length;
  // Hoisted so the inner loop is plain arithmetic.
  const cx = [], cy = [], cz = [], cm = [], cs = [];
  for (let i = 0; i < n; i++) {
    const g = galCores[i];
    cx.push(g.p.x); cy.push(g.p.y); cz.push(g.p.z);
    cm.push(gm * g.m);
    const so = Math.max(g.galR * GAL_SOFT, 1e-6);
    cs.push(so * so);
  }

  const pos = galx.pos, vel = galx.vel;
  for (let k = 0; k < GAL_MAX; k++) {
    if (galx.own[k] < 0) continue;
    const k3 = k * 3;
    const px = pos[k3], py = pos[k3 + 1], pz = pos[k3 + 2];
    let ax = 0, ay = 0, az = 0;
    for (let i = 0; i < n; i++) {
      const dx = cx[i] - px, dy = cy[i] - py, dz = cz[i] - pz;
      // Plummer softening on the core, standing in for the fact that a galaxy's
      // mass is spread through a bulge and a halo rather than sitting in a point.
      const dd = dx * dx + dy * dy + dz * dz + cs[i];
      const f = cm[i] / (dd * Math.sqrt(dd));
      ax += dx * f; ay += dy * f; az += dz * f;
    }
    vel[k3] += ax * dt; vel[k3 + 1] += ay * dt; vel[k3 + 2] += az * dt;
    pos[k3] += vel[k3] * dt; pos[k3 + 1] += vel[k3 + 1] * dt; pos[k3 + 2] += vel[k3 + 2] * dt;
  }
  galx.dirty = true;
}

/**
 * Dynamical friction, and the merger it causes.
 *
 * Two galaxies on a passing orbit would, as bare point masses, swing past each
 * other and separate forever. Real ones do not: each one ploughs through the
 * other's stars and halo, leaves a wake of material pulled in behind it, and
 * that wake pulls back. The orbit decays, they fall together again, and after
 * a few passes they coalesce. Chandrasekhar worked the effect out in 1943, and
 * it is the single reason galaxy mergers happen at all.
 *
 * The version here is deliberately crude — a drag on the relative motion that
 * switches on once the discs overlap — but it is applied as an equal and
 * opposite impulse, so momentum is conserved exactly.
 */
/* Deliberately weak, and very steep. A grazing pass should barely be damped —
   that is the pass that throws the tails — while a deep one, where the cores
   are ploughing through the thick of each other, is damped hard. Get this
   wrong in the other direction and the first approach turns straight into a
   plunge, the discs are scrambled into a featureless halo, and you never see
   a tail at all. */
const GAL_FRICTION = 0.022;

function updateGalaxyPairs(dt) {
  const gs = galCores;
  for (let i = 0; i < gs.length; i++) {
    for (let j = i + 1; j < gs.length; j++) {
      const a = gs[i], b = gs[j];
      if (!a.alive || !b.alive) continue;
      const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const reach = a.galR + b.galR;
      if (d >= reach) continue;

      // Overlap fraction: nothing at first touch, everything at the centre.
      const over = clamp(1 - d / Math.max(reach, 1e-9), 0, 1);
      const k = clamp(GAL_FRICTION * over * over * over * dt, 0, 0.5);
      const mu = a.m * b.m / Math.max(a.m + b.m, 1e-12);
      const rvx = b.v.x - a.v.x, rvy = b.v.y - a.v.y, rvz = b.v.z - a.v.z;
      // Equal and opposite, so the pair's momentum does not move.
      a.v.x += rvx * k * mu / a.m; a.v.y += rvy * k * mu / a.m; a.v.z += rvz * k * mu / a.m;
      b.v.x -= rvx * k * mu / b.m; b.v.y -= rvy * k * mu / b.m; b.v.z -= rvz * k * mu / b.m;

      // Close enough that there is only one galaxy left.
      if (d < reach * 0.055) { mergeGalaxies(a.m >= b.m ? a : b, a.m >= b.m ? b : a); return; }
    }
  }
}

/**
 * Two galaxies become one. The stars are not thrown away — they are handed over
 * exactly where they are, still moving exactly as they were, which is why the
 * remnant is the shapeless blob a real merger leaves rather than a tidy new
 * spiral. This is how elliptical galaxies are made.
 */
function mergeGalaxies(a, b) {
  const mTot = a.m + b.m;
  a.p.multiplyScalar(a.m / mTot).addScaledVector(b.p, b.m / mTot);
  a.v.multiplyScalar(a.m / mTot).addScaledVector(b.v, b.m / mTot);
  a.m = mTot;
  // The remnant is puffed up by everything the collision stirred.
  a.galR = Math.max(a.galR, b.galR) * 1.18;
  a.galMerged = (a.galMerged || 0) + 1 + (b.galMerged || 0);

  // Hand the other galaxy's stars over where they stand.
  for (let k = 0; k < GAL_MAX; k++) if (galx.own[k] === b.id) galx.own[k] = a.id;
  for (const nb of nebulae) if (nb.gal === b.id) nb.gal = a.id;
  galx.dirty = true;

  fx.flash(a.p, a.galR * 0.25, [255, 240, 210], 0.9);
  toast(a.name + ' and ' + b.name + ' have merged into one galaxy');
  if (sim.selected === b) select(a);
  removeBody(b);
  compact();
  refreshGalCores();
}

/*
 * How long one turn of the outer disc takes. A real galaxy takes about 230
 * million years; here it takes eleven, because the whole object is built at a
 * size the sandbox can hold and the clock has to be compressed to match.
 * Fixing the PERIOD rather than the mass is what keeps a galaxy looking right
 * however big you make it — the shapes and the dynamics stay honest, and only
 * the scale is compressed.
 */
const GAL_PERIOD = 4000;      // days for one turn at the disc edge
const GAL_R_MW = 50000 * 9.46073e6; // the Milky Way's disc, ~50,000 light-years, in Gm

/** The core mass a galaxy of this size needs for that rotation period. */
const galMassFor = (R, P) =>
  4 * Math.PI * Math.PI * R * R * R / (G * (P || GAL_PERIOD) * (P || GAL_PERIOD));
/* The one exception: the Milky Way map turns at its real rate, once every 230
   million years. At the sandbox's eleven-year turn its tides would be ten
   trillion times too strong and would strip the planets straight off the Sun. */
const MW_PERIOD = 230e6 * 365.25;

function buildGalaxy(b, grp) {
  const rng = mulberry32(b.seed);
  b.galArms = b.galArms || (TYPES[b.type].shape === 'barred' || rng() < 0.62 ? 2 : 4);
  b.galSpin = b.galSpin || (rng() < 0.5 ? 1 : -1);
  const def = TYPES[b.type];
  if (b.galN == null && def.stars) b.galN = def.stars;
  if (b.galR == null) {
    // Real size: for a spiral, between half and one and a half Milky Ways;
    // every other kind has its own range.
    const sc = def.scale || [0.5, 1.5];
    b.galR = GAL_R_MW * lerp(sc[0], sc[1], rng());
    b.m = galMassFor(b.galR, b.galPeriod);
  }
  if (!b.galAxis) {
    const sw = rng() * TAU;
    b.galAxis = new THREE.Vector3(0, 1, 0)
      .applyAxisAngle(new THREE.Vector3(Math.cos(sw), 0, Math.sin(sw)), (rng() - 0.5) * 1.9)
      .normalize();
  }

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_HALO, color: new THREE.Color(0xfff0c4), opacity: 0.5,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  }));
  core.renderOrder = -4;
  grp.add(core);
  b.parts.galCore = core;

  /* The supermassive black hole at the very middle, at its real size: a few
     million Suns in a spiral (Sagittarius A* is 4.3 million), billions in a
     giant elliptical, a few hundred thousand in a dwarf. */
  const shape = TYPES[b.type].shape || 'spiral';
  const f = Math.pow(b.galR / GAL_R_MW, 2) * (shape === 'elliptical' ? 30 : shape === 'dwarf' ? 3 : 1);
  b.smbhM = 4.3e6 * M_SUN * f;
  const shadow = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  const ring = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, color: new THREE.Color(0xcfe0ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const disk = makeGasDisk();
  disk.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), b.galAxis);
  grp.add(shadow); grp.add(ring); grp.add(disk);
  b.parts.smbhShadow = shadow; b.parts.smbhRing = ring; b.parts.smbhDisk = disk;
  b.lightColor = new THREE.Color(0xffe6b8);

  seedGalaxyStars(b);
}

function updateGalaxies() {
  for (const b of sim.bodies) {
    if (b.kind !== 'gal' || !b.parts) continue;
    b.obj.position.copy(b.p);
    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    // The glow standing in for the unresolved crowd of stars in the bulge.
    if (b.parts.galCore) {
      b.parts.galCore.scale.setScalar(Math.max(b.galR * 0.22, 18 * wpp));
      // Seen from outside it stands in for the bulge's unresolved glare. From
      // inside the galaxy the bulge is resolved into its own clouds and stars,
      // and a sprite that size round the camera only floods the view.
      const dc = camera.position.distanceTo(b.p) / b.galR;
      const out = clamp((dc - 0.7) / 1.3, 0, 1);
      b.parts.galCore.material.opacity = clamp(0.55 - (b.galMerged ? 0.2 : 0), 0.2, 0.6) * out;
      b.parts.galCore.visible = out > 0.01;
    }
    if (b.parts.dot) b.parts.dot.visible = false;
    if (b.parts.smbhShadow) {
      const rv = schwarzschild(b.smbhM) * 2.6;
      b.parts.smbhShadow.scale.setScalar(rv);
      b.parts.smbhDisk.scale.setScalar(rv * 7);
      b.parts.smbhRing.scale.setScalar(rv * 5.6);
      // in the galaxy's own plane (a map may tilt the galaxy after building it)
      b.parts.smbhDisk.quaternion.setFromUnitVectors(_ZAXIS, b.galAxis);
      // only worth drawing once it is more than a speck
      const on = rv * 7 / wpp > 1.5;
      b.parts.smbhShadow.visible = b.parts.smbhRing.visible = b.parts.smbhDisk.visible = on;
    }
  }
  if (galx.pts) {
    // world radius -> pixels at unit distance
    const S = VIEW.h * VIEW.dpr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    galx.stars.material.uniforms.uDpr.value = VIEW.dpr;
    galx.pts.material.uniforms.uScale.value = S;
    galx.stars.material.uniforms.uScale.value = S;
    if (galx.live > 0) placeGalaxyStars(S);
    else {
      if (galx.mesh) galx.mesh.count = 0;
      if (galx.planets) galx.planets.count = 0;
      if (galx.orbits) galx.orbits.visible = false;
      if (nebx.geo) nebx.geo.setDrawRange(0, 0);
    }
    if (galx.dirty) {
      galx.geo.attributes.aSCol.needsUpdate = true;
      galx.geo.attributes.aRad.needsUpdate = true;
      galx.geo.attributes.aCol.needsUpdate = true;
      galx.geo.attributes.aSize.needsUpdate = true;
      galx.geo.attributes.aStar.needsUpdate = true;
      galx.dirty = false;
    }
  }
}

/**
 * Hand the GPU every star relative to the camera, and give the few close
 * enough to show a disc a real sphere. Run every frame: the camera and the
 * stars both move, and 34,000 subtractions is nothing.
 */
const _gm = new THREE.Matrix4(), _gq = new THREE.Quaternion(), _gs = new THREE.Vector3(), _gt = new THREE.Vector3();
const _gNear = [];
function placeGalaxyStars(S) {
  const o = galx.origin.copy(camera.position);
  const pos = galx.pos, gp = galx.gpos, own = galx.own, rad = galx.rad;
  _gNear.length = 0;
  _gSys.length = 0;
  const sysR = 40 * AU * S;              // a planetary system's width, for its pixel test
  for (let k = 0; k < GAL_MAX; k++) {
    if (own[k] < 0) continue;
    const k3 = k * 3;
    const x = pos[k3] - o.x, y = pos[k3 + 1] - o.y, z = pos[k3 + 2] - o.z;
    gp[k3] = x; gp[k3 + 1] = y; gp[k3 + 2] = z;
    const d = Math.max(Math.sqrt(x * x + y * y + z * z), 1e-9);
    const px = rad[k] * S / d;
    if (px > 0.8) _gNear.push(px, k);
    if (sysR / d > 10) _gSys.push(sysR / d, k);
  }
  placePlanets(S);
  galx.geo.attributes.position.needsUpdate = true;
  galx.pts.position.copy(o);
  galx.stars.position.copy(o);

  const sm = galx.mesh;
  if (!sm) return;
  sm.position.copy(o);
  // The biggest-looking ones win the spheres.
  const idx = [];
  for (let i = 0; i < _gNear.length; i += 2) idx.push(i);
  if (idx.length > GAL_SPHERES) idx.sort((a, b) => _gNear[b] - _gNear[a]).length = GAL_SPHERES;
  let n = 0;
  for (const i of idx) {
    const k = _gNear[i + 1], k3 = k * 3;
    _gt.set(gp[k3], gp[k3 + 1], gp[k3 + 2]);
    _gs.setScalar(rad[k]);
    sm.setMatrixAt(n, _gm.compose(_gt, _gq, _gs));
    if (galx.kind[k] === GAL_BH) sm.instanceColor.setXYZ(n, 0, 0, 0);
    else sm.instanceColor.setXYZ(n, galx.scol[k3], galx.scol[k3 + 1], galx.scol[k3 + 2]);
    n++;
  }
  sm.count = n;
  sm.instanceMatrix.needsUpdate = true;
  sm.instanceColor.needsUpdate = true;
  sm.material.uniforms.uTime.value = performance.now() / 1000;
  placeNebulae(S, o);
}

/* ================================================================ universes */
/*
 * A universe is a bubble of space with galaxies in it, all flying apart. It is
 * not a body — it has no mass of its own and feels nothing — but a duck-typed
 * object like a supernova remnant, so it can be selected, followed, labelled
 * and zoomed to. Its centre and size are worked out every frame from the
 * galaxies it owns: it grows as they spread, and dies when they are gone.
 *
 * The expansion is just velocity: each galaxy is launched away from the centre
 * at a speed proportional to its distance (Hubble's law), fast enough to beat
 * their mutual gravity, so it carries on forever. BIG CRUNCH reverses it: the
 * galaxies are steered back in, merge, and what is left becomes a singularity.
 */
const universes = [];
let uniCount = 0;
const UNI_R = 14 * GAL_R_MW;           // radius at birth, ~700,000 light-years
const UNI_EXPAND = 2600;               // days for the bubble to double, early on
const UNI_CRUNCH = 260;                // e-folding time of a crunch, in days
// What a universe is made of, by rough share: spirals, then ellipticals and dwarfs.
const UNI_MIX = ['galaxy', 'galaxy', 'galaxy', 'barred_galaxy', 'barred_galaxy', 'elliptical_galaxy',
  'elliptical_galaxy', 'irregular_galaxy', 'ring_galaxy', 'dwarf_galaxy', 'dwarf_galaxy'];

const UNI_VERT = `
  #include <common>
  #include <logdepthbuf_pars_vertex>
  varying vec3 vN;
  varying vec3 vV;
  varying vec3 vP;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = -mv.xyz;
    vP = position;
    gl_Position = projectionMatrix * mv;
    #include <logdepthbuf_vertex>
  }`;
const UNI_FRAG = `
  #include <common>
  #include <logdepthbuf_pars_fragment>
  uniform float uTime;
  uniform float uFade;
  varying vec3 vN;
  varying vec3 vV;
  varying vec3 vP;
  vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }
  void main() {
    #include <logdepthbuf_fragment>
    float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(f, 3.0);
    // a soap-film shimmer that drifts over the skin
    vec3 c = hue(vP.y * 0.8 + vP.x * 0.5 + uTime * 0.05 + rim * 0.6);
    c = mix(c, vec3(0.75, 0.6, 1.0), 0.45);
    gl_FragColor = vec4(c, (rim * 0.75 + 0.025) * uFade);
  }`;

function makeUniverse(at, vel, opts) {
  const o = opts || {};
  const rng = mulberry32((Math.random() * 1e9) | 0);
  const u = {
    kind: 'uni', alive: true, id: 'u' + (++uniCount),
    name: o.name || (uniCount === 1 ? 'Universe' : 'Universe ' + uniCount),
    // Born in a Big Bang, the bubble starts from nothing and grows with what
    // is inside it.
    type: 'universe', p: at.clone(), v: vel.clone(), r: UNI_R, R: o.bang ? 0 : UNI_R,
    members: [], age: 0, crunch: false, flash: o.bang ? 0 : -1, seed: (rng() * 1e9) | 0,
    v0: vel.clone()                      // its drift at birth, which a crunch hands back
  };
  /* Galaxies, scattered through the ball and each launched outwards by
     Hubble's law — the further out, the faster it goes. */
  const n = o.n || (6 + ((rng() * 4) | 0));
  const H = 1 / UNI_EXPAND;
  for (let i = 0; i < n; i++) {
    const dir = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1);
    if (dir.lengthSq() < 1e-4) dir.set(1, 0, 0);
    dir.normalize();
    const dist = UNI_R * (o.bang ? 0.12 + rng() * 0.18 : 0.25 + Math.cbrt(rng()) * 0.6);
    const pos = at.clone().addScaledVector(dir, dist);
    const v = vel.clone().addScaledVector(dir, dist * H * (o.bang ? 2.4 : 1));
    if (sim.bodies.length >= MAX_BODIES) break;
    const kind = UNI_MIX[(rng() * UNI_MIX.length) | 0];
    const g = makeBody(kind, pos, v);
    const sc = TYPES[kind].scale || [0.5, 1.5];
    g.galR = GAL_R_MW * lerp(sc[0], sc[1], rng()) * 0.6;
    g.galN = kind === 'dwarf_galaxy' ? 1400 : 3200;
    g.m = galMassFor(g.galR);
    g.galAxis = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1).normalize();
    seedGalaxyStars(g);
    g.universe = u.id;
    u.members.push(g);
  }

  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uFade: { value: 1 } },
    vertexShader: UNI_VERT, fragmentShader: UNI_FRAG,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  }));
  mesh.frustumCulled = false;
  mesh.renderOrder = -6;
  scene.add(mesh);
  u.mesh = mesh;
  if (o.bang) {
    // The flash: a ball of light, brightest through its middle, swelling out
    // from the point. A mesh rather than a sprite — a sprite this many times
    // wider than the camera's distance tears into wedges at the screen edge.
    const fl = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), new THREE.ShaderMaterial({
      uniforms: { uCol: { value: new THREE.Color(1, 1, 1) }, uOp: { value: 1 } },
      vertexShader: UNI_VERT,
      fragmentShader: `
        #include <common>
        #include <logdepthbuf_pars_fragment>
        uniform vec3 uCol;
        uniform float uOp;
        varying vec3 vN;
        varying vec3 vV;
        void main() {
          #include <logdepthbuf_fragment>
          float c = abs(dot(normalize(vN), normalize(vV)));
          gl_FragColor = vec4(uCol, pow(c, 2.2) * uOp);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    fl.frustumCulled = false;
    fl.renderOrder = 8;
    scene.add(fl);
    u.flashSprite = fl;
  }
  universes.push(u);
  computeAccel();
  return u;
}

function disposeUniverse(u) {
  u.alive = false;
  if (u.mesh) { scene.remove(u.mesh); u.mesh.geometry.dispose(); u.mesh.material.dispose(); }
  if (u.flashSprite) { scene.remove(u.flashSprite); u.flashSprite.geometry.dispose(); u.flashSprite.material.dispose(); }
  const i = universes.indexOf(u);
  if (i >= 0) universes.splice(i, 1);
  if (sim.selected === u) select(null);
  if (sim.follow === u) sim.follow = null;
}

/** Remove a universe and everything in it. */
function removeUniverse(u) {
  for (const g of u.members) if (g.alive) removeBody(g);
  compact();
  disposeUniverse(u);
}

function clearUniverses() {
  while (universes.length) disposeUniverse(universes[0]);
}

/** Cosmic events take thousands of days; make sure the clock is fast enough
    to watch one happen. Never slows a clock that is already faster. */
function cosmicPace() {
  if (sim.rate < RATES[7]) setRate(RATES[7]);
  if (!sim.running) togglePlay();
}

/** A singularity goes off: in its place, a brand-new universe. */
function bigBang(b) {
  if (!b || !b.alive) return;
  const at = b.p.clone(), vel = b.v.clone(), name = b.name;
  select(null);
  removeBody(b);
  compact();
  const u = makeUniverse(at, vel, { bang: true });
  select(u);
  sim.follow = u;
  view.target.copy(at);
  view.dist = UNI_R * 3.2;
  cosmicPace();
  toast('BIG BANG! ' + name + ' became ' + u.name + ' — ' + u.members.length + ' galaxies and counting.');
}

/** Turn the expansion round. */
function bigCrunch(u) {
  if (!u.alive || u.crunch) return;
  u.crunch = true;
  cosmicPace();
  toast(u.name + ' has stopped expanding… and is falling back in on itself.');
  renderInspector();
}

const _uc = new THREE.Vector3(), _uv = new THREE.Vector3();
function updateUniverses(realDt, simDt) {
  for (let i = universes.length - 1; i >= 0; i--) {
    const u = universes[i];
    u.members = u.members.filter(g => g.alive);
    if (u.members.length === 0) {
      toast(u.name + ' is empty, and its bubble has popped.');
      disposeUniverse(u);
      continue;
    }
    u.age += simDt;
    // Centre and drift: the mass-weighted middle of what is left in it.
    let M = 0;
    _uc.set(0, 0, 0); _uv.set(0, 0, 0);
    for (const g of u.members) { _uc.addScaledVector(g.p, g.m); _uv.addScaledVector(g.v, g.m); M += g.m; }
    _uc.divideScalar(M); _uv.divideScalar(M);
    u.p.copy(_uc); u.v.copy(_uv);
    let far = 0, galR = 0;
    for (const g of u.members) { far = Math.max(far, g.p.distanceTo(u.p)); galR = Math.max(galR, g.galR); }
    // The skin sits a little beyond the outermost galaxy and never shrinks
    // faster than it does, so it reads as the edge of space, not a balloon.
    const want = far * 1.25 + galR * 1.6;
    u.R = u.crunch ? want : Math.max(u.R, want);
    u.r = u.R;

    if (u.crunch && simDt > 0) {
      // Steer every galaxy back to the middle, closing the gap by a fixed
      // fraction each day: it converges without ever overshooting.
      const k = Math.min(simDt / UNI_CRUNCH, 0.9) / Math.max(simDt, 1e-9);
      for (const g of u.members) {
        g.v.copy(u.v).addScaledVector(_uc.copy(u.p).sub(g.p), k);
      }
      if (far < galR * 0.6 || u.members.length === 1 && u.age > 0) {
        const at = u.p.clone(), vel = u.v0.clone(), name = u.name;
        for (const g of u.members) if (g.alive) removeBody(g);
        compact();
        disposeUniverse(u);
        const s = makeBody('singularity', at, vel);
        select(s);
        sim.follow = s;
        view.target.copy(at);
        view.dist = Math.max(visRadius(s) * 60, 1e-3);
        fx.form && fx.form(s, true);
        toast('BIG CRUNCH! ' + name + ' collapsed into ' + s.name + '.');
        continue;
      }
    }

    u.mesh.position.copy(u.p);
    u.mesh.scale.setScalar(u.R);
    u.mesh.material.uniforms.uTime.value = performance.now() / 1000;
    // Inside the bubble, the skin is all around you and should not wash out
    // the view: fade it as the camera crosses in.
    const inside = camera.position.distanceTo(u.p) / u.R;
    u.mesh.material.uniforms.uFade.value = clamp((inside - 0.6) / 0.5, 0.15, 1);

    if (u.flashSprite) {
      u.flash += realDt;
      const t = u.flash / 2.6;
      if (t >= 1) { scene.remove(u.flashSprite); u.flashSprite.geometry.dispose(); u.flashSprite.material.dispose(); u.flashSprite = null; }
      else {
        u.flashSprite.position.copy(u.p);
        u.flashSprite.scale.setScalar(UNI_R * (0.05 + t * 1.4));
        u.flashSprite.material.uniforms.uOp.value = Math.pow(1 - t, 1.6);
        u.flashSprite.material.uniforms.uCol.value.setHSL(0.10 - t * 0.1, 1, 0.9 - t * 0.35);
      }
    }
  }
}

/* ================================================================== nebulae */
/*
 * Clouds of glowing gas inside the galaxies, at their real sizes. Each one is
 * pinned to a star in its galaxy (`k`, a galaxy-star slot) so it is carried
 * round with the disc, and drawn as a few dozen cloudy billboards from a small
 * atlas of noise textures, camera-relative like the stars.
 *
 *   EMISSION    stellar nurseries: hydrogen glowing red-pink, oxygen teal at
 *               the hot middle. Hundreds of light-years across (Orion, Carina,
 *               the Tarantula). Strung along the young spiral arms.
 *   REFLECTION  dust with no light of its own, lit blue by nearby stars.
