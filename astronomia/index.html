    '<li><b>Click a body</b> to select it. The panel on the right shows its real mass, density, speed and temperature, and lets you resize it.</li>' +
    '<li><b>Click any value</b> in that panel (the ones with a dotted line under them) to <b>type it in</b> instead of dragging. Units are optional: <b>2.5 M☉</b>, <b>3 Jupiters</b>, <b>6e24 kg</b>, <b>5000 km</b>, <b>10 hours</b>, <b>300 °C</b> — leave one off and it uses the unit already shown. Press Enter to set it, Esc to cancel.</li>' +
    '<li><b>Click its name</b> in that panel to rename it — type anything and press Enter.</li>' +
    '<li>While something is armed a <b>measuring grid</b> appears on the plane you are dropping onto. The hint at the bottom says how wide one square is, so you can space a system out on purpose. Turn on <b>Snap to the grid</b> in Settings and drops land exactly on the crossings.</li>' +
    '<li>The <b>Solar System</b> group at the bottom of the list holds all eight real planets — plus the Sun, the Moon and Pluto — with their real masses, widths, spin periods and axial tilts. Uranus really is tipped over on its side, and Venus really does spin backwards.</li>' +
    '</ul>' +
    '<h3>CUSTOMISE — CHANGING ANYTHING YOU LIKE</h3>' +
    '<ul>' +
    '<li>Every selected body has a <b>CUSTOMISE</b> section. Open it and you can change its <b>radius</b> (mass stays put, so it gets denser or lighter), how fast it <b>spins</b> and which way round, how far over it <b>leans</b>, how hot it is <b>inside</b>, and what <b>colour</b> it is.</li>' +
    '<li>Switch on <b>Has rings</b> and any world at all gets a set. Then drag the <b>inner and outer edges</b>, how <b>solid</b> they are, and pick <b>two colours</b> for the ringlets to be painted between.</li>' +
    '<li><b>RESET TO …</b> at the bottom puts everything back the way that kind of body normally is.</li>' +
    '<li>Wind the <b>spin</b> below <b>0.02 hours</b> a turn and the body cannot survive it. Its equator is now moving faster than gravity can hold on to, so it <b>throws its outer layers off from the middle</b> — in the plane it is spinning in, in the direction it is turning — and keeps going until only its dense core is left. A gas giant stripped that far is a <b>chthonian world</b>; a rocky one is an <b>iron world</b>. Real asteroids do this: Bennu is losing material off its equator right now, and almost none spin faster than one turn in two hours, because the ones that did are gone.</li>' +
    '</ul>' +
    '<h3>TERRAFORMING: BRINGING A DEAD WORLD TO LIFE</h3>' +
    '<ul>' +
    '<li>Select any rocky world and the panel has a <b>TERRAFORMING</b> section. If it can be brought to life, there is a button. If it cannot, it tells you exactly what is wrong — and that is the real point of it.</li>' +
    '<li>Three things have to be true, and they are the three things that actually decide whether a world can be lived on:</li>' +
    '<li><b>Heavy enough.</b> Under about a twentieth of an Earth its gravity cannot hold an atmosphere down and the air leaks away into space. That is not a made-up rule — it is precisely why <b>Mars</b> is a frozen desert with a hundredth of our air pressure, despite once having rivers running across it.</li>' +
    '<li><b>Not too heavy.</b> Past about twenty Earths a rocky world starts holding on to hydrogen as well, and turns into a small Neptune with no surface at all to stand on.</li>' +
    '<li><b>The right heat.</b> Water has to be able to sit on the surface as a liquid: roughly 258 K to 348 K. This is the whole meaning of the <b>habitable zone</b>, and it is worked out from the real starlight falling on that world right now — so <b>moving a planet changes the answer</b>. Drag a frozen world inwards until the panel stops complaining and it will take.</li>' +
    '<li>It is not instant and it is <b>not permanent</b>. Oceans fill, clouds gather and the land greens over across a few years, and the world only stays that way while those three things stay true. Shove it out past the snow line, or feed its star until it swells, and it browns off and dies — <b>twice as fast as it grew</b>, because ruining something is always quicker than building it.</li>' +
    '<li>The world underneath keeps its own name and its own kind. A terraformed Mars is still Mars, with the living layer laid over the top — and it is still Mars when it dies back.</li>' +
    '<li>Try <b>Terraforming</b> in Systems: four dead worlds around one star, and only one of them can be brought to life where it stands. The other three each fail for a different one of the three reasons.</li>' +
    '</ul>' +
    '<h3>TIDES: BEING TORN APART SLOWLY</h3>' +
    '<ul>' +
    '<li>Inside the <b>Roche limit</b> a body cannot hold itself together against the pull of what it orbits. It does not simply pop. It is <b>shaved away</b> — matter is lifted off it and laid straight into a ring, and it genuinely loses that mass — and at the same time the tide <b>kneads it hot inside</b>.</li>' +
    '<li>Watch <b>Inside temp</b> in the panel climb while it happens. A ▲ next to it means the tide has hold of it right now. Push it far enough and the heat comes out through the surface and the whole world starts to glow.</li>' +
    '<li>That heating is real: it is why <b>Io</b> has four hundred volcanoes and why <b>Europa</b> has a liquid ocean under its ice, hundreds of millions of kilometres from the Sun.</li>' +
    '<li>Only once it has lost more than half of itself, or falls right to the bottom of the limit, does it finally come apart into fragments. <b>Settings ▸ Tides</b> controls all of it.</li>' +
    '</ul>' +
    '<h3>DISCS, BROWN DWARFS AND GALAXIES</h3>' +
    '<ul>' +
    '<li>A <b>Protostar + Disc</b> is a star still being born, wrapped in the flat disc of gas and dust it is feeding from. Start time and the disc <b>condenses into planets</b>, one at a time — rock and small worlds on the warm side of the <b>ice line</b>, giants just beyond it, exactly the order our own Solar System came out in. Every planet takes its mass out of the disc, so once the disc is spent, that is that.</li>' +
    '<li>A <b>brown dwarf</b> is a failed star: heavier than any planet, too light to fuse hydrogen. Here one keeps contracting until it <b>lights up as a red dwarf</b> after a hundred years (change that in Settings). A real one never manages it — it just fades for trillions of years — so this one is for fun.</li>' +
    '<li>A <b>galaxy</b> is eleven thousand individual stars wrapped in glowing clouds of gas, and every one of them is really orbiting. Drop two and crash them together — that is what <b>Galaxy Collision</b> in Systems sets up.</li>' +
    '</ul>' +
    '<h3>THE SOLAR SYSTEM</h3>' +
    '<p><b>The Solar System</b> map (and the Sun hidden in the Milky Way) has every planet with its major moons — Phobos and Deimos, Jupiter\'s Io, Europa, Ganymede and Callisto, Saturn\'s Titan, Rhea, Dione, Enceladus, Mimas and Iapetus, Uranus\'s five on their sideways orbits, Neptune\'s backwards Triton and Pluto\'s Charon — plus the dwarf planet Ceres. Thousands of rocks fill the <b>Asteroid Belt</b> between Mars and Jupiter (with the gaps Jupiter has cleared out of it), two swarms of <b>Trojan asteroids</b> ride 60° ahead of and behind Jupiter, and the icy <b>Kuiper Belt</b> rings everything beyond Neptune. Every moon can also be dropped on its own from <b>Moons of the Planets</b>.</p>' +
    '<p>And everything known beyond it: the dwarf planets <b>Haumea</b> (egg-shaped, with a ring), <b>Makemake</b>, <b>Quaoar</b>, <b>Gonggong</b> and <b>Eris</b> with its moon Dysnomia; the <b>scattered disc</b>; the far-flung <b>Sedna</b>, <b>2012 VP113</b> and <b>Leleākūhonua</b> on orbits thousands of years long; the five spacecraft leaving us — <b>Voyager 1 and 2</b>, <b>Pioneer 10 and 11</b> and <b>New Horizons</b>, where they really are and flying outward at their real speeds (click one); the <b>heliopause</b>, the edge of the Sun\'s bubble; the <b>Oort Cloud</b> of comets reaching a third of the way to the stars; and, 4.37 light-years away, the next star system — <b>Alpha Centauri</b> A and B, and Proxima with its planet Proxima b.</p>' +
    '<h3>KINDS OF GALAXY</h3>' +
    '<ul>' +
    '<li><b>Galaxy</b> — a spiral, with a yellow bulge and blue arms.</li>' +
    '<li><b>Barred Spiral</b> — a straight bar of old stars across the middle, arms off its ends. The Milky Way is one.</li>' +
    '<li><b>Elliptical</b> — a smooth egg of old red and yellow stars on orbits in every direction. Crash two spirals together and you get one of these.</li>' +
    '<li><b>Irregular</b> — clumps of young blue stars and pink gas with no shape at all.</li>' +
    '<li><b>Ring</b> — a core inside a perfect ring of new stars, like Hoag\'s Object.</li>' +
    '<li><b>Dwarf</b> — a tiny galaxy a few thousand light-years across. The most common kind in the universe.</li>' +
    '</ul>' +
    '<p>Every galaxy is full of <b>nebulae</b> at their real sizes: pink <b>emission nebulae</b> where stars are being born, blue <b>reflection nebulae</b>, the small glowing rings of <b>planetary nebulae</b> and the red-and-green shells of <b>supernova remnants</b>. From a whole galaxy away they are specks — zoom in on an arm and they open up. Click one to lock on and fly into it. Ellipticals have almost no gas left, so they only have the shells of dying stars.</p>' +
    '<p>And everything else a real galaxy holds: every kind of star — red dwarfs, Sun-like stars, blue giants, red giants and supergiants, Wolf–Rayet stars, brown dwarfs — and the remains of dead ones: <b>white dwarfs</b>, <b>neutron stars</b> and <b>black holes</b>. Most stars have <b>planets</b>: lock on to one and its orbits are drawn, and the worlds go round in time with the clock. Ancient <b>globular clusters</b> swarm round the halo, young <b>open clusters</b> sit on the arms, and at the very middle of every galaxy is a <b>supermassive black hole</b> with its glowing disc — select the galaxy and press <b>VISIT THE BLACK HOLE</b>.</p>' +
    '<h3>SINGULARITIES AND UNIVERSES</h3>' +
    '<ul>' +
    '<li>A <b>Singularity</b> (under <b>Cosmic</b>) is a point of infinite density with no event horizon around it. It swallows anything that touches it, and it shimmers through every colour.</li>' +
    '<li>Select it and press <b>BIG BANG</b>: it explodes into a brand-new <b>Universe</b> — a bubble of space with half a dozen galaxies in it, all flying apart as it expands. Time speeds up so you can watch.</li>' +
    '<li>You can also drop a Universe straight from the palette. Click any star in any of its galaxies to lock on and fly in.</li>' +
    '<li>Select a universe (click the middle of its bubble) and press <b>BIG CRUNCH</b>: the expansion turns round, the galaxies fall back together and merge, and the whole thing collapses into a single singularity — ready to go bang again.</li>' +
    '</ul>' +
    '<h3>CRASHING GALAXIES TOGETHER</h3>' +
    '<ul>' +
    '<li>Each star is a <b>test particle</b>: it feels the pull of every galaxy core in the scene, but has no pull of its own. That is the model Alar and Jüri Toomre used in 1972 to work out where the strange shapes of interacting galaxies come from, and it is still how they are reproduced today. It costs almost nothing in realism — in a real galaxy the stars really are a rounding error next to the mass they orbit — and it is what makes twenty thousand of them affordable at once.</li>' +
    '<li>What you get, and what is up there in the sky:</li>' +
    '<li><b>TIDAL TAILS.</b> The far side of a disc is pulled less hard than the near side, so a passing galaxy flings a long thin streamer out behind it. These get <b>enormous</b> — ten times wider than the galaxy that threw them. The Antennae, the Mice and the Tadpole are all this.</li>' +
    '<li><b>BRIDGES.</b> Material dragged the other way, straight across towards the intruder.</li>' +
    '<li><b>THE MERGER.</b> Each galaxy ploughs through the other and leaves a wake of stars pulled in behind it, and that wake pulls back. The orbit decays a little on every pass, they fall together again, and after three or four passes they coalesce. Chandrasekhar worked this out in 1943 and it is the only reason galaxies merge at all. What is left is a shapeless blob — and that is where <b>elliptical galaxies come from</b>. It is also what the Milky Way and Andromeda are going to do, in about four billion years.</li>' +
    '<li>One thing decides how big the tails are, and it is not mass or speed: <b>which way the disc is spinning</b>. A <b>prograde</b> pass, where the disc turns the same way round as the orbit, resonates with the stars\' own motion and throws vast tails. Turn the same galaxy the other way and the very same encounter barely marks it. Toomre found that too.</li>' +
    '<li><b>The one thing that is not to scale.</b> A real galaxy is about a trillion times wider than the largest thing this sandbox can otherwise hold — drawn true, nothing else would be a single pixel. So a galaxy is built at whatever size fills part of your screen when you drop it (Settings sets the range), and its core mass is then chosen to give it a sensible rotation. After that everything is real physics at that size: the shapes are right, the timescale is not. A collision that would take a billion years plays out here in a couple of hundred.</li>' +
    '<li>Saving a universe stores a galaxy\'s <b>shape</b>, not the position of every star, so a collision in progress is not preserved — the discs come back fresh.</li>' +
    '</ul>' +
    '<h3>MOVING AROUND</h3>' +
    '<div class="an-keys">' +
    '<div><kbd>Drag</kbd></div><span>Rotate the view</span>' +
    '<div><kbd>Right-drag</kbd></div><span>Pan (or hold <kbd>Shift</kbd> and drag)</span>' +
    '<div><kbd>Scroll</kbd></div><span>Zoom — the view spans from metres out to 10<sup>1002</sup> km, far past the edge of anything that could exist</span>' +
    '<div><kbd>Space</kbd></div><span>Start or stop time</span>' +
    '<div><kbd>,</kbd> <kbd>.</kbd></div><span>Slow down / speed up time</span>' +
    '<div><kbd>Click</kbd></div><span>the speed to type any you like — from <b>1e-24 sec</b> to <b>1e74 years</b> per second, e.g. "5 minutes", "2 weeks", "3 Myr"</span>' +
    '<div><kbd>F</kbd></div><span>Lock the camera onto the selected body</span>' +
    '<div><kbd>Del</kbd></div><span>Remove the selected body</span>' +
    '<div><kbd>T</kbd> <kbd>L</kbd></div><span>Toggle trails / labels</span>' +
    '</div>' +
    '<p style="margin-top:8px">On a touch screen: one finger rotates, two fingers pinch to zoom and drag to pan.</p>' +
    '<h3>LANDING ON A WORLD</h3>' +
    '<p>Select any planet, moon, asteroid or comet and press <b>LAND</b> to stand on it, on the side you were looking at. ' +
    'The ground turns with the world, so you watch its star rise and set. Worlds with air get a blue (or orange, or yellow) sky by day and a ' +
    'glowing sunset; airless ones keep a black sky full of stars even at noon. On a gas giant there is no ground — you drift on the cloud tops. ' +
    'Stars are far too hot to land on.</p>' +
    '<div class="an-keys">' +
    '<div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><span>Walk (arrow keys work too) — hold <kbd>Shift</kbd> to run</span>' +
    '<div><kbd>Drag</kbd></div><span>Look around</span>' +
    '<div><kbd>Q</kbd> <kbd>E</kbd></div><span>Sink lower / rise higher (or scroll, or pinch)</span>' +
    '<div><kbd>Esc</kbd></div><span>Take off back into orbit</span>' +
    '</div>' +
    '<h3>WHAT THE PHYSICS ACTUALLY DOES</h3>' +
    '<ul>' +
    '<li>Every body pulls on every other one with real Newtonian gravity, stepped with a leapfrog integrator that keeps orbits stable for thousands of years.</li>' +
    '<li>Masses, radii and distances are in real units — Earth masses, Earth radii and millions of kilometres. Drop Earth 149.6 million km from a Sun-like star and its year comes out at 365 days.</li>' +
    '<li><b>Every real impact plays in slow motion</b> — time drops to a tenth for four seconds and then eases back, so you can see what happened. Change how slow and how long, or switch it off, in <b>Settings ▸ Slow-motion collisions</b>.</li>' +
    '<li><b>Slow collisions merge</b> and conserve momentum. <b>Fast ones shatter</b> both bodies into rubble — the test is impact speed against the pair\'s escape velocity.</li>' +
    '<li>Most of what a collision throws out is <b>not gravel — it is gas</b>. Two worlds hitting each other put in far more energy than it takes to melt rock, let alone boil it, so the plume of vapour that comes off outweighs the solid fragments by more than two to one. It is drawn in the same colours as a protoplanetary disc because it is the same stuff at the same temperatures: white-hot where it is fastest, then orange, then cold blue as it spreads and cools. That vapour is exactly where discs, rings and moons come from — ours came off the impact that made the Moon.</li>' +
    '<li>A collision also throws off <b>knots</b> — lumps big enough to click on and weigh. Most are still vapour, and about a third of them come off <b>solid</b>, because they never got hot enough to boil. Select a gas knot and the panel tells you which way it is going to go: below about four Moons of mass it spreads out and is gone, and above it gravity wins and it <b>pulls itself together into a world</b>. Drag its mass across that line and watch the answer change. This is not a made-up rule — it is how our own Moon was made, out of the wreckage of something the size of Mars hitting the young Earth.</li>' +
    '<li>Whatever survives a collision <b>wears the mark</b>. A scar is left on the surface exactly where it was hit, sized by how big the thing that hit it was, and it turns with the world and leans with its axis. The panel counts them under <b>Impact scars</b>. Stars and gas giants do not keep them — there is no ground for a crater to be in.</li>' +
    '<li>Anything newly <b>born</b> — a planet condensing out of a disc, a world puffing up into a gas giant, a star catching light — arrives inside a swirl of infalling dust that spirals in and <b>whirls faster as it shrinks</b>, because angular momentum is conserved. Same reason a spinning skater speeds up when they pull their arms in.</li>' +
    '<li>The debris thrown out by an impact is <b>real matter, not sparks</b>. Every grain carries mass and is pulled along by the same gravity as the planets, so it orbits, rains back down, settles into rings, or is swallowed by a black hole — and whatever eats it genuinely gets heavier. The counter at the bottom left shows bodies plus live debris.</li>' +
    '<li>Feed a <b>rocky</b> world past <b>60.1 Earth masses</b> and its gravity can finally hold onto hydrogen: it flares up and swells into a <b>gas giant</b>, roughly doubling in width as dense rock gives way to light gas. Worlds that are already gassy skip this and just keep growing.</li>' +
    '<li>Pile up more than 8% of the Sun\'s mass and the body <b>ignites into a star</b>. The full ladder is rock → gas giant → star → supernova → neutron star or black hole.</li>' +
    '<li>Stray inside a planet\'s <b>Roche limit</b> and tides shave the moon away into a ring while cooking it from the inside, exactly as they did at Saturn.</li>' +
    '<li>Surface temperatures come from the real starlight falling on each world, so worlds glow when they roast and frost over when they don\'t.</li>' +
    '</ul>' +
    '<h3>SUPERNOVAE</h3>' +
    '<ul>' +
    '<li>Select any star and the panel tells you <b>exactly how it will die</b> — and gives you a <b>GO SUPERNOVA</b> button if it can. If it can\'t, it says why, which is usually "not heavy enough yet".</li>' +
    '<li>A <b>white dwarf</b> that accretes past the <b>Chandrasekhar limit</b> of 1.44 solar masses detonates on its own, no button needed. That is a <b>Type Ia</b>, and because they all go off at the same mass they all reach the same brightness — which is how astronomers measure distances across the universe.</li>' +
    '<li>A star over about <b>8 solar masses</b> collapses its iron core in roughly a second and rebounds. That is a <b>Type II</b>. Above 20 solar masses the remnant is a black hole; below it, a <b>neutron star</b> — which gets fired off at hundreds of km/s, because the explosion is never symmetric.</li>' +
    '<li>Over about <b>40 solar masses</b> the core falls straight through and swallows its own shock wave. The star just <b>winks out</b>. We have genuinely watched this happen to a real star.</li>' +
    '<li>Between <b>130 and 250 solar masses</b> the star\'s own gamma rays turn into matter, the core loses its support, and the whole thing is destroyed with nothing left over at all.</li>' +
    '<li>The light does <b>not</b> come from the bang — that energy all goes into motion. It comes from about a tenth of a solar mass of radioactive <b>nickel-56</b> forged in the shock, decaying to cobalt and then to iron. That is why a supernova takes three weeks to brighten and months to fade, and the curve here is the real published one.</li>' +
    '<li>The ejecta is <b>real matter</b>, thrown with exactly 10⁵¹ erg of kinetic energy spread across the envelope. Nobody types in a speed: hand a Type Ia 1.5×10⁵¹ erg and 1.44 solar masses and about 10,000 km/s falls out on its own.</li>' +
    '<li>The <b>blast wave</b> is real too. A body intercepts the share of the shell its own disc covers, takes that much momentum and energy, and is destroyed if it got more than gravity holds it together with. At one AU that is about two hundred times what it takes to unbind the Earth.</li>' +
    '<li>Turn on <b>Stellar aging</b> in Settings and stars burn their fuel and die on their own. A star lives 10 billion years divided by (its mass)^2.5, so the Sun gets ten billion years and a twenty-solar-mass star gets six million. Light stars end by puffing off a <b>planetary nebula</b> and settling down as a white dwarf.</li>' +
    '<li>While they age, stars <b>swell</b>: slowly for most of their lives, then fast in the last fifth as they become giants. Their surface cools as they grow, and their colour follows their size, so a Sun-like star goes from white to yellow, orange and finally <b>blood red</b> before it dies. A <b>blue giant</b> stays blue for most of its life, then cools into a red supergiant over its last stretch — just before it explodes. The panel shows how much fuel is burned.</li>' +
    '<li>Every number in that whole list is a slider in <b>Settings ▸ Supernovae</b>, starting at its real measured value, with a RESET that puts them all back.</li>' +
    '</ul>' +
    '<h3>BUILDING A NEW STAR OUT OF THE WRECKAGE</h3>' +
    '<ul>' +
    '<li>What a supernova leaves behind is a few solar masses of enriched gas — and that is where the <b>next</b> generation of stars comes from. Our own Solar System is thought to have condensed out of a cloud like it, which is why the oldest meteorites still carry the decay products of supernova iron.</li>' +
    '<li><b>Click the cloud</b> once the flash has faded and it selects like anything else. The panel shows how much gas and dust is genuinely still there — not the amount thrown, the amount that has not yet been swallowed, absorbed or blown out of the system.</li>' +
    '<li>Drag <b>Core temperature</b> and the cloud squeezes. That link is the virial theorem: a self-gravitating ball has kT ≈ GMμ/R, so halving the radius doubles the temperature in the middle. It is why protostars go on getting hotter all the way down.</li>' +
    '<li>Reach <b>10 million kelvin</b> and hydrogen fuses. The cloud collapses into a star weighing exactly what the gas weighed, drifting exactly as the gas drifted, and the leftover couple of percent flattens into a disc and accretes into planets.</li>' +
    '<li>The planets orbit in <b>the plane the cloud was already spinning in</b>, taken from its real angular momentum. That is why every planet in a real system goes round the same way in nearly the same plane — they all inherit the spin of one cloud.</li>' +
    '<li>Rock forms inside the <b>snow line</b> and ice and giants outside it — 2.7 AU in our own nebula, further out around a brighter star, because that is where water ice can survive.</li>' +
    '<li>Not every cloud makes a star. Under <b>0.075 solar masses</b> — about eighty Jupiters — hydrogen never catches and you get a brown dwarf instead, glowing on its own contraction and slowly fading. The panel tells you which you are about to get before you commit.</li>' +
    '<li>So the full circle is: gas &rarr; star &rarr; supernova &rarr; gas &rarr; star. Each turn seeds the next one with heavier elements. Every atom of iron in your blood came through that loop.</li>' +
    '</ul>' +
    '<h3>WHAT COLOUR A STAR IS</h3>' +
    '<p>In here, <b>how big a star is decides what colour it is</b> — its width, not its weight. ' +
    'Open <b>CUSTOMISE</b> and drag the <b>Radius</b> slider: the star repaints the moment it ' +
    'crosses into the next band, and its mass never moves. The panel always tells you which band ' +
    'it is in. Sizes are in <b>R☉</b>, times the width of the Sun.</p>' +
    '<ul>' +
    '<li><b>Swell one past 20 R☉</b> and it burns out. What is left is a <b>black dwarf</b>: a ' +
    'dead ember about the size of Earth, with no fusion and no light at all. Anything it was ' +
    'keeping warm goes cold, and there is nothing you can do to it afterwards — it cannot even ' +
    'be made to explode. A star that was <i>already</i> bigger than that when you placed it, like ' +
    'the Red Supergiant at 760 R☉, is a giant rather than a corpse and goes on burning.</li>' +
    '<li><b>10 to 19.9 R☉</b> — blood red</li>' +
    '<li><b>5.99 to 9.99 R☉</b> — orange</li>' +
    '<li><b>3 to 5.99 R☉</b> — dark yellow</li>' +
    '<li><b>1 to 2.99 R☉</b> — yellow-white (the Sun is 1 R☉)</li>' +
    '<li><b>Under 1 R☉</b> — white</li>' +
    '<li><b>Hotter than 10,000 K, at any size</b> — blue. That is why the <b>Blue Giant</b> and the <b>Wolf–Rayet</b> star are blue.</li>' +
    '</ul>' +
    '<p>Making a star heavier does make it wider, if it keeps its density — so mass can push it ' +
    'into the next band that way. But mass is never what is read: it is always the width.</p>' +
    '<p>Only the burning stars are painted this way. A white dwarf, a neutron star, a brown dwarf ' +
    'and a black dwarf each keep their own look.</p>' +

    '<h3>TWO HONEST FUDGES</h3>' +
    '<ul>' +
    '<li>Planets are drawn <b>larger than life</b> (see Settings) because at true scale they would be invisible specks. They collide at the size you see.</li>' +
    '<li>Black holes are drawn far bigger than their real event horizons — a ten-solar-mass hole is only about 30 km across — and starlight does not dim with distance, or half your worlds would be pitch black.</li>' +
    '<li>Debris grains feel gravity from the heaviest bodies but not from <i>each other</i>. That is what makes thousands of them possible at once; it means a debris ring will not clump into moons on its own.</li>' +
    '<li>A star\'s colour here comes from its <b>size</b>. In real life it comes from its surface <b>temperature</b>, and among ordinary stars the two run opposite ways round: the big ones are blue-white and blazing, and the small ones are dim red. So the paint is a house rule — but nothing else is. Each star\'s temperature, its brightness, the heat it gives its planets and where its snow line falls are all still the real numbers, which is why a 15 R☉ star painted blood red is still fierce enough to roast everything near it.</li>' +
    '</ul>' +
    '</div>';
  openModal();
}

/* ====================================================================== HUD */

let fpsAcc = 0, fpsCount = 0, fpsShown = 60, statTick = 0;

function updateHud(realDt) {
  fpsAcc += realDt; fpsCount++;
  if (fpsAcc > 0.5) {
    fpsShown = Math.round(fpsCount / fpsAcc);
    fpsAcc = 0; fpsCount = 0;
    $('an-hud-fps').textContent = fpsShown;
    $('an-hud-bodies').textContent = parts.live
      ? sim.bodies.length + ' + ' + parts.live
      : sim.bodies.length;

    // While something is exploding, the brightest thing in the sky is worth a
    // line of its own — that number is the whole point of a supernova.
    const snEl = $('an-hud-sn');
    let best = null;
    for (const e of supernovae) if (!best || e.lum > best.lum) best = e;
    if (best && best.lum > 1) {
      snEl.innerHTML = best.label.toUpperCase() + ' <b>' + fmtLum(best.lum) + '</b>';
      snEl.style.display = '';
    } else if (snEl.style.display !== 'none') {
      snEl.style.display = 'none';
    }
  }
  const yr = Math.floor(sim.time / 365.25);
  const dy = Math.floor(sim.time - yr * 365.25);
  // Past a billion years the day of the year means nothing (and doubles can no
  // longer even tell the days apart), so show the years alone.
  $('an-clock').innerHTML = yr < 1e9
    ? 'Y ' + yr.toLocaleString() + '<br>D ' + dy
    : 'Y ' + yr.toExponential(2).replace('e+', 'e') + '<br>&nbsp;';
  const slowEl = $('an-hud-slow'), slowOn = slowmoLeft > 0 && sim.running;
  if ((slowEl.style.display !== 'none') !== slowOn) slowEl.style.display = slowOn ? '' : 'none';
  $('an-scale-lbl').textContent = view.over > 0
    ? fmtFar(Math.log10(54 * worldPerPixel(view.dist)) + view.over)
    : fmtDist(54 * worldPerPixel(view.dist));
}

function showPanel(which) {
  const pal = $('an-palette'), insp = $('an-inspector');
  pal.classList.toggle('hidden', which !== 'palette');
  insp.classList.toggle('hidden', which !== 'inspector');
  document.body.classList.toggle('panel-open', !!which);
}

/* ================================================================ main loop */

let lastFrame = 0;

function loop(now) {
  const realDt = Math.min((now - lastFrame) / 1000, 0.1) || 0;
  lastFrame = now;

  if (slowmoLeft > 0 && sim.running) {
    slowmoLeft = Math.max(0, slowmoLeft - realDt);
    // Stay slow until any world that is still sinking into another is fully under
    if (slowmoLeft < 1.2 && sim.bodies.some(b => b.sink)) slowmoLeft = 1.2;
  }
  const t0 = sim.time;
  advance(realDt);
  const simDt = sim.time - t0;
  if (universes.length) updateUniverses(realDt, simDt);
  updateGasDisks();

  if (sim.follow) {
    galx.focus = -1;
    if (sim.follow.alive) view.target.copy(sim.follow.p);
    else { sim.follow = null; renderInspector(); }
  } else if (galx.focus >= 0) {
    const k = galx.focus;
    if (galx.own[k] < 0) galx.focus = -1;
    else view.target.set(galx.pos[k * 3], galx.pos[k * 3 + 1], galx.pos[k * 3 + 2]);
  }
  // On the ground the camera is placed after the world has been turned and
  // moved this frame, or the horizon would judder a frame behind it.
  if (!land.b) applyCamera();
  updateVisuals(realDt, simDt);
  if (land.b) applyLanded(realDt);
  updateBelts();
  if (marks.length) updateMarks();
  updateBarycentres();
  renderFrame();
  updateHud(realDt);

  if (++statTick % 10 === 0) updateInspectorStats();
  requestAnimationFrame(loop);
}

/* ===================================================================== boot */

function fail(msg) {
  $('an-boot').innerHTML = '<div class="an-title">AstroNomia</div><div class="an-fail">' + msg + '</div>';
  $('an-boot').classList.remove('gone');
}

function boot() {
  if (typeof THREE === 'undefined') {
    fail('AstroNomia needs the three.js library, which could not be loaded.<br><br>Check your internet connection and reload.');
    return;
  }
  V3 = THREE.Vector3;
  try {
    initScene();
  } catch (e) {
    fail('This browser could not start WebGL, which AstroNomia needs to draw in 3D.<br><br>Try a different browser, or check that hardware acceleration is switched on.<br><br><small>' + (e && e.message ? e.message : e) + '</small>');
    return;
  }

  initLights();
  initLabels();
  buildPalette();
  bindInput();
  bindTypedValues();

  $('an-play').addEventListener('click', togglePlay);
  $('an-slower').addEventListener('click', () => changeRate(-1));
  $('an-faster').addEventListener('click', () => changeRate(1));
  bindRateInput();
  $('an-btn-systems').addEventListener('click', openSystems);
  $('an-btn-settings').addEventListener('click', openSettings);
  $('an-btn-help').addEventListener('click', openHelp);
  $('an-modal-close').addEventListener('click', closeModal);
  $('an-modal').addEventListener('click', (e) => { if (e.target === $('an-modal')) closeModal(); });
  $('an-mob-add').addEventListener('click', () => {
    showPanel($('an-palette').classList.contains('hidden') ? 'palette' : null);
  });
  $('an-mob-insp').addEventListener('click', () => {
    showPanel($('an-inspector').classList.contains('hidden') ? 'inspector' : null);
  });

  sim.rate = RATES[rateIdx];
  syncRate();
  loadPreset(PRESETS[0]);
  updateHint();
  renderInspector();

  $('an-boot').classList.add('gone');
  setTimeout(() => { const b = $('an-boot'); if (b && b.classList.contains('gone')) b.style.display = 'none'; }, 700);

  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

boot();
</script>
</body>
</html>
