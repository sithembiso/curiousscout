/**
 * The fate block on a star's panel: the button when it can explode, and a
 * plain-language reason when it cannot. Body names reach this through
 * plan.why, so everything here goes through the escaper.
 */
function snPanelHTML(plan) {
  const head = '<div class="an-sec">FATE</div>';
  if (!plan.ok) return head + '<p class="an-note">' + escAttr(plan.why) + '</p>';
  return head +
    '<p class="an-note"><b>' + escAttr(plan.label) + '</b> — ' + escAttr(plan.story) + '</p>' +
    '<div class="an-row"><button id="is-sn" class="an-danger">GO SUPERNOVA</button></div>';
}

/**
 * The panel for a selected remnant cloud. The one control is core temperature,
 * because in a collapsing cloud temperature and size are the same fact seen
 * twice: squeeze it and the middle gets hotter, and at ten million kelvin
 * hydrogen starts fusing whether you meant it to or not.
 */
function renderUniverseInspector(u) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = 'UNIVERSE';
  host.innerHTML =
    '<div class="an-name-in" style="cursor:default;pointer-events:none">' + escAttr(u.name) + '</div>' +
    '<div class="an-type">' + (u.crunch ? 'collapsing' : 'expanding') + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Galaxies</dt><dd id="is-ug"></dd>' +
    '<dt>Radius</dt><dd id="is-ur"></dd>' +
    '<dt>Age</dt><dd id="is-ua"></dd>' +
    '</dl>' +
    (u.crunch ? '' : '<div class="an-row"><button id="is-crunch">BIG CRUNCH</button></div>') +
    '<div class="an-row"><button id="is-ufollow">' + (sim.follow === u ? 'UNFOLLOW' : 'FOLLOW') +
    '</button><button id="is-uzoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-udel" class="an-danger">REMOVE</button></div>' +
    '<p class="an-note" style="margin-top:13px">' + TYPES.universe.blurb + ' Click any star in any of ' +
    'its galaxies to lock on and fly in.</p>';
  inspRefs = { ug: $('is-ug'), ur: $('is-ur'), ua: $('is-ua') };
  const cr = $('is-crunch');
  if (cr) cr.addEventListener('click', () => bigCrunch(u));
  $('is-ufollow').addEventListener('click', () => { sim.follow = sim.follow === u ? null : u; renderInspector(); });
  $('is-uzoom').addEventListener('click', () => { frameOn(u, 2.6); sim.follow = u; renderInspector(); });
  $('is-udel').addEventListener('click', () => removeUniverse(u));
  updateInspectorStats();
}

function renderCloudInspector(e) {
  const host = $('an-insp-body');
  const c = e.cloud || { mass: 0, n: 0, radius: 0 };
  $('an-insp-h').textContent = 'REMNANT CLOUD';

  host.innerHTML =
    '<div class="an-name-in" style="cursor:default;pointer-events:none">' + escAttr(e.label + ' remnant') + '</div>' +
    '<div class="an-type">from ' + escAttr(e.origin) + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Gas &amp; dust</dt><dd id="is-cmass"></dd>' +
    '<dt>Pieces</dt><dd id="is-cn"></dd>' +
    '<dt>Radius</dt><dd id="is-crad"></dd>' +
    '<dt>Expanding at</dt><dd id="is-cvel"></dd>' +
    '<dt>Age</dt><dd id="is-cage"></dd>' +
    '<dt>Still glowing</dt><dd id="is-clum"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Core temperature <b id="is-ctv"></b></label>' +
    '<input type="range" id="is-ctemp" min="1" max="7" step="0.01" value="' +
    Math.log10(clamp(e.coreT, 10, IGNITE_T)).toFixed(3) + '"></div>' +
    '<p class="an-note">Squeezing a cloud heats its middle — halve the radius and you double the ' +
    'core temperature. Drag this all the way to <b>10 million K</b> and hydrogen fusion starts.</p>' +
    '<div class="an-sec">WHAT IT WOULD MAKE</div>' +
    '<p class="an-note" id="is-cfore"></p>' +
    '<div class="an-row"><button id="is-collapse">COLLAPSE NOW</button></div>' +
    '<div class="an-row"><button id="is-cfollow">' + (sim.follow === e ? 'UNFOLLOW' : 'FOLLOW') +
    '</button><button id="is-czoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-cdisperse" class="an-danger">DISPERSE</button></div>' +
    '<p class="an-note" style="margin-top:13px">This is where the next generation of stars comes ' +
    'from. Our own Solar System is thought to have condensed out of a cloud like this one — the ' +
    'oldest meteorites still carry the decay products of supernova iron. What you get is a ' +
    '<b>newborn</b> star and nothing else yet — just the disc it came out of. Let it run: the ' +
    'planets condense out of that disc one at a time, which is how it really happened.</p>';

  inspRefs = {
    cmass: $('is-cmass'), cn: $('is-cn'), crad: $('is-crad'), cvel: $('is-cvel'),
    cage: $('is-cage'), clum: $('is-clum'), ctv: $('is-ctv'), cfore: $('is-cfore')
  };

  const temp = $('is-ctemp');
  temp.addEventListener('input', () => {
    const cur = sim.selected;
    if (!cur || cur.kind !== 'snr' || !cur.alive) return;
    inspectorLock++;
    const lit = setCloudTemp(cur, Math.pow(10, parseFloat(temp.value)));
    inspectorLock--;
    if (lit) { condenseCloud(cur); return; }
    // A hundredfold squeeze would otherwise shrink the thing you are working on
    // to a sub-pixel dot long before it ignites, so close in as it collapses —
    // but only once it has actually got small on screen.
    if (apparentPx(cur) < VIEW.h * 0.16) frameOn(cur, 2.8);
    updateInspectorStats();
  });
  temp.addEventListener('change', () => renderInspector());

  $('is-collapse').addEventListener('click', () => { if (e.alive) condenseCloud(e); });
  $('is-cfollow').addEventListener('click', () => {
    sim.follow = sim.follow === e ? null : e;
    renderInspector();
  });
  $('is-czoom').addEventListener('click', () => { frameOn(e, 2.6); sim.follow = e; renderInspector(); });
  $('is-cdisperse').addEventListener('click', () => {
    disperseCloud(e);
    e.alive = false;
    disposeSN(e);
    const i = supernovae.indexOf(e);
    if (i >= 0) supernovae.splice(i, 1);
    select(null);
    toast('Cloud dispersed');
  });

  updateInspectorStats();
}

/* ------------------------------------------------------- terraform block  */

/** The TERRAFORM section: what is stopping it, or how far along it is. */
function terraHTML(b) {
  const def = TYPES[b.type];
  if (def.star || GASSY_SURF.has(def.surf) || b.kind !== 'body') return '';
  const chk = terraCheck(b);
  const pct = Math.round(b.terra * 100);
  const born = isLivingSurf(def);

  let h = '<div class="an-sec">TERRAFORMING</div>';

  if (b.terraOn) {
    h += '<div class="an-bar"><i id="is-tfbar" style="width:' + pct + '%"></i></div>' +
      '<p class="an-note" id="is-tfnote"></p>';
  }

  if (!chk.ok) {
    h += '<p class="an-note">' + escAttr(chk.why) + '</p>';
  } else if (!b.terraOn) {
    h += '<p class="an-note">' + escAttr(b.name) + ' sits where water can be liquid and is heavy enough to ' +
      'hold its air down. ' + (born
        ? 'It is already alive — switch this on and it will stay that way only for as long as that remains true.'
        : 'Give it oceans, weather and a sky.') + '</p>';
  }

  h += '<div class="an-row">' +
    '<button id="is-terra"' + (chk.ok || b.terraOn ? '' : ' disabled') + '>' +
    (b.terraOn ? 'STOP' : 'TERRAFORM') + '</button>' +
    (b.terraOn && b.terra < 1 && chk.ok ? '<button id="is-terra-now">FINISH IT</button>' : '') +
    '</div>';
  return h;
}

function bindTerra(b) {
  const btn = $('is-terra');
  if (btn) {
    btn.addEventListener('click', () => {
      b.terraOn = !b.terraOn;
      if (b.terraOn && b.terra > 0 && b.parts && !b.parts.terraSkin && !isLivingSurf(TYPES[b.type])) refreshVisual(b);
      toast(b.terraOn ? 'Terraforming ' + b.name + '…' : 'Left ' + b.name + ' to its own devices');
      renderInspector();
    });
  }
  const now = $('is-terra-now');
  if (now) {
    now.addEventListener('click', () => {
      if (!terraCheck(b).ok) return;
      b.terra = 1;
      if (b.parts && !b.parts.terraSkin && !isLivingSurf(TYPES[b.type])) refreshVisual(b);
      toast(b.name + ' is alive — oceans, air and all');
      renderInspector();
    });
  }
}

/* --------------------------------------------------------- customise block */
/*
 * Everything about a body that is a number can be dialled here: how big it is,
 * how fast and which way it spins, how far over it leans, how hot its middle
 * is, what colour it is, and what its rings look like. Mass has its own slider
 * further up because changing mass can change what the body *is*.
 */

const DEG = 180 / Math.PI;

function customiseHTML(b) {
  const def = TYPES[b.type];
  const hole = b.kind === 'bh' || b.kind === 'wh';
  const nat = trueRadius(b.type, b.m);
  const lr = Math.log10(Math.max(b.r, 1e-12));
  const spinAbs = Math.max(Math.abs(b.spin || 1), 1e-4);
  const rings = b.ringSpec;

  let h = '<details class="an-more"><summary>CUSTOMISE</summary>';

  if (!hole) {
    h += '<div class="an-field"><label>Radius <b id="is-rv"></b></label>' +
      '<input type="range" id="is-rad-s" step="0.001" min="' +
      Math.min(Math.log10(nat * 0.05), lr).toFixed(3) + '" max="' +
      Math.max(Math.log10(nat * 20), lr).toFixed(3) + '" value="' + lr.toFixed(3) + '"></div>' +
      '<p class="an-note">Mass stays put, so widening a body makes it less dense — and past a point it would float in water, like Saturn.</p>';
  }

  h += '<div class="an-field"><label>Spin (one turn) <b id="is-spv"></b></label>' +
    '<input type="range" id="is-spin-s" min="-4" max="4" step="0.01" value="' +
    Math.log10(spinAbs).toFixed(3) + '"></div>' +
    tgl('is-retro', 'Spins backwards', 'Like Venus, Uranus and Pluto really do.') +
    '<p class="an-note">Wind it below <b>0.02 hours</b> a turn and the equator is moving faster than ' +
    'gravity can hold on to it: the body starts <b>flinging itself apart</b> from the middle, and keeps ' +
    'going until nothing but its core is left. Time has to be running for that to happen.</p>' +
    '<div class="an-field"><label>Axial tilt <b id="is-tiv"></b></label>' +
    '<input type="range" id="is-tilt-s" min="-180" max="180" step="1" value="' +
    Math.round(b.tilt * DEG) + '"></div>';

  if (!hole) {
    h += '<div class="an-field"><label>' + (def.star ? 'Surface temperature' : 'Internal temperature') +
      ' <b id="is-ctv2"></b></label>' +
      '<input type="range" id="is-core-s" min="1" max="7.3" step="0.01" value="' +
      Math.log10(clamp(def.star ? b.temp : (b.coreT || 300), 10, 2e7)).toFixed(3) + '"></div>' +
      '<p class="an-note">' + (def.star
        ? 'The colour of a star is its temperature and nothing else — cool is red, hot is blue.'
        : 'How hot it is deep down. Earth\'s core is about 5,700 K. Push it far enough and the surface glows.') +
      '</p>';
  }

  if (!hole && !def.star) {
    h += '<div class="an-sub">Colour tint</div><div class="an-swatches">' +
      '<input type="color" id="is-tint" value="' + bodyTintHex(b) + '"></div>' +
      '<p class="an-note">Washes a colour over the whole surface. White leaves it exactly as it was.</p>';
  }

  /* ---- rings ------------------------------------------------------------ */
  h += '<div class="an-sub">Rings</div>' +
    tgl('is-rings-on', 'Has rings', '');
  if (rings) {
    h += '<div class="an-field"><label>Inner edge <b id="is-ri-v"></b></label>' +
      '<input type="range" id="is-ri" min="1.02" max="6" step="0.01" value="' + rings.inner + '"></div>' +
      '<div class="an-field"><label>Outer edge <b id="is-ro-v"></b></label>' +
      '<input type="range" id="is-ro" min="1.1" max="9" step="0.01" value="' + rings.outer + '"></div>' +
      '<div class="an-field"><label>How solid <b id="is-rop-v"></b></label>' +
      '<input type="range" id="is-rop" min="0.05" max="1" step="0.01" value="' +
      (rings.opacity != null ? rings.opacity : 0.92) + '"></div>' +
      '<div class="an-swatches">' +
      '<input type="color" id="is-rc1" value="' + rgbHex(rings.pal[0]) + '">' +
      '<input type="color" id="is-rc2" value="' + rgbHex(rings.pal[1]) + '"></div>' +
      '<p class="an-note">Edges are measured in the body\'s own widths. Real rings sit inside the Roche limit, which is why they never clump into a moon.</p>';
  }

  if (canHoldWater(b)) {
    h += '<div class="an-sub">Water</div>' +
      '<div class="an-field"><label>Water amount <b id="is-wat-v"></b></label>' +
      '<input type="range" id="is-wat" min="0" max="100" step="1" value="' +
      Math.round((b.water || 0) * 100) + '"></div>' +
      '<p class="an-note">A real sea, at a real level: it fills whatever ground is below it, so ' +
      'craters become lakes and the low country floods first. Slide it up and the continents go ' +
      'under one range at a time. It freezes over on its own if the world is cold enough.</p>';
  }

  h += '<div class="an-row"><button id="is-solid">ADD SOLID RINGS</button></div>' +
    '<p class="an-note">Drops a <b>three-dimensional band of real asteroids</b> into orbit — actual ' +
    'bodies with mass, not a picture. They pull on each other, they shear, and they crash. Press it ' +
    'again and again: each band goes in a little wider and a little more tilted than the last, so ' +
    'they <b>cross</b> instead of nesting, and the crossings grind each other up. Round a star the ' +
    'band reaches as far out as a <b>protoplanetary disc</b> does — and if the star already has one, ' +
    'the rocks fill exactly the same space as the dust.</p>';

  h += '<div class="an-row"><button id="is-reset">RESET TO ' + def.label.toUpperCase() + '</button></div>' +
    '</details>';
  return h;
}

/** The body's current tint as a hex string, for the colour input. */
function bodyTintHex(b) {
  const c = b.baseColor;
  if (!c) return '#ffffff';
  return rgbHex([c.r * 255, c.g * 255, c.b * 255]);
}

function bindCustomise(b) {
  const show = {};
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

  /* ---- radius ---- */
  const rs = $('is-rad-s');
  if (rs) {
    show.rad = () => $('is-rv').textContent = fmtRadius(b.r);
    show.rad();
    rs.addEventListener('input', () => {
      b.r = Math.pow(10, parseFloat(rs.value));
      // Remember how far off its natural width this is, so changing the mass
      // later moves the radius instead of resetting it.
      const nat = trueRadius(b.type, b.m);
      b.rFactor = nat > 0 ? b.r / nat : 1;
      updateLuminosity(b);
      scaleVisual(b);
      show.rad();
      updateInspectorStats();
    });
  }

  /* ---- spin ---- */
  const sp = $('is-spin-s');
  const showSpin = () => {
    const p = Math.abs(b.spin);
    $('is-spv').textContent = (p >= 1 ? p.toPrecision(3) + ' days' : (p * 24).toPrecision(3) + ' hours') +
      (b.spin < 0 ? ' ↺' : '');
  };
  if (sp) {
    showSpin();
    sp.addEventListener('input', () => {
      b.spin = Math.pow(10, parseFloat(sp.value)) * (b.spin < 0 ? -1 : 1);
      showSpin();
    });
  }
  const retro = $('is-retro');
  if (retro) {
    retro.classList.toggle('on', b.spin < 0);
    retro.addEventListener('click', () => {
      b.spin = -b.spin;
      retro.classList.toggle('on', b.spin < 0);
      showSpin();
    });
  }

  /* ---- tilt ---- */
  const ti = $('is-tilt-s');
  if (ti) {
    const showTilt = () => $('is-tiv').textContent = Math.round(b.tilt * DEG) + '°';
    showTilt();
    ti.addEventListener('input', () => {
      b.tilt = parseFloat(ti.value) / DEG;
      if (b.ringSpec) b.ringSpec.tilt = b.tilt;
      showTilt();
    });
  }

  /* ---- temperature ---- */
  const ct = $('is-core-s');
  if (ct) {
    const star = TYPES[b.type].star;
    const showT = () => {
      const t = star ? b.temp : b.coreT;
      $('is-ctv2').textContent = t >= 1e6 ? (t / 1e6).toPrecision(3) + ' million K'
        : Math.round(t).toLocaleString() + ' K';
    };
    showT();
    ct.addEventListener('input', () => {
      const t = Math.pow(10, parseFloat(ct.value));
      if (star) {
        b.temp = t;
        updateLuminosity(b);
        // A star's colour *is* its temperature, so recolour its light and glare
        // to match rather than leaving them on the type's original value.
        const c = kelvinToRGB(t);
        if (b.lightColor) b.lightColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
        const p = b.parts;
        if (p && p.glow) p.glow.material.color.copy(b.lightColor);
        if (p && p.halo) p.halo.material.color.copy(b.lightColor);
      } else {
        b.coreT = t;
      }
      showT();
      updateInspectorStats();
    });
  }

  /* ---- surface tint ---- */
  on('is-tint', 'input', () => {
    const c = hexRgb($('is-tint').value);
    if (!b.baseColor) b.baseColor = new THREE.Color();
    b.baseColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
    b.tint = $('is-tint').value;
    const p = b.parts;
    if (p && p.surf && p.surf.material.color) p.surf.material.color.copy(b.baseColor);
  });

  /* ---- water ---- */
  const wat = $('is-wat');
  if (wat) {
    const showW = () => $('is-wat-v').textContent =
      (b.water || 0) <= 0.001 ? 'none' : Math.round(b.water * 100) + '%';
    showW();
    wat.addEventListener('input', () => {
      setWater(b, parseInt(wat.value, 10) / 100);
      showW();
      updateInspectorStats();
    });
  }

  /* ---- solid rings ---- */
  // Deliberately does NOT re-render the panel: rebuilding it would fold the
  // CUSTOMISE section shut, and the whole point is to press this repeatedly.
  on('is-solid', 'click', () => { if (b.alive) addSolidRing(b); });

  /* ---- rings ---- */
  const rOn = $('is-rings-on');
  if (rOn) {
    rOn.classList.toggle('on', !!b.ringSpec);
    rOn.addEventListener('click', () => {
      setRings(b, b.ringSpec ? null : (TYPES[b.type].rings || DEFAULT_RINGS()));
      renderInspector();
    });
  }
  // A colour picker fires continuously while it is dragged, and each repaint
  // redraws 190 arcs into a 512×512 canvas — so repaints are rate-limited and
  // one final one is always guaranteed on release.
  let lastPaint = 0, paintTimer = 0;
  const reRing = (repaint) => {
    const s = b.ringSpec;
    // Keep the edges from crossing over, whichever one is being dragged.
    s.outer = Math.max(s.outer, s.inner + 0.08);
    let paint = false;
    if (repaint) {
      const now = performance.now();
      if (now - lastPaint > 110) { lastPaint = now; paint = true; }
      else {
        clearTimeout(paintTimer);
        paintTimer = setTimeout(() => { if (b.alive && b.ringSpec) setRings(b, b.ringSpec, true); }, 130);
      }
    }
    setRings(b, s, paint);
    if ($('is-ri-v')) $('is-ri-v').textContent = s.inner.toFixed(2) + '× radius';
    if ($('is-ro-v')) $('is-ro-v').textContent = s.outer.toFixed(2) + '× radius';
    if ($('is-rop-v')) $('is-rop-v').textContent = Math.round((s.opacity != null ? s.opacity : 0.92) * 100) + '%';
  };
  if (b.ringSpec && $('is-ri')) {
    on('is-ri', 'input', () => { b.ringSpec.inner = parseFloat($('is-ri').value); reRing(); });
    on('is-ro', 'input', () => { b.ringSpec.outer = parseFloat($('is-ro').value); reRing(); });
    on('is-rop', 'input', () => { b.ringSpec.opacity = parseFloat($('is-rop').value); reRing(); });
    on('is-rc1', 'input', () => { b.ringSpec.pal[0] = hexRgb($('is-rc1').value); reRing(true); });
    on('is-rc2', 'input', () => { b.ringSpec.pal[1] = hexRgb($('is-rc2').value); reRing(true); });
    reRing();
  }

  /* ---- back to factory ---- */
  on('is-reset', 'click', () => {
    const def = TYPES[b.type];
    b.rFactor = 1;
    b.r = trueRadius(b.type, b.m);
    b.spin = def.spin || 1;
    b.tilt = def.tilt != null ? def.tilt : def.rings ? def.rings.tilt : 0;
    b.temp = def.temp || b.temp;
    b.coreT = baseCoreT(def, b.m);
    b.tint = null;
    b.ringSpec = def.rings ? Object.assign({}, def.rings) : null;
    updateLuminosity(b);
    refreshVisual(b);
    renderInspector();
    toast(b.name + ' is back to a standard ' + def.label);
  });
}

/* ------------------------------------------------------- galaxies & discs  */

function renderGalaxyInspector(b) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = 'SELECTED';
  const lm = Math.log10(Math.max(b.m, 1));
  const lr = Math.log10(Math.max(b.galR, 1));
  let stars = 0;
  for (let k = 0; k < GAL_MAX; k++) if (galx.own[k] === b.id) stars++;

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false" value="' + escAttr(b.name) + '">' +
    '<div class="an-type">' + (b.galMerged ? 'MERGER REMNANT' : 'GALAXY') + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Core mass</dt><dd id="is-mass"></dd>' +
    '<dt>Disc radius</dt><dd id="is-gw"></dd>' +
    '<dt>Stars simulated</dt><dd>' + stars.toLocaleString() + '</dd>' +
    '<dt>Spiral arms</dt><dd>' + b.galArms + (b.galSpin < 0 ? ' ↺' : '') + '</dd>' +
    (b.galMerged ? '<dt>Galaxies eaten</dt><dd>' + b.galMerged + '</dd>' : '') +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Core mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="3" max="' + Math.log10(1e12 * M_SUN).toFixed(2) +
    '" step="0.01" value="' + lm.toFixed(3) + '"></div>' +
    '<p class="an-note">Everything that holds this galaxy together. A real one weighs about a trillion Suns — drag it all the way up and see what that does to the stars.</p>' +
    '<div class="an-field"><label>Disc radius <b id="is-gwv"></b></label>' +
    '<input type="range" id="is-gwide" min="9" max="12.8" step="0.01" value="' + lr.toFixed(3) + '"></div>' +
    '<p class="an-note">Changing this rebuilds the disc from scratch, so anything already happening to it is lost.</p>' +
    '<div class="an-row"><button id="is-reseed">REBUILD THE DISC</button></div>' +
    '<div class="an-row"><button id="is-smbh">VISIT THE BLACK HOLE</button></div>' +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-del" class="an-danger">REMOVE</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' +
    (b.galMerged
      ? 'What is left after a collision: two ordered discs stirred into one shapeless blob, with the stars still on whatever orbits the wreck left them. This is where elliptical galaxies come from.'
      : TYPES.galaxy.blurb) + '</p>';

  inspRefs = { mass: $('is-mass'), gw: $('is-gw'), mval: $('is-mval'), orb: $('is-orb'), orbL: $('is-orb-l') };

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const ms = $('is-mslider');
  ms.addEventListener('input', () => {
    b.m = Math.pow(10, parseFloat(ms.value));
    computeAccel();
    updateInspectorStats();
  });

  const gw = $('is-gwide');
  const showGw = () => $('is-gwv').textContent = fmtDist(b.galR);
  showGw();
  gw.addEventListener('input', () => { b.galR = Math.pow(10, parseFloat(gw.value)); showGw(); updateInspectorStats(); });
  // Rebuilt on release, not on every frame of the drag — reseeding six thousand
  // stars sixty times a second would be absurd. The mass comes along with the
  // size, so a resized galaxy still turns once every GAL_PERIOD days.
  gw.addEventListener('change', () => {
    b.m = galMassFor(b.galR, b.galPeriod);
    seedGalaxyStars(b);
    computeAccel();
    renderInspector();
  });

  $('is-reseed').addEventListener('click', () => { seedGalaxyStars(b); b.galMerged = 0; renderInspector(); toast(b.name + '’s disc rebuilt'); });
  $('is-smbh').addEventListener('click', () => {
    galx.focus = -1;
    sim.follow = b;
    view.target.copy(b.p);
    view.dist = schwarzschild(b.smbhM) * 2.6 * 40;
    const ms = b.smbhM / M_SUN;
    toast('The supermassive black hole at the heart of ' + b.name + ': ' +
      (ms >= 1e9 ? (ms / 1e9).toPrecision(2) + ' billion' : (ms / 1e6).toPrecision(2) + ' million') +
      ' times the mass of the Sun, squeezed into a ball smaller than our Solar System.');
  });
  $('is-follow').addEventListener('click', () => { sim.follow = sim.follow === b ? null : b; renderInspector(); });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 2.4); sim.follow = b; renderInspector(); });
  $('is-del').addEventListener('click', () => { select(null); removeBody(b); compact(); });

  updateInspectorStats();
}

/** The panel block for a star that still has a disc around it. */
function discHTML(d) {
  return '<div class="an-sec">PROTOPLANETARY DISC</div>' +
    '<dl class="an-stats">' +
    '<dt>Material left</dt><dd id="is-dm"></dd>' +
    '<dt>Planets made</dt><dd id="is-dn"></dd>' +
    '<dt>Outer edge</dt><dd id="is-dr"></dd>' +
    '</dl>' +
    '<p class="an-note">Every planet is built out of this, and takes its mass with it. Where the ice line falls decides what gets made: rock on the warm side, giants just beyond it.</p>' +
    '<div class="an-row"><button id="is-dnow">MAKE A PLANET NOW</button></div>' +
    '<div class="an-row"><button id="is-dblow" class="an-danger">BLOW THE DISC AWAY</button></div>';
}

function bindDisc(b, d) {
  const now = $('is-dnow');
  if (now) {
    now.addEventListener('click', () => {
      if (!d.alive) return;
      if (d.mass <= d.m0 * 0.04) { toast('The disc is spent — there is nothing left to build with'); return; }
      if (condenseFromDisc(d)) { d.next = Math.max(settings.discYears, 0.02) * 365.25; renderInspector(); }
    });
  }
  const blow = $('is-dblow');
  if (blow) {
    blow.addEventListener('click', () => {
      d.fade = 0.001;
      toast(b.name + ' blew its disc away');
      renderInspector();
    });
  }
}

/**
 * The panel for a knot of gas. The one thing worth knowing about it is whether
 * it is heavy enough to survive — below the collapse mass it is going to spread
 * out and be gone, and above it there is a world coming.
 */
function renderClumpInspector(b) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = 'SELECTED';
  const lm = Math.log10(Math.max(b.m, 1e-9));

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false" value="' + escAttr(b.name) + '">' +
    '<div class="an-type">GAS CLUMP</div>' +
    '<dl class="an-stats">' +
    '<dt>Mass</dt><dd id="is-mass"></dd>' +
    '<dt>Radius</dt><dd id="is-rad"></dd>' +
    '<dt>Density</dt><dd id="is-den"></dd>' +
    '<dt>Speed</dt><dd id="is-spd"></dd>' +
    '<dt>Temperature</dt><dd id="is-tmp"></dd>' +
    '<dt>Age</dt><dd id="is-cage2"></dd>' +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="-5" max="2.2" step="0.001" value="' + lm.toFixed(3) + '"></div>' +
    '<p class="an-note" id="is-fate2"></p>' +
    '<div class="an-row"><button id="is-collapse2">COLLAPSE IT NOW</button></div>' +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-disperse2" class="an-danger">LET IT GO</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' + TYPES.gas_clump.blurb + '</p>';

  inspRefs = {
    mass: $('is-mass'), rad: $('is-rad'), den: $('is-den'), spd: $('is-spd'),
    tmp: $('is-tmp'), orb: $('is-orb'), orbL: $('is-orb-l'), mval: $('is-mval'),
    cage2: $('is-cage2'), fate2: $('is-fate2')
  };

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const ms = $('is-mslider');
  ms.addEventListener('input', () => {
    b.m = Math.pow(10, parseFloat(ms.value));
    b.r = trueRadius('gas_clump', b.m);
    scaleVisual(b);
    updateInspectorStats();
  });

  $('is-collapse2').addEventListener('click', () => {
    if (!b.alive) return;
    if (b.m < CLUMP_COLLAPSE) { toast('Too thin to hold together — feed it more mass first'); return; }
    collapseClump(b);
  });
  $('is-follow').addEventListener('click', () => { sim.follow = sim.follow === b ? null : b; renderInspector(); });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 4); sim.follow = b; renderInspector(); });
  $('is-disperse2').addEventListener('click', () => { disperseClump(b, true); toast(b.name + ' was let go'); });

  updateInspectorStats();
}

function renderInspector() {
  const host = $('an-insp-body');
  const b = sim.selected;
  inspRefs = null;
  if (!b || !b.alive) {
    $('an-insp-h').textContent = 'SELECTED';
    host.innerHTML = '<div class="an-empty">Nothing selected.<br><br>Tap a body to inspect it, or pick something from <b>Add Body</b> to build.</div>';
    return;
  }
  if (b.kind === 'snr') { renderCloudInspector(b); return; }
  if (b.kind === 'uni') { renderUniverseInspector(b); return; }
  if (b.kind === 'mark') { renderMarkInspector(b); return; }
  if (b.kind === 'gal') { renderGalaxyInspector(b); return; }
  if (b.kind === 'gas') { renderClumpInspector(b); return; }
  const def = TYPES[b.type];
  $('an-insp-h').textContent = 'SELECTED';
  // A rocky world's range has to reach past the gas-giant threshold, or the
  // slider could never trigger it. The range is also widened to contain the
  // body's actual mass, otherwise setting `value` would silently clamp it and
  // the readout would disagree with the physics.
  const lm = Math.log10(Math.max(b.m, 1e-12));
  const topMass = isRocky(b) ? Math.max(def.mass * 120, GAS_THRESHOLD * 2.5) : def.mass * 80;
  const massMin = Math.min(Math.log10(Math.max(def.mass * 0.02, 1e-11)), lm);
  const massMax = Math.max(Math.log10(topMass), lm);

  // Stars get a fate readout: what this one would do if its core gave way now,
  // or exactly what is missing if it could not.
  const isStar = def.star && b.kind === 'body';
  const plan = isStar ? snPlan(b) : null;

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false"' +
    ' title="Click to rename" aria-label="Body name" value="' + escAttr(b.name) + '">' +
    '<div class="an-type" id="is-typelbl">' + def.label + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Mass</dt><dd id="is-mass"></dd>' +
    '<dt>Radius</dt><dd id="is-rad"></dd>' +
    '<dt>Density</dt><dd id="is-den"></dd>' +
    '<dt>Speed</dt><dd id="is-spd"></dd>' +
    '<dt>Surface temp</dt><dd id="is-tmp"></dd>' +
    (b.kind === 'body' ? '<dt>Inside temp</dt><dd id="is-core"></dd>' : '') +
    (isStar ? '<dt>Luminosity</dt><dd id="is-lum"></dd>' : '') +
    (starBand(b) ? '<dt>Colour</dt><dd id="is-band"></dd>' : '') +
    (isStar && snSet.aging ? '<dt>Fuel burned</dt><dd id="is-age"></dd>' : '') +
    (b.stripped > 0 ? '<dt>Torn away</dt><dd id="is-strip"></dd>' : '') +
    (b.scarCount > 0 ? '<dt>Impact scars</dt><dd id="is-scars"></dd>' : '') +
    (b.terra > 0 && b.kind === 'body' ? '<dt>Living surface</dt><dd id="is-life"></dd>' : '') +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="' + massMin.toFixed(3) + '" max="' + massMax.toFixed(3) + '" step="0.001" value="' + Math.log10(b.m).toFixed(3) + '"></div>' +
    (isStar && snSet.on ? snPanelHTML(plan) : '') +
    (b.disc && b.disc.alive ? discHTML(b.disc) : '') +
    terraHTML(b) +
    customiseHTML(b) +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    (land.b === b
      ? '<div class="an-row"><button id="is-land">TAKE OFF</button></div>'
      : landBlock(b) ? '' : '<div class="an-row"><button id="is-land">LAND</button></div>') +
    (def.naked ? '<div class="an-row"><button id="is-bang">BIG BANG</button></div>' : '') +
    '<div class="an-row"><button id="is-shatter" class="an-danger">SHATTER</button><button id="is-del" class="an-danger">REMOVE</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' + def.blurb + '</p>';

  inspRefs = {
    mass: $('is-mass'), rad: $('is-rad'), den: $('is-den'), spd: $('is-spd'),
    tmp: $('is-tmp'), orb: $('is-orb'), orbL: $('is-orb-l'), mval: $('is-mval'),
    lum: $('is-lum'), age: $('is-age'), core: $('is-core'), strip: $('is-strip'),
    band: $('is-band'),
    scars: $('is-scars'), dm: $('is-dm'), dn: $('is-dn'), dr: $('is-dr'),
    tfbar: $('is-tfbar'), tfnote: $('is-tfnote'), life: $('is-life')
  };

  if (b.disc && b.disc.alive) bindDisc(b, b.disc);
  bindTerra(b);
  bindCustomise(b);

  const snBtn = $('is-sn');
  if (snBtn) {
    snBtn.addEventListener('click', () => {
      const name = b.name;
      const p = goSupernova(b);
      if (p) { toast(name + ' went ' + p.label + '!'); renderInspector(); }
    });
  }

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const slider = $('is-mslider');
  slider.addEventListener('input', () => {
    const nb = sim.selected;
    if (!nb) return;
    nb.m = Math.pow(10, parseFloat(slider.value));
    nb.r = natRadius(nb);
    // Rebuilding the panel mid-drag would kill the drag, so on transformation
    // just patch the type label in place; the full refresh waits for release.
    inspectorLock++;
    const ev = checkEvolution(nb);
    inspectorLock--;
    if (ev) {
      const lbl = $('is-typelbl');
      if (lbl) lbl.textContent = TYPES[nb.type].label;
      toast(nb.name + EVOLVE_NOTE[ev]);
    } else if (lumpDrift(nb)) {
      updateLuminosity(nb);
      refreshVisual(nb);       // heavy enough now to have rounded itself out
    } else {
      updateLuminosity(nb);
      scaleVisual(nb);
    }
    updateInspectorStats();
  });
  // Released: now it is safe to rebuild, picking up the new type's slider range
  // — or the empty panel, if what was here just detonated.
  slider.addEventListener('change', () => renderInspector());
  $('is-follow').addEventListener('click', () => {
    sim.follow = sim.follow === b ? null : b;
    renderInspector();
  });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 9); sim.follow = b; renderInspector(); });
  const landBtn = $('is-land');
  if (landBtn) landBtn.addEventListener('click', () => { if (land.b === b) leaveSurface(); else landOn(b); });
  $('is-shatter').addEventListener('click', () => shatterBody(b));
  const bang = $('is-bang');
  if (bang) bang.addEventListener('click', () => bigBang(b));
  $('is-del').addEventListener('click', () => { select(null); removeBody(b); compact(); });

  updateInspectorStats();
}

function updateInspectorStats() {
  const b = sim.selected;
  if (!b || !b.alive || !inspRefs) return;

  if (b.kind === 'mark') {
    const d = b.p.distanceTo(b.host.p);
    inspRefs.md.textContent = (d / AU).toFixed(d < 1000 * AU ? 1 : 0) + ' AU';
    if (inspRefs.mv) inspRefs.mv.textContent = fmtSpeed(b.v);
    if (inspRefs.ml) {
      const h = d * 1e9 / 299792458 / 3600;
      inspRefs.ml.textContent = h.toFixed(1) + ' hours';
    }
    return;
  }
  if (b.kind === 'uni') {
    inspRefs.ug.textContent = b.members.length;
    inspRefs.ur.textContent = fmtDist(b.R);
    inspRefs.ua.textContent = b.age < 730 ? Math.round(b.age).toLocaleString() + ' days'
      : (b.age / 365.25).toPrecision(3) + ' years';
    return;
  }
  if (b.kind === 'snr') {
    const c = b.cloud || { mass: 0, n: 0, radius: 0 };
    inspRefs.cmass.textContent = fmtMass(c.mass);
    inspRefs.cn.textContent = c.n.toLocaleString();
    inspRefs.crad.textContent = fmtDist(Math.max(c.radius, b.radius));
    inspRefs.cvel.textContent = fmtKms(b.vBulk);
    inspRefs.cage.textContent = b.age < 730
      ? Math.round(b.age).toLocaleString() + ' days'
      : (b.age / 365.25).toPrecision(3) + ' years';
    inspRefs.clum.textContent = b.lum > 0.01 ? fmtLum(b.lum) : 'gone dark';
    inspRefs.ctv.textContent = b.coreT >= 1e6
      ? (b.coreT / 1e6).toPrecision(3) + ' million K'
      : Math.round(b.coreT).toLocaleString() + ' K';
    inspRefs.cfore.textContent = cloudForecast(c.mass);
    return;
  }

  if (b.kind === 'gal') {
    inspRefs.mass.textContent = fmtMass(b.m);
    if (inspRefs.gw) inspRefs.gw.textContent = fmtDist(b.galR);
    inspRefs.mval.textContent = fmtMass(b.m);
    const gp = dominantAt(b.p, b);
    if (gp && gp.m > b.m * 3) {
      inspRefs.orbL.textContent = 'Distance to ' + gp.name;
      inspRefs.orb.textContent = fmtDist(b.p.distanceTo(gp.p));
    } else {
      inspRefs.orbL.textContent = 'Orbiting';
      inspRefs.orb.textContent = '—';
    }
    return;
  }

  inspRefs.mass.textContent = fmtMass(b.m);
  inspRefs.rad.textContent = TYPES[b.type].naked ? '0 — a single point'
    : b.kind === 'bh' ? fmtRadius(b.r) + ' (horizon)' : fmtRadius(b.r);
  inspRefs.den.textContent = b.kind === 'bh' ? '—' : fmtDensity(b.m, b.r);
  inspRefs.spd.textContent = fmtSpeed(b.v.length());
  inspRefs.tmp.textContent = b.kind === 'bh' ? '—' : Math.round(b.temp).toLocaleString() + ' K';
  if (inspRefs.band) {
    const bd = starBand(b);
    inspRefs.band.textContent = bd ? bd.name : '—';
  }
  inspRefs.mval.textContent = fmtMass(b.m);
  if (inspRefs.core) {
    const t = b.coreT || 0;
    // Flagged when the tide is actively kneading it, because that is the moment
    // the number means something.
    const hot = b.tideX > 0.02 ? ' ▲' : '';
    inspRefs.core.textContent = (t >= 1e6 ? (t / 1e6).toPrecision(3) + ' M' : Math.round(t).toLocaleString() + ' ') + 'K' + hot;
  }
  if (inspRefs.strip) {
    inspRefs.strip.textContent = Math.round(clamp(b.stripped / Math.max(b.m0, 1e-12), 0, 1) * 100) + '% of it';
  }
  if (inspRefs.scars) inspRefs.scars.textContent = b.scarCount + (b.scarCount === 1 ? ' hit' : ' hits');
  if (inspRefs.life) inspRefs.life.textContent = Math.round(b.terra * 100) + '%';
  if (inspRefs.tfbar) {
    const pct = Math.round(b.terra * 100);
    inspRefs.tfbar.style.width = pct + '%';
    const live = terraCheck(b).ok;
    inspRefs.tfbar.className = live ? '' : 'dying';
    inspRefs.tfnote.textContent = pct >= 100
      ? (live ? 'Alive and holding. It stays that way while these conditions do.'
              : 'Alive, but the conditions have gone — it is about to start dying back.')
      : live ? 'Greening up: ' + pct + '% of the way there.'
             : 'Dying back: down to ' + pct + '%, and falling twice as fast as it grew.';
  }
  if (inspRefs.cage2) {
    const left = Math.max(0, (b.clumpLife || 420) - (b.clumpAge || 0));
    inspRefs.cage2.textContent = Math.round(b.clumpAge || 0).toLocaleString() + ' days';
    inspRefs.fate2.innerHTML = b.m >= CLUMP_COLLAPSE
      ? 'Heavy enough that its own gravity wins. In about <b>' + Math.round(left).toLocaleString() +
        ' days</b> it will pull itself together into a solid world — or press the button and do it now.'
      : 'Too thin to hold itself together. In about <b>' + Math.round(left).toLocaleString() +
        ' days</b> it will spread out and be gone. Drag the mass up past <b>' + fmtMass(CLUMP_COLLAPSE) +
        '</b> and gravity wins instead.';
  }
  if (inspRefs.dm && b.disc) {
    inspRefs.dm.textContent = fmtMass(b.disc.mass);
    inspRefs.dn.textContent = b.disc.made;
    inspRefs.dr.textContent = (b.disc.rOut / AU).toPrecision(3) + ' AU';
  }
  if (inspRefs.lum) inspRefs.lum.textContent = fmtLum(b.lum);
  if (inspRefs.age) {
    const life = msLifetime(b.m / M_SUN);
    inspRefs.age.textContent = life > 0
      ? clamp(b.age / life * 100, 0, 100).toFixed(1) + '%' : '—';
  }

  const prim = dominantAt(b.p, b);
  if (prim && prim.m > b.m * 3) {
    inspRefs.orbL.textContent = 'Distance to ' + prim.name;
    inspRefs.orb.textContent = fmtDist(b.p.distanceTo(prim.p));
  } else {
    inspRefs.orbL.textContent = 'Orbiting';
    inspRefs.orb.textContent = '—';
  }
}

/* ------------------------------------------------------------ time controls */

const RATES = [0.02, 0.1, 0.5, 1, 4, 16, 64, 256, 1024, 4096];
let rateIdx = 3;
/* Any speed can be typed, from a trillionth of a trillionth of a second per
   second up to 10^74 years per second. (All in days per second inside.) */
const RATE_MIN = 1e-24 / 86400;
const RATE_MAX = 1e74 * 365.25;
/* Past this the orbits cannot be followed any more — even 64 substeps a frame
   would each jump millions of years, and every world would simply be flung
   away. Above it the clock, stellar aging and every cosmic event still run at
   the full speed asked for; the motion runs as fast as it can be followed. */
const PHYS_MAX = 1e12;

/** Set the speed, in days per second, kept within the limits. */
function setRate(r) {
  sim.rate = clamp(r, RATE_MIN, RATE_MAX);
  // keep the « » ladder roughly in step with a typed speed
  rateIdx = 0;
  for (let i = 0; i < RATES.length; i++) if (RATES[i] <= sim.rate * 1.0001) rateIdx = i;
  syncRate();
}

function togglePlay() {
  sim.running = !sim.running;
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  if (sim.running) computeAccel();
}

/** « and »: the next preset up or down, and past either end, ×4 or ÷4. */
function changeRate(d) {
  const r = sim.rate;
  let next;
  if (d > 0) next = RATES.find(v => v > r * 1.0001) || r * 4;
  else next = RATES.slice().reverse().find(v => v < r * 0.9999) || r / 4;
  setRate(next);
}

const RATE_UNITS = [
  [1 / 86400, 'sec'], [1 / 1440, 'min'], [1 / 24, 'hours'], [1, 'days'], [365.25, 'years']
];
/** How a speed is shown: the biggest unit it is at least one of. */
function rateParts(r) {
  let u = RATE_UNITS[0];
  for (const x of RATE_UNITS) if (r >= x[0] * 0.9999) u = x;
  const v = r / u[0];
  const txt = v >= 1e6 || v < 0.01
    ? v.toExponential(2).replace(/\.?0+e/, 'e').replace('e+', 'e')
    : v.toPrecision(3).replace(/\.0+$|(\.\d*?)0+$/, '$1');
  return [txt, u[1]];
}

function syncRate() {
  const [v, u] = rateParts(sim.rate);
  $('an-rate-val').textContent = v;
  const unit = $('an-rate-unit');
  unit.textContent = u + ' / sec' + (sim.rate > PHYS_MAX ? ' · orbits capped' : '');
  unit.classList.toggle('capped', sim.rate > PHYS_MAX);
  unit.title = sim.rate > PHYS_MAX
    ? 'The clock and stellar aging run at this speed. Orbits run at the fastest speed they can be followed — about ' +
      rateParts(PHYS_MAX).join(' ') + ' per second.'
    : '';
}

/* Words a typed speed may use, on top of the usual time units. */
const RATE_WORDS = { 'week': 7, 'weeks': 7, 'month': 30.44, 'months': 30.44, 'decade': 3652.5, 'decades': 3652.5,
  'century': 36525, 'centuries': 36525, 'millennium': 365250, 'millennia': 365250,
  'kyr': 365250, 'myr': 365.25e6, 'gyr': 365.25e9, 'ms': 1 / 8.64e7, 'millisecond': 1 / 8.64e7, 'milliseconds': 1 / 8.64e7 };

/** "100 years", "1e-24 sec/sec", "5 min a second" → days per second, or NaN. */
function parseRate(text) {
  let t = String(text).toLowerCase().trim()
    .replace(/(\/|per|a|an|each)\s*(s|sec|secs|second|seconds)\s*$/, '').replace(/×\s*10\^?/g, 'e').trim();
  const m = /^([-+]?(?:\d[\d,]*\.?\d*|\.\d+)(?:e[-+]?\d+)?)\s*(.*)$/.exec(t);
  if (!m) return NaN;
  const n = Number(m[1].replace(/,/g, ''));
  let unit = m[2].trim();
  if (!unit) unit = rateParts(sim.rate)[1];            // no unit: the one on show
  if (unit === 'secs') unit = 'sec';
  const f = RATE_WORDS[unit] != null ? RATE_WORDS[unit] : UNITS.time[unit];
  return f != null && n > 0 && isFinite(n) ? n * f : NaN;
}

function bindRateInput() {
  const box = $('an-rate'), inp = $('an-rate-in');
  const open = () => {
    if (box.classList.contains('typing')) return;
    box.classList.add('typing');
    inp.value = rateParts(sim.rate).join(' ');
    inp.focus();
    inp.select();
  };
  const close = (apply) => {
    if (!box.classList.contains('typing')) return;
    box.classList.remove('typing');
    if (!apply) return;
    const r = parseRate(inp.value);
    if (!isFinite(r)) {
      toast('Type a speed like "5 days", "1e-24 sec" or "100 years" (per second)');
      return;
    }
    setRate(r);
    if (r < RATE_MIN) toast('That is slower than anything can go — set to the slowest, 1e-24 sec per second.');
    else if (r > RATE_MAX) toast('That is faster than anything can go — set to the fastest, 1e74 years per second.');
    else toast('Time now runs at ' + rateParts(sim.rate).join(' ') + ' per second' +
      (sim.rate > PHYS_MAX ? ' — too fast for orbits to follow, so they run at the fastest they can' : ''));
  };
  box.addEventListener('click', open);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); close(true); }
    else if (e.key === 'Escape') { e.preventDefault(); close(false); }
    e.stopPropagation();                               // typing must not trigger shortcuts
  });
  inp.addEventListener('blur', () => close(true));
}

function tgl(id, label, sub) {
  return '<div class="an-toggle"><div>' + label + (sub ? '<small>' + sub + '</small>' : '') +
    '</div><div class="an-sw" id="' + id + '"></div></div>';
}

function bindTgl(id, key, after, obj) {
  const store = obj || settings;
  const el = $(id);
  el.classList.toggle('on', !!store[key]);
  el.addEventListener('click', () => {
    store[key] = !store[key];
    el.classList.toggle('on', store[key]);
    if (after) after();
  });
}

/** A labelled range with a live value readout beside the label. */
function sld(id, label, min, max, step, value) {
  return '<div class="an-field"><label>' + label + ' <b id="' + id + '-v"></b></label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + value + '"></div>';
}

/**
 * Wire one up. `after` runs before the readout refreshes (used to keep coupled
 * sliders consistent), `onChange` after it (used to recompute the explanatory
 * notes); both are assigned onto the returned handle, so they can be set up
 * once every slider in a group exists.
 */
function bindSld(id, fmt, apply, onRelease) {
  const el = $(id), out = $(id + '-v');
  const ref = {
    el: el, after: null, onChange: null,
    show() { out.textContent = fmt(parseFloat(el.value)); },
    set(v) { el.value = v; ref.show(); }
  };
  el.addEventListener('input', () => {
    apply(parseFloat(el.value));
    if (ref.after) ref.after();
    ref.show();
    if (ref.onChange) ref.onChange();
  });
  if (onRelease) el.addEventListener('change', onRelease);
  ref.show();
  return ref;
}

/* ---- readouts that turn the supernova numbers into something picturable --- */

/** ⟨x⟩/√⟨x²⟩ for the velocity spectrum blastShell draws from. */
const EJ_SHAPE = 0.8471;

const ejectaSpeed = (foe, massMe) =>
  Math.sqrt(2 * foe * FOE / Math.max(massMe, 1e-9)) * EJ_SHAPE;

/* Ejecta speeds run to thousands of km/s, where fmtSpeed switches to a
   percentage of light speed — true, but far less readable than the number
   astronomers actually quote. */
const fmtKms = (gmPerDay) => Math.round(gmPerDay * 1e9 / 86400 / 1000).toLocaleString() + ' km/s';

/** Sustained peak of the light curve, ignoring the few-hour breakout spike. */
function peakLum(ni, rise, plateau, tPlat) {
  const e = { age: 0, ni: ni, rise: rise, plateau: plateau, tPlat: tPlat, breakout: 0 };
  let best = 0;
  for (let t = 0.5; t <= 220; t += 0.5) { e.age = t; best = Math.max(best, snLuminosity(e)); }
  return best;
}

function fmtErg(foe) {
  const e = Math.floor(Math.log10(Math.max(foe, 1e-9))) + 51;
  return (foe / Math.pow(10, e - 51)).toFixed(2) + '×10' + sup(e) + ' erg';
}

function fmtYears(days) {
  const y = days / 365.25;
  if (y >= 1e6) return (y / 1e6).toPrecision(3) + ' million years';
  if (y >= 1000) return Math.round(y).toLocaleString() + ' years';
  if (y >= 1) return y.toPrecision(3) + ' years';
  return Math.max(Math.round(days), 0).toLocaleString() + ' days';
}

function syncSettings() {
  const map = {
    'st-tidal': 'tidal', 'st-strip': 'strip', 'st-tideheat': 'tideHeat',

/* ================================================================== systems  */

/* Resolved in boot(), not at parse time, so a failed three.js load still
   reaches the friendly error screen instead of throwing here. */
let V3 = null;

/**
 * Put a body on a Keplerian orbit around `primary`. It starts at apoapsis, so
 * the velocity is purely tangential: v = sqrt(mu · (2/r − 1/a)).
 */
function orbitBody(type, primary, a, opts) {
  const o = opts || {};
  const ang = o.ang != null ? o.ang : Math.random() * TAU;
  const ecc = o.ecc || 0;
  // starts at aphelion, unless it is really near perihelion now (Sedna)
  const r0 = a * (o.peri ? 1 - ecc : 1 + ecc);
  const dir = new V3(Math.cos(ang), 0, Math.sin(ang));
  const tan = new V3(-Math.sin(ang), 0, Math.cos(ang));
  if (o.inc) tan.applyAxisAngle(dir, o.inc);          // tilt at the node
  const mu = G * settings.gravity * primary.m;
  const speed = Math.sqrt(Math.max(mu * (2 / r0 - 1 / a), 0)) * (o.retro ? -1 : 1);
  return makeBody(type,
    primary.p.clone().addScaledVector(dir, r0),
    primary.v.clone().addScaledVector(tan, speed),
    o.over);
}

/** Two bodies in a mutual circular orbit about their shared barycentre. */
function binaryPair(typeA, mA, typeB, mB, sep, center) {
  const c = center || new V3();
  const tot = mA + mB;
  const mu = G * settings.gravity * tot;
  const vRel = Math.sqrt(mu / sep);
  const a = makeBody(typeA, new V3(-sep * mB / tot, 0, 0).add(c), new V3(0, 0, -vRel * mB / tot), { mass: mA });
  const b = makeBody(typeB, new V3(sep * mA / tot, 0, 0).add(c), new V3(0, 0, vRel * mA / tot), { mass: mB });
  return [a, b];
}

const rE = (radiiEarth) => radiiEarth * R_EARTH;

/* ============================================================ asteroid belts */
/*
 * Thousands of rocks on their own orbits round a star, worked out directly
 * from Kepler's laws rather than integrated: an asteroid this small is pulled
 * about by nothing that matters on screen, and an orbit that is calculated
 * cannot go wrong at any speed of time. Drawn camera-relative so a belt stays
 * sharp even 26,000 light-years out in the Milky Way.
 *
 *   MAIN       the Asteroid Belt, 2.1–3.3 AU, between Mars and Jupiter
 *   TROJANS    two swarms sharing Jupiter's orbit, 60° ahead and 60° behind
 *   KUIPER     the icy belt beyond Neptune, 30–50 AU, where Pluto lives
 */
const BELT_MAX = 16000;
const belts = [];
const beltx = { pos: null, col: null, siz: null, geo: null, pts: null };
const BELT_KINDS = {
  main:   { n: 3600, a: [2.1, 3.3], inc: 0.20, col: [[0.62, 0.55, 0.48], [0.42, 0.40, 0.38], [0.72, 0.52, 0.40]] },
  trojan: { n: 1100, a: [0.96, 1.04], inc: 0.30, col: [[0.50, 0.40, 0.34], [0.40, 0.34, 0.30]] },
  kuiper: { n: 3200, a: [30, 50], inc: 0.30, col: [[0.62, 0.70, 0.82], [0.70, 0.62, 0.58], [0.55, 0.62, 0.72]] },
  // icy bodies Neptune has kicked onto long, steep orbits
  scattered: { n: 1500, a: [50, 150], inc: 0.75, log: true, col: [[0.60, 0.62, 0.70], [0.66, 0.52, 0.46]] },
  /* A sphere, not a disc: a trillion comets in every direction out to
     about 1.6 light-years. Nobody has seen it directly — it is known from the
     long-period comets that fall in from it — so it is drawn faint. */
  oort: { n: 5200, a: [2000, 100000], sphere: true, log: true, col: [[0.42, 0.50, 0.66], [0.50, 0.56, 0.66]] }
};

function makeBelt(host, kind, ref) {
  const spec = BELT_KINDS[kind];
  const rng = mulberry32(hashStr(kind + host.id));
  const n = spec.n;
  const b = { host, kind, ref, n, a: new Float64Array(n), th: new Float64Array(n), mm: new Float64Array(n),
    u: new Float32Array(n * 3), w: new Float32Array(n * 3), col: new Float32Array(n * 3), siz: new Float32Array(n) };
  const gm = G * host.m;
  for (let i = 0; i < n; i++) {
    // Kirkwood gaps: Jupiter has cleared narrow lanes out of the main belt
    let aAU;
    do {
      aAU = spec.log ? spec.a[0] * Math.pow(spec.a[1] / spec.a[0], rng())
        : lerp(spec.a[0], spec.a[1], kind === 'kuiper' ? Math.pow(rng(), 0.7) : rng());
    }
    while (kind === 'main' && [2.50, 2.82, 2.95].some(g => Math.abs(aAU - g) < 0.025));
    const a = kind === 'trojan' ? aAU : aAU * AU;     // trojans: a fraction of Jupiter's distance
    const node = rng() * TAU;
    const inc = spec.sphere ? Math.acos(2 * rng() - 1) : (rng() + rng() - 1) * spec.inc;
    const i3 = i * 3;
    b.u[i3] = Math.cos(node); b.u[i3 + 1] = 0; b.u[i3 + 2] = Math.sin(node);
    b.w[i3] = -Math.sin(node) * Math.cos(inc); b.w[i3 + 1] = Math.sin(inc); b.w[i3 + 2] = Math.cos(node) * Math.cos(inc);
    b.a[i] = a;
    if (kind === 'trojan') {
      // 60° ahead or behind, spread round the point in a tadpole-shaped cloud
      b.th[i] = (i % 2 ? 1 : -1) * Math.PI / 3 + (rng() + rng() - 1) * 0.45;
      b.mm[i] = (rng() - 0.5) * 0.002;                // a slow drift to and fro
    } else {
      b.th[i] = rng() * TAU;
      b.mm[i] = Math.sqrt(gm / (a * a * a));         // radians per day
    }
    const pal = spec.col[(rng() * spec.col.length) | 0];
    const br = 0.8 + rng() * 0.6;
    b.col[i3] = pal[0] * br; b.col[i3 + 1] = pal[1] * br; b.col[i3 + 2] = pal[2] * br;
    b.siz[i] = 1.1 + Math.pow(rng(), 3) * 1.6;
  }
  belts.push(b);
  return b;
}

/** The Sun's three belts; the Trojans need Jupiter to follow. */
function addSolarBelts(sun, jupiter) {
  makeBelt(sun, 'main');
  if (jupiter) makeBelt(sun, 'trojan', jupiter);
  makeBelt(sun, 'kuiper');
  makeBelt(sun, 'scattered');
  makeBelt(sun, 'oort');
  addOutskirts(sun);
}

function clearBelts() {
  belts.length = 0;
  for (const m of marks) disposeMark(m);
  marks.length = 0;
}

/* --------------------------------------------------------------- landmarks */
/*
 * Things out there that are not worlds: the five spacecraft leaving the Solar
 * System, the edge of the Sun's own bubble, and the Oort Cloud. Duck-typed
 * like a supernova remnant so each can be labelled, clicked, followed and
 * zoomed to, and each sits relative to its Sun, so it goes where the Sun goes.
 *
 * The probes are where they really are in late 2026 and fly outward at their
 * real speeds (ecliptic longitude and latitude, AU, AU per year).
 */
const marks = [];
const PROBES = [
  ['Voyager 1', 255, 35, 170, 3.57, 1977,
    'The farthest thing people have ever made. It left the Sun\'s bubble in 2012 and is now in interstellar space, still sending home a whisper from 23 hours away at the speed of light. It carries a golden record of sounds and pictures of Earth.'],
  ['Voyager 2', 300, -34, 142, 3.20, 1977,
    'The only spacecraft ever to visit Uranus and Neptune. It crossed into interstellar space in 2018, and it carries the same golden record as its twin.'],
  ['Pioneer 10', 73, 3, 138, 2.53, 1972,
    'The first spacecraft to cross the Asteroid Belt and fly past Jupiter. It went silent in 2003, heading towards the red star Aldebaran — it will get there in two million years.'],
  ['Pioneer 11', 285, 13, 117, 2.35, 1973,
    'The first visitor to Saturn. It has been silent since 1995, drifting towards the constellation Aquila. Both Pioneers carry a metal plaque with a drawing of who sent them.'],
  ['New Horizons', 292, 2, 63, 2.85, 2006,
    'Flew past Pluto in 2015 and the snowman-shaped Arrokoth in 2019, and is still working out in the Kuiper Belt.']
];
const HELIO_NOSE = 120, HELIO_TAIL = 380;   // AU: the heliopause, ahead and behind

function eclipticDir(lonDeg, latDeg) {
  const l = lonDeg * Math.PI / 180, b = latDeg * Math.PI / 180;
  return new THREE.Vector3(Math.cos(b) * Math.cos(l), Math.sin(b), Math.cos(b) * Math.sin(l));
}

function addOutskirts(sun) {
  for (const pr of PROBES) {
    const m = { kind: 'mark', sub: 'probe', alive: true, host: sun, name: pr[0], blurb: pr[6],
      dir: eclipticDir(pr[1], pr[2]), d0: pr[3] * AU, v: pr[4] * AU / 365.25, t0: sim.time, year: pr[5],
      p: new THREE.Vector3(), r: 0.02 * AU };
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0x9dffb0),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    sp.renderOrder = 6;
    scene.add(sp);
    m.sprite = sp;
    marks.push(m);
  }
  // The Sun's bubble: blown out against the wind of interstellar gas, with a
  // long tail behind. The nose points roughly where Voyager 1 went.
  const nose = eclipticDir(255, 5);
  const helio = { kind: 'mark', sub: 'place', alive: true, host: sun, name: 'Heliopause',
    blurb: 'The edge of the Sun\'s own bubble. The solar wind blows outward from the Sun until, about 120 times Earth\'s distance out, it is stopped by the thin gas between the stars. Past this line you are in interstellar space — only the two Voyagers have crossed it.',
    dir: nose, d0: HELIO_NOSE * AU, v: 0, t0: 0, p: new THREE.Vector3(), r: HELIO_NOSE * AU };
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uFade: { value: 0.5 } },
    vertexShader: UNI_VERT, fragmentShader: UNI_FRAG,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  }));
  mesh.frustumCulled = false;
  mesh.renderOrder = -6;
  // a sphere stretched along the tail and slid back so its nose sits at 120 AU
  mesh.scale.set((HELIO_NOSE + HELIO_TAIL) / 2 * AU, HELIO_NOSE * 1.1 * AU, HELIO_NOSE * 1.1 * AU);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), nose.clone().negate());
  scene.add(mesh);
  helio.mesh = mesh;
  helio.offset = nose.clone().multiplyScalar(-(HELIO_TAIL - HELIO_NOSE) / 2 * AU);
  marks.push(helio);
  marks.push({ kind: 'mark', sub: 'place', alive: true, host: sun, name: 'Oort Cloud',
    blurb: 'A vast shell of perhaps a trillion icy comets surrounding the whole Solar System, from about 2,000 to 100,000 times Earth\'s distance — a third of the way to the next star. Nobody has ever seen it directly; we know it is there because of the long-period comets that fall in from it.',
    dir: eclipticDir(120, 40), d0: 20000 * AU, v: 0, t0: 0, p: new THREE.Vector3(), r: 50000 * AU });
}

function disposeMark(m) {
  m.alive = false;
  if (m.sprite) { scene.remove(m.sprite); m.sprite.material.dispose(); }
  if (m.mesh) { scene.remove(m.mesh); m.mesh.geometry.dispose(); m.mesh.material.dispose(); }
  if (sim.selected === m) select(null);
  if (sim.follow === m) sim.follow = null;
}

function updateMarks() {
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i];
    if (!m.host.alive) { disposeMark(m); marks.splice(i, 1); continue; }
    m.shy = m.host.shy;
    const d = m.d0 + m.v * Math.max(sim.time - m.t0, 0);
    m.p.copy(m.host.p).addScaledVector(m.dir, d);
    const far = camera.position.distanceTo(m.host.p);
    const hidden = m.shy && far > SHY_RANGE && sim.selected !== m;
    if (m.sprite) {
      m.sprite.visible = !hidden;
      m.sprite.position.copy(m.p);
      m.sprite.scale.setScalar(6 * worldPerPixel(Math.max(camera.position.distanceTo(m.p), 1e-9)));
    }
    if (m.mesh) {
      m.mesh.visible = !hidden && far < 1e6 * AU;
      m.mesh.position.copy(m.host.p).add(m.offset);
      m.mesh.material.uniforms.uTime.value = performance.now() / 1000;
      // faint from inside, a glowing skin from outside
      m.mesh.material.uniforms.uFade.value = far < HELIO_NOSE * AU ? 0.12 : 0.45;
    }
  }
}

function renderMarkInspector(m) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = m.sub === 'probe' ? 'SPACECRAFT' : 'SELECTED';
  host.innerHTML =
    '<div class="an-name-in" style="cursor:default;pointer-events:none">' + escAttr(m.name) + '</div>' +
    '<div class="an-type">' + (m.sub === 'probe' ? 'launched ' + m.year : 'the edge of the Solar System') + '</div>' +
    '<dl class="an-stats">' +
    '<dt>From the Sun</dt><dd id="is-md"></dd>' +
    (m.sub === 'probe' ? '<dt>Speed</dt><dd id="is-mv"></dd><dt>Light takes</dt><dd id="is-ml"></dd>' : '') +
    '</dl>' +
    '<div class="an-row"><button id="is-mfollow">' + (sim.follow === m ? 'UNFOLLOW' : 'FOLLOW') +
    '</button><button id="is-mzoom">ZOOM TO</button></div>' +
    '<p class="an-note" style="margin-top:13px">' + escAttr(m.blurb) + '</p>';
  inspRefs = { md: $('is-md'), mv: $('is-mv'), ml: $('is-ml') };
  $('is-mfollow').addEventListener('click', () => { sim.follow = sim.follow === m ? null : m; renderInspector(); });
  $('is-mzoom').addEventListener('click', () => { frameOn(m, m.sub === 'probe' ? 400 : 3); sim.follow = m; renderInspector(); });
  updateInspectorStats();
}


function updateBelts() {
  for (let i = belts.length - 1; i >= 0; i--) if (!belts[i].host.alive) belts.splice(i, 1);
  if (!belts.length) { if (beltx.pts) beltx.geo.setDrawRange(0, 0); return; }
  if (!beltx.pts) {
    beltx.pos = new Float32Array(BELT_MAX * 3);
    beltx.col = new Float32Array(BELT_MAX * 3);
    beltx.siz = new Float32Array(BELT_MAX);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(beltx.pos, 3));
    geo.setAttribute('aCol', new THREE.BufferAttribute(beltx.col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(beltx.siz, 1));
    beltx.geo = geo;
    beltx.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
      uniforms: { uMap: { value: TEX_GLOW }, uDpr: { value: VIEW.dpr } },
      vertexShader: FX_VERT, fragmentShader: FX_FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    beltx.pts.frustumCulled = false;
    beltx.pts.renderOrder = 2;
    scene.add(beltx.pts);
  }
  const o = camera.position, t = sim.time;
  let n = 0;
  for (const b of belts) {
    const h = b.host.p;
    const d = o.distanceTo(h);
    // From far away a belt is just glare piled on its star; and in the Milky
    // Way map it must not give the Sun away from across the galaxy.
    const far = (b.kind === 'trojan' ? 5.5 : BELT_KINDS[b.kind].a[1]) * AU;
    if (d > far * 400 || (b.host.shy && d > SHY_RANGE && b.host !== sim.selected)) continue;
    const hx = h.x - o.x, hy = h.y - o.y, hz = h.z - o.z;
    let rJ = 0, thJ = 0;
    if (b.kind === 'trojan') {
      if (!b.ref || !b.ref.alive) continue;
      const dx = b.ref.p.x - h.x, dz = b.ref.p.z - h.z;
      rJ = Math.hypot(dx, dz); thJ = Math.atan2(dz, dx);
    }
    for (let i = 0; i < b.n && n < BELT_MAX; i++) {
      const i3 = i * 3;
      let a, th;
      if (b.kind === 'trojan') { a = b.a[i] * rJ; th = thJ + b.th[i] + Math.sin(t * 0.0009 + i) * 0.08 + b.mm[i]; }
      else { a = b.a[i]; th = (b.th[i] + b.mm[i] * t) % TAU; }
      const c = Math.cos(th) * a, sn = Math.sin(th) * a;
      const n3 = n * 3;
      beltx.pos[n3] = hx + b.u[i3] * c + b.w[i3] * sn;
      beltx.pos[n3 + 1] = hy + b.u[i3 + 1] * c + b.w[i3 + 1] * sn;
      beltx.pos[n3 + 2] = hz + b.u[i3 + 2] * c + b.w[i3 + 2] * sn;
      beltx.col[n3] = b.col[i3]; beltx.col[n3 + 1] = b.col[i3 + 1]; beltx.col[n3 + 2] = b.col[i3 + 2];
      beltx.siz[n] = b.siz[i];
      n++;
    }
  }
  beltx.geo.setDrawRange(0, n);
  for (const k of ['position', 'aCol', 'aSize']) beltx.geo.attributes[k].needsUpdate = true;
  beltx.pts.position.copy(o);
  beltx.pts.material.uniforms.uDpr.value = VIEW.dpr;
}

/** The Sun and its worlds, at their real distances, centred on `c` and all
    carried along at velocity `v` (zero on its own; the galactic orbit in the
    Milky Way). */
function buildSolarSystem(c, v) {
  const sun = makeBody('sol_sun', c.clone(), v.clone());
  // Semi-major axis in Gm and eccentricity, both as measured.
  const data = [
    ['sol_mercury', 57.91, 0.2056],
    ['sol_venus', 108.21, 0.0068],
    ['sol_earth', 149.60, 0.0167],
    ['sol_mars', 227.94, 0.0934],
    ['sol_jupiter', 778.48, 0.0489],
    ['sol_saturn', 1432.0, 0.0565],
    ['sol_uranus', 2867.0, 0.0457],
    ['sol_neptune', 4515.0, 0.0113],
    ['sol_pluto', 5906.4, 0.2488]
  ];
  const by = {};
  data.forEach((d, i) => {
    /* Pluto is started level with Neptune: as both go round, Neptune is then
       a quarter-orbit away whenever Pluto swings in close, which is the real
       3:2 resonance that keeps them from ever meeting. Pluto's orbit is also
       tipped 17°. Started anywhere else, Neptune can fling it out. */
    const pluto = d[0] === 'sol_pluto';
    by[d[0]] = orbitBody(d[0], sun, d[1], {
      ang: pluto ? 7 * 0.83 + 0.4 : i * 0.83 + 0.4, ecc: d[2], inc: pluto ? 0.2995 : 0
    });
  });
  orbitBody('sol_ceres', sun, 413.7, { ang: 2.9, ecc: 0.0785 });

  /* The major moons: [type, planet, distance in Gm, extra]. Uranus's family
     orbits on its side with the planet; Triton goes round backwards. */
  const MOONS = [
    ['sol_luna', 'sol_earth', 0.3844],
    ['sol_phobos', 'sol_mars', 0.009376], ['sol_deimos', 'sol_mars', 0.023463],
    ['sol_io', 'sol_jupiter', 0.4217], ['sol_europa', 'sol_jupiter', 0.6711],
    ['sol_ganymede', 'sol_jupiter', 1.0704], ['sol_callisto', 'sol_jupiter', 1.8827],
    ['sol_mimas', 'sol_saturn', 0.18552], ['sol_enceladus', 'sol_saturn', 0.238],
    ['sol_dione', 'sol_saturn', 0.3774], ['sol_rhea', 'sol_saturn', 0.5271],
    ['sol_titan', 'sol_saturn', 1.2219], ['sol_iapetus', 'sol_saturn', 3.5608],
    ['sol_miranda', 'sol_uranus', 0.1299, { inc: 1.70 }], ['sol_ariel', 'sol_uranus', 0.1909, { inc: 1.70 }],
    ['sol_umbriel', 'sol_uranus', 0.266, { inc: 1.70 }], ['sol_titania', 'sol_uranus', 0.4363, { inc: 1.70 }],
    ['sol_oberon', 'sol_uranus', 0.5835, { inc: 1.70 }],
    ['sol_triton', 'sol_neptune', 0.35476, { retro: true, inc: 0.4 }],
    ['sol_charon', 'sol_pluto', 0.019591]
  ];
  const lastA = {};
  MOONS.forEach((m, i) => {
    const host = by[m[1]];
    if (!host) return;
    /* Planets are drawn several times bigger than life so they can be found,
       and a few moons (Phobos, Mimas) orbit inside that drawn size — they
       would crash at once. Those are moved just clear of it, and the moons
       outside them shuffled out too, so they keep their real order and never
       share an orbit. */
    const clear = (host.r + TYPES[m[0]].rad * R_EARTH) * settings.bodyScale * 1.6;
    const a = Math.max(m[2], clear, (lastA[m[1]] || 0) * 1.25);
    lastA[m[1]] = a;
    orbitBody(m[0], host, a, Object.assign({ ang: i * 1.37 + 0.6 }, m[3] || {}));
  });

  /* Out past Neptune, on their real tilted, stretched orbits:
     [type, a (AU), eccentricity, inclination (°), extra] */
  const FAR = [
    ['sol_haumea', 43.1, 0.195, 28.2], ['sol_quaoar', 43.7, 0.04, 8.0],
    ['sol_makemake', 45.4, 0.16, 29.0], ['sol_gonggong', 67.4, 0.50, 30.6],
    ['sol_eris', 67.9, 0.436, 44.0], ['sol_vp113', 266, 0.69, 24.1],
    ['sol_sedna', 506, 0.85, 11.9, { peri: true }], ['sol_leleakuhonua', 1090, 0.94, 11.7]
  ];
  FAR.forEach((f, i) => {
    by[f[0]] = orbitBody(f[0], sun, f[1] * AU, Object.assign({ ang: i * 2.1 + 1.3, ecc: f[2], inc: f[3] * Math.PI / 180 }, f[4] || {}));
  });
  if (by.sol_eris) {
    const clear = (by.sol_eris.r + TYPES.sol_dysnomia.rad * R_EARTH) * settings.bodyScale * 1.6;
    orbitBody('sol_dysnomia', by.sol_eris, Math.max(0.0372, clear), { ang: 0.4 });
  }

  /* The next star system: Alpha Centauri, 4.37 light-years away — two
     Sun-like stars 23 times Earth's distance apart, and Proxima, a red dwarf a
     fifth of a light-year from them, with its planet. Only gravity's direction
     towards our Sun is real here; the rest of the sky is not mapped. */
  const toAC = eclipticDir(239.5, -42.6);
  const ac = c.clone().addScaledVector(toAC, 4.37 * LY_GM);
  /* Its real motion: closing at 22.4 km/s while sliding sideways at 23.5, so
     it sweeps past us (closest, 3.1 light-years, in about 28,000 years) and
     away again. Left still, the two systems would slowly fall together. */
  const kms = 0.0864;                                   // 1 km/s in Gm per day
  const side = new THREE.Vector3(0, 1, 0).cross(toAC).normalize();
  const acV = v.clone().addScaledVector(toAC, -22.4 * kms).addScaledVector(side, 23.5 * kms);
  const acA = makeBody('sun_like', ac.clone(), acV, { name: 'Alpha Centauri A', mass: 1.1 * M_SUN });
  orbitBody('sun_like', acA, 23.4 * AU, { ang: 0.7, ecc: 0.52, over: { name: 'Alpha Centauri B', mass: 0.907 * M_SUN } });
  const prox = orbitBody('red_dwarf', acA, 13000 * AU, { ang: 2.2, inc: 0.6, over: { name: 'Proxima Centauri', mass: 0.122 * M_SUN } });
  orbitBody('sol_proxima_b', prox, 0.0485 * AU, { ang: 1.0 });

  // The belts of rubble left over from building the planets, and beyond them
  // the spacecraft, the edge of the Sun's bubble and the Oort Cloud.
  addSolarBelts(sun, by.sol_jupiter);
  return sun;
}

const PRESETS = [

    name: 'The Solar System', desc: 'Our own eight planets at their real distances, on real orbital periods — with their major moons, the dwarf planets, the Asteroid and Kuiper Belts, and everything known beyond: Sedna, the Voyagers, the heliopause, the Oort Cloud and Alpha Centauri.',
    dist: 3400,
    build() { buildSolarSystem(new V3(), new V3()); }
  },
  {
    name: 'Earth & Moon', desc: 'Just the two of them, close up, with the Sun off to one side. A good place to try dropping something in.',
    dist: 1.1,

  },
  {
    name: 'Binary Sunset', desc: 'Two suns locked around each other, with a world far enough out to survive it.',
    dist: 900,
    build() {

      const r = 26000 * LY_GM, th = 2.2;
      const at = new V3(Math.cos(th) * r, 0, -Math.sin(th) * r);
      const vc = galVCirc(g.m, r, R * GAL_SOFT);
      const along = new V3(-Math.sin(th), 0, -Math.cos(th)).multiplyScalar(vc * g.galSpin);
      const before = sim.bodies.length;

    name: 'Galaxy Collision', desc: 'Two spirals on a grazing pass. Watch the tidal tails whip out behind them, then the orbit decay, then the merger. This is what the Milky Way and Andromeda are going to do.',
    dist: GAL_R_MW * 8,
    build() {
      // A prograde grazing encounter — the arrangement Toomre & Toomre used to
      // reproduce the Antennae, and the one that throws the longest tails. The
      // two discs are tilted differently so the tails are not mirror images.
      const R = GAL_R_MW, sep = R * 4.4;
      const a = makeBody('galaxy', new V3(-sep / 2, 0, 0), new V3(), { name: 'Milky Way' });
      const b = makeBody('galaxy', new V3(sep / 2, R * 0.28, 0), new V3(), { name: 'Andromeda' });
      a.galR = R; b.galR = R * 0.88;
      a.m = galMassFor(a.galR); b.m = galMassFor(b.galR);
      a.galAxis = new V3(0, 1, 0);
      b.galAxis = new V3(0.44, 0.86, 0.26).normalize();     // tilted to the encounter
      a.galArms = 2; b.galArms = 2;
      /* Both discs turn the same way round as the orbit does. This is the whole
         trick: a PROGRADE encounter resonates with the stars' own motion and
         throws enormous tails, while a retrograde one — the same two galaxies,
         one of them merely spinning the other way — barely marks them. Toomre
         and Toomre found this in 1972 and it is why the Antennae has two tails
         and not none. */
      a.galSpin = -1; b.galSpin = -1;
      seedGalaxyStars(a); seedGalaxyStars(b);

      /* Two thirds of the circular speed, measured through the same softened
         potential the integrator uses. That puts them on a long ellipse that
         brings them grazing past each other rather than either orbiting neatly
         forever or falling straight in. */
      const soft = a.galR * GAL_SOFT + b.galR * GAL_SOFT;
      const dd = sep * sep + soft * soft;
      const acc = G * settings.gravity * (a.m + b.m) * sep / (dd * Math.sqrt(dd));
      const v = Math.sqrt(acc * sep) * 0.66;
      a.v.set(0, 0, -v * 0.5); b.v.set(0, 0, v * 0.5);

      sim.running = true;
      setRate(RATES[8]);
      return a;
    }
  },
  {
    name: 'Terraforming', desc: 'Four dead worlds around one star. Only one of them can be brought to life where it stands — select each and the panel tells you exactly what is wrong with the other three.',
    dist: 900,
    build() {

      // In the zone, heavy enough, and dead. This is the one.

      // In the zone but far too light to hold an atmosphere down — the Mars problem.
      orbitBody('moon', s, 1.25 * AU, { ang: 3.6, over: { name: 'Thin', mass: 0.02 } });
      // Right mass, but out past the snow line and frozen solid.
      orbitBody('ice_world', s, 3.4 * AU, { ang: 5.0, over: { name: 'Frostbite', mass: 0.8 } });
      sim.running = true;
      return s;
    }
  },
  {

    dist: 500,
    build() { }
  }
];

function openSystems() {
  $('an-modal-title').textContent = 'Systems';
  let html = '<div class="an-presets">';
  PRESETS.forEach((p, i) => {
    html += '<button class="an-preset" data-i="' + i + '"><b>' + p.name + '</b><span>' + p.desc + '</span></button>';
  });
  html += '</div>';
  $('an-modal-body').innerHTML = html;
  $('an-modal-body').querySelectorAll('.an-preset').forEach(btn => {
    btn.addEventListener('click', () => { loadPreset(PRESETS[+btn.dataset.i]); closeModal(); });
  });
  openModal();

function clearAll() {
  for (const b of sim.bodies) { disposeVisual(b); }
  sim.bodies.length = 0;
  clearParticles();
  clearGalaxyStars();
  clearSupernovae();
  clearUniverses();
  clearBelts();
  clearDiscs();
  grewBodies.clear();
  pSources = [];
  usedNames.clear();
  sim.time = 0;
  sim.selected = null;
  sim.follow = null;
  renderInspector();
  toast('Universe cleared');
}

function loadPreset(p) {
  clearAll();
  sim.running = false;
  p.build();
  view.target.set(0, 0, 0);
  view.dist = p.dist;
  view.yaw = 0.75;
  view.pitch = 0.46;
  computeAccel();
  clearTrails();
  refreshStarCache();
  updateTemperatures();
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  $('an-hud-bodies').textContent = sim.bodies.length;
  toast(p.name);
}

/* ============================================================== persistence */

const SAVE_KEY = 'astronomia.save.v1';

function saveUniverse() {
  try {
    const data = {
      t: sim.time, settings: settings, sn: snSet, rateIdx: rateIdx, rate: sim.rate,
      cam: { t: view.target.toArray(), d: view.dist, y: view.yaw, p: view.pitch },
      bodies: sim.bodies.map(b => ({
        ty: b.type, n: b.name, m: b.m, r: b.r, s: b.seed, sp: b.spin, ti: b.tilt, ag: b.age,
        p: [b.p.x, b.p.y, b.p.z], v: [b.v.x, b.v.y, b.v.z],
        // Everything the customise panel can change, so a rebuilt body comes
        // back exactly as it was left rather than as a factory one.
        ct: b.coreT, tp: b.temp, rg: b.ringSpec, tn: b.tint,
        gw: b.ageGrow, gwt: b.ageGrowType, gc: b.ageCool, gh: b.bornHot,
        // A galaxy is saved as its shape, not as six thousand star positions —
        // the disc is rebuilt fresh on load. A collision in progress is lost.
        gx: b.kind === 'gal'
          ? { R: b.galR, arms: b.galArms, spin: b.galSpin, merged: b.galMerged || 0, P: b.galPeriod || 0, N: b.galN || 0,
              ax: b.galAxis ? b.galAxis.toArray() : null }
          : null,
        st: b.stripped, m0: b.m0, sc: b.scars, sn: b.scarCount, sy: b.shy ? 1 : 0,
        tf: b.terra, tfo: b.terraOn, wa: b.water,
        cl: b.kind === 'gas' ? { age: b.clumpAge, life: b.clumpLife } : null,
        // A protoplanetary disc is saved with its star, not on its own.
        dc: b.disc && b.disc.alive
          ? { rIn: b.disc.rIn, rOut: b.disc.rOut, mass: b.disc.mass, m0: b.disc.m0,
              made: b.disc.made, axis: b.disc.axis.toArray() }
          : null
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Universe saved (' + data.bodies.length + ' bodies)');
  } catch (e) {
    toast('Could not save — storage unavailable');
  }
}

function loadUniverse() {
  let data;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('No saved universe yet'); return; }
    data = JSON.parse(raw);
  } catch (e) { toast('Saved universe is unreadable'); return; }

  clearAll();
  for (const k in data.settings) if (k in settings) settings[k] = data.settings[k];
  // Key-by-key, so a save written before a setting existed still loads and just
  // keeps today's default for it.
  for (const k in (data.sn || {})) if (k in snSet) snSet[k] = data.sn[k];
  sim.time = data.t || 0;
  for (const s of data.bodies || []) {
    if (!TYPES[s.ty]) continue;
    const b = makeBody(s.ty, new V3().fromArray(s.p), new V3().fromArray(s.v), {
      mass: s.m, r: s.r, name: s.n, seed: s.s, spin: s.sp, tilt: s.ti, age: s.ag,
      coreT: s.ct, rings: s.rg !== undefined ? s.rg : undefined,
      terra: s.tf, terraOn: s.tfo, water: s.wa,
      // The disc is restored below with its saved budget, not a fresh one.
      noDisc: true
    });
    if (s.sc && s.sc.length) { b.scars = s.sc; b.scarCount = s.sn || s.sc.length; buildScars(b); }
    if (s.cl) { b.clumpAge = s.cl.age || 0; b.clumpLife = s.cl.life || 420; }
    if (s.tp != null) { b.temp = s.tp; updateLuminosity(b); }
    // How far aging has already swollen it, so it doesn't swell all over again
    if (s.gw) { b.ageGrow = s.gw; b.ageGrowType = s.gwt; b.ageCool = s.gc || 1; b.bornHot = !!s.gh; }
    if (s.gx && b.kind === 'gal') {
      b.galR = s.gx.R; b.galArms = s.gx.arms; b.galSpin = s.gx.spin;
      b.galMerged = s.gx.merged || 0;
      if (s.gx.P) b.galPeriod = s.gx.P;
      if (s.gx.N) b.galN = s.gx.N;
      if (s.gx.ax) b.galAxis = new V3().fromArray(s.gx.ax);
      seedGalaxyStars(b);
    }
    if (s.st != null) b.stripped = s.st;
    if (s.sy) b.shy = true;
    if (s.m0 != null) b.m0 = s.m0;
    if (s.tn) {
      const c = hexRgb(s.tn);
      b.tint = s.tn;
      if (!b.baseColor) b.baseColor = new THREE.Color();
      b.baseColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
      if (b.parts && b.parts.surf && b.parts.surf.material.color) b.parts.surf.material.color.copy(b.baseColor);
    }
    if (s.dc) {
      const d = makeDisc(b, s.dc);
      d.m0 = s.dc.m0 || d.mass;
      d.made = s.dc.made || 0;
    }
  }
  if (data.cam) {
    view.target.fromArray(data.cam.t);
    view.dist = data.cam.d; view.yaw = data.cam.y; view.pitch = data.cam.p;
  }
  if (data.rate != null) setRate(data.rate);
  else if (data.rateIdx != null) setRate(RATES[data.rateIdx]);
  // Belts are not saved rock by rock; a saved Sun simply gets its belts back.
  const sun = sim.bodies.find(b => b.type === 'sol_sun');
  if (sun && !belts.length) addSolarBelts(sun, sim.bodies.find(b => b.type === 'sol_jupiter'));
  computeAccel();
  clearTrails();
  closeModal();
  toast('Universe loaded (' + sim.bodies.length + ' bodies)');
}
