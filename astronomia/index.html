<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AstroNomia &mdash; Space Sandbox</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23090616'/%3E%3Ccircle cx='30' cy='30' r='13' fill='%23ff6fd8'/%3E%3Ccircle cx='25' cy='25' r='4' fill='%23ffc2f0' opacity='.6'/%3E%3Cellipse cx='30' cy='30' rx='24' ry='7' fill='none' stroke='%238be0ff' stroke-width='2.6' transform='rotate(-24 30 30)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #ff6fd8;
    --accent2: #8be0ff;
    --panel: rgba(16, 12, 38, 0.82);
    --panel-line: rgba(140, 120, 255, 0.28);
    --ink: #e9e9ff;
    --ink-dim: #a8a4d0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05040d;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #an-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  /* Soft vignette + scanlines to match the arcade */
  #an-vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.10) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center, transparent 52%, rgba(3,2,10,0.72) 100%);
  }

  /* ---------- shared panel chrome ---------- */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 13px;
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.6);
  }

  .panel-h {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    letter-spacing: 1.4px;
    color: var(--accent);
    text-shadow: 0 0 9px color-mix(in srgb, var(--accent) 70%, transparent);
    padding: 11px 12px 9px;
    border-bottom: 1px solid rgba(140,120,255,0.16);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }

  button, .btn {
    font-family: "Orbitron", sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--ink);
    background: rgba(58, 44, 110, 0.55);
    border: 1px solid rgba(150, 130, 255, 0.34);
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s, color .15s;
    white-space: nowrap;
  }
  button:hover, .btn:hover { background: rgba(90, 70, 165, 0.7); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.on { background: color-mix(in srgb, var(--accent) 30%, rgba(58,44,110,.6)); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }

  /* ---------- layout ---------- */
  #an-app { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #an-app > * { pointer-events: auto; }

  .an-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; align-items: flex-start; gap: 10px;
    pointer-events: none;
  }
  .an-top > * { pointer-events: auto; }

  .an-brand { display: flex; align-items: center; gap: 9px; }
  .an-back {
    display: grid; place-items: center;
    width: 34px; height: 34px;
    font-size: 13px; text-decoration: none; color: var(--ink);
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .an-back:hover { border-color: var(--accent); color: var(--accent); }

  .an-title {
    font-family: "Press Start 2P", monospace;
    font-size: 13px; letter-spacing: 1px; line-height: 1.5;
    background: linear-gradient(90deg, #ff6fd8, #b388ff, #8be0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(200,120,255,0.55));
  }
  .an-title span { font-size: 8px; color: var(--accent2); -webkit-text-fill-color: var(--accent2); }

  .an-time {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
  }
  .an-time button { min-width: 32px; text-align: center; padding: 7px 8px; }
  .an-rate { text-align: center; min-width: 86px; line-height: 1.25; }
  .an-rate b { display: block; font-family: "Orbitron", sans-serif; font-size: 13px; color: var(--accent2); }
  .an-rate span { font-size: 8.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-dim); }
  .an-clock {
    font-family: "Press Start 2P", monospace; font-size: 8px; letter-spacing: 1px;
    color: #ffd166; padding: 0 6px 0 10px; border-left: 1px solid rgba(140,120,255,0.2);
    min-width: 96px; text-align: center; line-height: 1.6;
  }

  .an-tools { margin-left: auto; display: flex; gap: 6px; padding: 6px; }

  /* ---------- palette (left) ---------- */
  .an-side {
    position: absolute; top: 62px; bottom: 58px;
    width: 214px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #an-palette { left: 10px; }
  #an-inspector { right: 10px; width: 232px; }

  .an-scroll { overflow-y: auto; overflow-x: hidden; padding: 8px; flex: 1; scrollbar-width: thin; }
  .an-scroll::-webkit-scrollbar { width: 7px; }
  .an-scroll::-webkit-scrollbar-thumb { background: rgba(150,130,255,0.32); border-radius: 4px; }

  .an-group { font-family: "Press Start 2P", monospace; font-size: 7px; letter-spacing: 1.2px;
    color: var(--ink-dim); margin: 12px 4px 6px; }
  .an-group:first-child { margin-top: 2px; }

  .an-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 6px 8px; margin-bottom: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; font-weight: 500; letter-spacing: 0;
    background: rgba(40, 30, 80, 0.4);
    border: 1px solid rgba(150, 130, 255, 0.16);
  }
  .an-item:hover { background: rgba(80, 62, 150, 0.6); }
  .an-item.armed {
    background: color-mix(in srgb, var(--accent) 26%, rgba(40,30,80,.5));
    border-color: var(--accent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .an-dot {
    width: 17px; height: 17px; border-radius: 50%; flex: none;
    box-shadow: 0 0 8px currentColor, inset -3px -3px 5px rgba(0,0,0,0.5);
  }
  .an-dot.ring::after {
    content: ""; display: block; position: relative; top: 6px; left: -6px;
    width: 29px; height: 5px; border: 1.6px solid currentColor; border-radius: 50%;
    transform: rotate(-20deg); opacity: .85;
  }
  .an-dot.hole { background: #07060f !important; border: 2px solid currentColor; }

  /* ---------- inspector (right) ---------- */
  .an-empty { padding: 18px 14px; font-size: 12px; line-height: 1.6; color: var(--ink-dim); text-align: center; }

  .an-name { font-family: "Orbitron", sans-serif; font-size: 15px; font-weight: 700; color: #fff; }
  .an-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); margin-top: 3px; }

  .an-stats { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 12px 0 4px; font-size: 11.5px; }
  .an-stats dt { color: var(--ink-dim); }
  .an-stats dd { text-align: right; font-family: "Orbitron", sans-serif; font-weight: 500; color: #dff3ff; }

  .an-field { margin: 11px 0 4px; }
  .an-field label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--ink-dim); margin-bottom: 5px;
  }
  .an-field label b { font-family: "Orbitron", sans-serif; font-size: 11px; color: var(--accent2); letter-spacing: 0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 3px; background: rgba(150,130,255,0.28);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid #14102c;
    box-shadow: 0 0 9px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; border: 2px solid #14102c;
    background: var(--accent); box-shadow: 0 0 9px var(--accent);
  }

  .an-row { display: flex; gap: 6px; margin-top: 10px; }
  .an-row button { flex: 1; padding: 8px 6px; font-size: 10px; }
  .an-danger { border-color: rgba(255,90,120,.5) !important; color: #ff9db0 !important; }
  .an-danger:hover { background: rgba(150,30,60,.55) !important; border-color: #ff5a78 !important; }

  .an-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 4px; font-size: 12px;
    border-bottom: 1px solid rgba(140,120,255,0.1);
  }
  .an-toggle:last-child { border-bottom: none; }
  .an-toggle small { display: block; font-size: 10px; color: var(--ink-dim); margin-top: 2px; line-height: 1.4; }
  .an-sw {
    flex: none; width: 40px; height: 21px; border-radius: 11px; cursor: pointer;
    background: rgba(150,130,255,0.2); border: 1px solid rgba(150,130,255,0.3);
    position: relative; transition: background .18s, border-color .18s;
  }
  .an-sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%; background: #a49ecd;
    transition: transform .18s, background .18s;
  }
  .an-sw.on { background: color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .an-sw.on::after { transform: translateX(19px); background: #fff; box-shadow: 0 0 9px var(--accent); }

  /* ---------- bottom strip ---------- */
  .an-hud {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 11px;
    font-family: "Press Start 2P", monospace; font-size: 7.5px; letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .an-hud b { color: var(--accent2); }
  .an-scalebar { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .an-scalebar i { display: block; height: 5px; border: 1px solid var(--ink-dim); border-top: none; width: 54px; }

  .an-hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    max-width: min(560px, calc(100vw - 500px));
    padding: 9px 15px; text-align: center;
    font-size: 12px; line-height: 1.5; color: #d8d4ff;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 11px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s;
  }
  .an-hint kbd {
    font-family: "Orbitron", sans-serif; font-size: 10px; font-weight: 700;
    background: rgba(150,130,255,.22); border: 1px solid rgba(150,130,255,.4);
    border-radius: 5px; padding: 2px 6px; margin: 0 1px; color: #fff;
  }

  /* ---------- world labels ---------- */
  .an-label {
    position: absolute; top: 0; left: 0;
    pointer-events: none; white-space: nowrap;
    font-family: "Orbitron", sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1px;
    color: #d7e6ff; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.8);
    opacity: 0.82;
  }
  .an-label.sel { color: var(--accent); opacity: 1; text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }

  /* ---------- aim + selection overlay ---------- */
  #an-overlay { position: fixed; inset: 0; z-index: 4; pointer-events: none; width: 100%; height: 100%; }
  /* The modal backdrop is translucent, so the reticle would show through it. */
  body.modal-open #an-overlay, body.modal-open .an-label { display: none; }

  /* ---------- modal ---------- */
  .an-modal {
    position: fixed; inset: 0; z-index: 10;
    display: none; place-items: center;
    padding: 20px;
    background: rgba(5, 4, 14, 0.78);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .an-modal.show { display: grid; }
  .an-sheet {
    width: min(760px, 100%); max-height: min(86vh, 720px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.7);
    overflow: hidden;
  }
  .an-sheet-h {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid rgba(140,120,255,0.18);
  }
  .an-sheet-h h2 {
    font-family: "Orbitron", sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 1px;
    color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .an-sheet-b { padding: 16px 18px 20px; overflow-y: auto; }

  .an-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); gap: 10px; }
  .an-preset {
    display: block; text-align: left; padding: 12px 13px;
    background: rgba(40, 30, 80, 0.45); border: 1px solid rgba(150,130,255,0.2);
    border-radius: 11px; font-family: inherit; letter-spacing: 0;
    white-space: normal;   /* undo the nowrap that all buttons inherit */
  }
  .an-preset:hover { background: rgba(80,62,150,0.6); border-color: var(--accent); transform: translateY(-2px); }
  .an-preset b { display: block; font-family: "Orbitron", sans-serif; font-size: 12.5px; color: #fff; margin-bottom: 4px; }
  .an-preset span { font-size: 11px; color: var(--ink-dim); line-height: 1.45; font-weight: 400; }

  .an-help h3 {
    font-family: "Press Start 2P", monospace; font-size: 8.5px; letter-spacing: 1.3px;
    color: var(--accent); margin: 18px 0 9px;
  }
  .an-help h3:first-child { margin-top: 0; }
  .an-help p, .an-help li { font-size: 12.5px; line-height: 1.65; color: #cdc9ee; }
  .an-help ul { padding-left: 18px; }
  .an-help li { margin-bottom: 5px; }
  .an-help b { color: #fff; }
  .an-help .an-keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; align-items: baseline; }
  .an-help .an-keys div:nth-child(odd) { text-align: right; }
  .an-help .an-keys span { color: #cdc9ee; }

  /* ---------- boot / toast ---------- */
  .an-boot {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; gap: 16px; align-content: center;
    background: radial-gradient(circle at 50% 40%, #201347 0%, #0a0718 55%, #05040d 100%);
    transition: opacity .5s;
  }
  .an-boot .an-title { font-size: clamp(15px, 5vw, 26px); }
  .an-boot p { font-family: "Press Start 2P", monospace; font-size: 8px; letter-spacing: 2px; color: #ffd166; animation: blink 1.1s steps(1) infinite; }
  .an-boot.gone { opacity: 0; pointer-events: none; }
  @keyframes blink { 50% { opacity: .2; } }

  .an-toast {
    position: absolute; left: 50%; top: 64px; transform: translate(-50%, -14px);
    padding: 9px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--accent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
    font-family: "Orbitron", sans-serif; font-size: 12px; font-weight: 700; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .an-toast.show { opacity: 1; transform: translate(-50%, 0); }

  .an-fail { padding: 30px; text-align: center; font-size: 14px; line-height: 1.7; max-width: 460px; }
  .an-fail a { color: var(--accent2); }

  /* ---------- responsive ---------- */
  .an-mob { display: none; }

  @media (max-width: 900px) {
    .an-hint { max-width: calc(100vw - 24px); font-size: 11.5px; }
    .an-side { top: 58px; bottom: 84px; width: 190px; }
    #an-inspector { width: 200px; }
    .an-clock { display: none; }
  }

  @media (max-width: 700px) {
    .an-top { flex-wrap: wrap; }
    .an-time { order: 3; margin-left: 0; width: 100%; justify-content: center; }
    .an-tools button span { display: none; }
    /* Shrink the wordmark just enough that the tool buttons share its row */
    .an-title { font-size: 10px; }
    .an-title span { display: none; }
    .an-back { width: 30px; height: 30px; }
    /* A bottom sheet covers the hint, so drop the hint while one is open */
    body.panel-open .an-hint { display: none; }
    .an-side {
      top: auto; bottom: 56px; width: calc(100vw - 20px); max-height: 42vh;
      left: 10px; right: 10px;
    }
    .an-side.hidden { display: none; }
    #an-inspector { width: calc(100vw - 20px); }
    .an-scroll { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 6px; align-content: start; }
    .an-group { grid-column: 1 / -1; }
    #an-inspector .an-scroll { display: block; }
    .an-mob { display: flex; position: absolute; left: 10px; bottom: 10px; gap: 6px; }
    .an-hud { left: auto; right: 10px; bottom: 10px; font-size: 7px; }
    .an-scalebar { display: none; }
    .an-hint { bottom: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .an-boot p { animation: none; }
  }
</style>
</head>
<body>

<canvas id="an-canvas"></canvas>
<svg id="an-overlay">
  <circle id="an-ret" fill="none" stroke="#ff6fd8" stroke-width="2" stroke-dasharray="13 10" opacity="0.95" style="display:none"/>
  <g id="an-aim" style="display:none">
    <line id="an-aim-line" stroke="#ff6fd8" stroke-width="2" stroke-dasharray="6 5"/>
    <circle id="an-aim-dot" r="5" fill="none" stroke="#ff6fd8" stroke-width="2"/>
    <text id="an-aim-txt" fill="#ffd166" font-family="Orbitron, sans-serif" font-size="11" font-weight="700"></text>
  </g>
</svg>
<div id="an-vignette"></div>

<div id="an-app">

  <div class="an-top">
    <div class="an-brand">
      <a class="an-back" href="../" title="Back to CuriousScout" aria-label="Back to CuriousScout">&#9664;</a>
      <div class="an-title">AstroNomia <span>1.0</span></div>
    </div>

    <div class="an-time panel">
      <button id="an-play" title="Play / pause (Space)">&#9654;</button>
      <button id="an-slower" title="Slower (,)">&laquo;</button>
      <div class="an-rate"><b id="an-rate-val">1</b><span id="an-rate-unit">days / sec</span></div>
      <button id="an-faster" title="Faster (.)">&raquo;</button>
      <div class="an-clock" id="an-clock">Y 0<br>D 0</div>
    </div>

    <div class="an-tools panel">
      <button id="an-btn-systems" title="Load a ready-made system">&#9733; <span>Systems</span></button>
      <button id="an-btn-settings" title="Simulation settings">&#9881; <span>Settings</span></button>
      <button id="an-btn-help" title="How to play">?</button>
    </div>
  </div>

  <aside class="an-side panel hidden" id="an-palette">
    <div class="panel-h">
      <span>ADD BODY</span>
      <span id="an-armed-lbl" style="font-size:7px;color:var(--ink-dim)"></span>
    </div>
    <div class="an-scroll" id="an-palette-list"></div>
  </aside>

  <aside class="an-side panel hidden" id="an-inspector">
    <div class="panel-h"><span id="an-insp-h">SELECTED</span></div>
    <div class="an-scroll" id="an-insp-body">
      <div class="an-empty">Nothing selected.<br><br>Tap a body to inspect it, or pick something from <b>Add Body</b> to build.</div>
    </div>
  </aside>

  <div class="an-mob">
    <button id="an-mob-add">&#43; Add</button>
    <button id="an-mob-insp">&#9432; Info</button>
  </div>

  <div class="an-hud">
    <span>BODIES <b id="an-hud-bodies">0</b></span>
    <span><b id="an-hud-fps">60</b> FPS</span>
    <span class="an-scalebar" id="an-scalebar"><b id="an-scale-lbl">1 Gm</b><i></i></span>
  </div>

  <div class="an-hint" id="an-hint"></div>
  <div class="an-toast" id="an-toast"></div>

  <div class="an-modal" id="an-modal">
    <div class="an-sheet">
      <div class="an-sheet-h">
        <h2 id="an-modal-title">Systems</h2>
        <button id="an-modal-close">CLOSE</button>
      </div>
      <div class="an-sheet-b" id="an-modal-body"></div>
    </div>
  </div>

</div>

<div class="an-boot" id="an-boot">
  <div class="an-title">AstroNomia <span>1.0</span></div>
  <p id="an-boot-msg">FORMING THE UNIVERSE&hellip;</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   AstroNomia 1.0 — a space sandbox
   --------------------------------------------------------------------------
   Units used everywhere in the simulation:
     mass   = Earth masses      (M⊕ = 5.972e24 kg)
     length = gigametres        (Gm = 1e9 m = 1,000,000 km)
     time   = days              (86400 s)
   In those units G works out to ~0.0029752, which puts Earth at 149.6 Gm from
   a 332,946 M⊕ Sun on a 365.2-day orbit. The physics is real; only the drawn
   size of bodies is exaggerated (see settings.bodyScale).
   ========================================================================== */
'use strict';

/* ---------------------------------------------------------------- constants */

const G = 0.0029752;             // Gm^3 / (M⊕ · day^2)
const R_EARTH = 0.006371;        // Earth radius in Gm
const M_SUN = 332946;            // Solar mass in M⊕
const R_SUN = 109.17;            // Solar radius in R⊕
const AU = 149.598;              // Astronomical unit in Gm
const C_LIGHT = 25902.068;       // speed of light in Gm/day (299,792 km/s)
const KG_PER_ME = 5.972e24;

// Schwarzschild radius (Gm) for a mass in M⊕
const schwarzschild = (m) => 2 * G * m / (C_LIGHT * C_LIGHT);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;

/* -------------------------------------------------------- number formatting */

function fmtMass(me) {
  if (me >= M_SUN * 0.05) return (me / M_SUN).toPrecision(3) + ' M☉';
  if (me >= 0.05) return me.toPrecision(3) + ' M⊕';
  const kg = me * KG_PER_ME;
  const e = Math.floor(Math.log10(kg));
  return (kg / Math.pow(10, e)).toFixed(2) + '×10' + sup(e) + ' kg';
}

function fmtRadius(gm) {
  const km = gm * 1e6;
  if (gm >= R_SUN * R_EARTH * 0.3) return (gm / (R_SUN * R_EARTH)).toPrecision(3) + ' R☉';
  if (km >= 1000) return (gm / R_EARTH).toPrecision(3) + ' R⊕';
  if (km >= 1) return Math.round(km).toLocaleString() + ' km';
  return (km * 1000).toPrecision(3) + ' m';
}

function fmtDist(gm) {
  if (gm >= AU * 0.05) return (gm / AU).toPrecision(3) + ' AU';
  if (gm >= 0.5) return (gm * 1e6).toPrecision(3) + ' km';
  return Math.round(gm * 1e6).toLocaleString() + ' km';
}

function fmtSpeed(gmPerDay) {
  const kms = gmPerDay * 1e9 / 86400 / 1000;
  if (kms >= 1000) return (kms / 299792.458 * 100).toPrecision(3) + '% c';
  return kms.toPrecision(3) + ' km/s';
}

function fmtDensity(me, gm) {
  const kg = me * KG_PER_ME;
  const m3 = (4 / 3) * Math.PI * Math.pow(gm * 1e9, 3);
  const d = kg / m3;
  return (d >= 100000 ? d.toExponential(2) : Math.round(d).toLocaleString()) + ' kg/m³';
}

function sup(n) {
  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

/* ============================================================== colour utils */

function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

/** Sample a gradient defined as [[pos, [r,g,b]], …] (positions ascending). */
function ramp(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      const k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      return mix(a[1], b[1], k);
    }
  }
  return stops[stops.length - 1][1].slice();
}

const css = (c) => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

/** Rough blackbody colour for a stellar temperature in kelvin. */
function kelvinToRGB(k) {
  k = clamp(k, 1000, 40000) / 100;
  let r, g, b;
  if (k <= 66) { r = 255; } else { r = 329.7 * Math.pow(k - 60, -0.1332); }
  if (k <= 66) { g = 99.47 * Math.log(k) - 161.1; } else { g = 288.1 * Math.pow(k - 60, -0.0755); }
  if (k >= 66) { b = 255; } else if (k <= 19) { b = 0; } else { b = 138.5 * Math.log(k - 10) - 305.0; }
  return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
}

/* ==================================================================== noise */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const smoothstep = (t) => t * t * (3 - 2 * t);

/**
 * A value-noise lattice that wraps in u (longitude) and clamps in v (latitude),
 * so equirectangular textures have no visible seam down the back of a planet.
 */
class Lattice {
  constructor(seed, gw, gh) {
    this.gw = gw; this.gh = gh;
    const r = mulberry32(seed);
    const g = new Float32Array(gw * (gh + 1));
    for (let i = 0; i < g.length; i++) g[i] = r();
    this.g = g;
  }
  at(u, v) {
    const gw = this.gw, gh = this.gh;
    const x = u * gw, y = clamp(v, 0, 1) * gh;
    let x0 = Math.floor(x), y0 = Math.floor(y);
    const tx = smoothstep(x - x0), ty = smoothstep(y - y0);
    const x1 = ((x0 + 1) % gw + gw) % gw;
    x0 = ((x0 % gw) + gw) % gw;
    const y1 = Math.min(y0 + 1, gh);
    y0 = clamp(y0, 0, gh);
    const g = this.g;
    const a = g[y0 * gw + x0], b = g[y0 * gw + x1];
    const c = g[y1 * gw + x0], d = g[y1 * gw + x1];
    return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
  }
}

/** Fractal brownian motion built from wrapping lattices. Returns f(u,v) → 0..1 */
function fbm(seed, gw, gh, octaves, gain) {
  gain = gain || 0.5;
  const layers = [];
  let amp = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    layers.push({ n: new Lattice(seed + i * 7919, Math.max(2, Math.round(gw * Math.pow(2, i))), Math.max(2, Math.round(gh * Math.pow(2, i)))), a: amp });
    norm += amp;
    amp *= gain;
  }
  return function (u, v) {
    let s = 0;
    for (let i = 0; i < layers.length; i++) s += layers[i].n.at(u, v) * layers[i].a;
    return s / norm;
  };
}

/** Ridged noise — good for mountain chains, cracks and filaments. */
function ridged(f) {
  return (u, v) => {
    const n = Math.abs(f(u, v) * 2 - 1);
    return 1 - n;
  };
}

/* ======================================================= texture primitives */

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Walk every pixel of an equirectangular map. fn(u, v, lat) → [r,g,b] */
function pixelPass(ctx, W, H, fn) {
  const img = ctx.createImageData(W, H);
  const d = img.data;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const lat = (0.5 - v) * Math.PI;         // +pi/2 north … -pi/2 south
    for (let x = 0; x < W; x++) {
      const c = fn((x + 0.5) / W, v, lat);
      d[i++] = c[0]; d[i++] = c[1]; d[i++] = c[2]; d[i++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/**
 * Scatter impact craters. Because an equirect map stretches horizontally
 * towards the poles, each crater is widened by 1/cos(latitude) so it still
 * reads as circular once wrapped onto the sphere.
 */
function craters(ctx, W, H, rng, count, rMin, rMax, tint) {
  tint = tint || [255, 255, 255];
  for (let i = 0; i < count; i++) {
    const u = rng(), v = 0.06 + rng() * 0.88;
    const lat = (0.5 - v) * Math.PI;
    const r = (rMin + Math.pow(rng(), 2.4) * (rMax - rMin)) * W;
    const stretch = 1 / Math.max(0.18, Math.cos(lat));
    const cx = u * W, cy = v * H;
    for (const off of [-W, 0, W]) {
      if (Math.abs(cx + off - W / 2) > W / 2 + r * stretch) continue;
      ctx.save();
      ctx.translate(cx + off, cy);
      ctx.scale(stretch, 1);
      // ejecta halo
      const halo = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r * 1.7);
      halo.addColorStop(0, rgba(tint, 0.16));
      halo.addColorStop(1, rgba(tint, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, TAU); ctx.fill();
      // bowl: shaded from upper-left, bright rim
      const bowl = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
      bowl.addColorStop(0, 'rgba(0,0,0,0.42)');
      bowl.addColorStop(0.72, 'rgba(0,0,0,0.20)');
      bowl.addColorStop(0.9, rgba(tint, 0.20));
      bowl.addColorStop(1, rgba(tint, 0.02));
      ctx.fillStyle = bowl;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

/** Glowing fracture lines — lava rifts, ice crevasses, diamond veins. */
function cracks(ctx, W, H, rng, count, color, width, glow) {
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    let x = rng() * W, y = 0.1 * H + rng() * 0.8 * H;
    let ang = rng() * TAU;
    const seg = 6 + (rng() * 14) | 0;
    const pts = [[x, y]];
    for (let s = 0; s < seg; s++) {
      ang += (rng() - 0.5) * 1.1;
      const len = W * (0.008 + rng() * 0.03);
      x += Math.cos(ang) * len; y += Math.sin(ang) * len;
      pts.push([x, y]);
    }
    for (const off of [-W, 0, W]) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0] + off, pts[0][1]);
      for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0] + off, pts[p][1]);
      if (glow) {
        ctx.strokeStyle = rgba(color, 0.20);
        ctx.lineWidth = width * 4.5;
        ctx.stroke();
        ctx.strokeStyle = rgba(color, 0.42);
        ctx.lineWidth = width * 2.1;
        ctx.stroke();
      }
      ctx.strokeStyle = rgba(color, glow ? 0.95 : 0.5);
      ctx.lineWidth = width * (0.5 + rng());
      ctx.stroke();
    }
  }
  ctx.restore();
}

/** Elongated cyclonic ovals, as seen on gas giants. */
function storms(ctx, W, H, rng, count, palette) {
  for (let i = 0; i < count; i++) {
    const v = 0.16 + rng() * 0.68;
    const lat = (0.5 - v) * Math.PI;
    const rx = W * (0.02 + rng() * 0.07);
    const ry = rx * (0.28 + rng() * 0.35);
    const cx = rng() * W, cy = v * H;
    const col = pick(palette);
    for (const off of [-W, 0, W]) {
      ctx.save();
      ctx.translate(cx + off, cy);
      ctx.scale(1 / Math.max(0.25, Math.cos(lat)), 1);
      ctx.rotate((rng() - 0.5) * 0.3);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, rgba(col, 0.95));
      g.addColorStop(0.55, rgba(col, 0.5));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

/** Frozen polar caps, feathered along a noisy edge. */
function iceCaps(ctx, W, H, rng, extent, color) {
  const f = fbm((rng() * 1e6) | 0, 10, 2, 3);
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const fromPole = Math.min(v, 1 - v) * 2;                 // 0 at pole, 1 at equator
    const edge = extent * (0.72 + f(0, v) * 0.6);
    if (fromPole > edge) continue;
    const t = clamp(1 - fromPole / edge, 0, 1);
    const a = smoothstep(clamp(t * 1.7, 0, 1));
    for (let x = 0; x < W; x++) {
      const wob = f((x + 0.5) / W, v);
      const aa = clamp(a * (0.55 + wob * 0.9), 0, 1);
      const i = (y * W + x) * 4;
      d[i] = d[i] + (color[0] - d[i]) * aa;
      d[i + 1] = d[i + 1] + (color[1] - d[i + 1]) * aa;
      d[i + 2] = d[i + 2] + (color[2] - d[i + 2]) * aa;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ========================================================= surface painters */
/* Each painter fills an equirectangular canvas for one class of world.       */

const SURFACE = {

  /* Airless grey cratered crust — moons, asteroids, impactors. */
  rock(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 6, 3, 5);
    const maria = fbm(seed + 555, 3, 2, 3);
    const base = o.dark
      ? [[0, [26, 22, 21]], [0.5, [52, 46, 44]], [1, [92, 84, 80]]]
      : [[0, [58, 54, 52]], [0.45, [104, 99, 95]], [0.75, [148, 143, 137]], [1, [196, 192, 186]]];
    pixelPass(ctx, W, H, (u, v) => {
      const e = elev(u, v);
      let c = ramp(base, e);
      const m = maria(u, v);
      if (m < 0.42) c = mix(c, o.dark ? [18, 16, 16] : [46, 44, 48], (0.42 - m) * 1.7);
      return c;
    });
    craters(ctx, W, H, rng, o.craters || 130, 0.006, 0.075, o.dark ? [120, 110, 104] : [222, 218, 210]);
  },

  /* Continents, oceans, ice caps — a living world. */
  terran(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 4, 2, 6);
    const mount = ridged(fbm(seed + 91, 8, 4, 4));
    const arid = fbm(seed + 3301, 3, 2, 3);
    const sea = o.sea != null ? o.sea : 0.5;
    const deep = [[0, [6, 22, 62]], [0.55, [12, 54, 116]], [1, [28, 104, 168]]];
    pixelPass(ctx, W, H, (u, v, lat) => {
      const e = elev(u, v);
      const cold = Math.pow(Math.abs(lat) / (Math.PI / 2), 1.6);
      if (e < sea) {
        const d = e / sea;
        let c = ramp(deep, d);
        if (d > 0.9) c = mix(c, [58, 148, 186], (d - 0.9) * 9);
        return c;
      }
      const h = (e - sea) / (1 - sea);
      const dryness = clamp(arid(u, v) * 1.3 - 0.25 + cold * 0.25, 0, 1);
      const green = ramp([[0, [196, 182, 132]], [0.08, [96, 132, 66]], [0.4, [48, 96, 48]], [0.7, [86, 96, 66]], [1, [128, 124, 112]]], h);
      const dry = ramp([[0, [204, 176, 124]], [0.3, [172, 138, 88]], [0.7, [136, 112, 80]], [1, [148, 140, 130]]], h);
      let c = mix(green, dry, dryness);
      const m = mount(u, v);
      if (h > 0.32 && m > 0.62) c = mix(c, [176, 172, 168], (m - 0.62) * 2.2);
      if (h > 0.62) c = mix(c, [244, 246, 252], clamp((h - 0.62) * 2.6, 0, 1));
      if (cold > 0.72) c = mix(c, [232, 238, 246], (cold - 0.72) * 2.4);
      return c;
    });
    iceCaps(ctx, W, H, rng, o.caps != null ? o.caps : 0.14, [238, 244, 252]);
  },

  /* A drowned world: shallow shelves, scattered archipelagos. */
  ocean(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 4, 2, 6);
    pixelPass(ctx, W, H, (u, v, lat) => {
      const e = elev(u, v);
      const cold = Math.pow(Math.abs(lat) / (Math.PI / 2), 1.8);
      if (e < 0.68) {
        let c = ramp([[0, [4, 26, 74]], [0.5, [10, 74, 148]], [0.85, [26, 132, 194]], [1, [88, 196, 214]]], e / 0.68);
        return mix(c, [70, 130, 170], cold * 0.35);
      }
      const h = (e - 0.68) / 0.32;
      return ramp([[0, [214, 202, 158]], [0.35, [120, 148, 92]], [1, [96, 104, 88]]], h);
    });
    iceCaps(ctx, W, H, rng, 0.18, [230, 240, 250]);
  },

  /* Dune seas and dust — Mars-like. */
  desert(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const dunes = ridged(fbm(seed + 77, 26, 6, 3));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [96, 52, 34]], [0.35, [152, 88, 52]], [0.6, [188, 124, 76]], [0.85, [208, 158, 108]], [1, [226, 196, 156]]], e);
      c = mix(c, [232, 204, 164], dunes(u, v) * 0.22);
      return c;
    });
    craters(ctx, W, H, rng, 46, 0.006, 0.05, [226, 196, 158]);
    iceCaps(ctx, W, H, rng, 0.09, [246, 240, 234]);
  },

  /* Fractured ice shell — Europa, Enceladus. */
  ice(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const dirt = fbm(seed + 12, 3, 2, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [176, 190, 208]], [0.5, [214, 228, 240]], [1, [246, 250, 255]]], e);
      const d = dirt(u, v);
      if (d < 0.4) c = mix(c, [148, 132, 118], (0.4 - d) * 1.1);
      return c;
    });
    cracks(ctx, W, H, rng, 34, [110, 140, 172], 1.6, false);
    cracks(ctx, W, H, rng, 12, [70, 96, 130], 2.6, false);
    craters(ctx, W, H, rng, 26, 0.005, 0.035, [252, 254, 255]);
  },

  /* Cooling crust over an open magma ocean. */
  lava(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const crust = fbm(seed, 6, 3, 5);
    const heat = ridged(fbm(seed + 404, 5, 3, 4));
    pixelPass(ctx, W, H, (u, v) => {
      const e = crust(u, v);
      let c = ramp([[0, [16, 10, 10]], [0.45, [42, 26, 24]], [0.8, [72, 42, 34]], [1, [104, 62, 44]]], e);
      const h = heat(u, v);
      if (h > 0.58) {
        const t = (h - 0.58) / 0.42;
        c = mix(c, ramp([[0, [140, 40, 12]], [0.5, [232, 108, 18]], [1, [255, 226, 140]]], t), Math.pow(t, 0.7));
      }
      return c;
    });
    cracks(ctx, W, H, rng, 40, [255, 148, 40], 1.8, true);
    cracks(ctx, W, H, rng, 14, [255, 236, 170], 1.2, true);
  },

  /* Banded, turbulent hydrogen envelope. */
  gas(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 5, 3, 4);
    const fine = fbm(seed + 21, 30, 10, 3);
    const pal = o.pal || [[0, [96, 62, 44]], [0.2, [176, 138, 96]], [0.36, [232, 212, 176]], [0.5, [188, 152, 108]], [0.64, [244, 232, 206]], [0.8, [162, 118, 84]], [1, [104, 70, 50]]];
    const bands = o.bands || 9;
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.06;
      const band = (Math.sin((v + w) * Math.PI * bands * 2) * 0.5 + 0.5);
      const t = clamp(v + w * 1.6 + (band - 0.5) * 0.09, 0, 1);
      let c = ramp(pal, t);
      c = mix(c, [255, 255, 255], (fine(u, v) - 0.5) * 0.10);
      return c;
    });
    storms(ctx, W, H, rng, o.storms != null ? o.storms : 7, o.stormPal || [[214, 122, 78], [246, 236, 210], [178, 96, 62]]);
  },

  /* Smooth methane haze with a lonely dark vortex. */
  icegiant(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 4, 3, 4);
    const wisp = fbm(seed + 66, 22, 8, 3);
    const pal = o.pal || [[0, [42, 74, 138]], [0.3, [64, 118, 190]], [0.5, [98, 164, 218]], [0.7, [72, 130, 196]], [1, [38, 68, 130]]];
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.05;
      const band = Math.sin((v + w) * Math.PI * 5) * 0.5 + 0.5;
      let c = ramp(pal, clamp(v + w + (band - 0.5) * 0.06, 0, 1));
      c = mix(c, [246, 252, 255], Math.pow(clamp(wisp(u, v) * 1.4 - 0.55, 0, 1), 1.4) * 0.5);
      return c;
    });
    storms(ctx, W, H, rng, 2, [[22, 38, 78], [30, 52, 96]]);
  },

  /* Convective granulation, spots and plage on a stellar photosphere. */
  star(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const gran = fbm(seed, 34, 14, 3);
    const cell = ridged(fbm(seed + 8, 22, 9, 2));
    const big = fbm(seed + 31, 5, 3, 3);
    const hot = kelvinToRGB(o.temp || 5778);
    const core = mix(hot, [255, 255, 255], 0.42);
    const cool = mix(hot, [40, 8, 0], 0.42);
    pixelPass(ctx, W, H, (u, v) => {
      const g = gran(u, v) * 0.55 + cell(u, v) * 0.45;
      let c = mix(cool, core, clamp(g * 1.25 - 0.1, 0, 1));
      c = mix(c, core, clamp((big(u, v) - 0.55) * 1.6, 0, 1) * 0.5);
      return [Math.min(255, c[0] * 1.06), Math.min(255, c[1] * 1.04), Math.min(255, c[2] * 1.02)];
    });
    // starspots
    const spots = o.spots != null ? o.spots : 7;
    for (let i = 0; i < spots; i++) {
      const u = rng(), v = 0.2 + rng() * 0.6;
      const lat = (0.5 - v) * Math.PI;
      const r = W * (0.012 + Math.pow(rng(), 2) * 0.05);
      for (const off of [-W, 0, W]) {
        ctx.save();
        ctx.translate(u * W + off, v * H);
        ctx.scale(1 / Math.max(0.25, Math.cos(lat)), 1);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
        g.addColorStop(0, rgba(mix(cool, [0, 0, 0], 0.55), 0.9));
        g.addColorStop(0.6, rgba(cool, 0.5));
        g.addColorStop(1, rgba(cool, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  },

  /* Degenerate remnant — smooth, blistering, faintly mottled. */
  dwarfstar(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 10, 5, 3);
    const hot = kelvinToRGB(o.temp || 12000);
    pixelPass(ctx, W, H, (u, v) => mix(mix(hot, [255, 255, 255], 0.55), hot, n(u, v) * 0.5));
  },

  /* Neutron star: iron crust, blazing magnetic poles. */
  neutron(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 12, 6, 3);
    pixelPass(ctx, W, H, (u, v, lat) => {
      const pole = Math.pow(Math.abs(Math.sin(lat)), 3);
      let c = mix([120, 150, 210], [210, 232, 255], n(u, v));
      return mix(c, [255, 255, 255], pole * 0.9);
    });
  },

  /* Diamond crust over a graphite mantle. */
  carbon(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 6, 3, 5);
    const facet = ridged(fbm(seed + 17, 30, 12, 3));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [14, 14, 18]], [0.5, [34, 34, 42]], [0.8, [58, 58, 70]], [1, [92, 94, 110]]], e);
      const f = facet(u, v);
      if (f > 0.72) c = mix(c, [214, 232, 255], (f - 0.72) * 2.6);
      return c;
    });
    cracks(ctx, W, H, rng, 26, [190, 226, 255], 1.3, true);
    craters(ctx, W, H, rng, 34, 0.005, 0.04, [150, 170, 200]);
  },

  /* A stripped metal core: streaked, oxidised, dense. */
  iron(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 4, 8, 5);
    const streak = fbm(seed + 5, 40, 4, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const e = clamp(base(u, v) * 0.75 + streak(u, v) * 0.25, 0, 1);
      let c = ramp([[0, [48, 40, 38]], [0.4, [102, 82, 72]], [0.65, [148, 116, 92]], [0.85, [176, 152, 132]], [1, [212, 198, 186]]], e);
      return c;
    });
    craters(ctx, W, H, rng, 70, 0.005, 0.05, [216, 200, 186]);
  },

  /* Cotton-candy super-puff: enormous, hazy, almost weightless. */
  puff(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 4, 3, 4);
    const haze = fbm(seed + 9, 14, 6, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.1;
      const band = Math.sin((v + w) * Math.PI * 4) * 0.5 + 0.5;
      let c = ramp([[0, [226, 190, 200]], [0.45, [244, 222, 226]], [0.7, [232, 208, 222]], [1, [216, 196, 216]]], clamp(v + w + (band - 0.5) * 0.1, 0, 1));
      return mix(c, [255, 252, 255], haze(u, v) * 0.3);
    });
  },

  /* Tidally locked "eyeball": a hot dayside eye, an iced nightside. */
  eyeball(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 6, 3, 5);
    const cloud = fbm(seed + 3, 10, 5, 4);
    pixelPass(ctx, W, H, (u, v, lat) => {
      // great-circle distance from the substellar point at (lon = pi, lat = 0)
      const d = Math.acos(clamp(Math.cos(lat) * Math.cos(u * TAU - Math.PI), -1, 1));
      const e = n(u, v);
      let c;
      if (d < 0.75) c = mix([48, 34, 30], [104, 72, 52], e);                       // scorched eye
      else if (d < 1.45) c = mix(ramp([[0, [16, 62, 108]], [1, [46, 128, 156]]], e), [86, 128, 78], e * 0.5); // melt ring
      else c = mix([202, 218, 236], [250, 253, 255], e);                            // frozen far side
      if (d > 1.1 && d < 1.7) c = mix(c, [244, 250, 255], (cloud(u, v) - 0.45) * 0.8);
      return c;
    });
  },

  /* Chthonian world — a gas giant's core after its atmosphere was boiled off. */
  chthonian(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const rift = ridged(fbm(seed + 13, 7, 4, 4));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [22, 16, 18]], [0.45, [50, 34, 34]], [0.75, [80, 56, 50]], [1, [116, 88, 76]]], e);
      const r = rift(u, v);
      if (r > 0.68) c = mix(c, [216, 84, 30], (r - 0.68) * 2.4);
      return c;
    });
    cracks(ctx, W, H, rng, 30, [255, 110, 40], 1.6, true);
    craters(ctx, W, H, rng, 44, 0.005, 0.045, [130, 104, 92]);
  },

  /* Comet nucleus: sooty, pitted, veined with exposed ice. */
  comet(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 6, 4, 5);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [16, 14, 14]], [0.5, [34, 30, 28]], [0.85, [58, 54, 50]], [1, [86, 82, 78]]], e);
      if (e > 0.78) c = mix(c, [206, 220, 236], (e - 0.78) * 3.4);
      return c;
    });
    craters(ctx, W, H, rng, 60, 0.008, 0.09, [150, 160, 172]);
  },

  /* A starless wanderer: frozen, dim, lightly cratered. */
  rogue(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const frost = fbm(seed + 44, 9, 4, 4);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [20, 24, 34]], [0.45, [38, 46, 62]], [0.75, [60, 72, 92]], [1, [92, 106, 128]]], e);
      c = mix(c, [172, 192, 214], Math.pow(clamp(frost(u, v) * 1.3 - 0.5, 0, 1), 1.3) * 0.6);
      return c;
    });
    craters(ctx, W, H, rng, 40, 0.005, 0.05, [126, 144, 168]);
  },

  /* Hycean: a hydrogen-blanketed ocean world under permanent overcast. */
  hycean(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 4, 2, 5);
    const swirl = fbm(seed + 7, 12, 6, 4);
    pixelPass(ctx, W, H, (u, v) => {
      let c = ramp([[0, [6, 34, 76]], [0.5, [14, 74, 130]], [1, [40, 130, 176]]], base(u, v));
      const s = clamp(swirl(u, v) * 1.5 - 0.42, 0, 1);
      return mix(c, [226, 240, 250], Math.pow(s, 1.2) * 0.85);
    });
  }
};

/* ================================================== auxiliary texture kinds */

/** Broken cloud deck with transparency, painted onto its own shell. */
function cloudTexture(seed, W, H, opacity, tintCol) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const f = fbm(seed, 6, 3, 5);
  const band = fbm(seed + 2, 3, 9, 3);
  const tint = tintCol || [255, 255, 255];
  const img = ctx.createImageData(W, H);
  const d = img.data;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      let n = f(u, v) * 0.75 + band(u, v) * 0.25;
      let a = clamp((n - 0.48) * 3.4, 0, 1);
      a = Math.pow(a, 1.25) * opacity;
      d[i++] = tint[0]; d[i++] = tint[1]; d[i++] = tint[2];
      d[i++] = (a * 255) | 0;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/**
 * Ring system. RingGeometry uses a planar UV projection, so this is painted as
 * a square disc of concentric bands rather than a strip.
 */
function ringTexture(seed, size, palette) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;
  ctx.clearRect(0, 0, size, size);
  const n = 190;
  for (let i = n; i >= 0; i--) {
    const t = i / n;                       // 0 inner … 1 outer
    const rad = c * (0.02 + t * 0.98);
    // layered band noise so gaps and bright ringlets alternate
    let a = 0.30 + 0.42 * Math.abs(Math.sin(t * 41 + r() * 0.15)) * Math.abs(Math.sin(t * 13.7));
    if (t > 0.42 && t < 0.48) a *= 0.10;   // a Cassini-like division
    if (t > 0.86) a *= 1 - (t - 0.86) / 0.14;
    if (t < 0.06) a *= t / 0.06;
    const col = mix(palette[0], palette[1], Math.abs(Math.sin(t * 7.3)));
    ctx.strokeStyle = rgba(col, clamp(a, 0, 1));
    ctx.lineWidth = c / n + 1.2;
    ctx.beginPath(); ctx.arc(c, c, rad, 0, TAU); ctx.stroke();
  }
  return cv;
}

/** Accretion disc: relativistic-hot inside, cooling outward. */
function accretionTexture(seed, size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;
  const n = 200;
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    const rad = c * (0.02 + t * 0.98);
    const col = ramp([
      [0, [255, 255, 255]], [0.12, [214, 236, 255]], [0.3, [255, 232, 176]],
      [0.55, [255, 150, 52]], [0.8, [186, 54, 22]], [1, [58, 12, 10]]
    ], t);
    let a = (1 - Math.pow(t, 1.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 60 + r() * 0.4)));
    if (t < 0.05) a *= t / 0.05;
    if (t > 0.9) a *= 1 - (t - 0.9) / 0.1;
    ctx.strokeStyle = rgba(col, clamp(a, 0, 1));
    ctx.lineWidth = c / n + 1.4;
    ctx.beginPath(); ctx.arc(c, c, rad, 0, TAU); ctx.stroke();
  }
  return cv;
}

/** Soft radial sprite used for star glow, coma and explosion sparks. */
function glowTexture(size, inner, hardness) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(inner, 'rgba(255,255,255,' + hardness + ')');
  g.addColorStop(0.45, 'rgba(255,255,255,' + (hardness * 0.28) + ')');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/** A one-sided gradient used for comet dust tails. */
function tailTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, size, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.18, 'rgba(210,235,255,0.42)');
  g.addColorStop(1, 'rgba(160,210,255,0)');
  ctx.fillStyle = g;
  // feather the edges across the short axis so it reads as a plume
  for (let y = 0; y < size; y++) {
    const t = Math.abs(y / size - 0.5) * 2;
    ctx.globalAlpha = Math.pow(1 - t, 1.8);
    ctx.fillRect(0, y, size, 1);
  }
  return cv;
}

    blurb: 'HYPOTHETICAL — a giant hiding far beyond Neptune, hinted at by the tilted orbits of distant ice.'
  }
};

const GROUPS = ['STARS', 'PLANETS', 'MOONS & DEBRIS', 'EXOTIC', 'HYPOTHETICAL'];

/* Representative swatch colour for each palette entry. */
const SWATCH = {
  red_dwarf: '#ff7a52', sun_like: '#ffe9a8', blue_giant: '#b9d4ff', red_supergiant: '#ff8a5c',
  white_dwarf: '#e8f2ff', neutron_star: '#cfe4ff',
  terrestrial: '#4d96ff', super_earth: '#5aa870', ocean_world: '#2bb4d6', desert_world: '#c98a52',
  ice_world: '#dbeaf7', lava_world: '#ff6a2a', gas_giant: '#d9b183', ice_giant: '#5aa8de',
  ringed_giant: '#e8d3a0',
  moon: '#b0aca6', dwarf_planet: '#cfe0ea', asteroid: '#7d746c', comet: '#9fd8ff',
  black_hole: '#b388ff', smbh: '#ff6fd8', white_hole: '#fff3b0', rogue_planet: '#54627e',
