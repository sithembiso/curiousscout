/** The body's current tint as a hex string, for the colour input. */
function bodyTintHex(b) {
  const c = b.baseColor;
  if (!c) return '#ffffff';
  return rgbHex([c.r * 255, c.g * 255, c.b * 255]);
}

function bindCustomise(b) {
  const show = {};
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

  /* ---- radius ---- */
  const rs = $('is-rad-s');
  if (rs) {
    show.rad = () => $('is-rv').textContent = fmtRadius(b.r);
    show.rad();
    rs.addEventListener('input', () => {
      b.r = Math.pow(10, parseFloat(rs.value));
      // Remember how far off its natural width this is, so changing the mass
      // later moves the radius instead of resetting it.
      const nat = trueRadius(b.type, b.m);
      b.rFactor = nat > 0 ? b.r / nat : 1;
      updateLuminosity(b);
      scaleVisual(b);
      show.rad();
      updateInspectorStats();
    });
  }

  /* ---- spin ---- */
  const sp = $('is-spin-s');
  const showSpin = () => {
    const p = Math.abs(b.spin);
    $('is-spv').textContent = (p >= 1 ? p.toPrecision(3) + ' days' : (p * 24).toPrecision(3) + ' hours') +
      (b.spin < 0 ? ' ↺' : '');
  };
  if (sp) {
    showSpin();
    sp.addEventListener('input', () => {
      b.spin = Math.pow(10, parseFloat(sp.value)) * (b.spin < 0 ? -1 : 1);
      showSpin();
    });
  }
  const retro = $('is-retro');
  if (retro) {
    retro.classList.toggle('on', b.spin < 0);
    retro.addEventListener('click', () => {
      b.spin = -b.spin;
      retro.classList.toggle('on', b.spin < 0);
      showSpin();
    });
  }

  /* ---- tilt ---- */
  const ti = $('is-tilt-s');
  if (ti) {
    const showTilt = () => $('is-tiv').textContent = Math.round(b.tilt * DEG) + '°';
    showTilt();
    ti.addEventListener('input', () => {
      b.tilt = parseFloat(ti.value) / DEG;
      if (b.ringSpec) b.ringSpec.tilt = b.tilt;
      showTilt();
    });
  }

  /* ---- temperature ---- */
  const ct = $('is-core-s');
  if (ct) {
    const star = TYPES[b.type].star;
    const showT = () => {
      const t = star ? b.temp : b.coreT;
      $('is-ctv2').textContent = t >= 1e6 ? (t / 1e6).toPrecision(3) + ' million K'
        : Math.round(t).toLocaleString() + ' K';
    };
    showT();
    ct.addEventListener('input', () => {
      const t = Math.pow(10, parseFloat(ct.value));
      if (star) {
        b.temp = t;
        updateLuminosity(b);
        // A star's colour *is* its temperature, so recolour its light and glare
        // to match rather than leaving them on the type's original value.
        const c = kelvinToRGB(t);
        if (b.lightColor) b.lightColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
        const p = b.parts;
        if (p && p.glow) p.glow.material.color.copy(b.lightColor);
        if (p && p.halo) p.halo.material.color.copy(b.lightColor);
      } else {
        b.coreT = t;
      }
      showT();
      updateInspectorStats();
    });
  }

  /* ---- surface tint ---- */
  on('is-tint', 'input', () => {
    const c = hexRgb($('is-tint').value);
    if (!b.baseColor) b.baseColor = new THREE.Color();
    b.baseColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
    b.tint = $('is-tint').value;
    const p = b.parts;
    if (p && p.surf && p.surf.material.color) p.surf.material.color.copy(b.baseColor);
  });

  /* ---- solid rings ---- */
  // Deliberately does NOT re-render the panel: rebuilding it would fold the
  // CUSTOMISE section shut, and the whole point is to press this repeatedly.
  on('is-solid', 'click', () => { if (b.alive) addSolidRing(b); });

  /* ---- rings ---- */
  const rOn = $('is-rings-on');
  if (rOn) {
    rOn.classList.toggle('on', !!b.ringSpec);
    rOn.addEventListener('click', () => {
      setRings(b, b.ringSpec ? null : (TYPES[b.type].rings || DEFAULT_RINGS()));
      renderInspector();
    });
  }
  // A colour picker fires continuously while it is dragged, and each repaint
  // redraws 190 arcs into a 512×512 canvas — so repaints are rate-limited and
  // one final one is always guaranteed on release.
  let lastPaint = 0, paintTimer = 0;
  const reRing = (repaint) => {
    const s = b.ringSpec;
    // Keep the edges from crossing over, whichever one is being dragged.
    s.outer = Math.max(s.outer, s.inner + 0.08);
    let paint = false;
    if (repaint) {
      const now = performance.now();
      if (now - lastPaint > 110) { lastPaint = now; paint = true; }
      else {
        clearTimeout(paintTimer);
        paintTimer = setTimeout(() => { if (b.alive && b.ringSpec) setRings(b, b.ringSpec, true); }, 130);
      }
    }
    setRings(b, s, paint);
    if ($('is-ri-v')) $('is-ri-v').textContent = s.inner.toFixed(2) + '× radius';
    if ($('is-ro-v')) $('is-ro-v').textContent = s.outer.toFixed(2) + '× radius';
    if ($('is-rop-v')) $('is-rop-v').textContent = Math.round((s.opacity != null ? s.opacity : 0.92) * 100) + '%';
  };
  if (b.ringSpec && $('is-ri')) {
    on('is-ri', 'input', () => { b.ringSpec.inner = parseFloat($('is-ri').value); reRing(); });
    on('is-ro', 'input', () => { b.ringSpec.outer = parseFloat($('is-ro').value); reRing(); });
    on('is-rop', 'input', () => { b.ringSpec.opacity = parseFloat($('is-rop').value); reRing(); });
    on('is-rc1', 'input', () => { b.ringSpec.pal[0] = hexRgb($('is-rc1').value); reRing(true); });
    on('is-rc2', 'input', () => { b.ringSpec.pal[1] = hexRgb($('is-rc2').value); reRing(true); });
    reRing();
  }

  /* ---- back to factory ---- */
  on('is-reset', 'click', () => {
    const def = TYPES[b.type];
    b.rFactor = 1;
    b.r = trueRadius(b.type, b.m);
    b.spin = def.spin || 1;
    b.tilt = def.tilt != null ? def.tilt : def.rings ? def.rings.tilt : 0;
    b.temp = def.temp || b.temp;
    b.coreT = baseCoreT(def, b.m);
    b.tint = null;
    b.ringSpec = def.rings ? Object.assign({}, def.rings) : null;
    updateLuminosity(b);
    refreshVisual(b);
    renderInspector();
    toast(b.name + ' is back to a standard ' + def.label);
  });
}

/* ------------------------------------------------------- galaxies & discs  */

function renderGalaxyInspector(b) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = 'SELECTED';
  const lm = Math.log10(Math.max(b.m, 1));
  const lr = Math.log10(Math.max(b.galR, 1));
  let stars = 0;
  for (let k = 0; k < GAL_MAX; k++) if (galx.own[k] === b.id) stars++;

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false" value="' + escAttr(b.name) + '">' +
    '<div class="an-type">' + (b.galMerged ? 'MERGER REMNANT' : 'GALAXY') + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Core mass</dt><dd id="is-mass"></dd>' +
    '<dt>Disc radius</dt><dd id="is-gw"></dd>' +
    '<dt>Stars simulated</dt><dd>' + stars.toLocaleString() + '</dd>' +
    '<dt>Spiral arms</dt><dd>' + b.galArms + (b.galSpin < 0 ? ' ↺' : '') + '</dd>' +
    (b.galMerged ? '<dt>Galaxies eaten</dt><dd>' + b.galMerged + '</dd>' : '') +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Core mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="3" max="' + Math.log10(1e12 * M_SUN).toFixed(2) +
    '" step="0.01" value="' + lm.toFixed(3) + '"></div>' +
    '<p class="an-note">Everything that holds this galaxy together. A real one weighs about a trillion Suns — drag it all the way up and see what that does to the stars.</p>' +
    '<div class="an-field"><label>Disc radius <b id="is-gwv"></b></label>' +
    '<input type="range" id="is-gwide" min="1" max="7" step="0.01" value="' + lr.toFixed(3) + '"></div>' +
    '<p class="an-note">Changing this rebuilds the disc from scratch, so anything already happening to it is lost.</p>' +
    '<div class="an-row"><button id="is-reseed">REBUILD THE DISC</button></div>' +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-del" class="an-danger">REMOVE</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' +
    (b.galMerged
      ? 'What is left after a collision: two ordered discs stirred into one shapeless blob, with the stars still on whatever orbits the wreck left them. This is where elliptical galaxies come from.'
      : TYPES.galaxy.blurb) + '</p>';

  inspRefs = { mass: $('is-mass'), gw: $('is-gw'), mval: $('is-mval'), orb: $('is-orb'), orbL: $('is-orb-l') };

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const ms = $('is-mslider');
  ms.addEventListener('input', () => {
    b.m = Math.pow(10, parseFloat(ms.value));
    computeAccel();
    updateInspectorStats();
  });

  const gw = $('is-gwide');
  const showGw = () => $('is-gwv').textContent = fmtDist(b.galR);
  showGw();
  gw.addEventListener('input', () => { b.galR = Math.pow(10, parseFloat(gw.value)); showGw(); updateInspectorStats(); });
  // Rebuilt on release, not on every frame of the drag — reseeding six thousand
  // stars sixty times a second would be absurd. The mass comes along with the
  // size, so a resized galaxy still turns once every GAL_PERIOD days.
  gw.addEventListener('change', () => {
    b.m = galMassFor(b.galR);
    seedGalaxyStars(b);
    computeAccel();
    renderInspector();
  });

  $('is-reseed').addEventListener('click', () => { seedGalaxyStars(b); b.galMerged = 0; renderInspector(); toast(b.name + '’s disc rebuilt'); });
  $('is-follow').addEventListener('click', () => { sim.follow = sim.follow === b ? null : b; renderInspector(); });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 2.4); sim.follow = b; renderInspector(); });
  $('is-del').addEventListener('click', () => { select(null); removeBody(b); compact(); });

  updateInspectorStats();
}

/** The panel block for a star that still has a disc around it. */
function discHTML(d) {
  return '<div class="an-sec">PROTOPLANETARY DISC</div>' +
    '<dl class="an-stats">' +
    '<dt>Material left</dt><dd id="is-dm"></dd>' +
    '<dt>Planets made</dt><dd id="is-dn"></dd>' +
    '<dt>Outer edge</dt><dd id="is-dr"></dd>' +
    '</dl>' +
    '<p class="an-note">Every planet is built out of this, and takes its mass with it. Where the ice line falls decides what gets made: rock on the warm side, giants just beyond it.</p>' +
    '<div class="an-row"><button id="is-dnow">MAKE A PLANET NOW</button></div>' +
    '<div class="an-row"><button id="is-dblow" class="an-danger">BLOW THE DISC AWAY</button></div>';
}

function bindDisc(b, d) {
  const now = $('is-dnow');
  if (now) {
    now.addEventListener('click', () => {
      if (!d.alive) return;
      if (d.mass <= d.m0 * 0.04) { toast('The disc is spent — there is nothing left to build with'); return; }
      if (condenseFromDisc(d)) { d.next = Math.max(settings.discYears, 0.02) * 365.25; renderInspector(); }
    });
  }
  const blow = $('is-dblow');
  if (blow) {
    blow.addEventListener('click', () => {
      d.fade = 0.001;
      toast(b.name + ' blew its disc away');
      renderInspector();
    });
  }
}

/**
 * The panel for a knot of gas. The one thing worth knowing about it is whether
 * it is heavy enough to survive — below the collapse mass it is going to spread
 * out and be gone, and above it there is a world coming.
 */
function renderClumpInspector(b) {
  const host = $('an-insp-body');
  $('an-insp-h').textContent = 'SELECTED';
  const lm = Math.log10(Math.max(b.m, 1e-9));

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false" value="' + escAttr(b.name) + '">' +
    '<div class="an-type">GAS CLUMP</div>' +
    '<dl class="an-stats">' +
    '<dt>Mass</dt><dd id="is-mass"></dd>' +
    '<dt>Radius</dt><dd id="is-rad"></dd>' +
    '<dt>Density</dt><dd id="is-den"></dd>' +
    '<dt>Speed</dt><dd id="is-spd"></dd>' +
    '<dt>Temperature</dt><dd id="is-tmp"></dd>' +
    '<dt>Age</dt><dd id="is-cage2"></dd>' +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="-5" max="2.2" step="0.001" value="' + lm.toFixed(3) + '"></div>' +
    '<p class="an-note" id="is-fate2"></p>' +
    '<div class="an-row"><button id="is-collapse2">COLLAPSE IT NOW</button></div>' +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-disperse2" class="an-danger">LET IT GO</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' + TYPES.gas_clump.blurb + '</p>';

  inspRefs = {
    mass: $('is-mass'), rad: $('is-rad'), den: $('is-den'), spd: $('is-spd'),
    tmp: $('is-tmp'), orb: $('is-orb'), orbL: $('is-orb-l'), mval: $('is-mval'),
    cage2: $('is-cage2'), fate2: $('is-fate2')
  };

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const ms = $('is-mslider');
  ms.addEventListener('input', () => {
    b.m = Math.pow(10, parseFloat(ms.value));
    b.r = trueRadius('gas_clump', b.m);
    scaleVisual(b);
    updateInspectorStats();
  });

  $('is-collapse2').addEventListener('click', () => {
    if (!b.alive) return;
    if (b.m < CLUMP_COLLAPSE) { toast('Too thin to hold together — feed it more mass first'); return; }
    collapseClump(b);
  });
  $('is-follow').addEventListener('click', () => { sim.follow = sim.follow === b ? null : b; renderInspector(); });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 4); sim.follow = b; renderInspector(); });
  $('is-disperse2').addEventListener('click', () => { disperseClump(b, true); toast(b.name + ' was let go'); });

  updateInspectorStats();
}

function renderInspector() {
  const host = $('an-insp-body');
  const b = sim.selected;
  inspRefs = null;
  if (!b || !b.alive) {
    $('an-insp-h').textContent = 'SELECTED';
    host.innerHTML = '<div class="an-empty">Nothing selected.<br><br>Tap a body to inspect it, or pick something from <b>Add Body</b> to build.</div>';
    return;
  }
  if (b.kind === 'snr') { renderCloudInspector(b); return; }
  if (b.kind === 'gal') { renderGalaxyInspector(b); return; }
  if (b.kind === 'gas') { renderClumpInspector(b); return; }
  const def = TYPES[b.type];
  $('an-insp-h').textContent = 'SELECTED';
  // A rocky world's range has to reach past the gas-giant threshold, or the
  // slider could never trigger it. The range is also widened to contain the
  // body's actual mass, otherwise setting `value` would silently clamp it and
  // the readout would disagree with the physics.
  const lm = Math.log10(Math.max(b.m, 1e-12));
  const topMass = isRocky(b) ? Math.max(def.mass * 120, GAS_THRESHOLD * 2.5) : def.mass * 80;
  const massMin = Math.min(Math.log10(Math.max(def.mass * 0.02, 1e-11)), lm);
  const massMax = Math.max(Math.log10(topMass), lm);

  // Stars get a fate readout: what this one would do if its core gave way now,
  // or exactly what is missing if it could not.
  const isStar = def.star && b.kind === 'body';
  const plan = isStar ? snPlan(b) : null;

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false"' +
    ' title="Click to rename" aria-label="Body name" value="' + escAttr(b.name) + '">' +
    '<div class="an-type" id="is-typelbl">' + def.label + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Mass</dt><dd id="is-mass"></dd>' +
    '<dt>Radius</dt><dd id="is-rad"></dd>' +
    '<dt>Density</dt><dd id="is-den"></dd>' +
    '<dt>Speed</dt><dd id="is-spd"></dd>' +
    '<dt>Surface temp</dt><dd id="is-tmp"></dd>' +
    (b.kind === 'body' ? '<dt>Inside temp</dt><dd id="is-core"></dd>' : '') +
    (isStar ? '<dt>Luminosity</dt><dd id="is-lum"></dd>' : '') +
    (starBand(b) ? '<dt>Colour</dt><dd id="is-band"></dd>' : '') +
    (isStar && snSet.aging ? '<dt>Fuel burned</dt><dd id="is-age"></dd>' : '') +
    (b.stripped > 0 ? '<dt>Torn away</dt><dd id="is-strip"></dd>' : '') +
    (b.scarCount > 0 ? '<dt>Impact scars</dt><dd id="is-scars"></dd>' : '') +
    (b.terra > 0 && b.kind === 'body' ? '<dt>Living surface</dt><dd id="is-life"></dd>' : '') +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="' + massMin.toFixed(3) + '" max="' + massMax.toFixed(3) + '" step="0.001" value="' + Math.log10(b.m).toFixed(3) + '"></div>' +
    (isStar && snSet.on ? snPanelHTML(plan) : '') +
    (b.disc && b.disc.alive ? discHTML(b.disc) : '') +
    terraHTML(b) +
    customiseHTML(b) +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-shatter" class="an-danger">SHATTER</button><button id="is-del" class="an-danger">REMOVE</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' + def.blurb + '</p>';

  inspRefs = {
    mass: $('is-mass'), rad: $('is-rad'), den: $('is-den'), spd: $('is-spd'),
    tmp: $('is-tmp'), orb: $('is-orb'), orbL: $('is-orb-l'), mval: $('is-mval'),
    lum: $('is-lum'), age: $('is-age'), core: $('is-core'), strip: $('is-strip'),
    band: $('is-band'),
    scars: $('is-scars'), dm: $('is-dm'), dn: $('is-dn'), dr: $('is-dr'),
    tfbar: $('is-tfbar'), tfnote: $('is-tfnote'), life: $('is-life')
  };

  if (b.disc && b.disc.alive) bindDisc(b, b.disc);
  bindTerra(b);
  bindCustomise(b);

  const snBtn = $('is-sn');
  if (snBtn) {
    snBtn.addEventListener('click', () => {
      const name = b.name;
      const p = goSupernova(b);
      if (p) { toast(name + ' went ' + p.label + '!'); renderInspector(); }
    });
  }

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const slider = $('is-mslider');
  slider.addEventListener('input', () => {
    const nb = sim.selected;
    if (!nb) return;
    nb.m = Math.pow(10, parseFloat(slider.value));
    nb.r = natRadius(nb);
    // Rebuilding the panel mid-drag would kill the drag, so on transformation
    // just patch the type label in place; the full refresh waits for release.
    inspectorLock++;
    const ev = checkEvolution(nb);
    inspectorLock--;
    if (ev) {
      const lbl = $('is-typelbl');
      if (lbl) lbl.textContent = TYPES[nb.type].label;
      toast(nb.name + EVOLVE_NOTE[ev]);
    } else {
      updateLuminosity(nb);
      scaleVisual(nb);
    }
    updateInspectorStats();
  });
  // Released: now it is safe to rebuild, picking up the new type's slider range
  // — or the empty panel, if what was here just detonated.
  slider.addEventListener('change', () => renderInspector());
  $('is-follow').addEventListener('click', () => {
    sim.follow = sim.follow === b ? null : b;
    renderInspector();
  });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 9); sim.follow = b; renderInspector(); });
  $('is-shatter').addEventListener('click', () => shatterBody(b));
  $('is-del').addEventListener('click', () => { select(null); removeBody(b); compact(); });

  updateInspectorStats();
}

function updateInspectorStats() {
  const b = sim.selected;
  if (!b || !b.alive || !inspRefs) return;

  if (b.kind === 'snr') {
    const c = b.cloud || { mass: 0, n: 0, radius: 0 };
    inspRefs.cmass.textContent = fmtMass(c.mass);
    inspRefs.cn.textContent = c.n.toLocaleString();
    inspRefs.crad.textContent = fmtDist(Math.max(c.radius, b.radius));
    inspRefs.cvel.textContent = fmtKms(b.vBulk);
    inspRefs.cage.textContent = b.age < 730
      ? Math.round(b.age).toLocaleString() + ' days'
      : (b.age / 365.25).toPrecision(3) + ' years';
    inspRefs.clum.textContent = b.lum > 0.01 ? fmtLum(b.lum) : 'gone dark';
    inspRefs.ctv.textContent = b.coreT >= 1e6
      ? (b.coreT / 1e6).toPrecision(3) + ' million K'
      : Math.round(b.coreT).toLocaleString() + ' K';
    inspRefs.cfore.textContent = cloudForecast(c.mass);
    return;
  }

  if (b.kind === 'gal') {
    inspRefs.mass.textContent = fmtMass(b.m);
    if (inspRefs.gw) inspRefs.gw.textContent = fmtDist(b.galR);
    inspRefs.mval.textContent = fmtMass(b.m);
    const gp = dominantAt(b.p, b);
    if (gp && gp.m > b.m * 3) {
      inspRefs.orbL.textContent = 'Distance to ' + gp.name;
      inspRefs.orb.textContent = fmtDist(b.p.distanceTo(gp.p));
    } else {
      inspRefs.orbL.textContent = 'Orbiting';
      inspRefs.orb.textContent = '—';
    }
    return;
  }

  inspRefs.mass.textContent = fmtMass(b.m);
  inspRefs.rad.textContent = b.kind === 'bh' ? fmtRadius(b.r) + ' (horizon)' : fmtRadius(b.r);
  inspRefs.den.textContent = b.kind === 'bh' ? '—' : fmtDensity(b.m, b.r);
  inspRefs.spd.textContent = fmtSpeed(b.v.length());
  inspRefs.tmp.textContent = b.kind === 'bh' ? '—' : Math.round(b.temp).toLocaleString() + ' K';
  if (inspRefs.band) {
    const bd = starBand(b);
    inspRefs.band.textContent = bd ? bd.name : '—';
  }
  inspRefs.mval.textContent = fmtMass(b.m);
  if (inspRefs.core) {
    const t = b.coreT || 0;
    // Flagged when the tide is actively kneading it, because that is the moment
    // the number means something.
    const hot = b.tideX > 0.02 ? ' ▲' : '';
    inspRefs.core.textContent = (t >= 1e6 ? (t / 1e6).toPrecision(3) + ' M' : Math.round(t).toLocaleString() + ' ') + 'K' + hot;
  }
  if (inspRefs.strip) {
    inspRefs.strip.textContent = Math.round(clamp(b.stripped / Math.max(b.m0, 1e-12), 0, 1) * 100) + '% of it';
  }
  if (inspRefs.scars) inspRefs.scars.textContent = b.scarCount + (b.scarCount === 1 ? ' hit' : ' hits');
  if (inspRefs.life) inspRefs.life.textContent = Math.round(b.terra * 100) + '%';
  if (inspRefs.tfbar) {
    const pct = Math.round(b.terra * 100);
    inspRefs.tfbar.style.width = pct + '%';
    const live = terraCheck(b).ok;
    inspRefs.tfbar.className = live ? '' : 'dying';
    inspRefs.tfnote.textContent = pct >= 100
      ? (live ? 'Alive and holding. It stays that way while these conditions do.'
              : 'Alive, but the conditions have gone — it is about to start dying back.')
      : live ? 'Greening up: ' + pct + '% of the way there.'
             : 'Dying back: down to ' + pct + '%, and falling twice as fast as it grew.';
  }
  if (inspRefs.cage2) {
    const left = Math.max(0, (b.clumpLife || 420) - (b.clumpAge || 0));
    inspRefs.cage2.textContent = Math.round(b.clumpAge || 0).toLocaleString() + ' days';
    inspRefs.fate2.innerHTML = b.m >= CLUMP_COLLAPSE
      ? 'Heavy enough that its own gravity wins. In about <b>' + Math.round(left).toLocaleString() +
        ' days</b> it will pull itself together into a solid world — or press the button and do it now.'
      : 'Too thin to hold itself together. In about <b>' + Math.round(left).toLocaleString() +
        ' days</b> it will spread out and be gone. Drag the mass up past <b>' + fmtMass(CLUMP_COLLAPSE) +
        '</b> and gravity wins instead.';
  }
  if (inspRefs.dm && b.disc) {
    inspRefs.dm.textContent = fmtMass(b.disc.mass);
    inspRefs.dn.textContent = b.disc.made;
    inspRefs.dr.textContent = (b.disc.rOut / AU).toPrecision(3) + ' AU';
  }
  if (inspRefs.lum) inspRefs.lum.textContent = fmtLum(b.lum);
  if (inspRefs.age) {
    const life = msLifetime(b.m / M_SUN);
    inspRefs.age.textContent = life > 0
      ? clamp(b.age / life * 100, 0, 100).toFixed(1) + '%' : '—';
  }

  const prim = dominantAt(b.p, b);
  if (prim && prim.m > b.m * 3) {
    inspRefs.orbL.textContent = 'Distance to ' + prim.name;
    inspRefs.orb.textContent = fmtDist(b.p.distanceTo(prim.p));
  } else {
    inspRefs.orbL.textContent = 'Orbiting';
    inspRefs.orb.textContent = '—';
  }
}

/* ------------------------------------------------------------ time controls */

const RATES = [0.02, 0.1, 0.5, 1, 4, 16, 64, 256, 1024, 4096];
let rateIdx = 3;

function togglePlay() {
  sim.running = !sim.running;
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  if (sim.running) computeAccel();
}

function changeRate(d) {
  rateIdx = clamp(rateIdx + d, 0, RATES.length - 1);
  sim.rate = RATES[rateIdx];
  syncRate();
}

function syncRate() {
  const r = sim.rate;
  if (r >= 365) {
    $('an-rate-val').textContent = (r / 365.25).toPrecision(3).replace(/\.?0+$/, '');
    $('an-rate-unit').textContent = 'years / sec';
  } else {
    $('an-rate-val').textContent = r < 1 ? r.toString() : Math.round(r).toString();
    $('an-rate-unit').textContent = 'days / sec';
  }
}

  scale.addEventListener('input', () => {
    settings.bodyScale = parseInt(scale.value, 10);
    for (const b of sim.bodies) scaleVisual(b);

  });
  grav.addEventListener('input', () => {
    settings.gravity = parseInt(grav.value, 10) / 100;
    showGrav();
    computeAccel();
  });

    for (const k in colBtns) colBtns[k].classList.toggle('on', settings.collisions === k);

      ? 'Slow hits accrete, fast ones shatter.'
      : settings.collisions === 'bounce' ? 'Bodies rebound instead of merging.' : 'Bodies pass straight through.';
  };
  for (const k in colBtns) colBtns[k].addEventListener('click', () => { settings.collisions = k; syncCol(); });

  bindTgl('st-strip', 'strip');
  bindTgl('st-tideheat', 'tideHeat');

  bindTgl('st-labels', 'labels');
  bindTgl('st-lens', 'lensing');
  bindTgl('st-grid', 'grid');
  bindTgl('st-snap', 'gridSnap');

  const bdNote = () => $('st-bd-note').textContent =
    'A brown dwarf here contracts until it lights up as a red dwarf after ' +
    Math.round(settings.bdYears).toLocaleString() + ' years. A real one never does — it is too light to ' +

  bindSld('st-bd', (v) => Math.round(v).toLocaleString() + ' years', (v) => { settings.bdYears = v; bdNote(); });

  // The two galaxy limits must not be able to cross each other.
  const galLo = bindSld('st-galmin', (v) => Math.round(v) + ' px', (v) => {
    settings.galMinPx = v;
    if (settings.galMaxPx < v) { settings.galMaxPx = v; galHi.set(v); }
  });

    settings.galMaxPx = v;
    if (settings.galMinPx > v) { settings.galMinPx = v; galLo.set(v); }
  });

  /* ------------------------------------------------------------ supernovae */

  const sliders = {};
  const relist = () => { if (sim.selected) renderInspector(); };

  const bind = (id, key, fmt) => {
    sliders[key] = bindSld(id, fmt, (v) => { snSet[key] = v; }, relist);
    return sliders[key];
  };

  // Keep the three collapse thresholds in a sensible order however they are
  // dragged, or the fate rules would silently contradict each other.
  const order = () => {
    snSet.bhMass = Math.max(snSet.bhMass, snSet.ccMass);
    snSet.failMass = Math.max(snSet.failMass, snSet.bhMass);
    sliders.bhMass.set(snSet.bhMass);
    sliders.failMass.set(snSet.failMass);
  };

  bindTgl('sn-on', 'on', relist, snSet);
  bindTgl('sn-trigger', 'massTrigger', relist, snSet);
  bindTgl('sn-pisn', 'pisn', relist, snSet);
  bindTgl('sn-aging', 'aging', relist, snSet);

  bind('sn-rate', 'ageRate', (v) => '×10' + sup(Math.round(v)));
  bind('sn-chandra', 'chandra', (v) => v.toFixed(2) + ' M☉');
  bind('sn-cc', 'ccMass', (v) => v.toFixed(1) + ' M☉').after = order;
  bind('sn-bh', 'bhMass', (v) => v.toFixed(1) + ' M☉');
  bind('sn-fail', 'failMass', (v) => v.toFixed(0) + ' M☉');
  bind('sn-energy', 'energy', fmtErg);
  bind('sn-nickel', 'nickel', (v) => v.toFixed(2) + '×');
  bind('sn-shell', 'shellSize', (v) => Math.round(v) + ' pieces');

  // Live readouts that turn the abstract numbers into something you can picture.
  const notes = () => {
    $('sn-rate-note').textContent = 'A star lives 10¹⁰ years divided by (M/M☉)^2.5. At this speed the Sun '
      + 'would last about ' + fmtYears(msLifetime(1) / Math.pow(10, snSet.ageRate))
      + ' of simulated time, and a 20 M☉ star about ' + fmtYears(msLifetime(20) / Math.pow(10, snSet.ageRate)) + '.';
    $('sn-energy-note').textContent = 'One "foe" — 10⁵¹ erg — is what a real core collapse releases as motion. '

      + 'Type II peaks near ' + fmtLum(peakLum(0.062 * snSet.nickel, 8, 2.0e42, 100))
      + ' and a Type Ia near ' + fmtLum(peakLum(0.6 * snSet.nickel, 14, 0, 0)) + '.';

  for (const k in sliders) sliders[k].onChange = notes;
  notes();

  const remBtns = {
    auto: $('sn-rem-auto'), neutron: $('sn-rem-neutron'),
    black: $('sn-rem-black'), none: $('sn-rem-none')
  };
  const REM_D = {
    auto: 'Whatever the physics says: neutron star, black hole, or nothing at all.',
    neutron: 'Always leave a neutron star, capped at the ' + TOV_LIMIT + ' M☉ limit.',
    black: 'Always leave a black hole.',
    none: 'Never leave anything. The whole star becomes ejecta.'
  };
  const syncRem = () => {
    for (const k in remBtns) remBtns[k].classList.toggle('on', snSet.remnant === k);
    $('sn-rem-d').textContent = REM_D[snSet.remnant];
  };
  for (const k in remBtns) remBtns[k].addEventListener('click', () => { snSet.remnant = k; syncRem(); });
  syncRem();

  bindTgl('sn-blast', 'blast', null, snSet);
  bindTgl('sn-vap', 'vaporize', null, snSet);

  $('sn-reset').addEventListener('click', () => {
    Object.assign(snSet, SN_REAL);
    closeModal();
    openSettings();
    toast('Supernova settings back to the real values');
  });

  $('st-save').addEventListener('click', saveUniverse);
  $('st-load').addEventListener('click', loadUniverse);

function tgl(id, label, sub) {
  return '<div class="an-toggle"><div>' + label + (sub ? '<small>' + sub + '</small>' : '') +
    '</div><div class="an-sw" id="' + id + '"></div></div>';
}

function bindTgl(id, key, after, obj) {
  const store = obj || settings;
  const el = $(id);
  el.classList.toggle('on', !!store[key]);
  el.addEventListener('click', () => {
    store[key] = !store[key];
    el.classList.toggle('on', store[key]);
    if (after) after();
  });
}

/** A labelled range with a live value readout beside the label. */
function sld(id, label, min, max, step, value) {
  return '<div class="an-field"><label>' + label + ' <b id="' + id + '-v"></b></label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + value + '"></div>';
}

/**
 * Wire one up. `after` runs before the readout refreshes (used to keep coupled
 * sliders consistent), `onChange` after it (used to recompute the explanatory
 * notes); both are assigned onto the returned handle, so they can be set up
 * once every slider in a group exists.
 */
function bindSld(id, fmt, apply, onRelease) {
  const el = $(id), out = $(id + '-v');
  const ref = {
    el: el, after: null, onChange: null,
    show() { out.textContent = fmt(parseFloat(el.value)); },
    set(v) { el.value = v; ref.show(); }
  };
  el.addEventListener('input', () => {
    apply(parseFloat(el.value));
    if (ref.after) ref.after();
    ref.show();
    if (ref.onChange) ref.onChange();
  });
  if (onRelease) el.addEventListener('change', onRelease);
  ref.show();
  return ref;
}

/* ---- readouts that turn the supernova numbers into something picturable --- */

/** ⟨x⟩/√⟨x²⟩ for the velocity spectrum blastShell draws from. */
const EJ_SHAPE = 0.8471;

const ejectaSpeed = (foe, massMe) =>
  Math.sqrt(2 * foe * FOE / Math.max(massMe, 1e-9)) * EJ_SHAPE;

/* Ejecta speeds run to thousands of km/s, where fmtSpeed switches to a
   percentage of light speed — true, but far less readable than the number
   astronomers actually quote. */
const fmtKms = (gmPerDay) => Math.round(gmPerDay * 1e9 / 86400 / 1000).toLocaleString() + ' km/s';

/** Sustained peak of the light curve, ignoring the few-hour breakout spike. */
function peakLum(ni, rise, plateau, tPlat) {
  const e = { age: 0, ni: ni, rise: rise, plateau: plateau, tPlat: tPlat, breakout: 0 };
  let best = 0;
  for (let t = 0.5; t <= 220; t += 0.5) { e.age = t; best = Math.max(best, snLuminosity(e)); }
  return best;
}

function fmtErg(foe) {
  const e = Math.floor(Math.log10(Math.max(foe, 1e-9))) + 51;
  return (foe / Math.pow(10, e - 51)).toFixed(2) + '×10' + sup(e) + ' erg';
}

function fmtYears(days) {
  const y = days / 365.25;
  if (y >= 1e6) return (y / 1e6).toPrecision(3) + ' million years';
  if (y >= 1000) return Math.round(y).toLocaleString() + ' years';
  if (y >= 1) return y.toPrecision(3) + ' years';
  return Math.max(Math.round(days), 0).toLocaleString() + ' days';
}

/* Resolved in boot(), not at parse time, so a failed three.js load still
   reaches the friendly error screen instead of throwing here. */
let V3 = null;

/**
 * Put a body on a Keplerian orbit around `primary`. It starts at apoapsis, so
 * the velocity is purely tangential: v = sqrt(mu · (2/r − 1/a)).
 */
function orbitBody(type, primary, a, opts) {
  const o = opts || {};
  const ang = o.ang != null ? o.ang : Math.random() * TAU;
  const ecc = o.ecc || 0;
  const r0 = a * (1 + ecc);
  const dir = new V3(Math.cos(ang), 0, Math.sin(ang));
  const tan = new V3(-Math.sin(ang), 0, Math.cos(ang));
  if (o.inc) tan.applyAxisAngle(dir, o.inc);          // tilt at the node
  const mu = G * settings.gravity * primary.m;
  const speed = Math.sqrt(Math.max(mu * (2 / r0 - 1 / a), 0)) * (o.retro ? -1 : 1);
  return makeBody(type,
    primary.p.clone().addScaledVector(dir, r0),
    primary.v.clone().addScaledVector(tan, speed),
    o.over);
}

/** Two bodies in a mutual circular orbit about their shared barycentre. */
function binaryPair(typeA, mA, typeB, mB, sep, center) {
  const c = center || new V3();
  const tot = mA + mB;
  const mu = G * settings.gravity * tot;
  const vRel = Math.sqrt(mu / sep);
  const a = makeBody(typeA, new V3(-sep * mB / tot, 0, 0).add(c), new V3(0, 0, -vRel * mB / tot), { mass: mA });
  const b = makeBody(typeB, new V3(sep * mA / tot, 0, 0).add(c), new V3(0, 0, vRel * mA / tot), { mass: mB });
  return [a, b];
}

      const R = 3200, sep = R * 4.4;

      const v = Math.sqrt(acc * sep) * 0.66;
      a.v.set(0, 0, -v * 0.5); b.v.set(0, 0, v * 0.5);

  clearAll();

  p.build();
  view.target.set(0, 0, 0);
  view.dist = p.dist;
  view.yaw = 0.75;
  view.pitch = 0.46;
  computeAccel();
  clearTrails();
  refreshStarCache();
  updateTemperatures();
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  $('an-hud-bodies').textContent = sim.bodies.length;
  toast(p.name);

      cam: { t: view.target.toArray(), d: view.dist, y: view.yaw, p: view.pitch },
      bodies: sim.bodies.map(b => ({
        ty: b.type, n: b.name, m: b.m, r: b.r, s: b.seed, sp: b.spin, ti: b.tilt, ag: b.age,
        p: [b.p.x, b.p.y, b.p.z], v: [b.v.x, b.v.y, b.v.z],
        // Everything the customise panel can change, so a rebuilt body comes
        // back exactly as it was left rather than as a factory one.
        ct: b.coreT, tp: b.temp, rg: b.ringSpec, tn: b.tint,
        // A galaxy is saved as its shape, not as six thousand star positions —
        // the disc is rebuilt fresh on load. A collision in progress is lost.
        gx: b.kind === 'gal'
          ? { R: b.galR, arms: b.galArms, spin: b.galSpin, merged: b.galMerged || 0,
              ax: b.galAxis ? b.galAxis.toArray() : null }
          : null,
        st: b.stripped, m0: b.m0, sc: b.scars, sn: b.scarCount,
        tf: b.terra, tfo: b.terraOn,
        cl: b.kind === 'gas' ? { age: b.clumpAge, life: b.clumpLife } : null,
        // A protoplanetary disc is saved with its star, not on its own.
        dc: b.disc && b.disc.alive
          ? { rIn: b.disc.rIn, rOut: b.disc.rOut, mass: b.disc.mass, m0: b.disc.m0,
              made: b.disc.made, axis: b.disc.axis.toArray() }
          : null
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Universe saved (' + data.bodies.length + ' bodies)');
  } catch (e) {
    toast('Could not save — storage unavailable');
  }
}

function loadUniverse() {
  let data;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('No saved universe yet'); return; }
    data = JSON.parse(raw);
  } catch (e) { toast('Saved universe is unreadable'); return; }

  clearAll();
  for (const k in data.settings) if (k in settings) settings[k] = data.settings[k];
  // Key-by-key, so a save written before a setting existed still loads and just
  // keeps today's default for it.
  for (const k in (data.sn || {})) if (k in snSet) snSet[k] = data.sn[k];
  sim.time = data.t || 0;
  for (const s of data.bodies || []) {
    if (!TYPES[s.ty]) continue;
    const b = makeBody(s.ty, new V3().fromArray(s.p), new V3().fromArray(s.v), {
      mass: s.m, r: s.r, name: s.n, seed: s.s, spin: s.sp, tilt: s.ti, age: s.ag,
      coreT: s.ct, rings: s.rg !== undefined ? s.rg : undefined,
      terra: s.tf, terraOn: s.tfo,
      // The disc is restored below with its saved budget, not a fresh one.
      noDisc: true
    });
    if (s.sc && s.sc.length) { b.scars = s.sc; b.scarCount = s.sn || s.sc.length; buildScars(b); }
    if (s.cl) { b.clumpAge = s.cl.age || 0; b.clumpLife = s.cl.life || 420; }
    if (s.tp != null) { b.temp = s.tp; updateLuminosity(b); }
    if (s.gx && b.kind === 'gal') {
      b.galR = s.gx.R; b.galArms = s.gx.arms; b.galSpin = s.gx.spin;
      b.galMerged = s.gx.merged || 0;
      if (s.gx.ax) b.galAxis = new V3().fromArray(s.gx.ax);
      seedGalaxyStars(b);
    }
    if (s.st != null) b.stripped = s.st;
    if (s.m0 != null) b.m0 = s.m0;
    if (s.tn) {
      const c = hexRgb(s.tn);
      b.tint = s.tn;
      if (!b.baseColor) b.baseColor = new THREE.Color();
      b.baseColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
      if (b.parts && b.parts.surf && b.parts.surf.material.color) b.parts.surf.material.color.copy(b.baseColor);
    }
    if (s.dc) {
      const d = makeDisc(b, s.dc);
      d.m0 = s.dc.m0 || d.mass;
      d.made = s.dc.made || 0;
    }
  }
  if (data.cam) {
    view.target.fromArray(data.cam.t);
    view.dist = data.cam.d; view.yaw = data.cam.y; view.pitch = data.cam.p;
  }
  if (data.rateIdx != null) { rateIdx = data.rateIdx; sim.rate = RATES[rateIdx]; syncRate(); }
  computeAccel();
  clearTrails();
  closeModal();
  toast('Universe loaded (' + sim.bodies.length + ' bodies)');
}

/* ===================================================================== help */

  $('an-modal-body').innerHTML =

    '<li>The <b>Solar System</b> group at the bottom of the list holds all eight real planets — plus the Sun, the Moon and Pluto — with their real masses, widths, spin periods and axial tilts. Uranus really is tipped over on its side, and Venus really does spin backwards.</li>' +
    '</ul>' +
    '<h3>CUSTOMISE — CHANGING ANYTHING YOU LIKE</h3>' +
    '<ul>' +
    '<li>Every selected body has a <b>CUSTOMISE</b> section. Open it and you can change its <b>radius</b> (mass stays put, so it gets denser or lighter), how fast it <b>spins</b> and which way round, how far over it <b>leans</b>, how hot it is <b>inside</b>, and what <b>colour</b> it is.</li>' +
    '<li>Switch on <b>Has rings</b> and any world at all gets a set. Then drag the <b>inner and outer edges</b>, how <b>solid</b> they are, and pick <b>two colours</b> for the ringlets to be painted between.</li>' +
    '<li><b>RESET TO …</b> at the bottom puts everything back the way that kind of body normally is.</li>' +
    '<li>Wind the <b>spin</b> below <b>0.02 hours</b> a turn and the body cannot survive it. Its equator is now moving faster than gravity can hold on to, so it <b>throws its outer layers off from the middle</b> — in the plane it is spinning in, in the direction it is turning — and keeps going until only its dense core is left. A gas giant stripped that far is a <b>chthonian world</b>; a rocky one is an <b>iron world</b>. Real asteroids do this: Bennu is losing material off its equator right now, and almost none spin faster than one turn in two hours, because the ones that did are gone.</li>' +
    '</ul>' +
    '<h3>TERRAFORMING: BRINGING A DEAD WORLD TO LIFE</h3>' +
    '<ul>' +
    '<li>Select any rocky world and the panel has a <b>TERRAFORMING</b> section. If it can be brought to life, there is a button. If it cannot, it tells you exactly what is wrong — and that is the real point of it.</li>' +
    '<li>Three things have to be true, and they are the three things that actually decide whether a world can be lived on:</li>' +
    '<li><b>Heavy enough.</b> Under about a twentieth of an Earth its gravity cannot hold an atmosphere down and the air leaks away into space. That is not a made-up rule — it is precisely why <b>Mars</b> is a frozen desert with a hundredth of our air pressure, despite once having rivers running across it.</li>' +
    '<li><b>Not too heavy.</b> Past about twenty Earths a rocky world starts holding on to hydrogen as well, and turns into a small Neptune with no surface at all to stand on.</li>' +
    '<li><b>The right heat.</b> Water has to be able to sit on the surface as a liquid: roughly 258 K to 348 K. This is the whole meaning of the <b>habitable zone</b>, and it is worked out from the real starlight falling on that world right now — so <b>moving a planet changes the answer</b>. Drag a frozen world inwards until the panel stops complaining and it will take.</li>' +
    '<li>It is not instant and it is <b>not permanent</b>. Oceans fill, clouds gather and the land greens over across a few years, and the world only stays that way while those three things stay true. Shove it out past the snow line, or feed its star until it swells, and it browns off and dies — <b>twice as fast as it grew</b>, because ruining something is always quicker than building it.</li>' +
    '<li>The world underneath keeps its own name and its own kind. A terraformed Mars is still Mars, with the living layer laid over the top — and it is still Mars when it dies back.</li>' +
    '<li>Try <b>Terraforming</b> in Systems: four dead worlds around one star, and only one of them can be brought to life where it stands. The other three each fail for a different one of the three reasons.</li>' +
    '</ul>' +
    '<h3>TIDES: BEING TORN APART SLOWLY</h3>' +
    '<ul>' +
    '<li>Inside the <b>Roche limit</b> a body cannot hold itself together against the pull of what it orbits. It does not simply pop. It is <b>shaved away</b> — matter is lifted off it and laid straight into a ring, and it genuinely loses that mass — and at the same time the tide <b>kneads it hot inside</b>.</li>' +
    '<li>Watch <b>Inside temp</b> in the panel climb while it happens. A ▲ next to it means the tide has hold of it right now. Push it far enough and the heat comes out through the surface and the whole world starts to glow.</li>' +
    '<li>That heating is real: it is why <b>Io</b> has four hundred volcanoes and why <b>Europa</b> has a liquid ocean under its ice, hundreds of millions of kilometres from the Sun.</li>' +
    '<li>Only once it has lost more than half of itself, or falls right to the bottom of the limit, does it finally come apart into fragments. <b>Settings ▸ Tides</b> controls all of it.</li>' +
    '</ul>' +
    '<h3>DISCS, BROWN DWARFS AND GALAXIES</h3>' +
    '<ul>' +
    '<li>A <b>Protostar + Disc</b> is a star still being born, wrapped in the flat disc of gas and dust it is feeding from. Start time and the disc <b>condenses into planets</b>, one at a time — rock and small worlds on the warm side of the <b>ice line</b>, giants just beyond it, exactly the order our own Solar System came out in. Every planet takes its mass out of the disc, so once the disc is spent, that is that.</li>' +
    '<li>A <b>brown dwarf</b> is a failed star: heavier than any planet, too light to fuse hydrogen. Here one keeps contracting until it <b>lights up as a red dwarf</b> after a hundred years (change that in Settings). A real one never manages it — it just fades for trillions of years — so this one is for fun.</li>' +
    '<li>A <b>galaxy</b> is eleven thousand individual stars, and every one of them is really orbiting. Drop two and crash them together — that is what <b>Galaxy Collision</b> in Systems sets up.</li>' +
    '</ul>' +
    '<h3>CRASHING GALAXIES TOGETHER</h3>' +
    '<ul>' +
    '<li>Each star is a <b>test particle</b>: it feels the pull of every galaxy core in the scene, but has no pull of its own. That is the model Alar and Jüri Toomre used in 1972 to work out where the strange shapes of interacting galaxies come from, and it is still how they are reproduced today. It costs almost nothing in realism — in a real galaxy the stars really are a rounding error next to the mass they orbit — and it is what makes twenty thousand of them affordable at once.</li>' +
    '<li>What you get, and what is up there in the sky:</li>' +
    '<li><b>TIDAL TAILS.</b> The far side of a disc is pulled less hard than the near side, so a passing galaxy flings a long thin streamer out behind it. These get <b>enormous</b> — ten times wider than the galaxy that threw them. The Antennae, the Mice and the Tadpole are all this.</li>' +
    '<li><b>BRIDGES.</b> Material dragged the other way, straight across towards the intruder.</li>' +
    '<li><b>THE MERGER.</b> Each galaxy ploughs through the other and leaves a wake of stars pulled in behind it, and that wake pulls back. The orbit decays a little on every pass, they fall together again, and after three or four passes they coalesce. Chandrasekhar worked this out in 1943 and it is the only reason galaxies merge at all. What is left is a shapeless blob — and that is where <b>elliptical galaxies come from</b>. It is also what the Milky Way and Andromeda are going to do, in about four billion years.</li>' +
    '<li>One thing decides how big the tails are, and it is not mass or speed: <b>which way the disc is spinning</b>. A <b>prograde</b> pass, where the disc turns the same way round as the orbit, resonates with the stars\' own motion and throws vast tails. Turn the same galaxy the other way and the very same encounter barely marks it. Toomre found that too.</li>' +
    '<li><b>The one thing that is not to scale.</b> A real galaxy is about a trillion times wider than the largest thing this sandbox can otherwise hold — drawn true, nothing else would be a single pixel. So a galaxy is built at whatever size fills part of your screen when you drop it (Settings sets the range), and its core mass is then chosen to give it a sensible rotation. After that everything is real physics at that size: the shapes are right, the timescale is not. A collision that would take a billion years plays out here in a couple of hundred.</li>' +
    '<li>Saving a universe stores a galaxy\'s <b>shape</b>, not the position of every star, so a collision in progress is not preserved — the discs come back fresh.</li>' +
    '</ul>' +
    '<h3>MOVING AROUND</h3>' +
    '<div class="an-keys">' +
    '<div><kbd>Drag</kbd></div><span>Rotate the view</span>' +
    '<div><kbd>Right-drag</kbd></div><span>Pan (or hold <kbd>Shift</kbd> and drag)</span>' +
    '<div><kbd>Scroll</kbd></div><span>Zoom — the view spans from metres to light-days</span>' +
    '<div><kbd>Space</kbd></div><span>Start or stop time</span>' +
    '<div><kbd>,</kbd> <kbd>.</kbd></div><span>Slow down / speed up time</span>' +
    '<div><kbd>F</kbd></div><span>Lock the camera onto the selected body</span>' +
    '<div><kbd>Del</kbd></div><span>Remove the selected body</span>' +
    '<div><kbd>T</kbd> <kbd>L</kbd></div><span>Toggle trails / labels</span>' +
    '</div>' +
    '<p style="margin-top:8px">On a touch screen: one finger rotates, two fingers pinch to zoom and drag to pan.</p>' +
    '<h3>WHAT THE PHYSICS ACTUALLY DOES</h3>' +
    '<ul>' +
    '<li>Every body pulls on every other one with real Newtonian gravity, stepped with a leapfrog integrator that keeps orbits stable for thousands of years.</li>' +
    '<li>Masses, radii and distances are in real units — Earth masses, Earth radii and millions of kilometres. Drop Earth 149.6 million km from a Sun-like star and its year comes out at 365 days.</li>' +
    '<li><b>Slow collisions merge</b> and conserve momentum. <b>Fast ones shatter</b> both bodies into rubble — the test is impact speed against the pair\'s escape velocity.</li>' +
    '<li>Most of what a collision throws out is <b>not gravel — it is gas</b>. Two worlds hitting each other put in far more energy than it takes to melt rock, let alone boil it, so the plume of vapour that comes off outweighs the solid fragments by more than two to one. It is drawn in the same colours as a protoplanetary disc because it is the same stuff at the same temperatures: white-hot where it is fastest, then orange, then cold blue as it spreads and cools. That vapour is exactly where discs, rings and moons come from — ours came off the impact that made the Moon.</li>' +
    '<li>A collision also throws off <b>knots</b> — lumps big enough to click on and weigh. Most are still vapour, and about a third of them come off <b>solid</b>, because they never got hot enough to boil. Select a gas knot and the panel tells you which way it is going to go: below about four Moons of mass it spreads out and is gone, and above it gravity wins and it <b>pulls itself together into a world</b>. Drag its mass across that line and watch the answer change. This is not a made-up rule — it is how our own Moon was made, out of the wreckage of something the size of Mars hitting the young Earth.</li>' +
    '<li>Whatever survives a collision <b>wears the mark</b>. A scar is left on the surface exactly where it was hit, sized by how big the thing that hit it was, and it turns with the world and leans with its axis. The panel counts them under <b>Impact scars</b>. Stars and gas giants do not keep them — there is no ground for a crater to be in.</li>' +
    '<li>Anything newly <b>born</b> — a planet condensing out of a disc, a world puffing up into a gas giant, a star catching light — arrives inside a swirl of infalling dust that spirals in and <b>whirls faster as it shrinks</b>, because angular momentum is conserved. Same reason a spinning skater speeds up when they pull their arms in.</li>' +
    '<li>The debris thrown out by an impact is <b>real matter, not sparks</b>. Every grain carries mass and is pulled along by the same gravity as the planets, so it orbits, rains back down, settles into rings, or is swallowed by a black hole — and whatever eats it genuinely gets heavier. The counter at the bottom left shows bodies plus live debris.</li>' +
    '<li>Feed a <b>rocky</b> world past <b>60.1 Earth masses</b> and its gravity can finally hold onto hydrogen: it flares up and swells into a <b>gas giant</b>, roughly doubling in width as dense rock gives way to light gas. Worlds that are already gassy skip this and just keep growing.</li>' +
    '<li>Pile up more than 8% of the Sun\'s mass and the body <b>ignites into a star</b>. The full ladder is rock → gas giant → star → supernova → neutron star or black hole.</li>' +
    '<li>Stray inside a planet\'s <b>Roche limit</b> and tides shave the moon away into a ring while cooking it from the inside, exactly as they did at Saturn.</li>' +
    '<li>Surface temperatures come from the real starlight falling on each world, so worlds glow when they roast and frost over when they don\'t.</li>' +
    '</ul>' +
    '<h3>SUPERNOVAE</h3>' +
    '<ul>' +
    '<li>Select any star and the panel tells you <b>exactly how it will die</b> — and gives you a <b>GO SUPERNOVA</b> button if it can. If it can\'t, it says why, which is usually "not heavy enough yet".</li>' +
    '<li>A <b>white dwarf</b> that accretes past the <b>Chandrasekhar limit</b> of 1.44 solar masses detonates on its own, no button needed. That is a <b>Type Ia</b>, and because they all go off at the same mass they all reach the same brightness — which is how astronomers measure distances across the universe.</li>' +
    '<li>A star over about <b>8 solar masses</b> collapses its iron core in roughly a second and rebounds. That is a <b>Type II</b>. Above 20 solar masses the remnant is a black hole; below it, a <b>neutron star</b> — which gets fired off at hundreds of km/s, because the explosion is never symmetric.</li>' +
    '<li>Over about <b>40 solar masses</b> the core falls straight through and swallows its own shock wave. The star just <b>winks out</b>. We have genuinely watched this happen to a real star.</li>' +
    '<li>Between <b>130 and 250 solar masses</b> the star\'s own gamma rays turn into matter, the core loses its support, and the whole thing is destroyed with nothing left over at all.</li>' +
    '<li>The light does <b>not</b> come from the bang — that energy all goes into motion. It comes from about a tenth of a solar mass of radioactive <b>nickel-56</b> forged in the shock, decaying to cobalt and then to iron. That is why a supernova takes three weeks to brighten and months to fade, and the curve here is the real published one.</li>' +
    '<li>The ejecta is <b>real matter</b>, thrown with exactly 10⁵¹ erg of kinetic energy spread across the envelope. Nobody types in a speed: hand a Type Ia 1.5×10⁵¹ erg and 1.44 solar masses and about 10,000 km/s falls out on its own.</li>' +
    '<li>The <b>blast wave</b> is real too. A body intercepts the share of the shell its own disc covers, takes that much momentum and energy, and is destroyed if it got more than gravity holds it together with. At one AU that is about two hundred times what it takes to unbind the Earth.</li>' +
    '<li>Turn on <b>Stellar aging</b> in Settings and stars burn their fuel and die on their own. A star lives 10 billion years divided by (its mass)^2.5, so the Sun gets ten billion years and a twenty-solar-mass star gets six million. Light stars end by puffing off a <b>planetary nebula</b> and settling down as a white dwarf.</li>' +
    '<li>Every number in that whole list is a slider in <b>Settings ▸ Supernovae</b>, starting at its real measured value, with a RESET that puts them all back.</li>' +
    '</ul>' +
    '<h3>BUILDING A NEW STAR OUT OF THE WRECKAGE</h3>' +
    '<ul>' +
    '<li>What a supernova leaves behind is a few solar masses of enriched gas — and that is where the <b>next</b> generation of stars comes from. Our own Solar System is thought to have condensed out of a cloud like it, which is why the oldest meteorites still carry the decay products of supernova iron.</li>' +
    '<li><b>Click the cloud</b> once the flash has faded and it selects like anything else. The panel shows how much gas and dust is genuinely still there — not the amount thrown, the amount that has not yet been swallowed, absorbed or blown out of the system.</li>' +
    '<li>Drag <b>Core temperature</b> and the cloud squeezes. That link is the virial theorem: a self-gravitating ball has kT ≈ GMμ/R, so halving the radius doubles the temperature in the middle. It is why protostars go on getting hotter all the way down.</li>' +
    '<li>Reach <b>10 million kelvin</b> and hydrogen fuses. The cloud collapses into a star weighing exactly what the gas weighed, drifting exactly as the gas drifted, and the leftover couple of percent flattens into a disc and accretes into planets.</li>' +
    '<li>The planets orbit in <b>the plane the cloud was already spinning in</b>, taken from its real angular momentum. That is why every planet in a real system goes round the same way in nearly the same plane — they all inherit the spin of one cloud.</li>' +
    '<li>Rock forms inside the <b>snow line</b> and ice and giants outside it — 2.7 AU in our own nebula, further out around a brighter star, because that is where water ice can survive.</li>' +
    '<li>Not every cloud makes a star. Under <b>0.075 solar masses</b> — about eighty Jupiters — hydrogen never catches and you get a brown dwarf instead, glowing on its own contraction and slowly fading. The panel tells you which you are about to get before you commit.</li>' +
    '<li>So the full circle is: gas &rarr; star &rarr; supernova &rarr; gas &rarr; star. Each turn seeds the next one with heavier elements. Every atom of iron in your blood came through that loop.</li>' +
    '</ul>' +
    '<h3>WHAT COLOUR A STAR IS</h3>' +
    '<p>In here, <b>how big a star is decides what colour it is</b> — its width, not its weight. ' +
    'Open <b>CUSTOMISE</b> and drag the <b>Radius</b> slider: the star repaints the moment it ' +
    'crosses into the next band, and its mass never moves. The panel always tells you which band ' +
    'it is in. Sizes are in <b>R☉</b>, times the width of the Sun.</p>' +
    '<ul>' +
    '<li><b>Swell one past 20 R☉</b> and it burns out. What is left is a <b>black dwarf</b>: a ' +
    'dead ember about the size of Earth, with no fusion and no light at all. Anything it was ' +
    'keeping warm goes cold, and there is nothing you can do to it afterwards — it cannot even ' +
    'be made to explode. A star that was <i>already</i> bigger than that when you placed it, like ' +
    'the Red Supergiant at 760 R☉, is a giant rather than a corpse and goes on burning.</li>' +
    '<li><b>10 to 19.9 R☉</b> — blood red</li>' +
    '<li><b>5.99 to 9.99 R☉</b> — orange</li>' +
    '<li><b>3 to 5.99 R☉</b> — dark yellow</li>' +
    '<li><b>1 to 2.99 R☉</b> — yellow-white (the Sun is 1 R☉)</li>' +
    '<li><b>Under 1 R☉</b> — white</li>' +
    '</ul>' +
    '<p>Making a star heavier does make it wider, if it keeps its density — so mass can push it ' +
    'into the next band that way. But mass is never what is read: it is always the width.</p>' +
    '<p>Only the burning stars are painted this way. A white dwarf, a neutron star, a brown dwarf ' +
    'and a black dwarf each keep their own look.</p>' +

    '<h3>TWO HONEST FUDGES</h3>' +
    '<ul>' +
    '<li>Planets are drawn <b>larger than life</b> (see Settings) because at true scale they would be invisible specks. They collide at the size you see.</li>' +
    '<li>Black holes are drawn far bigger than their real event horizons — a ten-solar-mass hole is only about 30 km across — and starlight does not dim with distance, or half your worlds would be pitch black.</li>' +
    '<li>Debris grains feel gravity from the heaviest bodies but not from <i>each other</i>. That is what makes thousands of them possible at once; it means a debris ring will not clump into moons on its own.</li>' +
    '<li>A star\'s colour here comes from its <b>size</b>. In real life it comes from its surface <b>temperature</b>, and among ordinary stars the two run opposite ways round: the big ones are blue-white and blazing, and the small ones are dim red. So the paint is a house rule — but nothing else is. Each star\'s temperature, its brightness, the heat it gives its planets and where its snow line falls are all still the real numbers, which is why a 15 R☉ star painted blood red is still fierce enough to roast everything near it.</li>' +
    '</ul>' +
    '</div>';
  openModal();
}

/* ====================================================================== HUD */

let fpsAcc = 0, fpsCount = 0, fpsShown = 60, statTick = 0;

function updateHud(realDt) {
  fpsAcc += realDt; fpsCount++;
  if (fpsAcc > 0.5) {
    fpsShown = Math.round(fpsCount / fpsAcc);
    fpsAcc = 0; fpsCount = 0;
    $('an-hud-fps').textContent = fpsShown;
    $('an-hud-bodies').textContent = parts.live
      ? sim.bodies.length + ' + ' + parts.live
      : sim.bodies.length;

    // While something is exploding, the brightest thing in the sky is worth a
    // line of its own — that number is the whole point of a supernova.
    const snEl = $('an-hud-sn');
    let best = null;
    for (const e of supernovae) if (!best || e.lum > best.lum) best = e;
    if (best && best.lum > 1) {
      snEl.innerHTML = best.label.toUpperCase() + ' <b>' + fmtLum(best.lum) + '</b>';
      snEl.style.display = '';
    } else if (snEl.style.display !== 'none') {
      snEl.style.display = 'none';
    }
  }
  const yr = Math.floor(sim.time / 365.25);
  const dy = Math.floor(sim.time - yr * 365.25);
  $('an-clock').innerHTML = 'Y ' + yr.toLocaleString() + '<br>D ' + dy;
  $('an-scale-lbl').textContent = fmtDist(54 * worldPerPixel(view.dist));
}

function showPanel(which) {
  const pal = $('an-palette'), insp = $('an-inspector');
  pal.classList.toggle('hidden', which !== 'palette');
  insp.classList.toggle('hidden', which !== 'inspector');
  document.body.classList.toggle('panel-open', !!which);
}

/* ================================================================ main loop */

let lastFrame = 0;

function loop(now) {
  const realDt = Math.min((now - lastFrame) / 1000, 0.1) || 0;
  lastFrame = now;

  const t0 = sim.time;
  advance(realDt);
  const simDt = sim.time - t0;

  if (sim.follow) {
    if (sim.follow.alive) view.target.copy(sim.follow.p);
    else { sim.follow = null; renderInspector(); }
  }
  applyCamera();
  updateVisuals(realDt, simDt);
  renderFrame();
  updateHud(realDt);

  if (++statTick % 10 === 0) updateInspectorStats();
  requestAnimationFrame(loop);
}

/* ===================================================================== boot */

function fail(msg) {
  $('an-boot').innerHTML = '<div class="an-title">AstroNomia</div><div class="an-fail">' + msg + '</div>';
  $('an-boot').classList.remove('gone');
}

function boot() {
  if (typeof THREE === 'undefined') {
    fail('AstroNomia needs the three.js library, which could not be loaded.<br><br>Check your internet connection and reload.');
    return;
  }
  V3 = THREE.Vector3;
  try {
    initScene();
  } catch (e) {
    fail('This browser could not start WebGL, which AstroNomia needs to draw in 3D.<br><br>Try a different browser, or check that hardware acceleration is switched on.<br><br><small>' + (e && e.message ? e.message : e) + '</small>');
    return;
  }

  initLights();
  initLabels();
  buildPalette();
  bindInput();

  $('an-play').addEventListener('click', togglePlay);
  $('an-slower').addEventListener('click', () => changeRate(-1));
  $('an-faster').addEventListener('click', () => changeRate(1));
  $('an-btn-systems').addEventListener('click', openSystems);
  $('an-btn-settings').addEventListener('click', openSettings);
  $('an-btn-help').addEventListener('click', openHelp);
  $('an-modal-close').addEventListener('click', closeModal);
  $('an-modal').addEventListener('click', (e) => { if (e.target === $('an-modal')) closeModal(); });
  $('an-mob-add').addEventListener('click', () => {
    showPanel($('an-palette').classList.contains('hidden') ? 'palette' : null);
  });
  $('an-mob-insp').addEventListener('click', () => {
    showPanel($('an-inspector').classList.contains('hidden') ? 'inspector' : null);
  });

  sim.rate = RATES[rateIdx];
  syncRate();
  loadPreset(PRESETS[0]);
  updateHint();
  renderInspector();

  $('an-boot').classList.add('gone');
  setTimeout(() => { const b = $('an-boot'); if (b && b.classList.contains('gone')) b.style.display = 'none'; }, 700);

  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

boot();
</script>
