  if (kickDir.lengthSq() < 1e-9) kickDir.set(1, 0, 0);
  kickDir.normalize();
  const kickV = kind === 'none' ? 0
    : Math.max(snSet.kick, 0) * KMS * (kind === 'black' ? 0.25 : 1) * rnd(0.4, 1.3);

  /* ---- launch the envelope ----------------------------------------------- */
  // The shell carries everything the remnant does not, minus the momentum the
  // kick just handed the remnant, so the pair still adds up to what the star
  // had before it exploded.
  const netP = vel.clone().multiplyScalar(ejM - sweptM)
    .add(new THREE.Vector3(sweptPx, sweptPy, sweptPz))
    .addScaledVector(kickDir, -remM * kickV);

  // The id is claimed before the shell is thrown, so every grain is stamped with
  // the remnant it belongs to.
  const eid = snNextId++;
  const shell = ejM > 0 ? blastShell(pos, vel, want, ejM, {
    eKin: eKin, r0: r0, netP: netP, src: eid,
    coolDays: plan.flavour === 'fail' ? 15 : 110,
    hot: plan.hot, cool: plan.cool, sizeMin: 1.8, sizeMax: 9.5
  }) : null;

  if (!shell && ejM > 0 && kind !== 'none') { remM = mProg; ejM = 0; }

  /* ---- the progenitor ----------------------------------------------------- */
  if (kind === 'none') {
    removeBody(b);
    if (sim.selected === b) sim.selected = null;
    if (sim.follow === b) sim.follow = null;
    compact();
  } else {
    b.m = remM;
    b.age = 0;
    b.rubble = false;
    b.disrupted = false;
    b.v.addScaledVector(kickDir, kickV);
    if (kind === 'black') {
      b.type = 'black_hole'; b.kind = 'bh';
      b.temp = 0; b.lum = 0;
      b.r = schwarzschild(remM);
    } else {
      b.type = 'neutron_star'; b.kind = 'body';
      b.temp = TYPES.neutron_star.temp;
      b.spin = TYPES.neutron_star.spin;
      b.r = trueRadius('neutron_star', remM);
      updateLuminosity(b);
    }
    refreshVisual(b);
  }

  /* ---- the event itself --------------------------------------------------- */
  const e = {
    // Duck-typed as a selectable object, so the reticle, the label pass, follow
    // and frame-on all treat a remnant cloud like any other thing in the sky.
    id: eid, kind: 'snr', alive: true,
    p: pos, v: vel.clone(), t0: sim.time, age: 0, life: plan.life,
    flavour: plan.flavour, label: plan.label, story: plan.story,
    origin: b.name,
    ni: mNi, rise: plan.rise, plateau: plan.plateau, tPlat: plan.tPlat,
    breakout: plan.breakout * Math.max(foe, 0.02),
    eKin: eKin, ejM: ejM,
    vShock: shell ? shell.vMax : 1e-6,
    vBulk: shell ? shell.vMean : 0,
    // Braking timescale, set so a fast shell and a slow one both stall at about
    // the same size rather than a Type Ia flying ten times further out.
    brakeTau: SN_STALL / Math.max(shell ? shell.vMax : 1e-6, 1e-6),
    radius: r0,
    hit: new Set([b.id]),
    lum: 0, peak: 0, name: plan.label,
    // Core temperature, and whether the player has taken hold of it. Left alone
    // it just tracks the cooling photosphere.
    coreT: snPhotoT(0), held: false,
    m: ejM, r: r0, cloud: null,
    lightColor: new THREE.Color(1, 1, 1),
    obj: null
  };
  buildSNVisual(e);
  supernovae.push(e);
  while (supernovae.length > SN_MAX) disposeSN(supernovae.shift());

  fx.flash(pos, r0 * 8, [255, 244, 224], 1);
  return plan;
}

/**
 * The blast front sweeps outward at the speed of the fastest ejecta. A body it
 * reaches intercepts the slice of the shell its own disc covers — a fraction
 * r²/4d² of the whole thing — and takes that share of both the momentum and
 * the energy.
 *
 * Whether it survives is a straight comparison against its gravitational
 * binding energy, (3/5)GM²/R. At one AU a supernova delivers a couple of
 * hundred times what it takes to unbind the Earth, and it still exceeds it out
 * past ten AU, which is why nothing in the neighbourhood lives through this.
 */
function snSweep(e) {
  // No early-out on e.hit.size: it keeps the ids of bodies the blast already
  // destroyed, so comparing it against the live count bails out far too soon.
  if (e.ejM <= 0) return;
  let doomed = null;
  const bodies = sim.bodies;

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (!b.alive || e.hit.has(b.id) || b.born > e.t0) continue;
    const dx = b.p.x - e.p.x, dy = b.p.y - e.p.y, dz = b.p.z - e.p.z;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 > e.radius * e.radius) continue;
    e.hit.add(b.id);

    const d = Math.sqrt(d2);
    const rb = Math.max(b.r, 1e-9);
    const f = d <= rb ? 1 : clamp(rb * rb / (4 * d * d), 0, 1);
    if (f <= 0) continue;

    // ---- the shove
    if (d > 1e-12 && b.m > 0) {
      // An inelastic sweep can never push a body faster than the flow doing the
      // pushing, so cap it there rather than letting a grain of dust go relativistic.
      const dv = Math.min(f * e.ejM * e.vBulk / b.m, e.vBulk);
      b.v.x += dx / d * dv; b.v.y += dy / d * dv; b.v.z += dz / d * dv;
    }

    // ---- the damage
    if (b.kind !== 'body') continue;                    // holes have nothing to lose
    const eDep = f * e.eKin;
    const bind = 0.6 * G * b.m * b.m / rb;
    if (TYPES[b.type].star) continue;                   // a star is shocked, but survives
    if (snSet.vaporize && eDep > bind) {
      (doomed || (doomed = [])).push([b, eDep]);
    } else if (eDep > bind * 0.04) {
      // Not destroyed, but the blast peels off whatever it could unbind.
      const strip = Math.min(clamp(eDep / bind, 0, 0.6) * b.m, b.m * 0.6);
      const n = Math.min(90, parts.free.length);
      if (n > 3 && strip > 0) {
        const v = Math.min(Math.sqrt(2 * eDep / Math.max(strip, 1e-12)), e.vBulk);
        blastShell(b.p, b.v, n, strip, { vMean: v, r0: visRadius(b) * 1.3, hot: [255, 220, 170], cool: [120, 96, 84], coolDays: 6 });
        b.m -= strip;
        b.r = trueRadius(b.type, b.m);
        b.glowPulse = 1;
        scaleVisual(b);
        toast(b.name + ' was stripped bare by the blast wave');
      }
    }
  }

  if (!doomed) return;
  for (const [b, eDep] of doomed) vaporizeBody(b, e, eDep);
  compact();
}

/** Nothing survives more energy than holds it together. Turn it into matter. */
function vaporizeBody(b, e, eDep) {
  const n = Math.min(160, parts.free.length);
  if (n > 3) {
    const v = Math.min(Math.sqrt(2 * eDep / Math.max(b.m, 1e-12)), Math.max(e.vBulk, 1e-6));
    blastShell(b.p, b.v, n, b.m, {
      vMean: v, r0: Math.max(visRadius(b), 1e-9),
      hot: [255, 230, 190], cool: [150, 92, 70], coolDays: 12, sizeMin: 1.2, sizeMax: 6
    });
  }
  fx.flash(b.p, visRadius(b) * 9, [255, 226, 180], 0.9);
  toast(b.name + ' was vaporised by the shock wave');
  if (sim.selected === b) sim.selected = null;
  if (sim.follow === b) sim.follow = null;
  removeBody(b);
}

/**
 * Bolometric light curve, in erg/s.
 *
 * The core is Nadyozhin's (1994) rate for the nickel-56 → cobalt-56 → iron-56
 * chain, which is where essentially all of a supernova's light comes from:
 *
 *   L(t) = M_Ni/M☉ · (6.45e43·e^(−t/8.8) + 1.45e43·e^(−t/111.3))   erg/s
 *
 * The factor in front of it is photon diffusion — the light has to random-walk
 * out through an envelope that is still opaque, which is why a supernova takes
 * two or three weeks to reach peak instead of flashing instantly.
 */
function snLuminosity(e) {
  const t = Math.max(e.age, 0);
  let L = 0;
  if (e.ni > 0) {
    const decay = e.ni * (6.45e43 * Math.exp(-t / 8.8) + 1.45e43 * Math.exp(-t / 111.3));
    L += decay * (1 - Math.exp(-Math.pow(t / e.rise + 1e-9, 1.8)));
  }
  if (e.plateau > 0 && t < e.tPlat) {
    L += e.plateau * (1 - Math.exp(-t / 1.5)) * (1 - 0.55 * Math.pow(t / e.tPlat, 6));
  }
  // Shock breakout: a few hours of X-rays as the blast finally reaches the
  // surface. It is over almost before it starts, and it is by far the brightest
  // moment the star will ever have.
  L += e.breakout * Math.exp(-t / 0.14);
  return L / ERG_S_PER_LSUN;
}

/* ---------------------------------------------------- the cloud as an object */
/*
 * A remnant is not just a light show: it is a few solar masses of enriched gas
 * and dust, and it is where the NEXT generation of stars comes from. Real
 * remnants sweep up the surrounding medium, and the compressed shell collapses
 * into new stars — our own Solar System is thought to have formed in one, which
 * is why there is short-lived supernova iron in the oldest meteorites.
 *
 * So a cloud can be selected and squeezed. Everything below works from the real
 * grains: their mass, their centre of mass, their net angular momentum. Nothing
 * is invented for the collapse — the star and its planets are made out of
 * exactly the matter that was floating there.
 */

/**
 * Measure every live cloud in two passes over the pool: the first for mass,
 * centre of mass and bulk velocity, the second — which needs the centre — for
 * extent and angular momentum.
 */
function refreshClouds() {
  if (!supernovae.length) return;
  const byId = new Map();
  for (const e of supernovae) {
    byId.set(e.id, { mass: 0, n: 0, cx: 0, cy: 0, cz: 0, vx: 0, vy: 0, vz: 0,
                     radius: 0, lx: 0, ly: 0, lz: 0 });
  }

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const c = byId.get(parts.src[k]);
    if (!c) continue;
    const k3 = k * 3, m = parts.m[k];
    c.mass += m; c.n++;
    c.cx += parts.pos[k3] * m; c.cy += parts.pos[k3 + 1] * m; c.cz += parts.pos[k3 + 2] * m;
    c.vx += parts.vel[k3] * m; c.vy += parts.vel[k3 + 1] * m; c.vz += parts.vel[k3 + 2] * m;
  }
  for (const c of byId.values()) {
    if (c.mass <= 0) continue;
    c.cx /= c.mass; c.cy /= c.mass; c.cz /= c.mass;
    c.vx /= c.mass; c.vy /= c.mass; c.vz /= c.mass;
  }

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const c = byId.get(parts.src[k]);
    if (!c || c.mass <= 0) continue;
    const k3 = k * 3, m = parts.m[k];
    const rx = parts.pos[k3] - c.cx, ry = parts.pos[k3 + 1] - c.cy, rz = parts.pos[k3 + 2] - c.cz;
    const d = Math.sqrt(rx * rx + ry * ry + rz * rz);
    if (d > c.radius) c.radius = d;
    // L = Σ m (r × v), measured in the cloud's own frame
    const wx = parts.vel[k3] - c.vx, wy = parts.vel[k3 + 1] - c.vy, wz = parts.vel[k3 + 2] - c.vz;
    c.lx += m * (ry * wz - rz * wy);
    c.ly += m * (rz * wx - rx * wz);
    c.lz += m * (rx * wy - ry * wx);
  }

  for (const e of supernovae) {
    const c = byId.get(e.id);
    e.cloud = c;
    e.m = c.mass;
    e.r = Math.max(e.radius, c.radius);
  }
}

/**
 * Squeeze or release the cloud, homologously — every grain's distance from the
 * centre and its speed relative to the centre scale by the same factor, which
 * is how self-similar collapse actually behaves.
 *
 * The link to temperature is the virial theorem: a self-gravitating ball in
 * equilibrium has kT ≈ GMμm_H/R, so its core temperature is inversely
 * proportional to its radius. Halve the radius and you double the temperature.
 * That is why squeezing a cloud heats its middle, and why a protostar goes on
 * getting hotter all the way down until fusion finally starts.
 */
function contractCloud(e, factor) {
  if (!(factor > 0) || !e.cloud || e.cloud.mass <= 0) return;
  const c = e.cloud;
  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k] || parts.src[k] !== e.id) continue;
    const k3 = k * 3;
    parts.pos[k3] = c.cx + (parts.pos[k3] - c.cx) * factor;
    parts.pos[k3 + 1] = c.cy + (parts.pos[k3 + 1] - c.cy) * factor;
    parts.pos[k3 + 2] = c.cz + (parts.pos[k3 + 2] - c.cz) * factor;
    parts.vel[k3] = c.vx + (parts.vel[k3] - c.vx) * factor;
    parts.vel[k3 + 1] = c.vy + (parts.vel[k3 + 1] - c.vy) * factor;
    parts.vel[k3 + 2] = c.vz + (parts.vel[k3 + 2] - c.vz) * factor;
  }
  e.radius *= factor;
  c.radius *= factor;
  e.r = Math.max(e.radius, c.radius);
  parts.dirty = true;
}

/** Set the core temperature, contracting to match. Ignites at ten million K. */
function setCloudTemp(e, T) {
  const want = clamp(T, 10, IGNITE_T);
  const prev = Math.max(e.coreT, 1e-6);
  e.held = true;
  contractCloud(e, prev / want);
  e.coreT = want;
  return want >= IGNITE_T;
}

/**
 * Slow the shells down. The damping is applied to each grain's velocity
 * *relative to its own cloud's bulk motion*, which means it is purely internal:
 * the remnant stops spreading but the total momentum of the simulation does not
 * change by a gram. (A real shell really does hand its momentum to the gas it
 * sweeps up — but there is no such gas here to hand it to, so taking it out of
 * the books instead would just quietly break conservation.)
 */
function brakeClouds(simDt) {
  if (simDt <= 0 || !supernovae.length) return;
  const braking = new Map();
  for (const e of supernovae) {
    if (!e.cloud || e.cloud.n === 0) continue;
    const k = Math.exp(-simDt / Math.max(e.brakeTau, 1e-6));
    if (k > 0.99999) continue;
    braking.set(e.id, { k: k, c: e.cloud });
    e.vShock *= k;
  }
  if (!braking.size) return;

  for (let i = 0; i < P_MAX; i++) {
    if (!parts.on[i]) continue;
    const b = braking.get(parts.src[i]);
    if (!b) continue;
    const c = b.c, k = b.k, i3 = i * 3;
    parts.vel[i3] = c.vx + (parts.vel[i3] - c.vx) * k;
    parts.vel[i3 + 1] = c.vy + (parts.vel[i3 + 1] - c.vy) * k;
    parts.vel[i3 + 2] = c.vz + (parts.vel[i3 + 2] - c.vz) * k;
  }
  parts.dirty = true;
}

/** Kill every grain belonging to one cloud. Returns the mass removed. */
function disperseCloud(e) {
  let m = 0;
  for (let k = 0; k < P_MAX; k++) {
    if (parts.on[k] && parts.src[k] === e.id) { m += parts.m[k]; killParticle(k); }
  }
  return m;
}

/** What a given amount of collapsing gas would turn into. */
const BROWN_DWARF_MIN = 13 * 317.8;      // 13 Jupiters, where deuterium burns

function cloudForecast(mass) {
  if (mass >= IGNITE_MASS) {
    const mSun = mass / M_SUN;
    const kind = mSun > 8 ? 'blue giant' : mSun > 0.5 ? 'Sun-like star' : 'red dwarf';
    return fmtMass(mass) + ' is enough. Hydrogen ignites and it becomes a ' + kind +
      ', with the leftover couple of percent flattening into a disc and accreting into planets.';
  }
  if (mass >= BROWN_DWARF_MIN) {
    return 'Only ' + fmtMass(mass) + '. Below 0.075 M☉ — about eighty Jupiters — hydrogen never ' +
      'catches, and you get a brown dwarf that shines on its own contraction and then slowly fades.';
  }
  return 'Only ' + fmtMass(mass) + ' left. Far too little to light anything; this would settle ' +
    'into a family of worlds and rubble with nothing at the centre to warm them.';
}

function discPlanetType(mass, insideIce) {
  if (mass >= 60) return Math.random() < 0.3 ? 'ringed_giant' : 'gas_giant';
  if (mass >= 8) return 'ice_giant';
  if (insideIce) {
    if (mass >= 2.5) return 'super_earth';
    if (mass >= 0.6) return pick(['terrestrial', 'desert_world', 'lava_world']);
    if (mass >= 0.2) return pick(['desert_world', 'moon']);
    return pick(['moon', 'dwarf_planet']);
  }
  if (mass >= 1.2) return pick(['ocean_world', 'ice_world']);
  return pick(['ice_world', 'dwarf_planet']);
}

/**
 * Collapse the cloud into a star and a family of planets.
 *
 * Mass and momentum both come straight out of the grains, so the system that
 * appears weighs exactly what the cloud weighed and drifts exactly as it was
 * drifting. The planets orbit in the plane the cloud was already rotating in —
 * that is why every planet in a real system goes round the same way, in nearly
 * the same plane: they inherit the collapsing cloud's angular momentum.
 */
function condenseCloud(e) {
  const c = e.cloud;
  if (!c || c.mass <= 0 || c.n < 3) { toast('There is nothing left of this cloud to collapse'); return false; }
  if (freeSlots() < 2) { toast('Universe is full — clear some bodies first'); return false; }

  const M = c.mass;
  const centre = new THREE.Vector3(c.cx, c.cy, c.cz);
  const drift = new THREE.Vector3(c.vx, c.vy, c.vz);
  const totalP = drift.clone().multiplyScalar(M);

  // A protoplanetary disc is only a percent or so of the star; ours ended up with
  // 447 Earth masses of planets. Everything the disc does not use stays in the
  // star, so this is a ceiling rather than an allowance to be spent.
  const discCap = Math.min(Math.max(M * 0.02, 0), 800);
  const guess = Math.max(M - discCap, 0);
  const canIgnite = guess >= IGNITE_MASS;
  const mSun = guess / M_SUN;
  const coreType = canIgnite
    ? (mSun > 8 ? 'blue_giant' : mSun > 0.5 ? 'sun_like' : 'red_dwarf')
    : discPlanetType(guess, true);

  // The disc's layout depends on how bright the star will be, so work that out
  // before anything is created. The guess is within a couple of percent of the
  // final mass, which moves the snow line by far less than the jitter does.
  const L = Math.max(luminosityOf(coreType, trueRadius(coreType, guess)), 1e-4);
  // Water ice only survives beyond the snow line — 2.7 AU in our own nebula,
  // further out around a brighter star. Rock inside it, ice and giants outside.
  const iceLine = 2.7 * AU * Math.sqrt(L);
  let a = Math.max(0.35 * AU * Math.sqrt(Math.max(L, 0.02)),
                   trueRadius(coreType, guess) * settings.bodyScale * 4);

  const n = clamp(Math.round(3 + Math.random() * 4), 2, Math.min(8, freeSlots() - 1));
  const rads = [], mass = [];
  let used = 0;
  for (let i = 0; i < n; i++) {
    const rad = a * rnd(0.94, 1.06);
    a *= rnd(1.5, 1.95);
    // How much solid material sits at a radius is a LOCAL fact, so these are
    // absolute masses, not shares of a budget. Inside the snow line only rock
    // condenses and there is very little of it — our own four terrestrial
    // planets together come to half a percent of the planetary mass. Just
    // outside it, ice is abundant enough for a core to run away and swallow gas.
    const x = rad / iceLine;
    const m = x < 1
      ? rnd(0.05, 3.2) * clamp(x * 2.2, 0.15, 1)
      : rnd(12, 420) * Math.exp(-Math.pow(Math.log(x) / 1.1, 2));
    rads.push(rad); mass.push(m); used += m;
  }

  // Trim if the disc came out heavier than the cloud can spare, and never let it
  // starve the star below the ignition mass it was chosen for.
  let allow = discCap;
  if (canIgnite) allow = Math.min(allow, Math.max(0, M - IGNITE_MASS * 1.02));
  if (used > allow && used > 0) {
    const k = allow / used;
    for (let i = 0; i < n; i++) mass[i] *= k;
    used = allow;
  }

  const coreM = M - used;
  const star = makeBody(coreType, centre, drift, { mass: coreM, name: 'New ' + e.origin });
  const made = [star];

  // Orbital plane from the cloud's own spin. Without it there is no preferred
  // direction and the disc has to fall back on the horizontal.
  let normal = new THREE.Vector3(c.lx, c.ly, c.lz);
  if (normal.lengthSq() < 1e-24) normal.set(0, 1, 0); else normal.normalize();
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(normal.dot(u)) > 0.9) u.set(0, 0, 1);
  u.crossVectors(normal, u).normalize();
  const w = new THREE.Vector3().crossVectors(normal, u).normalize();

  let outermost = 0;
  for (let i = 0; i < n; i++) {
    if (mass[i] <= 0) continue;
    const rad = rads[i], ang = rnd(0, TAU);
    if (rad > outermost) outermost = rad;
    const pos = centre.clone()
      .addScaledVector(u, Math.cos(ang) * rad)
      .addScaledVector(w, Math.sin(ang) * rad);
    const vc = Math.sqrt(G * settings.gravity * star.m / rad);
    const vel = drift.clone()
      .addScaledVector(u, -Math.sin(ang) * vc)
      .addScaledVector(w, Math.cos(ang) * vc);
    made.push(makeBody(discPlanetType(mass[i], rad < iceLine), pos, vel, { mass: mass[i] }));
  }
  const planets = made.length - 1;

  // The grains are spent; the star and its planets are what they became.
  disperseCloud(e);

  // Orbits are very nearly momentum-neutral but not exactly, so let the star
  // soak up the difference — which is what sitting at the barycentre means.
  let px = 0, py = 0, pz = 0;
  for (const b of made) { px += b.v.x * b.m; py += b.v.y * b.m; pz += b.v.z * b.m; }
  star.v.x += (totalP.x - px) / star.m;
  star.v.y += (totalP.y - py) / star.m;
  star.v.z += (totalP.z - pz) / star.m;

  fx.flash(centre, Math.max(visRadius(star) * 14, e.r * 0.5), [255, 246, 226], 1);
  e.alive = false;
  disposeSN(e);
  const idx = supernovae.indexOf(e);
  if (idx >= 0) supernovae.splice(idx, 1);

  computeAccel();
  refreshStarCache();
  updateTemperatures();
  // Pull back far enough to show what was just built. The camera was zoomed
  // right in on a collapsing knot; the system it became is a thousand times wider.
  view.target.copy(centre);
  if (outermost > 0) view.dist = clamp(outermost * 2.6, MIN_DIST, MAX_DIST);
  sim.follow = null;
  select(star);
  toast(canIgnite
    ? star.name + ' ignited from the cloud, with ' + planets + (planets === 1 ? ' planet' : ' planets')
    : star.name + ' collapsed but never lit — too little mass to start fusion');
  return true;
}

function updateSupernovae(simDt) {
  refreshClouds();
  brakeClouds(simDt);
  for (let i = supernovae.length - 1; i >= 0; i--) {
    const e = supernovae[i];
    e.age += simDt;
    e.p.addScaledVector(e.v, simDt);
    e.radius += e.vShock * simDt;
    if (snSet.blast) snSweep(e);

    e.lum = snLuminosity(e);
    if (e.lum > e.peak) e.peak = e.lum;

    // Left alone the core temperature just follows the cooling photosphere; once
    // the player takes hold of the slider it is theirs.
    if (!e.held) e.coreT = snPhotoT(e.age);
    const c = kelvinToRGB(e.coreT);
    e.lightColor.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);

    // Past its bright weeks the interesting number is not how much it shines but
    // how much matter is still there to build something out of.
    e.name = e.lum > 100
      ? e.label + ' · ' + fmtLum(e.lum)
      : e.label + ' remnant · ' + fmtMass(e.m);

    updateSNVisual(e);
    // The light fades in months; the cloud itself lasts as long as it has grains,
    // so it stays there to be selected and squeezed long after it goes dark.
    if (e.age > e.life && (!e.cloud || e.cloud.n === 0)) {
      e.alive = false;
      disposeSN(e);
      supernovae.splice(i, 1);
    }
  }
}

/* ---------------------------------------------------------- remnant visuals */

const SN_VERT = `
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vN = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vV = -mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const SN_FRAG = `
  uniform vec3 uInner;
  uniform vec3 uOuter;
  uniform float uOp;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    // Limb brightening. The ejecta is a thin skin, so a sightline near the edge
    // passes through far more of it than one straight through the middle —
    // which is why real remnants look like rings rather than filled discs.
    float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(clamp(f, 0.0, 1.0), 3.0);
    gl_FragColor = vec4(mix(uInner, uOuter, clamp(f, 0.0, 1.0)) * (rim * 2.2 + 0.03) * uOp, 1.0);
  }`;

function buildSNVisual(e) {
  const g = new THREE.Group();

  const shell = new THREE.Mesh(SPHERE, new THREE.ShaderMaterial({
    uniforms: {
      uInner: { value: new THREE.Color(1, 0.45, 0.24) },
      uOuter: { value: new THREE.Color(0.62, 0.8, 1) },
      uOp: { value: 1 }
    },
    vertexShader: SN_VERT, fragmentShader: SN_FRAG,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  }));
  shell.renderOrder = 4;
  g.add(shell);

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_HALO, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  core.renderOrder = 8;
  g.add(core);

  const boom = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false
  }));
  boom.renderOrder = 9;
  g.add(boom);

  scene.add(g);
  e.obj = g; e.shell = shell; e.core = core; e.boom = boom;
}

function updateSNVisual(e) {
  if (!e.obj) return;
  e.obj.position.copy(e.p);
  const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));

  // The glow fades over months, but never quite to nothing while there is still
  // gas here — the cloud has to stay findable to be worth selecting.
  const alive = e.cloud && e.cloud.n > 0;
  const fade = Math.max(clamp(Math.exp(-e.age / 90), 0, 1), alive ? 0.12 : 0);
  e.shell.scale.setScalar(Math.max(e.radius, 1e-6));
  e.shell.material.uniforms.uOp.value = fade * 0.85;
  e.shell.material.uniforms.uInner.value.copy(e.lightColor);
  e.shell.visible = fade > 0.012 && e.radius / wpp > 3;

  // The glowing photosphere, as bright as the light curve says — with a pixel
  // floor, because the brightest thing in the sky should never be invisible.
  const lit = e.peak > 0 ? Math.pow(clamp(e.lum / e.peak, 0, 1), 0.4) : 0;
  e.core.visible = lit > 0.012;
  if (e.core.visible) {
    e.core.scale.setScalar(Math.max(e.radius * 0.5, 26 * wpp) * (0.35 + lit * 0.95));
    e.core.material.color.copy(e.lightColor);
    e.core.material.opacity = lit * 0.95;
  }

  const bo = clamp(1 - e.age / 1.2, 0, 1);
  e.boom.visible = bo > 0.012;
  if (e.boom.visible) {
    e.boom.material.opacity = bo * bo;
    e.boom.scale.setScalar(Math.max(e.radius * 2.2, 90 * wpp) * (0.5 + (1 - bo) * 2.4));
  }
}

function disposeSN(e) {
  if (!e.obj) return;
  scene.remove(e.obj);
  e.obj.traverse(o => { if (o.material) o.material.dispose(); });
  e.obj = null; e.shell = null; e.core = null; e.boom = null;
}

function clearSupernovae() {
  for (const e of supernovae) { e.alive = false; disposeSN(e); }
  supernovae.length = 0;
}

/* ------------------------------------------------------------ growing old  */

/**
 * Burn fuel. Real stars take millions of years to do this, so the whole thing
 * is off unless you ask for it and runs at whatever multiple of real time you
 * pick — that multiplier is the only unphysical number in here.
 */
function ageStars(dt) {
  const boost = Math.pow(10, snSet.ageRate);
  let dying = null;
  for (const b of sim.bodies) {
    if (b.kind !== 'body') continue;
    const def = TYPES[b.type];
    if (!def.star || def.surf === 'neutron' || def.surf === 'dwarfstar') continue;
    b.age += dt * boost;
    if (b.age >= msLifetime(b.m / M_SUN)) (dying || (dying = [])).push(b);
  }
  if (!dying) return;
  for (const b of dying) {
    if (!b.alive) continue;
    const name = b.name;
    if (b.m / M_SUN >= snSet.ccMass && snSet.on) {
      const p = goSupernova(b);
      toast(p ? name + ' ran out of fuel and went ' + p.label + '!' : name + ' burned out');
    } else {
      shedEnvelope(b);
    }
  }
}

/**
 * A star too light to collapse a core ends far more gently, but just as
 * finally: it swells up, coughs its outer layers off at about 20 km/s as a
 * planetary nebula, and leaves its naked carbon–oxygen core behind as a white
 * dwarf. How much core is left follows the observed initial-final mass
 * relation (Kalirai et al. 2008), M_wd ≈ 0.109·M + 0.394 M☉ — so the Sun will
 * end up as roughly half a solar mass of slowly cooling crystal.
 */
function shedEnvelope(b) {
  const mSun = b.m / M_SUN;
  const wd = Math.min(clamp(0.109 * mSun + 0.394, 0.17, 1.38) * M_SUN, b.m);
  const env = b.m - wd;
  const name = b.name;
  const oldR = Math.max(visRadius(b), 1e-9);

  if (env > 0) {
    const n = Math.min(420, parts.free.length);
    if (n > 3) {
      // The envelope leaves from the swollen red-giant surface, out around an
      // AU, not from where the main-sequence star's photosphere used to be.
      // Real nebulae drift off at 20–40 km/s, but they are pushed by radiation
      // pressure over thousands of years rather than thrown; a purely ballistic
      // launch has to clear the local escape speed or it just rains back down.
      const rAGB = Math.max(1.2 * AU, oldR * 1.5);
      const vEsc = Math.sqrt(2 * G * settings.gravity * b.m / rAGB);
      blastShell(b.p, b.v, n, env, {
        vMean: Math.max(20 * KMS, vEsc * 1.35), r0: rAGB, coolDays: 400,
        hot: [150, 255, 226], cool: [255, 126, 178], sizeMin: 1.4, sizeMax: 5.5
      });
    }
  }

  b.m = wd;
  b.type = 'white_dwarf';
  b.kind = 'body';
  b.age = 0;
  // A freshly exposed core is ferociously hot; it has nothing left to burn and
  // will spend the rest of the universe's life cooling off.
  b.temp = 60000;
  b.spin = TYPES.white_dwarf.spin;
  b.r = trueRadius('white_dwarf', wd);
  updateLuminosity(b);
  refreshVisual(b);
  fx.flash(b.p, oldR * 30, [170, 255, 230], 0.8);
  toast(name + ' shed its envelope and became a white dwarf');
}

/* ============================================================ tidal forces  */

/**
 * Inside the fluid Roche limit a satellite can't hold itself together against
 * the tide, and it spreads into a ring of rubble. This is why Saturn has rings
 * and why Roche's limit matters at all.
 */
/**
 * Fluid Roche limit for satellite `s` around primary `P`.
 *
 * Deliberately computed from TRUE radii, not the exaggerated drawn ones — using
 * drawn radii would scale the limit up with them and shred genuine moons like
 * Io. The floor keeps the zone just outside whatever is actually on screen, so
 * the effect stays visible when bodies are drawn larger than life.
 */
function rocheLimit(P, s) {
  const rP = P.r, rS = s.r;
  const densRatio = (P.m / (rP * rP * rP)) / (s.m / (rS * rS * rS));
  return Math.max(
    2.44 * rP * Math.cbrt(densRatio),
    (visRadius(P) + visRadius(s)) * 1.5
  );
}

function checkTides() {
  const bs = sim.bodies;
  for (let i = 0; i < bs.length; i++) {
    const s = bs[i];
    if (!s.alive || s.disrupted || s.kind !== 'body') continue;
    if (TYPES[s.type].star || s.m > 40) continue;          // too big / too hot to shred
    for (let j = 0; j < bs.length; j++) {
      const P = bs[j];
      if (P === s || !P.alive || P.m < s.m * 12) continue;
      const roche = rocheLimit(P, s);
      const d = s.p.distanceTo(P.p);
      if (d < roche && d > visRadius(P) + visRadius(s)) {
        tidalDisrupt(s, P, d);
        return;                                            // one per step is plenty
      }
    }
  }
}

function tidalDisrupt(s, P, d) {
  const frags = Math.min(clamp(Math.round(7 + Math.random() * 7), 6, 14), freeSlots());
  if (frags < 3) return;                       // no room: leave the moon intact

  // Most of a shredded moon becomes ring material, laid onto its own orbit.
  const dust = ringEjecta(s.p, s.v, P, 560, s.m * 0.55, 0.4, [232, 240, 255], [126, 122, 116]);
  const each = (s.m - dust) / frags;
  const orbitDir = s.v.clone().sub(P.v);
  const speed = orbitDir.length();
  const made = [];
  for (let i = 0; i < frags; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    // spread the fragments along the orbit so they stretch into an arc
    const along = (i / frags - 0.5) * 0.6;
    const radial = s.p.clone().sub(P.p).normalize();
    const tang = orbitDir.clone().normalize();
    const pos = s.p.clone()
      .addScaledVector(tang, d * along)
      .addScaledVector(radial, visRadius(s) * rnd(-2, 2));
    const vel = P.v.clone()
      .addScaledVector(tang, speed * rnd(0.97, 1.03))
      .addScaledVector(radial, speed * rnd(-0.02, 0.02));
    made.push(makeBody(each > 0.004 ? 'moon' : 'asteroid', pos, vel, { mass: Math.max(each, 1e-7), name: 'Ring frag', rubble: true }));
  }
  // The ring should drift exactly as the moon did, not gain a net kick.
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, s.v.clone().multiplyScalar(tot));
  fx.flash(s.p, visRadius(s) * 5, [255, 240, 220], 0.8);
  toast(s.name + ' was torn apart by ' + P.name + '’s tides');
  if (sim.selected === s) select(null);
  removeBody(s);
  s.disrupted = true;
  compact();
}

/* ========================================================== temperature     */

function updateTemperatures() {
  const stars = sim.starCache;
  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    if (TYPES[b.type].star || b.kind !== 'body') continue;
    let flux = 0;
    for (let s = 0; s < stars.length; s++) {
      const st = stars[s];
      const dAU = Math.max(b.p.distanceTo(st.p) / AU, 1e-4);
      flux += st.lum / (dAU * dAU);
    }
    // 278.6 K is the equilibrium temperature at 1 AU from a Sun-like star
    const eq = flux > 0 ? 278.6 * Math.pow(flux, 0.25) : 3;
    const floor = TYPES[b.type].glowHot ? 1200 : 3;
    b.temp = Math.max(eq, floor);
  }
}

/* ================================================================== renderer */

let renderer, scene, camera, canvasEl;
let SPHERE, SPHERE_LO;
const ringGeoCache = new Map();

/**
 * An annulus normalised so its outer edge sits at radius 1, which lets a single
 * uniform scale place both edges correctly.
 */
function ringGeometry(innerRatio) {
  const key = innerRatio.toFixed(3);
  if (!ringGeoCache.has(key)) ringGeoCache.set(key, new THREE.RingGeometry(innerRatio, 1, 120, 1));
  return ringGeoCache.get(key);
}
let TEX_GLOW, TEX_HALO, TEX_TAIL, TEX_PHOTON;
const texCache = new Map();
const VIEW = { w: 1, h: 1, dpr: 1 };
const FOV = 55;

const hashStr = (s) => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/** World units per screen pixel at a given distance — used for pixel floors. */
function worldPerPixel(dist) {
  return 2 * Math.tan(FOV * Math.PI / 360) * dist / VIEW.h;
}

function initScene() {
  canvasEl = document.getElementById('an-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x03030a, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 1e-4, 4e6);

  SPHERE = new THREE.SphereGeometry(1, 44, 30);
  SPHERE_LO = new THREE.SphereGeometry(1, 16, 12);

  TEX_GLOW = new THREE.CanvasTexture(glowTexture(256, 0.16, 0.85));
  TEX_HALO = new THREE.CanvasTexture(glowTexture(256, 0.04, 0.30));
  TEX_TAIL = new THREE.CanvasTexture(tailTexture(256));
  TEX_PHOTON = new THREE.CanvasTexture(photonRingTexture(512));

  scene.add(new THREE.AmbientLight(0xffffff, 0.055));

  buildSky();
  initParticles();
  initPost();
  resize();
}

/** Bright annulus used for a black hole's photon ring. */
function photonRingTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0)');
  g.addColorStop(0.375, 'rgba(255,236,196,0.30)');
  g.addColorStop(0.405, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.435, 'rgba(255,214,140,0.34)');
  g.addColorStop(0.62, 'rgba(255,160,60,0.06)');
  g.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/* ------------------------------------------------------------ shared shaders */

const ATMO_VERT = `
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vWN = normalize(mat3(modelMatrix) * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vVP = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

const ATMO_FRAG = `
  uniform vec3 uColor;
  uniform vec3 uLight;
  uniform float uStrength;
  varying vec3 vWN;
  varying vec3 vVP;
  void main() {
    vec3 V = normalize(-vVP);
    vec3 N = normalize((viewMatrix * vec4(vWN, 0.0)).xyz);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    float lit = max(dot(normalize(vWN), normalize(uLight)), 0.0);
    gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
  }`;

/* ------------------------------------------------------------------ textures */

function surfaceTexture(type, seed) {
  const def = TYPES[type];
  if (!def.surf) return null;
  const variant = seed % 3;
  const key = type + ':' + variant;
  if (texCache.has(key)) return texCache.get(key);

  const small = def.group === 'MOONS & DEBRIS' || def.lumpy;
  const W = small ? 256 : 512, H = small ? 128 : 256;
  const cv = newCanvas(W, H);
  const rng = mulberry32(hashStr(key));
  const opts = Object.assign({ temp: def.temp, spots: def.spots }, def.opts || {});
  SURFACE[def.surf](cv.getContext('2d'), W, H, rng, opts);

  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  texCache.set(key, t);
  return t;
}

function cachedTexture(key, make) {
  if (texCache.has(key)) return texCache.get(key);
  const t = new THREE.CanvasTexture(make());
  t.encoding = THREE.sRGBEncoding;
  texCache.set(key, t);
  return t;
}

/** Deform a sphere into a believable irregular body (asteroids, comet nuclei). */
function lumpyGeometry(seed, amount) {
  const g = SPHERE_LO.clone();
  const pos = g.attributes.position, uv = g.attributes.uv;
  const f = fbm(seed, 4, 2, 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const u = uv.getX(i), vv = 1 - uv.getY(i);
    // fade the displacement out at the poles so the seam vertices stay together
    const fade = Math.sin(Math.PI * clamp(vv, 0, 1));
    const s = 1 + (f(u, vv) - 0.5) * 2 * amount * fade;
    pos.setXYZ(i, v.x * s, v.y * s, v.z * s);
  }
  g.computeVertexNormals();
  return g;
}

/* ============================================================ body visuals  */

function buildVisual(b) {
  const def = TYPES[b.type];
  const grp = new THREE.Group();
  b.obj = grp;
  b.parts = {};

  if (b.kind === 'bh') buildHole(b, grp);
  else if (b.kind === 'wh') buildWhiteHole(b, grp);
  else buildWorld(b, def, grp);

  // A pixel-floor marker so distant bodies never vanish entirely.
  const dotMat = new THREE.SpriteMaterial({
    map: TEX_GLOW, color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
  });
  b.parts.dot = new THREE.Sprite(dotMat);
  b.parts.dot.renderOrder = 6;
  grp.add(b.parts.dot);

  scene.add(grp);
  buildTrail(b);
  scaleVisual(b);
}

function buildWorld(b, def, grp) {
  const geo = def.lumpy ? lumpyGeometry(b.seed, def.lumpy) : SPHERE;
  b.ownGeo = def.lumpy ? geo : null;
  const tex = surfaceTexture(b.type, b.seed);

  let mat;
  if (def.star) {
    mat = new THREE.MeshBasicMaterial({ map: tex });
  } else {
    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: def.surf === 'iron' ? 0.42 : def.surf === 'ocean' || def.surf === 'hycean' ? 0.55 : 0.88,
      metalness: def.surf === 'iron' ? 0.55 : def.surf === 'carbon' ? 0.25 : 0.04
    });
    // The emissive map is always attached so a world can start glowing when it
    // heats up without forcing a shader recompile mid-flight.
    mat.emissiveMap = tex;
    mat.emissive = new THREE.Color(0x000000);
    mat.emissiveIntensity = 1;
    if (def.glowHot) {
      mat.emissive.setRGB(def.glowHot * 0.55, def.glowHot * 0.16, 0.02);
    }
  }
  // gentle per-body variation so two Earths aren't identical
  const jit = mulberry32(b.seed);
  mat.color = new THREE.Color().setRGB(0.90 + jit() * 0.14, 0.90 + jit() * 0.14, 0.90 + jit() * 0.14);
  b.baseColor = mat.color.clone();

  const surf = new THREE.Mesh(geo, mat);
  grp.add(surf);
  b.parts.surf = surf;

  if (def.clouds) {
    const ct = cachedTexture('cloud:' + b.type + ':' + (b.seed % 3), () => cloudTexture(hashStr(b.type + b.seed % 3), 512, 256, def.clouds, [255, 255, 255]));
    const cm = new THREE.MeshStandardMaterial({ map: ct, transparent: true, depthWrite: false, roughness: 1 });
    const cloud = new THREE.Mesh(SPHERE, cm);
    cloud.scale.setScalar(1.018);
    grp.add(cloud);
    b.parts.cloud = cloud;
  }

  if (def.atmo) {
    const am = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color().fromArray(def.atmo.map(c => c / 255)) },
        uLight: { value: new THREE.Vector3(1, 0, 0) },
        uStrength: { value: 0.95 }
      },
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    const atmo = new THREE.Mesh(SPHERE, am);
    atmo.scale.setScalar(1.09);
    grp.add(atmo);
    b.parts.atmo = atmo;
  }

  if (def.rings) {
    const rt = cachedTexture('ring:' + b.type, () => ringTexture(hashStr(b.type + 'ring'), 512, def.rings.pal));
    const rm = new THREE.MeshBasicMaterial({ map: rt, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.92 });
    const ring = new THREE.Mesh(ringGeometry(def.rings.inner / def.rings.outer), rm);
    ring.rotation.x = -Math.PI / 2;
    grp.add(ring);
    b.parts.ring = ring;
    b.ringSpec = def.rings;
  }

  if (def.star) {
    const col = new THREE.Color().fromArray(kelvinToRGB(def.temp).map(c => c / 255));
    const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(g1); grp.add(g2);
    b.parts.glow = g1; b.parts.halo = g2;
    b.lightColor = col;
  }

  if (def.tail) {
    const tm = new THREE.MeshBasicMaterial({ map: TEX_TAIL, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const plane = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);   // extends along +X
    const tail = new THREE.Mesh(plane, tm);
    tail.frustumCulled = false;
    scene.add(tail);                    // world-space, oriented each frame
    b.parts.tail = tail;
    const coma = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0x9fd8ff), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    grp.add(coma);
    b.parts.coma = coma;
  }
}

function buildHole(b, grp) {
  const shadow = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  grp.add(shadow);
  b.parts.surf = shadow;

  const photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_PHOTON, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(photon);
  b.parts.photon = photon;

  const dt = cachedTexture('disk', () => accretionTexture(1337, 512));
  const dm = new THREE.MeshBasicMaterial({ map: dt, blending: THREE.AdditiveBlending, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const disk = new THREE.Mesh(ringGeometry(0.26), dm);
  disk.rotation.x = -Math.PI / 2 + 0.30;
  disk.rotation.z = 0.2;
  grp.add(disk);
  b.parts.disk = disk;
}

function buildWhiteHole(b, grp) {
  const core = new THREE.Mesh(SPHERE_LO, new THREE.MeshBasicMaterial({ color: 0xfffbe8 }));
  grp.add(core);
  b.parts.surf = core;

  const g1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_GLOW, color: new THREE.Color(0xfff3b0), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  const g2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_HALO, color: new THREE.Color(0xffe27a), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  grp.add(g1); grp.add(g2);
  b.parts.glow = g1; b.parts.halo = g2;
  b.lightColor = new THREE.Color(0xfff0c0);
}

/** Push mesh scales to match the body's current (exaggerated) radius. */
function scaleVisual(b) {
  const r = visRadius(b);
  const p = b.parts;
  if (!p) return;
  if (p.surf) p.surf.scale.setScalar(r);
  if (p.cloud) p.cloud.scale.setScalar(r * 1.018);
  if (p.atmo) p.atmo.scale.setScalar(r * 1.09);
  if (p.ring && b.ringSpec) p.ring.scale.setScalar(r * b.ringSpec.outer);
  if (p.disk) p.disk.scale.setScalar(r * 7);
  if (p.photon) p.photon.scale.setScalar(r * 5.6);
}

/* Held while dragging a slider, so a mid-drag transformation cannot rebuild the
   panel out from under the pointer. */
let inspectorLock = 0;

/** Rebuild a body's meshes after its type changed (ignition, collapse, …). */
function refreshVisual(b) {
  disposeVisual(b, true);
  buildVisual(b);
  if (sim.selected === b && !inspectorLock) renderInspector();
}

function disposeVisual(b, keepTrail) {
  if (b.obj) {
    scene.remove(b.obj);
    b.obj.traverse(o => {
      if (o.material) {
        if (o.material.map && o.material.map.isCanvasTexture && !cacheHasTexture(o.material.map)) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
  if (b.parts && b.parts.tail) {
    scene.remove(b.parts.tail);
    b.parts.tail.geometry.dispose();
    b.parts.tail.material.dispose();
  }
  if (b.ownGeo) b.ownGeo.dispose();
  b.obj = null; b.parts = null; b.ownGeo = null; b.light = null;
  if (!keepTrail) killTrail(b);
}

function cacheHasTexture(t) {
  for (const v of texCache.values()) if (v === t) return true;
  return false;
}

/* ================================================================= the sky   */

const SKY_R = 1.5e6;
let skyGroup;

function buildSky() {
  skyGroup = new THREE.Group();
  scene.add(skyGroup);

  const N = 4400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const r = mulberry32(20260729);

  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i % 5 < 2) {
      // a crowded band, so the sky has a Milky Way through it
      const th = r() * TAU;
      const el = (r() + r() + r() - 1.5) * 0.19;
      const cy = Math.cos(el);
      x = Math.cos(th) * cy; y = Math.sin(el); z = Math.sin(th) * cy;
    } else {
      const u = r() * 2 - 1, th = r() * TAU, s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = u; z = s * Math.sin(th);
    }
    pos[i * 3] = x * SKY_R; pos[i * 3 + 1] = y * SKY_R; pos[i * 3 + 2] = z * SKY_R;

    const c = kelvinToRGB(2600 + Math.pow(r(), 2.2) * 17000);
    const bright = 0.22 + Math.pow(r(), 2.6) * 0.95;
    col[i * 3] = c[0] / 255 * bright;
    col[i * 3 + 1] = c[1] / 255 * bright;
    col[i * 3 + 2] = c[2] / 255 * bright;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  // depthTest stays ON: the sky sits in the transparent pass, which draws after
  // opaque bodies, so without it the stars would paint over every planet.
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
  }));
  stars.frustumCulled = false;
  stars.renderOrder = -10;
  skyGroup.add(stars);

  // A few faint nebulae for depth.
  const neb = [[0x6a3ba8, 0.10], [0x2f6ea8, 0.09], [0xa8407a, 0.08], [0x2f8f8a, 0.07], [0x8a4a2f, 0.06]];
  for (let i = 0; i < neb.length; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_HALO, color: new THREE.Color(neb[i][0]), opacity: neb[i][1],
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: true
    }));
    const u = r() * 2 - 1, th = r() * TAU, sr = Math.sqrt(1 - u * u);
    s.position.set(sr * Math.cos(th), u * 0.5, sr * Math.sin(th)).multiplyScalar(SKY_R * 0.92);
    s.scale.setScalar(SKY_R * rnd(0.5, 1.1));
    s.renderOrder = -11;
    skyGroup.add(s);
  }
}

/* ============================================================ star lighting */
/* A fixed pool of lights keeps the shader's light count constant, which avoids
   a program recompile (and a visible hitch) every time a star is added.       */

const LIGHT_POOL = 3;
const starLights = [];

function initLights() {
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = new THREE.PointLight(0xffffff, 0, 0, 1);
    l.position.set(0, 0, 0);
    scene.add(l);
    starLights.push(l);
  }
}

function updateLights() {
  const stars = sim.starCache;
  const ranked = stars.slice().sort((a, b) => b.lum - a.lum);
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = starLights[i], s = ranked[i];
    if (!s) { l.intensity = 0; continue; }
    l.position.copy(s.p);
    if (s.lightColor) l.color.copy(s.lightColor);
    // Distance falloff is deliberately off: with real inverse-square light,
    // anything past a few AU would be pitch black and unusable.
    l.intensity = clamp(1.15 + Math.log10(Math.max(s.lum, 1e-4)) * 0.17, 0.4, 2.2);
  }
}

/* ================================================================== effects */

/* ========================================================== debris particles */
/*
 * These are real physical objects, not decoration. Each particle carries a mass
 * in M⊕ and a velocity in Gm/day, and is integrated by the same leapfrog step as
 * the planets. So debris genuinely orbits, settles into rings, rains back onto
 * the world that threw it, and spirals into black holes — and when a body
 * swallows a particle it actually gains that mass.
 *
 * The one simplification: particles do not attract EACH OTHER. They are test
 * particles, feeling gravity only from the heaviest bodies. That turns the cost
 * from O(P²) into O(P × M), which is what makes thousands of them affordable.
 */

const P_MAX = 2400;
const P_SOURCES = 6;          // only the heaviest bodies pull on debris
const P_MAX_STEPS = 20;       // substep ceiling per frame, for the cost bound
const P_CULL = 1.4e5;         // Gm — debris past this has left the system

const parts = {
  pos: null, vel: null, m: null, size: null, bsize: null, hot: null, crate: null,
  col: null, warm: null, cool: null, on: null, src: null,
  free: [], live: 0, geo: null, pts: null, dirty: false
};

/* Impact ejecta cools in a day or two. Supernova ejecta is radioactive and stays
   lit for months, so how fast a grain fades is stored per particle. */
const COOL_IMPACT = 1 / 1.6;

const flashes = [];

/* A per-particle size attribute: one uniform dot size reads as a flat cloud,
   whereas mixing fine grit with fat glowing chunks reads as debris. */
const FX_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uDpr;
  varying vec3 vCol;
  void main() {
    vCol = aCol;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uDpr;
  }`;

const FX_FRAG = `
  uniform sampler2D uMap;
  varying vec3 vCol;
  void main() {
    // Additive blending multiplies by alpha, so the soft falloff comes from the
    // texture while vCol carries the glow as the fragment cools.
    gl_FragColor = vec4(vCol, texture2D(uMap, gl_PointCoord).a);
  }`;

function initParticles() {
  parts.pos = new Float32Array(P_MAX * 3);
  parts.vel = new Float32Array(P_MAX * 3);      // Gm per day — real physics
  parts.col = new Float32Array(P_MAX * 3);
  parts.warm = new Float32Array(P_MAX * 3);     // freshly ejected, glowing
  parts.cool = new Float32Array(P_MAX * 3);     // cold rock
  parts.m = new Float32Array(P_MAX);
  parts.size = new Float32Array(P_MAX);
  parts.bsize = new Float32Array(P_MAX);
  parts.hot = new Float32Array(P_MAX);
  parts.crate = new Float32Array(P_MAX);
  parts.on = new Uint8Array(P_MAX);
  // Which supernova remnant a grain belongs to, or -1 for ordinary impact
  // debris. That is what lets a cloud know how much mass it still has, and lets
  // it hand exactly that mass over when it collapses into a star.
  parts.src = new Int16Array(P_MAX);
  parts.free.length = 0;
  for (let i = P_MAX - 1; i >= 0; i--) parts.free.push(i);
  parts.live = 0;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(parts.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(parts.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(parts.size, 1));
  parts.geo = geo;
  parts.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_GLOW }, uDpr: { value: VIEW.dpr } },
    vertexShader: FX_VERT, fragmentShader: FX_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  parts.pts.frustumCulled = false;
  parts.pts.renderOrder = 5;
  scene.add(parts.pts);

  for (let i = 0; i < 14; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0
    }));
    s.visible = false;
    s.renderOrder = 7;
    scene.add(s);
    flashes.push({ sprite: s, life: 0, max: 1, size: 1 });
  }
}

/**
 * Throw a cloud of real debris out of a point.
 *
 * `totalMass` is genuinely removed from the parent body and handed to the
 * particles, so the caller must subtract whatever this returns. Speeds are
 * spread around the parent's escape velocity, which is what makes the result
 * interesting: the slow half rains back down, the middle settles into a ring,
 * and the fastest escapes altogether.
 *
 * Returns the mass actually used — less than requested if the pool is full.
 */
function ejecta(center, baseVel, count, totalMass, vEsc, hotCol, coolCol, radius, opts) {
  const o = opts || {};
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const sMin = o.sizeMin != null ? o.sizeMin : 1.5;
  const sMax = o.sizeMax != null ? o.sizeMax : 6.5;
  const push = o.speed != null ? o.speed : 1;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    // uniform direction on the sphere
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sr * Math.cos(th), dy = u, dz = sr * Math.sin(th);

    // Power law, so most fragments are slow and a few really fly.
    const frac = Math.pow(Math.random(), 1.9);
    const sp = vEsc * push * (0.55 + frac * 1.9);

    // Start clear of the surface. Spawned inside the collision radius, a grain
    // is absorbed on the very next step and the whole burst vanishes at once.
    const off = radius * rnd(1.15, 2.3);
    parts.pos[k3] = center.x + dx * off;
    parts.pos[k3 + 1] = center.y + dy * off;
    parts.pos[k3 + 2] = center.z + dz * off;

    parts.vel[k3] = baseVel.x + dx * sp;
    parts.vel[k3 + 1] = baseVel.y + dy * sp;
    parts.vel[k3 + 2] = baseVel.z + dz * sp;

    // Fast fragments are the fine grit; slow ones are the big glowing chunks.
    const bs = lerp(sMax, sMin, frac) * rnd(0.75, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], frac * rnd(0, 0.6));
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Release fine debris into a ring around `P`, the way tides actually shear a
 * moon apart. Each grain is placed on the moon's orbit and given the local
 * circular velocity, so it settles into a genuine ring rather than a puff — and
 * because grains at slightly different radii have different periods, the arc
 * shears itself into a complete ring over the following orbits.
 */
function ringEjecta(center, srcVel, P, count, totalMass, arc, hotCol, coolCol) {
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;

  const rel = center.clone().sub(P.p);
  const d0 = rel.length();
  if (d0 < 1e-9) return 0;
  const radial = rel.clone().divideScalar(d0);

  // tangential direction from the moon's own motion about the primary
  const vrel = srcVel.clone().sub(P.v);
  const tang = vrel.clone().addScaledVector(radial, -vrel.dot(radial));
  if (tang.lengthSq() < 1e-18) tang.crossVectors(new THREE.Vector3(0, 1, 0), radial);
  tang.normalize();
  const normal = new THREE.Vector3().crossVectors(radial, tang).normalize();

  const mu = G * settings.gravity * P.m;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    const th = (Math.random() - 0.5) * 2 * arc;
    const r = d0 * (1 + rnd(-0.06, 0.06));
    const ct = Math.cos(th), st = Math.sin(th);

    const outX = radial.x * ct + tang.x * st;
    const outY = radial.y * ct + tang.y * st;
    const outZ = radial.z * ct + tang.z * st;
    const dirX = -radial.x * st + tang.x * ct;
    const dirY = -radial.y * st + tang.y * ct;
    const dirZ = -radial.z * st + tang.z * ct;

    const tilt = rnd(-0.012, 0.012) * d0;
    parts.pos[k3] = P.p.x + outX * r + normal.x * tilt;
    parts.pos[k3 + 1] = P.p.y + outY * r + normal.y * tilt;
    parts.pos[k3 + 2] = P.p.z + outZ * r + normal.z * tilt;

    const vc = Math.sqrt(mu / r) * rnd(0.985, 1.015);
    parts.vel[k3] = P.v.x + dirX * vc;
    parts.vel[k3 + 1] = P.v.y + dirY * vc;
    parts.vel[k3 + 2] = P.v.z + dirZ * vc;

    const bs = rnd(1.4, 5.5);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 0.5;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], Math.random() * 0.4);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Blow a shell of real matter outward — a supernova envelope, or the far gentler
 * puff of a planetary nebula.
 *
 * Speeds are drawn from a broken power law (most of the mass slow, a thin skin
 * very fast) and then multiplied by one common factor chosen so the shell's
 * total kinetic energy comes out at exactly `eKin`. That single normalisation
 * is what ties the picture to the physics: hand it 1e51 erg and ten solar
 * masses and a few thousand km/s falls out on its own, with no fudge factor
 * anywhere. Pass `vMean` instead to aim for a mean speed directly.
 *
 * Every gram of `totalMass` is launched no matter how few slots are left — the
 * fragments just get chunkier — so mass is conserved exactly. Returns null only
 * when the pool is completely full, which is the caller's cue to keep the mass.
 */
function blastShell(center, baseVel, want, totalMass, opts) {
  const o = opts || {};
  const n = Math.min(want, parts.free.length);
  if (n <= 0 || totalMass <= 0) return null;
  const each = totalMass / n;

  const hot = o.hot || [235, 245, 255];
  const cool = o.cool || [255, 108, 62];
  const sMin = o.sizeMin != null ? o.sizeMin : 1.6;
  const sMax = o.sizeMax != null ? o.sizeMax : 8.5;
  const r0 = o.r0 != null ? o.r0 : 0;
  const crate = 1 / Math.max(o.coolDays || 45, 1e-3);
  const src = o.src != null ? o.src : -1;

  // ---- shape the velocity spectrum first, then scale it to the energy budget
  const idx = new Int32Array(n);
  const dir = new Float32Array(n * 3);
  const x = new Float32Array(n);
  let sumX = 0, sumX2 = 0;
  for (let i = 0; i < n; i++) {
    idx[i] = parts.free.pop();
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    dir[i * 3] = sr * Math.cos(th); dir[i * 3 + 1] = u; dir[i * 3 + 2] = sr * Math.sin(th);
    const s = 0.35 + Math.pow(Math.random(), 2.2) * 2.2;
    x[i] = s; sumX += s; sumX2 += s * s;
  }
  // ½·each·Σ(αx)² = eKin  →  α = √(2·eKin / (each·Σx²))
  const alpha = o.vMean != null
    ? o.vMean * n / Math.max(sumX, 1e-12)
    : Math.sqrt(2 * Math.max(o.eKin || 0, 0) / Math.max(each * sumX2, 1e-30));

  let vMax = 0;
  for (let i = 0; i < n; i++) {
    const k = idx[i], k3 = k * 3, d3 = i * 3;
    const sp = alpha * x[i];
    if (sp > vMax) vMax = sp;

    // A thin shell, not a filled ball: the star's envelope really is a skin.
    const off = r0 * rnd(1, 1.35);
    parts.pos[k3] = center.x + dir[d3] * off;
    parts.pos[k3 + 1] = center.y + dir[d3 + 1] * off;
    parts.pos[k3 + 2] = center.z + dir[d3 + 2] * off;

    parts.vel[k3] = baseVel.x + dir[d3] * sp;
    parts.vel[k3 + 1] = baseVel.y + dir[d3 + 1] * sp;
    parts.vel[k3 + 2] = baseVel.z + dir[d3 + 2] * sp;

    const bs = lerp(sMax, sMin, clamp((x[i] - 0.35) / 2.2, 0, 1)) * rnd(0.8, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = crate;
    parts.src[k] = src;

    const w = mix(hot, [255, 255, 255], Math.random() * 0.35);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = cool[0] / 255; parts.cool[k3 + 1] = cool[1] / 255; parts.cool[k3 + 2] = cool[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }

  // Random directions do not cancel, so nudge the whole shell onto the momentum
  // it is supposed to carry. The nudge is ~1/√n of a typical speed, which costs
  // well under a percent of the energy just set above.
  const wantP = o.netP || baseVel.clone().multiplyScalar(totalMass);
  let px = 0, py = 0, pz = 0;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    px += parts.vel[k3] * each; py += parts.vel[k3 + 1] * each; pz += parts.vel[k3 + 2] * each;
  }
  const cx = (wantP.x - px) / totalMass, cy = (wantP.y - py) / totalMass, cz = (wantP.z - pz) / totalMass;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    parts.vel[k3] += cx; parts.vel[k3 + 1] += cy; parts.vel[k3 + 2] += cz;
  }

  parts.dirty = true;
  return { n: n, each: each, vMean: alpha * sumX / n, vMax: vMax };
}

function killParticle(k) {
  const k3 = k * 3;
  parts.on[k] = 0;
  parts.src[k] = -1;
  parts.m[k] = 0;
  parts.size[k] = 0;
  parts.col[k3] = parts.col[k3 + 1] = parts.col[k3 + 2] = 0;
  parts.free.push(k);
  parts.live--;
  parts.dirty = true;
}

function clearParticles() {
  for (let k = 0; k < P_MAX; k++) if (parts.on[k]) killParticle(k);
}

/* The heaviest bodies are the only meaningful gravity sources for debris;
   refreshed once per frame rather than per substep. */
let pSources = [];
const grewBodies = new Set();

/* Running total of the force the debris exerts back on each source, so the
   sources can be given their share of it once per step. */
const pReact = new Float64Array(P_SOURCES * 3);

function refreshSources() {
  pSources = sim.bodies.length <= P_SOURCES
    ? sim.bodies.slice()
    : sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, P_SOURCES);
}

/**
 * Integrate the debris with the same timestep as the planets. Symplectic Euler
 * (kick then drift) — one force evaluation per step, and stable for orbits.
 */
function stepParticles(dt) {
  if (parts.live === 0) return;
  const src = pSources, ns = src.length;
  const gm = G * settings.gravity;
  const pos = parts.pos, vel = parts.vel;
  pReact.fill(0);

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    const px = pos[k3], py = pos[k3 + 1], pz = pos[k3 + 2];
    const pm = parts.m[k];
    let ax = 0, ay = 0, az = 0, hit = null;

    for (let s = 0; s < ns; s++) {
      const b = src[s];
      if (!b.alive) continue;
      const dx = b.p.x - px, dy = b.p.y - py, dz = b.p.z - pz;
      const d2 = dx * dx + dy * dy + dz * dz;
      const rv = visRadius(b);
      if (d2 < rv * rv) { hit = b; break; }          // landed / swallowed
      const soft = 0.35 * b.r;
      const dd = d2 + soft * soft;
      const f = gm * b.m / (dd * Math.sqrt(dd)) * (b.kind === 'wh' ? -1 : 1);
      const fx = dx * f, fy = dy * f, fz = dz * f;
      ax += fx; ay += fy; az += fz;
      // Newton's third law. A grain of impact dust pulling back on a planet is
      // far too faint to matter, but supernova ejecta runs to thousands of Earth
      // masses per grain — letting that accelerate for free would quietly shove
      // the whole system sideways.
      const s3 = s * 3;
      pReact[s3] -= fx * pm; pReact[s3 + 1] -= fy * pm; pReact[s3 + 2] -= fz * pm;
    }

    if (hit) {
      // A perfectly inelastic catch: the grain hands over its momentum as well
      // as its mass. It barely registers for impact dust, but supernova ejecta
      // arrives at thousands of km/s and genuinely shoves what it lands on.
      const pm = parts.m[k];
      const mNew = hit.m + pm;
      if (mNew > 0) {
        hit.v.x = (hit.v.x * hit.m + vel[k3] * pm) / mNew;
        hit.v.y = (hit.v.y * hit.m + vel[k3 + 1] * pm) / mNew;
        hit.v.z = (hit.v.z * hit.m + vel[k3 + 2] * pm) / mNew;
      }
      hit.m = mNew;
      grewBodies.add(hit);
      killParticle(k);
      continue;
    }

    vel[k3] += ax * dt; vel[k3 + 1] += ay * dt; vel[k3 + 2] += az * dt;
    pos[k3] += vel[k3] * dt; pos[k3 + 1] += vel[k3 + 1] * dt; pos[k3 + 2] += vel[k3 + 2] * dt;
  }

  // Hand the sources the recoil the debris just earned them.
  for (let s = 0; s < ns; s++) {
    const b = src[s], s3 = s * 3;
    if (!b.alive || b.m <= 0) continue;
    const inv = dt / b.m;
    b.v.x += pReact[s3] * inv;
    b.v.y += pReact[s3 + 1] * inv;
    b.v.z += pReact[s3 + 2] * inv;
  }
  parts.dirty = true;
}

/** Cool the glow, refresh colours, and drop anything that has left the system. */
function updateParticles(simDt) {
  if (parts.live === 0 && !parts.dirty) return;
  const anchor = pSources.length ? pSources[0].p : null;

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    if (anchor) {
      const dx = parts.pos[k3] - anchor.x, dy = parts.pos[k3 + 1] - anchor.y, dz = parts.pos[k3 + 2] - anchor.z;
      if (dx * dx + dy * dy + dz * dz > P_CULL * P_CULL) { killParticle(k); continue; }
    }
    const h = parts.hot[k] > 0 ? Math.max(0, parts.hot[k] - simDt * parts.crate[k]) : 0;
    parts.hot[k] = h;
    const g = Math.pow(h, 0.55);
    parts.col[k3] = lerp(parts.cool[k3], parts.warm[k3], g);
    parts.col[k3 + 1] = lerp(parts.cool[k3 + 1], parts.warm[k3 + 1], g);
    parts.col[k3 + 2] = lerp(parts.cool[k3 + 2], parts.warm[k3 + 2], g);
    parts.size[k] = parts.bsize[k] * (0.7 + 0.3 * g);
  }

  parts.geo.attributes.position.needsUpdate = true;
  parts.geo.attributes.aCol.needsUpdate = true;
  parts.geo.attributes.aSize.needsUpdate = true;
  parts.pts.material.uniforms.uDpr.value = VIEW.dpr;
  parts.dirty = parts.live > 0;

  // Bodies that ate debris need their radius (and mesh) brought up to date.
  if (grewBodies.size) {
    for (const b of grewBodies) {
      if (!b.alive) continue;
      if (b.kind === 'bh') b.r = schwarzschild(b.m);
      else b.r = trueRadius(b.type, b.m);
      // Enough swallowed debris can push a body over a threshold too.
      const ev = checkEvolution(b);
      if (ev) toast(b.name + EVOLVE_NOTE[ev]);
      else { updateLuminosity(b); scaleVisual(b); }
    }
    grewBodies.clear();
  }
}

const fx = {
  flash(pos, size, color, strength) {
    let f = null;
    for (let i = 0; i < flashes.length; i++) if (flashes[i].life <= 0) { f = flashes[i]; break; }
    if (!f) f = flashes[(Math.random() * flashes.length) | 0];
    f.life = f.max = 0.55;
    f.size = size;
    f.strength = strength;
    f.sprite.position.copy(pos);
    f.sprite.material.color.setRGB(color[0] / 255, color[1] / 255, color[2] / 255);
    f.sprite.visible = true;
  }
};

function updateFx(realDt, simDt) {
  for (let i = 0; i < flashes.length; i++) {
    const f = flashes[i];
    if (f.life <= 0) { if (f.sprite.visible) f.sprite.visible = false; continue; }
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);
    f.sprite.material.opacity = t * t * (f.strength || 1);
    f.sprite.scale.setScalar(f.size * (1.9 - t));
    if (f.life <= 0) f.sprite.visible = false;
  }
}

/* =================================================================== trails */

const TRAIL_CAP = 320;
const MAX_TRAILS = 28;
let trailTick = 0;

function buildTrail(b) { b.trail = null; }

function makeTrail(b) {
  const arr = new Float32Array(TRAIL_CAP * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  line.frustumCulled = false;
  line.renderOrder = 1;
  scene.add(line);
  b.trail = { arr, geo, line, n: 0 };
}

function killTrail(b) {
  if (!b.trail) return;
  scene.remove(b.trail.line);
  b.trail.geo.dispose();
  b.trail.line.material.dispose();
  b.trail = null;
}

function updateTrails() {
  if (!settings.trails) {
    for (const b of sim.bodies) if (b.trail) killTrail(b);
    return;
  }
  // Only the most significant bodies get a trail, so the line count stays sane.
  const ranked = sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, MAX_TRAILS);
  const keep = new Set(ranked);
  for (const b of sim.bodies) {
    if (!keep.has(b) && b.trail) killTrail(b);
    if (keep.has(b) && !b.trail) makeTrail(b);
  }
  trailTick++;
  if (trailTick % 2) return;
  for (const b of ranked) {
    const t = b.trail;
    if (!t) continue;
    if (t.n < TRAIL_CAP) {
      const i = t.n * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
      t.n++;
    } else {
      t.arr.copyWithin(0, 3);
      const i = (TRAIL_CAP - 1) * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
    }
    t.geo.setDrawRange(0, t.n);
    t.geo.attributes.position.needsUpdate = true;
  }
}

function clearTrails() {
  for (const b of sim.bodies) if (b.trail) { b.trail.n = 0; b.trail.geo.setDrawRange(0, 0); }
}

/* ========================================================== lensing pass    */

let rt = null, postScene = null, postCam = null, postMat = null, postOK = false;

const LENS_FRAG = `
  uniform sampler2D tDiffuse;
  uniform vec3 uHoles[4];
  uniform int uCount;
  uniform float uAspect;
  varying vec2 vUv;
  void main() {
    vec2 uv = vUv;
    float dark = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= uCount) break;
      vec3 h = uHoles[i];
      if (h.z <= 0.0) continue;
      vec2 d = (uv - h.xy) * vec2(uAspect, 1.0);
      float r = length(d);
      if (r < 1e-5) continue;
      float rs = h.z;
      // light bends more the closer it passes; taper it off far from the hole
      float defl = (rs * rs) / max(r, rs * 0.4) * 1.5;
      defl *= exp(-r / (rs * 8.0));
      uv -= (d / r) / vec2(uAspect, 1.0) * defl;
      dark = max(dark, smoothstep(rs * 1.04, rs * 0.92, r));
    }
    vec4 c = texture2D(tDiffuse, clamp(uv, vec2(0.001), vec2(0.999)));
    gl_FragColor = vec4(c.rgb * (1.0 - dark), 1.0);
  }`;

const LENS_VERT = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function initPost() {
  try {
    rt = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, stencilBuffer: false, depthBuffer: true
    });
    postMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rt.texture },
        uHoles: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
        uCount: { value: 0 },
        uAspect: { value: 1 }
      },
      vertexShader: LENS_VERT, fragmentShader: LENS_FRAG, depthTest: false, depthWrite: false
    });
    postScene = new THREE.Scene();
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
    postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postOK = true;
  } catch (e) {
    postOK = false;
  }
}

const _proj = new THREE.Vector3();

function gatherHoles() {
  let n = 0;
  const out = postMat ? postMat.uniforms.uHoles.value : null;
  if (!out) return 0;
  for (let i = 0; i < sim.bodies.length && n < 4; i++) {
    const b = sim.bodies[i];
    if (b.kind !== 'bh') continue;
    _proj.copy(b.p).project(camera);
    if (_proj.z < -1 || _proj.z > 1) continue;
    const dist = camera.position.distanceTo(b.p);
    // shadow radius expressed in the same units as the vertical 0..1 screen axis
    const rs = visRadius(b) / (dist * Math.tan(FOV * Math.PI / 360)) * 0.5;
    if (rs < 0.0015 || rs > 3) continue;
    const sx = (_proj.x + 1) * 0.5, sy = (_proj.y + 1) * 0.5;
    if (sx < -1 || sx > 2 || sy < -1 || sy > 2) continue;
    out[n].set(sx, sy, rs);
    n++;
  }
  return n;
}

function renderFrame() {
  let holes = 0;
  if (settings.lensing && postOK) holes = gatherHoles();
  if (holes > 0) {
    postMat.uniforms.uCount.value = holes;
    postMat.uniforms.uAspect.value = VIEW.w / VIEW.h;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

/* =================================================================== camera */

const view = { target: new THREE.Vector3(), dist: 900, yaw: 0.75, pitch: 0.46 };
const MIN_DIST = 2e-4, MAX_DIST = 2.4e6;

function applyCamera() {
  view.pitch = clamp(view.pitch, -1.52, 1.52);
  view.dist = clamp(view.dist, MIN_DIST, MAX_DIST);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(
    view.target.x + view.dist * cp * Math.sin(view.yaw),
    view.target.y + view.dist * sp,
    view.target.z + view.dist * cp * Math.cos(view.yaw)
  );
  camera.lookAt(view.target);
  // keep the near plane sensible across nine orders of magnitude
  camera.near = Math.max(1e-6, view.dist * 1e-4);
  camera.far = Math.max(view.dist * 12, SKY_R * 2.2);
  camera.updateProjectionMatrix();
  if (skyGroup) skyGroup.position.copy(camera.position);
}

function frameOn(b, margin) {
  if (!b) return;
  view.target.copy(b.p);
  view.dist = clamp(visRadius(b) * (margin || 9), MIN_DIST, MAX_DIST);
}

function resize() {
  // Never let the viewport reach zero: a hidden or collapsed window reports
  // 0×0, and every worldPerPixel() division downstream would become Infinity.
  const w = Math.max(window.innerWidth, 1), h = Math.max(window.innerHeight, 1);
  VIEW.w = w; VIEW.h = h;
  VIEW.dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(VIEW.dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (rt) rt.setSize(Math.floor(w * VIEW.dpr), Math.floor(h * VIEW.dpr));
}

/* ========================================================= selection marker */

/**
 * Drawn as an SVG overlay rather than a sprite in the scene: anything inside the
 * 3D pass gets warped and darkened by the black-hole lensing shader, which had
 * been swallowing the reticle whole whenever you selected a hole.
 */
function updateReticle() {
  const el = $('an-ret');
  const b = sim.selected;
  if (!b || !b.alive) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const px = apparentPx(b);
  // Once a body fills the view it is obvious what is selected, and a reticle
  // that size just sprawls across the panels.
  if (px > VIEW.h * 0.3) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  _lp.copy(b.p).project(camera);
  if (_lp.z < -1 || _lp.z > 1) { el.style.display = 'none'; return; }
  el.setAttribute('cx', ((_lp.x + 1) * 0.5 * VIEW.w).toFixed(1));
  el.setAttribute('cy', ((1 - _lp.y) * 0.5 * VIEW.h).toFixed(1));
  el.setAttribute('r', Math.max(px * 1.55, 20).toFixed(1));
  if (el.style.display !== 'block') el.style.display = 'block';
}

/* =================================================================== labels */

const LABEL_POOL = 22;
const labelEls = [];

function initLabels() {
  const host = document.getElementById('an-app');
  for (let i = 0; i < LABEL_POOL; i++) {
    const d = document.createElement('div');
    d.className = 'an-label';
    d.style.display = 'none';
    host.appendChild(d);
    labelEls.push(d);
  }
}

const _lp = new THREE.Vector3();

function updateLabels() {
  if (!settings.labels) {
    for (const el of labelEls) if (el.style.display !== 'none') el.style.display = 'none';
    return;
  }
  // Zoomed out, every body is a sub-pixel dot indistinguishable from a
  // background star, so rank by significance (apparent size plus mass) and let
  // the pool size decide how many get named rather than a raw pixel threshold.
  const cands = [];
  for (const b of sim.bodies) {
    const px = apparentPx(b);
    const score = (b === sim.selected || b === sim.follow)
      ? 1e9
      : px + Math.log10(Math.max(b.m, 1e-12)) * 0.9;
    cands.push([score, b, px]);
  }
  // A live supernova outranks everything — it is the only thing anyone is
  // looking at — and its label doubles as a running brightness readout.
  for (const e of supernovae) {
    if (e.lum < 1 && !(e.cloud && e.cloud.n > 0)) continue;
    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));
    cands.push([2e9, e, clamp(e.r / wpp, 6, 90)]);
  }
  cands.sort((a, b) => b[0] - a[0]);

  // Bodies that sit on top of each other at this zoom (Earth and its Moon, a
  // debris cloud) would otherwise stack their names into an unreadable smear.
  const taken = [];
  let slot = 0;

  for (let ci = 0; ci < cands.length && slot < LABEL_POOL; ci++) {
    const c = cands[ci];
    const b = c[1];
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1 || _lp.x < -1.1 || _lp.x > 1.1 || _lp.y < -1.1 || _lp.y > 1.1) continue;

    const x = (_lp.x + 1) * 0.5 * VIEW.w;
    const y = (1 - _lp.y) * 0.5 * VIEW.h;
    let clash = false;
    for (let t = 0; t < taken.length; t++) {
      if (Math.abs(taken[t][0] - x) < 52 && Math.abs(taken[t][1] - y) < 13) { clash = true; break; }
    }
    if (clash && b !== sim.selected && b !== sim.follow) continue;
    taken.push([x, y]);

    const el = labelEls[slot++];
    const off = Math.min(Math.max(c[2], 5) + 9, 90);
    el.style.transform = 'translate(-50%,0) translate(' + x.toFixed(1) + 'px,' + (y + off).toFixed(1) + 'px)';
    if (el.textContent !== b.name) el.textContent = b.name;
    el.classList.toggle('sel', b === sim.selected);
    if (el.style.display !== 'block') el.style.display = 'block';
  }

  for (let i = slot; i < LABEL_POOL; i++) {
    const el = labelEls[i];
    if (el.style.display !== 'none') el.style.display = 'none';
  }
}

function apparentPx(b) {
  const d = camera.position.distanceTo(b.p);
  return visRadius(b) / worldPerPixel(Math.max(d, 1e-9));
}

/* ========================================================== visual update   */

const _dir = new THREE.Vector3();
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const FROST = new THREE.Color(0.72, 0.82, 0.95);

function refreshStarCache() {
  sim.starCache.length = 0;
  for (const b of sim.bodies) {
    if (b.lum > 0 || (TYPES[b.type].star && b.kind === 'body')) sim.starCache.push(b);
  }
  // A supernova is a light source like any other — briefly the brightest in the
  // sky by a factor of billions. It carries .p, .lum and .lightColor, which is
  // everything the lighting and temperature passes ask of a star.
  for (const e of supernovae) if (e.lum > 1e-3) sim.starCache.push(e);
}

function nearestStar(b) {
  let best = null, bestD = Infinity;
  for (const s of sim.starCache) {
    if (s === b) continue;
    const d = b.p.distanceToSquared(s.p);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function updateVisuals(realDt, simDt) {
  // First, because an explosion can destroy bodies and is itself a light source
  // that the two passes below need to know about.
  updateSupernovae(simDt);
  refreshStarCache();
  updateTemperatures();
  updateLights();

  for (let i = 0; i < sim.bodies.length; i++) {
