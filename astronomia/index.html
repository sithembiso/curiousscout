    const b = sim.bodies[i];
    const p = b.parts;
    if (!p) continue;
    const def = TYPES[b.type];
    const r = visRadius(b);
    const px = apparentPx(b);

    b.obj.position.copy(b.p);
    b.obj.rotation.z = b.tilt;

    // ---- level of detail: below a couple of pixels, draw a dot instead
    const tiny = px < 1.7;
    if (p.surf) p.surf.visible = !tiny;
    if (p.cloud) p.cloud.visible = !tiny && px > 5;
    if (p.atmo) p.atmo.visible = !tiny && px > 4;
    if (p.ring) p.ring.visible = !tiny;
    if (p.disk) p.disk.visible = !tiny;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    if (p.dot) {
      const show = tiny || def.star || b.kind === 'wh';
      p.dot.visible = show;
      if (show) {
        const size = tiny ? 5.4 * wpp : Math.max(r * 2.2, 3.0 * wpp);
        p.dot.scale.setScalar(size);
        // Zoomed far out these dots are the only trace of a planet, so keep
        // them legible rather than fading them to nothing.
        p.dot.material.opacity = tiny ? clamp(0.45 + px * 0.3, 0.45, 1) : 0.55;
      }
    }

    if (p.surf && !tiny) p.surf.rotation.y = b.rot;
    if (p.cloud) p.cloud.rotation.y = b.rot * 1.12;

    // ---- lighting direction for the atmosphere rim
    if (p.atmo && p.atmo.visible) {
      const s = nearestStar(b);
      if (s) _dir.copy(s.p).sub(b.p).normalize();
      else _dir.copy(camera.position).sub(b.p).normalize();
      p.atmo.material.uniforms.uLight.value.copy(_dir);
    }

    // ---- stars: glow scaled with a pixel floor so they never disappear
    if (p.glow) {
      p.glow.scale.setScalar(Math.max(r * 3.4, 11 * wpp));
      p.halo.scale.setScalar(Math.max(r * 9.5, 34 * wpp));
    }

    // ---- black holes
    if (p.disk) p.disk.rotation.z += realDt * 0.35;
    if (p.photon) p.photon.scale.setScalar(Math.max(r * 5.6, 16 * wpp));

    // ---- a world's appearance responds to how hot it is
    if (b.glowPulse) b.glowPulse = Math.max(0, b.glowPulse - realDt * 0.4);
    if (p.surf && b.baseColor && p.surf.material.isMeshStandardMaterial) {
      const mat = p.surf.material;
      const hot = clamp((b.temp - 900) / 1300, 0, 1);
      const base = def.glowHot ? def.glowHot * 0.55 : 0;
      // A freshly transformed world glows from the heat of its own collapse.
      const pulse = b.glowPulse ? Math.pow(b.glowPulse, 0.7) : 0;
      const e = Math.max(base, hot * 0.85, pulse);
      mat.emissive.setRGB(e, e * 0.28, e * 0.05);
      const cold = clamp((110 - b.temp) / 70, 0, 1) * 0.5;
      mat.color.copy(b.baseColor).lerp(FROST, cold);
    }

    // ---- comet tail: grows as it nears a star, always pointing away from it
    if (p.tail) {
      const s = nearestStar(b);
      let len = 0, flux = 0;
      if (s) {
        const dAU = Math.max(b.p.distanceTo(s.p) / AU, 1e-3);
        flux = s.lum / (dAU * dAU);
        // An absolute scale, not a multiple of the nucleus: a comet is a few km
        // across but its tail runs for a good fraction of an AU. Below roughly
        // 5 AU of sunlight there is not enough heat to outgas at all.
        if (flux > 0.03) len = 0.16 * AU * Math.pow(clamp(flux, 0, 60), 0.4);
      }
      const visible = len > 0 && len / wpp > 4;
      p.tail.visible = visible;
      if (p.coma) {
        p.coma.visible = visible;
        p.coma.scale.setScalar(Math.max(len * 0.035, r * 6, 4 * wpp));
        p.coma.material.opacity = clamp(Math.pow(clamp(flux, 0, 60), 0.35) * 0.4, 0.12, 0.9);
      }
      if (visible) {
        _tmpA.copy(b.p).sub(s.p).normalize();                       // away from the star
        _tmpB.copy(camera.position).sub(b.p).normalize();
        const z = _tmpB.clone().addScaledVector(_tmpA, -_tmpB.dot(_tmpA));
        if (z.lengthSq() < 1e-12) z.set(0, 1, 0); else z.normalize();
        const y = new THREE.Vector3().crossVectors(z, _tmpA);
        _basis.makeBasis(_tmpA, y, z);
        _basis.scale(new THREE.Vector3(len, len * 0.14, 1));
        _basis.setPosition(b.p);
        p.tail.matrixAutoUpdate = false;
        p.tail.matrix.copy(_basis);
        p.tail.matrixWorldNeedsUpdate = true;
      }
    }
  }

  updateReticle();
  updateTrails();
  updateParticles(simDt);
  updateFx(realDt, simDt);
  updateLabels();
}

/* ==================================================================== input */

const $ = (id) => document.getElementById(id);
const raycaster = new THREE.Raycaster();

const input = {
  mode: null,
  armed: null,
  x0: 0, y0: 0, x: 0, y: 0,
  moved: false,
  placePos: null,
  pointers: new Map(),
  pinchD: 0, pinchX: 0, pinchY: 0
};

/**
 * Map a screen point onto a world position. The horizontal plane through the
 * focus point is preferred so built systems stay roughly coplanar; when the
 * camera is too close to edge-on, fall back to a plane facing the camera.
 */
function screenToWorld(sx, sy) {
  raycaster.setFromCamera(new THREE.Vector2((sx / VIEW.w) * 2 - 1, -(sy / VIEW.h) * 2 + 1), camera);
  const ray = raycaster.ray;
  if (Math.abs(ray.direction.y) > 0.10) {
    const t = (view.target.y - ray.origin.y) / ray.direction.y;
    if (t > 0 && t < view.dist * 40) return ray.origin.clone().addScaledVector(ray.direction, t);
  }
  const n = camera.getWorldDirection(new THREE.Vector3());
  const denom = n.dot(ray.direction);
  const t = Math.abs(denom) > 1e-6 ? n.dot(_tmpA.copy(view.target).sub(ray.origin)) / denom : view.dist;
  return ray.origin.clone().addScaledVector(ray.direction, clamp(t, view.dist * 0.02, view.dist * 40));
}

/** Pick by screen distance rather than mesh intersection, so tiny bodies work. */
function pickBody(sx, sy) {
  let best = null, bestScore = Infinity;
  for (const b of sim.bodies) {
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    const reach = Math.max(apparentPx(b) + 10, 16);
    if (d > reach) continue;
    const score = d - apparentPx(b) * 0.25;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) return best;

  // Only fall through to remnant clouds when nothing solid is under the cursor —
  // a cloud covers half the screen, and you still need to be able to click the
  // neutron star sitting in the middle of it.
  let bestD = Infinity;
  for (const e of supernovae) {
    if (!e.alive || !e.cloud || e.cloud.mass <= 0) continue;
    _lp.copy(e.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    if (d > Math.max(apparentPx(e), 26)) continue;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/** The body whose gravity dominates at a point — used for auto-orbit. */
function dominantAt(pos, exclude) {
  let best = null, bestPull = 0;
  for (const b of sim.bodies) {
    if (b === exclude || b.kind === 'wh') continue;
    const d2 = Math.max(b.p.distanceToSquared(pos), 1e-9);
    const pull = b.m / d2;
    if (pull > bestPull) { bestPull = pull; best = b; }
  }
  return best;
}

/** Circular-orbit velocity about `primary` at `pos`, in the horizontal plane. */
function circularVelocity(primary, pos) {
  const rel = pos.clone().sub(primary.p);
  const d = rel.length();
  if (d < 1e-9) return new THREE.Vector3();
  const speed = Math.sqrt(G * settings.gravity * primary.m / d);
  let tang = new THREE.Vector3(0, 1, 0).cross(rel);
  if (tang.lengthSq() < 1e-12) tang = new THREE.Vector3(1, 0, 0).cross(rel);
  tang.normalize().multiplyScalar(speed);
  return tang.add(primary.v);
}

function bindInput() {
  const c = canvasEl;
  c.addEventListener('contextmenu', e => e.preventDefault());

  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId);
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.pointers.size === 2) {
      const p = [...input.pointers.values()];
      input.mode = 'pinch';
      input.pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      input.pinchX = (p[0].x + p[1].x) / 2;
      input.pinchY = (p[0].y + p[1].y) / 2;
      hideAim();
      return;
    }
    if (input.pointers.size > 2) return;

    input.x0 = input.x = e.clientX;
    input.y0 = input.y = e.clientY;
    input.moved = false;

    if (input.armed && e.button === 0 && !e.shiftKey) {
      input.mode = 'place';
      input.placePos = screenToWorld(e.clientX, e.clientY);
    } else if (e.button === 2 || e.button === 1 || e.shiftKey) {
      input.mode = 'pan';
    } else {
      input.mode = 'orbit';
    }
  });

  c.addEventListener('pointermove', (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.mode === 'pinch' && input.pointers.size >= 2) {
      const p = [...input.pointers.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (input.pinchD > 0) view.dist *= clamp(input.pinchD / Math.max(d, 1), 0.4, 2.5);
      panBy(mx - input.pinchX, my - input.pinchY);
      input.pinchD = d; input.pinchX = mx; input.pinchY = my;
      return;
    }

    const dx = e.clientX - input.x, dy = e.clientY - input.y;
    input.x = e.clientX; input.y = e.clientY;
    if (Math.hypot(e.clientX - input.x0, e.clientY - input.y0) > 5) input.moved = true;

    if (input.mode === 'orbit') {
      view.yaw -= dx * 0.005;
      view.pitch += dy * 0.005;
    } else if (input.mode === 'pan') {
      panBy(dx, dy);
      sim.follow = null;
    } else if (input.mode === 'place') {
      drawAim();
    }
  });

  const finish = (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.delete(e.pointerId);

    if (input.mode === 'place') {
      dropArmed();
      hideAim();
    } else if (input.mode === 'orbit' && !input.moved) {
      select(pickBody(e.clientX, e.clientY));
    }
    if (input.pointers.size === 0) input.mode = null;
    else if (input.pointers.size === 1) {
      const p = [...input.pointers.values()][0];
      input.mode = 'orbit'; input.x = p.x; input.y = p.y; input.moved = true;
    }
  };
  c.addEventListener('pointerup', finish);
  c.addEventListener('pointercancel', finish);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.dist *= Math.pow(1.0016, e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY);
  }, { passive: false });

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
}

function panBy(dx, dy) {
  const wpp = worldPerPixel(view.dist);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  view.target.addScaledVector(right, -dx * wpp).addScaledVector(up, dy * wpp);
}

/* ------------------------------------------------------------- aim overlay  */

function velocityFromDrag() {
  const pos = input.placePos;
  const primary = dominantAt(pos, null);
  let vRef;
  if (primary) {
    const d = Math.max(primary.p.distanceTo(pos), 1e-9);
    vRef = Math.sqrt(G * settings.gravity * primary.m / d);
  } else {
    vRef = 2.592;                                     // ~30 km/s, a homely orbital speed
  }
  const dx = input.x - input.x0, dy = input.y - input.y0;
  const px = Math.hypot(dx, dy);
  if (px < 6) {
    // A tap with no drag: give it a circular orbit if that makes sense.
    if (settings.autoOrbit && primary && primary.m > 0.01) return circularVelocity(primary, pos);
    return primary ? primary.v.clone() : new THREE.Vector3();
  }
  // 120 px of drag ≈ one local circular-orbit speed, measured relative to the
  // dominant body so a moon dropped beside a moving planet keeps up with it
  const world = screenToWorld(input.x, input.y).sub(pos);
  const scale = vRef / (120 * worldPerPixel(view.dist));
  const v = world.multiplyScalar(scale);
  return primary ? v.add(primary.v) : v;
}

function drawAim() {
  $('an-aim').style.display = 'block';
  const l = $('an-aim-line'), d = $('an-aim-dot'), t = $('an-aim-txt');
  l.setAttribute('x1', input.x0); l.setAttribute('y1', input.y0);
  l.setAttribute('x2', input.x); l.setAttribute('y2', input.y);
  d.setAttribute('cx', input.x0); d.setAttribute('cy', input.y0);
  const v = velocityFromDrag();
  t.setAttribute('x', input.x + 12);
  t.setAttribute('y', input.y - 8);
  t.textContent = fmtSpeed(v.length());
}

function hideAim() { $('an-aim').style.display = 'none'; }

function dropArmed() {
  if (!input.armed || !input.placePos) return;
  if (sim.bodies.length >= MAX_BODIES) { toast('Universe is full — clear some bodies'); return; }
  const vel = velocityFromDrag();
  const b = makeBody(input.armed, input.placePos, vel);
  select(b);
  if (!sim.running && sim.bodies.length > 1) toast('Press ▶ to start time');
}

/* ---------------------------------------------------------------- keyboard  */

function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case ',': case '<': changeRate(-1); break;
    case '.': case '>': changeRate(1); break;
    case 'f': case 'F':
      if (sim.selected) { sim.follow = sim.follow === sim.selected ? null : sim.selected; renderInspector(); }
      break;
    case 'Delete': case 'Backspace':
      if (sim.selected && sim.selected.kind === 'snr') {
        const e = sim.selected;
        disperseCloud(e);
        e.alive = false;
        disposeSN(e);
        const i = supernovae.indexOf(e);
        if (i >= 0) supernovae.splice(i, 1);
        select(null);
      } else if (sim.selected) {
        const b = sim.selected; select(null); removeBody(b); compact();
      }
      break;
    case 'Escape': arm(null); closeModal(); break;
    case 't': case 'T': settings.trails = !settings.trails; clearTrails(); syncSettings(); break;
    case 'l': case 'L': settings.labels = !settings.labels; syncSettings(); break;
  }
}

/* ====================================================================== UI  */

let toastTimer = 0;
function toast(msg) {
  const el = $('an-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

function buildPalette() {
  const host = $('an-palette-list');
  let html = '';
  for (const g of GROUPS) {
    html += '<div class="an-group">' + g + '</div>';
    for (const key in TYPES) {
      if (TYPES[key].group !== g) continue;
      const t = TYPES[key];
      const cls = t.kind === 'bh' ? ' hole' : t.rings ? ' ring' : '';
      html += '<button class="an-item" data-type="' + key + '" title="' + t.blurb.replace(/"/g, '&quot;') + '">' +
        '<span class="an-dot' + cls + '" style="background:' + SWATCH[key] + ';color:' + SWATCH[key] + '"></span>' +
        '<span>' + t.label + '</span></button>';
    }
  }
  host.innerHTML = html;
  host.addEventListener('click', (e) => {
    const btn = e.target.closest('.an-item');
    if (!btn) return;
    arm(input.armed === btn.dataset.type ? null : btn.dataset.type);
  });
}

function arm(type) {
  input.armed = type;
  for (const el of document.querySelectorAll('.an-item')) el.classList.toggle('armed', el.dataset.type === type);
  $('an-armed-lbl').textContent = type ? 'ARMED' : '';
  updateHint();
}

function updateHint() {
  const el = $('an-hint');
  let s;
  if (input.armed) {
    s = 'Click empty space to drop <b>' + TYPES[input.armed].label + '</b> &middot; <b>drag</b> to aim its speed';
  } else if (sim.selected) {
    s = '<kbd>F</kbd> follow &middot; <kbd>Del</kbd> remove &middot; drag to orbit &middot; scroll to zoom';
  } else {
    s = 'Pick something from <b>Add Body</b>, then click space to place it &middot; <kbd>Space</kbd> starts time';
  }
  el.innerHTML = s;
}

/* ---------------------------------------------------------------- inspector */

let inspRefs = null;

function select(b) {
  sim.selected = b && b.alive ? b : null;
  renderInspector();
  updateHint();
  if (window.innerWidth <= 700 && sim.selected) showPanel('inspector');
}

/**
 * The fate block on a star's panel: the button when it can explode, and a
 * plain-language reason when it cannot. Body names reach this through
 * plan.why, so everything here goes through the escaper.
 */
function snPanelHTML(plan) {
  const head = '<div class="an-sec">FATE</div>';
  if (!plan.ok) return head + '<p class="an-note">' + escAttr(plan.why) + '</p>';
  return head +
    '<p class="an-note"><b>' + escAttr(plan.label) + '</b> — ' + escAttr(plan.story) + '</p>' +
    '<div class="an-row"><button id="is-sn" class="an-danger">GO SUPERNOVA</button></div>';
}

/**
 * The panel for a selected remnant cloud. The one control is core temperature,
 * because in a collapsing cloud temperature and size are the same fact seen
 * twice: squeeze it and the middle gets hotter, and at ten million kelvin
 * hydrogen starts fusing whether you meant it to or not.
 */
function renderCloudInspector(e) {
  const host = $('an-insp-body');
  const c = e.cloud || { mass: 0, n: 0, radius: 0 };
  $('an-insp-h').textContent = 'REMNANT CLOUD';

  host.innerHTML =
    '<div class="an-name-in" style="cursor:default;pointer-events:none">' + escAttr(e.label + ' remnant') + '</div>' +
    '<div class="an-type">from ' + escAttr(e.origin) + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Gas &amp; dust</dt><dd id="is-cmass"></dd>' +
    '<dt>Pieces</dt><dd id="is-cn"></dd>' +
    '<dt>Radius</dt><dd id="is-crad"></dd>' +
    '<dt>Expanding at</dt><dd id="is-cvel"></dd>' +
    '<dt>Age</dt><dd id="is-cage"></dd>' +
    '<dt>Still glowing</dt><dd id="is-clum"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Core temperature <b id="is-ctv"></b></label>' +
    '<input type="range" id="is-ctemp" min="1" max="7" step="0.01" value="' +
    Math.log10(clamp(e.coreT, 10, IGNITE_T)).toFixed(3) + '"></div>' +
    '<p class="an-note">Squeezing a cloud heats its middle — halve the radius and you double the ' +
    'core temperature. Drag this all the way to <b>10 million K</b> and hydrogen fusion starts.</p>' +
    '<div class="an-sec">WHAT IT WOULD MAKE</div>' +
    '<p class="an-note" id="is-cfore"></p>' +
    '<div class="an-row"><button id="is-collapse">COLLAPSE NOW</button></div>' +
    '<div class="an-row"><button id="is-cfollow">' + (sim.follow === e ? 'UNFOLLOW' : 'FOLLOW') +
    '</button><button id="is-czoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-cdisperse" class="an-danger">DISPERSE</button></div>' +
    '<p class="an-note" style="margin-top:13px">This is where the next generation of stars comes ' +
    'from. Our own Solar System is thought to have condensed out of a cloud like this one — the ' +
    'oldest meteorites still carry the decay products of supernova iron.</p>';

  inspRefs = {
    cmass: $('is-cmass'), cn: $('is-cn'), crad: $('is-crad'), cvel: $('is-cvel'),
    cage: $('is-cage'), clum: $('is-clum'), ctv: $('is-ctv'), cfore: $('is-cfore')
  };

  const temp = $('is-ctemp');
  temp.addEventListener('input', () => {
    const cur = sim.selected;
    if (!cur || cur.kind !== 'snr' || !cur.alive) return;
    inspectorLock++;
    const lit = setCloudTemp(cur, Math.pow(10, parseFloat(temp.value)));
    inspectorLock--;
    if (lit) { condenseCloud(cur); return; }
    // A hundredfold squeeze would otherwise shrink the thing you are working on
    // to a sub-pixel dot long before it ignites, so close in as it collapses —
    // but only once it has actually got small on screen.
    if (apparentPx(cur) < VIEW.h * 0.16) frameOn(cur, 2.8);
    updateInspectorStats();
  });
  temp.addEventListener('change', () => renderInspector());

  $('is-collapse').addEventListener('click', () => { if (e.alive) condenseCloud(e); });
  $('is-cfollow').addEventListener('click', () => {
    sim.follow = sim.follow === e ? null : e;
    renderInspector();
  });
  $('is-czoom').addEventListener('click', () => { frameOn(e, 2.6); sim.follow = e; renderInspector(); });
  $('is-cdisperse').addEventListener('click', () => {
    disperseCloud(e);
    e.alive = false;
    disposeSN(e);
    const i = supernovae.indexOf(e);
    if (i >= 0) supernovae.splice(i, 1);
    select(null);
    toast('Cloud dispersed');
  });

  updateInspectorStats();
}

function renderInspector() {
  const host = $('an-insp-body');
  const b = sim.selected;
  inspRefs = null;
  if (!b || !b.alive) {
    $('an-insp-h').textContent = 'SELECTED';
    host.innerHTML = '<div class="an-empty">Nothing selected.<br><br>Tap a body to inspect it, or pick something from <b>Add Body</b> to build.</div>';
    return;
  }
  if (b.kind === 'snr') { renderCloudInspector(b); return; }
  const def = TYPES[b.type];
  $('an-insp-h').textContent = 'SELECTED';
  // A rocky world's range has to reach past the gas-giant threshold, or the
  // slider could never trigger it. The range is also widened to contain the
  // body's actual mass, otherwise setting `value` would silently clamp it and
  // the readout would disagree with the physics.
  const lm = Math.log10(Math.max(b.m, 1e-12));
  const topMass = isRocky(b) ? Math.max(def.mass * 120, GAS_THRESHOLD * 2.5) : def.mass * 80;
  const massMin = Math.min(Math.log10(Math.max(def.mass * 0.02, 1e-11)), lm);
  const massMax = Math.max(Math.log10(topMass), lm);

  // Stars get a fate readout: what this one would do if its core gave way now,
  // or exactly what is missing if it could not.
  const isStar = def.star && b.kind === 'body';
  const plan = isStar ? snPlan(b) : null;

  host.innerHTML =
    '<input class="an-name-in" id="is-name" maxlength="24" spellcheck="false"' +
    ' title="Click to rename" aria-label="Body name" value="' + escAttr(b.name) + '">' +
    '<div class="an-type" id="is-typelbl">' + def.label + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Mass</dt><dd id="is-mass"></dd>' +
    '<dt>Radius</dt><dd id="is-rad"></dd>' +
    '<dt>Density</dt><dd id="is-den"></dd>' +
    '<dt>Speed</dt><dd id="is-spd"></dd>' +
    '<dt>Surface temp</dt><dd id="is-tmp"></dd>' +
    (isStar ? '<dt>Luminosity</dt><dd id="is-lum"></dd>' : '') +
    (isStar && snSet.aging ? '<dt>Fuel burned</dt><dd id="is-age"></dd>' : '') +
    '<dt id="is-orb-l">Orbiting</dt><dd id="is-orb"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Mass <b id="is-mval"></b></label>' +
    '<input type="range" id="is-mslider" min="' + massMin.toFixed(3) + '" max="' + massMax.toFixed(3) + '" step="0.001" value="' + Math.log10(b.m).toFixed(3) + '"></div>' +
    (isStar && snSet.on ? snPanelHTML(plan) : '') +
    '<div class="an-row"><button id="is-follow">' + (sim.follow === b ? 'UNFOLLOW' : 'FOLLOW') + '</button><button id="is-zoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-shatter" class="an-danger">SHATTER</button><button id="is-del" class="an-danger">REMOVE</button></div>' +
    '<p style="font-size:11px;line-height:1.55;color:var(--ink-dim);margin-top:13px">' + def.blurb + '</p>';

  inspRefs = {
    mass: $('is-mass'), rad: $('is-rad'), den: $('is-den'), spd: $('is-spd'),
    tmp: $('is-tmp'), orb: $('is-orb'), orbL: $('is-orb-l'), mval: $('is-mval'),
    lum: $('is-lum'), age: $('is-age')
  };

  const snBtn = $('is-sn');
  if (snBtn) {
    snBtn.addEventListener('click', () => {
      const name = b.name;
      const p = goSupernova(b);
      if (p) { toast(name + ' went ' + p.label + '!'); renderInspector(); }
    });
  }

  const nameIn = $('is-name');
  nameIn.addEventListener('change', () => { nameIn.value = renameBody(b, nameIn.value); });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); });

  const slider = $('is-mslider');
  slider.addEventListener('input', () => {
    const nb = sim.selected;
    if (!nb) return;
    nb.m = Math.pow(10, parseFloat(slider.value));
    nb.r = trueRadius(nb.type, nb.m);
    // Rebuilding the panel mid-drag would kill the drag, so on transformation
    // just patch the type label in place; the full refresh waits for release.
    inspectorLock++;
    const ev = checkEvolution(nb);
    inspectorLock--;
    if (ev) {
      const lbl = $('is-typelbl');
      if (lbl) lbl.textContent = TYPES[nb.type].label;
      toast(nb.name + EVOLVE_NOTE[ev]);
    } else {
      updateLuminosity(nb);
      scaleVisual(nb);
    }
    updateInspectorStats();
  });
  // Released: now it is safe to rebuild, picking up the new type's slider range
  // — or the empty panel, if what was here just detonated.
  slider.addEventListener('change', () => renderInspector());
  $('is-follow').addEventListener('click', () => {
    sim.follow = sim.follow === b ? null : b;
    renderInspector();
  });
  $('is-zoom').addEventListener('click', () => { frameOn(b, 9); sim.follow = b; renderInspector(); });
  $('is-shatter').addEventListener('click', () => shatterBody(b));
  $('is-del').addEventListener('click', () => { select(null); removeBody(b); compact(); });

  updateInspectorStats();
}

function updateInspectorStats() {
  const b = sim.selected;
  if (!b || !b.alive || !inspRefs) return;

  if (b.kind === 'snr') {
    const c = b.cloud || { mass: 0, n: 0, radius: 0 };
    inspRefs.cmass.textContent = fmtMass(c.mass);
    inspRefs.cn.textContent = c.n.toLocaleString();
    inspRefs.crad.textContent = fmtDist(Math.max(c.radius, b.radius));
    inspRefs.cvel.textContent = fmtKms(b.vBulk);
    inspRefs.cage.textContent = b.age < 730
      ? Math.round(b.age).toLocaleString() + ' days'
      : (b.age / 365.25).toPrecision(3) + ' years';
    inspRefs.clum.textContent = b.lum > 0.01 ? fmtLum(b.lum) : 'gone dark';
    inspRefs.ctv.textContent = b.coreT >= 1e6
      ? (b.coreT / 1e6).toPrecision(3) + ' million K'
      : Math.round(b.coreT).toLocaleString() + ' K';
    inspRefs.cfore.textContent = cloudForecast(c.mass);
    return;
  }

  inspRefs.mass.textContent = fmtMass(b.m);
  inspRefs.rad.textContent = b.kind === 'bh' ? fmtRadius(b.r) + ' (horizon)' : fmtRadius(b.r);
  inspRefs.den.textContent = b.kind === 'bh' ? '—' : fmtDensity(b.m, b.r);
  inspRefs.spd.textContent = fmtSpeed(b.v.length());
  inspRefs.tmp.textContent = b.kind === 'bh' ? '—' : Math.round(b.temp).toLocaleString() + ' K';
  inspRefs.mval.textContent = fmtMass(b.m);
  if (inspRefs.lum) inspRefs.lum.textContent = fmtLum(b.lum);
  if (inspRefs.age) {
    const life = msLifetime(b.m / M_SUN);
    inspRefs.age.textContent = life > 0
      ? clamp(b.age / life * 100, 0, 100).toFixed(1) + '%' : '—';
  }

  const prim = dominantAt(b.p, b);
  if (prim && prim.m > b.m * 3) {
    inspRefs.orbL.textContent = 'Distance to ' + prim.name;
    inspRefs.orb.textContent = fmtDist(b.p.distanceTo(prim.p));
  } else {
    inspRefs.orbL.textContent = 'Orbiting';
    inspRefs.orb.textContent = '—';
  }
}

/* ------------------------------------------------------------ time controls */

const RATES = [0.02, 0.1, 0.5, 1, 4, 16, 64, 256, 1024, 4096];
let rateIdx = 3;

function togglePlay() {
  sim.running = !sim.running;
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  if (sim.running) computeAccel();
}

function changeRate(d) {
  rateIdx = clamp(rateIdx + d, 0, RATES.length - 1);
  sim.rate = RATES[rateIdx];
  syncRate();
}

function syncRate() {
  const r = sim.rate;
  if (r >= 365) {
    $('an-rate-val').textContent = (r / 365.25).toPrecision(3).replace(/\.?0+$/, '');
    $('an-rate-unit').textContent = 'years / sec';
  } else {
    $('an-rate-val').textContent = r < 1 ? r.toString() : Math.round(r).toString();
    $('an-rate-unit').textContent = 'days / sec';
  }
}

    return sliders[key];
  };

  // Keep the three collapse thresholds in a sensible order however they are
  // dragged, or the fate rules would silently contradict each other.
  const order = () => {
    snSet.bhMass = Math.max(snSet.bhMass, snSet.ccMass);
    snSet.failMass = Math.max(snSet.failMass, snSet.bhMass);

      + 'Type II peaks near ' + fmtLum(peakLum(0.062 * snSet.nickel, 8, 2.0e42, 100))
      + ' and a Type Ia near ' + fmtLum(peakLum(0.6 * snSet.nickel, 14, 0, 0)) + '.';

  };

}

function tgl(id, label, sub) {
  return '<div class="an-toggle"><div>' + label + (sub ? '<small>' + sub + '</small>' : '') +
    '</div><div class="an-sw" id="' + id + '"></div></div>';
}

function bindTgl(id, key, after, obj) {
  const store = obj || settings;
  const el = $(id);
  el.classList.toggle('on', !!store[key]);
  el.addEventListener('click', () => {
    store[key] = !store[key];
    el.classList.toggle('on', store[key]);
    if (after) after();
  });
}

/** A labelled range with a live value readout beside the label. */
function sld(id, label, min, max, step, value) {
  return '<div class="an-field"><label>' + label + ' <b id="' + id + '-v"></b></label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + value + '"></div>';
}

/**
 * Wire one up. `after` runs before the readout refreshes (used to keep coupled
 * sliders consistent), `onChange` after it (used to recompute the explanatory
 * notes); both are assigned onto the returned handle, so they can be set up
 * once every slider in a group exists.
 */
function bindSld(id, fmt, apply, onRelease) {
  const el = $(id), out = $(id + '-v');
  const ref = {
    el: el, after: null, onChange: null,
    show() { out.textContent = fmt(parseFloat(el.value)); },
    set(v) { el.value = v; ref.show(); }
  };
  el.addEventListener('input', () => {
    apply(parseFloat(el.value));
    if (ref.after) ref.after();
    ref.show();
    if (ref.onChange) ref.onChange();
  });
  if (onRelease) el.addEventListener('change', onRelease);
  ref.show();
  return ref;
}

/* ---- readouts that turn the supernova numbers into something picturable --- */

/** ⟨x⟩/√⟨x²⟩ for the velocity spectrum blastShell draws from. */
const EJ_SHAPE = 0.8471;

const ejectaSpeed = (foe, massMe) =>
  Math.sqrt(2 * foe * FOE / Math.max(massMe, 1e-9)) * EJ_SHAPE;

/* Ejecta speeds run to thousands of km/s, where fmtSpeed switches to a
   percentage of light speed — true, but far less readable than the number
   astronomers actually quote. */
const fmtKms = (gmPerDay) => Math.round(gmPerDay * 1e9 / 86400 / 1000).toLocaleString() + ' km/s';

/** Sustained peak of the light curve, ignoring the few-hour breakout spike. */
function peakLum(ni, rise, plateau, tPlat) {
  const e = { age: 0, ni: ni, rise: rise, plateau: plateau, tPlat: tPlat, breakout: 0 };
  let best = 0;
  for (let t = 0.5; t <= 220; t += 0.5) { e.age = t; best = Math.max(best, snLuminosity(e)); }
  return best;
}

function fmtErg(foe) {
  const e = Math.floor(Math.log10(Math.max(foe, 1e-9))) + 51;
  return (foe / Math.pow(10, e - 51)).toFixed(2) + '×10' + sup(e) + ' erg';
}

function fmtYears(days) {
  const y = days / 365.25;
  if (y >= 1e6) return (y / 1e6).toPrecision(3) + ' million years';
  if (y >= 1000) return Math.round(y).toLocaleString() + ' years';
  if (y >= 1) return y.toPrecision(3) + ' years';
  return Math.max(Math.round(days), 0).toLocaleString() + ' days';
}

function syncSettings() {
  const map = { 'st-tidal': 'tidal', 'st-auto': 'autoOrbit', 'st-trails': 'trails', 'st-labels': 'labels', 'st-lens': 'lensing' };
  for (const id in map) { const el = $(id); if (el) el.classList.toggle('on', !!settings[map[id]]); }
}

function openModal() {
  $('an-modal').classList.add('show');
  document.body.classList.add('modal-open');
}

function closeModal() {
  $('an-modal').classList.remove('show');
  document.body.classList.remove('modal-open');
}

/* Resolved in boot(), not at parse time, so a failed three.js load still
   reaches the friendly error screen instead of throwing here. */
let V3 = null;

/**
 * Put a body on a Keplerian orbit around `primary`. It starts at apoapsis, so
 * the velocity is purely tangential: v = sqrt(mu · (2/r − 1/a)).
 */
function orbitBody(type, primary, a, opts) {
  const o = opts || {};
  const ang = o.ang != null ? o.ang : Math.random() * TAU;
  const ecc = o.ecc || 0;
  const r0 = a * (1 + ecc);
  const dir = new V3(Math.cos(ang), 0, Math.sin(ang));
  const tan = new V3(-Math.sin(ang), 0, Math.cos(ang));
  if (o.inc) tan.applyAxisAngle(dir, o.inc);          // tilt at the node
  const mu = G * settings.gravity * primary.m;
  const speed = Math.sqrt(Math.max(mu * (2 / r0 - 1 / a), 0)) * (o.retro ? -1 : 1);
  return makeBody(type,
    primary.p.clone().addScaledVector(dir, r0),
    primary.v.clone().addScaledVector(tan, speed),
    o.over);
}

/** Two bodies in a mutual circular orbit about their shared barycentre. */
function binaryPair(typeA, mA, typeB, mB, sep, center) {
  const c = center || new V3();
  const tot = mA + mB;
  const mu = G * settings.gravity * tot;
  const vRel = Math.sqrt(mu / sep);
  const a = makeBody(typeA, new V3(-sep * mB / tot, 0, 0).add(c), new V3(0, 0, -vRel * mB / tot), { mass: mA });
  const b = makeBody(typeB, new V3(sep * mA / tot, 0, 0).add(c), new V3(0, 0, vRel * mA / tot), { mass: mB });
  return [a, b];
}

  PRESETS.forEach((p, i) => {
    html += '<button class="an-preset" data-i="' + i + '"><b>' + p.name + '</b><span>' + p.desc + '</span></button>';
  });
  html += '</div>';
  $('an-modal-body').innerHTML = html;
  $('an-modal-body').querySelectorAll('.an-preset').forEach(btn => {
    btn.addEventListener('click', () => { loadPreset(PRESETS[+btn.dataset.i]); closeModal(); });

function clearAll() {
  for (const b of sim.bodies) { disposeVisual(b); }
  sim.bodies.length = 0;
  clearParticles();
  clearSupernovae();
  grewBodies.clear();
  pSources = [];
  usedNames.clear();
  sim.time = 0;
  sim.selected = null;
  sim.follow = null;
  renderInspector();
  toast('Universe cleared');
}

function loadPreset(p) {
  clearAll();
  sim.running = false;
  p.build();
  view.target.set(0, 0, 0);
  view.dist = p.dist;
  view.yaw = 0.75;
  view.pitch = 0.46;
  computeAccel();
  clearTrails();
  refreshStarCache();
  updateTemperatures();
  $('an-play').innerHTML = sim.running ? '&#10074;&#10074;' : '&#9654;';
  $('an-hud-bodies').textContent = sim.bodies.length;
  toast(p.name);
}

const SAVE_KEY = 'astronomia.save.v1';

function saveUniverse() {
  try {
    const data = {
      t: sim.time, settings: settings, sn: snSet, rateIdx: rateIdx,
      cam: { t: view.target.toArray(), d: view.dist, y: view.yaw, p: view.pitch },
      bodies: sim.bodies.map(b => ({
        ty: b.type, n: b.name, m: b.m, r: b.r, s: b.seed, sp: b.spin, ti: b.tilt, ag: b.age,
        p: [b.p.x, b.p.y, b.p.z], v: [b.v.x, b.v.y, b.v.z]
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Universe saved (' + data.bodies.length + ' bodies)');
  } catch (e) {
    toast('Could not save — storage unavailable');
  }
}

function loadUniverse() {
  let data;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('No saved universe yet'); return; }
    data = JSON.parse(raw);
  } catch (e) { toast('Saved universe is unreadable'); return; }

  clearAll();
  for (const k in data.settings) if (k in settings) settings[k] = data.settings[k];
  // Key-by-key, so a save written before a setting existed still loads and just
  // keeps today's default for it.
  for (const k in (data.sn || {})) if (k in snSet) snSet[k] = data.sn[k];
  sim.time = data.t || 0;
  for (const s of data.bodies || []) {
    if (!TYPES[s.ty]) continue;
    makeBody(s.ty, new V3().fromArray(s.p), new V3().fromArray(s.v),
      { mass: s.m, r: s.r, name: s.n, seed: s.s, spin: s.sp, tilt: s.ti, age: s.ag });
  }
  if (data.cam) {
    view.target.fromArray(data.cam.t);
    view.dist = data.cam.d; view.yaw = data.cam.y; view.pitch = data.cam.p;
  }
  if (data.rateIdx != null) { rateIdx = data.rateIdx; sim.rate = RATES[rateIdx]; syncRate(); }
  computeAccel();
  clearTrails();
  closeModal();
  toast('Universe loaded (' + sim.bodies.length + ' bodies)');
}

/* ===================================================================== help */

function openHelp() {
  $('an-modal-title').textContent = 'How to play';
  $('an-modal-body').innerHTML =
    '<div class="an-help">' +
    '<h3>BUILDING</h3>' +
    '<ul>' +
    '<li>Pick anything from <b>Add Body</b> on the left, then <b>click empty space</b> to drop it there.</li>' +
    '<li><b>Drag</b> while placing to aim it — the longer the drag, the faster it flies. About 120 pixels of drag equals one circular orbit speed at that spot.</li>' +
    '<li>Just click without dragging and <b>Auto-orbit</b> gives it a clean circular orbit around whatever dominates nearby.</li>' +
    '<li><b>Click a body</b> to select it. The panel on the right shows its real mass, density, speed and temperature, and lets you resize it.</li>' +

    '<div><kbd>Del</kbd></div><span>Remove the selected body</span>' +
    '<div><kbd>T</kbd> <kbd>L</kbd></div><span>Toggle trails / labels</span>' +
    '</div>' +
    '<p style="margin-top:8px">On a touch screen: one finger rotates, two fingers pinch to zoom and drag to pan.</p>' +
    '<h3>WHAT THE PHYSICS ACTUALLY DOES</h3>' +
    '<ul>' +
    '<li>Every body pulls on every other one with real Newtonian gravity, stepped with a leapfrog integrator that keeps orbits stable for thousands of years.</li>' +
    '<li>Masses, radii and distances are in real units — Earth masses, Earth radii and millions of kilometres. Drop Earth 149.6 million km from a Sun-like star and its year comes out at 365 days.</li>' +
    '<li><b>Slow collisions merge</b> and conserve momentum. <b>Fast ones shatter</b> both bodies into rubble — the test is impact speed against the pair\'s escape velocity.</li>' +
    '<li>The debris thrown out by an impact is <b>real matter, not sparks</b>. Every grain carries mass and is pulled along by the same gravity as the planets, so it orbits, rains back down, settles into rings, or is swallowed by a black hole — and whatever eats it genuinely gets heavier. The counter at the bottom left shows bodies plus live debris.</li>' +
    '<li>Feed a <b>rocky</b> world past <b>60.1 Earth masses</b> and its gravity can finally hold onto hydrogen: it flares up and swells into a <b>gas giant</b>, roughly doubling in width as dense rock gives way to light gas. Worlds that are already gassy skip this and just keep growing.</li>' +
    '<li>Pile up more than 8% of the Sun\'s mass and the body <b>ignites into a star</b>. The full ladder is rock → gas giant → star → supernova → neutron star or black hole.</li>' +
    '<li>Stray inside a planet\'s <b>Roche limit</b> and tides tear the moon into a ring, exactly as they did at Saturn.</li>' +
    '<li>Surface temperatures come from the real starlight falling on each world, so worlds glow when they roast and frost over when they don\'t.</li>' +
    '</ul>' +
    '<h3>SUPERNOVAE</h3>' +
    '<ul>' +
    '<li>Select any star and the panel tells you <b>exactly how it will die</b> — and gives you a <b>GO SUPERNOVA</b> button if it can. If it can\'t, it says why, which is usually "not heavy enough yet".</li>' +
    '<li>A <b>white dwarf</b> that accretes past the <b>Chandrasekhar limit</b> of 1.44 solar masses detonates on its own, no button needed. That is a <b>Type Ia</b>, and because they all go off at the same mass they all reach the same brightness — which is how astronomers measure distances across the universe.</li>' +
    '<li>A star over about <b>8 solar masses</b> collapses its iron core in roughly a second and rebounds. That is a <b>Type II</b>. Above 20 solar masses the remnant is a black hole; below it, a <b>neutron star</b> — which gets fired off at hundreds of km/s, because the explosion is never symmetric.</li>' +
    '<li>Over about <b>40 solar masses</b> the core falls straight through and swallows its own shock wave. The star just <b>winks out</b>. We have genuinely watched this happen to a real star.</li>' +

    '<li>The <b>blast wave</b> is real too. A body intercepts the share of the shell its own disc covers, takes that much momentum and energy, and is destroyed if it got more than gravity holds it together with. At one AU that is about two hundred times what it takes to unbind the Earth.</li>' +
    '<li>Turn on <b>Stellar aging</b> in Settings and stars burn their fuel and die on their own. A star lives 10 billion years divided by (its mass)^2.5, so the Sun gets ten billion years and a twenty-solar-mass star gets six million. Light stars end by puffing off a <b>planetary nebula</b> and settling down as a white dwarf.</li>' +
    '<li>Every number in that whole list is a slider in <b>Settings ▸ Supernovae</b>, starting at its real measured value, with a RESET that puts them all back.</li>' +
    '</ul>' +
    '<h3>BUILDING A NEW STAR OUT OF THE WRECKAGE</h3>' +
    '<ul>' +
    '<li>What a supernova leaves behind is a few solar masses of enriched gas — and that is where the <b>next</b> generation of stars comes from. Our own Solar System is thought to have condensed out of a cloud like it, which is why the oldest meteorites still carry the decay products of supernova iron.</li>' +
    '<li><b>Click the cloud</b> once the flash has faded and it selects like anything else. The panel shows how much gas and dust is genuinely still there — not the amount thrown, the amount that has not yet been swallowed, absorbed or blown out of the system.</li>' +
    '<li>Drag <b>Core temperature</b> and the cloud squeezes. That link is the virial theorem: a self-gravitating ball has kT ≈ GMμ/R, so halving the radius doubles the temperature in the middle. It is why protostars go on getting hotter all the way down.</li>' +
    '<li>Reach <b>10 million kelvin</b> and hydrogen fuses. The cloud collapses into a star weighing exactly what the gas weighed, drifting exactly as the gas drifted, and the leftover couple of percent flattens into a disc and accretes into planets.</li>' +
    '<li>The planets orbit in <b>the plane the cloud was already spinning in</b>, taken from its real angular momentum. That is why every planet in a real system goes round the same way in nearly the same plane — they all inherit the spin of one cloud.</li>' +
    '<li>Rock forms inside the <b>snow line</b> and ice and giants outside it — 2.7 AU in our own nebula, further out around a brighter star, because that is where water ice can survive.</li>' +
    '<li>Not every cloud makes a star. Under <b>0.075 solar masses</b> — about eighty Jupiters — hydrogen never catches and you get a brown dwarf instead, glowing on its own contraction and slowly fading. The panel tells you which you are about to get before you commit.</li>' +

    '<h3>TWO HONEST FUDGES</h3>' +
    '<ul>' +
    '<li>Planets are drawn <b>larger than life</b> (see Settings) because at true scale they would be invisible specks. They collide at the size you see.</li>' +
    '<li>Black holes are drawn far bigger than their real event horizons — a ten-solar-mass hole is only about 30 km across — and starlight does not dim with distance, or half your worlds would be pitch black.</li>' +
    '<li>Debris grains feel gravity from the heaviest bodies but not from <i>each other</i>. That is what makes thousands of them possible at once; it means a debris ring will not clump into moons on its own.</li>' +
    '</ul>' +
    '</div>';
  openModal();
}

/* ====================================================================== HUD */

let fpsAcc = 0, fpsCount = 0, fpsShown = 60, statTick = 0;

function updateHud(realDt) {
  fpsAcc += realDt; fpsCount++;
  if (fpsAcc > 0.5) {
    fpsShown = Math.round(fpsCount / fpsAcc);
    fpsAcc = 0; fpsCount = 0;
    $('an-hud-fps').textContent = fpsShown;
    $('an-hud-bodies').textContent = parts.live
      ? sim.bodies.length + ' + ' + parts.live
      : sim.bodies.length;

    // While something is exploding, the brightest thing in the sky is worth a
    // line of its own — that number is the whole point of a supernova.
    const snEl = $('an-hud-sn');
    let best = null;
    for (const e of supernovae) if (!best || e.lum > best.lum) best = e;
    if (best && best.lum > 1) {
      snEl.innerHTML = best.label.toUpperCase() + ' <b>' + fmtLum(best.lum) + '</b>';
      snEl.style.display = '';
    } else if (snEl.style.display !== 'none') {
      snEl.style.display = 'none';
    }
  }
  const yr = Math.floor(sim.time / 365.25);
  const dy = Math.floor(sim.time - yr * 365.25);
  $('an-clock').innerHTML = 'Y ' + yr.toLocaleString() + '<br>D ' + dy;
  $('an-scale-lbl').textContent = fmtDist(54 * worldPerPixel(view.dist));
}

function showPanel(which) {
  const pal = $('an-palette'), insp = $('an-inspector');
  pal.classList.toggle('hidden', which !== 'palette');
  insp.classList.toggle('hidden', which !== 'inspector');
  document.body.classList.toggle('panel-open', !!which);
}

/* ================================================================ main loop */

let lastFrame = 0;

function loop(now) {
  const realDt = Math.min((now - lastFrame) / 1000, 0.1) || 0;
  lastFrame = now;

  const t0 = sim.time;
  advance(realDt);
  const simDt = sim.time - t0;

  if (sim.follow) {
    if (sim.follow.alive) view.target.copy(sim.follow.p);
    else { sim.follow = null; renderInspector(); }
  }
  applyCamera();
  updateVisuals(realDt, simDt);
  renderFrame();
  updateHud(realDt);

  if (++statTick % 10 === 0) updateInspectorStats();
  requestAnimationFrame(loop);
}

/* ===================================================================== boot */

function fail(msg) {
  $('an-boot').innerHTML = '<div class="an-title">AstroNomia</div><div class="an-fail">' + msg + '</div>';
  $('an-boot').classList.remove('gone');
}

function boot() {
  if (typeof THREE === 'undefined') {
    fail('AstroNomia needs the three.js library, which could not be loaded.<br><br>Check your internet connection and reload.');
    return;
  }
  V3 = THREE.Vector3;
  try {
    initScene();
  } catch (e) {
    fail('This browser could not start WebGL, which AstroNomia needs to draw in 3D.<br><br>Try a different browser, or check that hardware acceleration is switched on.<br><br><small>' + (e && e.message ? e.message : e) + '</small>');
    return;
  }

  initLights();
  initLabels();
  buildPalette();
  bindInput();

  $('an-play').addEventListener('click', togglePlay);
  $('an-slower').addEventListener('click', () => changeRate(-1));
  $('an-faster').addEventListener('click', () => changeRate(1));
  $('an-btn-systems').addEventListener('click', openSystems);
  $('an-btn-settings').addEventListener('click', openSettings);
  $('an-btn-help').addEventListener('click', openHelp);
  $('an-modal-close').addEventListener('click', closeModal);
  $('an-modal').addEventListener('click', (e) => { if (e.target === $('an-modal')) closeModal(); });
  $('an-mob-add').addEventListener('click', () => {
    showPanel($('an-palette').classList.contains('hidden') ? 'palette' : null);
  });
  $('an-mob-insp').addEventListener('click', () => {
    showPanel($('an-inspector').classList.contains('hidden') ? 'inspector' : null);
  });

  sim.rate = RATES[rateIdx];
  syncRate();
  loadPreset(PRESETS[0]);
  updateHint();
  renderInspector();

  $('an-boot').classList.add('gone');
  setTimeout(() => { const b = $('an-boot'); if (b && b.classList.contains('gone')) b.style.display = 'none'; }, 700);

  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

boot();
</script>
