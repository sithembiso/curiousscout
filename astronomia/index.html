<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AstroNomia &mdash; Space Sandbox</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23090616'/%3E%3Ccircle cx='30' cy='30' r='13' fill='%23ff6fd8'/%3E%3Ccircle cx='25' cy='25' r='4' fill='%23ffc2f0' opacity='.6'/%3E%3Cellipse cx='30' cy='30' rx='24' ry='7' fill='none' stroke='%238be0ff' stroke-width='2.6' transform='rotate(-24 30 30)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #ff6fd8;
    --accent2: #8be0ff;
    --panel: rgba(16, 12, 38, 0.82);
    --panel-line: rgba(140, 120, 255, 0.28);
    --ink: #e9e9ff;
    --ink-dim: #a8a4d0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05040d;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #an-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  /* Soft vignette + scanlines to match the arcade */
  #an-vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.10) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center, transparent 52%, rgba(3,2,10,0.72) 100%);
  }

  /* ---------- shared panel chrome ---------- */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 13px;
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.6);
  }

  .panel-h {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    letter-spacing: 1.4px;
    color: var(--accent);
    text-shadow: 0 0 9px color-mix(in srgb, var(--accent) 70%, transparent);
    padding: 11px 12px 9px;
    border-bottom: 1px solid rgba(140,120,255,0.16);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }

  button, .btn {
    font-family: "Orbitron", sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--ink);
    background: rgba(58, 44, 110, 0.55);
    border: 1px solid rgba(150, 130, 255, 0.34);
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s, color .15s;
    white-space: nowrap;
  }
  button:hover, .btn:hover { background: rgba(90, 70, 165, 0.7); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.on { background: color-mix(in srgb, var(--accent) 30%, rgba(58,44,110,.6)); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }

  /* ---------- layout ---------- */
  #an-app { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #an-app > * { pointer-events: auto; }

  .an-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; align-items: flex-start; gap: 10px;
    pointer-events: none;
  }
  .an-top > * { pointer-events: auto; }

  .an-brand { display: flex; align-items: center; gap: 9px; }
  .an-back {
    display: grid; place-items: center;
    width: 34px; height: 34px;
    font-size: 13px; text-decoration: none; color: var(--ink);
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .an-back:hover { border-color: var(--accent); color: var(--accent); }

  .an-title {
    font-family: "Press Start 2P", monospace;
    font-size: 13px; letter-spacing: 1px; line-height: 1.5;
    background: linear-gradient(90deg, #ff6fd8, #b388ff, #8be0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(200,120,255,0.55));
  }
  .an-title span { font-size: 8px; color: var(--accent2); -webkit-text-fill-color: var(--accent2); }

  .an-time {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
  }
  .an-time button { min-width: 32px; text-align: center; padding: 7px 8px; }
  .an-rate { text-align: center; min-width: 86px; line-height: 1.25; }
  .an-rate b { display: block; font-family: "Orbitron", sans-serif; font-size: 13px; color: var(--accent2); }
  .an-rate span { font-size: 8.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-dim); }
  .an-clock {
    font-family: "Press Start 2P", monospace; font-size: 8px; letter-spacing: 1px;
    color: #ffd166; padding: 0 6px 0 10px; border-left: 1px solid rgba(140,120,255,0.2);
    min-width: 96px; text-align: center; line-height: 1.6;
  }

  .an-tools { margin-left: auto; display: flex; gap: 6px; padding: 6px; }

  /* ---------- palette (left) ---------- */
  .an-side {
    position: absolute; top: 62px; bottom: 58px;
    width: 214px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #an-palette { left: 10px; }
  #an-inspector { right: 10px; width: 232px; }

  .an-scroll { overflow-y: auto; overflow-x: hidden; padding: 8px; flex: 1; scrollbar-width: thin; }
  .an-scroll::-webkit-scrollbar { width: 7px; }
  .an-scroll::-webkit-scrollbar-thumb { background: rgba(150,130,255,0.32); border-radius: 4px; }

  .an-group { font-family: "Press Start 2P", monospace; font-size: 7px; letter-spacing: 1.2px;
    color: var(--ink-dim); margin: 12px 4px 6px; }
  .an-group:first-child { margin-top: 2px; }

  .an-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 6px 8px; margin-bottom: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; font-weight: 500; letter-spacing: 0;
    background: rgba(40, 30, 80, 0.4);
    border: 1px solid rgba(150, 130, 255, 0.16);
  }
  .an-item:hover { background: rgba(80, 62, 150, 0.6); }
  .an-item.armed {
    background: color-mix(in srgb, var(--accent) 26%, rgba(40,30,80,.5));
    border-color: var(--accent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .an-dot {
    width: 17px; height: 17px; border-radius: 50%; flex: none;
    box-shadow: 0 0 8px currentColor, inset -3px -3px 5px rgba(0,0,0,0.5);
  }
  .an-dot.ring::after {
    content: ""; display: block; position: relative; top: 6px; left: -6px;
    width: 29px; height: 5px; border: 1.6px solid currentColor; border-radius: 50%;
    transform: rotate(-20deg); opacity: .85;
  }
  .an-dot.hole { background: #07060f !important; border: 2px solid currentColor; }

  /* ---------- inspector (right) ---------- */
  .an-empty { padding: 18px 14px; font-size: 12px; line-height: 1.6; color: var(--ink-dim); text-align: center; }

  .an-name { font-family: "Orbitron", sans-serif; font-size: 15px; font-weight: 700; color: #fff; }

  /* The name doubles as a rename field, so it has to look clickable */
  .an-name-in {
    display: block; width: 100%;
    font-family: "Orbitron", sans-serif; font-size: 15px; font-weight: 700;
    color: #fff; background: transparent;
    border: 1px solid rgba(150,130,255,0.18); border-radius: 7px;
    padding: 4px 7px; margin: -4px 0 0 -7px;
    outline: none; cursor: text;
    transition: background .15s, border-color .15s;
  }
  .an-name-in:hover { background: rgba(150,130,255,0.12); border-color: rgba(150,130,255,0.4); }
  .an-name-in:focus {
    background: rgba(150,130,255,0.18); border-color: var(--accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .an-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); margin-top: 3px; }

  .an-stats { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 12px 0 4px; font-size: 11.5px; }
  .an-stats dt { color: var(--ink-dim); }
  .an-stats dd { text-align: right; font-family: "Orbitron", sans-serif; font-weight: 500; color: #dff3ff; }

  .an-field { margin: 11px 0 4px; }
  .an-field label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--ink-dim); margin-bottom: 5px;
  }
  .an-field label b { font-family: "Orbitron", sans-serif; font-size: 11px; color: var(--accent2); letter-spacing: 0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 3px; background: rgba(150,130,255,0.28);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid #14102c;
    box-shadow: 0 0 9px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; border: 2px solid #14102c;
    background: var(--accent); box-shadow: 0 0 9px var(--accent);
  }

  .an-row { display: flex; gap: 6px; margin-top: 10px; }
  .an-row button { flex: 1; padding: 8px 6px; font-size: 10px; }
  .an-danger { border-color: rgba(255,90,120,.5) !important; color: #ff9db0 !important; }
  .an-danger:hover { background: rgba(150,30,60,.55) !important; border-color: #ff5a78 !important; }

  .an-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 4px; font-size: 12px;
    border-bottom: 1px solid rgba(140,120,255,0.1);
  }
  .an-toggle:last-child { border-bottom: none; }
  .an-sec {
    font-family: "Press Start 2P", monospace; font-size: 7.5px; letter-spacing: 1.3px;
    color: var(--accent); margin: 18px 0 6px; padding-top: 12px;
    border-top: 1px solid rgba(140,120,255,0.2);
  }
  .an-note { font-size: 11px; line-height: 1.55; color: var(--ink-dim); margin: 0 0 4px; }
  .an-note b { color: #fff; }
  .an-toggle small { display: block; font-size: 10px; color: var(--ink-dim); margin-top: 2px; line-height: 1.4; }
  .an-sw {
    flex: none; width: 40px; height: 21px; border-radius: 11px; cursor: pointer;
    background: rgba(150,130,255,0.2); border: 1px solid rgba(150,130,255,0.3);
    position: relative; transition: background .18s, border-color .18s;
  }
  .an-sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%; background: #a49ecd;
    transition: transform .18s, background .18s;
  }
  .an-sw.on { background: color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .an-sw.on::after { transform: translateX(19px); background: #fff; box-shadow: 0 0 9px var(--accent); }

  /* ---------- bottom strip ---------- */
  .an-hud {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 11px;
    font-family: "Press Start 2P", monospace; font-size: 7.5px; letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .an-hud b { color: var(--accent2); }
  .an-scalebar { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .an-scalebar i { display: block; height: 5px; border: 1px solid var(--ink-dim); border-top: none; width: 54px; }

  .an-hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    max-width: min(560px, calc(100vw - 500px));
    padding: 9px 15px; text-align: center;
    font-size: 12px; line-height: 1.5; color: #d8d4ff;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 11px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s;
  }
  .an-hint kbd {
    font-family: "Orbitron", sans-serif; font-size: 10px; font-weight: 700;
    background: rgba(150,130,255,.22); border: 1px solid rgba(150,130,255,.4);
    border-radius: 5px; padding: 2px 6px; margin: 0 1px; color: #fff;
  }

  /* ---------- world labels ---------- */
  .an-label {
    position: absolute; top: 0; left: 0;
    pointer-events: none; white-space: nowrap;
    font-family: "Orbitron", sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1px;
    color: #d7e6ff; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.8);
    opacity: 0.82;
  }
  .an-label.sel { color: var(--accent); opacity: 1; text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }

  /* ---------- aim + selection overlay ---------- */
  #an-overlay { position: fixed; inset: 0; z-index: 4; pointer-events: none; width: 100%; height: 100%; }
  /* The modal backdrop is translucent, so the reticle would show through it. */
  body.modal-open #an-overlay, body.modal-open .an-label { display: none; }

  /* ---------- modal ---------- */
  .an-modal {
    position: fixed; inset: 0; z-index: 10;
    display: none; place-items: center;
    padding: 20px;
    background: rgba(5, 4, 14, 0.78);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .an-modal.show { display: grid; }
  .an-sheet {
    width: min(760px, 100%); max-height: min(86vh, 720px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.7);
    overflow: hidden;
  }
  .an-sheet-h {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid rgba(140,120,255,0.18);
  }
  .an-sheet-h h2 {
    font-family: "Orbitron", sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 1px;
    color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .an-sheet-b { padding: 16px 18px 20px; overflow-y: auto; }

  .an-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); gap: 10px; }
  .an-preset {
    display: block; text-align: left; padding: 12px 13px;
    background: rgba(40, 30, 80, 0.45); border: 1px solid rgba(150,130,255,0.2);
    border-radius: 11px; font-family: inherit; letter-spacing: 0;
    white-space: normal;   /* undo the nowrap that all buttons inherit */
  }
  .an-preset:hover { background: rgba(80,62,150,0.6); border-color: var(--accent); transform: translateY(-2px); }
  .an-preset b { display: block; font-family: "Orbitron", sans-serif; font-size: 12.5px; color: #fff; margin-bottom: 4px; }
  .an-preset span { font-size: 11px; color: var(--ink-dim); line-height: 1.45; font-weight: 400; }

  .an-help h3 {
    font-family: "Press Start 2P", monospace; font-size: 8.5px; letter-spacing: 1.3px;
    color: var(--accent); margin: 18px 0 9px;
  }
  .an-help h3:first-child { margin-top: 0; }
  .an-help p, .an-help li { font-size: 12.5px; line-height: 1.65; color: #cdc9ee; }
  .an-help ul { padding-left: 18px; }
  .an-help li { margin-bottom: 5px; }
  .an-help b { color: #fff; }
  .an-help .an-keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; align-items: baseline; }
  .an-help .an-keys div:nth-child(odd) { text-align: right; }
  .an-help .an-keys span { color: #cdc9ee; }

  /* ---------- boot / toast ---------- */
  .an-boot {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; gap: 16px; align-content: center;
    background: radial-gradient(circle at 50% 40%, #201347 0%, #0a0718 55%, #05040d 100%);
    transition: opacity .5s;
  }
  .an-boot .an-title { font-size: clamp(15px, 5vw, 26px); }
  .an-boot p { font-family: "Press Start 2P", monospace; font-size: 8px; letter-spacing: 2px; color: #ffd166; animation: blink 1.1s steps(1) infinite; }
  .an-boot.gone { opacity: 0; pointer-events: none; }
  @keyframes blink { 50% { opacity: .2; } }

  .an-toast {
    position: absolute; left: 50%; top: 64px; transform: translate(-50%, -14px);
    padding: 9px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--accent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
    font-family: "Orbitron", sans-serif; font-size: 12px; font-weight: 700; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .an-toast.show { opacity: 1; transform: translate(-50%, 0); }

  .an-fail { padding: 30px; text-align: center; font-size: 14px; line-height: 1.7; max-width: 460px; }
  .an-fail a { color: var(--accent2); }

  /* ---------- responsive ---------- */
  .an-mob { display: none; }

  @media (max-width: 900px) {
    .an-hint { max-width: calc(100vw - 24px); font-size: 11.5px; }
    .an-side { top: 58px; bottom: 84px; width: 190px; }
    #an-inspector { width: 200px; }
    .an-clock { display: none; }
  }

  @media (max-width: 700px) {
    .an-top { flex-wrap: wrap; }
    .an-time { order: 3; margin-left: 0; width: 100%; justify-content: center; }
    .an-tools button span { display: none; }
    /* Shrink the wordmark just enough that the tool buttons share its row */
    .an-title { font-size: 10px; }
    .an-title span { display: none; }
    .an-back { width: 30px; height: 30px; }
    /* A bottom sheet covers the hint, so drop the hint while one is open */
    body.panel-open .an-hint { display: none; }
    .an-side {
      top: auto; bottom: 56px; width: calc(100vw - 20px); max-height: 42vh;
      left: 10px; right: 10px;
    }
    .an-side.hidden { display: none; }
    #an-inspector { width: calc(100vw - 20px); }
    .an-scroll { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 6px; align-content: start; }
    .an-group { grid-column: 1 / -1; }
    #an-inspector .an-scroll { display: block; }
    .an-mob { display: flex; position: absolute; left: 10px; bottom: 10px; gap: 6px; }
    .an-hud { left: auto; right: 10px; bottom: 10px; font-size: 7px; }
    .an-scalebar { display: none; }
    .an-hint { bottom: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .an-boot p { animation: none; }
  }
</style>
  <script defer src="../analytics.js"></script>
</head>
<body>

<canvas id="an-canvas"></canvas>
<svg id="an-overlay">
  <circle id="an-ret" fill="none" stroke="#ff6fd8" stroke-width="2" stroke-dasharray="13 10" opacity="0.95" style="display:none"/>
  <g id="an-aim" style="display:none">
    <line id="an-aim-line" stroke="#ff6fd8" stroke-width="2" stroke-dasharray="6 5"/>
    <circle id="an-aim-dot" r="5" fill="none" stroke="#ff6fd8" stroke-width="2"/>
    <text id="an-aim-txt" fill="#ffd166" font-family="Orbitron, sans-serif" font-size="11" font-weight="700"></text>
  </g>
</svg>
<div id="an-vignette"></div>

<div id="an-app">

  <div class="an-top">
    <div class="an-brand">
      <a class="an-back" href="../" title="Back to CuriousScout" aria-label="Back to CuriousScout">&#9664;</a>
      <div class="an-title">AstroNomia <span>1.2</span></div>
    </div>

    <div class="an-time panel">
      <button id="an-play" title="Play / pause (Space)">&#9654;</button>
      <button id="an-slower" title="Slower (,)">&laquo;</button>
      <div class="an-rate"><b id="an-rate-val">1</b><span id="an-rate-unit">days / sec</span></div>
      <button id="an-faster" title="Faster (.)">&raquo;</button>
      <div class="an-clock" id="an-clock">Y 0<br>D 0</div>
    </div>

    <div class="an-tools panel">
      <button id="an-btn-systems" title="Load a ready-made system">&#9733; <span>Systems</span></button>
      <button id="an-btn-settings" title="Simulation settings">&#9881; <span>Settings</span></button>
      <button id="an-btn-help" title="How to play">?</button>
    </div>
  </div>

  <aside class="an-side panel hidden" id="an-palette">
    <div class="panel-h">
      <span>ADD BODY</span>
      <span id="an-armed-lbl" style="font-size:7px;color:var(--ink-dim)"></span>
    </div>
    <div class="an-scroll" id="an-palette-list"></div>
  </aside>

  <aside class="an-side panel hidden" id="an-inspector">
    <div class="panel-h"><span id="an-insp-h">SELECTED</span></div>
    <div class="an-scroll" id="an-insp-body">
      <div class="an-empty">Nothing selected.<br><br>Tap a body to inspect it, or pick something from <b>Add Body</b> to build.</div>
    </div>
  </aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   AstroNomia 1.2 — a space sandbox
   --------------------------------------------------------------------------
   Units used everywhere in the simulation:
     mass   = Earth masses      (M⊕ = 5.972e24 kg)
     length = gigametres        (Gm = 1e9 m = 1,000,000 km)
     time   = days              (86400 s)
   In those units G works out to ~0.0029752, which puts Earth at 149.6 Gm from
   a 332,946 M⊕ Sun on a 365.2-day orbit. The physics is real; only the drawn
   size of bodies is exaggerated (see settings.bodyScale).
   ========================================================================== */
'use strict';

/* ---------------------------------------------------------------- constants */

const G = 0.0029752;             // Gm^3 / (M⊕ · day^2)
const R_EARTH = 0.006371;        // Earth radius in Gm
const M_SUN = 332946;            // Solar mass in M⊕
const R_SUN = 109.17;            // Solar radius in R⊕
const AU = 149.598;              // Astronomical unit in Gm
const C_LIGHT = 25902.068;       // speed of light in Gm/day (299,792 km/s)
const KG_PER_ME = 5.972e24;

// Schwarzschild radius (Gm) for a mass in M⊕
const schwarzschild = (m) => 2 * G * m / (C_LIGHT * C_LIGHT);

/* One unit of energy here is 1 M⊕·Gm²/day² = 8.000e32 J, so the "foe" that
   supernova physics is measured in (1e51 erg = 1e44 J) works out at 1.250e11
   of them. Everything the explosions do is budgeted in these two numbers.   */
const FOE = 1.2500e11;
const ERG_S_PER_LSUN = 3.828e33;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;

/* -------------------------------------------------------- number formatting */

function fmtMass(me) {
  if (me >= M_SUN * 0.05) return (me / M_SUN).toPrecision(3) + ' M☉';
  if (me >= 0.05) return me.toPrecision(3) + ' M⊕';
  const kg = me * KG_PER_ME;
  const e = Math.floor(Math.log10(kg));
  return (kg / Math.pow(10, e)).toFixed(2) + '×10' + sup(e) + ' kg';
}

function fmtRadius(gm) {
  const km = gm * 1e6;
  if (gm >= R_SUN * R_EARTH * 0.3) return (gm / (R_SUN * R_EARTH)).toPrecision(3) + ' R☉';
  if (km >= 1000) return (gm / R_EARTH).toPrecision(3) + ' R⊕';
  if (km >= 1) return Math.round(km).toLocaleString() + ' km';
  return (km * 1000).toPrecision(3) + ' m';
}

function fmtDist(gm) {
  if (gm >= AU * 0.05) return (gm / AU).toPrecision(3) + ' AU';
  if (gm >= 0.5) return (gm * 1e6).toPrecision(3) + ' km';
  return Math.round(gm * 1e6).toLocaleString() + ' km';
}

function fmtSpeed(gmPerDay) {
  const kms = gmPerDay * 1e9 / 86400 / 1000;
  if (kms >= 1000) return (kms / 299792.458 * 100).toPrecision(3) + '% c';
  return kms.toPrecision(3) + ' km/s';
}

function fmtDensity(me, gm) {
  const kg = me * KG_PER_ME;
  const m3 = (4 / 3) * Math.PI * Math.pow(gm * 1e9, 3);
  const d = kg / m3;
  return (d >= 100000 ? d.toExponential(2) : Math.round(d).toLocaleString()) + ' kg/m³';
}

function sup(n) {
  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

/* ============================================================== colour utils */

function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

/** Sample a gradient defined as [[pos, [r,g,b]], …] (positions ascending). */
function ramp(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      const k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      return mix(a[1], b[1], k);
    }
  }
  return stops[stops.length - 1][1].slice();
}

const css = (c) => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

/** Rough blackbody colour for a stellar temperature in kelvin. */
function kelvinToRGB(k) {
  k = clamp(k, 1000, 40000) / 100;
  let r, g, b;
  if (k <= 66) { r = 255; } else { r = 329.7 * Math.pow(k - 60, -0.1332); }
  if (k <= 66) { g = 99.47 * Math.log(k) - 161.1; } else { g = 288.1 * Math.pow(k - 60, -0.0755); }
  if (k >= 66) { b = 255; } else if (k <= 19) { b = 0; } else { b = 138.5 * Math.log(k - 10) - 305.0; }
  return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
}

/* ==================================================================== noise */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const smoothstep = (t) => t * t * (3 - 2 * t);

/**
 * A value-noise lattice that wraps in u (longitude) and clamps in v (latitude),
 * so equirectangular textures have no visible seam down the back of a planet.
 */
class Lattice {
  constructor(seed, gw, gh) {
    this.gw = gw; this.gh = gh;
    const r = mulberry32(seed);
    const g = new Float32Array(gw * (gh + 1));
    for (let i = 0; i < g.length; i++) g[i] = r();
    this.g = g;
  }
  at(u, v) {
    const gw = this.gw, gh = this.gh;
    const x = u * gw, y = clamp(v, 0, 1) * gh;
    let x0 = Math.floor(x), y0 = Math.floor(y);
    const tx = smoothstep(x - x0), ty = smoothstep(y - y0);
    const x1 = ((x0 + 1) % gw + gw) % gw;
    x0 = ((x0 % gw) + gw) % gw;
    const y1 = Math.min(y0 + 1, gh);
    y0 = clamp(y0, 0, gh);
    const g = this.g;
    const a = g[y0 * gw + x0], b = g[y0 * gw + x1];
    const c = g[y1 * gw + x0], d = g[y1 * gw + x1];
    return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
  }
}

/** Fractal brownian motion built from wrapping lattices. Returns f(u,v) → 0..1 */
function fbm(seed, gw, gh, octaves, gain) {
  gain = gain || 0.5;
  const layers = [];
  let amp = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    layers.push({ n: new Lattice(seed + i * 7919, Math.max(2, Math.round(gw * Math.pow(2, i))), Math.max(2, Math.round(gh * Math.pow(2, i)))), a: amp });
    norm += amp;
    amp *= gain;
  }
  return function (u, v) {
    let s = 0;
    for (let i = 0; i < layers.length; i++) s += layers[i].n.at(u, v) * layers[i].a;
    return s / norm;
  };
}

/** Ridged noise — good for mountain chains, cracks and filaments. */
function ridged(f) {
  return (u, v) => {
    const n = Math.abs(f(u, v) * 2 - 1);
    return 1 - n;
  };
}

/* ======================================================= texture primitives */

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Walk every pixel of an equirectangular map. fn(u, v, lat) → [r,g,b] */
function pixelPass(ctx, W, H, fn) {
  const img = ctx.createImageData(W, H);
  const d = img.data;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const lat = (0.5 - v) * Math.PI;         // +pi/2 north … -pi/2 south
    for (let x = 0; x < W; x++) {
      const c = fn((x + 0.5) / W, v, lat);
      d[i++] = c[0]; d[i++] = c[1]; d[i++] = c[2]; d[i++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/**
 * Scatter impact craters. Because an equirect map stretches horizontally
 * towards the poles, each crater is widened by 1/cos(latitude) so it still
 * reads as circular once wrapped onto the sphere.
 */
function craters(ctx, W, H, rng, count, rMin, rMax, tint) {
  tint = tint || [255, 255, 255];
  for (let i = 0; i < count; i++) {
    const u = rng(), v = 0.06 + rng() * 0.88;
    const lat = (0.5 - v) * Math.PI;
    const r = (rMin + Math.pow(rng(), 2.4) * (rMax - rMin)) * W;
    const stretch = 1 / Math.max(0.18, Math.cos(lat));
    const cx = u * W, cy = v * H;
    for (const off of [-W, 0, W]) {
      if (Math.abs(cx + off - W / 2) > W / 2 + r * stretch) continue;
      ctx.save();
      ctx.translate(cx + off, cy);
      ctx.scale(stretch, 1);
      // ejecta halo
      const halo = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r * 1.7);
      halo.addColorStop(0, rgba(tint, 0.16));
      halo.addColorStop(1, rgba(tint, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, TAU); ctx.fill();
      // bowl: shaded from upper-left, bright rim
      const bowl = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
      bowl.addColorStop(0, 'rgba(0,0,0,0.42)');
      bowl.addColorStop(0.72, 'rgba(0,0,0,0.20)');
      bowl.addColorStop(0.9, rgba(tint, 0.20));
      bowl.addColorStop(1, rgba(tint, 0.02));
      ctx.fillStyle = bowl;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

/** Glowing fracture lines — lava rifts, ice crevasses, diamond veins. */
function cracks(ctx, W, H, rng, count, color, width, glow) {
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    let x = rng() * W, y = 0.1 * H + rng() * 0.8 * H;
    let ang = rng() * TAU;
    const seg = 6 + (rng() * 14) | 0;
    const pts = [[x, y]];
    for (let s = 0; s < seg; s++) {
      ang += (rng() - 0.5) * 1.1;
      const len = W * (0.008 + rng() * 0.03);
      x += Math.cos(ang) * len; y += Math.sin(ang) * len;
      pts.push([x, y]);
    }
    for (const off of [-W, 0, W]) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0] + off, pts[0][1]);
      for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0] + off, pts[p][1]);
      if (glow) {
        ctx.strokeStyle = rgba(color, 0.20);
        ctx.lineWidth = width * 4.5;
        ctx.stroke();
        ctx.strokeStyle = rgba(color, 0.42);
        ctx.lineWidth = width * 2.1;
        ctx.stroke();
      }
      ctx.strokeStyle = rgba(color, glow ? 0.95 : 0.5);
      ctx.lineWidth = width * (0.5 + rng());
      ctx.stroke();
    }
  }
  ctx.restore();
}

/** Elongated cyclonic ovals, as seen on gas giants. */
function storms(ctx, W, H, rng, count, palette) {
  for (let i = 0; i < count; i++) {
    const v = 0.16 + rng() * 0.68;
    const lat = (0.5 - v) * Math.PI;
    const rx = W * (0.02 + rng() * 0.07);
    const ry = rx * (0.28 + rng() * 0.35);
    const cx = rng() * W, cy = v * H;
    const col = pick(palette);
    for (const off of [-W, 0, W]) {
      ctx.save();
      ctx.translate(cx + off, cy);
      ctx.scale(1 / Math.max(0.25, Math.cos(lat)), 1);
      ctx.rotate((rng() - 0.5) * 0.3);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, rgba(col, 0.95));
      g.addColorStop(0.55, rgba(col, 0.5));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

/** Frozen polar caps, feathered along a noisy edge. */
function iceCaps(ctx, W, H, rng, extent, color) {
  const f = fbm((rng() * 1e6) | 0, 10, 2, 3);
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const fromPole = Math.min(v, 1 - v) * 2;                 // 0 at pole, 1 at equator
    const edge = extent * (0.72 + f(0, v) * 0.6);
    if (fromPole > edge) continue;
    const t = clamp(1 - fromPole / edge, 0, 1);
    const a = smoothstep(clamp(t * 1.7, 0, 1));
    for (let x = 0; x < W; x++) {
      const wob = f((x + 0.5) / W, v);
      const aa = clamp(a * (0.55 + wob * 0.9), 0, 1);
      const i = (y * W + x) * 4;
      d[i] = d[i] + (color[0] - d[i]) * aa;
      d[i + 1] = d[i + 1] + (color[1] - d[i + 1]) * aa;
      d[i + 2] = d[i + 2] + (color[2] - d[i + 2]) * aa;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ========================================================= surface painters */
/* Each painter fills an equirectangular canvas for one class of world.       */

const SURFACE = {

  /* Airless grey cratered crust — moons, asteroids, impactors. */
  rock(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 6, 3, 5);
    const maria = fbm(seed + 555, 3, 2, 3);
    const base = o.dark
      ? [[0, [26, 22, 21]], [0.5, [52, 46, 44]], [1, [92, 84, 80]]]
      : [[0, [58, 54, 52]], [0.45, [104, 99, 95]], [0.75, [148, 143, 137]], [1, [196, 192, 186]]];
    pixelPass(ctx, W, H, (u, v) => {
      const e = elev(u, v);
      let c = ramp(base, e);
      const m = maria(u, v);
      if (m < 0.42) c = mix(c, o.dark ? [18, 16, 16] : [46, 44, 48], (0.42 - m) * 1.7);
      return c;
    });
    craters(ctx, W, H, rng, o.craters || 130, 0.006, 0.075, o.dark ? [120, 110, 104] : [222, 218, 210]);
  },

  /* Continents, oceans, ice caps — a living world. */
  terran(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 4, 2, 6);
    const mount = ridged(fbm(seed + 91, 8, 4, 4));
    const arid = fbm(seed + 3301, 3, 2, 3);
    const sea = o.sea != null ? o.sea : 0.5;
    const deep = [[0, [6, 22, 62]], [0.55, [12, 54, 116]], [1, [28, 104, 168]]];
    pixelPass(ctx, W, H, (u, v, lat) => {
      const e = elev(u, v);
      const cold = Math.pow(Math.abs(lat) / (Math.PI / 2), 1.6);
      if (e < sea) {
        const d = e / sea;
        let c = ramp(deep, d);
        if (d > 0.9) c = mix(c, [58, 148, 186], (d - 0.9) * 9);
        return c;
      }
      const h = (e - sea) / (1 - sea);
      const dryness = clamp(arid(u, v) * 1.3 - 0.25 + cold * 0.25, 0, 1);
      const green = ramp([[0, [196, 182, 132]], [0.08, [96, 132, 66]], [0.4, [48, 96, 48]], [0.7, [86, 96, 66]], [1, [128, 124, 112]]], h);
      const dry = ramp([[0, [204, 176, 124]], [0.3, [172, 138, 88]], [0.7, [136, 112, 80]], [1, [148, 140, 130]]], h);
      let c = mix(green, dry, dryness);
      const m = mount(u, v);
      if (h > 0.32 && m > 0.62) c = mix(c, [176, 172, 168], (m - 0.62) * 2.2);
      if (h > 0.62) c = mix(c, [244, 246, 252], clamp((h - 0.62) * 2.6, 0, 1));
      if (cold > 0.72) c = mix(c, [232, 238, 246], (cold - 0.72) * 2.4);
      return c;
    });
    iceCaps(ctx, W, H, rng, o.caps != null ? o.caps : 0.14, [238, 244, 252]);
  },

  /* A drowned world: shallow shelves, scattered archipelagos. */
  ocean(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const elev = fbm(seed, 4, 2, 6);
    pixelPass(ctx, W, H, (u, v, lat) => {
      const e = elev(u, v);
      const cold = Math.pow(Math.abs(lat) / (Math.PI / 2), 1.8);
      if (e < 0.68) {
        let c = ramp([[0, [4, 26, 74]], [0.5, [10, 74, 148]], [0.85, [26, 132, 194]], [1, [88, 196, 214]]], e / 0.68);
        return mix(c, [70, 130, 170], cold * 0.35);
      }
      const h = (e - 0.68) / 0.32;
      return ramp([[0, [214, 202, 158]], [0.35, [120, 148, 92]], [1, [96, 104, 88]]], h);
    });
    iceCaps(ctx, W, H, rng, 0.18, [230, 240, 250]);
  },

  /* Dune seas and dust — Mars-like. */
  desert(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const dunes = ridged(fbm(seed + 77, 26, 6, 3));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [96, 52, 34]], [0.35, [152, 88, 52]], [0.6, [188, 124, 76]], [0.85, [208, 158, 108]], [1, [226, 196, 156]]], e);
      c = mix(c, [232, 204, 164], dunes(u, v) * 0.22);
      return c;
    });
    craters(ctx, W, H, rng, 46, 0.006, 0.05, [226, 196, 158]);
    iceCaps(ctx, W, H, rng, 0.09, [246, 240, 234]);
  },

  /* Fractured ice shell — Europa, Enceladus. */
  ice(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const dirt = fbm(seed + 12, 3, 2, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [176, 190, 208]], [0.5, [214, 228, 240]], [1, [246, 250, 255]]], e);
      const d = dirt(u, v);
      if (d < 0.4) c = mix(c, [148, 132, 118], (0.4 - d) * 1.1);
      return c;
    });
    cracks(ctx, W, H, rng, 34, [110, 140, 172], 1.6, false);
    cracks(ctx, W, H, rng, 12, [70, 96, 130], 2.6, false);
    craters(ctx, W, H, rng, 26, 0.005, 0.035, [252, 254, 255]);
  },

  /* Cooling crust over an open magma ocean. */
  lava(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const crust = fbm(seed, 6, 3, 5);
    const heat = ridged(fbm(seed + 404, 5, 3, 4));
    pixelPass(ctx, W, H, (u, v) => {
      const e = crust(u, v);
      let c = ramp([[0, [16, 10, 10]], [0.45, [42, 26, 24]], [0.8, [72, 42, 34]], [1, [104, 62, 44]]], e);
      const h = heat(u, v);
      if (h > 0.58) {
        const t = (h - 0.58) / 0.42;
        c = mix(c, ramp([[0, [140, 40, 12]], [0.5, [232, 108, 18]], [1, [255, 226, 140]]], t), Math.pow(t, 0.7));
      }
      return c;
    });
    cracks(ctx, W, H, rng, 40, [255, 148, 40], 1.8, true);
    cracks(ctx, W, H, rng, 14, [255, 236, 170], 1.2, true);
  },

  /* Banded, turbulent hydrogen envelope. */
  gas(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 5, 3, 4);
    const fine = fbm(seed + 21, 30, 10, 3);
    const pal = o.pal || [[0, [96, 62, 44]], [0.2, [176, 138, 96]], [0.36, [232, 212, 176]], [0.5, [188, 152, 108]], [0.64, [244, 232, 206]], [0.8, [162, 118, 84]], [1, [104, 70, 50]]];
    const bands = o.bands || 9;
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.06;
      const band = (Math.sin((v + w) * Math.PI * bands * 2) * 0.5 + 0.5);
      const t = clamp(v + w * 1.6 + (band - 0.5) * 0.09, 0, 1);
      let c = ramp(pal, t);
      c = mix(c, [255, 255, 255], (fine(u, v) - 0.5) * 0.10);
      return c;
    });
    storms(ctx, W, H, rng, o.storms != null ? o.storms : 7, o.stormPal || [[214, 122, 78], [246, 236, 210], [178, 96, 62]]);
  },

  /* Smooth methane haze with a lonely dark vortex. */
  icegiant(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 4, 3, 4);
    const wisp = fbm(seed + 66, 22, 8, 3);
    const pal = o.pal || [[0, [42, 74, 138]], [0.3, [64, 118, 190]], [0.5, [98, 164, 218]], [0.7, [72, 130, 196]], [1, [38, 68, 130]]];
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.05;
      const band = Math.sin((v + w) * Math.PI * 5) * 0.5 + 0.5;
      let c = ramp(pal, clamp(v + w + (band - 0.5) * 0.06, 0, 1));
      c = mix(c, [246, 252, 255], Math.pow(clamp(wisp(u, v) * 1.4 - 0.55, 0, 1), 1.4) * 0.5);
      return c;
    });
    storms(ctx, W, H, rng, 2, [[22, 38, 78], [30, 52, 96]]);
  },

  /* Convective granulation, spots and plage on a stellar photosphere. */
  star(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const gran = fbm(seed, 34, 14, 3);
    const cell = ridged(fbm(seed + 8, 22, 9, 2));
    const big = fbm(seed + 31, 5, 3, 3);
    const hot = kelvinToRGB(o.temp || 5778);
    const core = mix(hot, [255, 255, 255], 0.42);
    const cool = mix(hot, [40, 8, 0], 0.42);
    pixelPass(ctx, W, H, (u, v) => {
      const g = gran(u, v) * 0.55 + cell(u, v) * 0.45;
      let c = mix(cool, core, clamp(g * 1.25 - 0.1, 0, 1));
      c = mix(c, core, clamp((big(u, v) - 0.55) * 1.6, 0, 1) * 0.5);
      return [Math.min(255, c[0] * 1.06), Math.min(255, c[1] * 1.04), Math.min(255, c[2] * 1.02)];
    });
    // starspots
    const spots = o.spots != null ? o.spots : 7;
    for (let i = 0; i < spots; i++) {
      const u = rng(), v = 0.2 + rng() * 0.6;
      const lat = (0.5 - v) * Math.PI;
      const r = W * (0.012 + Math.pow(rng(), 2) * 0.05);
      for (const off of [-W, 0, W]) {
        ctx.save();
        ctx.translate(u * W + off, v * H);
        ctx.scale(1 / Math.max(0.25, Math.cos(lat)), 1);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
        g.addColorStop(0, rgba(mix(cool, [0, 0, 0], 0.55), 0.9));
        g.addColorStop(0.6, rgba(cool, 0.5));
        g.addColorStop(1, rgba(cool, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  },

  /* Degenerate remnant — smooth, blistering, faintly mottled. */
  dwarfstar(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 10, 5, 3);
    const hot = kelvinToRGB(o.temp || 12000);
    pixelPass(ctx, W, H, (u, v) => mix(mix(hot, [255, 255, 255], 0.55), hot, n(u, v) * 0.5));
  },

  /* Neutron star: iron crust, blazing magnetic poles. */
  neutron(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 12, 6, 3);
    pixelPass(ctx, W, H, (u, v, lat) => {
      const pole = Math.pow(Math.abs(Math.sin(lat)), 3);
      let c = mix([120, 150, 210], [210, 232, 255], n(u, v));
      return mix(c, [255, 255, 255], pole * 0.9);
    });
  },

  /* Diamond crust over a graphite mantle. */
  carbon(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 6, 3, 5);
    const facet = ridged(fbm(seed + 17, 30, 12, 3));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [14, 14, 18]], [0.5, [34, 34, 42]], [0.8, [58, 58, 70]], [1, [92, 94, 110]]], e);
      const f = facet(u, v);
      if (f > 0.72) c = mix(c, [214, 232, 255], (f - 0.72) * 2.6);
      return c;
    });
    cracks(ctx, W, H, rng, 26, [190, 226, 255], 1.3, true);
    craters(ctx, W, H, rng, 34, 0.005, 0.04, [150, 170, 200]);
  },

  /* A stripped metal core: streaked, oxidised, dense. */
  iron(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 4, 8, 5);
    const streak = fbm(seed + 5, 40, 4, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const e = clamp(base(u, v) * 0.75 + streak(u, v) * 0.25, 0, 1);
      let c = ramp([[0, [48, 40, 38]], [0.4, [102, 82, 72]], [0.65, [148, 116, 92]], [0.85, [176, 152, 132]], [1, [212, 198, 186]]], e);
      return c;
    });
    craters(ctx, W, H, rng, 70, 0.005, 0.05, [216, 200, 186]);
  },

  /* Cotton-candy super-puff: enormous, hazy, almost weightless. */
  puff(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const warp = fbm(seed, 4, 3, 4);
    const haze = fbm(seed + 9, 14, 6, 3);
    pixelPass(ctx, W, H, (u, v) => {
      const w = (warp(u, v) - 0.5) * 0.1;
      const band = Math.sin((v + w) * Math.PI * 4) * 0.5 + 0.5;
      let c = ramp([[0, [226, 190, 200]], [0.45, [244, 222, 226]], [0.7, [232, 208, 222]], [1, [216, 196, 216]]], clamp(v + w + (band - 0.5) * 0.1, 0, 1));
      return mix(c, [255, 252, 255], haze(u, v) * 0.3);
    });
  },

  /* Tidally locked "eyeball": a hot dayside eye, an iced nightside. */
  eyeball(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const n = fbm(seed, 6, 3, 5);
    const cloud = fbm(seed + 3, 10, 5, 4);
    pixelPass(ctx, W, H, (u, v, lat) => {
      // great-circle distance from the substellar point at (lon = pi, lat = 0)
      const d = Math.acos(clamp(Math.cos(lat) * Math.cos(u * TAU - Math.PI), -1, 1));
      const e = n(u, v);
      let c;
      if (d < 0.75) c = mix([48, 34, 30], [104, 72, 52], e);                       // scorched eye
      else if (d < 1.45) c = mix(ramp([[0, [16, 62, 108]], [1, [46, 128, 156]]], e), [86, 128, 78], e * 0.5); // melt ring
      else c = mix([202, 218, 236], [250, 253, 255], e);                            // frozen far side
      if (d > 1.1 && d < 1.7) c = mix(c, [244, 250, 255], (cloud(u, v) - 0.45) * 0.8);
      return c;
    });
  },

  /* Chthonian world — a gas giant's core after its atmosphere was boiled off. */
  chthonian(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const rift = ridged(fbm(seed + 13, 7, 4, 4));
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [22, 16, 18]], [0.45, [50, 34, 34]], [0.75, [80, 56, 50]], [1, [116, 88, 76]]], e);
      const r = rift(u, v);
      if (r > 0.68) c = mix(c, [216, 84, 30], (r - 0.68) * 2.4);
      return c;
    });
    cracks(ctx, W, H, rng, 30, [255, 110, 40], 1.6, true);
    craters(ctx, W, H, rng, 44, 0.005, 0.045, [130, 104, 92]);
  },

  /* Comet nucleus: sooty, pitted, veined with exposed ice. */
  comet(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 6, 4, 5);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [16, 14, 14]], [0.5, [34, 30, 28]], [0.85, [58, 54, 50]], [1, [86, 82, 78]]], e);
      if (e > 0.78) c = mix(c, [206, 220, 236], (e - 0.78) * 3.4);
      return c;
    });
    craters(ctx, W, H, rng, 60, 0.008, 0.09, [150, 160, 172]);
  },

  /* A starless wanderer: frozen, dim, lightly cratered. */
  rogue(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 5, 3, 5);
    const frost = fbm(seed + 44, 9, 4, 4);
    pixelPass(ctx, W, H, (u, v) => {
      const e = base(u, v);
      let c = ramp([[0, [20, 24, 34]], [0.45, [38, 46, 62]], [0.75, [60, 72, 92]], [1, [92, 106, 128]]], e);
      c = mix(c, [172, 192, 214], Math.pow(clamp(frost(u, v) * 1.3 - 0.5, 0, 1), 1.3) * 0.6);
      return c;
    });
    craters(ctx, W, H, rng, 40, 0.005, 0.05, [126, 144, 168]);
  },

  /* Hycean: a hydrogen-blanketed ocean world under permanent overcast. */
  hycean(ctx, W, H, rng, o) {
    const seed = (rng() * 1e6) | 0;
    const base = fbm(seed, 4, 2, 5);
    const swirl = fbm(seed + 7, 12, 6, 4);
    pixelPass(ctx, W, H, (u, v) => {
      let c = ramp([[0, [6, 34, 76]], [0.5, [14, 74, 130]], [1, [40, 130, 176]]], base(u, v));
      const s = clamp(swirl(u, v) * 1.5 - 0.42, 0, 1);
      return mix(c, [226, 240, 250], Math.pow(s, 1.2) * 0.85);
    });
  }
};

/* ================================================== auxiliary texture kinds */

/** Broken cloud deck with transparency, painted onto its own shell. */
function cloudTexture(seed, W, H, opacity, tintCol) {
  const cv = newCanvas(W, H);
  const ctx = cv.getContext('2d');
  const f = fbm(seed, 6, 3, 5);
  const band = fbm(seed + 2, 3, 9, 3);
  const tint = tintCol || [255, 255, 255];
  const img = ctx.createImageData(W, H);
  const d = img.data;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      let n = f(u, v) * 0.75 + band(u, v) * 0.25;
      let a = clamp((n - 0.48) * 3.4, 0, 1);
      a = Math.pow(a, 1.25) * opacity;
      d[i++] = tint[0]; d[i++] = tint[1]; d[i++] = tint[2];
      d[i++] = (a * 255) | 0;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/**
 * Ring system. RingGeometry uses a planar UV projection, so this is painted as
 * a square disc of concentric bands rather than a strip.
 */
function ringTexture(seed, size, palette) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;
  ctx.clearRect(0, 0, size, size);
  const n = 190;
  for (let i = n; i >= 0; i--) {
    const t = i / n;                       // 0 inner … 1 outer
    const rad = c * (0.02 + t * 0.98);
    // layered band noise so gaps and bright ringlets alternate
    let a = 0.30 + 0.42 * Math.abs(Math.sin(t * 41 + r() * 0.15)) * Math.abs(Math.sin(t * 13.7));
    if (t > 0.42 && t < 0.48) a *= 0.10;   // a Cassini-like division
    if (t > 0.86) a *= 1 - (t - 0.86) / 0.14;
    if (t < 0.06) a *= t / 0.06;
    const col = mix(palette[0], palette[1], Math.abs(Math.sin(t * 7.3)));
    ctx.strokeStyle = rgba(col, clamp(a, 0, 1));
    ctx.lineWidth = c / n + 1.2;
    ctx.beginPath(); ctx.arc(c, c, rad, 0, TAU); ctx.stroke();
  }
  return cv;
}

/** Accretion disc: relativistic-hot inside, cooling outward. */
function accretionTexture(seed, size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const r = mulberry32(seed);
  const c = size / 2;
  const n = 200;
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    const rad = c * (0.02 + t * 0.98);
    const col = ramp([
      [0, [255, 255, 255]], [0.12, [214, 236, 255]], [0.3, [255, 232, 176]],
      [0.55, [255, 150, 52]], [0.8, [186, 54, 22]], [1, [58, 12, 10]]
    ], t);
    let a = (1 - Math.pow(t, 1.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 60 + r() * 0.4)));
    if (t < 0.05) a *= t / 0.05;
    if (t > 0.9) a *= 1 - (t - 0.9) / 0.1;
    ctx.strokeStyle = rgba(col, clamp(a, 0, 1));
    ctx.lineWidth = c / n + 1.4;
    ctx.beginPath(); ctx.arc(c, c, rad, 0, TAU); ctx.stroke();
  }
  return cv;
}

/** Soft radial sprite used for star glow, coma and explosion sparks. */
function glowTexture(size, inner, hardness) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(inner, 'rgba(255,255,255,' + hardness + ')');
  g.addColorStop(0.45, 'rgba(255,255,255,' + (hardness * 0.28) + ')');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/** A one-sided gradient used for comet dust tails. */
function tailTexture(size) {
  const cv = newCanvas(size, size);
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, size, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.18, 'rgba(210,235,255,0.42)');
  g.addColorStop(1, 'rgba(160,210,255,0)');
  ctx.fillStyle = g;
  // feather the edges across the short axis so it reads as a plume
  for (let y = 0; y < size; y++) {
    const t = Math.abs(y / size - 0.5) * 2;
    ctx.globalAlpha = Math.pow(1 - t, 1.8);
    ctx.fillRect(0, y, size, 1);
  }
  return cv;
}

const usedNames = new Set();

/** Escape for use inside an HTML attribute — body names are user-editable. */
const escAttr = (s) => String(s)
  .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
  .replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Rename a body, keeping the used-name registry honest. Returns the final name. */
function renameBody(b, raw) {
  const want = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim().slice(0, 24);
  if (!want || want === b.name) return b.name;
  usedNames.delete(b.name);
  b.name = unique(want);
  return b.name;
}

function makeName(type) {
  const def = TYPES[type];
  const pool = NAME_POOL[def.group] || NAME_POOL.PLANETS;
  if (type === 'theia') return unique('Theia');
  if (type === 'planet_nine') return unique('Planet Nine');
  for (let i = 0; i < 24; i++) {
    const n = pool[(Math.random() * pool.length) | 0];
    if (!usedNames.has(n)) { usedNames.add(n); return n; }
  }
  return unique(pick(pool));
}

function unique(base) {
  if (!usedNames.has(base)) { usedNames.add(base); return base; }
  const suffix = ['b', 'c', 'd', 'e', 'f', 'g', 'h', 'II', 'III', 'IV'];
  for (const s of suffix) {
    const n = base + ' ' + s;
    if (!usedNames.has(n)) { usedNames.add(n); return n; }
  }
  const n = base + ' ' + ((Math.random() * 900 + 100) | 0);
  usedNames.add(n);
  return n;
}

/* ------------------------------------------------------------ body creation */

function trueRadius(type, mass) {
  const def = TYPES[type];
  if (def.kind === 'bh' || def.kind === 'wh') return schwarzschild(mass);
  return def.rad * R_EARTH * Math.cbrt(mass / def.mass);   // constant density
}

function makeBody(type, pos, vel, overrides) {
  const def = TYPES[type];
  const o = overrides || {};
  const mass = o.mass != null ? o.mass : def.mass;
  // Register explicit names too, so auto-naming and renaming both know that
  // "Earth" or "Jupiter" is already taken.
  if (o.name) usedNames.add(o.name);
  const b = {
    id: sim.nextId++,
    type: type,
    kind: def.kind || 'body',
    name: o.name || makeName(type),
    m: mass,
    r: o.r != null ? o.r : trueRadius(type, mass),
    p: pos.clone(),
    v: vel ? vel.clone() : new THREE.Vector3(),
    a: new THREE.Vector3(),
    seed: o.seed != null ? o.seed : (Math.random() * 1e6) | 0,
    spin: o.spin != null ? o.spin : (def.spin || 1),
    rot: Math.random() * TAU,
    tilt: o.tilt != null ? o.tilt : (def.rings ? def.rings.tilt : rnd(-0.42, 0.42)),
    temp: def.temp || 0,
    lum: 0,
    alive: true,
    // Rubble is flagged as already-disrupted so tides cannot shatter it again.
    // Without this, fragments born inside a Roche limit break up on the next
    // step, and each generation spawns more — a runaway to the body cap.
    disrupted: !!o.rubble,
    rubble: !!o.rubble,
    born: sim.time,
    // Days of nuclear burning done so far. Only ticks when Stellar aging is on.
    // A supergiant or a Wolf–Rayet is already near the end when you place it,
    // which is the whole point of those two: they are about to explode.
    age: o.age != null ? o.age : (def.aged ? msLifetime(mass / M_SUN) * def.aged : 0),
    obj: null
  };
  updateLuminosity(b);
  buildVisual(b);
  sim.bodies.push(b);
  return b;
}

/** Displayed / colliding radius, exaggerated so bodies stay findable. */
function visRadius(b) {
  if (b.kind === 'bh' || b.kind === 'wh') return b.r * 2.6 * settings.bodyScale * BH_VIS;
  // A remnant cloud is light-days across already; exaggerating it would be absurd.
  if (b.kind === 'snr') return b.r;
  return b.r * settings.bodyScale;
}

/** L/L☉ from radius and photosphere temperature — the Stefan–Boltzmann law. */
function luminosityOf(type, radiusGm, tempK) {
  const def = TYPES[type];
  if (!def.star) return 0;
  const rSun = radiusGm / (R_SUN * R_EARTH);
  let L = rSun * rSun * Math.pow((tempK != null ? tempK : def.temp) / 5778, 4);
  if (def.lumCap != null) L = Math.min(L, def.lumCap);
  return L;
}

function updateLuminosity(b) {
  b.lum = luminosityOf(b.type, b.r, b.temp);
}

function removeBody(b) {
  b.alive = false;
  usedNames.delete(b.name);
}

function compact() {
  for (let i = sim.bodies.length - 1; i >= 0; i--) {
    if (!sim.bodies[i].alive) {
      disposeVisual(sim.bodies[i]);
      sim.bodies.splice(i, 1);
    }
  }
}

/* =============================================================== gravity     */

let lastMinTdyn = 1e9;
const collisionPairs = [];

function computeAccel() {
  const bs = sim.bodies, n = bs.length;
  const gm = G * settings.gravity;
  collisionPairs.length = 0;
  let minT2 = Infinity;

  for (let i = 0; i < n; i++) bs[i].a.set(0, 0, 0);

  for (let i = 0; i < n; i++) {
    const bi = bs[i], pi = bi.p;
    const ri = visRadius(bi);
    for (let j = i + 1; j < n; j++) {
      const bj = bs[j], pj = bj.p;
      const dx = pj.x - pi.x, dy = pj.y - pi.y, dz = pj.z - pi.z;
      const d2 = dx * dx + dy * dy + dz * dz;

      // Plummer softening scaled by the bodies' own size: keeps the force
      // finite when two objects are overlapping instead of blowing up.
      const soft = 0.35 * (bi.r + bj.r);
      const dd = d2 + soft * soft;
      const d = Math.sqrt(dd);
      const inv3 = 1 / (dd * d);

      // A white hole pushes instead of pulls.
      const si = bi.kind === 'wh' ? -1 : 1;
      const sj = bj.kind === 'wh' ? -1 : 1;

      const fi = gm * bj.m * inv3 * sj;
      const fj = gm * bi.m * inv3 * si;
      bi.a.x += dx * fi; bi.a.y += dy * fi; bi.a.z += dz * fi;
      bj.a.x -= dx * fj; bj.a.y -= dy * fj; bj.a.z -= dz * fj;

      // local dynamical time, used to pick a safe step size
      const t2 = (dd * d) / (gm * (bi.m + bj.m) + 1e-12);
      if (t2 < minT2) minT2 = t2;

      const touch = ri + visRadius(bj);
      if (d2 < touch * touch) collisionPairs.push(bi, bj);
    }
  }
  lastMinTdyn = Math.sqrt(minT2);
}

/* ------------------------------------------------------------- integration */

function step(dt) {
  const bs = sim.bodies;
  const h = dt * 0.5;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    b.v.x += b.a.x * h; b.v.y += b.a.y * h; b.v.z += b.a.z * h;
    b.p.x += b.v.x * dt; b.p.y += b.v.y * dt; b.p.z += b.v.z * dt;
    b.rot += (b.spin ? TAU / b.spin : 0) * dt;
  }
  computeAccel();
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    b.v.x += b.a.x * h; b.v.y += b.a.y * h; b.v.z += b.a.z * h;
  }
  sim.time += dt;
  resolveCollisions();
  if (settings.tidal) checkTides();
}

/** Advance the simulation by one rendered frame's worth of time. */
function advance(frameSeconds) {
  refreshSources();
  if (!sim.running || sim.rate === 0) return;
  const target = sim.rate * Math.min(frameSeconds, 0.05);
  if (target <= 0) return;
  const safe = Math.max(1e-9, 0.025 * lastMinTdyn);
  const n = sim.bodies.length;
  const budget = clamp(Math.floor(260000 / (n * n + 1)), 1, 64);
  const steps = clamp(Math.ceil(target / safe), 1, budget);
  const dt = target / steps;
  for (let s = 0; s < steps; s++) step(dt);

  // Stellar evolution runs once per frame rather than per substep: a star's
  // life is measured in millions of years, so a fraction of a day either way
  // makes no difference at all.
  if (snSet.aging) ageStars(target);

  // Debris gets its own, capped substepping. It does not need the planets'
  // accuracy, and at extreme time compression 64 passes over a full pool would
  // cost tens of milliseconds and stall the frame.
  if (parts.live > 0) {
    const pSteps = Math.min(steps, P_MAX_STEPS);
    const pdt = target / pSteps;
    for (let s = 0; s < pSteps; s++) stepParticles(pdt);
  }
}

/* =============================================================== collisions */

/** Mutual escape velocity of a colliding pair — the yardstick for how hard a hit is. */
const vEscape = (a, b) =>
  Math.sqrt(2 * G * (a.m + b.m) / Math.max(1e-9, visRadius(a) + visRadius(b)));

function resolveCollisions() {
  if (settings.collisions === 'off' || !collisionPairs.length) return;
  let dirty = false;
  for (let k = 0; k < collisionPairs.length; k += 2) {
    const a = collisionPairs[k], b = collisionPairs[k + 1];
    if (!a.alive || !b.alive) continue;
    if (impact(a, b)) dirty = true;
  }
  if (dirty) compact();
}

function impact(a, b) {
  // heavier body is A
  if (b.m > a.m) { const t = a; a = b; b = t; }

  // White holes never merge — they shove things away instead.
  if (a.kind === 'wh' || b.kind === 'wh') {
    const wh = a.kind === 'wh' ? a : b, other = a.kind === 'wh' ? b : a;
    const dir = other.p.clone().sub(wh.p);
    const len = dir.length() || 1;
    dir.divideScalar(len);
    const push = Math.sqrt(2 * G * wh.m / Math.max(visRadius(wh), 1e-6)) * 0.6;
    other.p.copy(wh.p).addScaledVector(dir, visRadius(wh) + visRadius(other));
    other.v.addScaledVector(dir, push);
    return false;
  }

  // A black hole simply eats whatever crosses its horizon.
  if (a.kind === 'bh') {
    absorb(a, b);
    return true;
  }

  if (settings.collisions === 'bounce') {
    bounce(a, b);
    return false;
  }

  const rel = b.v.clone().sub(a.v);
  const vImp = rel.length();
  const vEsc = vEscape(a, b);
  const ratio = b.m / a.m;

  // A gentle touch accretes; a fast, well-matched hit shatters both. Rubble is
  // already broken, so it only ever accretes — this keeps debris fields from
  // fragmenting without end.
  if (vImp < vEsc * 1.6 || ratio < 0.015 || a.rubble || b.rubble) merge(a, b, vImp, vEsc);
  else shatter(a, b, vImp);
  return true;
}

function absorb(hole, prey) {
  const mTot = hole.m + prey.m;
  hole.v.multiplyScalar(hole.m / mTot).addScaledVector(prey.v, prey.m / mTot);

  // Some of the meal is flung clear instead of swallowed whole. Most of it is
  // still bound and will spiral back in over the next few orbits.
  const rp = visRadius(prey);
  const vEsc = Math.sqrt(2 * G * hole.m / Math.max(rp, 1e-9));
  const spare = prey.m * 0.06;
  // Clear of the horizon as well as the prey, or it is swallowed immediately.
  const thrown = ejecta(prey.p, prey.v, 210, spare, vEsc * 0.5,
    [200, 160, 255], [90, 80, 120], Math.max(rp, visRadius(hole)), { speed: 1 });

  hole.m = mTot - thrown;
  hole.r = schwarzschild(hole.m);
  refreshVisual(hole);
  fx.flash(prey.p, rp * 6, [200, 170, 255], 0.5);
  toast(hole.name + ' devoured ' + prey.name);
  removeBody(prey);
}

function bounce(a, b) {
  const nrm = b.p.clone().sub(a.p);
  const dist = nrm.length() || 1e-9;
  nrm.divideScalar(dist);
  const overlap = visRadius(a) + visRadius(b) - dist;
  if (overlap > 0) {
    const tot = a.m + b.m;
    a.p.addScaledVector(nrm, -overlap * (b.m / tot) - 1e-9);
    b.p.addScaledVector(nrm, overlap * (a.m / tot) + 1e-9);
  }
  const rel = b.v.clone().sub(a.v);
  const sep = rel.dot(nrm);
  if (sep > 0) return;                       // already separating
  const e = 0.55;                            // restitution
  const jImp = -(1 + e) * sep / (1 / a.m + 1 / b.m);
  a.v.addScaledVector(nrm, -jImp / a.m);
  b.v.addScaledVector(nrm, jImp / b.m);
  fx.flash(b.p, visRadius(b) * 3, [255, 220, 170], 0.25);
  // Scale the scuff with how hard they actually hit. A graze knocks a little
  // dust off the smaller body; it is real mass, so take it out of b.
  const vEsc = vEscape(a, b);
  const bump = clamp(-sep / Math.max(vEsc, 1e-9), 0, 2);
  if (bump > 0.15) {
    const n = Math.round(50 + 110 * bump);
    b.m -= ejecta(b.p, b.v, n, b.m * 0.004 * bump, vEsc,
      [255, 225, 175], [110, 100, 92], visRadius(b), { speed: 0.8 });
  }
}

function merge(a, b, vImp, vEsc) {
  const mTot = a.m + b.m;
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  // Splash some of the impactor back out as real debris. Harder accretions throw
  // out proportionally more, and a pebble landing on a planet should not look
  // like two worlds colliding, so scale by the impactor's share of the mass.
  const sev = clamp(vImp / Math.max(vEsc, 1e-9), 0, 2);
  const heft = clamp(Math.sqrt(b.m / mTot * 4), 0.1, 1);
  const spray = clamp((sev - 0.5) * 0.1, 0, 0.09);
  const ejectMass = b.m * spray;
  const count = Math.round((150 + 150 * sev) * heft);

  // Move and grow the survivor FIRST, so the ejecta is placed clear of the
  // merged body's surface rather than inside it.
  a.p.copy(com);
  a.v.copy(vel);
  a.r = Math.cbrt(a.r * a.r * a.r + b.r * b.r * b.r);

  const thrown = ejectMass > 0
    ? ejecta(com, vel, count, ejectMass, vEsc, [255, 190, 110], [96, 84, 76], visRadius(a), { speed: 1 })
    : 0;
  a.m = mTot - thrown;

  // Enough mass in one place and the physics changes character.
  let note = a.name + ' absorbed ' + b.name;
  const ev = checkEvolution(a);
  if (ev) note = a.name + EVOLVE_NOTE[ev];
  else { updateLuminosity(a); refreshVisual(a); }

  fx.flash(com, visRadius(a) * 4, [255, 210, 150], 0.7);
  toast(note);
  removeBody(b);
}

function shatter(a, b, vImp) {
  const mTot = a.m + b.m;
  const com = a.p.clone().multiplyScalar(a.m).addScaledVector(b.p, b.m).divideScalar(mTot);
  const vel = a.v.clone().multiplyScalar(a.m).addScaledVector(b.v, b.m).divideScalar(mTot);

  const vEsc = vEscape(a, b);
  const ra0 = visRadius(a);

  // Two tiers of real wreckage. A handful of large fragments become full N-body
  // objects that pull on everything; the fine ejecta becomes thousands of test
  // particles. Every gram is accounted for out of mTot.
  const fine = mTot * 0.09;
  const thrown = ejecta(com, vel, 520, fine, vEsc,
    [255, 235, 195], [104, 90, 80], ra0, { speed: 1.35, sizeMin: 1.2, sizeMax: 7.5 });

  const keep = clamp(0.35 + 0.3 * (1 - b.m / a.m), 0.2, 0.72);
  const bigFrags = Math.min(clamp(Math.round(6 + (1 - keep) * 16), 4, 18), freeSlots());
  const avail = mTot - thrown;
  const remnantM = bigFrags > 0 ? Math.min(a.m * keep, avail) : avail;
  const rubbleM = avail - remnantM;

  a.m = remnantM;
  a.p.copy(com);
  a.v.copy(vel);
  a.r = trueRadius(a.type, remnantM);
  updateLuminosity(a);
  refreshVisual(a);

  if (bigFrags > 0 && rubbleM > 0) {
    spawnDebris(com, vel, rubbleM / bigFrags, bigFrags, vImp * 0.45, visRadius(a) * 1.2);
  }
  fx.flash(com, ra0 * 7, [255, 240, 200], 1);
  toast(a.name + ' and ' + b.name + ' shattered on impact!');
  removeBody(b);
}

const freeSlots = () => Math.max(0, MAX_BODIES - sim.bodies.length);

/**
 * Correct a set of fresh fragments so they collectively carry exactly the
 * momentum they should. Random ejection directions do not cancel on their own,
 * which otherwise lets every impact quietly kick the whole system sideways.
 */
function conserveMomentum(frags, expectedP) {
  if (!frags.length) return;
  const actual = new THREE.Vector3();
  let m = 0;
  for (const f of frags) { actual.addScaledVector(f.v, f.m); m += f.m; }
  if (m <= 0) return;
  const corr = expectedP.clone().sub(actual).divideScalar(m);
  for (const f of frags) f.v.add(corr);
}

function spawnDebris(center, baseVel, massEach, count, spread, minDist) {
  const made = [];
  for (let i = 0; i < count; i++) {
    if (sim.bodies.length >= MAX_BODIES) break;
    const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.45, 0.45), rnd(-1, 1));
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const pos = center.clone().addScaledVector(dir, minDist * rnd(1.05, 2.2));
    const vel = baseVel.clone().addScaledVector(dir, spread * rnd(0.35, 1.15));
    const type = massEach > 0.004 ? 'moon' : 'asteroid';
    made.push(makeBody(type, pos, vel, { mass: Math.max(massEach, 1e-7), name: 'Debris ' + (sim.nextId), rubble: true }));
  }
  let tot = 0;
  for (const f of made) tot += f.m;
  conserveMomentum(made, baseVel.clone().multiplyScalar(tot));
  return made;
}

/* ------------------------------------------------------- growing up ------- */

const GAS_THRESHOLD = 60.1;      // M⊕ — a rocky world this heavy holds an envelope
const IGNITE_MASS = 0.075 * M_SUN;
const COLLAPSE_MASS = 25 * M_SUN;

/* Worlds that already have a thick hydrogen envelope: the gas-giant rule below
   does not apply to them, they just keep growing towards ignition. */
const GASSY_SURF = new Set(['gas', 'icegiant', 'puff', 'hycean']);

const isRocky = (b) =>
  b.kind === 'body' && !TYPES[b.type].star && !GASSY_SURF.has(TYPES[b.type].surf);

/**
 * Apply the mass ladder. Checked in descending order so a body that leaps
 * straight past several thresholds lands on the right one.
 *
 *   rock --60.1 M⊕--> gas giant --8% M☉--> star --25 M☉--> black hole
 *
 * Returns a tag for the caller's notification, or null if nothing changed.
 */
function checkEvolution(b) {
  if (!b.alive || b.kind !== 'body') return null;
  const def = TYPES[b.type];
  if (def.star) {
    // Nothing at all holds up a neutron star past the Tolman–Oppenheimer–Volkoff
    // limit, so it just goes quietly.
    if (def.surf === 'neutron') {
      if (b.m >= TOV_LIMIT * M_SUN) { becomeBlackHole(b); return 'tov'; }
      return null;
    }
    if (snSet.on) {
      // A white dwarf crossing the Chandrasekhar limit is the one supernova that
      // genuinely is triggered by mass rather than by running out of fuel — and
      // it is exactly why every Type Ia comes out the same brightness.
      if (def.surf === 'dwarfstar' && b.m >= snSet.chandra * M_SUN) {
        return goSupernova(b) ? 'snIa' : null;
      }
      if (b.m >= snSet.failMass * M_SUN) return goSupernova(b) ? 'sn' : null;
      if (snSet.massTrigger && b.m >= snSet.ccMass * M_SUN) return goSupernova(b) ? 'sn' : null;
      return null;
    }
    if (b.m >= COLLAPSE_MASS) { becomeBlackHole(b); return 'bh'; }
    return null;
  }
  if (b.m >= IGNITE_MASS) { becomeStar(b); return 'star'; }
  if (isRocky(b) && b.m >= GAS_THRESHOLD) { becomeGasGiant(b); return 'gas'; }
  return null;
}

const EVOLVE_NOTE = {
  gas: ' swelled into a gas giant!',
  star: ' ignited into a star!',
  bh: ' collapsed into a black hole!',
  sn: ' went supernova!',
  snIa: ' detonated as a Type Ia supernova!',
  tov: ' passed the neutron-star limit and collapsed into a black hole!'
};

/**
 * Past ~60 Earth masses a rocky planet's gravity can hold onto hydrogen, so it
 * puffs up into a gas giant — a real jump in radius, since gas is far less dense
 * than rock.
 */
function becomeGasGiant(b) {
  const oldR = visRadius(b);
  b.type = 'gas_giant';
  b.kind = 'body';
  b.spin = TYPES.gas_giant.spin;
  b.tilt = rnd(-0.42, 0.42);
  b.r = trueRadius('gas_giant', b.m);
  b.glowPulse = 1;                       // a few seconds of heat from collapsing in
  updateLuminosity(b);
  refreshVisual(b);
  fx.flash(b.p, Math.max(visRadius(b), oldR) * 5, [255, 214, 150], 0.95);
}

function becomeStar(b) {
  const mSun = b.m / M_SUN;
  b.type = mSun > 8 ? 'blue_giant' : mSun > 0.5 ? 'sun_like' : 'red_dwarf';
  b.kind = 'body';
  b.age = 0;
  b.temp = TYPES[b.type].temp;
  b.r = trueRadius(b.type, b.m);
  b.spin = TYPES[b.type].spin;
  updateLuminosity(b);
  refreshVisual(b);
}

function becomeBlackHole(b) {
  b.type = 'black_hole';
  b.kind = 'bh';
  b.temp = 0;
  b.lum = 0;
  b.r = schwarzschild(b.m);
  refreshVisual(b);
}

/** Shatter a body straight away — the inspector's "Shatter" button. */
function shatterBody(b) {
  if (!b.alive || b.kind === 'bh' || b.kind === 'wh') return;
  const frags = Math.min(clamp(Math.round(8 + Math.random() * 8), 6, 16), freeSlots());
  if (frags < 3) { toast('Universe is full — clear some bodies first'); return; }
  const rb = visRadius(b);
  const vEsc = Math.sqrt(2 * G * b.m / Math.max(rb, 1e-9));

  // Fine ejecta first, then split what's left between the large fragments.
  const thrown = ejecta(b.p, b.v, 520, b.m * 0.16, vEsc,
    [255, 235, 195], [104, 90, 80], rb, { speed: 1.25, sizeMin: 1.2, sizeMax: 7.5 });
  const rubble = b.m - thrown;
  if (rubble > 0) spawnDebris(b.p, b.v, rubble / frags, frags, vEsc * 0.9, rb);

  fx.flash(b.p, rb * 7, [255, 235, 190], 1);
  toast(b.name + ' was torn apart');
  if (sim.selected === b) select(null);
  removeBody(b);
  compact();
}

/* ============================================================== supernovae  */
/*
 * Two genuinely different explosions, both built from their real numbers.
 *
 *   Type Ia   A white dwarf accretes past the Chandrasekhar limit — 1.44 M☉,
 *             the most mass that electron degeneracy pressure can hold up —
 *             carbon ignites through the whole star at once, and it is torn
 *             apart completely. Nothing is left behind. ~1.5e51 erg.
 *
 *   Type II   A star over about 8 M☉ runs out of fuel. Its iron core collapses
 *   / Ib/c    in roughly a second and rebounds, blowing the envelope off at a
 *             few thousand km/s. ~1e51 erg. What remains at the centre is a
 *             neutron star, or a black hole if the star was heavy enough.
 *
 * The light does NOT come from the blast — that energy goes into motion, not
 * photons. It comes from about a tenth of a solar mass of radioactive nickel-56
 * forged in the shock, decaying to cobalt-56 and then to iron-56. That is the
 * whole reason a supernova takes weeks to brighten and months to fade.
 */

const TOV_LIMIT = 2.16;        // M☉ — heaviest a neutron star can possibly be
const PISN_LO = 130, PISN_HI = 250;   // M☉ — the pair-instability window
const SN_MAX = 6;              // concurrent explosions we keep lit
const KMS = 1000 * 86400 / 1e9;   // one km/s in Gm/day = 0.0864

const supernovae = [];
let snNextId = 1;

/* Hydrogen fusion starts at about ten million kelvin. Everything a protostar
   does — contracting, heating, glowing — is on the way to this one number. */
const IGNITE_T = 1e7;

/** A young remnant's photosphere: blue-white at first, reddening over weeks. */
const snPhotoT = (age) => lerp(16000, 4200, clamp(age / 110, 0, 1));

/* Where the expanding shell is brought to a halt, in Gm — about 400 AU.
   A real remnant ploughs into the interstellar medium, sweeps it up and slows
   down over tens of thousands of years, ending up tens of light years across.
   There is no interstellar medium here and no room for a shell that size, so
   the braking is real but the scale is compressed: the shell coasts out, slows,
   and settles somewhere you can still see all of it at once. Without this a
   remnant simply flies out of the simulation and is gone inside a year, which
   leaves nothing to select. */
const SN_STALL = 6e4;

/** Main-sequence lifetime in days: fusion power goes as ~M³·⁵ but the fuel only
 *  as M, so t ≈ 10 Gyr × (M/M☉)^−2.5. The Sun gets ten billion years; a twenty
 *  solar-mass star gets about six million. */
function msLifetime(mSun) {
  return 1e10 * Math.pow(Math.max(mSun, 0.02), -2.5) * 365.25;
}

function fmtLum(l) {
  if (!(l > 0)) return '0 L☉';
  if (l < 1000) return l.toPrecision(3) + ' L☉';
  const e = Math.floor(Math.log10(l));
  return (l / Math.pow(10, e)).toFixed(1) + '×10' + sup(e) + ' L☉';
}

/**
 * Work out what a given star would do if its core gave way right now, without
 * changing anything. Always returns { ok, … }; when ok is false, `why` explains
 * the refusal in plain language so the inspector can teach rather than just
 * grey a button out.
 */
function snPlan(b) {
  const no = (why) => ({ ok: false, why: why });
  if (!b || !b.alive || b.kind !== 'body') return no('Only a star has a core that can collapse.');
  const def = TYPES[b.type];
  if (!def.star) return no(b.name + ' is not a star — there is no core here to collapse.');
  if (def.surf === 'neutron') {
    return no('A neutron star is already what a supernova leaves behind. Feed it past ' +
      TOV_LIMIT + ' M☉ and it collapses into a black hole instead.');
  }

  const mSun = b.m / M_SUN;

  /* ---- thermonuclear: a white dwarf pushed over the edge ------------------ */
  if (def.surf === 'dwarfstar') {
    if (mSun < snSet.chandra) {
      return no(b.name + ' is ' + mSun.toPrecision(3) + ' M☉. A white dwarf only detonates once it ' +
        'accretes past the Chandrasekhar limit of ' + snSet.chandra.toFixed(2) + ' M☉ — drag the mass ' +
        'slider up and it will go by itself.');
    }
    return {
      ok: true, flavour: 'Ia', label: 'Type Ia',
      foe: 1.5, ni: 0.6, rise: 14, plateau: 0, tPlat: 0, breakout: 3e43,
      remnant: 'none', remMass: 0, life: 1100,
      hot: [255, 246, 235], cool: [255, 150, 90],
      story: 'Carbon fusion ran away through the entire star in about two seconds. Because every ' +
        'one of these goes off at the same mass, they all reach almost the same brightness — which ' +
        'is how we measure distances across the universe.'
    };
  }

  /* ---- core collapse ----------------------------------------------------- */
  if (mSun < snSet.ccMass) {
    return no(b.name + ' is ' + mSun.toPrecision(3) + ' M☉ — too light. Below about ' + snSet.ccMass +
      ' M☉ a star can never build an iron core. It swells up, puffs its outer layers off as a ' +
      'planetary nebula, and settles down as a white dwarf.');
  }

  if (snSet.pisn && mSun >= PISN_LO && mSun < PISN_HI) {
    const t = clamp((mSun - PISN_LO) / (PISN_HI - PISN_LO), 0, 1);
    return {
      ok: true, flavour: 'PISN', label: 'Pair-instability',
      foe: lerp(9, 100, t), ni: lerp(0.6, 40, t), rise: 45, plateau: 0, tPlat: 0, breakout: 2e44,
      remnant: 'none', remMass: 0, life: 1400,
      hot: [246, 232, 255], cool: [255, 96, 190],
      story: 'So hot inside that its own gamma rays were turning into electron–positron pairs. ' +
        'That robbed the core of the pressure holding it up, it contracted, and it burned all of ' +
        'its oxygen at once. The star is not left behind in any form.'
    };
  }

  if (mSun >= snSet.failMass) {
    return {
      ok: true, flavour: 'fail', label: 'Failed supernova',
      foe: 0.02, ni: 0, rise: 1, plateau: 0, tPlat: 0, breakout: 1e41,
      remnant: 'black', remMass: b.m * 0.9, life: 90,
      hot: [130, 120, 160], cool: [46, 42, 66],
      story: 'Too heavy to bounce. The core fell straight through into a black hole and swallowed ' +
        'its own shock wave — the star simply winks out instead of exploding. We have watched this ' +
        'happen to at least one real star.'
    };
  }

  const bh = mSun >= snSet.bhMass;
  const stripped = !!def.stripped;
  return {
    ok: true,
    flavour: stripped ? 'Ibc' : 'II',
    label: stripped ? 'Type Ib/c' : 'Type II',
    foe: 1,
    ni: 0.062 * (1 + (mSun - snSet.ccMass) * 0.03),
    rise: stripped ? 13 : 8,
    // A Type II sits on a plateau for ~100 days while its hydrogen envelope
    // recombines from ionised gas and releases the heat stored in the shock.
    // A stripped star has no hydrogen left, so there is no plateau at all.
    plateau: stripped ? 0 : 2.0e42,
    tPlat: stripped ? 0 : 100,
    breakout: stripped ? 4e44 : 1e44,
    remnant: bh ? 'black' : 'neutron',
    remMass: bh
      ? Math.max(3 * M_SUN, b.m * 0.3)
      : M_SUN * clamp(1.2 + (mSun - snSet.ccMass) * 0.05, 1.17, TOV_LIMIT),
    life: 1100,
    hot: stripped ? [204, 236, 255] : [222, 238, 255],
    cool: stripped ? [140, 255, 212] : [255, 105, 70],
    story: bh
      ? 'The core collapsed past everything that could have held it up. Some of the envelope fell ' +
        'back in, and what sits at the centre now is a black hole.'
      : 'The iron core collapsed in about a second and rebounded. At the centre is a neutron star: ' +
        'a ball the size of a city with more mass than the Sun, spinning many times a second.'
  };
}

/**
 * Blow a star apart. Returns the plan it used, or null if this body could not
 * explode — callers use the returned plan's label for their own message, so
 * this function stays quiet.
 */
function goSupernova(b, plan) {
  if (!b || !b.alive) return null;
  plan = plan || snPlan(b);
  if (!plan || !plan.ok) return null;

  const pos = b.p.clone();
  const vel = b.v.clone();
  const mProg = b.m;
  const r0 = Math.max(visRadius(b), b.r, 1e-6);

  /* ---- what is left at the centre --------------------------------------- */
  let kind = snSet.remnant === 'auto' ? plan.remnant : snSet.remnant;
  let remM = 0;
  if (kind === 'neutron') {
    remM = Math.min(plan.remnant === 'neutron' ? plan.remMass : mProg * 0.4, TOV_LIMIT * M_SUN);
  } else if (kind === 'black') {
    remM = plan.remnant === 'black' ? plan.remMass : mProg * 0.3;
  }
  remM = clamp(remM, 0, mProg);
  if (remM <= 0) kind = 'none';
  let ejM = mProg - remM;

  /* ---- clear room for the envelope --------------------------------------- */
  // Whatever dust is already drifting nearby is about to be overrun by the
  // blast, so it is swept up into the new shell rather than deleted: its mass
  // and its momentum both come along, and nothing goes missing from the books.
  const want = clamp(Math.round(snSet.shellSize), 1, P_MAX - 40);
  let sweptM = 0, sweptPx = 0, sweptPy = 0, sweptPz = 0;
  if (parts.free.length < want) {
    for (let k = 0; k < P_MAX && parts.free.length < want; k++) {
      if (!parts.on[k]) continue;
      const k3 = k * 3, pm = parts.m[k];
      sweptM += pm;
      sweptPx += parts.vel[k3] * pm; sweptPy += parts.vel[k3 + 1] * pm; sweptPz += parts.vel[k3 + 2] * pm;
      killParticle(k);
    }
  }
  ejM += sweptM;

  /* ---- energy, nickel, and the kick -------------------------------------- */
  const foe = Math.max(plan.foe * snSet.energy, 0);
  const eKin = foe * FOE;
  const mNi = Math.max(plan.ni * snSet.nickel, 0);

  // Newborn neutron stars are observed rocketing away at hundreds of km/s,
  // because the explosion around them is never quite symmetric. A black hole
  // gets far less of a shove for the same push, being so much heavier.
  const kickDir = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
