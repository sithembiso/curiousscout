      pos.push(t, 0, a, t, 0, b);
      pos.push(a, 0, t, b, 0, t);
      for (const [p, q] of [[t, a], [t, b], [a, t], [b, t]]) {
        const f = fade(p, q) * 0.34 * axis;
        col.push(0.42 * f, 0.55 * f, 0.95 * f);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  gridObj = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  gridObj.frustumCulled = false;
  gridObj.renderOrder = -3;
  gridObj.visible = false;
  scene.add(gridObj);
}

function updateGrid() {
  if (!gridObj) return;
  const on = !!input.armed && settings.grid && !document.body.classList.contains('modal-open');
  gridObj.visible = on;
  if (!on) { lastGridCell = 0; return; }
  // Roughly 84 screen pixels a cell, rounded to a readable number.
  gridCell = niceStep(84 * worldPerPixel(view.dist));
  gridObj.scale.setScalar(gridCell);
  // The hint line carries the cell size, so the grid is a ruler and not just
  // decoration. Only touched when it actually changes.
  if (gridCell !== lastGridCell) {
    lastGridCell = gridCell;
    for (const el of document.querySelectorAll('.an-cell')) el.textContent = fmtDist(gridCell);
  }
  // Slide with the view but stay locked to its own intersections, so the lines
  // sit still rather than swimming under the camera.
  gridObj.position.set(
    Math.round(view.target.x / gridCell) * gridCell,
    view.target.y,
    Math.round(view.target.z / gridCell) * gridCell
  );
}

/** Pull a drop point onto the nearest grid intersection. */
function snapToGrid(p) {
  if (!settings.gridSnap || !settings.grid || !gridObj || !gridObj.visible) return p;
  p.x = Math.round(p.x / gridCell) * gridCell;
  p.z = Math.round(p.z / gridCell) * gridCell;
  p.y = view.target.y;
  return p;
}

/** Push mesh scales to match the body's current (exaggerated) radius. */
function scaleVisual(b) {
  const r = visRadius(b);
  const p = b.parts;
  if (!p) return;
  if (p.surf) p.surf.scale.setScalar(r);
  if (p.cloud) p.cloud.scale.setScalar(r * 1.018);
  if (p.atmo) p.atmo.scale.setScalar(r * 1.09);
  if (p.puff) p.puff.scale.setScalar(r);
  if (p.terraSkin) p.terraSkin.scale.setScalar(r * 1.004);
  if (p.terraCloud) p.terraCloud.scale.setScalar(r * 1.024);
  if (p.terraAtmo) p.terraAtmo.scale.setScalar(r * 1.09);
  if (p.ring && b.ringSpec) p.ring.scale.setScalar(r * b.ringSpec.outer);
  if (p.disk) p.disk.scale.setScalar(r * 7);
  if (p.photon) p.photon.scale.setScalar(r * 5.6);
}

/* Held while dragging a slider, so a mid-drag transformation cannot rebuild the
   panel out from under the pointer. */
let inspectorLock = 0;

/** Rebuild a body's meshes after its type changed (ignition, collapse, …). */
function refreshVisual(b) {
  disposeVisual(b, true);
  buildVisual(b);
  if (sim.selected === b && !inspectorLock) renderInspector();
}

function disposeVisual(b, keepTrail) {
  if (b.obj) {
    scene.remove(b.obj);
    b.obj.traverse(o => {
      if (o.material) {
        if (o.material.map && o.material.map.isCanvasTexture && !cacheHasTexture(o.material.map)) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
  if (b.parts && b.parts.tail) {
    scene.remove(b.parts.tail);
    b.parts.tail.geometry.dispose();
    b.parts.tail.material.dispose();
  }
  if (b.ownGeo) b.ownGeo.dispose();
  // The ring texture belongs to this body alone and went with the traverse above.
  b.obj = null; b.parts = null; b.ownGeo = null; b.light = null; b.ringTex = null;
  if (!keepTrail) killTrail(b);
}

function cacheHasTexture(t) {
  // The process-wide sprite atlases are shared by every body in the scene, so
  // tearing one body down must never free them.
  if (t === TEX_GLOW || t === TEX_HALO || t === TEX_TAIL || t === TEX_PHOTON || t === TEX_PUFF) return true;
  for (const v of texCache.values()) if (v === t) return true;
  return false;
}

/* ================================================================= the sky   */

const SKY_R = 1.5e6;
let skyGroup;

function buildSky() {
  skyGroup = new THREE.Group();
  scene.add(skyGroup);

  const N = 4400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const r = mulberry32(20260729);

  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i % 5 < 2) {
      // a crowded band, so the sky has a Milky Way through it
      const th = r() * TAU;
      const el = (r() + r() + r() - 1.5) * 0.19;
      const cy = Math.cos(el);
      x = Math.cos(th) * cy; y = Math.sin(el); z = Math.sin(th) * cy;
    } else {
      const u = r() * 2 - 1, th = r() * TAU, s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = u; z = s * Math.sin(th);
    }
    pos[i * 3] = x * SKY_R; pos[i * 3 + 1] = y * SKY_R; pos[i * 3 + 2] = z * SKY_R;

    const c = kelvinToRGB(2600 + Math.pow(r(), 2.2) * 17000);
    const bright = 0.22 + Math.pow(r(), 2.6) * 0.95;
    col[i * 3] = c[0] / 255 * bright;
    col[i * 3 + 1] = c[1] / 255 * bright;
    col[i * 3 + 2] = c[2] / 255 * bright;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  // depthTest stays ON: the sky sits in the transparent pass, which draws after
  // opaque bodies, so without it the stars would paint over every planet.
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
  }));
  stars.frustumCulled = false;
  stars.renderOrder = -10;
  skyGroup.add(stars);

  // A few faint nebulae for depth.
  const neb = [[0x6a3ba8, 0.10], [0x2f6ea8, 0.09], [0xa8407a, 0.08], [0x2f8f8a, 0.07], [0x8a4a2f, 0.06]];
  for (let i = 0; i < neb.length; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_HALO, color: new THREE.Color(neb[i][0]), opacity: neb[i][1],
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: true
    }));
    const u = r() * 2 - 1, th = r() * TAU, sr = Math.sqrt(1 - u * u);
    s.position.set(sr * Math.cos(th), u * 0.5, sr * Math.sin(th)).multiplyScalar(SKY_R * 0.92);
    s.scale.setScalar(SKY_R * rnd(0.5, 1.1));
    s.renderOrder = -11;
    skyGroup.add(s);
  }
}

/* ============================================================ star lighting */
/* A fixed pool of lights keeps the shader's light count constant, which avoids
   a program recompile (and a visible hitch) every time a star is added.       */

const LIGHT_POOL = 3;
const starLights = [];

function initLights() {
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = new THREE.PointLight(0xffffff, 0, 0, 1);
    l.position.set(0, 0, 0);
    scene.add(l);
    starLights.push(l);
  }
}

function updateLights() {
  const stars = sim.starCache;
  const ranked = stars.slice().sort((a, b) => b.lum - a.lum);
  for (let i = 0; i < LIGHT_POOL; i++) {
    const l = starLights[i], s = ranked[i];
    if (!s) { l.intensity = 0; continue; }
    l.position.copy(s.p);
    if (s.lightColor) l.color.copy(s.lightColor);
    // Distance falloff is deliberately off: with real inverse-square light,
    // anything past a few AU would be pitch black and unusable.
    l.intensity = clamp(1.15 + Math.log10(Math.max(s.lum, 1e-4)) * 0.17, 0.4, 2.2);
  }
}

/* ================================================================== effects */

/* ========================================================== debris particles */
/*
 * These are real physical objects, not decoration. Each particle carries a mass
 * in M⊕ and a velocity in Gm/day, and is integrated by the same leapfrog step as
 * the planets. So debris genuinely orbits, settles into rings, rains back onto
 * the world that threw it, and spirals into black holes — and when a body
 * swallows a particle it actually gains that mass.
 *
 * The one simplification: particles do not attract EACH OTHER. They are test
 * particles, feeling gravity only from the heaviest bodies. That turns the cost
 * from O(P²) into O(P × M), which is what makes thousands of them affordable.
 */

const P_MAX = 2400;
const P_SOURCES = 6;          // only the heaviest bodies pull on debris
const P_MAX_STEPS = 20;       // substep ceiling per frame, for the cost bound
const P_CULL = 1.4e5;         // Gm — debris past this has left the system

const parts = {
  pos: null, vel: null, m: null, size: null, bsize: null, hot: null, crate: null,
  col: null, warm: null, cool: null, on: null, src: null,
  free: [], live: 0, geo: null, pts: null, dirty: false
};

/* Impact ejecta cools in a day or two. Supernova ejecta is radioactive and stays
   lit for months, so how fast a grain fades is stored per particle. */
const COOL_IMPACT = 1 / 1.6;

const flashes = [];

/* A per-particle size attribute: one uniform dot size reads as a flat cloud,
   whereas mixing fine grit with fat glowing chunks reads as debris. */
const FX_VERT = `
  attribute vec3 aCol;
  attribute float aSize;
  uniform float uDpr;
  varying vec3 vCol;
  void main() {
    vCol = aCol;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uDpr;
  }`;

const FX_FRAG = `
  uniform sampler2D uMap;
  varying vec3 vCol;
  void main() {
    // Additive blending multiplies by alpha, so the soft falloff comes from the
    // texture while vCol carries the glow as the fragment cools.
    gl_FragColor = vec4(vCol, texture2D(uMap, gl_PointCoord).a);
  }`;

function initParticles() {
  parts.pos = new Float32Array(P_MAX * 3);
  parts.vel = new Float32Array(P_MAX * 3);      // Gm per day — real physics
  parts.col = new Float32Array(P_MAX * 3);
  parts.warm = new Float32Array(P_MAX * 3);     // freshly ejected, glowing
  parts.cool = new Float32Array(P_MAX * 3);     // cold rock
  parts.m = new Float32Array(P_MAX);
  parts.size = new Float32Array(P_MAX);
  parts.bsize = new Float32Array(P_MAX);
  parts.hot = new Float32Array(P_MAX);
  parts.crate = new Float32Array(P_MAX);
  parts.on = new Uint8Array(P_MAX);
  // Which supernova remnant a grain belongs to, or -1 for ordinary impact
  // debris. That is what lets a cloud know how much mass it still has, and lets
  // it hand exactly that mass over when it collapses into a star.
  parts.src = new Int16Array(P_MAX);
  parts.free.length = 0;
  for (let i = P_MAX - 1; i >= 0; i--) parts.free.push(i);
  parts.live = 0;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(parts.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(parts.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(parts.size, 1));
  parts.geo = geo;
  parts.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uMap: { value: TEX_GLOW }, uDpr: { value: VIEW.dpr } },
    vertexShader: FX_VERT, fragmentShader: FX_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  parts.pts.frustumCulled = false;
  parts.pts.renderOrder = 5;
  scene.add(parts.pts);

  for (let i = 0; i < 14; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0
    }));
    s.visible = false;
    s.renderOrder = 7;
    scene.add(s);
    flashes.push({ sprite: s, life: 0, max: 1, size: 1 });
  }
  initForms();
}

/* ====================================================== formation animation */
/*
 * What it looks like when something is born.
 *
 * A world does not appear; it falls together. So a new planet or star arrives
 * inside a swirling shell of dust that spirals inward, spinning faster and
 * faster as it shrinks — because that is what conservation of angular momentum
 * makes it do, and it is the same reason a figure skater speeds up when they
 * pull their arms in. It closes on the body, lights up, and flashes out.
 */

const FORM_POOL = 4;
const forms = [];

/** A unit-radius swirl of infalling dust: thick, ragged and lopsided. */
function formGeometry(seed) {
  const key = 'form:' + seed;
  if (geoCache.has(key)) return geoCache.get(key);
  const rng = mulberry32(hashStr(key));
  const gauss = () => (rng() + rng() + rng() - 1.5) * 0.7;
  const pos = [], col = [], siz = [];
  const HOT = [1.0, 0.95, 0.78], MID = [1.0, 0.58, 0.22], COLD = [0.42, 0.34, 0.72];

  for (let i = 0; i < 1600; i++) {
    // Weighted outward, so the cloud reads as a shell closing in rather than a
    // solid ball that merely gets smaller.
    const r = 0.30 + Math.pow(rng(), 0.6) * 0.70;
    const th = rng() * TAU;
    // Trailing streamers: the further out a mote is, the further behind it lags.
    const lag = r * 2.6;
    const x = Math.cos(th + lag) * r, z = Math.sin(th + lag) * r;
    const y = gauss() * (0.05 + r * 0.30);
    pos.push(x, y, z);
    const c = r < 0.55 ? mix(HOT, MID, (r - 0.30) / 0.25) : mix(MID, COLD, (r - 0.55) / 0.45);
    const j = 0.7 + rng() * 0.6;
    col.push(c[0] * j, c[1] * j, c[2] * j);
    // Fine grains, deliberately. Big soft puffs read as fog rather than as dust
    // being pulled in, and up close they blur into one wash.
    siz.push(0.012 + Math.pow(rng(), 2.2) * 0.055);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
  geoCache.set(key, g);
  return g;
}

function initForms() {
  for (let i = 0; i < FORM_POOL; i++) {
    const grp = new THREE.Group();
    const swirl = new THREE.Points(formGeometry(i), new THREE.ShaderMaterial({
      uniforms: { uMap: { value: TEX_PUFF }, uOp: { value: 0 }, uScale: { value: 1 }, uFocal: { value: 1 } },
      vertexShader: NEB_VERT, fragmentShader: NEB_FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    swirl.frustumCulled = false;
    swirl.renderOrder = 6;
    grp.add(swirl);

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, blending: THREE.AdditiveBlending, transparent: true,
      depthWrite: false, depthTest: false, opacity: 0
    }));
    core.renderOrder = 8;
    grp.add(core);

    grp.visible = false;
    scene.add(grp);
    forms.push({ grp: grp, swirl: swirl, core: core, life: 0, max: 1, size: 1, body: null, spin: 0 });
  }
}

function updateForms(realDt) {
  for (let i = 0; i < forms.length; i++) {
    const f = forms[i];
    if (f.life <= 0) continue;
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);          // 1 at the start, 0 at the end

    // Ride along with whatever is being born — a new planet is already moving.
    if (f.body && f.body.alive) f.grp.position.copy(f.body.p);

    if (f.life <= 0) {
      f.grp.visible = false;
      f.body = null;
      fx.flash(f.grp.position, f.size * 2.6, f.flashCol, 1);
      continue;
    }

    // Free-fall inward: slow at first, then a rush at the end.
    const R = f.size * (0.10 + 1.25 * Math.pow(t, 1.7));
    f.swirl.scale.setScalar(R);
    // Angular momentum is conserved, so as it draws in it whirls up.
    f.spin += (0.7 + 7 * (1 - t)) * realDt;
    f.swirl.rotation.y = f.spin;

    const u = f.swirl.material.uniforms;
    u.uScale.value = R;
    u.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
    // Fades up quickly, then thins out as the last of it lands.
    const fadeIn = clamp((1 - t) / 0.10, 0, 1);
    const fadeOut = clamp(t / 0.22, 0, 1);
    u.uOp.value = 0.55 * fadeIn * fadeOut;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(f.grp.position), 1e-9));
    f.core.scale.setScalar(Math.max(f.size * (0.10 + 0.55 * Math.pow(1 - t, 2)), 8 * wpp));
    f.core.material.opacity = Math.pow(1 - t, 2.4);
  }
}

/**
 * Throw a cloud of real debris out of a point.
 *
 * `totalMass` is genuinely removed from the parent body and handed to the
 * particles, so the caller must subtract whatever this returns. Speeds are
 * spread around the parent's escape velocity, which is what makes the result
 * interesting: the slow half rains back down, the middle settles into a ring,
 * and the fastest escapes altogether.
 *
 * Returns the mass actually used — less than requested if the pool is full.
 */
function ejecta(center, baseVel, count, totalMass, vEsc, hotCol, coolCol, radius, opts) {
  const o = opts || {};
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const sMin = o.sizeMin != null ? o.sizeMin : 1.5;
  const sMax = o.sizeMax != null ? o.sizeMax : 6.5;
  const push = o.speed != null ? o.speed : 1;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    // uniform direction on the sphere
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sr * Math.cos(th), dy = u, dz = sr * Math.sin(th);

    // Power law, so most fragments are slow and a few really fly.
    const frac = Math.pow(Math.random(), 1.9);
    const sp = vEsc * push * (0.55 + frac * 1.9);

    // Start clear of the surface. Spawned inside the collision radius, a grain
    // is absorbed on the very next step and the whole burst vanishes at once.
    const off = radius * rnd(1.15, 2.3);
    parts.pos[k3] = center.x + dx * off;
    parts.pos[k3 + 1] = center.y + dy * off;
    parts.pos[k3 + 2] = center.z + dz * off;

    parts.vel[k3] = baseVel.x + dx * sp;
    parts.vel[k3 + 1] = baseVel.y + dy * sp;
    parts.vel[k3 + 2] = baseVel.z + dz * sp;

    // Fast fragments are the fine grit; slow ones are the big glowing chunks.
    const bs = lerp(sMax, sMin, frac) * rnd(0.75, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], frac * rnd(0, 0.6));
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/* The colours a protoplanetary disc is painted in, as 0–255 ramp stops: white
   hot where it is falling inward, orange, then dusty rose and cold blue at the
   rim. Impact vapour is the same stuff at the same temperatures, so it is
   coloured off the same ramp — which is not a coincidence. Every disc IS the
   vapour and dust of things that hit each other. */
const DISC_RAMP = [
  [0.00, [255, 240, 196]], [0.22, [255, 176, 80]], [0.45, [255, 118, 34]],
  [0.72, [150, 62, 104]], [1.00, [46, 82, 184]]
];

/**
 * Throw out a cloud of GAS AND VAPOUR rather than rock.
 *
 * A real impact between two worlds does not just make gravel. Most of what
 * comes off is rock flash-boiled into vapour — the energy is far past what it
 * takes to melt, let alone vaporise — and that vapour is what settles into a
 * disc and later condenses back into moons. So collisions here release more
 * mass as gas than they do as solid fragments, and the gas is drawn as big,
 * soft, slow-cooling puffs in the disc's own colours instead of sharp grit.
 */
function gasEjecta(center, baseVel, count, totalMass, vEsc, radius, opts) {
  const o = opts || {};
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;
  const push = o.speed != null ? o.speed : 1.15;
  const sMin = o.sizeMin != null ? o.sizeMin : 6;
  const sMax = o.sizeMax != null ? o.sizeMax : 26;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = sr * Math.cos(th), dy = u * (o.flat != null ? o.flat : 1), dz = sr * Math.sin(th);

    // Gas leaves faster and far more evenly than rubble does — it is pushed by
    // its own pressure, not thrown.
    const frac = Math.pow(Math.random(), 1.15);
    const sp = vEsc * push * (0.4 + frac * 1.5);

    const off = radius * rnd(1.05, 2.6);
    parts.pos[k3] = center.x + dx * off;
    parts.pos[k3 + 1] = center.y + dy * off;
    parts.pos[k3 + 2] = center.z + dz * off;
    parts.vel[k3] = baseVel.x + dx * sp;
    parts.vel[k3 + 1] = baseVel.y + dy * sp;
    parts.vel[k3 + 2] = baseVel.z + dz * sp;

    // Fat and soft. A vapour plume has no edges, so the puffs have to be wide
    // enough to run into one another and read as one cloud.
    const bs = lerp(sMax, sMin, Math.random()) * rnd(0.7, 1.3);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    // Vapour stays lit far longer than a cooling pebble does.
    parts.crate[k] = COOL_IMPACT * 0.22;
    parts.src[k] = -1;

    // The fastest gas is the hottest and sits at the white end of the ramp.
    const w = ramp(DISC_RAMP, clamp(1 - frac + rnd(-0.12, 0.12), 0, 1));
    const c = ramp(DISC_RAMP, clamp(0.86 + rnd(0, 0.14), 0, 1));
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = c[0] / 510; parts.cool[k3 + 1] = c[1] / 510; parts.cool[k3 + 2] = c[2] / 510;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Release fine debris into a ring around `P`, the way tides actually shear a
 * moon apart. Each grain is placed on the moon's orbit and given the local
 * circular velocity, so it settles into a genuine ring rather than a puff — and
 * because grains at slightly different radii have different periods, the arc
 * shears itself into a complete ring over the following orbits.
 */
function ringEjecta(center, srcVel, P, count, totalMass, arc, hotCol, coolCol) {
  const n = Math.min(count, parts.free.length);
  if (n <= 0 || totalMass <= 0) return 0;
  const each = totalMass / n;

  const rel = center.clone().sub(P.p);
  const d0 = rel.length();
  if (d0 < 1e-9) return 0;
  const radial = rel.clone().divideScalar(d0);

  // tangential direction from the moon's own motion about the primary
  const vrel = srcVel.clone().sub(P.v);
  const tang = vrel.clone().addScaledVector(radial, -vrel.dot(radial));
  if (tang.lengthSq() < 1e-18) tang.crossVectors(new THREE.Vector3(0, 1, 0), radial);
  tang.normalize();
  const normal = new THREE.Vector3().crossVectors(radial, tang).normalize();

  const mu = G * settings.gravity * P.m;

  for (let i = 0; i < n; i++) {
    const k = parts.free.pop();
    const k3 = k * 3;

    const th = (Math.random() - 0.5) * 2 * arc;
    const r = d0 * (1 + rnd(-0.06, 0.06));
    const ct = Math.cos(th), st = Math.sin(th);

    const outX = radial.x * ct + tang.x * st;
    const outY = radial.y * ct + tang.y * st;
    const outZ = radial.z * ct + tang.z * st;
    const dirX = -radial.x * st + tang.x * ct;
    const dirY = -radial.y * st + tang.y * ct;
    const dirZ = -radial.z * st + tang.z * ct;

    const tilt = rnd(-0.012, 0.012) * d0;
    parts.pos[k3] = P.p.x + outX * r + normal.x * tilt;
    parts.pos[k3 + 1] = P.p.y + outY * r + normal.y * tilt;
    parts.pos[k3 + 2] = P.p.z + outZ * r + normal.z * tilt;

    const vc = Math.sqrt(mu / r) * rnd(0.985, 1.015);
    parts.vel[k3] = P.v.x + dirX * vc;
    parts.vel[k3 + 1] = P.v.y + dirY * vc;
    parts.vel[k3 + 2] = P.v.z + dirZ * vc;

    const bs = rnd(1.4, 5.5);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 0.5;
    parts.crate[k] = COOL_IMPACT;
    parts.src[k] = -1;

    const w = mix(hotCol, [255, 255, 255], Math.random() * 0.4);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = coolCol[0] / 255; parts.cool[k3 + 1] = coolCol[1] / 255; parts.cool[k3 + 2] = coolCol[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }
  parts.dirty = true;
  return each * n;
}

/**
 * Blow a shell of real matter outward — a supernova envelope, or the far gentler
 * puff of a planetary nebula.
 *
 * Speeds are drawn from a broken power law (most of the mass slow, a thin skin
 * very fast) and then multiplied by one common factor chosen so the shell's
 * total kinetic energy comes out at exactly `eKin`. That single normalisation
 * is what ties the picture to the physics: hand it 1e51 erg and ten solar
 * masses and a few thousand km/s falls out on its own, with no fudge factor
 * anywhere. Pass `vMean` instead to aim for a mean speed directly.
 *
 * Every gram of `totalMass` is launched no matter how few slots are left — the
 * fragments just get chunkier — so mass is conserved exactly. Returns null only
 * when the pool is completely full, which is the caller's cue to keep the mass.
 */
function blastShell(center, baseVel, want, totalMass, opts) {
  const o = opts || {};
  const n = Math.min(want, parts.free.length);
  if (n <= 0 || totalMass <= 0) return null;
  const each = totalMass / n;

  const hot = o.hot || [235, 245, 255];
  const cool = o.cool || [255, 108, 62];
  const sMin = o.sizeMin != null ? o.sizeMin : 1.6;
  const sMax = o.sizeMax != null ? o.sizeMax : 8.5;
  const r0 = o.r0 != null ? o.r0 : 0;
  const crate = 1 / Math.max(o.coolDays || 45, 1e-3);
  const src = o.src != null ? o.src : -1;

  // ---- shape the velocity spectrum first, then scale it to the energy budget
  const idx = new Int32Array(n);
  const dir = new Float32Array(n * 3);
  const x = new Float32Array(n);
  let sumX = 0, sumX2 = 0;
  for (let i = 0; i < n; i++) {
    idx[i] = parts.free.pop();
    const u = rnd(-1, 1), th = rnd(0, TAU), sr = Math.sqrt(Math.max(0, 1 - u * u));
    dir[i * 3] = sr * Math.cos(th); dir[i * 3 + 1] = u; dir[i * 3 + 2] = sr * Math.sin(th);
    const s = 0.35 + Math.pow(Math.random(), 2.2) * 2.2;
    x[i] = s; sumX += s; sumX2 += s * s;
  }
  // ½·each·Σ(αx)² = eKin  →  α = √(2·eKin / (each·Σx²))
  const alpha = o.vMean != null
    ? o.vMean * n / Math.max(sumX, 1e-12)
    : Math.sqrt(2 * Math.max(o.eKin || 0, 0) / Math.max(each * sumX2, 1e-30));

  let vMax = 0;
  for (let i = 0; i < n; i++) {
    const k = idx[i], k3 = k * 3, d3 = i * 3;
    const sp = alpha * x[i];
    if (sp > vMax) vMax = sp;

    // A thin shell, not a filled ball: the star's envelope really is a skin.
    const off = r0 * rnd(1, 1.35);
    parts.pos[k3] = center.x + dir[d3] * off;
    parts.pos[k3 + 1] = center.y + dir[d3 + 1] * off;
    parts.pos[k3 + 2] = center.z + dir[d3 + 2] * off;

    parts.vel[k3] = baseVel.x + dir[d3] * sp;
    parts.vel[k3 + 1] = baseVel.y + dir[d3 + 1] * sp;
    parts.vel[k3 + 2] = baseVel.z + dir[d3 + 2] * sp;

    const bs = lerp(sMax, sMin, clamp((x[i] - 0.35) / 2.2, 0, 1)) * rnd(0.8, 1.25);
    parts.bsize[k] = bs;
    parts.size[k] = bs;
    parts.m[k] = each;
    parts.hot[k] = 1;
    parts.crate[k] = crate;
    parts.src[k] = src;

    const w = mix(hot, [255, 255, 255], Math.random() * 0.35);
    parts.warm[k3] = w[0] / 255; parts.warm[k3 + 1] = w[1] / 255; parts.warm[k3 + 2] = w[2] / 255;
    parts.cool[k3] = cool[0] / 255; parts.cool[k3 + 1] = cool[1] / 255; parts.cool[k3 + 2] = cool[2] / 255;
    parts.col[k3] = parts.warm[k3]; parts.col[k3 + 1] = parts.warm[k3 + 1]; parts.col[k3 + 2] = parts.warm[k3 + 2];

    parts.on[k] = 1;
    parts.live++;
  }

  // Random directions do not cancel, so nudge the whole shell onto the momentum
  // it is supposed to carry. The nudge is ~1/√n of a typical speed, which costs
  // well under a percent of the energy just set above.
  const wantP = o.netP || baseVel.clone().multiplyScalar(totalMass);
  let px = 0, py = 0, pz = 0;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    px += parts.vel[k3] * each; py += parts.vel[k3 + 1] * each; pz += parts.vel[k3 + 2] * each;
  }
  const cx = (wantP.x - px) / totalMass, cy = (wantP.y - py) / totalMass, cz = (wantP.z - pz) / totalMass;
  for (let i = 0; i < n; i++) {
    const k3 = idx[i] * 3;
    parts.vel[k3] += cx; parts.vel[k3 + 1] += cy; parts.vel[k3 + 2] += cz;
  }

  parts.dirty = true;
  return { n: n, each: each, vMean: alpha * sumX / n, vMax: vMax };
}

function killParticle(k) {
  const k3 = k * 3;
  parts.on[k] = 0;
  parts.src[k] = -1;
  parts.m[k] = 0;
  parts.size[k] = 0;
  parts.col[k3] = parts.col[k3 + 1] = parts.col[k3 + 2] = 0;
  parts.free.push(k);
  parts.live--;
  parts.dirty = true;
}

function clearParticles() {
  for (let k = 0; k < P_MAX; k++) if (parts.on[k]) killParticle(k);
}

/* The heaviest bodies are the only meaningful gravity sources for debris;
   refreshed once per frame rather than per substep. */
let pSources = [];
const grewBodies = new Set();

/* Running total of the force the debris exerts back on each source, so the
   sources can be given their share of it once per step. */
const pReact = new Float64Array(P_SOURCES * 3);

function refreshSources() {
  pSources = sim.bodies.length <= P_SOURCES
    ? sim.bodies.slice()
    : sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, P_SOURCES);
}

/**
 * Integrate the debris with the same timestep as the planets. Symplectic Euler
 * (kick then drift) — one force evaluation per step, and stable for orbits.
 */
function stepParticles(dt) {
  if (parts.live === 0) return;
  const src = pSources, ns = src.length;
  const gm = G * settings.gravity;
  const pos = parts.pos, vel = parts.vel;
  pReact.fill(0);

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    const px = pos[k3], py = pos[k3 + 1], pz = pos[k3 + 2];
    const pm = parts.m[k];
    let ax = 0, ay = 0, az = 0, hit = null;

    for (let s = 0; s < ns; s++) {
      const b = src[s];
      if (!b.alive) continue;
      const dx = b.p.x - px, dy = b.p.y - py, dz = b.p.z - pz;
      const d2 = dx * dx + dy * dy + dz * dz;
      const rv = visRadius(b);
      if (d2 < rv * rv) { hit = b; break; }          // landed / swallowed
      const soft = 0.35 * b.r;
      const dd = d2 + soft * soft;
      const f = gm * b.m / (dd * Math.sqrt(dd)) * (b.kind === 'wh' ? -1 : 1);
      const fx = dx * f, fy = dy * f, fz = dz * f;
      ax += fx; ay += fy; az += fz;
      // Newton's third law. A grain of impact dust pulling back on a planet is
      // far too faint to matter, but supernova ejecta runs to thousands of Earth
      // masses per grain — letting that accelerate for free would quietly shove
      // the whole system sideways.
      const s3 = s * 3;
      pReact[s3] -= fx * pm; pReact[s3 + 1] -= fy * pm; pReact[s3 + 2] -= fz * pm;
    }

    if (hit) {
      // A perfectly inelastic catch: the grain hands over its momentum as well
      // as its mass. It barely registers for impact dust, but supernova ejecta
      // arrives at thousands of km/s and genuinely shoves what it lands on.
      const pm = parts.m[k];
      const mNew = hit.m + pm;
      if (mNew > 0) {
        hit.v.x = (hit.v.x * hit.m + vel[k3] * pm) / mNew;
        hit.v.y = (hit.v.y * hit.m + vel[k3 + 1] * pm) / mNew;
        hit.v.z = (hit.v.z * hit.m + vel[k3 + 2] * pm) / mNew;
      }
      hit.m = mNew;
      grewBodies.add(hit);
      killParticle(k);
      continue;
    }

    vel[k3] += ax * dt; vel[k3 + 1] += ay * dt; vel[k3 + 2] += az * dt;
    pos[k3] += vel[k3] * dt; pos[k3 + 1] += vel[k3 + 1] * dt; pos[k3 + 2] += vel[k3 + 2] * dt;
  }

  // Hand the sources the recoil the debris just earned them.
  for (let s = 0; s < ns; s++) {
    const b = src[s], s3 = s * 3;
    if (!b.alive || b.m <= 0) continue;
    const inv = dt / b.m;
    b.v.x += pReact[s3] * inv;
    b.v.y += pReact[s3 + 1] * inv;
    b.v.z += pReact[s3 + 2] * inv;
  }
  parts.dirty = true;
}

/** Cool the glow, refresh colours, and drop anything that has left the system. */
function updateParticles(simDt) {
  if (parts.live === 0 && !parts.dirty) return;
  const anchor = pSources.length ? pSources[0].p : null;

  for (let k = 0; k < P_MAX; k++) {
    if (!parts.on[k]) continue;
    const k3 = k * 3;
    if (anchor) {
      const dx = parts.pos[k3] - anchor.x, dy = parts.pos[k3 + 1] - anchor.y, dz = parts.pos[k3 + 2] - anchor.z;
      if (dx * dx + dy * dy + dz * dz > P_CULL * P_CULL) { killParticle(k); continue; }
    }
    const h = parts.hot[k] > 0 ? Math.max(0, parts.hot[k] - simDt * parts.crate[k]) : 0;
    parts.hot[k] = h;
    const g = Math.pow(h, 0.55);
    parts.col[k3] = lerp(parts.cool[k3], parts.warm[k3], g);
    parts.col[k3 + 1] = lerp(parts.cool[k3 + 1], parts.warm[k3 + 1], g);
    parts.col[k3 + 2] = lerp(parts.cool[k3 + 2], parts.warm[k3 + 2], g);
    parts.size[k] = parts.bsize[k] * (0.7 + 0.3 * g);
  }

  parts.geo.attributes.position.needsUpdate = true;
  parts.geo.attributes.aCol.needsUpdate = true;
  parts.geo.attributes.aSize.needsUpdate = true;
  parts.pts.material.uniforms.uDpr.value = VIEW.dpr;
  parts.dirty = parts.live > 0;

  // Bodies that ate debris need their radius (and mesh) brought up to date.
  if (grewBodies.size) {
    for (const b of grewBodies) {
      if (!b.alive) continue;
      if (b.kind === 'bh') b.r = schwarzschild(b.m);
      else b.r = natRadius(b);
      // Enough swallowed debris can push a body over a threshold too.
      const ev = checkEvolution(b);
      if (ev) toast(b.name + EVOLVE_NOTE[ev]);
      else { updateLuminosity(b); scaleVisual(b); }
    }
    grewBodies.clear();
  }
}

const fx = {
  flash(pos, size, color, strength) {
    let f = null;
    for (let i = 0; i < flashes.length; i++) if (flashes[i].life <= 0) { f = flashes[i]; break; }
    if (!f) f = flashes[(Math.random() * flashes.length) | 0];
    f.life = f.max = 0.55;
    f.size = size;
    f.strength = strength;
    f.sprite.position.copy(pos);
    f.sprite.material.color.setRGB(color[0] / 255, color[1] / 255, color[2] / 255);
    f.sprite.visible = true;
  },

  /**
   * Play the birth animation on `b`. `star` picks the hotter, whiter palette
   * and a longer wind-up, because a star takes rather more falling together
   * than a planet does.
   */
  form(b, star) {
    let f = null;
    for (let i = 0; i < forms.length; i++) if (forms[i].life <= 0) { f = forms[i]; break; }
    // All four busy: steal the one closest to finishing rather than skipping it.
    if (!f) { f = forms[0]; for (const g of forms) if (g.life < f.life) f = g; }
    f.life = f.max = star ? 2.2 : 1.5;
    f.size = Math.max(visRadius(b) * (star ? 14 : 11), 34 * worldPerPixel(
      Math.max(camera.position.distanceTo(b.p), 1e-9)));
    f.body = b;
    f.spin = Math.random() * TAU;
    f.flashCol = star ? [255, 244, 224] : [255, 214, 150];
    f.core.material.color.setRGB(1, star ? 0.95 : 0.82, star ? 0.86 : 0.55);
    f.grp.position.copy(b.p);
    f.grp.visible = true;
  }
};

function updateFx(realDt, simDt) {
  updateForms(realDt);
  for (let i = 0; i < flashes.length; i++) {
    const f = flashes[i];
    if (f.life <= 0) { if (f.sprite.visible) f.sprite.visible = false; continue; }
    f.life -= realDt;
    const t = clamp(f.life / f.max, 0, 1);
    f.sprite.material.opacity = t * t * (f.strength || 1);
    f.sprite.scale.setScalar(f.size * (1.9 - t));
    if (f.life <= 0) f.sprite.visible = false;
  }
}

/* =================================================================== trails */

const TRAIL_CAP = 320;
const MAX_TRAILS = 28;
let trailTick = 0;

function buildTrail(b) { b.trail = null; }

function makeTrail(b) {
  const arr = new Float32Array(TRAIL_CAP * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: new THREE.Color(SWATCH[b.type] || '#ffffff'),
    transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  line.frustumCulled = false;
  line.renderOrder = 1;
  scene.add(line);
  b.trail = { arr, geo, line, n: 0 };
}

function killTrail(b) {
  if (!b.trail) return;
  scene.remove(b.trail.line);
  b.trail.geo.dispose();
  b.trail.line.material.dispose();
  b.trail = null;
}

function updateTrails() {
  if (!settings.trails) {
    for (const b of sim.bodies) if (b.trail) killTrail(b);
    return;
  }
  // Only the most significant bodies get a trail, so the line count stays sane.
  const ranked = sim.bodies.slice().sort((a, b) => b.m - a.m).slice(0, MAX_TRAILS);
  const keep = new Set(ranked);
  for (const b of sim.bodies) {
    if (!keep.has(b) && b.trail) killTrail(b);
    if (keep.has(b) && !b.trail) makeTrail(b);
  }
  trailTick++;
  if (trailTick % 2) return;
  for (const b of ranked) {
    const t = b.trail;
    if (!t) continue;
    if (t.n < TRAIL_CAP) {
      const i = t.n * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
      t.n++;
    } else {
      t.arr.copyWithin(0, 3);
      const i = (TRAIL_CAP - 1) * 3;
      t.arr[i] = b.p.x; t.arr[i + 1] = b.p.y; t.arr[i + 2] = b.p.z;
    }
    t.geo.setDrawRange(0, t.n);
    t.geo.attributes.position.needsUpdate = true;
  }
}

function clearTrails() {
  for (const b of sim.bodies) if (b.trail) { b.trail.n = 0; b.trail.geo.setDrawRange(0, 0); }
}

/* ========================================================== lensing pass    */

let rt = null, postScene = null, postCam = null, postMat = null, postOK = false;

const LENS_FRAG = `
  uniform sampler2D tDiffuse;
  uniform vec3 uHoles[4];
  uniform int uCount;
  uniform float uAspect;
  varying vec2 vUv;
  void main() {
    vec2 uv = vUv;
    float dark = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= uCount) break;
      vec3 h = uHoles[i];
      if (h.z <= 0.0) continue;
      vec2 d = (uv - h.xy) * vec2(uAspect, 1.0);
      float r = length(d);
      if (r < 1e-5) continue;
      float rs = h.z;
      // light bends more the closer it passes; taper it off far from the hole
      float defl = (rs * rs) / max(r, rs * 0.4) * 1.5;
      defl *= exp(-r / (rs * 8.0));
      uv -= (d / r) / vec2(uAspect, 1.0) * defl;
      dark = max(dark, smoothstep(rs * 1.04, rs * 0.92, r));
    }
    vec4 c = texture2D(tDiffuse, clamp(uv, vec2(0.001), vec2(0.999)));
    gl_FragColor = vec4(c.rgb * (1.0 - dark), 1.0);
  }`;

const LENS_VERT = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function initPost() {
  try {
    rt = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, stencilBuffer: false, depthBuffer: true
    });
    postMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rt.texture },
        uHoles: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
        uCount: { value: 0 },
        uAspect: { value: 1 }
      },
      vertexShader: LENS_VERT, fragmentShader: LENS_FRAG, depthTest: false, depthWrite: false
    });
    postScene = new THREE.Scene();
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
    postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postOK = true;
  } catch (e) {
    postOK = false;
  }
}

const _proj = new THREE.Vector3();

function gatherHoles() {
  let n = 0;
  const out = postMat ? postMat.uniforms.uHoles.value : null;
  if (!out) return 0;
  for (let i = 0; i < sim.bodies.length && n < 4; i++) {
    const b = sim.bodies[i];
    if (b.kind !== 'bh') continue;
    _proj.copy(b.p).project(camera);
    if (_proj.z < -1 || _proj.z > 1) continue;
    const dist = camera.position.distanceTo(b.p);
    // shadow radius expressed in the same units as the vertical 0..1 screen axis
    const rs = visRadius(b) / (dist * Math.tan(FOV * Math.PI / 360)) * 0.5;
    if (rs < 0.0015 || rs > 3) continue;
    const sx = (_proj.x + 1) * 0.5, sy = (_proj.y + 1) * 0.5;
    if (sx < -1 || sx > 2 || sy < -1 || sy > 2) continue;
    out[n].set(sx, sy, rs);
    n++;
  }
  return n;
}

function renderFrame() {
  let holes = 0;
  if (settings.lensing && postOK) holes = gatherHoles();
  if (holes > 0) {
    postMat.uniforms.uCount.value = holes;
    postMat.uniforms.uAspect.value = VIEW.w / VIEW.h;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

/* =================================================================== camera */

const view = { target: new THREE.Vector3(), dist: 900, yaw: 0.75, pitch: 0.46 };
const MIN_DIST = 2e-4, MAX_DIST = 2.4e6;

function applyCamera() {
  view.pitch = clamp(view.pitch, -1.52, 1.52);
  view.dist = clamp(view.dist, MIN_DIST, MAX_DIST);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(
    view.target.x + view.dist * cp * Math.sin(view.yaw),
    view.target.y + view.dist * sp,
    view.target.z + view.dist * cp * Math.cos(view.yaw)
  );
  camera.lookAt(view.target);
  // keep the near plane sensible across nine orders of magnitude
  camera.near = Math.max(1e-6, view.dist * 1e-4);
  camera.far = Math.max(view.dist * 12, SKY_R * 2.2);
  camera.updateProjectionMatrix();
  if (skyGroup) skyGroup.position.copy(camera.position);
}

function frameOn(b, margin) {
  if (!b) return;
  view.target.copy(b.p);
  // A galaxy's bulge is a speck next to its disc; framing on the bulge would
  // put the camera inside the thing you asked to look at.
  const r = b.kind === 'gal' ? b.galR : visRadius(b);
  view.dist = clamp(r * (margin || 9), MIN_DIST, MAX_DIST);
}

function resize() {
  // Never let the viewport reach zero: a hidden or collapsed window reports
  // 0×0, and every worldPerPixel() division downstream would become Infinity.
  const w = Math.max(window.innerWidth, 1), h = Math.max(window.innerHeight, 1);
  VIEW.w = w; VIEW.h = h;
  VIEW.dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(VIEW.dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (rt) rt.setSize(Math.floor(w * VIEW.dpr), Math.floor(h * VIEW.dpr));
}

/* ========================================================= selection marker */

/**
 * Drawn as an SVG overlay rather than a sprite in the scene: anything inside the
 * 3D pass gets warped and darkened by the black-hole lensing shader, which had
 * been swallowing the reticle whole whenever you selected a hole.
 */
function updateReticle() {
  const el = $('an-ret');
  const b = sim.selected;
  if (!b || !b.alive) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const px = apparentPx(b);
  // Once a body fills the view it is obvious what is selected, and a reticle
  // that size just sprawls across the panels.
  if (px > VIEW.h * 0.3) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  _lp.copy(b.p).project(camera);
  if (_lp.z < -1 || _lp.z > 1) { el.style.display = 'none'; return; }
  el.setAttribute('cx', ((_lp.x + 1) * 0.5 * VIEW.w).toFixed(1));
  el.setAttribute('cy', ((1 - _lp.y) * 0.5 * VIEW.h).toFixed(1));
  el.setAttribute('r', Math.max(px * 1.55, 20).toFixed(1));
  if (el.style.display !== 'block') el.style.display = 'block';
}

/* =================================================================== labels */

const LABEL_POOL = 22;
const labelEls = [];

function initLabels() {
  const host = document.getElementById('an-app');
  for (let i = 0; i < LABEL_POOL; i++) {
    const d = document.createElement('div');
    d.className = 'an-label';
    d.style.display = 'none';
    host.appendChild(d);
    labelEls.push(d);
  }
}

const _lp = new THREE.Vector3();

function updateLabels() {
  if (!settings.labels) {
    for (const el of labelEls) if (el.style.display !== 'none') el.style.display = 'none';
    return;
  }
  // Zoomed out, every body is a sub-pixel dot indistinguishable from a
  // background star, so rank by significance (apparent size plus mass) and let
  // the pool size decide how many get named rather than a raw pixel threshold.
  const cands = [];
  for (const b of sim.bodies) {
    const px = apparentPx(b);
    const score = (b === sim.selected || b === sim.follow)
      ? 1e9
      : px + Math.log10(Math.max(b.m, 1e-12)) * 0.9;
    cands.push([score, b, px]);
  }
  // A live supernova outranks everything — it is the only thing anyone is
  // looking at — and its label doubles as a running brightness readout.
  for (const e of supernovae) {
    if (e.lum < 1 && !(e.cloud && e.cloud.n > 0)) continue;
    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(e.p), 1e-9));
    cands.push([2e9, e, clamp(e.r / wpp, 6, 90)]);
  }
  cands.sort((a, b) => b[0] - a[0]);

  // Bodies that sit on top of each other at this zoom (Earth and its Moon, a
  // debris cloud) would otherwise stack their names into an unreadable smear.
  const taken = [];
  let slot = 0;

  for (let ci = 0; ci < cands.length && slot < LABEL_POOL; ci++) {
    const c = cands[ci];
    const b = c[1];
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1 || _lp.x < -1.1 || _lp.x > 1.1 || _lp.y < -1.1 || _lp.y > 1.1) continue;

    const x = (_lp.x + 1) * 0.5 * VIEW.w;
    const y = (1 - _lp.y) * 0.5 * VIEW.h;
    let clash = false;
    for (let t = 0; t < taken.length; t++) {
      if (Math.abs(taken[t][0] - x) < 52 && Math.abs(taken[t][1] - y) < 13) { clash = true; break; }
    }
    if (clash && b !== sim.selected && b !== sim.follow) continue;
    taken.push([x, y]);

    const el = labelEls[slot++];
    const off = Math.min(Math.max(c[2], 5) + 9, 90);
    el.style.transform = 'translate(-50%,0) translate(' + x.toFixed(1) + 'px,' + (y + off).toFixed(1) + 'px)';
    if (el.textContent !== b.name) el.textContent = b.name;
    el.classList.toggle('sel', b === sim.selected);
    if (el.style.display !== 'block') el.style.display = 'block';
  }

  for (let i = slot; i < LABEL_POOL; i++) {
    const el = labelEls[i];
    if (el.style.display !== 'none') el.style.display = 'none';
  }
}

function apparentPx(b) {
  const d = camera.position.distanceTo(b.p);
  return visRadius(b) / worldPerPixel(Math.max(d, 1e-9));
}

/* ========================================================== visual update   */

const _dir = new THREE.Vector3();
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const FROST = new THREE.Color(0.72, 0.82, 0.95);
/* What a living world fades to when it stops being one: dust. */
const DEAD = new THREE.Color(0.60, 0.53, 0.44);

function refreshStarCache() {
  sim.starCache.length = 0;
  for (const b of sim.bodies) {
    const d = TYPES[b.type];
    // A black dwarf is not a light source, so it neither warms anything nor
    // takes up one of the scene's light slots.
    if (d.dead) continue;
    if (b.lum > 0 || (d.star && b.kind === 'body')) sim.starCache.push(b);
  }
  // A supernova is a light source like any other — briefly the brightest in the
  // sky by a factor of billions. It carries .p, .lum and .lightColor, which is
  // everything the lighting and temperature passes ask of a star.
  for (const e of supernovae) if (e.lum > 1e-3) sim.starCache.push(e);
}

function nearestStar(b) {
  let best = null, bestD = Infinity;
  for (const s of sim.starCache) {
    if (s === b) continue;
    const d = b.p.distanceToSquared(s.p);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function updateVisuals(realDt, simDt) {
  // First, because an explosion can destroy bodies and is itself a light source
  // that the two passes below need to know about.
  updateSupernovae(simDt);
  updateDiscs(simDt);
  updateClumps(simDt);
  coolCores(simDt);
  refreshStarCache();
  updateTemperatures();
  // After the temperatures, because whether a world can live is decided by the
  // starlight actually falling on it this frame.
  updateTerraform(simDt);
  updateLights();
  updateGalaxies();
  updateGrid();

  for (let i = 0; i < sim.bodies.length; i++) {
    const b = sim.bodies[i];
    const p = b.parts;
    if (!p) continue;
    // Galaxies are sized and posed entirely by updateGalaxies, on screen terms
    // that nothing in this loop applies to.
    if (b.kind === 'gal') { b.obj.position.copy(b.p); continue; }

    if (b.kind === 'gas') {
      const rc = visRadius(b);
      const wppC = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
      b.obj.position.copy(b.p);
      b.obj.rotation.y = b.rot * 0.3;
      p.puff.scale.setScalar(rc);
      const uc = p.puff.material.uniforms;
      uc.uScale.value = rc;
      uc.uFocal.value = VIEW.h * VIEW.dpr / (2 * Math.tan(FOV * Math.PI / 360));
      // Fades as it cools: a knot that has given up its heat is barely there.
      uc.uOp.value = clamp(0.08 + b.temp / 7000, 0.07, 0.44);
      p.puff.visible = rc / wppC > 1.2;
      // The colour of the glow IS the temperature, same as everything else here.
      const kc = kelvinToRGB(clamp(b.temp, 1000, 6000));
      p.clumpGlow.material.color.setRGB(kc[0] / 255, kc[1] / 255, kc[2] / 255);
      p.clumpGlow.scale.setScalar(Math.max(rc * 1.5, 7 * wppC));
      p.clumpGlow.material.opacity = clamp(0.10 + b.temp / 14000, 0.1, 0.42);
      if (p.dot) p.dot.visible = false;
      continue;
    }

    const def = TYPES[b.type];
    const r = visRadius(b);
    const px = apparentPx(b);

    b.obj.position.copy(b.p);
    b.obj.rotation.z = b.tilt;

    // Colour follows mass, so a star that has been fed or drained is repainted
    // the moment it crosses a band — and only then. This runs every frame.
    if (def.star && starBand(b) !== b.band) applyStarBand(b);

    // ---- level of detail: below a couple of pixels, draw a dot instead
    const tiny = px < 1.7;
    if (p.surf) p.surf.visible = !tiny;
    if (p.cloud) p.cloud.visible = !tiny && px > 5;
    if (p.atmo) p.atmo.visible = !tiny && px > 4;
    if (p.ring) p.ring.visible = !tiny;
    if (p.disk) p.disk.visible = !tiny;

    const wpp = worldPerPixel(Math.max(camera.position.distanceTo(b.p), 1e-9));
    if (p.dot) {
      const show = tiny || def.star || b.kind === 'wh';
      p.dot.visible = show;
      if (show) {
        const size = tiny ? 5.4 * wpp : Math.max(r * 2.2, 3.0 * wpp);
        p.dot.scale.setScalar(size);
        // Zoomed far out these dots are the only trace of a planet, so keep
        // them legible rather than fading them to nothing.
        p.dot.material.opacity = tiny ? clamp(0.45 + px * 0.3, 0.45, 1) : 0.55;
      }
    }

    if (p.surf && !tiny) p.surf.rotation.y = b.rot;
    if (p.cloud) p.cloud.rotation.y = b.rot * 1.12;
    // The outer layers of a star lag the surface, so let them. The shear is
    // what sells the shells as standing at different heights rather than
    // being painted onto the same ball.
    if (p.chromo) p.chromo.rotation.y = b.rot * 0.93;
    if (p.corona) p.corona.rotation.y = b.rot * 0.79;

    // ---- lighting direction for the atmosphere rim
    if (p.atmo && p.atmo.visible) {
      const s = nearestStar(b);
      if (s) _dir.copy(s.p).sub(b.p).normalize();
      else _dir.copy(camera.position).sub(b.p).normalize();
      p.atmo.material.uniforms.uLight.value.copy(_dir);
    }

    // ---- stars: glow scaled with a pixel floor so they never disappear
    if (p.glow) {
      p.glow.scale.setScalar(Math.max(r * 3.4, 11 * wpp));
      p.halo.scale.setScalar(Math.max(r * 9.5, 34 * wpp));
      // Glare is something you see from far away. Up close the halo is nine
      // times the star's own radius, so flying in would fill the whole screen
      // with additive white and bleach the photosphere into a featureless
      // blob. Fade it out as the disc grows: by the time the star fills the
      // view you should be looking at its surface, not at its glare.
      const fill = px / Math.max(VIEW.h, 1);
      const far = clamp(1 - (fill - 0.20) / 0.60, 0, 1);
      p.glow.material.opacity = 0.05 + far * 0.95;
      p.halo.material.opacity = far;
      p.halo.visible = far > 0.01;
    }

    // ---- black holes
    if (p.disk) p.disk.rotation.z += realDt * 0.35;
    if (p.photon) p.photon.scale.setScalar(Math.max(r * 5.6, 16 * wpp));

    // ---- a world's appearance responds to how hot it is
    if (b.glowPulse) b.glowPulse = Math.max(0, b.glowPulse - realDt * 0.4);
    if (p.surf && b.baseColor && p.surf.material.isMeshStandardMaterial) {
      const mat = p.surf.material;
      const hot = clamp((b.temp - 900) / 1300, 0, 1);
      const base = def.glowHot ? def.glowHot * 0.55 : 0;
      // A freshly transformed world glows from the heat of its own collapse.
      const pulse = b.glowPulse ? Math.pow(b.glowPulse, 0.7) : 0;
      const e = Math.max(base, hot * 0.85, pulse);
      mat.emissive.setRGB(e, e * 0.28, e * 0.05);
      const cold = clamp((110 - b.temp) / 70, 0, 1) * 0.5;
      mat.color.copy(b.baseColor).lerp(FROST, cold);
      // A world that was born living and is now losing it goes brown first.
      if (b.terra < 1 && isLivingSurf(def)) mat.color.lerp(DEAD, (1 - b.terra) * 0.85);
    }

    // ---- the living layer fading in or out over a terraformed world
    if (p.terraSkin) {
      const t = clamp(b.terra, 0, 1);
      const show = t > 0.004 && !tiny;
      p.terraSkin.visible = show;
      if (show) {
        p.terraSkin.material.opacity = t;
        p.terraSkin.rotation.y = b.rot;
        // Oceans appear before the land greens over, so the shine comes in first.
        p.terraSkin.material.roughness = lerp(0.95, 0.72, t);
      }
      if (p.terraCloud) {
        p.terraCloud.visible = show && px > 5;
        p.terraCloud.material.opacity = t * 0.85;
        p.terraCloud.rotation.y = b.rot * 1.12;
      }
      if (p.terraAtmo) {
        p.terraAtmo.visible = show && px > 4;
        p.terraAtmo.material.uniforms.uStrength.value = t * 0.95;
        const s = nearestStar(b);
        if (s) _dir.copy(s.p).sub(b.p).normalize();
        else _dir.copy(camera.position).sub(b.p).normalize();
        p.terraAtmo.material.uniforms.uLight.value.copy(_dir);
      }
    }

    // ---- comet tail: grows as it nears a star, always pointing away from it
    if (p.tail) {
      const s = nearestStar(b);
      let len = 0, flux = 0;
      if (s) {
        const dAU = Math.max(b.p.distanceTo(s.p) / AU, 1e-3);
        flux = s.lum / (dAU * dAU);
        // An absolute scale, not a multiple of the nucleus: a comet is a few km
        // across but its tail runs for a good fraction of an AU. Below roughly
        // 5 AU of sunlight there is not enough heat to outgas at all.
        if (flux > 0.03) len = 0.16 * AU * Math.pow(clamp(flux, 0, 60), 0.4);
      }
      const visible = len > 0 && len / wpp > 4;
      p.tail.visible = visible;
      if (p.coma) {
        p.coma.visible = visible;
        p.coma.scale.setScalar(Math.max(len * 0.035, r * 6, 4 * wpp));
        p.coma.material.opacity = clamp(Math.pow(clamp(flux, 0, 60), 0.35) * 0.4, 0.12, 0.9);
      }
      if (visible) {
        _tmpA.copy(b.p).sub(s.p).normalize();                       // away from the star
        _tmpB.copy(camera.position).sub(b.p).normalize();
        const z = _tmpB.clone().addScaledVector(_tmpA, -_tmpB.dot(_tmpA));
        if (z.lengthSq() < 1e-12) z.set(0, 1, 0); else z.normalize();
        const y = new THREE.Vector3().crossVectors(z, _tmpA);
        _basis.makeBasis(_tmpA, y, z);
        _basis.scale(new THREE.Vector3(len, len * 0.14, 1));
        _basis.setPosition(b.p);
        p.tail.matrixAutoUpdate = false;
        p.tail.matrix.copy(_basis);
        p.tail.matrixWorldNeedsUpdate = true;
      }
    }
  }

  updateReticle();
  updateTrails();
  updateParticles(simDt);
  updateFx(realDt, simDt);
  updateLabels();
}

/* ==================================================================== input */

const $ = (id) => document.getElementById(id);
const raycaster = new THREE.Raycaster();

const input = {
  mode: null,
  armed: null,
  x0: 0, y0: 0, x: 0, y: 0,
  moved: false,
  placePos: null,
  pointers: new Map(),
  pinchD: 0, pinchX: 0, pinchY: 0
};

/**
 * Map a screen point onto a world position. The horizontal plane through the
 * focus point is preferred so built systems stay roughly coplanar; when the
 * camera is too close to edge-on, fall back to a plane facing the camera.
 */
function screenToWorld(sx, sy) {
  raycaster.setFromCamera(new THREE.Vector2((sx / VIEW.w) * 2 - 1, -(sy / VIEW.h) * 2 + 1), camera);
  const ray = raycaster.ray;
  if (Math.abs(ray.direction.y) > 0.10) {
    const t = (view.target.y - ray.origin.y) / ray.direction.y;
    if (t > 0 && t < view.dist * 40) return ray.origin.clone().addScaledVector(ray.direction, t);
  }
  const n = camera.getWorldDirection(new THREE.Vector3());
  const denom = n.dot(ray.direction);
  const t = Math.abs(denom) > 1e-6 ? n.dot(_tmpA.copy(view.target).sub(ray.origin)) / denom : view.dist;
  return ray.origin.clone().addScaledVector(ray.direction, clamp(t, view.dist * 0.02, view.dist * 40));
}

/** Pick by screen distance rather than mesh intersection, so tiny bodies work. */
function pickBody(sx, sy) {
  let best = null, bestScore = Infinity;
  for (const b of sim.bodies) {
    _lp.copy(b.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    // A galaxy is drawn thousands of pixels wide, so sizing its hit area to
    // what you can see would let it swallow every click on screen. It is picked
    // by its core, and only when nothing solid is closer.
    const gal = b.kind === 'gal';
    const reach = gal ? 34 : Math.max(apparentPx(b) + 10, 16);
    if (d > reach) continue;
    const score = gal ? d + 400 : d - apparentPx(b) * 0.25;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) return best;

  // Only fall through to remnant clouds when nothing solid is under the cursor —
  // a cloud covers half the screen, and you still need to be able to click the
  // neutron star sitting in the middle of it.
  let bestD = Infinity;
  for (const e of supernovae) {
    if (!e.alive || !e.cloud || e.cloud.mass <= 0) continue;
    _lp.copy(e.p).project(camera);
    if (_lp.z < -1 || _lp.z > 1) continue;
    const x = (_lp.x + 1) * 0.5 * VIEW.w, y = (1 - _lp.y) * 0.5 * VIEW.h;
    const d = Math.hypot(x - sx, y - sy);
    if (d > Math.max(apparentPx(e), 26)) continue;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/** The body whose gravity dominates at a point — used for auto-orbit. */
function dominantAt(pos, exclude) {
  let best = null, bestPull = 0;
  for (const b of sim.bodies) {
    if (b === exclude || b.kind === 'wh') continue;
    const d2 = Math.max(b.p.distanceToSquared(pos), 1e-9);
    const pull = b.m / d2;
    if (pull > bestPull) { bestPull = pull; best = b; }
  }
  return best;
}

/** Circular-orbit velocity about `primary` at `pos`, in the horizontal plane. */
function circularVelocity(primary, pos) {
  const rel = pos.clone().sub(primary.p);
  const d = rel.length();
  if (d < 1e-9) return new THREE.Vector3();
  const speed = Math.sqrt(G * settings.gravity * primary.m / d);
  let tang = new THREE.Vector3(0, 1, 0).cross(rel);
  if (tang.lengthSq() < 1e-12) tang = new THREE.Vector3(1, 0, 0).cross(rel);
  tang.normalize().multiplyScalar(speed);
  return tang.add(primary.v);
}

function bindInput() {
  const c = canvasEl;
  c.addEventListener('contextmenu', e => e.preventDefault());

  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId);
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.pointers.size === 2) {
      const p = [...input.pointers.values()];
      input.mode = 'pinch';
      input.pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      input.pinchX = (p[0].x + p[1].x) / 2;
      input.pinchY = (p[0].y + p[1].y) / 2;
      hideAim();
      return;
    }
    if (input.pointers.size > 2) return;

    input.x0 = input.x = e.clientX;
    input.y0 = input.y = e.clientY;
    input.moved = false;

    if (input.armed && e.button === 0 && !e.shiftKey) {
      input.mode = 'place';
      input.placePos = snapToGrid(screenToWorld(e.clientX, e.clientY));
    } else if (e.button === 2 || e.button === 1 || e.shiftKey) {
      input.mode = 'pan';
    } else {
      input.mode = 'orbit';
    }
  });

  c.addEventListener('pointermove', (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (input.mode === 'pinch' && input.pointers.size >= 2) {
      const p = [...input.pointers.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (input.pinchD > 0) view.dist *= clamp(input.pinchD / Math.max(d, 1), 0.4, 2.5);
      panBy(mx - input.pinchX, my - input.pinchY);
      input.pinchD = d; input.pinchX = mx; input.pinchY = my;
      return;
    }

    const dx = e.clientX - input.x, dy = e.clientY - input.y;
    input.x = e.clientX; input.y = e.clientY;
    if (Math.hypot(e.clientX - input.x0, e.clientY - input.y0) > 5) input.moved = true;

    if (input.mode === 'orbit') {
      view.yaw -= dx * 0.005;
      view.pitch += dy * 0.005;
    } else if (input.mode === 'pan') {
      panBy(dx, dy);
      sim.follow = null;
    } else if (input.mode === 'place') {
      drawAim();
    }
  });

  const finish = (e) => {
    if (!input.pointers.has(e.pointerId)) return;
    input.pointers.delete(e.pointerId);

    if (input.mode === 'place') {
      dropArmed();
      hideAim();
    } else if (input.mode === 'orbit' && !input.moved) {
      select(pickBody(e.clientX, e.clientY));
    }
    if (input.pointers.size === 0) input.mode = null;
    else if (input.pointers.size === 1) {
      const p = [...input.pointers.values()][0];
      input.mode = 'orbit'; input.x = p.x; input.y = p.y; input.moved = true;
    }
  };
  c.addEventListener('pointerup', finish);
  c.addEventListener('pointercancel', finish);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.dist *= Math.pow(1.0016, e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY);
  }, { passive: false });

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
}

function panBy(dx, dy) {
  const wpp = worldPerPixel(view.dist);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  view.target.addScaledVector(right, -dx * wpp).addScaledVector(up, dy * wpp);
}

/* ------------------------------------------------------------- aim overlay  */

function velocityFromDrag() {
  const pos = input.placePos;
  const primary = dominantAt(pos, null);
  let vRef;
  if (primary) {
    const d = Math.max(primary.p.distanceTo(pos), 1e-9);
    vRef = Math.sqrt(G * settings.gravity * primary.m / d);
  } else {
    vRef = 2.592;                                     // ~30 km/s, a homely orbital speed
  }
  const dx = input.x - input.x0, dy = input.y - input.y0;
  const px = Math.hypot(dx, dy);
  if (px < 6) {
    // A tap with no drag: give it a circular orbit if that makes sense.
    if (settings.autoOrbit && primary && primary.m > 0.01) return circularVelocity(primary, pos);
    return primary ? primary.v.clone() : new THREE.Vector3();
  }
  // 120 px of drag ≈ one local circular-orbit speed, measured relative to the
  // dominant body so a moon dropped beside a moving planet keeps up with it
  const world = screenToWorld(input.x, input.y).sub(pos);
  const scale = vRef / (120 * worldPerPixel(view.dist));
  const v = world.multiplyScalar(scale);
  return primary ? v.add(primary.v) : v;
}

function drawAim() {
  $('an-aim').style.display = 'block';
  const l = $('an-aim-line'), d = $('an-aim-dot'), t = $('an-aim-txt');
  l.setAttribute('x1', input.x0); l.setAttribute('y1', input.y0);
  l.setAttribute('x2', input.x); l.setAttribute('y2', input.y);
  d.setAttribute('cx', input.x0); d.setAttribute('cy', input.y0);
  const v = velocityFromDrag();
  t.setAttribute('x', input.x + 12);
  t.setAttribute('y', input.y - 8);
  t.textContent = fmtSpeed(v.length());
}

function hideAim() { $('an-aim').style.display = 'none'; }

function dropArmed() {
  if (!input.armed || !input.placePos) return;
  if (sim.bodies.length >= MAX_BODIES) { toast('Universe is full — clear some bodies'); return; }
  const vel = velocityFromDrag();
  const b = makeBody(input.armed, input.placePos, vel);
  select(b);
  if (!sim.running && sim.bodies.length > 1) toast('Press ▶ to start time');
}

/* ---------------------------------------------------------------- keyboard  */

function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case ',': case '<': changeRate(-1); break;
    case '.': case '>': changeRate(1); break;
    case 'f': case 'F':
      if (sim.selected) { sim.follow = sim.follow === sim.selected ? null : sim.selected; renderInspector(); }
      break;
    case 'Delete': case 'Backspace':
      if (sim.selected && sim.selected.kind === 'snr') {
        const e = sim.selected;
        disperseCloud(e);
        e.alive = false;
        disposeSN(e);
        const i = supernovae.indexOf(e);
        if (i >= 0) supernovae.splice(i, 1);
        select(null);
      } else if (sim.selected) {
        const b = sim.selected; select(null); removeBody(b); compact();
      }
      break;
    case 'Escape': arm(null); closeModal(); break;
    case 't': case 'T': settings.trails = !settings.trails; clearTrails(); syncSettings(); break;
    case 'l': case 'L': settings.labels = !settings.labels; syncSettings(); break;
  }
}

/* ====================================================================== UI  */

let toastTimer = 0;
function toast(msg) {
  const el = $('an-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

function buildPalette() {
  const host = $('an-palette-list');
  let html = '';
  for (const g of GROUPS) {
    html += '<div class="an-group">' + g + '</div>';
    for (const key in TYPES) {
      if (TYPES[key].group !== g) continue;
      const t = TYPES[key];
      const cls = t.kind === 'bh' ? ' hole' : t.kind === 'gal' ? ' gal'
        : t.disc ? ' disc' : t.rings ? ' ring' : '';
      html += '<button class="an-item" data-type="' + key + '" title="' + t.blurb.replace(/"/g, '&quot;') + '">' +
        '<span class="an-dot' + cls + '" style="background:' + SWATCH[key] + ';color:' + SWATCH[key] + '"></span>' +
        '<span>' + t.label + '</span></button>';
    }
  }
  host.innerHTML = html;
  host.addEventListener('click', (e) => {
    const btn = e.target.closest('.an-item');
    if (!btn) return;
    arm(input.armed === btn.dataset.type ? null : btn.dataset.type);
  });
}

function arm(type) {
  input.armed = type;
  for (const el of document.querySelectorAll('.an-item')) el.classList.toggle('armed', el.dataset.type === type);
  $('an-armed-lbl').textContent = type ? 'ARMED' : '';
  updateHint();
}

function updateHint() {
  const el = $('an-hint');
  let s;
  if (input.armed) {
    s = 'Click empty space to drop <b>' + TYPES[input.armed].label + '</b> &middot; <b>drag</b> to aim its speed';
    if (settings.grid) s += ' &middot; grid square <b class="an-cell">—</b>';
  } else if (sim.selected) {
    s = '<kbd>F</kbd> follow &middot; <kbd>Del</kbd> remove &middot; drag to orbit &middot; scroll to zoom';
  } else {
    s = 'Pick something from <b>Add Body</b>, then click space to place it &middot; <kbd>Space</kbd> starts time';
  }
  el.innerHTML = s;
}

/* ---------------------------------------------------------------- inspector */

let inspRefs = null;

function select(b) {
  sim.selected = b && b.alive ? b : null;
  renderInspector();
  updateHint();
  if (window.innerWidth <= 700 && sim.selected) showPanel('inspector');
}

/**
 * The fate block on a star's panel: the button when it can explode, and a
 * plain-language reason when it cannot. Body names reach this through
 * plan.why, so everything here goes through the escaper.
 */
function snPanelHTML(plan) {
  const head = '<div class="an-sec">FATE</div>';
  if (!plan.ok) return head + '<p class="an-note">' + escAttr(plan.why) + '</p>';
  return head +
    '<p class="an-note"><b>' + escAttr(plan.label) + '</b> — ' + escAttr(plan.story) + '</p>' +
    '<div class="an-row"><button id="is-sn" class="an-danger">GO SUPERNOVA</button></div>';
}

/**
 * The panel for a selected remnant cloud. The one control is core temperature,
 * because in a collapsing cloud temperature and size are the same fact seen
 * twice: squeeze it and the middle gets hotter, and at ten million kelvin
 * hydrogen starts fusing whether you meant it to or not.
 */
function renderCloudInspector(e) {
  const host = $('an-insp-body');
  const c = e.cloud || { mass: 0, n: 0, radius: 0 };
  $('an-insp-h').textContent = 'REMNANT CLOUD';

  host.innerHTML =
    '<div class="an-name-in" style="cursor:default;pointer-events:none">' + escAttr(e.label + ' remnant') + '</div>' +
    '<div class="an-type">from ' + escAttr(e.origin) + '</div>' +
    '<dl class="an-stats">' +
    '<dt>Gas &amp; dust</dt><dd id="is-cmass"></dd>' +
    '<dt>Pieces</dt><dd id="is-cn"></dd>' +
    '<dt>Radius</dt><dd id="is-crad"></dd>' +
    '<dt>Expanding at</dt><dd id="is-cvel"></dd>' +
    '<dt>Age</dt><dd id="is-cage"></dd>' +
    '<dt>Still glowing</dt><dd id="is-clum"></dd>' +
    '</dl>' +
    '<div class="an-field"><label>Core temperature <b id="is-ctv"></b></label>' +
    '<input type="range" id="is-ctemp" min="1" max="7" step="0.01" value="' +
    Math.log10(clamp(e.coreT, 10, IGNITE_T)).toFixed(3) + '"></div>' +
    '<p class="an-note">Squeezing a cloud heats its middle — halve the radius and you double the ' +
    'core temperature. Drag this all the way to <b>10 million K</b> and hydrogen fusion starts.</p>' +
    '<div class="an-sec">WHAT IT WOULD MAKE</div>' +
    '<p class="an-note" id="is-cfore"></p>' +
    '<div class="an-row"><button id="is-collapse">COLLAPSE NOW</button></div>' +
    '<div class="an-row"><button id="is-cfollow">' + (sim.follow === e ? 'UNFOLLOW' : 'FOLLOW') +
    '</button><button id="is-czoom">ZOOM TO</button></div>' +
    '<div class="an-row"><button id="is-cdisperse" class="an-danger">DISPERSE</button></div>' +
    '<p class="an-note" style="margin-top:13px">This is where the next generation of stars comes ' +
    'from. Our own Solar System is thought to have condensed out of a cloud like this one — the ' +
    'oldest meteorites still carry the decay products of supernova iron. What you get is a ' +
    '<b>newborn</b> star and nothing else yet — just the disc it came out of. Let it run: the ' +
    'planets condense out of that disc one at a time, which is how it really happened.</p>';

  inspRefs = {
    cmass: $('is-cmass'), cn: $('is-cn'), crad: $('is-crad'), cvel: $('is-cvel'),
    cage: $('is-cage'), clum: $('is-clum'), ctv: $('is-ctv'), cfore: $('is-cfore')
  };

  const temp = $('is-ctemp');
  temp.addEventListener('input', () => {
    const cur = sim.selected;
    if (!cur || cur.kind !== 'snr' || !cur.alive) return;
    inspectorLock++;
    const lit = setCloudTemp(cur, Math.pow(10, parseFloat(temp.value)));
    inspectorLock--;
    if (lit) { condenseCloud(cur); return; }
    // A hundredfold squeeze would otherwise shrink the thing you are working on
    // to a sub-pixel dot long before it ignites, so close in as it collapses —
    // but only once it has actually got small on screen.
    if (apparentPx(cur) < VIEW.h * 0.16) frameOn(cur, 2.8);
    updateInspectorStats();
  });
  temp.addEventListener('change', () => renderInspector());

  $('is-collapse').addEventListener('click', () => { if (e.alive) condenseCloud(e); });
  $('is-cfollow').addEventListener('click', () => {
    sim.follow = sim.follow === e ? null : e;
    renderInspector();
  });
  $('is-czoom').addEventListener('click', () => { frameOn(e, 2.6); sim.follow = e; renderInspector(); });
  $('is-cdisperse').addEventListener('click', () => {
    disperseCloud(e);
    e.alive = false;
    disposeSN(e);
    const i = supernovae.indexOf(e);
    if (i >= 0) supernovae.splice(i, 1);
    select(null);
    toast('Cloud dispersed');
  });

  updateInspectorStats();
}

/* ------------------------------------------------------- terraform block  */

/** The TERRAFORM section: what is stopping it, or how far along it is. */
function terraHTML(b) {
  const def = TYPES[b.type];
  if (def.star || GASSY_SURF.has(def.surf) || b.kind !== 'body') return '';
  const chk = terraCheck(b);
  const pct = Math.round(b.terra * 100);
  const born = isLivingSurf(def);

  let h = '<div class="an-sec">TERRAFORMING</div>';

  if (b.terraOn) {
    h += '<div class="an-bar"><i id="is-tfbar" style="width:' + pct + '%"></i></div>' +
      '<p class="an-note" id="is-tfnote"></p>';
  }

  if (!chk.ok) {
    h += '<p class="an-note">' + escAttr(chk.why) + '</p>';
  } else if (!b.terraOn) {
    h += '<p class="an-note">' + escAttr(b.name) + ' sits where water can be liquid and is heavy enough to ' +
      'hold its air down. ' + (born
        ? 'It is already alive — switch this on and it will stay that way only for as long as that remains true.'
        : 'Give it oceans, weather and a sky.') + '</p>';
  }

  h += '<div class="an-row">' +
    '<button id="is-terra"' + (chk.ok || b.terraOn ? '' : ' disabled') + '>' +
    (b.terraOn ? 'STOP' : 'TERRAFORM') + '</button>' +
    (b.terraOn && b.terra < 1 && chk.ok ? '<button id="is-terra-now">FINISH IT</button>' : '') +
    '</div>';
  return h;
}

function bindTerra(b) {
  const btn = $('is-terra');
  if (btn) {
    btn.addEventListener('click', () => {
      b.terraOn = !b.terraOn;
      if (b.terraOn && b.terra > 0 && b.parts && !b.parts.terraSkin && !isLivingSurf(TYPES[b.type])) refreshVisual(b);
      toast(b.terraOn ? 'Terraforming ' + b.name + '…' : 'Left ' + b.name + ' to its own devices');
      renderInspector();
    });
  }
  const now = $('is-terra-now');
  if (now) {
    now.addEventListener('click', () => {
      if (!terraCheck(b).ok) return;
      b.terra = 1;
      if (b.parts && !b.parts.terraSkin && !isLivingSurf(TYPES[b.type])) refreshVisual(b);
      toast(b.name + ' is alive — oceans, air and all');
      renderInspector();
    });
  }
}

/* --------------------------------------------------------- customise block */
/*
 * Everything about a body that is a number can be dialled here: how big it is,
 * how fast and which way it spins, how far over it leans, how hot its middle
 * is, what colour it is, and what its rings look like. Mass has its own slider
 * further up because changing mass can change what the body *is*.
 */

const DEG = 180 / Math.PI;

function customiseHTML(b) {
  const def = TYPES[b.type];
  const hole = b.kind === 'bh' || b.kind === 'wh';
  const nat = trueRadius(b.type, b.m);
  const lr = Math.log10(Math.max(b.r, 1e-12));
  const spinAbs = Math.max(Math.abs(b.spin || 1), 1e-4);
  const rings = b.ringSpec;

  let h = '<details class="an-more"><summary>CUSTOMISE</summary>';

  if (!hole) {
    h += '<div class="an-field"><label>Radius <b id="is-rv"></b></label>' +
      '<input type="range" id="is-rad-s" step="0.001" min="' +
      Math.min(Math.log10(nat * 0.05), lr).toFixed(3) + '" max="' +
      Math.max(Math.log10(nat * 20), lr).toFixed(3) + '" value="' + lr.toFixed(3) + '"></div>' +
      '<p class="an-note">Mass stays put, so widening a body makes it less dense — and past a point it would float in water, like Saturn.</p>';
  }

  h += '<div class="an-field"><label>Spin (one turn) <b id="is-spv"></b></label>' +
    '<input type="range" id="is-spin-s" min="-4" max="4" step="0.01" value="' +
    Math.log10(spinAbs).toFixed(3) + '"></div>' +
    tgl('is-retro', 'Spins backwards', 'Like Venus, Uranus and Pluto really do.') +
    '<p class="an-note">Wind it below <b>0.02 hours</b> a turn and the equator is moving faster than ' +
    'gravity can hold on to it: the body starts <b>flinging itself apart</b> from the middle, and keeps ' +
    'going until nothing but its core is left. Time has to be running for that to happen.</p>' +
    '<div class="an-field"><label>Axial tilt <b id="is-tiv"></b></label>' +
    '<input type="range" id="is-tilt-s" min="-180" max="180" step="1" value="' +
    Math.round(b.tilt * DEG) + '"></div>';

  if (!hole) {
    h += '<div class="an-field"><label>' + (def.star ? 'Surface temperature' : 'Internal temperature') +
      ' <b id="is-ctv2"></b></label>' +
      '<input type="range" id="is-core-s" min="1" max="7.3" step="0.01" value="' +
      Math.log10(clamp(def.star ? b.temp : (b.coreT || 300), 10, 2e7)).toFixed(3) + '"></div>' +
      '<p class="an-note">' + (def.star
        ? 'The colour of a star is its temperature and nothing else — cool is red, hot is blue.'
        : 'How hot it is deep down. Earth\'s core is about 5,700 K. Push it far enough and the surface glows.') +
      '</p>';
  }

  if (!hole && !def.star) {
    h += '<div class="an-sub">Colour tint</div><div class="an-swatches">' +
      '<input type="color" id="is-tint" value="' + bodyTintHex(b) + '"></div>' +
      '<p class="an-note">Washes a colour over the whole surface. White leaves it exactly as it was.</p>';
  }

  /* ---- rings ------------------------------------------------------------ */
  h += '<div class="an-sub">Rings</div>' +
    tgl('is-rings-on', 'Has rings', '');
  if (rings) {
    h += '<div class="an-field"><label>Inner edge <b id="is-ri-v"></b></label>' +
      '<input type="range" id="is-ri" min="1.02" max="6" step="0.01" value="' + rings.inner + '"></div>' +
      '<div class="an-field"><label>Outer edge <b id="is-ro-v"></b></label>' +
      '<input type="range" id="is-ro" min="1.1" max="9" step="0.01" value="' + rings.outer + '"></div>' +
      '<div class="an-field"><label>How solid <b id="is-rop-v"></b></label>' +
      '<input type="range" id="is-rop" min="0.05" max="1" step="0.01" value="' +
      (rings.opacity != null ? rings.opacity : 0.92) + '"></div>' +
      '<div class="an-swatches">' +
      '<input type="color" id="is-rc1" value="' + rgbHex(rings.pal[0]) + '">' +
      '<input type="color" id="is-rc2" value="' + rgbHex(rings.pal[1]) + '"></div>' +
      '<p class="an-note">Edges are measured in the body\'s own widths. Real rings sit inside the Roche limit, which is why they never clump into a moon.</p>';
  }

  h += '<div class="an-row"><button id="is-solid">ADD SOLID RINGS</button></div>' +
    '<p class="an-note">Drops a <b>three-dimensional band of real asteroids</b> into orbit — actual ' +
    'bodies with mass, not a picture. They pull on each other, they shear, and they crash. Press it ' +
    'again and again: each band goes in a little wider and a little more tilted than the last, so ' +
    'they <b>cross</b> instead of nesting, and the crossings grind each other up. Round a star the ' +
    'band reaches as far out as a <b>protoplanetary disc</b> does — and if the star already has one, ' +
    'the rocks fill exactly the same space as the dust.</p>';

  h += '<div class="an-row"><button id="is-reset">RESET TO ' + def.label.toUpperCase() + '</button></div>' +
    '</details>';
  return h;
}
