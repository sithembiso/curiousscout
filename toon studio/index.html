<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Toon Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23FF9F1C'/%3E%3Crect x='10' y='16' width='44' height='32' rx='5' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23FF5A5F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #fff4e0;
    --panel: #ffffff;
    --ink: #2b2140;
    --soft: #8a7fa3;
    --accent: #ff9f1c;
    --accent2: #ff5a5f;
    --sel: #3a86ff;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }

  #ts-app {
    height: 100%;
    display: grid;
    grid-template-areas:
      "top top top"
      "tools stage side"
      "bar bar bar";
    grid-template-columns: 112px minmax(0, 1fr) 232px;
    min-width: 0;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    padding: 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  /* ---- top bar ---- */
  #ts-top { grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #ts-top .ts-title {
    font-weight: 700; font-size: 26px; letter-spacing: 0.5px; margin-right: auto;
    display: flex; align-items: center; gap: 10px;
  }
  #ts-top .ts-title span { color: var(--accent); }
  .ts-btn {
    height: 52px; min-width: 52px; padding: 0 14px; border-radius: 16px;
    background: var(--panel); box-shadow: 0 3px 0 #e6d6bd, 0 6px 14px rgba(43,33,64,0.08);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 18px; font-weight: 600; transition: transform 0.08s;
  }
  .ts-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #e6d6bd; }
  .ts-btn svg { width: 28px; height: 28px; flex: none; }
  .ts-btn.ts-big { background: var(--accent); color: #fff; box-shadow: 0 3px 0 #d97f00, 0 6px 14px rgba(255,159,28,0.3); }
  .ts-btn:disabled { opacity: 0.4; }
  .ts-back { text-decoration: none; color: inherit; }

  /* ---- tools ---- */
  #ts-tools {
    grid-area: tools; background: var(--panel); border-radius: 22px; padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto;
    box-shadow: 0 6px 18px rgba(43,33,64,0.08);
  }
  .ts-tool {
    width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: #f5efe4; flex: none;
  }
  .ts-tool svg { width: 38px; height: 38px; }
  .ts-tool.on { background: var(--sel); color: #fff; box-shadow: 0 0 0 3px #bcd4ff; }
  .ts-sep { width: 60%; height: 2px; background: #f0e6d6; border-radius: 2px; flex: none; }
  .ts-size { width: 52px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #f5efe4; flex: none; }
  .ts-size i { display: block; border-radius: 50%; background: var(--ink); }
  .ts-size.on { box-shadow: 0 0 0 3px var(--sel); background: #fff; }
  .ts-colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ts-color { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #e8dcc8; flex: none; }
  .ts-color.on { box-shadow: 0 0 0 3px var(--sel); transform: scale(1.1); }

  /* ---- stage ---- */
  #ts-stagewrap { grid-area: stage; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; overflow: hidden; }
  #ts-stage {
    display: block; background: #fff; border-radius: 18px; width: 320px; height: 180px;
    box-shadow: 0 0 0 4px #fff, 0 10px 30px rgba(43,33,64,0.18);
    touch-action: none;
  }
  #ts-stage.playing { box-shadow: 0 0 0 4px var(--accent), 0 10px 30px rgba(255,159,28,0.35); }
  #ts-hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-weight: 600; font-size: 18px;
    padding: 10px 18px; border-radius: 999px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  #ts-hint.show { opacity: 0.92; }

  /* ---- side panel ---- */
  #ts-side {
    grid-area: side; background: var(--panel); border-radius: 22px; padding: 10px;
    display: flex; flex-direction: column; gap: 10px; min-height: 0;
    box-shadow: 0 6px 18px rgba(43,33,64,0.08);
  }
  .ts-tabs { display: flex; gap: 6px; flex: none; }
  .ts-tab { flex: 1; height: 46px; border-radius: 14px; background: #f5efe4; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ts-tab svg { width: 24px; height: 24px; }
  .ts-tab.on { background: var(--accent); color: #fff; }
  .ts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; align-content: start; }
  .ts-grid.bgs { grid-template-columns: 1fr 1fr; }
  .ts-pick { aspect-ratio: 1; border-radius: 16px; background: #f5efe4; display: flex; align-items: center; justify-content: center; }
  .ts-pick canvas { width: 86%; height: 86%; }
  .ts-grid.bgs .ts-pick { aspect-ratio: 16/9; padding: 4px; }
  .ts-grid.bgs .ts-pick canvas { width: 100%; height: 100%; border-radius: 10px; }
  .ts-pick.on { box-shadow: 0 0 0 3px var(--sel); }
  .ts-pick:active { transform: scale(0.94); }

  /* ---- frames bar ---- */
  #ts-bar {
    grid-area: bar; background: var(--panel); border-radius: 22px; padding: 10px;
    display: flex; align-items: center; gap: 10px; min-width: 0;
    box-shadow: 0 6px 18px rgba(43,33,64,0.08);
  }
  #ts-play { width: 72px; height: 72px; border-radius: 50%; }
  #ts-play svg { width: 36px; height: 36px; }
  #ts-strip { flex: 1; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 6px 4px; min-width: 0; scroll-behavior: smooth; touch-action: pan-x; }
  .ts-frame { position: relative; flex: none; border-radius: 12px; padding: 0; background: #fff; box-shadow: 0 0 0 2px #eadfcd; }
  .ts-frame canvas { display: block; width: 112px; height: 63px; border-radius: 10px; }
  .ts-frame b { position: absolute; left: 4px; bottom: 3px; font-size: 13px; background: rgba(43,33,64,0.75); color: #fff; border-radius: 8px; padding: 0 6px; }
  .ts-frame.on { box-shadow: 0 0 0 4px var(--sel); }
  .ts-frame.playing { box-shadow: 0 0 0 4px var(--accent); }
  .ts-add { width: 72px; height: 63px; border-radius: 12px; background: #e9f7ec; color: #2f9e44; flex: none; display: flex; align-items: center; justify-content: center; }
  .ts-add svg { width: 34px; height: 34px; }
  .ts-count { font-weight: 700; font-size: 18px; color: var(--soft); min-width: 54px; text-align: center; }

  /* ---- modal ---- */
  #ts-modal {
    position: fixed; inset: 0; background: rgba(43,33,64,0.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  #ts-modal.show { display: flex; }
  .ts-card { background: #fff; border-radius: 26px; padding: 26px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .ts-card h3 { font-size: 26px; margin-bottom: 8px; }
  .ts-card p { font-size: 18px; color: var(--soft); margin-bottom: 20px; }
  .ts-card .ts-row { display: flex; gap: 12px; justify-content: center; }
  .ts-card .ts-btn { flex: 1; }

  /* ---- narrow screens: stack it up ---- */
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    #ts-app {
      grid-template-areas: "top" "stage" "tools" "side" "bar";
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto auto auto;
      gap: 8px; padding: 8px;
    }
    #ts-top .ts-title { font-size: 20px; }
    .ts-label { display: none; }
    .ts-btn { height: 46px; min-width: 46px; padding: 0 10px; }
    #ts-tools { flex-direction: row; padding: 8px; overflow-x: auto; overflow-y: hidden; }
    .ts-sep { width: 2px; height: 44px; }
    .ts-tool { width: 54px; height: 54px; }
    .ts-colors { display: flex; }
    #ts-side { flex-direction: row; padding: 8px; }
    .ts-tabs { flex-direction: column; width: 56px; }
    .ts-tab span { display: none; }
    .ts-grid, .ts-grid.bgs { display: flex; overflow-x: auto; overflow-y: hidden; }
    .ts-pick { width: 64px; height: 64px; flex: none; }
    .ts-grid.bgs .ts-pick { width: 104px; height: 64px; }
    #ts-play { width: 60px; height: 60px; }
    .ts-frame canvas { width: 88px; height: 50px; }
    .ts-add { width: 58px; height: 50px; }
    .ts-count { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="../analytics.js"></script>
</head>
<body>
<div id="ts-app">
  <header id="ts-top">
    <a class="ts-btn ts-back" href="../" aria-label="Back to CuriousScout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="ts-title">Toon <span>Studio</span></div>
    <button class="ts-btn" id="ts-undo" aria-label="Undo" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="ts-btn" id="ts-new" aria-label="New movie" title="New movie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>
      <span class="ts-label">New</span>
    </button>
    <button class="ts-btn ts-big" id="ts-save" aria-label="Download my movie" title="Download my movie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span class="ts-label">Save movie</span>
    </button>
  </header>

  <aside id="ts-tools">
    <button class="ts-tool on" data-tool="move" aria-label="Move characters" title="Move characters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/><path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/><path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.3 15a1.6 1.6 0 0 1 2.5-2l1.2 1.4"/></svg>
    </button>
    <button class="ts-tool" data-tool="camera" aria-label="Move the camera" title="Move the camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="14" height="11" rx="2.5"/><path d="M16 11l6-3.5v10L16 14z"/><circle cx="6.5" cy="4.5" r="2"/><circle cx="12" cy="4.5" r="2"/></svg>
    </button>
    <button class="ts-tool" data-tool="pencil" aria-label="Pencil" title="Pencil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/><path d="M15 5l4 4"/></svg>
    </button>
    <button class="ts-tool" data-tool="fill" aria-label="Paint bucket" title="Paint bucket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l7-7 8 8-7 7a2 2 0 0 1-2.8 0L5 13.8a2 2 0 0 1 0-2.8z"/><path d="M5 12h15"/><path d="M20 16s2 2.3 2 3.5a2 2 0 0 1-4 0c0-1.2 2-3.5 2-3.5z"/></svg>
    </button>
    <button class="ts-tool" data-tool="split" aria-label="Cut friends in two" title="Cut friends in two">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>
    </button>
    <button class="ts-tool" data-tool="moles" aria-label="Moles: pull friends into new shapes" title="Moles: pull friends into new shapes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c1.5-4 4-6 10-6s8.5 2 10 6z"/><path d="M6 16c0-5 2.7-9 6-9s6 4 6 9"/><circle cx="10" cy="11" r="0.6" fill="currentColor"/><circle cx="14" cy="11" r="0.6" fill="currentColor"/><path d="M11 13.5h2"/></svg>
    </button>
    <button class="ts-tool" data-tool="eraser" aria-label="Eraser" title="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h13"/><path d="M5.5 14.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H8.5z"/><path d="M9 11l5 5"/></svg>
    </button>
    <div class="ts-sep"></div>
    <button class="ts-size" data-size="5" aria-label="Thin" title="Thin"><i style="width:8px;height:8px"></i></button>
    <button class="ts-size on" data-size="12" aria-label="Medium" title="Medium"><i style="width:15px;height:15px"></i></button>
    <button class="ts-size" data-size="26" aria-label="Thick" title="Thick"><i style="width:24px;height:24px"></i></button>
    <div class="ts-sep"></div>
    <div class="ts-colors" id="ts-colors"></div>
  </aside>

  <section id="ts-stagewrap">
    <canvas id="ts-stage" width="960" height="540"></canvas>
    <div id="ts-hint"></div>
  </section>

  <aside id="ts-side">
    <div class="ts-tabs">
      <button class="ts-tab on" data-tab="chars" aria-label="Characters" title="Characters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M6 7L5 3l4 2M18 7l1-4-4 2"/><circle cx="9.5" cy="12" r="0.6" fill="currentColor"/><circle cx="14.5" cy="12" r="0.6" fill="currentColor"/><path d="M10 16c1 .8 3 .8 4 0"/></svg>
        <span>Friends</span>
      </button>
      <button class="ts-tab" data-tab="bgs" aria-label="Places" title="Places">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>
        <span>Places</span>
      </button>
    </div>
    <div class="ts-grid" id="ts-chars"></div>
    <div class="ts-grid bgs" id="ts-bgs" style="display:none"></div>
  </aside>

  <footer id="ts-bar">
    <button class="ts-btn ts-big" id="ts-play" aria-label="Play" title="Play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
    </button>
    <button class="ts-btn" id="ts-speed" aria-label="Speed" title="Speed"></button>
    <button class="ts-btn" id="ts-onion" aria-label="See the last frame" title="See the last frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10" cy="12" r="6" opacity="0.35"/><circle cx="14" cy="12" r="6"/></svg>
    </button>
    <div id="ts-strip"></div>
    <span class="ts-count" id="ts-count"></span>
    <button class="ts-btn" id="ts-del" aria-label="Delete this frame" title="Delete this frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
  </footer>
</div>

<div id="ts-modal" role="dialog" aria-modal="true">
  <div class="ts-card">
    <h3 id="ts-mtitle"></h3>
    <p id="ts-mtext"></p>
    <div class="ts-row" id="ts-mrow"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =================================================================== setup */
  const W = 960, H = 540;          // the stage picture, in pixels
  const MAX_FRAMES = 48;
  const SAVE_KEY = 'toonstudio.movie.v2';
  const OLD_KEY = 'toonstudio.movie.v1';   // flat 2D movies, brought into 3D on load
  const SPEEDS = [
    { fps: 4,  label: 'Slow',   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c0-4 3-7 7-7s7 3 7 7z"/><path d="M18 16h2a2 2 0 0 0 0-4h-1"/><path d="M7 16v2M15 16v2"/></svg>' },
    { fps: 8,  label: 'Medium', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"/><path d="M9 21l3-6 3 2v4M7 12l3-4 4 1 2 3 3 1"/><path d="M10 8l2 7"/></svg>' },
    { fps: 14, label: 'Fast',   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>' }
  ];
  const COLORS = ['#2b2140', '#ffffff', '#ff5a5f', '#ff9f1c', '#ffd23f', '#6bd36b',
                  '#2fb5a8', '#3a86ff', '#8e5cf7', '#ff7ac6', '#a0673b', '#9aa3ad'];

  const $ = (id) => document.getElementById(id);
  const stage = $('ts-stage');
  const sctx = stage.getContext('2d');
  const track = (name, props) => { try { if (window.track) window.track(name, props); } catch (e) {} };

  if (!window.THREE) {
    $('ts-mtitle').textContent = 'Toon Studio needs the internet';
    $('ts-mtext').textContent = 'The 3D part couldn\'t load. Check your connection and try again.';
    $('ts-modal').classList.add('show');
    return;
  }

  const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A seeded random, so the places come out the same every time.
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ============================================================= 3D world */
  /* One WebGL renderer draws every picture: the stage, the onion skin, the
     frame strip, the pickers and the saved movie. Each picture is rendered,
     then copied onto an ordinary 2D canvas, where the drawing layer goes on
     top. */
  const gl = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  gl.setPixelRatio(1);
  gl.setSize(W, H, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
  const hemi = new THREE.HemisphereLight(0xffffff, 0xc8b9a0, 0.6);
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(5, 10, 7);
  scene.add(hemi, sun);

  // Toon shading: three flat steps of light instead of a smooth fade.
  const GRAD = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 195, 195, 195, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  GRAD.minFilter = GRAD.magFilter = THREE.NearestFilter;
  GRAD.generateMipmaps = false;
  GRAD.needsUpdate = true;

  const mats = {};
  const toon = (c) => mats[c] || (mats[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: GRAD }));
  const glow = (c) => mats['g' + c] || (mats['g' + c] = new THREE.MeshBasicMaterial({ color: c }));
  const INK = 0x2b2140;
  const OUTLINE = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

      for (const m of it.mo) {

        out.push({ it: it, m: m, x: (v3.x + 1) / 2 * W, y: (1 - v3.y) / 2 * H });

  // a dot about a millimetre across, so it hides as little as possible
  // (it can still be grabbed from further off: see the moles tool)
  function drawMole(q) {

    sctx.beginPath(); sctx.arc(q.x, q.y, 2.5 * px, 0, PI * 2);
    sctx.fillStyle = '#7a5233'; sctx.fill(); sctx.lineWidth = 1.5 * px; sctx.strokeStyle = '#fff'; sctx.stroke();
  }

  function render() {
    dirty = false;
    sctx.clearRect(0, 0, W, H);
    if (playing) { paintFrame(sctx, movie.frames[playIdx], true); return; }
    paintFrame(sctx, frame(), true);
    if (onion && cur > 0) {
      onionCtx.clearRect(0, 0, W, H);
      paintFrame(onionCtx, movie.frames[cur - 1], false);

    }

      sctx.save();
      sctx.setLineDash([16, 10]); sctx.lineCap = 'round';
      sctx.lineWidth = 5 * W / stage.clientWidth; sctx.strokeStyle = '#ff5a5f';
      sctx.lineJoin = 'round';

      const h = handles(it), r = handleR();
      sctx.save();
      sctx.setLineDash([10, 8]); sctx.lineWidth = 3 * W / stage.clientWidth; sctx.strokeStyle = '#3a86ff';
      sctx.strokeRect(h.x0, h.y0, h.x1 - h.x0, h.y1 - h.y0);
      sctx.restore();

      button(h.del, r, '#ff5a5f', 'del');
      button(h.flip, r, '#2fb5a8', 'flip');
      button(h.lift, r, '#8e5cf7', 'lift');
    }
  }

  function button(p, r, col, kind) {
    sctx.save();
    sctx.beginPath(); sctx.arc(p.x, p.y, r, 0, Math.PI * 2); sctx.fillStyle = col; sctx.fill();
    sctx.lineWidth = r * 0.16; sctx.strokeStyle = '#fff'; sctx.stroke();
    sctx.translate(p.x, p.y); sctx.scale(r / 26, r / 26);
    sctx.strokeStyle = '#fff'; sctx.lineWidth = 4; sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    sctx.beginPath();
    if (kind === 'del') { sctx.moveTo(-8, -8); sctx.lineTo(8, 8); sctx.moveTo(8, -8); sctx.lineTo(-8, 8); }
    else if (kind === 'turn') { sctx.arc(0, 0, 10, -2.6, 1.6); sctx.moveTo(-1, 10); sctx.lineTo(4, 5); sctx.moveTo(-1, 10); sctx.lineTo(4, 15); }

    else { sctx.moveTo(-12, 0); sctx.lineTo(12, 0); sctx.moveTo(-12, 0); sctx.lineTo(-6, -6); sctx.moveTo(-12, 0); sctx.lineTo(-6, 6); sctx.moveTo(12, 0); sctx.lineTo(6, -6); sctx.moveTo(12, 0); sctx.lineTo(6, 6); }

  /* ================================================================= frames */
  const strip = $('ts-strip');
  const thumbs = [];
  let thumbDirty = new Set();

  function buildStrip() {
    strip.innerHTML = '';
    thumbs.length = 0;
    movie.frames.forEach((fr, i) => {
      const b = document.createElement('button');
      b.className = 'ts-frame'; b.setAttribute('aria-label', 'Frame ' + (i + 1));
      const c = newCanvas(192, 108);
      b.appendChild(c);
      const n = document.createElement('b'); n.textContent = i + 1; b.appendChild(n);
      b.addEventListener('click', () => { if (playing) stopPlay(); goTo(i); });
      strip.appendChild(b);
      thumbs.push(c);
      thumbDirty.add(i);
    });
    const add = document.createElement('button');
    add.className = 'ts-add'; add.id = 'ts-addframe'; add.setAttribute('aria-label', 'Add a frame'); add.title = 'Next frame';
    add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    add.addEventListener('click', addFrame);
    strip.appendChild(add);
    markStrip();
  }

  function markStrip() {
    const kids = strip.querySelectorAll('.ts-frame');
    kids.forEach((k, i) => {
      k.classList.toggle('on', !playing && i === cur);
      k.classList.toggle('playing', playing && i === playIdx);
    });
    $('ts-count').textContent = (playing ? playIdx : cur) + 1 + ' / ' + movie.frames.length;
    $('ts-del').disabled = movie.frames.length <= 1;
    const add = $('ts-addframe');
    if (add) add.disabled = movie.frames.length >= MAX_FRAMES;
  }

  function scrollToFrame(i) {
    const k = strip.querySelectorAll('.ts-frame')[i];
    if (!k) return;
    const l = k.offsetLeft - strip.offsetLeft, r = l + k.offsetWidth;
    if (l < strip.scrollLeft + 10) strip.scrollLeft = l - 10;
    else if (r > strip.scrollLeft + strip.clientWidth - 10) strip.scrollLeft = r - strip.clientWidth + 10;
  }

  function paintThumbs() {
    for (const i of thumbDirty) {
      const c = thumbs[i], fr = movie.frames[i];
      if (!c || !fr) continue;
      const x = c.getContext('2d');
      x.save(); x.scale(c.width / W, c.height / H); paintFrame(x, fr, true); x.restore();
    }
    thumbDirty.clear();
  }

  function touched() { thumbDirty.add(cur); dirty = true; scheduleSave(); }

  function goTo(i) {
    cur = Math.max(0, Math.min(movie.frames.length - 1, i));
    if (sel != null && !selItem()) sel = null;
    markStrip(); scrollToFrame(cur); dirty = true;
  }

  /* The heart of stop-motion: the next frame starts as a copy of this one, so
     you only move what changes. */
  function addFrame() {
    if (movie.frames.length >= MAX_FRAMES) { hint('That\'s the most frames!'); return; }
    if (playing) stopPlay();
    pushUndo({ type: 'add', at: cur + 1 });
    movie.frames.splice(cur + 1, 0, makeFrame(frame()));
    cur++;
    buildStrip(); goTo(cur); scheduleSave();
    if (!seenAddHint) { seenAddHint = true; hint('Now move things a little bit!'); }
  }
  let seenAddHint = false;

  function deleteFrame() {
    if (movie.frames.length <= 1) return;
    if (playing) stopPlay();
    pushUndo({ type: 'del', at: cur, fr: movie.frames[cur] });
    movie.frames.splice(cur, 1);
    if (cur >= movie.frames.length) cur = movie.frames.length - 1;
    buildStrip(); goTo(cur); scheduleSave();
  }

  /* =================================================================== undo */
  const undoStack = [];
  const UNDO_MAX = 20;
  function snap() {
    const fr = frame();
    let img = null;
    if (fr.ink) { img = newCanvas(W, H); img.getContext('2d').drawImage(fr.cv, 0, 0); }
    return { type: 'edit', at: cur, img: img, items: fr.items.map(copyItem), cam: Object.assign({}, fr.cam) };
  }
  function pushUndo(u) {
    undoStack.push(u || snap());
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    $('ts-undo').disabled = false;
  }
  function undo() {
    if (playing) stopPlay();
    const u = undoStack.pop();
    $('ts-undo').disabled = !undoStack.length;
    if (!u) return;
    if (u.type === 'skin') {
      const k = skins.get(u.key);
      if (k) { k.ctx.clearRect(0, 0, SKIN, SKIN); k.ctx.drawImage(u.img, 0, 0); k.tex.needsUpdate = true; }
      allThumbs(); cur = u.at;
    } else if (u.type === 'split') {
      for (const w of u.was) if (movie.frames[w.at]) { movie.frames[w.at].items = w.items; thumbDirty.add(w.at); }
      cur = u.at;
    } else if (u.type === 'paint') {
      for (const w of u.was) {
        const it = movie.frames[w.at] && movie.frames[w.at].items.find(i => i.id === w.id);
        if (it) { it.p = w.p; thumbDirty.add(w.at); }
      }
      cur = u.at;
    } else if (u.type === 'add') {
      movie.frames.splice(u.at, 1); cur = Math.min(u.at - 1 < 0 ? 0 : u.at - 1, movie.frames.length - 1); buildStrip();
    } else if (u.type === 'del') {
      movie.frames.splice(u.at, 0, u.fr); cur = u.at; buildStrip();
    } else {
      const fr = movie.frames[u.at]; if (!fr) return;
      fr.ctx.clearRect(0, 0, W, H);
      if (u.img) fr.ctx.drawImage(u.img, 0, 0);
      fr.ink = !!u.img; fr.items = u.items; fr.cam = u.cam; cur = u.at;
      thumbDirty.add(u.at);
    }

  }

  /* ================================================================== tools */
  let tool = 'move', size = 12, color = '#2b2140';
  let seenCamHint = false, seenPaintHint = false, seenCutHint = false, seenPenHint = false, seenMoleHint = false, seenMoleDrag = false;

  function setTool(t) {
    tool = t;
    document.querySelectorAll('.ts-tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    dirty = true;
  }

  function toStage(e) {
    const r = stage.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  }
  /** The point on a flat floor `y` high that's under the finger. */

  }

  /** The nearest friend you can actually see under the finger, and which piece of it. */
  function firstHit(p) {
    const fr = frame();
    pose(fr, movie.bg, true);
    castFrom(p);
    for (const h of ray.intersectObjects(fr.items.map(it => pool.get(it.id).body), true)) {
      let o = h.object;
      while (o && o.userData.id == null) o = o.parent;
      if (!o) continue;
      const it = fr.items.find(i => i.id === o.userData.id), a = pool.get(it.id);
      if (a.cuts && cutAway(a, h.point)) continue;

    const h = firstHit(p);

    const it = selItem();
    if (it) { const b = handles(it); if (p.x > b.x0 && p.x < b.x1 && p.y > b.y0 && p.y < b.y1) return it; }
    return null;
  }

  /** The friend, and which piece of it, under the finger. */
  function hitPart(p) {
    const h = firstHit(p);
    if (!h) return null;
    const i = h.a.parts.findIndex(q => q.m === h.m);

  }

     painting on frame 1 paints it for the whole movie. */
  function paintFriend(hit) {
    const was = [], col = parseInt(color.slice(1), 16);
    for (let f = cur; f < movie.frames.length; f++) {
      const it = movie.frames[f].items.find(i => i.id === hit.it.id);
      if (!it) continue;
      was.push({ at: f, id: it.id, p: it.p ? Object.assign({}, it.p) : undefined });
      it.p = Object.assign({}, it.p, { [hit.i]: col });
      thumbDirty.add(f);
    }
    pushUndo({ type: 'paint', at: cur, was: was });
    touched();
  }

  /* Cutting: drag a path across a friend, any shape you like. A path that
     goes across splits it in two along the path; a loop drawn on it cuts
     the loop out, like a cookie cutter. Every friend the path touches is
     cut, into two pieces nudged apart, each its own friend. Like painting,
     it happens from this frame on. */
  function cutAlong(path) {
    const pts = [path[0]];
    for (const q of path) { const l = pts[pts.length - 1]; if (Math.hypot(q.x - l.x, q.y - l.y) >= 6) pts.push(q); }
    while (pts.length > 64) for (let i = pts.length - 2; i > 0; i -= 2) pts.splice(i, 1);
    const ids = new Set();
    for (const q of pts) {
      const h = firstHit(q);
      if (h && (h.it.cut || []).length < MAX_CUTS) ids.add(h.it.id);
    }
    if (pts.length < 2 || !ids.size) { hint('Drag right across a friend to cut it!'); return; }

    // the shape, in stage pixels, whose inside is one piece
    const a0 = pts[0], b0 = pts[pts.length - 1];
    const closed = pts.length > 8 && Math.hypot(b0.x - a0.x, b0.y - a0.y) < 40;

    if (!closed) {

      const A = ext(a0, pts[1]), B = ext(b0, pts[pts.length - 2]);

    for (let f = cur; f < movie.frames.length; f++) was.push({ at: f, items: movie.frames[f].items.map(copyItem) });
    const R = new THREE.Vector3(), Up = new THREE.Vector3(), c0 = new THREE.Vector3(), MT = new THREE.Matrix4();
    for (const id of ids) {
      const it = frame().items.find(i => i.id === id), a = pool.get(id);
      const b = handles(it);                       // poses the frame and boxes the friend
      box3.getCenter(c0);
      R.setFromMatrixColumn(camera.matrixWorld, 0); Up.setFromMatrixColumn(camera.matrixWorld, 1);
      const sc = c0.clone().project(camera), sx0 = (sc.x + 1) / 2 * W, sy0 = (1 - sc.y) / 2 * H;
      const k = 2 * camera.position.distanceTo(c0) * Math.tan(camera.fov * PI / 360) / H;   // world size of one pixel
      const mw = (b.x1 - b.x0) * 0.15, mh = (b.y1 - b.y0) * 0.15;
      const rx = b.x0 - mw, ry = b.y0 - mh, rw = b.x1 - b.x0 + mw * 2, rh = b.y1 - b.y0 + mh * 2;
      // where a world point lands on the picture, as 0..1 across the friend's box
      const uW = [R.x / (k * rw), R.y / (k * rw), R.z / (k * rw), (sx0 - R.dot(c0) / k - rx) / rw];
      const vW = [-Up.x / (k * rh), -Up.y / (k * rh), -Up.z / (k * rh), (sy0 + Up.dot(c0) / k - ry) / rh];
      // ...and the same, from the friend's own space
      MT.copy(a.body.matrixWorld).transpose();
      const u = new THREE.Vector4().fromArray(uW).applyMatrix4(MT).toArray().map(n => +n.toFixed(5));
      const v = new THREE.Vector4().fromArray(vW).applyMatrix4(MT).toArray().map(n => +n.toFixed(5));
      const poly = shape.map(q => [+((q.x - rx) / rw).toFixed(4), +((q.y - ry) / rh).toFixed(4)]);
      // the piece inside the shape pops out: towards the camera, or off to its side
      const push = closed ? camera.position.clone().sub(c0).normalize().multiplyScalar(0.3)
        : R.clone().multiplyScalar(side.x).addScaledVector(Up, -side.y).normalize().multiplyScalar(0.18);
      const idIn = nextId++, idOut = nextId++;
      copySkins(id, idIn); copySkins(id, idOut);
      for (let f = cur; f < movie.frames.length; f++) {
        const items = movie.frames[f].items, n = items.findIndex(i => i.id === id);
        if (n < 0) continue;
        const o = items[n];
        const piece = (nid, keep, dir) => Object.assign(copyItem(o), {
          id: nid, cut: (o.cut || []).concat([{ u: u, v: v, poly: poly, k: keep }]),
          x: o.x + push.x * dir, z: o.z + push.z * dir, h: Math.max(0, o.h + push.y * dir)
        });

        thumbDirty.add(f);
      }
    }
    pushUndo({ type: 'split', at: cur, was: was });
    sel = null;
    touched();
    hint('Snip! Use the hand to move the pieces.');
  }

  function skinPen(x) {
    x.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    x.fillStyle = x.strokeStyle = color; x.lineCap = 'round'; x.lineJoin = 'round';
  }

    const x = d.k.ctx;
    x.save(); skinPen(x);
    x.beginPath(); x.arc(q.x, q.y, d.r, 0, PI * 2); x.fill();
    x.restore();
    d.k.tex.needsUpdate = true; dirty = true; thumbDirty.add(cur);
  }
  function skinLine(d, q) {
    const x = d.k.ctx;
    x.save(); skinPen(x); x.lineWidth = d.r * 2;
    x.beginPath(); x.moveTo(d.last.x, d.last.y); x.lineTo(q.x, q.y); x.stroke();
    x.restore();
    d.k.tex.needsUpdate = true; dirty = true; thumbDirty.add(cur);
  }

  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (playing) { stopPlay(); return; }
    stage.setPointerCapture(e.pointerId);
    const p = toStage(e);
    if (tool === 'split') { drag = { kind: 'cut', path: [p] }; dirty = true; return; }

      const r = handleR();
      let got = null, best = r;

      let it, m, fresh = false;
      if (got) { it = got.it; m = got.m; }

        it = h.it;
        if ((it.mo || []).length >= MAX_MOLES) { hint('That friend has lots of moles already!'); return; }
        pushUndo();
        const lp = h.a.body.worldToLocal(hitV.copy(h.point));
        m = { p: [lp.x, lp.y, lp.z], d: [0, 0, 0] };
        it.mo = (it.mo || []).concat([m]);
        fresh = true;
        touched();
      }
      if (!fresh) pushUndo();
      // how far a pixel of finger is, out where the mole is, in the friend's own space
      pose(frame(), movie.bg, true);
      const a = pool.get(it.id);
      const at = new THREE.Vector3(m.p[0] + m.d[0], m.p[1] + m.d[1], m.p[2] + m.d[2]).applyMatrix4(a.body.matrixWorld);
      const k = 2 * camera.position.distanceTo(at) * Math.tan(camera.fov * PI / 360) / H;
      const R = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), Up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
      drag = { kind: 'mole', it: it, m: m, fresh: fresh, moved: false, x0: p.x, y0: p.y, d0: m.d.slice(), k: k, R: R, Up: Up,
        inv: new THREE.Matrix3().setFromMatrix4(a.body.matrixWorld).invert() };
      return;
    }
    if (tool === 'camera') {
      pushUndo();
      drag = { kind: 'cam', x0: p.x, y0: p.y, c0: Object.assign({}, frame().cam) };
      return;
    }
    if (tool === 'move') {
      const it = selItem();
      if (it) {
        const h = handles(it), r = handleR() * 1.25;
        const near = (q) => Math.hypot(p.x - q.x, p.y - q.y) < r;
        if (near(h.del)) {
          pushUndo(); frame().items = frame().items.filter(i => i !== it); sel = null; touched(); return;
        }
        if (near(h.flip)) { pushUndo(); it.f = !it.f; touched(); return; }
        if (near(h.turn)) {
          pushUndo();
          drag = { kind: 'turn', it: it, cx: h.cx, cy: h.cy, a0: Math.atan2(p.y - h.cy, p.x - h.cx), r0: it.r || 0,
            d0: Math.hypot(p.x - h.cx, p.y - h.cy), s0: it.s };
          return;
        }
        if (near(h.lift)) {
          pushUndo();
          // how far one pixel of finger is, out where the character stands
          const dist = camera.position.distanceTo(v3.set(it.x, it.h, it.z));
          drag = { kind: 'lift', it: it, y0: p.y, h0: it.h, k: 2 * dist * Math.tan(camera.fov * PI / 360) / H };

    if (piece >= 0) {
      const key = h.it.id + ':' + piece, k = skin(key);
      const was = newCanvas(SKIN, SKIN); was.getContext('2d').drawImage(k.cv, 0, 0);
      pushUndo({ type: 'skin', at: cur, key: key, img: was });
      // how big the brush is on the skin: look a brush-width away
      const r = (tool === 'eraser' ? size * 1.8 : size) / 2;
      const h2 = firstHit({ x: p.x + r, y: p.y });
      const a0 = skinAt(h.uv), a1 = h2 && h2.m === h.m && h2.uv ? skinAt(h2.uv) : null;
      const d = a1 ? Math.hypot(a1.x - a0.x, a1.y - a0.y) : 0;
      drag = { kind: 'skin', id: h.it.id, m: h.m, k: k, last: a0, r: d > 0.5 && d < SKIN / 4 ? d : 6 };

    }

    const fr = frame();
    drag = { kind: 'draw', last: p, mid: p };

    fr.ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    fr.ctx.beginPath(); fr.ctx.arc(p.x, p.y, (tool === 'eraser' ? size * 1.8 : size) / 2, 0, Math.PI * 2);

  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = toStage(e);
    if (drag.kind === 'move') {
      const f = floorAt(p, drag.it.h);
      if (f) {
        drag.it.x = clamp(f.x + drag.ox, -14, 14);
        drag.it.z = clamp(f.z + drag.oz, -12, 7);
        touched();
      }
    } else if (drag.kind === 'turn') {
      const it = drag.it;
      it.r = drag.r0 + Math.atan2(p.y - drag.cy, p.x - drag.cx) - drag.a0;
      it.s = clamp(drag.s0 * Math.hypot(p.x - drag.cx, p.y - drag.cy) / Math.max(drag.d0, 1), 0.3, 4);
      touched();
    } else if (drag.kind === 'lift') {
      drag.it.h = clamp(drag.h0 + (drag.y0 - p.y) * drag.k, 0, 8);

      drag.m.d = [drag.d0[0] + w.x, drag.d0[1] + w.y, drag.d0[2] + w.z];

    } else if (drag.kind === 'cam') {

  // Mouse wheel / trackpad: zoom the camera in and out.
  let wheelUndoAt = 0;

  /* Paint bucket: fills the region of the drawing that was clicked, bounded by
     whatever has been drawn (characters don't stop it — they're in the world
     behind the drawing). */
  function floodFill(fr, sx, sy, hex) {
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
    const img = fr.ctx.getImageData(0, 0, W, H), d = img.data;
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const i0 = (sy * W + sx) * 4;
    const tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2], ta = d[i0 + 3];
    if (ta > 200 && Math.abs(tr - r) < 8 && Math.abs(tg - g) < 8 && Math.abs(tb - b) < 8) return;
    const same = (i) => {
      const a = d[i + 3];
      if (ta < 60) return a < 60;                       // filling empty space: stop at any ink
      return a >= 60 && Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) < 90;
    };
    const seen = new Uint8Array(W * H);
    const stack = [sx, sy];
    while (stack.length) {
      const y = stack.pop(), x0 = stack.pop();
      let x = x0;
      while (x >= 0 && !seen[y * W + x] && same((y * W + x) * 4)) x--;
      x++;
      let up = false, down = false;
      while (x < W && !seen[y * W + x] && same((y * W + x) * 4)) {
        const p = y * W + x, i = p * 4;
        seen[p] = 1; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
        if (y > 0) {
          const q = p - W;
          if (!seen[q] && same(q * 4)) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false;
        }
        if (y < H - 1) {
          const q = p + W;
          if (!seen[q] && same(q * 4)) { if (!down) { stack.push(x, y + 1); down = true; } } else down = false;
        }
        x++;
      }
    }
    // Swallow the soft edge of the lines too, so no pale halo is left behind.
    for (let p = 0; p < W * H; p++) {
      if (seen[p]) continue;
      const x = p % W, y = (p / W) | 0;
      if ((x > 0 && seen[p - 1]) || (x < W - 1 && seen[p + 1]) || (y > 0 && seen[p - W]) || (y < H - 1 && seen[p + W])) {
        const i = p * 4;
        if (d[i + 3] < 250) { const a = d[i + 3] / 255; d[i] = d[i] * a + r * (1 - a); d[i + 1] = d[i + 1] * a + g * (1 - a); d[i + 2] = d[i + 2] * a + b * (1 - a); d[i + 3] = 255; }
      }
    }
    fr.ctx.putImageData(img, 0, 0);
    fr.ink = true;
  }

  /* ============================================================= side panel */
  function addChar(k) {
    if (playing) stopPlay();
    pushUndo();
    const fr = frame();
    const n = fr.items.length;
    // spiral outwards from the middle, so new friends don't land on each other
    const it = { id: nextId++, k: k, x: Math.sin(n * 2.4) * 1.5 * Math.sqrt(n), z: Math.cos(n * 2.4) * 1.1 * Math.sqrt(n), h: CHARS[k].h, s: 1.2, r: 0, f: false };
    fr.items.push(it);
    sel = it.id;
    setTool('move');
    touched();
    if (!seenDragHint) { seenDragHint = true; hint('Drag it around!'); }
  }
  let seenDragHint = false;

  function buildSide() {
    const chars = $('ts-chars'), bgs = $('ts-bgs');
    for (const k of CHAR_KEYS) {
      const b = document.createElement('button');
      b.className = 'ts-pick'; b.setAttribute('aria-label', k); b.title = k;
      const c = newCanvas(120, 120);
      charPicture(k, c.getContext('2d'), 120);
      b.appendChild(c);
      b.addEventListener('click', () => addChar(k));
      chars.appendChild(b);
    }
    const empty = { items: [], cam: defaultCam() };
    for (const k of BG_KEYS) {
      const b = document.createElement('button');
      b.className = 'ts-pick' + (k === movie.bg ? ' on' : ''); b.dataset.bg = k; b.setAttribute('aria-label', k); b.title = k;
      const c = newCanvas(192, 108);
      c.getContext('2d').drawImage(draw3D(empty, k, true), 0, 0, 192, 108);
      b.appendChild(c);
      b.addEventListener('click', () => {
        movie.bg = k;
        bgs.querySelectorAll('.ts-pick').forEach(p => p.classList.toggle('on', p.dataset.bg === k));
        movie.frames.forEach((_, i) => thumbDirty.add(i));
        dirty = true; scheduleSave();
      });
      bgs.appendChild(b);
    }
    document.querySelectorAll('.ts-tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.ts-tab').forEach(o => o.classList.toggle('on', o === t));
      chars.style.display = t.dataset.tab === 'chars' ? '' : 'none';
      bgs.style.display = t.dataset.tab === 'bgs' ? '' : 'none';
    }));
  }

  function buildTools() {
    document.querySelectorAll('.ts-tool').forEach(b => b.addEventListener('click', () => {
      setTool(b.dataset.tool);
      if (b.dataset.tool === 'camera' && !seenCamHint) { seenCamHint = true; hint('Drag to move the camera!'); }
      if (b.dataset.tool === 'fill' && !seenPaintHint) { seenPaintHint = true; hint('Tap a friend to paint it!'); }
      if (b.dataset.tool === 'pencil' && !seenPenHint) { seenPenHint = true; hint('Draw on a friend to paint on it!'); }
      if (b.dataset.tool === 'moles' && !seenMoleHint) { seenMoleHint = true; hint('Tap a friend for a mole, then drag it!'); }
      if (b.dataset.tool === 'split' && !seenCutHint) { seenCutHint = true; hint('Drag across a friend to cut it — any shape!'); }
    }));
    document.querySelectorAll('.ts-size').forEach(b => b.addEventListener('click', () => {
      size = +b.dataset.size;
      document.querySelectorAll('.ts-size').forEach(o => o.classList.toggle('on', o === b));
      if (tool === 'move' || tool === 'fill' || tool === 'camera' || tool === 'split' || tool === 'moles') setTool('pencil');
    }));
    const box = $('ts-colors');
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'ts-color' + (i === 0 ? ' on' : ''); b.style.background = c; b.setAttribute('aria-label', 'Colour ' + (i + 1));
      b.addEventListener('click', () => {
        color = c;
        box.querySelectorAll('.ts-color').forEach(o => o.classList.toggle('on', o === b));
        if (tool === 'move' || tool === 'eraser' || tool === 'camera' || tool === 'split' || tool === 'moles') setTool('pencil');
      });
      box.appendChild(b);
    });
  }

  /* =================================================================== play */
  const PLAY_ICON = $('ts-play').innerHTML;
  const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

  function startPlay() {
    if (movie.frames.length < 2) { hint('Press + to make more frames!'); }
    playing = true; playIdx = 0; playLast = performance.now(); playAt = 0;
    stage.classList.add('playing');
    $('ts-play').innerHTML = STOP_ICON; $('ts-play').setAttribute('aria-label', 'Stop');
    markStrip(); dirty = true;
    track('movie_played', { frames: movie.frames.length });
  }
  function stopPlay() {
    playing = false;
    stage.classList.remove('playing');
    $('ts-play').innerHTML = PLAY_ICON; $('ts-play').setAttribute('aria-label', 'Play');
    markStrip(); dirty = true;
  }

  function showSpeed() {
    const s = SPEEDS[movie.speed];
    $('ts-speed').innerHTML = s.icon + '<span class="ts-label">' + s.label + '</span>';
    $('ts-speed').title = 'Speed: ' + s.label;
  }

  function loop(now) {
    if (playing) {
      const step = 1000 / SPEEDS[movie.speed].fps;
      playAt += now - playLast;
      if (playAt >= step) {
        playAt %= step;
        playIdx = (playIdx + 1) % movie.frames.length;
        markStrip(); scrollToFrame(playIdx); dirty = true;
      }
    }
    playLast = now;
    if (dirty) render();
    if (thumbDirty.size) paintThumbs();
    requestAnimationFrame(loop);
  }

  /* ================================================================== hints */
  let hintTimer = 0;
  function hint(t) {
    const h = $('ts-hint'); h.textContent = t; h.classList.add('show');
    clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), 2600);
  }

  /* ================================================================== modal */
  function ask(title, text, buttons) {
    $('ts-mtitle').textContent = title; $('ts-mtext').textContent = text;
    const row = $('ts-mrow'); row.innerHTML = '';
    for (const b of buttons) {
      const el = document.createElement('button');
      el.className = 'ts-btn' + (b.big ? ' ts-big' : ''); el.textContent = b.label;
      el.addEventListener('click', () => { $('ts-modal').classList.remove('show'); if (b.go) b.go(); });
      row.appendChild(el);
    }
    $('ts-modal').classList.add('show');
  }

  /* ========================================================== save the work */
  let saveTimer = 0;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
  function saveNow() {
    try {
      const data = {
        v: 2, bg: movie.bg, speed: movie.speed, nextId: nextId, skins: skinData(),
        frames: movie.frames.map(fr => ({ d: fr.ink ? fr.cv.toDataURL('image/png') : null, items: fr.items, cam: fr.cam }))
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) { /* full or blocked: the movie still works, it just won't be kept */ }
  }
  function skinData() {
    const out = {};
    for (const [key, k] of skins) out[key] = k.cv.toDataURL('image/png');
    return out;
  }
  function read(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  /* A friend from a flat (2D) movie: left/right stays left/right, and higher
     up the old picture becomes further back. */
  function from2D(it) {
    return { id: it.id, k: it.k, x: (num(it.x, W / 2) / W - 0.5) * 12, z: num(it.y, H / 2) / H * 8 - 5, h: CHARS[it.k].h, s: num(it.s, 1), r: 0, f: !!it.f };
  }
  function paints(p) {
    if (!p || typeof p !== 'object') return undefined;
    const out = {};
    for (const k in p) if (/^\d+$/.test(k) && typeof p[k] === 'number') out[k] = p[k];
    return out;
  }
  function moles(mo) {
    if (!Array.isArray(mo)) return undefined;
    const v3ok = (a) => Array.isArray(a) && a.length === 3 && a.every(v => typeof v === 'number' && isFinite(v));
    const ok = mo.filter(m => m && v3ok(m.p) && v3ok(m.d)).slice(0, MAX_MOLES).map(m => ({ p: m.p.slice(), d: m.d.slice() }));
    return ok.length ? ok : undefined;
  }
  function cuts(c) {
    if (!Array.isArray(c)) return undefined;
    const nums = (a, n) => Array.isArray(a) && a.length === n && a.every(v => typeof v === 'number' && isFinite(v));
    const ok = c.filter(q => q && nums(q.u, 4) && nums(q.v, 4) && (q.k === 0 || q.k === 1) &&
      Array.isArray(q.poly) && q.poly.length >= 3 && q.poly.every(p => nums(p, 2)));
    return ok.length ? ok.slice(0, MAX_CUTS) : undefined;
  }
  function load() {
    let data = read(SAVE_KEY), old = false;
    if (!data) { data = read(OLD_KEY); old = !!data; }
    if (!data || !Array.isArray(data.frames) || !data.frames.length) return false;
    movie.bg = PLACES[data.bg] ? data.bg : 'meadow';
    movie.speed = SPEEDS[data.speed] ? data.speed : 1;
    nextId = num(data.nextId, 1);
    movie.frames = data.frames.slice(0, MAX_FRAMES).map((f, i) => {
      const fr = makeFrame();
      fr.items = (f.items || []).filter(it => it && CHARS[it.k]).map(it => old ? from2D(it) : {
        id: it.id, k: it.k, x: num(it.x, 0), z: num(it.z, 0), h: num(it.h, 0), s: num(it.s, 1), r: num(it.r, 0), f: !!it.f, p: paints(it.p), cut: cuts(it.cut), mo: moles(it.mo)
      });
      const c = f.cam || {};
      fr.cam = { a: num(c.a, 0), t: clamp(num(c.t, 0.3), 0.02, 1.35), d: clamp(num(c.d, 11), 5, 24) };
      for (const it of fr.items) if (it.id >= nextId) nextId = it.id + 1;
      if (f.d) {
        const img = new Image();
        img.onload = () => { fr.ctx.drawImage(img, 0, 0); fr.ink = true; thumbDirty.add(i); dirty = true; };
        img.src = f.d;
      }
      return fr;
    });
    if (data.skins && typeof data.skins === 'object') {
      for (const key in data.skins) {
        const src = data.skins[key];
        if (!/^\d+:\d+$/.test(key) || typeof src !== 'string' || !src.startsWith('data:image/')) continue;
        const img = new Image();
        img.onload = () => { const k = skin(key); k.ctx.drawImage(img, 0, 0); k.tex.needsUpdate = true; allThumbs(); dirty = true; };
        img.src = src;
      }
    }
    return true;
  }

  /* A first movie to press play on: a ball bouncing across the meadow, a cat
     turning to watch it, a bird flying past, and the camera swaying along. */
  function demo() {
    movie.bg = 'meadow'; movie.speed = 1; movie.frames = [];
    const catId = nextId++, ballId = nextId++, birdId = nextId++;
    const N = 12;
    for (let i = 0; i < N; i++) {
      const fr = makeFrame();
      const t = i / N;
      const x = -3 + t * 7;
      fr.cam = { a: Math.sin(t * PI * 2) * 0.35, t: 0.3, d: 11 };
      fr.items.push({ id: catId, k: 'cat', x: -5, z: -1.2, h: 0, s: 1.1, r: Math.atan2(x + 5, 1.2), f: false });
      fr.items.push({ id: ballId, k: 'ball', x: x, z: 0, h: Math.abs(Math.sin(t * PI * 3)) * 2.6, s: 0.9, r: t * 6, f: false });
      fr.items.push({ id: birdId, k: 'bird', x: 6 - t * 12, z: -4, h: 3 + Math.sin(t * PI * 4) * 0.4, s: 0.9, r: -PI / 2, f: false });
      movie.frames.push(fr);
    }
  }

  function newMovie() {
    ask('Start a new movie?', 'Your movie will be cleared.', [
      { label: 'Keep it' },
      { label: 'New movie', big: true, go: () => {
        if (playing) stopPlay();
        movie.frames = [makeFrame()]; cur = 0; sel = null; undoStack.length = 0; $('ts-undo').disabled = true;
        skins.clear();
        buildStrip(); goTo(0); saveNow();
        hint('Pick a friend to start!');
      } }
    ]);
  }

  /* ======================================================== download movie */
  function exportMovie() {
    if (playing) stopPlay();
    const can = newCanvas(W, H);
    if (!can.captureStream || !window.MediaRecorder) {
      ask('Oops!', 'This browser can\'t save movies. Try Chrome or Firefox.', [{ label: 'OK', big: true }]);
      return;
    }
    const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
    const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const cx = can.getContext('2d');
    const fps = SPEEDS[movie.speed].fps;
    paintFrame(cx, movie.frames[0], true);
    let rec;
    try {
      const stream = can.captureStream(fps);
      rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 4e6 } : undefined);
    } catch (e) {
      ask('Oops!', 'This browser can\'t save movies. Try Chrome or Firefox.', [{ label: 'OK', big: true }]);
      return;
    }
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: rec.mimeType || type || 'video/webm' });
      const ext = /mp4/.test(blob.type) ? 'mp4' : 'webm';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'my-cartoon.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      ask('Movie saved!', 'Look for my-cartoon.' + ext + ' in your downloads.', [{ label: 'Yay!', big: true }]);
      track('movie_saved', { frames: movie.frames.length });
    };
    // At least three seconds of film, so a short loop still makes a movie.
    const loops = Math.max(1, Math.ceil(3 * fps / movie.frames.length));
    const total = loops * movie.frames.length;
    let n = 0;
    ask('Making your movie…', 'Hold on a moment!', []);
    rec.start();
    const tick = () => {
      if (n >= total) { setTimeout(() => rec.stop(), 1000 / fps); return; }
      cx.clearRect(0, 0, W, H);
      paintFrame(cx, movie.frames[n % movie.frames.length], true);
      n++;
      setTimeout(tick, 1000 / fps);
    };
    tick();
  }

  /* ================================================================ layout */
  function fit() {
    const wrap = $('ts-stagewrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const s = Math.max(0.1, Math.min(w / W, h / H));
    stage.style.width = Math.floor(W * s) + 'px';
    stage.style.height = Math.floor(H * s) + 'px';
    dirty = true;
  }

  /* ================================================================= start */
  buildTools();
  buildSide();
  if (!load()) demo();
  showSpeed();
  buildStrip();
  goTo(0);
  fit();
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('ts-stagewrap'));
  $('ts-undo').disabled = true;

  $('ts-play').addEventListener('click', () => playing ? stopPlay() : startPlay());
  $('ts-speed').addEventListener('click', () => { movie.speed = (movie.speed + 1) % SPEEDS.length; showSpeed(); scheduleSave(); });
  $('ts-onion').addEventListener('click', () => {
    onion = !onion; $('ts-onion').style.opacity = onion ? 1 : 0.45; dirty = true;
    hint(onion ? 'You can see the last frame' : 'Last frame hidden');
  });
  $('ts-del').addEventListener('click', deleteFrame);
  $('ts-undo').addEventListener('click', undo);
  $('ts-new').addEventListener('click', newMovie);
  $('ts-save').addEventListener('click', exportMovie);

  window.addEventListener('keydown', (e) => {
    if ($('ts-modal').classList.contains('show')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if (e.key === ' ') { e.preventDefault(); playing ? stopPlay() : startPlay(); }
    else if (e.key === 'ArrowRight') { if (playing) stopPlay(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { if (playing) stopPlay(); goTo(cur - 1); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && sel != null && tool === 'move') {
      pushUndo(); frame().items = frame().items.filter(i => i.id !== sel); sel = null; touched();
    }
  });
  window.addEventListener('pagehide', saveNow);

  requestAnimationFrame(loop);
  setTimeout(() => hint('Press ▶ to watch the movie!'), 600);
})();
</script>
</body>
</html>
