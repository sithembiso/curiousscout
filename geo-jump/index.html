<style>
  :root{
    --bg:#0a0a16;
    --ink:#e8ecff;
    --cyan:#00e5ff;
    --magenta:#ff2d95;
    --gold:#ffb300;
    --hazard:#ff2e63;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Rajdhani',system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;   /* disables double-tap-to-zoom, keeps taps */
    background:radial-gradient(1200px 600px at 50% -10%, #15152e 0%, #0a0a16 60%);
  }
  #wrap{
    position:fixed;inset:0;
    width:100%;height:100%;
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;background:transparent;touch-action:none;}

  .layer{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:6%;gap:18px;}
  .hidden{display:none!important;}

  .title{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(34px,8vw,80px);letter-spacing:.04em;line-height:.95;
    text-transform:uppercase;
    background:linear-gradient(180deg,#fff, var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,229,255,.5));
  }
  .sub{font-size:clamp(14px,2.4vw,19px);letter-spacing:.18em;
    text-transform:uppercase;opacity:.7;font-weight:600;}

  .levels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .lvl{
    cursor:pointer;border:none;color:var(--ink);
    font-family:'Orbitron',sans-serif;font-weight:700;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);
    padding:16px 20px;border-radius:12px;min-width:150px;
    transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    text-align:left;
  }
  .lvl .n{display:block;font-size:11px;letter-spacing:.22em;opacity:.55;
    font-family:'Rajdhani';font-weight:700;text-transform:uppercase;}
  .lvl .t{display:block;font-size:19px;margin-top:4px;text-transform:uppercase;letter-spacing:.02em;}
  .lvl .d{display:block;font-size:12px;margin-top:8px;font-family:'Rajdhani';
    font-weight:600;letter-spacing:.06em;}
  .lvl:hover,.lvl:focus-visible{transform:translateY(-3px);outline:none;}
  .lvl[data-c="cyan"]{--ac:var(--cyan);}
  .lvl[data-c="magenta"]{--ac:var(--magenta);}
  .lvl[data-c="gold"]{--ac:var(--gold);}
  .lvl[data-c="green"]{--ac:#7cffb2;}
  .lvl[data-c="red"]{--ac:#ff3344;}
  .lvl[data-c="purple"]{--ac:#c850ff;}
  .lvl:hover,.lvl:focus-visible{border-color:var(--ac);
    box-shadow:0 0 24px -6px var(--ac), inset 0 0 0 1px var(--ac);}
  .lvl .d{color:var(--ac);}

  .hint{font-size:13px;letter-spacing:.12em;opacity:.5;text-transform:uppercase;
    font-weight:600;margin-top:4px;}

  /* In-game HUD */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #bar{position:absolute;left:5%;right:5%;top:18px;height:8px;
    border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
  #fill{height:100%;width:0%;border-radius:99px;
    background:var(--ac,var(--cyan));box-shadow:0 0 12px var(--ac,var(--cyan));
    transition:width .08s linear;}
  #toprow{position:absolute;left:5%;right:5%;top:34px;display:flex;
    justify-content:space-between;font-family:'Orbitron';font-weight:700;
    font-size:13px;letter-spacing:.12em;opacity:.85;}
  #pct{color:var(--ac,var(--cyan));}

  /* overlays */
  .end{gap:10px;}
  .endbig{font-family:'Orbitron';font-weight:900;font-size:clamp(30px,7vw,64px);
    text-transform:uppercase;letter-spacing:.04em;}
  .stat{font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.8;}
  .btnrow{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
  .btn{cursor:pointer;font-family:'Orbitron';font-weight:700;font-size:14px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--bg);
    background:var(--ac,var(--cyan));border:none;padding:14px 22px;border-radius:10px;
    box-shadow:0 0 24px -6px var(--ac,var(--cyan));transition:transform .12s ease;}
  .btn.ghost{background:transparent;color:var(--ink);
    border:1px solid rgba(255,255,255,.2);box-shadow:none;}
  .btn:hover{transform:translateY(-2px);}
  .deathprompt{font-size:14px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.6;font-weight:600;margin-top:6px;}

  /* Rotate-to-landscape prompt */
  .rotate{position:fixed;inset:0;z-index:50;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:20px;
    text-align:center;padding:10%;
    background:radial-gradient(900px 500px at 50% 40%, #15152e 0%, #07070f 70%);}
  .rotate-phone{width:88px;height:88px;color:var(--cyan);
    filter:drop-shadow(0 0 18px rgba(0,229,255,.55));
    transform-origin:50% 50%;
    animation:tilt 2.6s ease-in-out infinite;}
  @keyframes tilt{0%,38%{transform:rotate(0deg);}58%,100%{transform:rotate(-90deg);}}
  .rotate-title{font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(22px,6vw,32px);text-transform:uppercase;letter-spacing:.04em;
    background:linear-gradient(180deg,#fff,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .rotate-sub{font-size:clamp(14px,3.6vw,17px);opacity:.65;font-weight:600;
    letter-spacing:.04em;max-width:22ch;line-height:1.35;}
  @media (orientation:portrait) and (pointer:coarse){ .rotate{display:flex;} }
  @media (prefers-reduced-motion:reduce){ .rotate-phone{animation:none;transform:rotate(-45deg);} }
</style>
  <script defer src="../analytics.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="bar"><div id="fill"></div></div>
    <div id="toprow">
      <span id="lvlname">LEVEL</span>
      <span id="attempts">ATTEMPT 1</span>
      <span id="pct">0%</span>
    </div>
  </div>

  <!-- Menu -->
  <div id="menu" class="layer">
    <div class="title">Geo<br>Jump</div>
    <div class="sub">One button · ride the beat</div>
    <div class="levels">
      <button class="lvl" data-c="green" data-lvl="0">
        <span class="n">Start here</span><span class="t">Tutorial</span>
        <span class="d">Learn the controls</span>
      </button>
      <button class="lvl" data-c="cyan" data-lvl="1">
        <span class="n">Level 01</span><span class="t">Ignition</span>
        <span class="d">Warm up · jump &amp; fly</span>
      </button>
      <button class="lvl" data-c="magenta" data-lvl="2">
        <span class="n">Level 02</span><span class="t">Overdrive</span>
        <span class="d">Add gravity flips</span>
      </button>
      <button class="lvl" data-c="gold" data-lvl="3">
        <span class="n">Level 03</span><span class="t">Meltdown</span>
        <span class="d">Everything, faster</span>
      </button>
      <button class="lvl" data-c="red" data-lvl="4">
        <span class="n">Level 04</span><span class="t">Raging Anger</span>
        <span class="d">Spikes &amp; moving platforms</span>
      </button>
      <button class="lvl" data-c="purple" data-lvl="5">
        <span class="n">Boss · Level 05</span><span class="t">The Death Run</span>
        <span class="d">Five-spike precision</span>
      </button>
    </div>
    <div class="hint">Tap / click / Space to play</div>
  </div>

  <!-- Win / Lose -->
  <div id="end" class="layer end hidden">
    <div class="endbig" id="endtitle">Complete</div>
    <div class="stat" id="endstat"></div>
    <div class="btnrow">
      <button class="btn" id="retry">Retry</button>
      <button class="btn ghost" id="tomenu">Levels</button>
    </div>
  </div>
</div>

<!-- Rotate prompt (shows only on touch devices in portrait) -->
<div id="rotate" class="rotate">
  <svg class="rotate-phone" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect x="20" y="6" width="24" height="52" rx="5" stroke="currentColor" stroke-width="3"/>
    <line x1="28" y1="51" x2="36" y2="51" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="rotate-title">Rotate to landscape</div>
  <div class="rotate-sub">Geo Jump plays best with your phone turned sideways</div>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 960;          // logical width — recomputed to match the screen's aspect
  const H = 540;        // logical height — gameplay layout is built around this
  let dpr = 1;          // device pixel ratio for crisp rendering

  function resize(){
    const cw = window.innerWidth  || 960;
    const ch = window.innerHeight || 540;
    const aspect = cw/ch;
    W = Math.max(700, Math.round(H * aspect));   // fill width, never absurdly narrow
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }

  // play-field reference lines
  const FLOOR = 472;   // top of ground strip
  const CEIL  = 68;    // bottom of ceiling strip
  const PSIZE = 38;    // player square
  const PX    = 250;   // player fixed screen x

  // ---------- modes ----------
  const CUBE = 'cube', SHIP = 'ship', FLIP = 'flip';

  // ---------- level building helpers ----------
  // obstacle: {x, type, ...}  type: spike | cspike | block | pillar
  function L(cfg){
    const ob = [];
    const seg = [];
    const hints = [];
    let x = cfg.start;
    let cur = null;
    let curHint = null;
    function closeSeg(){ if(cur){ cur.end = x; seg.push(cur); cur=null; } }
    function closeHint(){ if(curHint){ curHint.to = x; if(curHint.text) hints.push(curHint); curHint=null; } }
    const api = {
      gap(px){ x += px; return api; },
      // open a new segment at the current cursor; it runs until the next mode()/end()
      mode(m){ closeHint(); closeSeg(); cur = {mode:m, start:x, end:x}; return api; },
      // coaching prompt shown from here until the next hint()/mode()/end()
      hint(text, sub){ closeHint(); curHint = {from:x, to:x, text:text||'', sub:sub||''}; return api; },
      // cube pieces (placed at current x, advancing x by w)
      spikes(n){ for(let i=0;i<n;i++){ ob.push({x:x, type:'spike'}); x+=40; } return api; },
      block(h, w){ ob.push({x:x, type:'block', h:(h||1), w:(w||1)}); x += 40*(w||1); return api; },
      // ship corridor pillar: gapTop = open-space start y, gapH = opening height
      pillar(gapTop, gapH){ ob.push({x:x, type:'pillar', gapTop, gapH}); x += 44; return api; },
      // flip spikes: side = 'floor' | 'ceil'
      fspike(side, n){ for(let i=0;i<(n||1);i++){ ob.push({x:x, type: side==='ceil'?'cspike':'spike'}); x+=40; } return api; },
      // a deadly spike pit crossed by N oscillating platforms
      bridge(o){
        const n=o.movers, w=o.w, gap=o.gap;
        const span = n*w + (n-1)*gap;
        ob.push({x:x, type:'pit', w:span});
        for(let i=0;i<n;i++){
          ob.push({x:x + i*(w+gap), type:'mover', w,
            baseY:o.baseY, amp:(o.amp||0), period:(o.period||2.4), phase:i*(o.stagger||1.3)});
        }
        x += span;
        return api;
      },
      end(){ closeHint(); closeSeg(); return {name:cfg.name, color:cfg.color, ac:cfg.ac, speed:cfg.speed,
                     bpm:cfg.bpm, len:x, segs:seg, obs:ob, hints:hints}; }
    };
    cfg.build(api);
    return api.end();
  }

  // segment lookup
  function modeAt(level, wx){
    for(const s of level.segs){ if(wx>=s.start && wx<s.end) return s.mode; }
    return CUBE;
  }

  // ---------- the levels ----------
  const LEVELS = [
    L({ name:'TUTORIAL', color:'#7cffb2', ac:'#7cffb2', speed:250, bpm:112, start:600,
      build(a){
        a.mode(CUBE)
          .hint('TAP TO JUMP', 'space  ·  click  ·  tap the screen')
          .gap(680).spikes(1)
          .hint('NICE — ONE MORE', 'one tap clears one spike')
          .gap(460).spikes(1)
          .hint('')
          .gap(460).spikes(2)
          .gap(560);
        a.mode(SHIP)
          .hint('HOLD TO FLY', 'hold = rise   ·   release = fall')
          .gap(560).pillar(120,320)
          .gap(420).pillar(120,320)
          .hint('STAY IN THE GAP', '')
          .gap(420).pillar(140,300)
          .gap(560);
        a.mode(FLIP)
          .hint('TAP TO FLIP GRAVITY', 'snap between floor and ceiling')
          .gap(620).fspike('ceil',2)
          .hint('FLIP UP TO DODGE', 'spikes are on the floor now')
          .gap(480).fspike('floor',2)
          .hint('')
          .gap(480).fspike('ceil',2)
          .gap(560);
        a.mode(CUBE)
          .hint("YOU'RE READY!", 'now try the real levels')
          .gap(560).spikes(1)
          .gap(700);
      }
    }),

    L({ name:'IGNITION', color:'#00e5ff', ac:'var(--cyan)', speed:330, bpm:128, start:600,
      build(a){
        a.mode(CUBE)
          .gap(520).spikes(1)
          .gap(260).spikes(1)
          .gap(280).spikes(2)
          .gap(270).block(1)
          .gap(260).spikes(1)
          .gap(280).spikes(2)
          .gap(260).spikes(1)
          .gap(270).block(1)
          .gap(280).spikes(2);
        a.gap(240);
        a.mode(SHIP)            // hold to fly
          .gap(300).pillar(170,230)
          .gap(280).pillar(150,220)
          .gap(280).pillar(190,210)
          .gap(280).pillar(150,220)
          .gap(280).pillar(180,210)
          .gap(280).pillar(150,210);
        a.gap(300);
        a.mode(CUBE)
          .gap(280).spikes(1)
          .gap(260).spikes(2)
          .gap(270).block(1)
          .gap(260).spikes(1)
          .gap(280).spikes(2)
          .gap(260).spikes(2);
        a.gap(700);
      }
    }),

    L({ name:'OVERDRIVE', color:'#ff2d95', ac:'var(--magenta)', speed:380, bpm:140, start:600,
      build(a){
        a.mode(CUBE)
          .gap(600).spikes(2)
          .gap(260).spikes(2)
          .gap(250).block(1)
          .gap(250).spikes(2)
          .gap(240).spikes(3)
          .gap(260).block(1)
          .gap(250).spikes(2);
        a.gap(220);
        a.mode(FLIP)            // tap to flip gravity
          .gap(280).fspike('ceil',2)   // safe on the floor — eases you in
          .gap(250).fspike('floor',2)  // now flip up
          .gap(250).fspike('ceil',2)
          .gap(250).fspike('floor',3)
          .gap(250).fspike('ceil',2)
          .gap(250).fspike('floor',2);
        a.gap(240);
        a.mode(SHIP)
          .gap(300).pillar(160,210)
          .gap(260).pillar(120,200)
          .gap(260).pillar(190,200)
          .gap(260).pillar(130,200)
          .gap(260).pillar(180,200)
          .gap(260).pillar(140,200);
        a.gap(260);
        a.mode(CUBE)
          .gap(280).spikes(2)
          .gap(250).spikes(3)
          .gap(260).block(1)
          .gap(240).spikes(2)
          .gap(250).spikes(3);
        a.gap(700);
      }
    }),

    L({ name:'MELTDOWN', color:'#ffb300', ac:'var(--gold)', speed:440, bpm:150, start:600,
      build(a){
        a.mode(CUBE)
          .gap(700).spikes(2)
          .gap(270).spikes(3)
          .gap(270).block(1)
          .gap(260).spikes(2)
          .gap(270).spikes(3)
          .gap(260).spikes(2)
          .gap(270).block(1);
        a.gap(240);
        a.mode(FLIP)
          .gap(280).fspike('ceil',2)
          .gap(240).fspike('floor',3)
          .gap(240).fspike('ceil',3)
          .gap(240).fspike('floor',3)
          .gap(240).fspike('ceil',2)
          .gap(240).fspike('floor',3);
        a.gap(240);
        a.mode(SHIP)
          .gap(300).pillar(160,190)
          .gap(250).pillar(120,180)
          .gap(250).pillar(200,180)
          .gap(250).pillar(120,180)
          .gap(250).pillar(190,180)
          .gap(250).pillar(140,180)
          .gap(250).pillar(180,180);
        a.gap(240);
        a.mode(FLIP)
          .gap(280).fspike('ceil',2)
          .gap(230).fspike('floor',3)
          .gap(230).fspike('ceil',3)
          .gap(230).fspike('floor',3);
        a.gap(240);
        a.mode(CUBE)
          .gap(280).spikes(3)
          .gap(260).block(1)
          .gap(260).spikes(3)
          .gap(260).spikes(2)
          .gap(270).spikes(3);
        a.gap(700);
      }
    }),

    L({ name:'RAGING ANGER', color:'#ff3344', ac:'#ff3344', speed:470, bpm:158, start:600,
      build(a){
        a.mode(CUBE)
          .gap(720).spikes(3)
          .gap(270).spikes(2)
          .gap(280).spikes(4)
          .gap(280).spikes(3)
          .gap(270).spikes(2)
          .gap(290).spikes(4);
        a.gap(300);
        a.mode(CUBE)
          .hint('JUMP THE PLATFORMS', 'the floor is death — ride across')
          .gap(340).bridge({movers:4, w:160, gap:120, baseY:390, amp:26, period:2.8})
          .gap(340).spikes(3)
          .gap(270).spikes(3)
          .gap(290).spikes(4);
        a.gap(280);
        a.mode(FLIP)
          .gap(320).fspike('ceil',3)
          .gap(230).fspike('floor',3)
          .gap(230).fspike('ceil',3)
          .gap(230).fspike('floor',3)
          .gap(230).fspike('ceil',2);
        a.gap(300);
        a.mode(CUBE)
          .hint('AGAIN — FASTER', '')
          .gap(300).bridge({movers:5, w:150, gap:125, baseY:388, amp:30, period:1.9})
          .gap(340).spikes(4)
          .gap(270).spikes(3)
          .gap(290).spikes(4)
          .gap(270).spikes(3);
        a.gap(700);
      }
    }),

    L({ name:'THE DEATH RUN', color:'#c850ff', ac:'#c850ff', speed:500, bpm:166, start:600,
      build(a){
        // opening — precision spike clusters, climbing to fives
        a.mode(CUBE)
          .gap(760).spikes(3)
          .gap(280).spikes(5)
          .gap(300).spikes(4)
          .gap(280).spikes(5)
          .gap(300).spikes(3)
          .gap(280).spikes(5);
        a.gap(300);
        // bridge 1 — narrow, fast platforms
        a.mode(CUBE)
          .hint('PERFECT TIMING ONLY', 'one slip = death')
          .gap(320).bridge({movers:5, w:140, gap:120, baseY:390, amp:28, period:1.7})
          .gap(320).spikes(5)
          .gap(300).spikes(4);
        a.gap(280);
        // gravity-flip chaos
        a.mode(FLIP)
          .gap(320).fspike('ceil',3)
          .gap(210).fspike('floor',4)
          .gap(210).fspike('ceil',3)
          .gap(210).fspike('floor',4)
          .gap(210).fspike('ceil',3);
        a.gap(300);
        // bridge 2 — six platforms, fastest
        a.mode(CUBE)
          .gap(300).bridge({movers:6, w:140, gap:120, baseY:390, amp:26, period:1.6})
          .gap(320).spikes(5)
          .gap(290).spikes(5)
          .gap(300).spikes(4);
        a.gap(280);
        // final gauntlet — back-to-back fives
        a.mode(CUBE)
          .hint('THE DEATH RUN', 'finish it')
          .gap(320).spikes(5)
          .gap(280).spikes(5)
          .gap(280).spikes(5);
        a.gap(700);
      }
    })
  ];

  // ================= AUDIO =================
  const Audio = (() => {
    let actx=null, master=null, bpm=128, started=false, startTime=0;
    let schedTimer=null, step=0, nextTime=0;
    const lookahead=0.1, tick=25;
    // scales (semitone offsets from base)
    const bassPat=[0,0,7,0, 5,0,7,3];          // 8 eighth-ish steps
    const leadPat=[12,15,19,15, 17,19,22,19, 12,15,19,24, 22,19,15,12];
    let baseHz=110;

    function ensure(){
      if(actx) return;
      actx = new (window.AudioContext||window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value=0.0;
      master.connect(actx.destination);
    }
    function note(freq,t,dur,type,gain,glide){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
      if(glide) o.frequency.exponentialRampToValueAtTime(freq*glide,t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(gain||0.2,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.02);
    }
    function kick(t){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,t);
      o.frequency.exponentialRampToValueAtTime(45,t+0.12);
      g.gain.setValueAtTime(0.7,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(master); o.start(t); o.stop(t+0.2);
    }
    function hat(t){
      const buf=actx.createBuffer(1,256,actx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<256;i++) d[i]=Math.random()*2-1;
      const s=actx.createBufferSource(); s.buffer=buf;
      const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
      const g=actx.createGain(); g.gain.setValueAtTime(0.18,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
      s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t+0.05);
    }
    function mtof(semi){ return baseHz*Math.pow(2,semi/12); }

    function scheduler(){
      const spb=60/bpm; const sixteenth=spb/2; // using eighth notes as base step
      while(nextTime < actx.currentTime + lookahead){
        const s=step%16;
        if(s%2===0) kick(nextTime);          // kick on each quarter
        hat(nextTime);
        note(mtof(bassPat[s%bassPat.length]-12), nextTime, sixteenth*0.9, 'sawtooth', 0.16);
        if(s%2===0) note(mtof(leadPat[s%leadPat.length]), nextTime, sixteenth*1.4, 'square', 0.07);
        nextTime += sixteenth; step++;
      }
    }
    return {
      start(b){
        ensure();
        if(actx.state==='suspended') actx.resume();
        bpm=b; step=0; started=true;
        startTime=actx.currentTime+0.06; nextTime=startTime;
        master.gain.cancelScheduledValues(actx.currentTime);
        master.gain.setTargetAtTime(0.5, actx.currentTime, 0.1);
        clearInterval(schedTimer);
        schedTimer=setInterval(scheduler, tick);
      },
      stop(){
        started=false; clearInterval(schedTimer);
        if(master) master.gain.setTargetAtTime(0.0001, actx.currentTime, 0.08);
      },
      // 0..1 pulse that resets every beat
      beat(){
        if(!actx||!started) return 0;
        const spb=60/bpm;
        const ph=((actx.currentTime-startTime)%spb)/spb;
        return Math.max(0,1-ph);
      },
      sfx(kind){
        if(!actx) return;
        const t=actx.currentTime;
        if(kind==='jump') note(660,t,0.12,'square',0.22,2.2);
        else if(kind==='flip') note(440,t,0.1,'triangle',0.2,1.8);
        else if(kind==='die'){
          const o=actx.createOscillator(),g=actx.createGain();
          o.type='sawtooth';o.frequency.setValueAtTime(300,t);
          o.frequency.exponentialRampToValueAtTime(40,t+0.4);
          g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
          o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.5);
        } else if(kind==='win'){
          [0,4,7,12].forEach((s,i)=>note(mtof(s+12),t+i*0.09,0.25,'square',0.18));
        }
      }
    };
  })();

  // ================= GAME =================
  const game = {
    state:'menu',        // menu | play | dead | win
    level:null, lvlIndex:0,
    attempts:1,
    wx:0,                // world scroll distance
    clock:0,             // time accumulator for moving platforms
    p:null,              // player
    particles:[],
    trail:[],
    input:{held:false, prev:false},
    shakeT:0, deadT:0, paused:false,
  };

  function resetPlayer(){
    game.p = { y: FLOOR-PSIZE, vy:0, rot:0, grav:1, onGround:true, mode:CUBE, jumpBuf:0 };
  }

  function startLevel(i){
    game.lvlIndex=i; game.level=LEVELS[i];
    document.documentElement.style.setProperty('--ac', game.level.color);
    game.wx=0; game.clock=0; game.particles=[]; game.trail=[];
    resetPlayer();
    game.state='play'; game.deadT=0; game.shakeT=0;
    show('hud'); hide('menu'); hide('end');
    document.getElementById('lvlname').textContent = game.level.name;
    document.getElementById('attempts').textContent = 'ATTEMPT '+game.attempts;
    Audio.start(game.level.bpm);
  }

  function die(){
    if(game.state!=='play') return;
    game.state='dead'; game.deadT=0; game.shakeT=0.4;
    Audio.stop(); Audio.sfx('die');
    burst(PX+PSIZE/2, game.p.y+PSIZE/2, game.level.color, 28);
    game.attempts++;
  }
  function win(){
    if(game.state!=='play') return;
    game.state='win'; Audio.stop(); Audio.sfx('win');
    document.getElementById('endtitle').textContent='Complete';
    document.getElementById('endtitle').style.color='var(--ac)';
    document.getElementById('endstat').textContent =
      game.level.name+' cleared in '+game.attempts+(game.attempts===1?' attempt':' attempts');
    show('end'); hide('hud');
  }
  function showDeath(){
    document.getElementById('endtitle').textContent='Crashed';
    document.getElementById('endtitle').style.color='var(--hazard)';
    document.getElementById('endstat').textContent = Math.round(progress()*100)+'% · attempt '+(game.attempts-1);
    show('end'); hide('hud');
  }

  function progress(){
    const total=game.level.len-700-game.level.segs[0].start;
    return Math.max(0,Math.min(1,(game.wx)/(total)));
  }

  // particles
  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=Math.random()*5+1.5;
      game.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
        life:1,color, size:Math.random()*5+2});
    }
  }

  // ---------- input ----------
  function press(){
    if(game.state==='menu') return;          // menu handled by buttons
    if(game.state==='win' || game.state==='dead'){
      // dead → quick retry, win handled by buttons but allow space restart
      if(game.state==='dead' && game.deadT>0.25) startLevel(game.lvlIndex);
      return;
    }
    game.input.held=true;
  }
  function release(){ game.input.held=false; }

  window.addEventListener('keydown', e=>{
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); press(); }
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') release();
  });
  canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });
  window.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // --- mobile zoom prevention (iOS ignores user-scalable=no) ---
  // block pinch-zoom gestures
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>
    document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
  // block double-tap-to-zoom, but never swallow taps on menu/end buttons
  let lastTouchEnd=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-lastTouchEnd<=320 && !e.target.closest('button')) e.preventDefault();
    lastTouchEnd=now;
  }, {passive:false});

  document.querySelectorAll('.lvl').forEach(b=>{
    b.addEventListener('click', ()=>{ game.attempts=1; startLevel(+b.dataset.lvl); });
  });
  document.getElementById('retry').addEventListener('click', ()=> startLevel(game.lvlIndex));
  document.getElementById('tomenu').addEventListener('click', ()=>{
    game.state='menu'; Audio.stop(); show('menu'); hide('end'); hide('hud');
  });

  // --- pause gameplay while a touch device is held in portrait ---
  const mqPortrait = window.matchMedia('(orientation: portrait) and (pointer: coarse)');
  function checkOrient(){ game.paused = mqPortrait.matches; if(game.paused) game.input.held=false; }
  function onViewportChange(){ resize(); checkOrient(); }
  if(mqPortrait.addEventListener) mqPortrait.addEventListener('change', onViewportChange);
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', ()=>setTimeout(onViewportChange,60));
  resize(); checkOrient();

  function show(id){ document.getElementById(id).classList.remove('hidden'); }
  function hide(id){ document.getElementById(id).classList.add('hidden'); }

  // ---------- physics ----------
  const GRAV_CUBE = 2700, JUMP_V = 820;
  const GRAV_FLIP = 2500, FLIP_V = 760;
  const GRAV_SHIP = 1500, SHIP_THRUST = 2600, SHIP_MAX = 560;

  function update(dt){
    if(game.paused){ game.input.prev=game.input.held; return; }   // frozen in portrait
    if(game.shakeT>0) game.shakeT=Math.max(0,game.shakeT-dt);
    // particles always update
    for(const pt of game.particles){
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.35; pt.life-=dt*1.6;
      pt.vx*=0.98;
    }
    game.particles=game.particles.filter(p=>p.life>0);

    if(game.state==='dead'){ game.deadT+=dt; return; }
    if(game.state!=='play') return;

    const lv=game.level, p=game.p;
    const justPressed = game.input.held && !game.input.prev;
    game.input.prev = game.input.held;

    // advance world
    game.wx += lv.speed*dt;
    game.clock += dt;
    p.mode = modeAt(lv, lv.segs[0].start + game.wx);

    // trail
    game.trail.push({x:PX, y:p.y, t:1});
    if(game.trail.length>14) game.trail.shift();
    for(const tr of game.trail) tr.t-=dt*3;

    // ---- per-mode physics ----
    if(p.mode===CUBE){
      p.grav=1;
      if(justPressed) p.jumpBuf=0.12;          // remember a press briefly
      if(p.jumpBuf>0) p.jumpBuf-=dt;
      p.onGround=false;
      p.vy += GRAV_CUBE*dt;
      p.y += p.vy*dt;
      if(p.y >= FLOOR-PSIZE){ p.y=FLOOR-PSIZE; p.vy=0; p.onGround=true; p.rot=Math.round(p.rot/90)*90; }
      else { p.rot += dt*360; }
    }
    else if(p.mode===FLIP){
      if(justPressed){ p.grav*=-1; Audio.sfx('flip'); p.onGround=false;
        burst(PX+PSIZE/2,p.y+PSIZE/2, lv.color, 6); }
      p.vy += GRAV_FLIP*p.grav*dt;
      p.y += p.vy*dt;
      if(p.grav>0 && p.y>=FLOOR-PSIZE){ p.y=FLOOR-PSIZE; p.vy=0; p.onGround=true; }
      else if(p.grav<0 && p.y<=CEIL){ p.y=CEIL; p.vy=0; p.onGround=true; }
      else p.onGround=false;
      p.rot += dt*360*p.grav;
    }
    else if(p.mode===SHIP){
      p.grav=1; p.onGround=false;
      if(game.input.held) p.vy -= SHIP_THRUST*dt; else p.vy += GRAV_SHIP*dt;
      p.vy = Math.max(-SHIP_MAX, Math.min(SHIP_MAX, p.vy));
      p.y += p.vy*dt;
      if(p.y < CEIL){ p.y=CEIL; p.vy=0; }
      if(p.y > FLOOR-PSIZE){ p.y=FLOOR-PSIZE; p.vy=0; }
      p.rot = Math.max(-25, Math.min(25, p.vy*0.06));
    }

    // ---- collisions ----
    const px0=PX+6, px1=PX+PSIZE-6, py0=p.y+6, py1=p.y+PSIZE-6;
    const camX = game.wx + lv.segs[0].start - PX; // world->screen offset
    for(const o of lv.obs){
      const sx = o.x - camX;                  // obstacle screen x (left)
      if(sx>W+60 || sx<-80) continue;
      if(o.type==='spike'){
        const cx=sx+20, base=FLOOR;
        if(px1>sx+6 && px0<sx+34 && py1>base-32) { if(triHit(px0,px1,py1,sx,base,true)) return die(); }
      }
      else if(o.type==='cspike'){
        const base=CEIL;
        if(px1>sx+6 && px0<sx+34 && py0<base+32){ if(triHit(px0,px1,py0,sx,base,false)) return die(); }
      }
      else if(o.type==='block'){
        const w=40*(o.w||1), h=40*(o.h||1);
        const bx0=sx, bx1=sx+w, by0=FLOOR-h, by1=FLOOR;
        if(px1>bx0 && px0<bx1 && py1>by0 && py0<by1){
          // land on top if falling and feet near top
          if(p.vy>=0 && (p.y+PSIZE) - by0 < 22){ p.y=by0-PSIZE; p.vy=0; p.onGround=true; }
          else return die();
        }
      }
      else if(o.type==='pillar'){
        const w=44;
        const topH=o.gapTop, botY=o.gapTop+o.gapH;
        // top block from CEIL..gapTop, bottom block from botY..FLOOR
        if(px1>sx && px0<sx+w){
          if(py0 < topH) return die();
          if(py1 > botY) return die();
        }
      }
      else if(o.type==='pit'){
        // deadly floor (spike carpet) spanning the bridge — only the platforms are safe
        if(px1>sx+4 && px0<sx+o.w-4 && py1 > FLOOR-26) return die();
      }
      else if(o.type==='mover'){
        // one-way moving platform: land on top while descending, never kills
        const top = movTop(o);
        if(px1>sx+4 && px0<sx+o.w-4){
          const feet = p.y+PSIZE;
          if(p.vy>=-40 && feet >= top-6 && feet <= top+16){
            p.y = top-PSIZE; p.vy=0; p.onGround=true;
          }
        }
      }
    }

    // jump executes after collisions so moving platforms (and blocks) count as ground
    if(p.mode===CUBE && p.onGround && p.jumpBuf>0){
      p.vy=-JUMP_V; p.onGround=false; p.jumpBuf=0; Audio.sfx('jump');
    }

    if(progress()>=1) return win();
  }

  // current top-edge Y of a moving platform
  function movTop(o){ return o.baseY + o.amp*Math.sin(game.clock*(6.2832/o.period)+o.phase); }

  // triangle-ish spike hit: shrink to be forgiving
  function triHit(px0,px1,feetOrHead, sx, base, isFloor){
    // treat deadly zone as inner triangle; approximate with center column box
    const cx0=sx+12, cx1=sx+28;
    if(px1<cx0 || px0>cx1) {
      // still allow tip overlap leniency: only kill if horizontally well inside
      return false;
    }
    if(isFloor) return feetOrHead > base-28;
    return feetOrHead < base+28;
  }

  // ---------- render ----------
  function drawHints(lv){
    if(!lv.hints || !lv.hints.length || game.state==='dead') return;
    const pos = lv.segs[0].start + game.wx;        // player's world position
    let h=null;
    for(const k of lv.hints){ if(pos>=k.from && pos<k.to){ h=k; break; } }
    if(!h) return;
    const a = Math.max(0, Math.min(1, (pos-h.from)/90, (h.to-pos)/90));  // fade in/out
    ctx.save();
    ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=lv.color; ctx.shadowBlur=20;
    ctx.fillStyle='#fff';
    ctx.font='700 32px Orbitron, system-ui, sans-serif';
    ctx.fillText(h.text, W/2, 132);
    if(h.sub){
      ctx.shadowBlur=0; ctx.globalAlpha=a*0.85; ctx.fillStyle=lv.color;
      ctx.font='600 18px Rajdhani, system-ui, sans-serif';
      ctx.fillText(h.sub, W/2, 170);
    }
    ctx.restore();
  }

  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);   // crisp scaling; draw in logical W×H
    ctx.clearRect(0,0,W,H);
    const lv=game.level;
    const beat = Audio.beat();
    const color = lv? lv.color : '#00e5ff';

    // shake
    let sx=0, sy=0;
    if(game.shakeT>0){ const s=game.shakeT*22; sx=(Math.random()-.5)*s; sy=(Math.random()-.5)*s; }
    ctx.save(); ctx.translate(sx,sy);

    drawBackground(color, beat);

    if(game.state!=='menu' && lv){
      drawObstacles(lv);
      drawPlayer(lv, beat);
      drawHints(lv);
    }
    drawParticles();

    ctx.restore();

    // HUD updates
    if(game.state==='play' && lv){
      const pc=Math.round(progress()*100);
      document.getElementById('fill').style.width=pc+'%';
      document.getElementById('pct').textContent=pc+'%';
    }
    if(game.state==='dead' && game.deadT>0.5){
      const end=document.getElementById('end');
      if(end.classList.contains('hidden')) showDeath();
    }
  }

  function drawBackground(color, beat){
    // gradient sky
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0c0c1e'); g.addColorStop(1,'#070710');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // moving neon grid in the play area
    const glow=0.12+beat*0.22;
    ctx.save();
    ctx.globalAlpha=glow;
    ctx.strokeStyle=color; ctx.lineWidth=1;
    const off = (game.wx*0.6)%60;
    for(let x=-off; x<W; x+=60){
      ctx.beginPath(); ctx.moveTo(x,CEIL); ctx.lineTo(x,FLOOR); ctx.stroke();
    }
    for(let y=CEIL; y<=FLOOR; y+=60){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    ctx.restore();

    // ground + ceiling strips
    ctx.fillStyle='#05050d';
    ctx.fillRect(0,FLOOR,W,H-FLOOR);
    ctx.fillRect(0,0,W,CEIL);
    // neon edges, pulse with beat
    ctx.save();
    ctx.shadowColor=color; ctx.shadowBlur=14+beat*22;
    ctx.fillStyle=color;
    ctx.fillRect(0,FLOOR,W,3);
    ctx.fillRect(0,CEIL-3,W,3);
    ctx.restore();
  }

  function drawObstacles(lv){
    const camX = game.wx + lv.segs[0].start - PX;
    ctx.save();
    for(const o of lv.obs){
      const sx=o.x-camX;
      if(sx>W+80 || sx< -120) continue;
      ctx.shadowColor=lv.color;
      if(o.type==='spike') drawSpike(sx, FLOOR, true, lv.color);
      else if(o.type==='cspike') drawSpike(sx, CEIL, false, lv.color);
      else if(o.type==='block') drawBlock(sx, 40*(o.w||1), 40*(o.h||1), lv.color);
      else if(o.type==='pillar') drawPillar(sx, o, lv.color);
      else if(o.type==='pit') drawPit(sx, o.w);
      else if(o.type==='mover') drawMover(sx, o, lv.color);
    }
    ctx.restore();
  }
  function drawPit(sx, w){
    // jagged deadly carpet of spikes along the floor
    for(let x=sx; x<sx+w; x+=40){
      ctx.shadowColor='#ff2e63'; ctx.shadowBlur=10;
      ctx.fillStyle='#ff2e63';
      ctx.beginPath();
      ctx.moveTo(x,FLOOR); ctx.lineTo(x+20,FLOOR-30); ctx.lineTo(x+40,FLOOR);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  function drawMover(sx, o, color){
    const top=movTop(o), h=18;
    ctx.shadowColor=color; ctx.shadowBlur=18;
    ctx.fillStyle=color; ctx.globalAlpha=.22; ctx.fillRect(sx,top,o.w,h); ctx.globalAlpha=1;
    ctx.lineWidth=2; ctx.strokeStyle=color; ctx.strokeRect(sx+1,top+1,o.w-2,h-2);
    ctx.fillStyle=color; ctx.fillRect(sx,top,o.w,4);      // bright top edge
    ctx.shadowBlur=0;
    // support glow streaks hinting it's airborne
    ctx.globalAlpha=.35; ctx.fillStyle=color;
    ctx.fillRect(sx+o.w*0.5-1, top+h, 2, 10);
    ctx.globalAlpha=1;
  }
  function drawSpike(sx, base, floor, color){
    ctx.shadowBlur=12;
    ctx.fillStyle='#ff2e63';
    ctx.beginPath();
    if(floor){ ctx.moveTo(sx,base); ctx.lineTo(sx+20,base-36); ctx.lineTo(sx+40,base); }
    else { ctx.moveTo(sx,base); ctx.lineTo(sx+20,base+36); ctx.lineTo(sx+40,base); }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();
    if(floor){ ctx.moveTo(sx+15,base); ctx.lineTo(sx+20,base-20); ctx.lineTo(sx+25,base); }
    else { ctx.moveTo(sx+15,base); ctx.lineTo(sx+20,base+20); ctx.lineTo(sx+25,base); }
    ctx.closePath(); ctx.fill();
  }
  function drawBlock(sx, w, h, color){
    const by=FLOOR-h;
    ctx.shadowBlur=14;
    ctx.fillStyle=color; ctx.globalAlpha=0.18; ctx.fillRect(sx,by,w,h); ctx.globalAlpha=1;
    ctx.lineWidth=2; ctx.strokeStyle=color; ctx.strokeRect(sx+1,by+1,w-2,h-2);
    ctx.shadowBlur=0;
    ctx.fillStyle=color; ctx.fillRect(sx,by,w,4); // bright top
  }
  function drawPillar(sx, o, color){
    const w=44;
    ctx.shadowBlur=12; ctx.fillStyle=color;
    ctx.globalAlpha=.25;
    ctx.fillRect(sx,CEIL,w,o.gapTop-CEIL);
    ctx.fillRect(sx,o.gapTop+o.gapH,w,FLOOR-(o.gapTop+o.gapH));
    ctx.globalAlpha=1; ctx.lineWidth=2; ctx.strokeStyle=color;
    ctx.strokeRect(sx,CEIL,w,o.gapTop-CEIL);
    ctx.strokeRect(sx,o.gapTop+o.gapH,w,FLOOR-(o.gapTop+o.gapH));
    ctx.shadowBlur=0;
  }

  function drawPlayer(lv, beat){
    const p=game.p; if(!p) return;
    if(game.state==='dead'){ return; } // exploded into particles
    // trail
    for(const tr of game.trail){
      if(tr.t<=0) continue;
      ctx.globalAlpha=tr.t*0.25;
      ctx.fillStyle=lv.color;
      const s=PSIZE*0.8;
      ctx.fillRect(tr.x+(PSIZE-s)/2, tr.y+(PSIZE-s)/2, s, s);
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.translate(PX+PSIZE/2, p.y+PSIZE/2);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.shadowColor=lv.color; ctx.shadowBlur=18+beat*14;
    // body
    ctx.fillStyle='#fff';
    ctx.fillRect(-PSIZE/2,-PSIZE/2,PSIZE,PSIZE);
    ctx.shadowBlur=0;
    ctx.fillStyle=lv.color;
    ctx.fillRect(-PSIZE/2+6,-PSIZE/2+6,PSIZE-12,PSIZE-12);
    ctx.fillStyle='#fff';
    ctx.fillRect(-6,-6,12,12);
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawParticles(){
    for(const pt of game.particles){
      ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=pt.color;
      ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
    }
    ctx.globalAlpha=1;
  }

  // ---------- main loop ----------
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;            // clamp big gaps
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
