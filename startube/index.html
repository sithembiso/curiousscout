<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StarTube</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23ff3d6e'/%3E%3Cpath d='M32 12l5.9 12 13.1 1.9-9.5 9.3 2.2 13.1L32 42.1l-11.7 6.2 2.2-13.1L13 25.9 26.1 24z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0b1f;
    --bg2: #16132e;
    --card: #1e1a3d;
    --line: #2d2858;
    --ink: #f3f0ff;
    --soft: #a9a2d1;
    --accent: #ff3d6e;
    --accent2: #ffc93c;
    --sel: #6d5dfc;
  }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; min-height: 100%; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .st-hide { display: none !important; }

  /* ---- top bar ---- */
  #st-top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: rgba(13,11,31,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  #st-menu { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  #st-menu:hover { background: var(--card); }
  .st-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 22px; flex: none; }
  .st-logo i { width: 34px; height: 26px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 16px; }
  .st-logo span { color: var(--accent2); }
  #st-search { flex: 1; min-width: 0; max-width: 560px; margin: 0 auto; display: flex; }
  #st-search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; border-radius: 20px 0 0 20px; border: 1px solid var(--line); background: var(--bg2); outline: none; }
  #st-search input:focus { border-color: var(--sel); }
  #st-search button { width: 56px; height: 40px; border-radius: 0 20px 20px 0; border: 1px solid var(--line); border-left: none; background: var(--card); }
  #st-upbtn { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--card); font-weight: 600; display: flex; align-items: center; gap: 6px; flex: none; }
  #st-upbtn:hover { background: var(--line); }

  /* ---- layout ---- */
  #st-wrap { display: flex; }
  #st-side { width: 220px; flex: none; padding: 12px; position: sticky; top: 61px; height: calc(100vh - 61px); overflow-y: auto; }
  .st-nav { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; font-weight: 500; }
  .st-nav:hover { background: var(--card); }
  .st-nav.on { background: var(--card); color: var(--accent2); }
  .st-sidehead { font-size: 13px; color: var(--soft); padding: 14px 12px 6px; text-transform: uppercase; letter-spacing: 1px; }
  .st-sep { height: 1px; background: var(--line); margin: 10px 0; }
  #st-main { flex: 1; min-width: 0; padding: 20px 24px 60px; }

  /* ---- chips ---- */
  .st-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
  .st-chip { flex: none; padding: 7px 14px; border-radius: 10px; background: var(--card); font-weight: 500; font-size: 14px; }
  .st-chip.on { background: var(--ink); color: var(--bg); }

  /* ---- video grid ---- */
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 16px; }
  .st-tile { display: block; }
  .st-thumb { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--card); }
  .st-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
  .st-tile:hover .st-thumb img { transform: scale(1.04); }
  .st-dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .st-mine { position: absolute; left: 8px; top: 8px; background: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .st-meta { display: flex; gap: 10px; margin-top: 10px; }
  .st-av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .st-title { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .st-sub { color: var(--soft); font-size: 14px; margin-top: 3px; }

  /* ---- watch page ---- */
  .st-watch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; }
  #st-player { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; user-select: none; }
  #st-player canvas, #st-player video { width: 100%; height: 100%; display: block; object-fit: contain; }
  #st-player:fullscreen { border-radius: 0; }
  .st-cap { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: 86%; background: rgba(0,0,0,0.72); padding: 6px 14px; border-radius: 8px; font-size: clamp(14px, 2.4vw, 22px); text-align: center; pointer-events: none; }
  .st-big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .st-big i { width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-style: normal; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: scale(0.8); }
  .st-big i.show { opacity: 1; transform: scale(1); }
  .st-ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 12px 8px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); transition: opacity 0.3s; }
  #st-player.idle .st-ctrl { opacity: 0; }
  #st-player.idle { cursor: none; }
  .st-bar { position: relative; height: 16px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .st-bar .track { position: absolute; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; transition: height 0.15s; }
  .st-bar:hover .track { height: 6px; }
  .st-bar .fill { position: absolute; left: 0; height: 4px; background: var(--accent); border-radius: 2px; }
  .st-bar:hover .fill { height: 6px; }
  .st-bar .knob { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
  .st-row { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .st-cb { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .st-cb:hover { background: rgba(255,255,255,0.15); }
  .st-cb.on { color: var(--accent2); }
  .st-time { font-size: 14px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .st-vol { width: 80px; accent-color: var(--accent); }
  .st-end { position: absolute; inset: 0; background: rgba(13,11,31,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; }
  .st-end img { width: min(320px, 60%); border-radius: 12px; }
  .st-end .st-btn { margin: 0 4px; }
  h1.st-h { font-size: 22px; margin: 14px 0 10px; line-height: 1.3; }
  .st-chan { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .st-chan .st-av { width: 44px; height: 44px; font-size: 22px; }
  .st-btn { height: 38px; padding: 0 16px; border-radius: 19px; background: var(--card); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .st-btn:hover { background: var(--line); }
  .st-btn.red { background: var(--accent); }
  .st-btn.red:hover { filter: brightness(1.1); }
  .st-btn.white { background: var(--ink); color: var(--bg); }
  .st-btn.on { background: var(--sel); }
  .st-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; position: relative; }
  .st-desc { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 14px; white-space: pre-wrap; line-height: 1.5; }
  .st-desc b { display: block; margin-bottom: 4px; }
  .st-comments h3 { margin: 22px 0 12px; font-size: 19px; }
  .st-cform { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; }
  .st-cform input { flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 8px 2px; outline: none; }
  .st-cform input:focus { border-color: var(--ink); }
  .st-c { display: flex; gap: 12px; margin-bottom: 16px; }
  .st-c b { font-size: 14px; }
  .st-c small { color: var(--soft); margin-left: 6px; }
  .st-c p { margin-top: 2px; line-height: 1.4; }
  .st-note { color: var(--soft); font-size: 13px; }
  .st-next { display: flex; flex-direction: column; gap: 10px; }
  .st-mini { display: grid; grid-template-columns: 168px 1fr; gap: 10px; }
  .st-mini .st-thumb { border-radius: 10px; }
  .st-mini .st-title { font-size: 14px; }
  .st-mini .st-sub { font-size: 12px; }
  .st-menu { position: absolute; right: 0; top: 44px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 230px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .st-menu label { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; }
  .st-menu label:hover { background: var(--line); }
  .st-menu input[type=text] { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 6px; outline: none; }

  /* ---- channel / pages ---- */
  .st-banner { height: 160px; border-radius: 16px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .st-chead { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; }
  .st-chead .st-av { width: 88px; height: 88px; font-size: 44px; }
  .st-chead h1 { font-size: 30px; }
  h2.st-sec { font-size: 21px; margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2.st-sec:first-child { margin-top: 0; }
  .st-empty { color: var(--soft); padding: 30px 0; text-align: center; }
  .st-empty b { display: block; font-size: 44px; margin-bottom: 8px; }

  /* ---- upload ---- */
  .st-form { max-width: 640px; display: grid; gap: 14px; }
  .st-form label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  .st-form input[type=text], .st-form textarea { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; font-weight: 400; }
  .st-form input:focus, .st-form textarea:focus { border-color: var(--sel); }
  .st-drop { border: 2px dashed var(--line); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; }
  .st-drop:hover, .st-drop.over { border-color: var(--sel); background: var(--bg2); }
  .st-drop b { display: block; font-size: 40px; }
  .st-preview { display: flex; gap: 14px; align-items: center; background: var(--card); padding: 10px; border-radius: 12px; }
  .st-preview img { width: 160px; border-radius: 8px; }
  .st-private { background: #1f3a2c; color: #b6f5cd; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }

  #st-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 50; pointer-events: none; }
  #st-toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 1100px) { .st-watch { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) {
    #st-side { position: fixed; left: 0; top: 61px; background: var(--bg); z-index: 15; transform: translateX(-100%); transition: transform 0.25s; border-right: 1px solid var(--line); }
    #st-side.open { transform: none; }
    #st-main { padding: 14px 14px 60px; }
    .st-logo b { display: none; }
    #st-upbtn span { display: none; }
    #st-upbtn { padding: 0 12px; }
    #st-top { gap: 8px; padding: 10px; }
    .st-mini { grid-template-columns: 140px 1fr; }
    .st-vol { display: none; }
    #st-search button { width: 44px; }
    .st-actions { margin-left: 0; width: 100%; }
    .st-cform { flex-wrap: wrap; }
    .st-cform input { flex-basis: calc(100% - 56px); }
    .st-cform .st-btn { margin-left: auto; }
    .st-cb { width: 34px; height: 34px; }
    .st-cap { bottom: 54px; font-size: 13px; }
  }
</style>
<script defer src="../analytics.js"></script>
</head>
<body>
<header id="st-top">
  <button id="st-menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="st-logo" href="#/"><i>⭐</i><b>Star<span>Tube</span></b></a>
  <form id="st-search" role="search">
    <input id="st-q" type="search" placeholder="Search" aria-label="Search">
    <button aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </form>
  <a id="st-upbtn" href="#/upload"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Upload</span></a>
</header>
<div id="st-wrap">
  <nav id="st-side"></nav>
  <main id="st-main"></main>
</div>
<div id="st-toast"></div>

<script>
(function () {
  'use strict';

  /* ======================================================== little helpers */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  // A fixed "random" number per (i, k), so a frame looks the same however you reach it
  const hash = (i, k) => { const x = Math.sin(i * 127.1 + (k || 0) * 311.7) * 43758.5453; return x - Math.floor(x); };
  const track = (n, p) => { try { if (window.track) window.track(n, p); } catch (e) {} };
  const ago = (ms) => {
    const s = (Date.now() - ms) / 1000;
    if (s < 60) return 'just now';
    const u = [[31536000, 'year'], [2592000, 'month'], [604800, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
    for (const [n, w] of u) if (s >= n) { const k = Math.floor(s / n); return k + ' ' + w + (k > 1 ? 's' : '') + ' ago'; }
  };
  const nice = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(n);
  let toastT = 0;
  function toast(t) { const el = $('#st-toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

  /* ============================================================ the canvas */
  /* Built-in videos are drawn live from the time on the clock — every frame
     is a pure function of t, so seeking anywhere is instant. */
  const VW = 960, VH = 540;
  function sky(c, top, bottom) { const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(0, 0, VW, VH); }
  function circ(c, x, y, r, col) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
  function stars(c, n, seed, tw, t) { for (let i = 0; i < n; i++) { const a = 0.4 + 0.6 * Math.abs(Math.sin(t * tw + i)); c.globalAlpha = a; circ(c, hash(i, seed) * VW, hash(i, seed + 1) * VH, hash(i, seed + 2) * 1.8 + 0.4, '#fff'); } c.globalAlpha = 1; }
  function bigText(c, txt, x, y, size, col, outline) {
    c.font = '700 ' + size + 'px Fredoka, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (outline) { c.lineWidth = size / 8; c.strokeStyle = outline; c.lineJoin = 'round'; c.strokeText(txt, x, y); }
    c.fillStyle = col; c.fillText(txt, x, y);
  }
  function eye(c, x, y, r, look) { circ(c, x, y, r, '#fff'); circ(c, x + (look || 0) * r * 0.3, y, r * 0.55, '#1a1530'); circ(c, x + (look || 0) * r * 0.3 + r * 0.2, y - r * 0.2, r * 0.18, '#fff'); }
  function cloud(c, x, y, s, col) { c.fillStyle = col || '#fff'; c.beginPath(); c.arc(x, y, 26 * s, 0, 7); c.arc(x + 30 * s, y - 12 * s, 32 * s, 0, 7); c.arc(x + 62 * s, y, 24 * s, 0, 7); c.rect(x, y, 62 * s, 24 * s); c.fill(); }
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

  const VIDEOS = [
    {
      id: 'solar', title: 'A Tour of the Solar System 🪐', channel: 'cosmo', dur: 64, cat: 'Space', views: 48210, days: 12,
      desc: 'Fly past all eight planets, from tiny hot Mercury to cold windy Neptune — and find out what makes each one special.',
      caps: [[0, 'This is our Solar System! ☀️'], [5, 'The Sun is a star — a giant ball of glowing gas.'], [11, 'Mercury is the closest planet and the smallest.'], [17, 'Venus is the hottest planet. Its clouds trap the heat!'], [23, 'Earth — our home! The only planet we know with life. 🌍'], [29, 'Mars is the Red Planet. It is covered in rusty dust.'], [35, 'Jupiter is the BIGGEST planet. 1,300 Earths could fit inside!'], [41, 'Saturn has beautiful rings made of ice and rock.'], [47, 'Uranus spins on its side, like a rolling ball.'], [53, 'Neptune is the windiest planet. Brrr, it is freezing!'], [59, 'Eight planets, all going round the Sun. ✨']],
      draw(c, t) {
        sky(c, '#05031a', '#140b33'); stars(c, 160, 3, 1.3, t);
        const P = [['Mercury', 0.38, '#b0a090', 7], ['Venus', 0.95, '#e8c070', 11], ['Earth', 1, '#4a9df0', 12], ['Mars', 0.53, '#d8603a', 9], ['Jupiter', 11, '#d8a878', 26], ['Saturn', 9, '#e8d090', 22], ['Uranus', 4, '#8fe0e8', 16], ['Neptune', 3.9, '#4a6af0', 16]];
        const focus = Math.floor((t - 11) / 6);
        const cx = 160, cy = VH / 2;
        // glow of the sun
        const g = c.createRadialGradient(cx, cy, 10, cx, cy, 120); g.addColorStop(0, '#fff4b0'); g.addColorStop(0.4, '#ffb020'); g.addColorStop(1, 'rgba(255,120,0,0)');
        c.fillStyle = g; c.fillRect(0, 0, 400, VH);
        circ(c, cx, cy, 52 + Math.sin(t * 2) * 2, '#ffcc33');
        P.forEach((p, i) => {
          const r = 110 + i * 82, sp = 1 / Math.sqrt(i + 1);
          c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 1.5;
          c.beginPath(); c.ellipse(cx, cy, r, r * 0.32, 0, 0, Math.PI * 2); c.stroke();
          const a = t * sp * 0.6 + i * 1.7;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.32;
          const big = i === focus ? 1.9 + Math.sin(t * 4) * 0.08 : 1;
          if (i === 5) { c.strokeStyle = '#f0e0b0'; c.lineWidth = 3; c.beginPath(); c.ellipse(x, y, p[3] * big * 1.9, p[3] * big * 0.6, -0.3, 0, Math.PI * 2); c.stroke(); }
          circ(c, x, y, p[3] * big, p[2]);
          if (i === focus) { c.font = '600 22px Fredoka'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(p[0], x, y - p[3] * big - 14); }
        });
        if (t < 5) bigText(c, 'The Solar System', VW / 2 + 80, 80, 54 * ease(seg(t, 0, 1.2)) + 1, '#fff', '#2a1a60');
      }
    },
    {
      id: 'rocket', title: '3, 2, 1… BLAST OFF! 🚀', channel: 'cosmo', dur: 30, cat: 'Space', views: 91432, days: 30,
      desc: 'Count down with us and watch a rocket launch all the way to space!',
      caps: [[0, 'Get ready… the rocket is on the launch pad!'], [3, 'Let\'s count down together!'], [13, 'BLAST OFF! 🔥'], [19, 'Up, up and away, through the clouds…'], [24, 'We made it to SPACE! 🌌']],
      draw(c, t) {
        const up = t < 13 ? 0 : Math.pow(t - 13, 2) * 22;
        const space = clamp((up - 400) / 2400, 0, 1);
        sky(c, mixc('#7cc8ff', '#05031a', space), mixc('#d6efff', '#1a0d3a', space));

    $('#st-go').onclick = async () => {
      if (!file || !db) { if (!db) toast('Saving videos isn\'t available in this browser'); return; }
      $('#st-go').disabled = true; $('#st-go').textContent = 'Uploading…';
      const v = { id: 'my-' + Date.now().toString(36), title: $('#st-ut').value.trim() || 'My video', desc: $('#st-ud').value.trim(), dur: info.dur, thumb: info.thumb, created: Date.now(), blob: file };
      state.myChannel = $('#st-uc').value.trim() || 'My Channel'; save();
      try { await idb('readwrite', st => st.put(v)); }
      catch (e) { toast('Not enough space to save it'); $('#st-go').disabled = false; $('#st-go').textContent = 'Upload'; return; }
      await loadUploads(); renderSide();
      track('video_uploaded', {});
      toast('🎉 Uploaded!');
      location.hash = '#/watch/' + v.id;
    };
  }
  // Read a video's length and grab a frame for its thumbnail
  function probe(f) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(f), v = document.createElement('video');
      v.muted = true; v.preload = 'auto'; v.playsInline = true; v.src = url;
      const fail = () => { URL.revokeObjectURL(url); rej(); };
      const timer = setTimeout(fail, 15000);
      v.onerror = () => { clearTimeout(timer); fail(); };
      v.onloadedmetadata = () => {
        let d = v.duration;
        // some recordings (like browser-made webm) don't know their length until you seek far
        if (!isFinite(d)) { v.currentTime = 1e7; v.ontimeupdate = () => { v.ontimeupdate = null; d = v.duration; v.currentTime = Math.min(1, d / 3); }; }
        else v.currentTime = Math.min(1, d / 3);
        v.onseeked = () => {
          if (!isFinite(d)) return;
          clearTimeout(timer);
          const cv = document.createElement('canvas'); cv.width = 480; cv.height = 270;
          const c = cv.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, 480, 270);
          const s = Math.min(480 / (v.videoWidth || 480), 270 / (v.videoHeight || 270));
          const w = (v.videoWidth || 480) * s, h = (v.videoHeight || 270) * s;
          try { c.drawImage(v, (480 - w) / 2, (270 - h) / 2, w, h); } catch (e) {}
          URL.revokeObjectURL(url);
          res({ dur: d, thumb: cv.toDataURL('image/jpeg', 0.8) });
        };
      };
    });
  }

  /* ================================================================ watch */
  // One player for both kinds of video: a <video> for uploads, a canvas
  // driven by our own clock for the built-in ones. Same controls for both.
  let player = null;
  function stopPlayer() { if (player) { player.destroy(); player = null; } }

  async function viewWatch(id) {
    const v = byId(id);
    if (!v) { main.innerHTML = '<div class="st-empty"><b>🛸</b>That video has floated off into space.</div>'; return; }
    state.history = [id].concat(state.history.filter(x => x !== id)).slice(0, 60);
    state.views[id] = (state.views[id] || 0) + 1; save();
    track('video_watched', { video: v.mine ? 'upload' : v.id });
    const ch = chanOf(v), chKey = v.mine ? 'me' : v.channel;
    const next = all().filter(x => x.id !== id).sort((a, b) => (b.channel === v.channel) - (a.channel === v.channel) || hash(a.id.length, b.title.length) - 0.5);
    main.innerHTML = `<div class="st-watch"><div>
      <div id="st-player"></div>
      <h1 class="st-h">${esc(v.title)}</h1>
      <div class="st-chan"><a href="#/channel/${chKey}" class="st-av" style="background:${ch.col}">${ch.av}</a>
        <div><a href="#/channel/${chKey}"><b>${esc(ch.name)}</b></a><div class="st-sub">${nice(viewsOf(v))} views · ${whenOf(v)}</div></div>
        ${v.mine ? '' : `<button class="st-btn ${state.subs.includes(chKey) ? '' : 'white'}" id="st-sub">${state.subs.includes(chKey) ? '🔔 Subscribed' : 'Subscribe'}</button>`}
        <div class="st-actions">
          <button class="st-btn" id="st-like"></button><button class="st-btn" id="st-dis"></button>
          <button class="st-btn" id="st-save">＋ Save</button>
          ${v.mine ? '<button class="st-btn" id="st-delv">🗑️ Delete</button>' : ''}
        </div></div>
      <div class="st-desc"><b>About this video</b>${esc(v.desc || 'No description.')}</div>
      <div class="st-comments" id="st-comments"></div>
    </div>
    <div class="st-next"><h2 class="st-sec" style="font-size:17px">Up next</h2>${next.slice(0, 10).map(x => `<a class="st-mini" href="#/watch/${encodeURIComponent(x.id)}"><div class="st-thumb"><img src="${thumbOf(x)}" alt="" loading="lazy"><span class="st-dur">${fmt(x.dur)}</span></div><div><div class="st-title">${esc(x.title)}</div><div class="st-sub">${esc(chanOf(x).name)}<br>${nice(viewsOf(x))} views</div></div></a>`).join('')}</div></div>`;

    // ---- likes
    const paintLikes = () => {
      const s = state.likes[id] || 0, base = v.mine ? 0 : Math.round(v.views / 23);
      $('#st-like').innerHTML = '👍 ' + nice(base + (s === 1 ? 1 : 0)); $('#st-like').classList.toggle('on', s === 1);
      $('#st-dis').innerHTML = '👎'; $('#st-dis').classList.toggle('on', s === -1);
    };
    paintLikes();
    $('#st-like').onclick = () => { state.likes[id] = state.likes[id] === 1 ? 0 : 1; save(); paintLikes(); };
    $('#st-dis').onclick = () => { state.likes[id] = state.likes[id] === -1 ? 0 : -1; save(); paintLikes(); };
    const sb = $('#st-sub'); if (sb) sb.onclick = () => { toggleSub(chKey); sb.className = 'st-btn ' + (state.subs.includes(chKey) ? '' : 'white'); sb.textContent = state.subs.includes(chKey) ? '🔔 Subscribed' : 'Subscribe'; };
    $('#st-save').onclick = (e) => { e.stopPropagation(); saveMenu(id); };
    const dv = $('#st-delv');
    if (dv) dv.onclick = async () => {
      if (!confirm('Delete this video for good?')) return;
      stopPlayer(); await idb('readwrite', st => st.delete(id)); await loadUploads();
      delete state.comments[id]; state.history = state.history.filter(x => x !== id); state.later = state.later.filter(x => x !== id); save();
      toast('Video deleted'); renderSide(); location.hash = '#/channel/me';
    };
    renderComments(id);

    // ---- the player
    let src = null;
    if (v.mine) {
      try { const rec = await idb('readonly', st => st.get(id)); src = rec && rec.blob; } catch (e) {}
      if (!src) { $('#st-player').innerHTML = '<div class="st-empty">This video couldn\'t be loaded.</div>'; return; }
    }
    if (location.hash !== '#/watch/' + encodeURIComponent(id)) return;   // moved on while loading
    player = makePlayer($('#st-player'), v, src, next[0]);
  }

  function saveMenu(id) {
    const old = $('.st-menu'); if (old) { old.remove(); return; }
    const m = document.createElement('div'); m.className = 'st-menu';
    const opts = [['⏰ Watch later', state.later.includes(id), () => { const i = state.later.indexOf(id); i >= 0 ? state.later.splice(i, 1) : state.later.unshift(id); }]]
      .concat(Object.keys(state.lists).map(n => ['📃 ' + n, state.lists[n].includes(id), () => { const L = state.lists[n], i = L.indexOf(id); i >= 0 ? L.splice(i, 1) : L.push(id); }]));
    m.innerHTML = opts.map((o, i) => `<label><input type="checkbox" data-i="${i}" ${o[1] ? 'checked' : ''}> ${esc(o[0])}</label>`).join('') +
      '<input type="text" id="st-newl" maxlength="40" placeholder="＋ New playlist name, then Enter">';
    m.onclick = (e) => e.stopPropagation();
    m.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { opts[+cb.dataset.i][2](); save(); renderSide(); toast(cb.checked ? 'Saved' : 'Removed'); });
    $('.st-actions').appendChild(m);
    $('#st-newl').onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      const n = e.target.value.trim(); if (!n) return;
      state.lists[n] = state.lists[n] || []; if (!state.lists[n].includes(id)) state.lists[n].push(id);
      save(); renderSide(); m.remove(); toast('Added to ' + n);
    };
    setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }), 0);
  }

  function renderComments(id) {
    const list = state.comments[id] || [];
    const el = $('#st-comments');
    el.innerHTML = `<h3>${list.length} comment${list.length === 1 ? '' : 's'}</h3>
      <form class="st-cform"><div class="st-av" style="background:#ff3d6e">⭐</div><input id="st-cin" maxlength="300" placeholder="Add a comment… (only you can see it)"><button class="st-btn red">Comment</button></form>` +
      list.slice().reverse().map((c, i) => `<div class="st-c"><div class="st-av" style="background:#6d5dfc">⭐</div><div><b>${esc(c.by)}</b><small>${ago(c.at)}</small><p>${esc(c.text)}</p>
        <button class="st-note" data-rm="${list.length - 1 - i}" style="margin-top:4px">Delete</button></div></div>`).join('') +
      '<p class="st-note">💬 Comments are kept on this device only.</p>';
    el.querySelector('form').onsubmit = (e) => {
      e.preventDefault(); const t = $('#st-cin').value.trim(); if (!t) return;
      (state.comments[id] = state.comments[id] || []).push({ by: state.name, text: t, at: Date.now() }); save(); renderComments(id);
    };
    el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { state.comments[id].splice(+b.dataset.rm, 1); save(); renderComments(id); });
  }

  /* --------------------------------------------------------- the player */
  const IC = {
    play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
    pause: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7" fill="currentColor" stroke="none" text-anchor="middle" font-family="sans-serif">10</text></svg>',
    fwd: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7" fill="currentColor" stroke="none" text-anchor="middle" font-family="sans-serif">10</text></svg>',
    full: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    vol: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    mute: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6"/></svg>'
  };
  function makePlayer(box, v, blob, nextV) {
    const isVid = !!blob;
    let url = null, el, cx = null;
    if (isVid) { url = URL.createObjectURL(blob); el = document.createElement('video'); el.src = url; el.playsInline = true; }
    else { el = document.createElement('canvas'); el.width = VW; el.height = VH; cx = el.getContext('2d'); }
    box.innerHTML = '';
    box.appendChild(el);
    box.insertAdjacentHTML('beforeend', `<div class="st-cap st-hide"></div><div class="st-big"><i></i></div>
      <div class="st-ctrl"><div class="st-bar"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
      <div class="st-row"><button class="st-cb" data-a="play"></button><button class="st-cb" data-a="back" title="Back 10s">${IC.back}</button><button class="st-cb" data-a="fwd" title="Forward 10s">${IC.fwd}</button>
      ${isVid ? `<button class="st-cb" data-a="mute">${IC.vol}</button><input class="st-vol" type="range" min="0" max="1" step="0.05" value="1">` : ''}
      <span class="st-time"></span><span style="flex:1"></span>
      ${isVid ? '' : '<button class="st-cb" data-a="cc" title="Captions" style="font-weight:700;font-size:14px">CC</button>'}
      <button class="st-cb" data-a="full" title="Full screen">${IC.full}</button></div></div>`);
    const capEl = $('.st-cap', box), bigI = $('.st-big i', box), fill = $('.fill', box), knob = $('.knob', box), timeEl = $('.st-time', box), bar = $('.st-bar', box), pb = $('[data-a=play]', box);
    // our own clock for drawn videos
    let t = 0, playing = false, last = 0, ended = false, raf = 0, dead = false, endTimer = 0;
    const dur = () => isVid ? (isFinite(el.duration) ? el.duration : v.dur) : v.dur;
    const cur = () => isVid ? el.currentTime : t;
    const isPlaying = () => isVid ? !el.paused && !el.ended : playing;
    function play() {
      if (ended) { seek(0); }
      $('.st-end', box) && $('.st-end', box).remove(); clearInterval(endTimer);
      if (isVid) el.play().catch(() => {}); else { playing = true; last = performance.now(); }
      flash('play'); paint();
    }
    function pause() { if (isVid) el.pause(); else playing = false; flash('pause'); paint(); }
    function seek(s) { s = clamp(s, 0, dur()); ended = false; if (isVid) el.currentTime = s; else t = s; paint(true); }
    function flash(k) { bigI.innerHTML = IC[k]; bigI.classList.add('show'); setTimeout(() => bigI.classList.remove('show'), 350); }
    function paint(force) {
      const d = dur() || 1, c = cur();
      const p = clamp(c / d, 0, 1);
      fill.style.width = p * 100 + '%'; knob.style.left = p * 100 + '%';
      timeEl.textContent = fmt(c) + ' / ' + fmt(d);
      pb.innerHTML = isPlaying() ? IC.pause : IC.play;
      if (!isVid) {
        try { cx.save(); v.draw(cx, Math.min(t, d - 0.001)); cx.restore(); } catch (e) {}
        const cc = $('[data-a=cc]', box); if (cc) cc.classList.toggle('on', state.cc);
        let cap = ''; for (const [s, txt] of v.caps || []) if (t >= s) cap = txt;
        capEl.textContent = cap; capEl.classList.toggle('st-hide', !state.cc || !cap);
      }
    }
    function loop(now) {
      if (dead) return;
      if (!isVid && playing) {
        t += (now - last) / 1000; last = now;
        if (t >= v.dur) { t = v.dur; playing = false; onEnd(); }
      }
      if (!isVid || isPlaying()) paint();
      raf = requestAnimationFrame(loop);
    }
    function onEnd() {
      ended = true; paint();
      if (!nextV) return;
      let n = 6;
      const end = document.createElement('div'); end.className = 'st-end';
      end.innerHTML = `<div class="st-note">Up next in <b id="st-cd">${n}</b></div><img src="${thumbOf(nextV)}" alt=""><b>${esc(nextV.title)}</b><div><button class="st-btn" data-x="cancel">Cancel</button><button class="st-btn red" data-x="go">Play now</button></div>`;
      box.appendChild(end);
      const go = () => { clearInterval(endTimer); location.hash = '#/watch/' + encodeURIComponent(nextV.id); };
      end.querySelector('[data-x=go]').onclick = (e) => { e.stopPropagation(); go(); };
      end.querySelector('[data-x=cancel]').onclick = (e) => { e.stopPropagation(); clearInterval(endTimer); end.remove(); };
      endTimer = setInterval(() => { n--; const c = $('#st-cd'); if (c) c.textContent = n; if (n <= 0) go(); }, 1000);
    }
    if (isVid) { el.onended = onEnd; el.onloadedmetadata = () => paint(); el.onplay = el.onpause = () => paint(); }
    // controls
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b) { if (!e.target.closest('.st-ctrl') && !e.target.closest('.st-end')) isPlaying() ? pause() : play(); return; }
      const a = b.dataset.a;
      if (a === 'play') isPlaying() ? pause() : play();
      else if (a === 'back') seek(cur() - 10);
      else if (a === 'fwd') seek(cur() + 10);
      else if (a === 'cc') { state.cc = !state.cc; save(); paint(); }
      else if (a === 'mute') { el.muted = !el.muted; b.innerHTML = el.muted ? IC.mute : IC.vol; }
      else if (a === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else if (box.requestFullscreen) box.requestFullscreen().catch(() => {}); }
    });
    const vol = $('.st-vol', box); if (vol) vol.oninput = () => { el.volume = +vol.value; el.muted = el.volume === 0; };
    let dragging = false;
    const at = (e) => { const r = bar.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width, 0, 1) * dur()); };
    bar.addEventListener('pointerdown', (e) => { dragging = true; bar.setPointerCapture(e.pointerId); at(e); });
    bar.addEventListener('pointermove', (e) => { if (dragging) at(e); });
    bar.addEventListener('pointerup', () => { dragging = false; });
    // hide the controls when the mouse rests
    let idleT = 0;
    const wake = () => { box.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (isPlaying()) box.classList.add('idle'); }, 2500); };
    box.addEventListener('pointermove', wake); box.addEventListener('pointerdown', wake);
    const keys = (e) => {
      if (/INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); isPlaying() ? pause() : play(); }
      else if (e.key === 'ArrowRight' || e.key === 'l') seek(cur() + 5);
      else if (e.key === 'ArrowLeft' || e.key === 'j') seek(cur() - 5);
      else if (e.key === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen && box.requestFullscreen().catch(() => {}); }
      else if (e.key === 'c' && !isVid) { state.cc = !state.cc; save(); paint(); }
      else return;
      wake();
    };
    document.addEventListener('keydown', keys);
    paint(); raf = requestAnimationFrame(loop);
    play();
    return {
      destroy() {
        dead = true; cancelAnimationFrame(raf); clearInterval(endTimer); clearTimeout(idleT);
        document.removeEventListener('keydown', keys);
        if (isVid) { el.pause(); el.removeAttribute('src'); el.load(); URL.revokeObjectURL(url); }
      }
    };
  }

  /* ============================================================ side menu */
  function renderSide() {
    const h = location.hash || '#/';
    const nav = (href, icon, label) => `<a class="st-nav${h === href ? ' on' : ''}" href="${href}">${icon}<span>${esc(label)}</span></a>`;
    let s = nav('#/', '🏠', 'Home') + nav('#/subs', '🔔', 'Subscriptions') + nav('#/library', '📚', 'Library') + nav('#/channel/me', '⭐', 'My videos') + nav('#/upload', '⬆️', 'Upload');
    if (state.subs.length) { s += '<div class="st-sep"></div><div class="st-sidehead">Subscribed</div>'; for (const k of state.subs) if (CHANNELS[k]) s += nav('#/channel/' + k, CHANNELS[k].av, CHANNELS[k].name); }
    s += '<div class="st-sep"></div><div class="st-sidehead">Channels</div>';
    for (const k in CHANNELS) if (!state.subs.includes(k)) s += nav('#/channel/' + k, CHANNELS[k].av, CHANNELS[k].name);
    const lists = Object.keys(state.lists);
    if (lists.length) { s += '<div class="st-sep"></div><div class="st-sidehead">Playlists</div>'; for (const n of lists) s += nav('#/library', '📃', n); }
    s += '<div class="st-sep"></div><div class="st-note" style="padding:6px 12px;line-height:1.5">🔒 Uploads, likes and comments stay on this device.</div>';
    $('#st-side').innerHTML = s;
  }
  $('#st-menu').onclick = () => $('#st-side').classList.toggle('open');
  $('#st-side').addEventListener('click', (e) => { if (e.target.closest('a')) $('#st-side').classList.remove('open'); });
  $('#st-search').onsubmit = (e) => { e.preventDefault(); const q = $('#st-q').value.trim(); if (q) location.hash = '#/search/' + encodeURIComponent(q); };

  /* =============================================================== router */
  function route() {
    stopPlayer();
    const parts = (location.hash || '#/').slice(2).split('/').map(decodeURIComponent);
    window.scrollTo(0, 0);
    renderSide();
    const [page, arg] = parts;
    if (page === 'watch') viewWatch(arg);
    else if (page === 'channel') viewChannel(arg);
    else if (page === 'search') { $('#st-q').value = arg || ''; viewSearch(arg || ''); }
    else if (page === 'subs') viewSubs();
    else if (page === 'library') viewLibrary();
    else if (page === 'upload') viewUpload();
    else viewHome();
  }
  window.addEventListener('hashchange', route);

  (async () => {
    db = await openDB();
    try { await loadUploads(); } catch (e) {}
    // wait for the font, so text drawn into the thumbnails isn't in a fallback face
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
    route();
  })();
})();
</script>
</body>
</html>
